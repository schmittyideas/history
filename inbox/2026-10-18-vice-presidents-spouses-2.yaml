# Vice presidents' spouses, batch 2 of 2: the spouses of the vice presidents who took office 1877-2025 (Wheeler to
# Vance), and the Second Lady title for the wives already here whose husbands were vice president before president
# (Edith Roosevelt, Grace Coolidge, Bess Truman, Pat Nixon, Lady Bird Johnson, Betty Ford, Barbara Bush, Jill Biden).
# Same conventions and checks as batch 1 (inbox/2026-10-18-vice-presidents-spouses-1.yaml): every wife, type
# Notable, title "Second Lady of the United States" cut to the marriage and her life; Wikidata checked against
# English Wikipedia (2026-10-18); every difference recorded as a discrepancy, the records using Wikipedia.
# Stated honestly:
#  - Kamala Harris's spouse is her husband, Doug Emhoff: added the same way, with the title "Second Gentleman of the
#    United States" (his article: "the first second gentleman").
#  - Muriel Humphrey is typed Government, not Notable: she was appointed to her husband's Senate seat in 1978 (as
#    Hillary Clinton was typed Government among the First Ladies).
#  - Wives with no Wikipedia article of their own cite their husband's article: Mary King (Wheeler; born 1828,
#    Wikidata 1830: a discrepancy), Lucy Young Kimball (Morton's first wife; married 15 October 1856, died 1871),
#    Annie Elizabeth Baird (Curtis; 1860-1924) and Dorothy Brower (Barkley's first wife; 1882-1947).
#  - Discrepancies with Wikidata: Cornelia Fairbanks died 24 October 1913 (Wikidata 25), Caro Dawes born 1865
#    (Wikidata 1866), Ilo Wallace born 1889 (Wikidata 1888).
#  - Jane Hadley Barkley married Barkley while he was vice president (18 November 1949); her title starts that day.
#    Mary Rockefeller (divorced 1962) and the four wives who died first were never Second Lady.
batch:
  title: "Vice presidents' spouses, batch 2"
  requested: "And then vice presidents and their wives"
  date: 2026-10-18

