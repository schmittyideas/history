titles:
  # Dai Co Viet and Dai Viet: Ly dynasty
  - {person: ly-thai-to, title: Emperor of Đại Cồ Việt, realm: Đại Cồ Việt, from: 1009-11-21, to: 1028-03-31, note: "Proclaimed emperor two days after Lê Long Đĩnh died on 19 November 1009; reign 1009-1028 (18 years). Died 31 March 1028", sources: [wp-ly-thai-to]}
  - {person: ly-thai-tong, title: Emperor of Đại Cồ Việt, realm: Đại Cồ Việt, from: 1028, to: 1054-11-03, note: "Ascended in 1028 (April 1028 in the Thánh Tông article; no day); reign 1028-1054. The realm name follows the Thánh Tông article, which says the name changed to Đại Việt on Thánh Tông's succession; his own article says 'ruled Đại Việt'. He handed the governing to his son a few months before he died on 3 November 1054", sources: [wp-ly-thai-tong, wp-ly-thanh-tong]}
  - {person: ly-thanh-tong, title: Emperor of Đại Việt, realm: Đại Việt, from: 1054-11-03, to: 1072-02-01, note: "Succeeded on 3 November 1054 and shortened the kingdom's name to Đại Việt. Died 1 February 1072 in the lead, 'January 1072' in the death section (see discrepancy)", sources: [wp-ly-thanh-tong]}
  - {person: ly-nhan-tong, title: Emperor of Đại Việt, realm: Đại Việt, from: 1072, to: 1128-01-15, note: "Succeeded in the first lunar month of 1072 at seven. Died 15 January 1128 (lead), or December 1127 (family section; see discrepancy)", sources: [wp-ly-nhan-tong]}
  - {person: ly-hue-tong, title: Emperor of Đại Việt, realm: Đại Việt, from: 1211, to: 1224, note: "Reign 1211-1224 per the lead; ceded the throne to his daughter in October of the lunar year 1224 and became a monk", sources: [wp-ly-hue-tong, wp-ly-chieu-hoang]}
  - {person: ly-chieu-hoang, title: Emperor of Đại Việt, realm: Đại Việt, from: 1224, to: 1225-12-31, note: "Ruled 1224-1225 as empress regnant. Ceded the throne to her husband Trần Cảnh; the Trần dynasty began on 31 December 1225", sources: [wp-ly-chieu-hoang]}
  # Tran dynasty
  - {person: tran-thai-tong, title: Emperor of Đại Việt, realm: Đại Việt, from: 1226, to: 1258-03-30, note: "Reign 1226-1258 in the lead (33 years); the Chiêu Hoàng article dates the Trần dynasty from 31 December 1225 (see discrepancy). Ceded the throne on the 24th day of the second lunar month (30 March) 1258 and became retired emperor, to 1277", sources: [wp-tran-thai-tong, wp-tran-thanh-tong]}
  - {person: tran-thanh-tong, title: Emperor of Đại Việt, realm: Đại Việt, from: 1258-03-30, to: 1278-11-08, note: "Enthroned on the 24th day of the second lunar month (30 March) 1258; ceded the throne on the 22nd day of the tenth lunar month (8 November) 1278 and was retired emperor (Thái Thượng Hoàng) 1279-1290, co-ruling with Nhân Tông", sources: [wp-tran-thanh-tong]}
  - {person: tran-nhan-tong, title: Emperor of Đại Việt, realm: Đại Việt, from: 1278-11-08, to: 1293-03-03, note: "Enthroned on 8 November 1278; passed the throne to Anh Tông on 3 March 1293 and was Emperor Emeritus until his death (1294 in the lead; see discrepancy)", sources: [wp-tran-nhan-tong]}
  - {person: tran-anh-tong, title: Emperor of Đại Việt, realm: Đại Việt, from: 1293-03-03, to: 1314, note: "Ceded the throne by his father on 3 March 1293 (the Nhân Tông article's date; the Anh Tông article says 1293) and ruled 1293-1314; then retired emperor to 1320", sources: [wp-tran-anh-tong, wp-tran-nhan-tong]}
  # Ho dynasty
  - {person: ho-quy-ly, title: Emperor of Đại Ngu, realm: Đại Ngu, from: 1400, to: 1401, note: "Founding emperor of the Hồ dynasty, 1400-1401; abdicated to his son Hồ Hán Thương and styled himself Emperor Emeritus. The Lê Lợi article dates the deposition of the Trần 1399", sources: [wp-ho-quy-ly]}
  # Later Le
  - {person: le-loi, title: Emperor of Đại Việt, realm: Đại Việt, from: 1428-04-15, to: 1433-10-05, note: "Took the throne on 15 April 1428 in his own article (29 April in the Lam Sơn article); died 5 October 1433", sources: [wp-le-loi, wp-lam-son-uprising]}
  - {person: le-thai-tong, title: Emperor of Đại Việt, realm: Đại Việt, from: 1433, to: 1442-08-28, note: "Second Later Lê emperor from 1433 (lead), at about ten under the regent Lê Sát; the article says he officially took the throne in 1438. Died 28 August 1442 in the lead (see discrepancy)", sources: [wp-le-thai-tong]}
  - {person: le-thanh-tong, title: Emperor of Đại Việt, realm: Đại Việt, from: 1460, to: 1497-03-03, note: "Proclaimed emperor two days after the counter-coup that killed Lê Nghi Dân in 1460 (nine months after Nghi Dân's coup of 1459); reigned 1460-1497", sources: [wp-le-thanh-tong]}
  # Mac
  - {person: mac-dang-dung, title: Emperor of Đại Việt, realm: Đại Việt, from: 1527, to: 1529, note: "Proclaimed the Mạc dynasty in 1527 and abdicated in 1529 to his son Mạc Đăng Doanh; he resumed power on Doanh's death but the article gives no year, so no second row", sources: [wp-mac-dang-dung]}
  # Khmer
  - {person: suryavarman-i, title: King of the Khmer, realm: Khmer Empire, from: 1002, from_estimated: true, to: 1050, note: "King from about 1002 (usurping Udayadityavarman I) to 1050; the article also says he claimed the throne in 1010 after a nine-year war and that the epigraphic summary places his death in 1049 (see discrepancies)", sources: [wp-suryavarman-i]}
  - {person: suryavarman-ii, title: King of the Khmer, realm: Khmer Empire, from: 1113, to: 1150, note: "Enthroned in 1113; formal coronation in 1119; ruled to his death in 1150", sources: [wp-suryavarman-ii]}
  - {person: jayavarman-vii, title: King of the Khmer, realm: Khmer Empire, from: 1181, to: 1218, to_estimated: true, note: "Crowned in 1181; the article says he died 'around 1218' and speaks of a 37-year reign", sources: [wp-jayavarman-vii]}
  # Pagan
  - {person: anawrahta, title: King of Pagan, realm: Pagan Kingdom, from: 1044-12-16, to: 1077-04-11, note: "Ascended on 16 December 1044 after killing King Sokkate on 11 August 1044; died 11 April 1077", sources: [wp-anawrahta]}

discrepancies:
  - key: ly-thai-to-birthplace
    question: Where was Lý Công Uẩn (Lý Thái Tổ) born?
    about: [{person: ly-thai-to}]
    field: place
    claims:
      - {value: "Cổ Pháp district, Đình Bảng village, Từ Sơn, Bắc Ninh (the standard account; the Vietnamese chronicles were written centuries after his death)", sources: [wp-ly-thai-to]}
      - {value: "Jiaozhou (the Trần-era historian Lê Tắc in the An Nam chí lược); the article adds that someone claimed Fujian, which Lê Tắc calls incorrect", sources: [wp-ly-thai-to]}
    note: "The record leaves the birthplace out of the place records; the note gives Cổ Pháp as the commonly given birthplace."
  - key: ly-thai-to-succession-1009
    question: Was Lý Công Uẩn's enthronement in 1009 peaceful?
    about: [{person: ly-thai-to}]
    field: date
    claims:
      - {value: "Peaceful: the court proclaimed him on 21 November 1009, two days after Lê Long Đĩnh died, 'without civil war' (basic annals); Ngô Thì Sĩ found no solid evidence for the rumour that he poisoned Long Đĩnh", sources: [wp-ly-thai-to]}
      - {value: "Not peaceful: according to the An Nam chí lược, Long Đĩnh's brothers Lê Minh Đề and Lê Minh Xưởng launched a campaign for the throne in 1009 and were killed by Công Uẩn", sources: [wp-ly-thai-to]}
    note: "The record follows the annals (accession 21 November 1009)."
  - key: ly-thai-tong-state-name
    question: Was the state called Đại Cồ Việt or Đại Việt during Lý Thái Tông's reign (1028-1054)?
    about: [{person: ly-thai-tong}, {person: ly-thanh-tong}]
    field: realm
    claims:
      - {value: "Đại Việt: he 'ruled Đại Việt from 1028 to 1054' (his lead)", sources: [wp-ly-thai-tong]}
      - {value: "Đại Cồ Việt until 3 November 1054: Thánh Tông 'shortened the kingdom's name from Đại Cồ Việt to Đại Việt' on his succession; the Thái Tổ article speaks of Đại Cồ Việt under Thái Tổ", sources: [wp-ly-thanh-tong, wp-ly-thai-to]}
    note: "Titles for Thái Tổ and Thái Tông use realm Đại Cồ Việt, the specific statement of the rename; later Lý emperors use Đại Việt."
  - key: ly-thanh-tong-born
    question: On what date was Lý Thánh Tông born?
    about: [{person: ly-thanh-tong}]
    field: born
    claims:
      - {value: "19 March 1023", sources: [wp-ly-thanh-tong]}
      - {value: "30 March 1023, at Long Đức palace (the early-life section of the same article)", sources: [wp-ly-thanh-tong]}
    note: "The record uses the lead's 19 March 1023."
  - key: ly-thanh-tong-died
    question: When did Lý Thánh Tông die?
    about: [{person: ly-thanh-tong}, {person: ly-nhan-tong}]
    field: died
    claims:
      - {value: "1 February 1072", sources: [wp-ly-thanh-tong]}
      - {value: "January 1072 ('In January 1072 he suddenly died at the age of 49'); the Nhân Tông article says the throne passed 'in the first month of the lunar calendar in 1072'", sources: [wp-ly-thanh-tong, wp-ly-nhan-tong]}
    note: "A lunar month that may straddle the Gregorian change. The record uses 1 February 1072."
  - key: ly-nhan-tong-born
    question: On what date was Lý Nhân Tông (Lý Càn Đức) born?
    about: [{person: ly-nhan-tong}, {person: ly-thanh-tong}]
    field: born
    claims:
      - {value: "22 February 1066 (his lead; 'the first month of the lunar calendar in 1066' in the early-life section)", sources: [wp-ly-nhan-tong]}
      - {value: "25 January 1066 ('On 25th January 1066, prince Lý Càn Đức was born'; made crown prince a day later)", sources: [wp-ly-thanh-tong]}
    note: "The record uses 22 February 1066 from his own article."
  - key: ly-nhan-tong-died
    question: When did Lý Nhân Tông die?
    about: [{person: ly-nhan-tong}]
    field: died
    claims:
      - {value: "15 January 1128", sources: [wp-ly-nhan-tong]}
      - {value: "December 1127 ('In December 1127 after a 56-year reign, Lý Nhân Tông died at Vĩnh Quang Palace at the age of 61')", sources: [wp-ly-nhan-tong]}
    note: "Probably a lunar December that falls in January 1128. The record uses 15 January 1128. The article also counts his reign as 56 and 55 years."
  - key: ly-song-war-span
    question: Over what years did the Lý-Song war run?
    about: [{event: ly-song-war-1075}]
    field: date
    claims:
      - {value: "1075-1076 ('Sino-Vietnamese War (1075-1076)')", sources: [wp-ly-nhan-tong]}
      - {value: "The Song invasion began in the twelfth month of 1076 and was followed by a cease-fire, so the war ran past 1076 (probably into early 1077)", sources: [wp-ly-nhan-tong]}
    note: "The brief gives 1075-1077; the article gives no Gregorian end date. The event is entered as 1075-1076."
  - key: ly-cao-tong-born
    question: When was Lý Cao Tông born?
    about: [{person: ly-cao-tong}]
    field: born
    claims:
      - {value: "6 July 1173", sources: [wp-ly-cao-tong]}
      - {value: "25 May 1173 'according to the Eastern calendar', at Thăng Long palace", sources: [wp-ly-cao-tong]}
    note: "The record uses the lead's 6 July 1173."
  - key: ly-cao-tong-died
    question: When did Lý Cao Tông die?
    about: [{person: ly-cao-tong}]
    field: died
    claims:
      - {value: "15 November 1210", sources: [wp-ly-cao-tong]}
      - {value: "28 October 1210, at Thánh Thọ palace, aged 38", sources: [wp-ly-cao-tong]}
    note: "The record uses the lead's 15 November 1210."
  - key: ly-hue-tong-died
    question: When did Lý Huệ Tông die?
    about: [{person: ly-hue-tong}]
    field: died
    claims:
      - {value: "3 September 1226", sources: [wp-ly-hue-tong]}
      - {value: "He was made to commit suicide on 8 October of the lunar calendar 1226", sources: [wp-ly-chieu-hoang]}
    note: "A lunar date and a Gregorian one that may not match. The record uses 3 September 1226."
  - key: ly-chieu-hoang-age-at-accession
    question: How old was Lý Chiêu Hoàng when she became empress in 1224?
    about: [{person: ly-chieu-hoang}, {person: ly-hue-tong}]
    field: born
    claims:
      - {value: "Six ('succeeding to the throne at the age of only six'; born September 1218)", sources: [wp-ly-chieu-hoang]}
      - {value: "Seven ('his seven-year-old daughter')", sources: [wp-ly-hue-tong]}
    note: "The record gives her birth as 1218 (her own article); the age is a matter of counting."
  - key: tran-dynasty-founding-year
    question: When did the Trần dynasty begin?
    about: [{event: tran-dynasty-founded-1225}, {person: tran-thai-tong}, {person: ly-chieu-hoang}]
    field: date
    claims:
      - {value: "31 December 1225 (the first day of the twelfth lunar month, 1225; Thái Tông's era name Kiến Trung is dated from 1225); the Hưng Đạo article says the Trần replaced the Lý in 1225", sources: [wp-ly-chieu-hoang, wp-tran-thai-tong, wp-tran-hung-dao]}
      - {value: "1226: Thái Tông 'reigning over Đại Việt for 33 years (1226-58)'; the Trần Thái Tông article says Lý Chiêu Hoàng 'abdicated to make him the founder of the Trần dynasty in 1226'", sources: [wp-tran-thai-tong]}
    note: "The event uses 31 December 1225; Thái Tông's title row starts 1226 as his lead says."
  - key: first-mongol-invasion-of-dai-viet-year
    question: In which year was the first Mongol invasion of Đại Việt?
    about: [{event: first-mongol-invasion-of-dai-viet-1257}]
    field: date
    claims:
      - {value: "1257: letters in the autumn of 1257, peace re-established in December 1257", sources: [wp-tran-thai-tong, wp-tran-thanh-tong]}
      - {value: "1258 ('During the first Mongol invasion of Vietnam in 1258')", sources: [wp-tran-hung-dao]}
    note: "The event runs 1257-1258. The Gregorian date of the lunar December 1257 probably falls in early 1258."
  - key: second-mongol-invasion-start
    question: When did the second Mongol invasion of Đại Việt begin?
    about: [{event: second-mongol-invasion-of-dai-viet-1284}]
    field: date
    claims:
      - {value: "December 1284", sources: [wp-tran-thanh-tong, wp-tran-nhan-tong]}
      - {value: "January 1285 ('In January 1285, Prince Toghan led the Mongol invasion')", sources: [wp-tran-hung-dao]}
    note: "The event starts in December 1284 (year 1284 entered)."
  - key: bach-dang-1288-date
    question: On what date was the Battle of Bạch Đằng?
    about: [{event: battle-of-bach-dang-1288}]
    field: date
    claims:
      - {value: "9 April 1288 ('In the early morning of 9 April'); 'April 1288' in the Hưng Đạo article", sources: [wp-battle-of-bach-dang-1288, wp-tran-hung-dao]}
      - {value: "8 March 1288 'in the lunar calendar'", sources: [wp-tran-thanh-tong]}
      - {value: "8 March 1288 (no calendar named)", sources: [wp-tran-nhan-tong]}
    note: "A lunar date given in Gregorian form; the event uses 9 April 1288."
  - key: tran-thanh-tong-died
    question: When did Trần Thánh Tông die?
    about: [{person: tran-thanh-tong}, {person: tran-nhan-tong}]
    field: died
    claims:
      - {value: "3 July 1290 (the lead)", sources: [wp-tran-thanh-tong]}
      - {value: "25 May 1290 'in the lunar calendar', at the age of 50", sources: [wp-tran-thanh-tong]}
      - {value: "25 May 1290 (no calendar named), at the age of 50", sources: [wp-tran-nhan-tong]}
    note: "The record uses the lead's 3 July 1290."
  - key: tran-nhan-tong-born
    question: When was Trần Nhân Tông born?
    about: [{person: tran-nhan-tong}, {person: tran-thanh-tong}]
    field: born
    claims:
      - {value: "7 December 1258", sources: [wp-tran-nhan-tong]}
      - {value: "11 November 1258 'in the lunar calendar'", sources: [wp-tran-thanh-tong]}
    note: "The record uses 7 December 1258."
  - key: tran-nhan-tong-died
    question: When did Trần Nhân Tông die?
    about: [{person: tran-nhan-tong}, {person: tran-thanh-tong}]
    field: died
    claims:
      - {value: "16 December 1308", sources: [wp-tran-nhan-tong]}
      - {value: "3 November 1308 'in the lunar calendar' (he and his sister died on the same day)", sources: [wp-tran-thanh-tong]}
    note: "The record uses 16 December 1308."
  - key: tran-nhan-tong-retirement
    question: When did Trần Nhân Tông become Emperor Emeritus?
    about: [{person: tran-nhan-tong}, {person: tran-anh-tong}]
    field: date
    claims:
      - {value: "3 March 1293, when he passed the throne to Trần Thuyên", sources: [wp-tran-nhan-tong]}
      - {value: "1294 ('held the title Emperor Emeritus from 1294 to his death in 1308')", sources: [wp-tran-nhan-tong]}
    note: "The title row ends 3 March 1293 and Anh Tông's begins that day."
  - key: tran-hung-dao-lifespan
    question: When was Trần Hưng Đạo born and how old was he at death?
    about: [{person: tran-hung-dao}]
    field: born
    claims:
      - {value: "Born 1228, died 1300 'at the age of 70' (the lead and Origins section)", sources: [wp-tran-hung-dao]}
      - {value: "Died in 1300 'at the age of 73' (the Death section)", sources: [wp-tran-hung-dao]}
      - {value: "Born 1213 (a link caption in the article, 'Tran Hung Dao (1213-1300)')", sources: [wp-tran-hung-dao]}
    note: "The record uses 1228-1300, the lead and Origins section (age 72 by those years)."
  - key: ho-quy-ly-usurpation-year
    question: In which year did Hồ Quý Ly depose the Trần and declare himself ruler?
    about: [{person: ho-quy-ly}, {event: ho-usurpation-1400}]
    field: date
    claims:
      - {value: "1400", sources: [wp-ho-quy-ly]}
      - {value: "1399", sources: [wp-le-loi]}
    note: "The record uses 1400 from the Hồ Quý Ly article."
  - key: ho-quy-ly-died
    question: When did Hồ Quý Ly die?
    about: [{person: ho-quy-ly}]
    field: died
    claims:
      - {value: "1407? (the lead: 1336-1407?; captured and exiled in 1407, 'it is not clear when he died')", sources: [wp-ho-quy-ly]}
      - {value: "c. 1408 ('Hồ Quý Ly (c. 1336 - 1408)')", sources: [wp-le-loi]}
    note: "No death year is entered in the record."
  - key: le-loi-born
    question: On what date was Lê Lợi born?
    about: [{person: le-loi}]
    field: born
    claims:
      - {value: "10 September 1385", sources: [wp-le-loi]}
