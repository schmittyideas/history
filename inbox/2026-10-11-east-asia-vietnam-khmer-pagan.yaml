realms:
  - {name: Đại Việt, region: Southeast Asia, country: Vietnam, note: "The Vietnamese state from 1054 (renamed from Đại Cồ Việt by Lý Thánh Tông on his succession) under the Lý, Trần, and, restored in 1428, the Later Lê; also the Mạc from 1527. The Hồ dynasty called it Đại Ngu from 1400."}
  - {name: Đại Ngu, region: Southeast Asia, country: Vietnam, note: "The name the Hồ Quý Ly article gives for the state under the Hồ dynasty from 1400; the Ming annexed it in 1407 as Jiaozhi and Lê Lợi restored Đại Việt in 1428."}
  - {name: Pagan Kingdom, region: Southeast Asia, country: Myanmar, note: "The Pagan Empire of the article, founded by Anawrahta; the article dates the dynasty's fall to 1287."}

people:
  # ---- Ly dynasty
  - key: ly-thai-to
    name: Lý Thái Tổ
    type: Royalty
    house: Lý dynasty
    realm: Đại Cồ Việt
    born: 0974-03-08
    died: 1028-03-31
    prominence: 4
    note: "Born Lý Công Uẩn; founding emperor of the Lý dynasty, 1009-1028. A palace commander under Lê Hoàn and Lê Long Đĩnh, raised by the monk Vạn Hạnh, he was proclaimed emperor two days after Lê Long Đĩnh's death (19 November 1009), on 21 November 1009. In 1010 he moved the capital from Hoa Lư to Đại La (renamed Thăng Long, modern Hanoi). The Song recognised him at once in 1010. He promoted Buddhism, reformed taxes (1013) and put down revolts. Buried at Thọ Lăng outside Thiên Đức Palace. Regnal title posthumously Thần Võ Hoàng Đế."
    coverage: partly
    coverage_note: "dates, accession, capital move, reign and burial from the English Wikipedia article; family, campaigns and religious works only summarised; no artworks"
    sources: [wp-ly-thai-to]
  - key: ly-thai-tong
    name: Lý Thái Tông
    type: Royalty
    house: Lý dynasty
    realm: Đại Cồ Việt
    born: 1000-07-29
    died: 1054-11-03
    prominence: 3
    note: "Born Lý Phật Mã at Hoa Lư; second emperor of the Lý dynasty, 1028-1054, called the most successful Vietnamese emperor since the tenth century. Put down an uprising by two brothers at his accession, issued the Minh Đạo laws (1042), captured Nùng Trí Cao and invaded Champa by sea in 1044, killing its king Jaya Simhavarman II. Ordered the One Pillar Pagoda built in 1049. A few months before his death he handed the governing to his son Lý Nhật Tôn (Thánh Tông), so Thánh Tông's article dates the succession to 3 November 1054, the day the lead gives for Thái Tông's death. Realm: Đại Cồ Việt, because the Thánh Tông article says the name was changed on Thánh Tông's succession; his own article says he 'ruled Đại Việt' (see discrepancy)."
    coverage: partly
    coverage_note: "dates, reign, Champa campaigns, laws and religious works from the English Wikipedia article; consorts and court only listed; no artworks"
    sources: [wp-ly-thai-tong, wp-ly-thanh-tong]
  - key: ly-thanh-tong
    name: Lý Thánh Tông
    type: Royalty
    house: Lý dynasty
    realm: Đại Việt
    born: 1023-03-19
    died: 1072-02-01
    prominence: 3
    note: "Born Lý Nhật Tôn; third emperor of the Lý dynasty, 1054-1072. On succeeding on 3 November 1054 he shortened the kingdom's name from Đại Cồ Việt to Đại Việt. Built the first Temple of Literature (Văn Miếu, 1070 in the body; 1072 in the lead), invaded Champa in 1069, burned Vijaya and captured its king Rudravarman III, who ceded three districts. Claimed imperial status, which the Chinese took as a challenge, a prelude to the Song-Viet war of the 1070s. Took Ỷ Lan as consort; their son was Lý Càn Đức (Nhân Tông). Birth and death dates differ inside the article (see discrepancies)."
    coverage: partly
    coverage_note: "dates, rename of the realm, Champa war, Temple of Literature and succession from the English Wikipedia article; the long building and omen chronicle, military and religious sections only summarised; no artworks"
    sources: [wp-ly-thanh-tong]
  - key: ly-nhan-tong
    name: Lý Nhân Tông
    type: Royalty
    house: Lý dynasty
    realm: Đại Việt
    born: 1066-02-22
    died: 1128-01-15
    prominence: 3
    note: "Born Lý Càn Đức; fourth emperor of the Lý dynasty, 1072-1128, the longest reign of any Vietnamese monarch (56 years in the lead, 55 in the legacy section). Came to the throne at seven, helped by his mother Ỷ Lan and the chancellor Lý Đạo Thành. Held the first Confucian imperial examination in 1072 and founded the Quốc tử giám (National Academy) in 1076. Under him Lý Thường Kiệt struck the Song first in 1075 (Sino-Vietnamese war 1075-1076); Champa was held in check, the last victory in 1104. Had no son and adopted Lý Dương Hoán (later Thần Tông) as heir in 1117. Died at Vĩnh Quang Palace."
    coverage: partly
    coverage_note: "dates, accession, examinations, the Song war and succession from the English Wikipedia article; family and poems only mentioned; no artworks"
    sources: [wp-ly-nhan-tong]
  - key: ly-cao-tong
    name: Lý Cao Tông
    type: Royalty
    house: Lý dynasty
    realm: Đại Việt
    born: 1173-07-06
    died: 1210-11-15
    prominence: 2
    note: "Born Lý Long Trát (Cán); seventh emperor of the Lý dynasty. Enthroned at three, helped by the regent Tô Hiến Thành (d. 1179); a pleasure-loving ruler whose building projects, famines and revolts began the dynasty's decline. In 1209 the general Quách Bốc seized the citadel and he fled to Tam Nông; Trần Lý and Tô Trung Từ retook it at the end of 1209. His son Sảm, who fled to Hải Ấp and married Trần Thị Dung there, succeeded as Huệ Tông. No title row: the article states no accession year (see header)."
    coverage: partly
    coverage_note: "dates, regency, decline of the reign and the 1209 revolt from the English Wikipedia article; no title row because the article gives no accession year; no artworks"
    sources: [wp-ly-cao-tong]
  - key: ly-hue-tong
    name: Lý Huệ Tông
    type: Royalty
    house: Lý dynasty
    realm: Đại Việt
    born: 1194
    died: 1226-09-03
    prominence: 2
    note: "Born Lý Sảm (July 1194, no day); eighth emperor of the Lý dynasty, 1211-1224. Mentally ill from 1224, he ceded the throne to his young daughter Lý Chiêu Hoàng and became a Buddhist monk; Trần Thủ Độ forced him to suicide in 1226. The article is a short stub."
    coverage: partly
    coverage_note: "dates, abdication in favour of his daughter and death from a short stub article and the Lý Chiêu Hoàng article; nothing else"
    sources: [wp-ly-hue-tong, wp-ly-chieu-hoang]
  - key: ly-chieu-hoang
    name: Lý Chiêu Hoàng
    type: Royalty
    house: Lý dynasty
    realm: Đại Việt
    born: 1218
    died: 1278
    prominence: 3
    note: "Born Lý Phật Kim (September of the lunar year 1218, no day); the ninth and last sovereign of the Lý dynasty and the only empress regnant in Vietnamese history. Her father ceded the throne to her at the age of six in October of the lunar year 1224; she ruled under Trần Thủ Độ and, in October or November 1225, was secretly married to the seven-year-old Trần Cảnh, to whom she ceded the throne; the Trần dynasty began on 31 December 1225. Demoted to Empress Chiêu Thánh in January 1226 and to princess in 1237; remarried to Lê Phụ Trần in 1258. Died at Cổ Pháp in March 1278 aged 61. Title: 'Emperor of Đại Việt' (same wording as the other sovereigns; the article says 'empress of Đại Việt')."
    coverage: partly
    coverage_note: "dates, reign, abdication, marriages and death from the English Wikipedia article; nothing else"
    sources: [wp-ly-chieu-hoang]
  # ---- Tran dynasty
  - key: tran-thai-tong
    name: Trần Thái Tông
    type: Royalty
    house: Trần dynasty
    realm: Đại Việt
    born: 1218-07-17
    died: 1277-05-05
    prominence: 3
    note: "Born Trần Cảnh; first emperor of the Trần dynasty, reigning 1226-1258 (33 years, per the lead), then retired emperor for 19 years. Placed on the throne through his uncle Trần Thủ Độ after marrying the child empress Lý Chiêu Hoàng. Reigned through the first Mongol invasion (autumn 1257), when the Mongol general Uriyangkhadai occupied Thăng Long for nine days. Abdicated to his son Trần Hoảng (Thánh Tông) in 1258 and kept ruling as retired emperor. Author of the Buddhist work Khóa Hư Lục. In 1237 he took his brother Trần Liễu's pregnant wife Thuận Thiên as empress, provoking Liễu's revolt."
    coverage: partly
    coverage_note: "dates, accession, first Mongol invasion, abdication and family crisis from the English Wikipedia article; children and writings only listed; no artworks"
    sources: [wp-tran-thai-tong, wp-tran-thanh-tong]
  - key: tran-thanh-tong
    name: Trần Thánh Tông
    type: Royalty
    house: Trần dynasty
    realm: Đại Việt
    born: 1240-10-12
    died: 1290-07-03
    prominence: 3
    note: "Born Trần Hoảng; second emperor of the Trần dynasty, 1258-1278, then retired emperor (Thái Thượng Hoàng) from 1279 to his death, ruling with his son Nhân Tông. Considered one of the greatest Trần emperors; ordered the first Trần imperial examination in March 1266. With Nhân Tông he led the second and third resistance to the Mongols. Buried at Dụ Lăng. Death date differs between articles (see discrepancies)."
    coverage: partly
    coverage_note: "dates, reign, relations with Kublai and the second and third Mongol invasions from the English Wikipedia article; domestic administration only summarised; no artworks"
    sources: [wp-tran-thanh-tong, wp-tran-nhan-tong]
  - key: tran-nhan-tong
    name: Trần Nhân Tông
    type: Royalty
    house: Trần dynasty
    realm: Đại Việt
    born: 1258-12-07
    died: 1308-12-16
    prominence: 3
    note: "Born Trần Khâm; third emperor of the Trần dynasty, 1278-1293, then Emperor Emeritus (Thái Thượng Hoàng). With his father he led the victories over the Yuan in 1285 and 1288. Passed the throne to his son Trần Anh Tông on 3 March 1293, was ordained a Buddhist monk in 1295 and founded the Trúc Lâm school at Yên Tử. In 1306 he gave his daughter Huyền Trân to the Cham king Jaya Simhavarman III in return for two Cham provinces."
    coverage: partly
    coverage_note: "dates, the Mongol wars, abdication, retirement and the Huyền Trân marriage from the English Wikipedia article; family only listed; no artworks"
    sources: [wp-tran-nhan-tong, wp-tran-thanh-tong]
  - key: tran-anh-tong
    name: Trần Anh Tông
    type: Royalty
    house: Trần dynasty
    realm: Đại Việt
    born: 1276-09-17
    died: 1320-12-12
    prominence: 2
    note: "Born Trần Thuyên; fourth emperor of the Trần dynasty, 1293-1314, the first Trần emperor to rule without a Mongol attack. A long period of peace and prosperity; took two Cham prefectures in 1306 (the Huyền Trân marriage) and defeated and captured the Cham king Chế Chí in 1312. Passed the throne to Trần Minh Tông in 1314 and held the title Thái Thượng Hoàng for six years."
    coverage: partly
    coverage_note: "dates, reign, Champa dealings and retirement from the English Wikipedia article; family only listed; no artworks"
    sources: [wp-tran-anh-tong]
  - key: tran-hung-dao
    name: Trần Hưng Đạo
    type: Nobility
    roles: [general]
    house: Trần dynasty
    realm: Đại Việt
    born: 1228
    died: 1300
    prominence: 5
    note: "Born Trần Quốc Tuấn, son of Prince Trần Liễu and nephew of Trần Thái Tông; Grand Prince Hưng Đạo (the title was bestowed after his death). Commander of the Đại Việt forces against the second (1284-1285) and third (1287-1288) Mongol invasions; in 1288 he planned the ambush on the Bạch Đằng River that destroyed the Yuan fleet. Died of natural causes in 1300, was cremated and his ashes were scattered under an oak near Thăng Long. Revered as Đức Thánh Trần. Age and birth year are given inconsistently in the article (see discrepancy). No title row: the article gives no dated office."
    coverage: partly
    coverage_note: "life dates, the three Mongol invasions, Bạch Đằng, death and cult from the English Wikipedia article; family and legacy places only summarised; no artworks"
    sources: [wp-tran-hung-dao, wp-battle-of-bach-dang-1288]
  # ---- Ho dynasty
  - key: ho-quy-ly
    name: Hồ Quý Ly
    type: Royalty
    house: Hồ dynasty
    realm: Đại Ngu
    born: 1336
    prominence: 3
    note: "Born Lê Quý Ly (adopted by Lê Huan); rose as a Trần court official and general in the Cham wars, was chief minister from March 1387 and in 1400 dethroned the last Trần emperor, renaming the kingdom from Đại Việt to Đại Ngu (the article: ruled 1400 to 1401 as founding emperor of the short-lived Hồ dynasty). Abdicated in 1401 to his second son Hồ Hán Thương and styled himself Emperor Emeritus. Introduced the first Vietnamese banknotes and a new capital Tây Đô in Thanh Hóa (the citadel is a UNESCO site). Captured by the Ming in 1407 and exiled to China; the lead gives his dates as 1336-1407? and the article says it is not clear when he died, so no death year is entered."
    coverage: partly
    coverage_note: "birth, rise, reforms, usurpation, reign and Ming capture from the English Wikipedia article; Cham wars and family only summarised; death not entered (uncertain); no artworks"
    sources: [wp-ho-quy-ly]
  # ---- Later Le dynasty
  - key: le-loi
    name: Lê Lợi
    type: Royalty
    house: Later Lê dynasty
    realm: Đại Việt
    born: 1385-09-10
    died: 1433-10-05
    prominence: 5
    note: "Also Lê Thái Tổ and Bình Định vương; leader of the Lam Sơn uprising (1418-1427) against Ming rule and founder of the Later Lê dynasty. Took the throne of the restored Đại Việt in 1428 (15 April in his article, 29 April in the Lam Sơn article), chose the era name Thuận Thiên, and was recognised by the Ming as 'administrator of the affairs of the state of Annam' in 1431. Renamed Thăng Long Đông Kinh. Died on 5 October 1433, appointing Lê Sát regent for his second son Lê Thái Tông."
    coverage: partly
    coverage_note: "life dates, the uprising, accession and reign from the English Wikipedia articles (Lê Lợi in full; Lam Sơn uprising selectively); his generals and the legends only mentioned; no artworks"
    sources: [wp-le-loi, wp-lam-son-uprising]
  - key: le-thai-tong
    name: Lê Thái Tông
    type: Royalty
    house: Later Lê dynasty
    realm: Đại Việt
    born: 1423-12-22
    died: 1442-08-28
    prominence: 2
    note: "Born Lê Nguyên Long, second son of Lê Lợi; second emperor of the Later Lê dynasty, 1433-1442. Succeeded at about ten under the regent Lê Sát, whom he had executed after officially taking power in 1438. Led three campaigns against northwestern chiefs (1440-1441). Died suddenly after a visit to the Lychee Garden of Nguyễn Trãi in August 1442; Trãi was executed, and Lê Thánh Tông vindicated him in 1464."
    coverage: partly
    coverage_note: "dates, regency, campaigns and the 1442 death from the English Wikipedia article; consorts only listed; no artworks"
    sources: [wp-le-thai-tong]
  - key: le-thanh-tong
    name: Lê Thánh Tông
    type: Royalty
    house: Later Lê dynasty
    realm: Đại Việt
    born: 1442-08-25
    died: 1497-03-03
    prominence: 4
    note: "Born Lê Tư Thành (Lê Hạo); fifth and longest-reigning emperor of the Later Lê, 1460-1497. Came to power in the counter-coup of 1460 against his half-brother Lê Nghi Dân. Reformed the bureaucracy on the Chinese model with six ministries, a census in 1469 and 13 provinces (dao), issued the Hồng Đức Code in 1483, completed the Đại Việt sử ký toàn thư in 1479, and destroyed Champa as a power in 1471. Invaded Laos from 1479. His reign is called the prosperous reign of Hồng Đức."
    coverage: partly
    coverage_note: "dates, accession, reforms, laws, Champa and Laos campaigns from the English Wikipedia article; trade policy and the eunuch episodes only mentioned; no artworks"
    sources: [wp-le-thanh-tong]
  # ---- Mac dynasty
  - key: mac-dang-dung
    name: Mạc Đăng Dung
    type: Royalty
    house: Mạc dynasty
    realm: Đại Việt
    born: 1483-11-23
    died: 1541-08-22
    prominence: 3
    note: "Also Mạc Thái Tổ, reign name Minh Đức; a fisherman's son who rose from bodyguard to commander under the Lê, forced Lê Chiêu Tông to abdicate in 1522, had him and Lê Cung Hoàng killed in 1527 and proclaimed the Mạc dynasty. Abdicated in 1529 to his son Mạc Đăng Doanh and lived as retired emperor; resumed power when Doanh died during the Ming threat of the late 1530s (the article gives no year). Obtained temporary Ming recognition in 1528; in 1540 he accepted humiliating Ming demands. The restored Lê (from 1533, under Nguyễn Kim and Trịnh Kiểm) held the south."
    coverage: partly
    coverage_note: "dates, the usurpation, abdication, Ming dealings and death from the English Wikipedia article; the years of the resumption of power not given; no artworks"
    sources: [wp-mac-dang-dung]
  # ---- Khmer Empire
  - key: suryavarman-i
    name: Suryavarman I
    type: Royalty
    realm: Khmer Empire
    died: 1050
    prominence: 3
    note: "Posthumously Nirvanapada; king of the Khmer Empire from about 1002 to 1050. Usurped Udayadityavarman I, fought a nine-year war of succession against Jayavirahvarman and claimed the throne in 1010; had 4,000 officials swear an oath of allegiance in 1011 (six inscriptions). Expanded west to Lopburi and east into the Mekong basin; allied with the Chola emperor Rajendra Chola I from about 1012; built the West Baray and completed Phimeanakas and Ta Keo, and Preah Vihear. Mahayana Buddhist who tolerated Hinduism."
    coverage: partly
    coverage_note: "reign, accession, expansion, Chola links and works from the English Wikipedia article; no birth date is given; no artworks"
    sources: [wp-suryavarman-i]
  - key: suryavarman-ii
    name: Suryavarman II
    type: Royalty
    realm: Khmer Empire
    died: 1150
    prominence: 5
    note: "Posthumously Paramavishnuloka; ruler of the Khmer Empire 1113-1150 (enthroned in 1113, formal coronation 1119, both by the priest Divakarapandita). Builder of Angkor Wat, the largest Hindu temple in the world, dedicated to Vishnu; his tomb was placed there. Reunited the empire; his attacks on Đại Việt (1128, 1129, 1132, 1137) failed, but in 1145 he invaded Champa and sacked Vijaya. Sent missions to the Chola in 1114 and resumed relations with China in 1116. Died in 1150, possibly on campaign (see discrepancy)."
    coverage: partly
    coverage_note: "reign, coronations, wars, diplomacy and Angkor Wat from the English Wikipedia article; Angkor Wat's construction dates are not given in it; no artworks"
    sources: [wp-suryavarman-ii]
  - key: jayavarman-vii
    name: Jayavarman VII
    type: Royalty
    realm: Khmer Empire
    born: 1122
    died: 1218
    died_estimated: true
    prominence: 4
    note: "Posthumously Mahaparamasaugata; son of Dharanindravarman II. Led the Khmer army that drove the Chams out after their sack of the capital in 1177 and was crowned in 1181. The first Khmer king devoted to Buddhism; built the Bayon and Angkor Thom, Ta Prohm (dedicated to his mother in 1186) and Preah Khan, 102 hospitals and 121 rest houses. Conquered Champa in 1190-1191, making it a dependency for 30 years. Died around 1218; Jayavarman VIII later defaced his Buddhist works."
    coverage: partly
    coverage_note: "dates, the Cham war, coronation, building programme and succession from the English Wikipedia article; temple details and the list of Buddha images only summarised; no artworks"
    sources: [wp-jayavarman-vii]
  # ---- Pagan
  - key: anawrahta
    name: Anawrahta
    type: Royalty
    house: Pagan dynasty
    realm: Pagan Kingdom
    born: 1014-05-11
    died: 1077-04-11
    prominence: 4
    note: "Born Min Saw; founder of the Pagan Empire (the article: 'father of the Burmese nation'). Rebelled at Mount Popa in 1044, killed his half-brother King Sokkate in single combat at Myinkaba on 11 August 1044 and took the throne on 16 December 1044. Converted to Theravada Buddhism in 1056 under Shin Arahan; conquered Thaton on 17 May 1057; brought the Irrawaddy valley, the Shan Hills and north Arakan under Pagan and checked the Khmer advance on the Tenasserim coast. Built weirs and canals that made Kyaukse the granary of Upper Burma, and began the Shwezigon Pagoda in 1059. Died on 11 April 1077 outside Pagan."
    coverage: partly
    coverage_note: "life dates, accession, conquests, reforms and death from the English Wikipedia article; the chronicle dating table and campaign details only summarised; no artworks"
    sources: [wp-anawrahta]

places:
  - key: thang-long
    name: Thăng Long (Hanoi)
    historical_name: "Đại La; Thăng Long; Đông Kinh under Lê Lợi"
    kind: city
    region: Hanoi
    country: Vietnam
    lat: 21.034
    lng: 105.840
    visitable: true
    visit_site: "Imperial Citadel of Thăng Long"
    founded: 1010
    built_by: "Lý Thái Tổ, who moved the capital here from Hoa Lư in 1010; the site was Đại La, the city the Tang general Gao Pian built in the 860s"
    note: "Named Thăng Long ('ascending dragon') by Lý Thái Tổ in 1010; by 1010, 11 palaces were built. The capital of the Lý and Trần; sacked or abandoned in the Mongol invasions; Lê Lợi renamed it Đông Kinh; the Ming administrative centre in it was Đông Quan."
    sources: [wp-ly-thai-to, wp-le-loi]
  - key: hoa-lu
    name: Hoa Lư
    kind: city
    region: Ninh Bình
    country: Vietnam
    lat: 20.28
    lng: 105.91
    visitable: true
    visit_site: "Hoa Lư Ancient Capital"
    note: "Capital of the Đinh and Anterior Lê dynasties, a natural fortress between mountains in the southeast of the Red River Delta; Lý Thái Tổ left it in 1010 as 'a narrow citadel in a low-lying, damp area'. Birthplace of Lý Thái Tông in 1000."
    sources: [wp-ly-thai-to, wp-ly-thai-tong]
  - key: lam-son
    name: Lam Sơn
    kind: village
    region: Thanh Hóa
    country: Vietnam
    lat: 19.9
    lng: 105.3
    visitable: true
    note: "The rural, mountainous home area of Lê Lợi in Thanh Hóa province, where he swore the Lũng Nhai oath in 1416 and raised the banner of revolt on 7 February 1418, calling himself Bình Định vương. The point is the approximate centre of the commune."
    sources: [wp-le-loi, wp-lam-son-uprising]
  - key: bach-dang-river
    name: Bạch Đằng River
    kind: battlefield
    region: Quảng Ninh and Hải Phòng
    country: Vietnam
    lat: 20.88
    lng: 106.78
    visitable: true
    note: "A distributary of the Red River running between Yên Hưng (Quảng Ninh) and Thủy Nguyên (Hải Phòng) to the sea. Site of the Yuan fleet's destruction in 1288 by iron-tipped stakes set under the tide, a tactic the article says Ngô Quyền used in the earlier battle of 938."
    sources: [wp-battle-of-bach-dang-1288]
  - key: angkor-wat
    name: Angkor Wat
    kind: temple
    region: Siem Reap
    country: Cambodia
    lat: 13.4125
    lng: 103.867
    visitable: true
    visit_site: "Angkor Archaeological Park"
    built_by: "Suryavarman II"
    note: "The largest Hindu temple in the world, dedicated to Vishnu and Shiva; five central towers evoke Mount Meru; over 1,860 apsaras and long bas-reliefs, one showing Suryavarman II. It faces west. The article says it appears to have been completed only after his death in 1150, and that his tomb was placed there. No founding year is given in the article."
    sources: [wp-suryavarman-ii]
  - key: angkor-thom
    name: Angkor Thom
    historical_name: Indrapattha
    kind: city
    region: Siem Reap
    country: Cambodia
    lat: 13.4412
    lng: 103.859
    visitable: true
    visit_site: "Angkor Archaeological Park (Bayon)"
    built_by: "Jayavarman VII"
    note: "A new city centre ('Grand Angkor'), called Indrapattha in its day, built by Jayavarman VII around his temple-mountain the Bayon, whose outer walls carry reliefs of warfare, the naval battle on the Tonlé Sap and everyday life. The Suryavarman I article says that king's palace stood in the vicinity of Angkor Thom. No founding year is given."
    sources: [wp-jayavarman-vii, wp-suryavarman-i]
  - key: bagan
    name: Bagan (Pagan)
    kind: city
    region: Mandalay Region
    country: Myanmar
    lat: 21.172
    lng: 94.866
    visitable: true
    visit_site: "Bagan Archaeological Zone"
    note: "Capital of the Pagan kingdom; Anawrahta killed Sokkate at Myinkaba nearby in 1044, brought back Mon artisans from Thaton in 1057 to build its monuments, and died on the outskirts in 1077. The article says the remains of its monuments rival Angkor Wat."
    sources: [wp-anawrahta]
  - key: shwezigon-pagoda
    name: Shwezigon Pagoda
    kind: pagoda
    city: Nyaung-U
    region: Mandalay Region
    country: Myanmar
    lat: 21.1756
    lng: 94.9
    visitable: true
    founded: 1059
    built_by: "Anawrahta (begun in 1059; unfinished at his death in 1077)"
    note: "Anawrahta's chief monument and the first of the Pagan temples built by him."
    sources: [wp-anawrahta]

events:
  - key: capital-moved-to-thang-long-1010
    name: Ly Thai To moves the capital to Thang Long
    type: Founding
    year: 1010
    place: thang-long
    places:
      - {place: hoa-lu, role: start, note: "The old capital of the Đinh and Anterior Lê dynasties, left behind"}
    people:
      - {person: ly-thai-to, role: founder}
    prominence: 4
    note: "Lý Thái Tổ issued the Edict on the Transfer of the Capital, judging Hoa Lư too narrow and low-lying, and chose Đại La, 'between Heaven and Earth where the coiling dragon and the crouching tiger lie'. When his boat docked a dragon reportedly rose above it and he renamed the place Thăng Long. The article dates the move to 1010 and says it began the more than 1,000 years of Hanoi's history as capital. The Song recognised him the same year."
    sources: [wp-ly-thai-to]
  - key: ly-song-war-1075
    name: Ly-Song war
    type: War
    year: 1075
    end_year: 1076
    people:
      - {person: ly-nhan-tong, role: emperor}
    prominence: 3
    note: "Lý Thường Kiệt and Tôn Đản struck first in 1075, attacking Lian and Qin and besieging Yongzhou (the siege lasted 40 days; over 58,000 killed in the city by the Vietnamese). The Song invaded in the twelfth month of 1076, were held on the Như Nguyệt River, then beat Lý Thường Kiệt at Phú Lương; Lý Nhân Tông proposed a cease-fire, accepted after the Song lost, per the article, 400,000 men. Lý Thường Kiệt's poem Nam quốc sơn hà is called Vietnam's first declaration of independence. The article labels the war 'Sino-Vietnamese War (1075-1076)'; no Gregorian date for the Song invasion is given (see discrepancy)."
    sources: [wp-ly-nhan-tong]
  - key: tran-dynasty-founded-1225
    name: Foundation of the Tran dynasty
    type: Founding
    date: 1225-12-31
    people:
      - {person: tran-thai-tong, role: founder}
      - {person: ly-chieu-hoang, role: abdicated}
    prominence: 3
    note: "Trần Thủ Độ arranged a secret marriage between Lý Chiêu Hoàng and Trần Cảnh in October or November 1225 and had her cede the throne to him; the Trần dynasty began 'on the first day of the twelfth lunar month, 1225 (31 December 1225)' per the Chiêu Hoàng article. Thái Tông's and other articles date his reign from 1226 (see discrepancy). The Lý lasted 216 years."
    sources: [wp-ly-chieu-hoang, wp-tran-thai-tong]
  - key: first-mongol-invasion-of-dai-viet-1257
    name: First Mongol invasion of Dai Viet
    type: War
    year: 1257
    end_year: 1258
    people:
      - {person: tran-thai-tong, role: defender}
      - {person: tran-hung-dao, role: officer commanding frontier troops}
    prominence: 3
    note: "In autumn 1257 the Mongol general Uriyangkhadai demanded passage to attack the Song and, after three envoys were imprisoned in Thăng Long, invaded. The Vietnamese were routed at Nô Nguyên (Việt Trì) and at the Phù Lỗ bridge; the Trần evacuated the capital, the Mongols left after nine days, and peace was re-established in December 1257. Thái Tông agreed to send tribute every three years. The Hưng Đạo article dates the invasion 1258 (see discrepancy). The brief's 1258 is the usual date; the articles read here say 1257."
    sources: [wp-tran-thai-tong, wp-tran-thanh-tong, wp-tran-hung-dao]
  - key: second-mongol-invasion-of-dai-viet-1284
    name: Second Mongol invasion of Dai Viet
    type: War
    year: 1284
    end_year: 1285
    people:
      - {person: tran-thanh-tong, role: retired emperor, joint supreme commander}
      - {person: tran-nhan-tong, role: emperor, joint supreme commander}
      - {person: tran-hung-dao, role: commander-in-chief}
    prominence: 4
    note: "Toghan led the infantry from the north and Sogetu the navy through Champa from December 1284. After defections (Trần Ích Tắc, Trần Kiện) and the loss of Thăng Long, the Trần won at Hàm Tử (April 1285) and Chương Dương (10 May 1285), Sogetu was killed and the emperors returned to the capital on 6 June 1285 (lunar dates in one article). The Hưng Đạo article puts the start in January 1285 (see discrepancy)."
    sources: [wp-tran-thanh-tong, wp-tran-nhan-tong, wp-tran-hung-dao]
  - key: third-mongol-invasion-of-dai-viet-1287
    name: Third Mongol invasion of Dai Viet
    type: War
    year: 1287
    end_year: 1288
    people:
      - {person: tran-thanh-tong, role: retired emperor}
      - {person: tran-nhan-tong, role: emperor}
      - {person: tran-hung-dao, role: commander-in-chief}
    prominence: 4
    note: "Launched in March 1287 (the Bạch Đằng article says late 1287, the fleet sailing from Qinzhou on 17 December) under Toghan; Trần Khánh Dư destroyed the Yuan supply fleet at Vân Đồn, and Hưng Đạo's ambush on the Bạch Đằng River ended the war in 1288. Kublai exiled Toghan to Yangzhou for life."
    sources: [wp-tran-thanh-tong, wp-tran-nhan-tong, wp-battle-of-bach-dang-1288]
  - key: battle-of-bach-dang-1288
    name: Battle of Bach Dang
    type: Battle
    date: 1288-04-09
    place: bach-dang-river
    people:
      - {person: tran-hung-dao, role: victor}
      - {person: tran-nhan-tong, role: emperor, present}
      - {person: tran-thanh-tong, role: retired emperor, present}
    prominence: 5
    note: "Hưng Đạo lured the Yuan fleet under the admirals Omar and Fan Yi into the river on the high tide and trapped it on iron-tipped stakes as the tide fell; about 400 ships were taken or burned, Fan Yi was killed and Omar captured. The decisive naval battle of the third invasion, ending Kublai's plan to conquer Đại Việt and Champa. 9 April 1288 in the Bạch Đằng article; the Thánh Tông and Nhân Tông articles give 8 March 1288 as a lunar date (see discrepancy)."
    sources: [wp-battle-of-bach-dang-1288, wp-tran-hung-dao]
  - key: ho-usurpation-1400
    name: Ho Quy Ly seizes the throne
    type: Usurpation
    year: 1400
    people:
      - {person: ho-quy-ly, role: usurper}
    prominence: 3
    note: "Hồ Quý Ly dethroned the last Trần emperor, declared himself emperor, renamed the kingdom Đại Ngu and executed 370 dissidents after a failed coup. The Lê Lợi article dates the deposition 1399 (see discrepancy). He abdicated to Hồ Hán Thương in 1401."
    sources: [wp-ho-quy-ly]
  - key: ming-conquest-of-dai-ngu-1406
    name: Ming conquest of Dai Ngu
    type: War
    year: 1406
    end_year: 1407
    people:
      - {person: ho-quy-ly, role: defeated}
    prominence: 4
    note: "The Ming invaded in 1406 under the pretext of restoring the Trần (215,000 troops under Zhang Fu and Mu Sheng in the Lê Lợi article), defeated Hồ Quý Ly's army, captured him in Thiên Cầm cave in 1407 and made the country the province of Jiaozhi."
    sources: [wp-ho-quy-ly, wp-le-loi]
  - key: lam-son-uprising-1418
    name: Lam Son uprising
    type: Rebellion
    date: 1418-02-07
    end_year: 1427
    place: lam-son
    places:
      - {place: thang-long, role: siege, note: "Ming-held Đông Quan (modern Hanoi), besieged from late 1426 until the Đông Quan oath of 16 December 1427"}
    people:
      - {person: le-loi, role: leader}
    prominence: 4
    note: "Lê Lợi swore the Lũng Nhai oath with 18 others in early 1416, then on 7 February 1418 proclaimed himself Bình Định vương and rose at Lam Sơn. Defeated and truced in 1422-1424, he moved to Nghệ An in 1424 on Nguyễn Chích's plan, advanced north in 1426, won at Tốt Động - Chúc Động, besieged Đông Quan, destroyed the Ming relief armies at Chi Lăng - Xương Giang in 1427 and secured the Ming withdrawal (the Ming army began leaving on 29 December 1427). The Lê Lợi article gives the start as 'the day after Tết, February 1418'. Lê Lợi took the throne in April 1428."
    sources: [wp-lam-son-uprising, wp-le-loi]
  - key: battle-of-tot-dong-chuc-dong-1426
    name: Battle of Tot Dong - Chuc Dong
    type: Battle
    date: 1426-11-07
    people:
      - {person: le-loi, role: commander of the Lam Sơn army}
    prominence: 3
    note: "Wang Tong's Ming army, split in two, was ambushed at Tốt Động and Chúc Động (south of Hanoi); Chen Qia was killed and Wang Tong badly wounded, his army broken. The Lê Lợi article puts it in early December 1426 and counts about 30,000 Chinese killed or captured by 3,000 rebels (see discrepancy). Lê Lợi himself was still in Thanh Hóa."
    sources: [wp-lam-son-uprising, wp-le-loi]
  - key: battle-of-chi-lang-xuong-giang-1427
    name: Battle of Chi Lang - Xuong Giang
    type: Battle
    year: 1427
    people:
      - {person: le-loi, role: commander of the Lam Sơn army}
    prominence: 3
    note: "The Ming relief armies under Liu Sheng and Mu Sheng entered in late 1427. Liu Sheng was ambushed and killed at Chi Lăng; the citadel of Xương Giang (modern Bắc Giang) fell; Mu Sheng retreated. The end of the Ming effort. The date of Xương Giang's fall differs between articles (see discrepancy)."
    sources: [wp-lam-son-uprising, wp-le-loi]
  - key: dong-quan-oath-1427
    name: Dong Quan oath
    type: Treaty
    date: 1427-12-16
    people:
      - {person: le-loi, role: negotiated the Ming withdrawal}
    prominence: 2
    note: "Wang Tong and his generals swore with the Lam Sơn commanders south of Đông Quan. Wang Tong's army began its journey home on 29 December 1427 and he followed on 3 January 1428. The Xuande Emperor accepted the withdrawal and enfeoffed the puppet Trần Cảo as King of Annam."
    sources: [wp-lam-son-uprising]
  - key: le-loi-takes-the-throne-1428
    name: Le Loi takes the throne
    type: Coronation
    date: 1428-04-15
    people:
      - {person: le-loi, role: crowned}
    prominence: 4
    note: "Lê Lợi took the throne as emperor of the restored Đại Việt, era name Thuận Thiên, founding the Later Lê dynasty, which lasted nearly 400 years. 15 April 1428 in his article; 29 April 1428 in the Lam Sơn article (see discrepancy). Nguyễn Trãi wrote the Bình Ngô đại cáo, the proclamation of independence."
    sources: [wp-le-loi, wp-lam-son-uprising]
  - key: conquest-of-champa-1471
    name: Le Thanh Tong destroys Champa
    type: War
    year: 1471
    people:
      - {person: le-thanh-tong, role: victor}
    prominence: 3
    note: "The article calls it the final destruction of Champa's ruling house in 1471, after a Cham army of 100,000 under Maha Sajan besieged the Vietnamese garrison at Huế in 1470. The balance of power between Cham and Vietnamese of more than 500 years ended; Thánh Tông settled Vietnamese in the conquered territories."
    sources: [wp-le-thanh-tong]
  - key: hong-duc-code-1483
    name: Hong Duc Code
    type: Law
    year: 1483
    people:
      - {person: le-thanh-tong, role: issued}
    prominence: 2
    note: "The new code of Đại Việt (the Lê dynasty code), Chinese in basis but with Vietnamese features: women held a higher position, parental consent was not required for marriage and daughters had equal inheritance rights. Part of Lê Thánh Tông's reform of the state (six ministries, the 1469 census, 13 provinces). The woodblocks are in the National Library."
    sources: [wp-le-thanh-tong]
  - key: mac-dang-dung-proclaimed-emperor-1527
    name: Mac Dang Dung proclaims the Mac dynasty
    type: Usurpation
    year: 1527
    people:
      - {person: mac-dang-dung, role: usurper}
    prominence: 3
    note: "After forcing Lê Chiêu Tông to abdicate in 1522 and capturing him in 1526, Mạc Đăng Dung had him and Lê Cung Hoàng killed in 1527 and proclaimed himself emperor, reign name Minh Đức. The Ming recognised him for a time from 1528; the Lê were restored in the south in 1533."
    sources: [wp-mac-dang-dung]
  - key: khmer-invasions-of-dai-viet-1128
    name: Khmer invasions of Dai Viet under Suryavarman II
    type: War
    year: 1128
    end_year: 1137
    people:
      - {person: suryavarman-ii, role: attacker}
    prominence: 2
    note: "In 1128 Suryavarman II is said to have led 20,000 soldiers against Đại Việt and been defeated; in 1129 a fleet of more than 700 vessels attacked its coast; combined Khmer and Cham forces attacked again in 1132, with a final attempt in 1137. All failed, per the article."
    sources: [wp-suryavarman-ii]
  - key: sack-of-vijaya-1145
    name: Suryavarman II sacks Vijaya
    type: War
    year: 1145
    people:
      - {person: suryavarman-ii, role: victor}
    prominence: 2
    note: "Suryavarman II appears to have invaded Champa, defeated Jaya Indravarman III and sacked Vijaya with help from Kulothunga Chola II, and set his wife's brother Harideva on the Cham throne; Jaya Harivarman I soon retook the capital and killed Harideva. A final expedition in 1150 ended in disastrous withdrawal."
    sources: [wp-suryavarman-ii]
  - key: cham-sack-of-angkor-1177
    name: Cham sack of Angkor (Battle of Tonle Sap)
    type: Battle
    year: 1177
    people:
      - {person: jayavarman-vii, role: led the Khmer army that later drove out the Cham (1177-1181)}
    prominence: 4
    note: "The Cham king Jaya Indravarman IV sailed a fleet up the Mekong, across Lake Tonlé Sap and up the Siem Reap River, pillaged the capital Yasodharapura and put King Tribhuvanadityavarman to death; the Chams held Cambodia for four years. Jayavarman VII's counter-campaign, including the naval battle shown on the Bayon and at Banteay Chmar, drove them out. Michael Vickery doubts both the date and the event (see discrepancy)."
    sources: [wp-jayavarman-vii]
  - key: jayavarman-vii-crowned-1181
    name: Coronation of Jayavarman VII
    type: Coronation
    year: 1181
    people:
      - {person: jayavarman-vii, role: crowned}
    prominence: 3
    note: "After the Cham were driven out, Jayavarman found the capital in disorder, ended the quarrels of the factions and was crowned king in 1181. The article gives no place."
    sources: [wp-jayavarman-vii]
  - key: jayavarman-vii-conquest-of-champa-1190
    name: Jayavarman VII conquers Champa
    type: War
    year: 1190
    end_year: 1191
    people:
      - {person: jayavarman-vii, role: victor}
    prominence: 3
    note: "Helped by the refugee Cham prince Sri Vidyanandana, Jayavarman sacked and conquered Champa in revenge for 1177; it stayed a dependency of the Khmer Empire for 30 years."
    sources: [wp-jayavarman-vii]
  - key: conquest-of-thaton-1057
    name: Anawrahta conquers Thaton
    type: War
    date: 1057-05-17
    people:
      - {person: anawrahta, role: victor}
    places:
      - {place: bagan, role: destination, note: "Over 30,000 captives, many of them artisans, were brought to Pagan on the traditional account"}
    prominence: 3
    note: "After a three-month siege (the army, led by the 'Four Paladins', invaded in early 1057) Thaton fell on 17 May 1057 (11th waxing of Nayon, 419 ME). Seen as the turning point in Burmese history; Michael Aung-Thwin argues that Thaton's cultural contribution is a post-Pagan legend."
    sources: [wp-anawrahta]

