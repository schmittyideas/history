batch:
  title: "Vietnam, the Khmer Empire and Pagan, 1009-1527: the Ly, Tran, Ho, Later Le and Mac emperors, three Khmer kings and Anawrahta"
  requested: "Batch E of the East Asia build-out: 21 rulers and commanders of Dai Viet (Ly, Tran, Ho, Later Le, Mac), the Khmer Empire (Suryavarman I and II, Jayavarman VII) and Pagan (Anawrahta), with reigns, the Mongol invasions, Bach Dang 1288, the Lam Son uprising, places and discrepancies"
  date: 2026-10-11

# Notes for the reviewer (batch E of the East Asia build-out)
# - Source: local copies of the English Wikipedia articles (wp4 directory); nothing fetched. All 23 files were checked by their first lines: every one resolved to the article that was asked for. Lam_Son_uprising (77 KB) was read selectively (lead, the Lam Son outbreak, Tot Dong - Chuc Dong, the end of the war, Chi Lang - Xuong Giang, the Dong Quan oath, aftermath). Everything else was read in full; the reference lists were skipped.
# - Existing records only referenced: le-hoan (not linked: his daughter, Ly Thai To's wife, has no record), jayavarman-v, realms Dai Co Viet and Khmer Empire. Nothing existing is redefined.
# - New realms: Dai Viet (Southeast Asia, Vietnam), Dai Ngu (Southeast Asia, Vietnam; the name the Ho article gives for the state from 1400), Pagan Kingdom (Southeast Asia, Myanmar). Diacritics are kept in names, titles and realms (as in "Dai Co Viet" already in the database, written there with them); keys are ASCII.
# - Title wordings: "Emperor of Dai Co Viet" (Ly Thai To and Ly Thai Tong, to 3 November 1054: the Ly Thanh Tong article says he shortened the name from Dai Co Viet to Dai Viet on succeeding; the Ly Thai To article also calls the state Dai Co Viet; the Ly Thai Tong article itself says he 'ruled Dai Viet', see discrepancy), "Emperor of Dai Viet" (Ly Thanh Tong onward, Tran, Later Le, Mac, and Ly Chieu Hoang as a woman ruling in her own right, as the brief says), "Emperor of Dai Ngu" (Ho Quy Ly), "King of the Khmer", "King of Pagan".
# - Retired emperors (Thai Thuong Hoang): Tran Thai Tong (1258-1277), Tran Thanh Tong (1279-1290), Tran Nhan Tong (1294 per his lead; he passed the throne on 3 March 1293, see discrepancy), Tran Anh Tong (1314-1320) and Ho Quy Ly (styled Emperor Emeritus from 1401) held that status and, in the articles' words, still shared or kept power. They are noted in the people's notes, not entered as title rows.
# - Titles deliberately left out because the article gives no start date: Ly Cao Tong (the article says only 'enthroned at three' and 'ruled 35 years'; no year is stated, and the two figures do not agree with his 1173 birth), Tran Hung Dao (commander-in-chief 'Quoc cong tiet che' appointed in 1283 per the Nhan Tong article is an office, not entered; the article gives him no dated title of his own), Ho Quy Ly as chief minister (appointed March 1387, no end date), the rulers Ho Quy Ly installed (Tran Thuan Tong and Thieu De; not in this batch). Mac Dang Dung has one row, 1527-1529; the article says he resumed power when his son Doanh died 'in the summer' of the 1537 invasion narrative but gives no year for the resumption, so the second row is left out and the span to his death in 1541 is only in his note.
# - Rulers outside the brief are not entered, so the realm strip has gaps: the Ly between Nhan Tong (d. 1128) and Cao Tong/Hue Tong (Ly Than Tong and Anh Tong), the Tran after Anh Tong (1314), and the Later Le between Thanh Tong (1497) and the Mac (1527). Cao Tong has no title row (see above), so 1176-1210 shows no Ly emperor.
# - Left out because the article gives no date or place: Angkor Wat and Angkor Thom founding years (the articles say only that Suryavarman II presided over Angkor Wat, 'completed only after his death', and that Jayavarman VII built Angkor Thom and the Bayon, with Ta Prohm dedicated in 1186); so those places have built_by but no founded, and there is no 'construction of Angkor Wat' event. Hoa Lu has no founding year. Birthplaces without a place record (Co Phap for Ly Thai To, Dai Lai village for Ho Quy Ly, Co Trai for Mac Dang Dung) are in notes only. The Bayon and Ta Prohm have no own place record.
# - Mongol invasions of Dai Viet: the brief names 1258, 1285 and 1287-88. The articles date them as follows and the events use the articles: first invasion autumn 1257 to December 1257 (Thai Tong and Thanh Tong articles) against 'in 1258' (Hung Dao article), recorded as a discrepancy and entered as 1257-1258; second invasion December 1284 (Thanh Tong, Nhan Tong) against January 1285 (Hung Dao article); third invasion March 1287 (Thanh Tong, Nhan Tong) or late 1287 (Bach Dang article, fleet left Qinzhou 17 December), ending 1288. The Ly-Song war is 1075-1076 in the Nhan Tong article (the brief says 1075-1077); the Song invasion began 'in the twelfth month of 1076', i.e. very likely January 1077, but the article gives no Gregorian date, so the event stays at 1075-1076 with a discrepancy.
# - Lunar/Gregorian: Vietnamese articles mix lunar dates with Gregorian equivalents. Where an article gives a lunar date as a Gregorian-looking date (Bach Dang '8 March 1288 (in the lunar calendar)', Thanh Tong's death '25 May 1290 (lunar)') and another article gives a different Gregorian date (9 April 1288, 3 July 1290) both are recorded, never converted.
# - Discrepancies recorded: Ly Thai To's birthplace; the succession of 1009 (peaceful against the An Nam chi luoc account); the state's name under Thai Tong; Thanh Tong's birth and death dates; Nhan Tong's birth and death dates; the Ly-Song war span; Cao Tong's birth and death dates; Hue Tong's death; Chieu Hoang's age at accession; the Tran founding date; the first and second Mongol invasion dates; Bach Dang's date; Thanh Tong's death; Nhan Tong's birth, death and retirement; Hung Dao's lifespan; Ho Quy Ly's usurpation year and death; Le Loi's birth and accession; Tot Dong's date; the fall of Xuong Giang; Le Thai Tong's death date; Le Thanh Tong's Laos campaign; Suryavarman I's accession and death; Suryavarman II's death; Jayavarman VII's sack of Angkor in 1177; Anawrahta's birth, empire and death.
# - Doubts: Lam Son and Hoa Lu coordinates are general knowledge, to about 5 km (Lam Son is a commune, the point is its approximate centre). The visitable flags and visit_site names are general knowledge, not from the articles. Prominence is hand-set: 5 only for Tran Hung Dao, Le Loi, Suryavarman II and Bach Dang, as the brief asks; Lam Son uprising 4. The Pagan Kingdom is called the 'Pagan Empire' in the Anawrahta article; the realm name 'Pagan Kingdom' follows the brief. Anawrahta's accession is 16 December 1044 in the article, which also gives 11 May 1044 as his birth in one place; see discrepancy.
# - Moments take a year only (checked): every moment below has an integer year or none. Full dates sit in title notes, events or discrepancies.
# - Size: 21 people, 19 title rows, 3 realms, 8 places, 23 events, 36 discrepancies (110 rows), 10 links, 8 moments.

