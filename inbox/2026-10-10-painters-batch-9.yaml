people:
- key: gerard-david
  name: Gerard David
  type: Artist
  roles:
  - painter
  - manuscript illuminator
  born: 1460
  born_estimated: true
  died: '1523-08-13'
  prominence: 4
  note: Early Netherlandish painter and manuscript illuminator of Bruges, known for his brilliant use of colour and religious scenes.
  image_url: https://upload.wikimedia.org/wikipedia/commons/6/6c/Gerard_David_selfportrait_in_The_Virgin_among_the_Virgins.jpg
  image_thumb: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6c/Gerard_David_selfportrait_in_The_Virgin_among_the_Virgins.jpg/500px-Gerard_David_selfportrait_in_The_Virgin_among_the_Virgins.jpg
  image_page: https://commons.wikimedia.org/wiki/File:Gerard_David_selfportrait_in_The_Virgin_among_the_Virgins.jpg
  image_license: Public domain
  coverage: partly
  coverage_note: Dates, birth and burial places, Bruges career and the one documented work captured; his pupils, illuminated manuscripts and other altarpieces not built out.
  sources:
  - wp-gerard-david
- key: hans-holbein-the-elder
  name: Hans Holbein the Elder
  type: Artist
  roles:
  - painter
  born: 1460
  born_estimated: true
  died: 1524
  prominence: 3
  note: German painter of Augsburg who led the shift from late Gothic to Renaissance style; father of Ambrosius and Hans Holbein the Younger.
  image_url: https://upload.wikimedia.org/wikipedia/commons/d/de/Hans_holbein_the_Elder_self_portrait.jpg
  image_thumb: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/de/Hans_holbein_the_Elder_self_portrait.jpg/500px-Hans_holbein_the_Elder_self_portrait.jpg
  image_page: https://commons.wikimedia.org/wiki/File:Hans_holbein_the_Elder_self_portrait.jpg
  image_license: Public domain
  coverage: partly
  coverage_note: Dates, places, family and his two sons as pupils captured; the altarpieces, windows and drawings not built out.
  sources:
  - wp-hans-holbein-the-elder
- key: dosso-dossi
  name: Dosso Dossi
  type: Artist
  roles:
  - painter
  born: 1489
  born_estimated: true
  died: 1542
  prominence: 3
  note: Italian Renaissance painter of the School of Ferrara and court artist to the Este dukes, known for mythological and allegorical paintings.
  image_url: https://upload.wikimedia.org/wikipedia/commons/7/7c/Dosso_Dossi_%28cropped%29.jpg
  image_thumb: https://upload.wikimedia.org/wikipedia/commons/7/7c/Dosso_Dossi_%28cropped%29.jpg
  image_page: https://commons.wikimedia.org/wiki/File:Dosso_Dossi_(cropped).jpg
  image_license: Public domain
  coverage: partly
  coverage_note: Dates, birthplace and Este court service captured; works are named in the article without dates, so no artwork records yet.
  sources:
  - wp-dosso-dossi
- key: rosso-fiorentino
  name: Rosso Fiorentino
  type: Artist
  roles:
  - painter
  born: '1495-03-08'
  died: '1540-11-14'
  prominence: 4
  note: Florentine Mannerist painter in oil and fresco who worked at the court of Francis I at Fontainebleau; known for the Volterra Deposition.
  image_url: https://upload.wikimedia.org/wikipedia/commons/4/43/Houghton_Typ_525_68.864_-_Vasari%2C_Le_vite_-_Il_Rosso.jpg
  image_thumb: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/43/Houghton_Typ_525_68.864_-_Vasari%2C_Le_vite_-_Il_Rosso.jpg/500px-Houghton_Typ_525_68.864_-_Vasari%2C_Le_vite_-_Il_Rosso.jpg
  image_page: https://commons.wikimedia.org/wiki/File:Houghton_Typ_525_68.864_-_Vasari,_Le_vite_-_Il_Rosso.jpg
  image_license: Public domain
  coverage: partly
  coverage_note: Dates, training, moves to Rome and France captured; the Deposition altarpieces are named without a year in the article, so no artwork records yet.
  sources:
  - wp-rosso-fiorentino
- key: francesco-primaticcio
  name: Francesco Primaticcio
  type: Artist
  roles:
  - painter
  - architect
  - sculptor
  born: '1504-04-30'
  died: 1570
  prominence: 3
  note: Italian Mannerist painter, architect and sculptor of Bologna who spent most of his career in France, directing the decoration of Fontainebleau after Rosso's death.
  image_url: https://upload.wikimedia.org/wikipedia/commons/7/7d/Delle_vite_de%27_pi%C3%B9_eccellenti_pittori%2C_scultori%2C_et_architetti_%281648%29_%2814803742183%29.jpg
  image_thumb: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/Delle_vite_de%27_pi%C3%B9_eccellenti_pittori%2C_scultori%2C_et_architetti_%281648%29_%2814803742183%29.jpg/500px-Delle_vite_de%27_pi%C3%B9_eccellenti_pittori%2C_scultori%2C_et_architetti_%281648%29_%2814803742183%29.jpg
  image_page: https://commons.wikimedia.org/wiki/File:Delle_vite_de%27_pi%C3%B9_eccellenti_pittori,_scultori,_et_architetti_(1648)_(14803742183).jpg
  image_license: Public domain
  coverage: partly
  coverage_note: Dates, training under Giulio Romano, Fontainebleau career and the Salle d'Hercule captured; the Valois Chapel, tapestry cartoons and festival designs not built out.
  sources:
  - wp-francesco-primaticcio
- key: francois-clouet
  name: François Clouet
  type: Artist
  roles:
  - painter
  - miniaturist
  born: 1510
  born_estimated: true
  died: '1572-12-22'
  prominence: 3
  note: French Renaissance miniaturist and painter, son of Jean Clouet, known for detailed portraits of the French royal family.
  image_url: https://upload.wikimedia.org/wikipedia/commons/5/5b/Fran%C3%A7ois-Clouet.jpg
  image_thumb: https://upload.wikimedia.org/wikipedia/commons/5/5b/Fran%C3%A7ois-Clouet.jpg
  image_page: https://commons.wikimedia.org/wiki/File:Fran%C3%A7ois-Clouet.jpg
  image_license: Public domain
  coverage: partly
  coverage_note: Dates, birthplace and royal office captured; attributed portraits are named without years, so no artwork records yet; sitters (Francis I, Henry II, Charles IX, Mary Queen of Scots) not
    in the database.
  sources:
  - wp-francois-clouet
- key: karel-van-mander
  name: Karel van Mander
  type: Artist
  roles:
  - painter
  - playwright
  - poet
  - art historian
  born: 1548
  died: '1606-09-02'
  prominence: 3
  note: Flemish painter, poet and art theorist in the Dutch Republic, best known as author of the Schilder-boeck (1604) and a leader of the Haarlem Mannerists.
  image_url: https://upload.wikimedia.org/wikipedia/commons/a/a6/Karel-van-mander-schilderboeck.JPG
  image_thumb: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a6/Karel-van-mander-schilderboeck.JPG/500px-Karel-van-mander-schilderboeck.JPG
  image_page: https://commons.wikimedia.org/wiki/File:Karel-van-mander-schilderboeck.JPG
  image_license: Public domain
  coverage: partly
  coverage_note: Dates, travels, Haarlem years, pupil Frans Hals and the Schilder-boeck captured; few paintings survive and none are dated in the article; his literary works not built out.
