batch:
  title: "English royal families 3b: the Tudors and Philip II, 1485-1603"
  requested: "Issue #292: parents, spouses (with marriage year) and children who reached 12 for Henry VII, Henry VIII, Edward VI, Lady Jane Grey, Mary I, Philip II of Spain and Elizabeth I"
  date: 2026-10-25
  notes: "Family links for the Tudor monarchs and Philip II of Spain (Mary I's husband, with his four marriages and the children who reached 12), with sex on each monarch and their family. Part 3a covers Lancaster and York."

# Notes for the reviewer
# - Facts checked against each person's own English Wikipedia article (fetched 2026-10-25 with tools/wiki.py).
# - Children left out because they died before 12: Henry VII's Elizabeth (1492-1495), Edmund and Katherine; Henry VIII's
#   children who died as infants; Philip II's Ferdinand (1571-1578), Charles Laurence (1573-1575), Diego Felix (1575-1582) and
#   Maria (1580-1583). Illegitimate children (Henry FitzRoy) are left out. Edward VI, Elizabeth I and Mary I had no children.
# - Henry VIII's marriages: Anne Boleyn's year is 1533, the formal wedding on 25 January; both her article and Henry's also
#   record a secret wedding on 14 November 1532.
# - Elizabeth of York is defined in both 3a and 3b (same key and fields) so this file works whichever merges first; her
#   birth and burial moments are in 3a.
# - Lady Jane Grey's mother Frances is a daughter of Mary Tudor, Queen of France: that link is added too, so Jane's family
#   joins the Tudors. Frances's father, Charles Brandon, 1st Duke of Suffolk, is not in the database and is left for later.
# - Final resting places are used where a body was moved: Edmund Tudor (Greyfriars, Carmarthen, then St Davids Cathedral in
#   1539), Mary Tudor (Bury St Edmunds Abbey, then St Mary's Church), Isabella of Portugal (Royal Chapel of Granada, then El
#   Escorial in 1574), Maria Manuela (Granada, then El Escorial) and Anna of Austria (Badajoz, then El Escorial).
# - Places left out (article silent): birthplaces of Catherine Parr ("it was once thought" Kendal Castle), Lord Guildford
#   Dudley, Anna of Austria ("born in Spain"), Catalina Micaela; burials of Henry Grey, Elisabeth of Valois, Carlos and
#   Catalina Micaela. Henry Grey was born "at Westminster, London", which has no place record of its own: left out.
# - Frances Grey's article says her remains went to Westminster Abbey, where her funeral was held and her tomb is: buried there.
# - Mary Tudor was born at Sheen Palace, rebuilt as Richmond Palace from 1501 (the Wikipedia title redirects): richmond-palace.
# - Arthur was born at Saint Swithun's Priory, the priory of Winchester Cathedral: winchester-cathedral.
# - Elisabeth of Valois: her article gives 2 April 1546 (Wikidata says 1545); the article is used.

