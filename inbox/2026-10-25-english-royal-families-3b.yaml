discrepancies:
  - key: margaret-beaufort-birth-year
    question: Was Lady Margaret Beaufort born in 1441 or 1443?
    about: [{person: lady-margaret-beaufort}]
    field: born
    claims:
      - {value: "1443-05-31", sources: [wp-lady-margaret-beaufort], note: "More likely: in May 1443 her father negotiated with the king over the wardship of his unborn child"}
      - {value: "1441-05-31", sources: [wp-lady-margaret-beaufort], note: "William Dugdale (17th century), from her father's inquisitions post mortem, followed by a number of her biographers (as reported in the same article)"}
    note: "The record uses 1443-05-31."
  - key: margaret-tudor-birth-date
    question: Was Margaret Tudor born on 28 or 29 November 1489?
    about: [{person: margaret-tudor}]
    field: born
    claims:
      - {value: "1489-11-29", sources: [wp-margaret-tudor]}
      - {value: "1489-11-28", sources: [wp-elizabeth-of-york, wp-henry-vii-of-england]}
    note: "The record uses her own article's date, 29 November 1489."
