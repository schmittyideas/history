batch:
  title: "East Asia A: the Song, Liao, Jin and Western Xia emperors, 1022-1279"
  requested: "Renzong to Bing of Song, Xingzong to Tianzuo of Liao, Taizu to Aizong of Jin, Jingzong of Western Xia, Wang Anshi and Yelu Dashi, with the Jingkang incident, the Treaty of Shaoxing and the Battle of Yamen"
  date: 2026-10-11

# Notes for the reviewer
# - Source: local copies of the English Wikipedia articles (wp4 directory); nothing fetched. Every file named in the brief was read in full and checked on its first lines: all are the right article. Several titles differ from the request: Emperor_Bing_of_Song is "Zhao Bing", Emperor_Gongzong_of_Song is "Emperor Gong of Song", and Emperor_Duzong/Lizong/Ningzong/Qinzong/Zhezong are "Emperor Duzong/Lizong/Ningzong/Qinzong/Zhezong" (source URLs below are the ones in the file headers). The wp4 folder also holds Genghis_Khan; it is not mine (batch B) and was not used.
# - Existing records: emperor-zhenzong-of-song is used only as the parent in one link (Renzong). Realms Song dynasty and Liao dynasty are not redefined; titles reuse "Emperor of China" (Song dynasty) and "Emperor of the Liao" (Liao dynasty). Shengzong of Liao and Xiao Chuo are not touched.
# - New realms: Jin dynasty ("Emperor of the Jin"), Western Xia ("Emperor of Western Xia") and Western Liao ("Gurkhan"; region Central Asia, country Kazakhstan because the article puts the first base on the Emil River and Zhetysu in eastern Kazakhstan; its empire also covered Xinjiang, Kyrgyzstan, Uzbekistan and Tajikistan).
# - Song titles: every Song emperor is "Emperor of China", realm Song dynasty, as asked; Southern Song reigns say so in the note and `house` is "House of Zhao". Wang Anshi's title is "Chancellor of Song", realm Song dynasty, 1070-1076 (see discrepancy).
# - Not entered (no article in this batch): Duanzong of Song (Zhao Shi, 1276-1278, he is only named in the Bing and Gong notes), Jin emperors Xuanzong and Wei Shao Wang (Wanyan Yongji, 1209-1213) between Zhangzong and Aizong, and the Western Xia emperors after Jingzong. So Year view shows no Jin ruler 1209-1224 and no Song ruler 1276-1278 from this batch. Yue Fei, Qin Hui, Han Shizhong, Zhang Shijie, Lu Xiufu, Wen Tianxiang, Sima Guang, Fan Zhongyan, Han Tuozhou, Jia Sidao, Shi Miyuan and the Mongol generals are named in notes only (no keys). Consorts, empresses dowager and the very long family lists are not entered.
# - Yue Fei's execution has no date in the Gaozong article (it only says he was put to death before the Treaty of Shaoxing), so no event was entered for it. Linhuang Fu, the Liao Supreme Capital's other name, is in the brief but in none of the articles, so it is not in the place record. Bing's reign start (1278) has no day in the articles: the Bing article's "around 313 days" is not used to compute one. Neither the Song-Jin alliance nor the New Policies have a day in the articles (year only).
# - Dates: where an article gives a month but no day, the year is used. Taizu of Jin's accession (January 1115) is year-only for that reason. Reign starts on the predecessor's death day are used where an article gives it (Gaozong to Xiaozong 24 July 1162; Daozong 1101 and so on are year-only because the article of the successor gives no day). Lunar dates that cross a Gregorian year (the brief's classic case) do not occur in these articles; all dates are used as written. Guangzong's death (17 September 1200) and Ningzong's death (17 September 1224) fall on the same day and month in their articles; both are entered as written, a possible copy error in one of them, not recorded as a discrepancy because no second source disagrees.
# - Coordinates are from general knowledge (2-3 decimals); Wuguocheng, Shangjing (Jin), Caizhou, Balasaghun and Xingqing are approximate. The country of Balasaghun (Kyrgyzstan), "visitable" flags and visit_site names are general knowledge, except the Yamen museum zone and the Jin Dynasty History Museum, which the articles name.
# - Beijing: the record is the modern city. The articles name it Nanjing or Yanjing under the Liao, Zhongdu under the Jin (from 1153) and Dadu under the Yuan; the later Ming capital is from the brief, not these articles.
# - Overlaps: Huizong's title ends 18 January 1126 (his abdication date) and Qinzong's starts in 1126 (year only); Qinzong's ends 20 March 1127, when the Jin demoted him, and Gaozong's starts in 1127 (year only). Yelu Dashi's title starts 1132 (the year he was proclaimed Gurkhan); the article says he ruled as king 1124-1132, so the Year view will show no Western Liao ruler for 1124-1131 (see discrepancy). Wanyan Liang's start is 1150 (year only; the article gives no day).
# - Discrepancies recorded below: Yingzong sending gifts before Renzong died; the Xia-Song peace (1043 or 1044); when Wang Anshi became chancellor; the date of the Jin-Song alliance; the date and place of the fall of the Liao Supreme Capital; when the Liao fell; the month of Taizu of Jin's death; who led the Jin attack of 1125; the Huizong and Qinzong deportation dates and destination; how Qinzong died; when Tianzuo died; the Western Liao founding (1124 or 1132); Yelu Dashi's birth; when Lin'an became the capital; who won the 1140-41 war; how Han Tuozhou died; the 1208 tribute; Duzong's birth year; how Duzong died; Gong's reign start; how Bing died; what happened to Aizong's remains. Seen and not entered as records: Zhezong's age at accession (8 in one place, 9 in another); Xiaozong's rule "about a year" after 1187 against his 1189 abdication (the text says two years); Xingzong's son Heluwo dated "1041 - 1010" (a typo in the article); the 1156 polo story (a Yuan novel) names the Jin ruler 'Prince of Hailing', who was Wanyan Liang, emperor 1150-1161 (noted in the Qinzong and Tianzuo discrepancies).
# - Size: 27 people, 27 title rows, 3 realms, 10 places, 21 events, 22 discrepancies (110 rows), 11 links, 13 moments.

