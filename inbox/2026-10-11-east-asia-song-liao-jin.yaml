places:
  - key: kaifeng
    name: Kaifeng
    historical_name: "Bianjing (Bianliang)"
    kind: city
    region: Henan
    country: China
    lat: 34.797
    lng: 114.307
    visitable: true
    note: "Capital of the Northern Song. The Jin besieged it twice in 1126 and took it on 9 January 1127 (the Jingkang incident). Later the Jin capital (Aizong's article calls Bianjing the Jin capital) until the Mongols besieged it in 1232; the Song retook it with Luoyang in July 1234 (Lizong's article)."
    sources: [wp-jingkang-incident, wp-emperor-zhezong-of-song, wp-emperor-aizong-of-jin, wp-emperor-lizong-of-song]
  - key: hangzhou
    name: Hangzhou
    historical_name: "Lin'an"
    kind: city
    region: Zhejiang
    country: China
    lat: 30.250
    lng: 120.170
    visitable: true
    note: "Capital of the Southern Song as Lin'an. Gaozong fled there in 1129 and declared it the (temporary) capital in 1133 or 1138 (see discrepancy); the Yuan general Bayan took it in early 1276 and Emperor Gong surrendered."
    sources: [wp-emperor-gaozong-of-song, wp-emperor-gongzong-of-song, wp-emperor-bing-of-song]
  - key: beijing
    name: Beijing
    historical_name: "Nanjing or Yanjing (Liao); Zhongdu (Jin, capital from 1153); Dadu (Yuan)"
    kind: city
    region: Beijing
    country: China
    lat: 39.904
    lng: 116.407
    visitable: true
    note: "Modern city. The Liao Southern Capital (Tianzuo fled it in 1122; Yelu Chun's short-lived Northern Liao was set up there). Wanyan Liang moved the Jin court here from Shangjing in 1153. Taizu and Taizong of Jin were buried at Dafangshan outside Zhongdu. After the Song fell, Emperor Gong was taken to Dadu in 1276."
    sources: [wp-wanyan-liang, wp-emperor-tianzuo-of-liao, wp-yelu-dashi, wp-emperor-taizu-of-jin, wp-emperor-taizong-of-jin, wp-emperor-gongzong-of-song]
  - key: yamen-battlefield
