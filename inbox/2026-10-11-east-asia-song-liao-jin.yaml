titles:
  # ---- Song
  - {person: emperor-renzong-of-song, title: Emperor of China, realm: Song dynasty, from: 1022, to: 1063-04-30, note: "Northern Song. Empress Liu was regent until her death in 1033", sources: [wp-emperor-renzong-of-song]}
  - {person: emperor-yingzong-of-song, title: Emperor of China, realm: Song dynasty, from: 1063, to: 1067-01-25, note: "Northern Song. Empress Dowager Cao served as regent while he was ill after his coronation", sources: [wp-emperor-yingzong-of-song]}
  - {person: emperor-shenzong-of-song, title: Emperor of China, realm: Song dynasty, from: 1067, to: 1085-04-01, note: "Northern Song", sources: [wp-emperor-shenzong-of-song]}
  - {person: emperor-zhezong-of-song, title: Emperor of China, realm: Song dynasty, from: 1085, to: 1100-02-23, note: "Northern Song. Grand Empress Dowager Gao was regent until she died in 1093", sources: [wp-emperor-zhezong-of-song]}
  - {person: emperor-huizong-of-song, title: Emperor of China, realm: Song dynasty, from: 1100, to: 1126-01-18, note: "Northern Song. Abdicated on 18 January 1126 to Qinzong and took the title Taishang Huang (Retired Emperor)", sources: [wp-emperor-huizong-of-song]}
  - {person: emperor-qinzong-of-song, title: Emperor of China, realm: Song dynasty, from: 1126, to: 1127-03-20, note: "Last Northern Song emperor. Kaifeng fell on 9 January 1127; the Jin demoted him to commoner on 20 March 1127", sources: [wp-emperor-qinzong-of-song, wp-jingkang-incident]}
  - {person: emperor-gaozong-of-song, title: Emperor of China, realm: Song dynasty, from: 1127, to: 1162-07-24, note: "First Southern Song emperor. Lost the throne from 26 March to 20 April 1129 to a mutiny. Retired Emperor 1162-1187 with continued power", sources: [wp-emperor-gaozong-of-song, wp-emperor-xiaozong-of-song]}
  - {person: emperor-xiaozong-of-song, title: Emperor of China, realm: Song dynasty, from: 1162-07-24, to: 1189, note: "Southern Song. Gaozong kept real power until his death in 1187. Abdicated in 1189 to Guangzong; ruled as Retired Emperor until 1194", sources: [wp-emperor-xiaozong-of-song]}
  - {person: emperor-guangzong-of-song, title: Emperor of China, realm: Song dynasty, from: 1189, to: 1194, note: "Southern Song. Forced to abdicate in 1194 for not attending Xiaozong's funeral", sources: [wp-emperor-guangzong-of-song]}
  - {person: emperor-ningzong-of-song, title: Emperor of China, realm: Song dynasty, from: 1194, to: 1224-09-17, note: "Southern Song", sources: [wp-emperor-ningzong-of-song]}
  - {person: emperor-lizong-of-song, title: Emperor of China, realm: Song dynasty, from: 1224, to: 1264-11-16, note: "Southern Song. Put on the throne by Shi Miyuan and Empress Dowager Yang", sources: [wp-emperor-lizong-of-song]}
  - {person: emperor-duzong-of-song, title: Emperor of China, realm: Song dynasty, from: 1264, to: 1274-08-12, note: "Southern Song", sources: [wp-emperor-duzong-of-song]}
  - {person: emperor-gongzong-of-song, title: Emperor of China, realm: Song dynasty, from: 1274, to: 1276, note: "Southern Song. Enthroned at about four; the Bing article dates his reign from 1275 (see discrepancy). Surrendered at Lin'an in 1276", sources: [wp-emperor-gongzong-of-song, wp-emperor-bing-of-song]}
  - {person: emperor-bing-of-song, title: Emperor of China, realm: Song dynasty, from: 1278, to: 1279-03-19, note: "Last Southern Song emperor. Enthroned in 1278 at Meiwei after his brother Duanzong died (no day given); died at the Battle of Yamen", sources: [wp-emperor-bing-of-song, wp-battle-of-yamen]}
  - {person: wang-anshi, title: Chancellor of Song, realm: Song dynasty, from: 1070, to: 1076, note: "Vice counsellor from 1069; made chancellor a year later per his article. Shenzong's article has him appointed chancellor in 1068 and removed in 1074, then recalled until his permanent retirement in 1076 (see discrepancy)", sources: [wp-wang-anshi, wp-emperor-shenzong-of-song]}
  # ---- Liao
  - {person: emperor-xingzong-of-liao, title: Emperor of the Liao, realm: Liao dynasty, from: 1031, to: 1055-08-28, note: "Succeeded Shengzong in 1031; his mother Xiao Noujin controlled the early reign", sources: [wp-emperor-xingzong-of-liao]}
  - {person: emperor-daozong-of-liao, title: Emperor of the Liao, realm: Liao dynasty, from: 1055, to: 1101-02-12, note: "Succeeded Xingzong in 1055", sources: [wp-emperor-daozong-of-liao]}
  - {person: emperor-tianzuo-of-liao, title: Emperor of the Liao, realm: Liao dynasty, from: 1101, to: 1125, note: "Last Liao emperor; fled in 1122 and was captured by the Jin in 1125", sources: [wp-emperor-tianzuo-of-liao]}
  # ---- Western Liao
  - {person: yelu-dashi, title: Gurkhan, realm: Western Liao, from: 1132, to: 1143, note: "Proclaimed Gurkhan in 1132. The article says he ruled as king from 1124 to 1132 and as emperor and Gurkhan 1132-1143; the king years are not entered under a second title (see discrepancy). Succeeded by his empress Xiao Tabuyan as regent", sources: [wp-yelu-dashi]}
  # ---- Jin
  - {person: emperor-taizu-of-jin, title: Emperor of the Jin, realm: Jin dynasty, from: 1115, to: 1123-09-19, note: "Proclaimed himself emperor in January 1115. Death date: 19 September 1123 in the lead, 'August 1123' in the text (see discrepancy)", sources: [wp-emperor-taizu-of-jin]}
  - {person: emperor-taizong-of-jin, title: Emperor of the Jin, realm: Jin dynasty, from: 1123, to: 1135-02-09, note: "Succeeded his elder brother Aguda", sources: [wp-emperor-taizong-of-jin]}
  - {person: emperor-xizong-of-jin, title: Emperor of the Jin, realm: Jin dynasty, from: 1135, to: 1150-01-09, note: "Murdered by Digunai in a coup on 9 January 1150", sources: [wp-emperor-xizong-of-jin]}
  - {person: wanyan-liang, title: Emperor of the Jin, realm: Jin dynasty, from: 1150, to: 1161-12-15, note: "Seized the throne in the coup of 9 January 1150 (the article gives only the year for his accession). Assassinated 15 December 1161", sources: [wp-wanyan-liang, wp-emperor-xizong-of-jin]}
  - {person: emperor-shizong-of-jin, title: Emperor of the Jin, realm: Jin dynasty, from: 1161, to: 1189-01-20, note: "Became emperor on Wanyan Liang's death. Era name Dading", sources: [wp-emperor-shizong-of-jin, wp-emperor-zhangzong-of-jin]}
  - {person: emperor-zhangzong-of-jin, title: Emperor of the Jin, realm: Jin dynasty, from: 1189-01-20, to: 1208-12-29, note: "Succeeded his grandfather Shizong; his uncle Wanyan Yongji (not entered) followed", sources: [wp-emperor-zhangzong-of-jin]}
  - {person: emperor-aizong-of-jin, title: Emperor of the Jin, realm: Jin dynasty, from: 1224, to: 1234-02-09, note: "Succeeded Xuanzong (not entered) in January 1224. Before his suicide at Caizhou he passed the throne to Wanyan Chenglin, who died the same day, ending the dynasty", sources: [wp-emperor-aizong-of-jin]}
  # ---- Western Xia
  - {person: emperor-jingzong-of-western-xia, title: Emperor of Western Xia, realm: Western Xia, from: 1038, to: 1048-01-19, note: "Declared himself emperor in 1038 with the capital at Xingqing; became Tangut leader in 1032", sources: [wp-emperor-jingzong-of-western-xia]}

discrepancies:
  - key: yingzong-gifts-before-renzong-death-1063
    question: Was Yingzong already emperor on 7 April 1063, when Renzong died on 30 April 1063?
    about: [{person: emperor-yingzong-of-song}, {person: emperor-renzong-of-song}]
    field: date
    claims:
      - {value: "Renzong died on 30 April 1063; Yingzong reigned from 1063", sources: [wp-emperor-renzong-of-song, wp-emperor-yingzong-of-song]}
      - {value: "On 7 April 1063 Yingzong sent gifts including Renzong's calligraphy to the Vietnamese king Ly Thanh Tong, as if already emperor", sources: [wp-emperor-yingzong-of-song]}
    note: "The records use 30 April 1063 for Renzong's death and 1063 (year only) for Yingzong's accession. The 7 April date may be the day the gift was ordered or an error."
  - key: xia-song-peace-1043-or-1044
    question: When did Western Xia and the Song make peace?
    about: [{event: western-xia-founded-1038}, {person: emperor-jingzong-of-western-xia}]
    field: date
    claims:
      - {value: "1043: the Tangut state accepted the Song emperor's recognition in exchange for annual gifts", sources: [wp-emperor-renzong-of-song]}
      - {value: "1044: treaty with nominal Tangut acknowledgment of Song sovereignty and Song tribute payments", sources: [wp-emperor-jingzong-of-western-xia]}
    note: "Neither year is used in a record; both are in the event note."
  - key: wang-anshi-chancellor-start
    question: When did Wang Anshi become chancellor, and did he hold it without a break until 1076?
    about: [{person: wang-anshi}, {event: new-policies-1069}]
    field: from
    claims:
      - {value: "Vice counsellor in 1069, chancellor a year later (1070); resigned in 1076", sources: [wp-wang-anshi]}
      - {value: "Appointed Chancellor in 1068; made head of government in 1069; removed as chief minister in 1074, recalled to replace Lu Huiqing, and retired for good in 1076", sources: [wp-emperor-shenzong-of-song]}
    note: "The title row uses 1070 to 1076 (the Wang Anshi article). The 1074 removal and recall is not entered as two rows."
  - key: jin-song-alliance-date
    question: When was the Jin-Song Alliance Conducted at Sea made?
    about: [{event: alliance-conducted-at-sea-1120}]
    field: date
    claims:
      - {value: "1120", sources: [wp-jingkang-incident]}
      - {value: "Formed over 1115-1123, after Song embassies from 1117; a treaty recognising each other as equals was signed a few months before Aguda's death in 1123", sources: [wp-emperor-taizu-of-jin]}
      - {value: "The Song attacked the Liao from the south in 1122, which shows the alliance existed by then", sources: [wp-emperor-huizong-of-song]}
    note: "The record uses 1120, the only article that gives a specific year for the agreement."
  - key: liao-supreme-capital-fall-1120-or-1122
    question: When and where did the Jin take the Liao Supreme Capital?
    about: [{event: fall-of-liao-supreme-capital-1120}, {place: shangjing-liao}]
    field: date
    claims:
      - {value: "Captured in 1120 (and the Central Capital in 1122)", sources: [wp-emperor-tianzuo-of-liao]}
      - {value: "By 1122 the Jin had captured the 'supreme capital of Chifeng'", sources: [wp-yelu-dashi]}
      - {value: "Shangjing at present-day Bairin Left Banner, Inner Mongolia, sacked; all five Liao capitals fell between 1119 and 1122", sources: [wp-jingkang-incident, wp-emperor-taizu-of-jin]}
    note: "The record uses 1120 and the Bairin Left Banner location; the Chifeng reading would be a different place name."
  - key: liao-fall-1125-or-1120
    question: When did the Liao dynasty end?
    about: [{person: emperor-tianzuo-of-liao}, {event: fall-of-liao-1125}]
    field: date
    claims:
      - {value: "1125: Tianzuo was captured by the Jin", sources: [wp-emperor-tianzuo-of-liao, wp-emperor-taizong-of-jin, wp-emperor-taizu-of-jin]}
      - {value: "About 1120: the Jingkang article says the Jin general defected in 1123, 'three years after the fall of the Liao' and says the Jin sacked the Liao capital and 'ended the Liao dynasty'", sources: [wp-jingkang-incident]}
    note: "The record uses 1125, the year of Tianzuo's capture."
  - key: taizu-of-jin-death-month
    question: When did Aguda, Emperor Taizu of Jin, die?
    about: [{person: emperor-taizu-of-jin}]
    field: died
    claims:
      - {value: "19 September 1123", sources: [wp-emperor-taizu-of-jin]}
      - {value: "August 1123, aged 56", sources: [wp-emperor-taizu-of-jin]}
    note: "Both claims are in one article (the lead and the text); the record uses the lead's 19 September 1123."
  - key: jin-attack-commanders-1125
    question: Who led the Jin attack on the Song in 1125 and 1126?
    about: [{event: jingkang-incident-1127}, {person: emperor-taizong-of-jin}]
    field: people
    claims:
      - {value: "In October 1125 Taizong ordered his fifth brother Wanyan Gao to lead two armies on Bianjing; in August 1126 Wanyan Zongwang and Wanyan Zonghan besieged it again", sources: [wp-emperor-taizong-of-jin]}
      - {value: "The northern army under Wanyan Zongwang and the western army under Wanyan Zonghan led both campaigns (second invasion September 1126)", sources: [wp-jingkang-incident]}
      - {value: "Wolibu and Nianhan (the 'Western Vice-Marshal' and a second vice-marshal) led the 1126 forces", sources: [wp-emperor-huizong-of-song]}
    note: "Names are not entered as people; the event record names Taizong only."
  - key: huizong-qinzong-deportation-1127
    question: When and where were Huizong and Qinzong deported from Kaifeng in 1127?
    about: [{person: emperor-huizong-of-song}, {person: emperor-qinzong-of-song}]
    field: date
    claims:
      - {value: "Huizong deported on 10 May 1127 to Heilongjiang; both made commoners on 20 March 1127; at Shangjing in 1128 (the Jin capital, present-day Harbin)", sources: [wp-emperor-huizong-of-song]}
      - {value: "Both deported on 13 May 1127 to Huining Prefecture, the Jin capital", sources: [wp-emperor-qinzong-of-song]}
      - {value: "Resettled at Wuguocheng (Yilan County, Heilongjiang) in 1128", sources: [wp-emperor-taizong-of-jin]}
    note: "No deportation date is used in any record. The 20 March 1127 demotion is agreed by two articles and is used for Qinzong's title end."
  - key: qinzong-death-manner
    question: How did Qinzong die in 1156?
    about: [{person: emperor-qinzong-of-song}]
    field: died
    claims:
      - {value: "Died in 1156 aged 56 (14 June 1156), possibly of illness", sources: [wp-emperor-qinzong-of-song]}
      - {value: "Trampled to death by horses in a polo match ordered by the Jin ruler (called 'Prince of Hailing'), a story the article calls largely fictitious because it comes from a Yuan novel", sources: [wp-emperor-qinzong-of-song, wp-emperor-tianzuo-of-liao]}
      - {value: "In the same story Qinzong fell from his horse while Tianzuo was shot dead trying to flee", sources: [wp-jingkang-incident]}
    note: "The records use 14 June 1156 for Qinzong's death and give no cause. The 'Prince of Hailing' in the story is Wanyan Liang, who was the Jin emperor in 1156."
  - key: tianzuo-death-1128-or-1156
    question: When did Tianzuo, the last Liao emperor, die?
    about: [{person: emperor-tianzuo-of-liao}]
    field: died
    claims:
      - {value: "1128 of illness, aged 53 (History of Liao)", sources: [wp-emperor-tianzuo-of-liao]}
      - {value: "1156, shot by archers in a polo match, aged 81 (the Da Song Xuanhe Yishi novel, which the article calls largely fictitious)", sources: [wp-emperor-tianzuo-of-liao, wp-jingkang-incident]}
    note: "The record uses 1128."
  - key: western-liao-founding-1124-or-1132
    question: When was the Western Liao founded?
    about: [{person: yelu-dashi}, {event: western-liao-founded-1124}, {event: dashi-proclaimed-gurkhan-1132}]
    field: date
    claims:
      - {value: "1124: Dashi established the Western Liao dynasty after leaving Tianzuo; he ruled as king 1124-1132", sources: [wp-emperor-tianzuo-of-liao, wp-yelu-dashi]}
      - {value: "1132: proclaimed Gurkhan and emperor (regnal name Tianyou)", sources: [wp-yelu-dashi]}
    note: "Both events are recorded. The title row starts in 1132 because only that is a title the article names; the king years would need a second title wording."
  - key: yelu-dashi-birth-1087-or-1094
    question: In what year was Yelu Dashi born?
    about: [{person: yelu-dashi}]
    field: born
    claims:
      - {value: "1087", sources: [wp-yelu-dashi]}
      - {value: "1094", sources: [wp-yelu-dashi]}
    note: "The article says his birth date is not clear and may be either year; the record has no birth year."
  - key: lin-an-capital-1133-or-1138
    question: When did Lin'an become the Southern Song capital?
    about: [{place: hangzhou}, {person: emperor-gaozong-of-song}]
    field: date
    claims:
      - {value: "1133: Gaozong declared Lin'an the dynasty's new temporary capital, replacing Kaifeng", sources: [wp-emperor-gaozong-of-song]}
      - {value: "1138: Gaozong officially declared Lin'an the capital, though still labelled temporary", sources: [wp-emperor-gaozong-of-song]}
    note: "Both claims are in one article. The place record mentions both years."
  - key: jin-song-war-1140-1141-outcome
    question: Who won the Jin-Song war of 1140-1141?
    about: [{person: emperor-xizong-of-jin}, {person: wanyan-liang}]
    field: date
    claims:
      - {value: "The Jin army under Wanyan Zongbi was defeated in 1141 by Yue Fei and Han Shizhong, and the Jin agreed to negotiate", sources: [wp-emperor-xizong-of-jin]}
      - {value: "The Jin dynasty held a 'superior status' after its 1141 victory over the Song", sources: [wp-wanyan-liang]}
    note: "The Treaty of Shaoxing (1142) set the Song as the inferior state; no record states a winner."
  - key: han-tuozhou-death-1207
    question: How and when did Han Tuozhou die?
    about: [{event: jin-song-war-1206}, {person: emperor-ningzong-of-song}, {person: emperor-zhangzong-of-jin}]
    field: died
    claims:
      - {value: "Beaten to death by the Imperial Palace Guards on 15 December 1207; heads of Han and Su Shidan were cut from their exhumed corpses and delivered to the Jin after the treaty of 2 November 1208", sources: [wp-emperor-ningzong-of-song]}
      - {value: "The Song had to execute Han Tuozhou under the treaty and delivered the severed heads of Han Tuozhou and Su Shidan", sources: [wp-emperor-zhangzong-of-jin]}
    note: "A death before the treaty (Ningzong) cannot also be an execution to meet its terms (Zhangzong). Han has no person record."
  - key: jin-song-treaty-1208-tribute
    question: What tribute did the 1208 treaty set?
    about: [{event: jin-song-war-1206}]
    field: terms
    claims:
      - {value: "Tribute reinstated and increased by 50,000 taels of silver and 50,000 packs of fabric", sources: [wp-emperor-ningzong-of-song]}
      - {value: "An annual tribute of 50,000 taels of silver and 50,000 packs of fabric", sources: [wp-emperor-zhangzong-of-jin]}
    note: "The two articles differ on whether 50,000 is the increase or the total."
  - key: duzong-birth-1240-or-1224
    question: In what year was Duzong born?
    about: [{person: emperor-duzong-of-song}]
    field: born
    claims:
      - {value: "2 May 1240 (lead)", sources: [wp-emperor-duzong-of-song]}
      - {value: "'born in 1224' (early life section)", sources: [wp-emperor-duzong-of-song]}
    note: "Both claims are in one article. The record uses 1240; he was adopted in 1253 and died aged 34 in 1274."
  - key: duzong-death-cause
    question: How did Duzong die?
    about: [{person: emperor-duzong-of-song}]
    field: died
    claims:
      - {value: "Overindulgence in wine", sources: [wp-emperor-duzong-of-song, wp-emperor-gongzong-of-song]}
      - {value: "Sudden death from a Palace Doctor's severe negligence (Richard L. Davis and others)", sources: [wp-emperor-duzong-of-song]}
    note: "No cause is in the record."
  - key: gongzong-reign-start-1274-or-1275
    question: When did Emperor Gong's reign begin, and when did Duanzong's?
    about: [{person: emperor-gongzong-of-song}, {person: emperor-bing-of-song}]
    field: from
    claims:
      - {value: "Gong enthroned at about four after Duzong died in 1274; abdicated in 1276; Duanzong enthroned 14 June 1276 at Fuzhou, died 1278", sources: [wp-emperor-gongzong-of-song, wp-emperor-duzong-of-song, wp-emperor-bing-of-song]}
      - {value: "Gong reigned 1275-1276 and Duanzong 1276-1278 (in the Bing article's text)", sources: [wp-emperor-bing-of-song]}
    note: "The record uses 1274 (Duzong's death date is 12 August 1274). Gong's article places the regency of Empress Dowager Xie and Quan in 1275."
  - key: bing-death-manner-yamen
    question: How and where did Emperor Bing die at Yamen?
    about: [{person: emperor-bing-of-song}, {event: battle-of-yamen-1279}]
    field: place
    claims:
      - {value: "Lu Xiufu leapt with the boy emperor from coastal clifftops where they had watched the battle", sources: [wp-emperor-bing-of-song]}
      - {value: "Lu Xiufu carried him to a cliff and they threw themselves into the sea", sources: [wp-emperor-bing-of-song]}
      - {value: "Lu Xiufu, with the emperor's boat at the centre of the chained fleet, jumped into the sea and both drowned", sources: [wp-battle-of-yamen]}
    note: "The record gives the date (19 March 1279, agreed by both articles) and the place Yamen, no cause beyond drowning. The Bing article says the grave in Chiwan, Shenzhen is not authenticated; the Yamen article says the body was found near Shekou and the grave is not found."
  - key: aizong-remains-fate
    question: What happened to Aizong's body after the fall of Caizhou?
    about: [{person: emperor-aizong-of-jin}]
    field: died
    claims:
      - {value: "His remains were divided: the Mongol general Taghachar took his hands and the rest went to Lin'an, offered in the Song ancestral temple, then buried in a prison vault", sources: [wp-emperor-aizong-of-jin]}
      - {value: "Cremated by his bodyguards and the ashes dumped in the river (Rashid al-Din)", sources: [wp-emperor-aizong-of-jin]}
    note: "Both accounts are in one article. Not used in a record."
