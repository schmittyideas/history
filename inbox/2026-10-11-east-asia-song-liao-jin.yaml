    historical_name: "Yashan"
    kind: battlefield
    city: Jiangmen
    region: Guangdong
    country: China
    lat: 22.230
    lng: 113.050
    visitable: true
    visit_site: "Song-Yuan Yamen Sea Warfare Culture Tourist Zone"
    note: "Bay in what is now the town of Yamen, Xinhui, where the Song fleet was destroyed on 19 March 1279. The museum complex named above lies just east of the battle site."
    sources: [wp-battle-of-yamen, wp-emperor-bing-of-song]
