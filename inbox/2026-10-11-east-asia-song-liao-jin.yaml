people:
  # ---- Northern and Southern Song
  - key: emperor-renzong-of-song
    name: Emperor Renzong of Song
    type: Royalty
    realm: Song dynasty
    house: House of Zhao
    born: 1010-05-30
    died: 1063-04-30
    prominence: 3
    note: "Zhao Zhen, fourth Northern Song emperor and sixth son of Zhenzong. Came to the throne at 12 in 1022; his adoptive mother Empress Liu was regent and kept power until her death in 1033, past 1027 when he could have ruled. Longest-reigning Song emperor (about 41 years). Qingli Reforms c.1040-1045, the 1057 examinations that produced Su Shi, Su Zhe and Zeng Gong, and Bi Sheng's movable type c.1040. Refused to call Li Yuanhao emperor in 1038; peace came in 1043 or 1044. Took in Zhao Zongshi (Yingzong) as heir in 1055."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-emperor-renzong-of-song]
  - key: emperor-yingzong-of-song
    name: Emperor Yingzong of Song
    type: Royalty
    realm: Song dynasty
    house: House of Zhao
    born: 1032-02-16
    died: 1067-01-25
    prominence: 2
    note: "Zhao Shu (born Zhao Zongshi), fifth Song emperor, a 13th son of Zhao Yunrang and adopted heir of Renzong. Sickly after his coronation, so Empress Dowager Cao was regent until Han Qi removed the screen. The Great Rites style dispute over honouring his birth father. Ordered Sima Guang in 1065 to begin the Zizhi Tongjian. Died young; succeeded by his son Shenzong."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-emperor-yingzong-of-song]
  - key: emperor-shenzong-of-song
    name: Emperor Shenzong of Song
    type: Royalty
    realm: Song dynasty
    house: House of Zhao
    born: 1048-05-25
    died: 1085-04-01
    prominence: 3
    note: "Zhao Xu (born Zhao Zhongzhen), sixth Song emperor. Wanted conquest and fiscal reform; backed Wang Anshi's New Policies from 1069, then ran the Yuanfeng Reforms himself after Wang retired in 1076. Sima Guang published the Zizhi Tongjian in 1084. His 1082 defeat at Yongle City against Western Xia broke his spirit; he died aged 36."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-emperor-shenzong-of-song]
  - key: emperor-zhezong-of-song
    name: Emperor Zhezong of Song
    type: Royalty
    realm: Song dynasty
    house: House of Zhao
    born: 1077-01-04
    died: 1100-02-23
    prominence: 2
    note: "Zhao Xu (born Zhao Yong), seventh Song emperor, sixth son of Shenzong. Came to the throne as a child with his grandmother Grand Empress Dowager Gao as regent, who halted the New Policies; after her death in 1093 he restored them (era name Shaosheng from 1094) and the court split into factions. Renewed war against Western Xia and took the Song to its greatest extent. Died in Kaifeng aged 23; his son had died before him, so his brother Huizong succeeded."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-emperor-zhezong-of-song]
  - key: emperor-huizong-of-song
    name: Emperor Huizong of Song
    type: Royalty
    roles: [painter, calligrapher, poet]
    realm: Song dynasty
    house: House of Zhao
    born: 1082-11-02
    died: 1135-06-04
    prominence: 4
    note: "Zhao Ji, eighth Song emperor, 11th son of Shenzong. A major painter, calligrapher (the Slender Gold style), poet, musician and patron; his collection held more than 6,000 paintings. His court was dominated by Cai Jing and the 'Six Thieves', and the flower-and-stone fleet fed the Fang La uprising. Allied with the Jin against the Liao, then abdicated on 18 January 1126 to Qinzong. Taken captive with his son in the Jingkang incident, given the insulting title Duke Hunde, and died at Wuguocheng after nearly a decade in captivity."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts, court and his many works not entered; no artworks"
    sources: [wp-emperor-huizong-of-song, wp-jingkang-incident]
  - key: emperor-qinzong-of-song
    name: Emperor Qinzong of Song
    type: Royalty
    realm: Song dynasty
    house: House of Zhao
    born: 1100-05-23
    died: 1156-06-14
    prominence: 3
    note: "Zhao Huan, ninth Song emperor and last of the Northern Song, eldest son of Huizong. Took the throne in 1126 as the Jin besieged Kaifeng, dismissed Li Gang, bought off the first siege, then angered the Jin by plotting with their Liao envoys. Captured with his father on the fall of Kaifeng (9 January 1127), demoted to commoner on 20 March 1127, and died in Jin captivity, where he lived two-thirds of his life."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-emperor-qinzong-of-song, wp-jingkang-incident]
  - key: emperor-gaozong-of-song
    name: Emperor Gaozong of Song
    type: Royalty
    realm: Song dynasty
    house: House of Zhao
    born: 1107-06-12
    died: 1187-11-09
    prominence: 4
    note: "Zhao Gou, ninth son of Huizong and first emperor of the Southern Song (1127-1162). Outside Kaifeng when it fell, he was proclaimed emperor, fled from Yingtianfu to Yangzhou to Lin'an, lost his throne for about a month in a mutiny in 1129, and made Lin'an the capital. With Qin Hui he made the Treaty of Shaoxing in 1142 (the Song became a Jin tributary) and had Yue Fei put to death on a trumped-up charge, a deed that damaged his reputation. His only son died young; he adopted Xiaozong, abdicated on 24 July 1162 and ruled as Retired Emperor until his death."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-emperor-gaozong-of-song, wp-emperor-xiaozong-of-song]
  - key: emperor-xiaozong-of-song
    name: Emperor Xiaozong of Song
    type: Royalty
    realm: Song dynasty
    house: House of Zhao
    born: 1127-11-27
    died: 1194-06-28
    prominence: 3
    note: "Zhao Shen, 11th Song emperor and second of the Southern Song; a seventh-generation descendant of Taizu adopted by Gaozong in 1160. Emperor from 24 July 1162 but only ruled in full after Gaozong died in 1187; made peace with the Jin in 1165, rehabilitated Yue Fei, steadied the paper currency and is seen as the best Southern Song ruler. Abdicated in 1189 to Guangzong and ruled as Retired Emperor until his death."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-emperor-xiaozong-of-song]
  - key: emperor-guangzong-of-song
    name: Emperor Guangzong of Song
    type: Royalty
    realm: Song dynasty
    house: House of Zhao
    born: 1147-09-30
    died: 1200-09-17
    prominence: 2
    note: "Zhao Dun, 12th Song emperor and third of the Southern Song, third son of Xiaozong. Ill and dominated by Empress Li Fengniang; avoided his father, did not visit him in his last illness or attend his funeral, and was forced out in 1194 in favour of his son Ningzong. Died in 1200."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-emperor-guangzong-of-song, wp-emperor-xiaozong-of-song]
  - key: emperor-ningzong-of-song
    name: Emperor Ningzong of Song
    type: Royalty
    realm: Song dynasty
    house: House of Zhao
    born: 1168-11-19
    died: 1224-09-17
    prominence: 2
    note: "Zhao Kuo, 13th Song emperor and fourth of the Southern Song. Weak-willed; the chancellor Han Tuozhou launched a failed war on the Jin on 14 June 1206 and was killed in 1207; peace followed on 2 November 1208 with a heavier tribute. Zhu Xi's Neo-Confucianism was banned 1198-1202. Patron of Liang Kai and Ma Yuan. All his children died young, so Lizong succeeded."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-emperor-ningzong-of-song]
  - key: emperor-lizong-of-song
    name: Emperor Lizong of Song
    type: Royalty
    realm: Song dynasty
    house: House of Zhao
    born: 1205-01-26
    died: 1264-11-16
    prominence: 2
    note: "Zhao Yun, 14th Song emperor and fifth of the Southern Song; a distant descendant of Taizu found in obscurity in Shaoxing and put on the throne in 1224 by the chancellor Shi Miyuan. Delegated rule for most of his 40 years. Joined the Mongols against the Jin in 1234, then lost Luoyang and faced the Mongol conquest under Mongke from 1257. A skilled calligrapher. Died without sons; his adopted nephew Duzong succeeded."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-emperor-lizong-of-song]
  - key: emperor-duzong-of-song
    name: Emperor Duzong of Song
    type: Royalty
    realm: Song dynasty
    house: House of Zhao
    born: 1240-05-02
    died: 1274-08-12
    prominence: 2
    note: "Zhao Qi, 15th Song emperor and sixth of the Southern Song, Lizong's nephew and adopted heir. The chancellor Jia Sidao ran the state while he indulged himself; Xiangyang fell to the Mongols in 1274. He died that year; reports differ on the cause. He left three young sons, two of whom became emperors."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-emperor-duzong-of-song]
  - key: emperor-gongzong-of-song
    name: Emperor Gong of Song
    type: Royalty
    realm: Song dynasty
    house: House of Zhao
    born: 1271-11-02
    died: 1323
    prominence: 2
    note: "Zhao Xian, 16th Song emperor and seventh of the Southern Song, enthroned at about four. With Grand Empress Dowager Xie as regent he surrendered to the Yuan general Bayan at Lin'an in 1276. Kublai Khan made him Duke of Ying; he was sent to Tibet in 1288, became a monk and translator at Sakya, and per the Sakya records was ordered to kill himself at Hexi in 1323."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-emperor-gongzong-of-song]
  - key: emperor-bing-of-song
    name: Zhao Bing (Emperor Bing of Song)
    type: Royalty
    realm: Song dynasty
    house: House of Zhao
    born: 1272-02-12
    died: 1279-03-19
    prominence: 3
    note: "Seventh son of Duzong, 18th and last Song emperor and ninth and last of the Southern Song. After Lin'an fell he escaped south, was enthroned in 1278 at Meiwei (Mui Wo, Lantau) under the era name Xiangxing, and moved to Yamen. When the Yuan won the naval Battle of Yamen on 19 March 1279, the minister Lu Xiufu carried the seven-year-old into the sea and both drowned, ending the Song dynasty. An older brother, Zhao Shi (Duanzong), reigned 1276-1278 and is not entered."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-emperor-bing-of-song, wp-battle-of-yamen]
  - key: wang-anshi
    name: Wang Anshi
    type: Nobility
    roles: [statesman, poet]
    realm: Song dynasty
    born: 1021-12-08
    died: 1086-05-21
    prominence: 4
    note: "Chancellor under Shenzong and author of the New Policies, a set of state-led finance, trade, defence and education reforms (green sprouts loans, market exchange, baojia militia, equal tax law and others) that split the court into Reformers and the Conservatives led by Sima Guang. Passed the jinshi in 1042; sent Renzong a ten-thousand-character memorial in 1058. Resigned in 1076; the policies were abolished after Shenzong died in 1085 and revived under Zhezong and Huizong. Also a major poet and one of the Eight Great Prose Masters."
    coverage: partly
    coverage_note: "dates, the chancellorship and the New Policies from the English Wikipedia article; individual laws, poetry and writings not entered; no artworks"
    sources: [wp-wang-anshi, wp-emperor-shenzong-of-song]

  # ---- Liao and Western Liao
  - key: emperor-xingzong-of-liao
    name: Emperor Xingzong of Liao
    type: Royalty
    realm: Liao dynasty
    house: Yelü
    born: 1016-04-03
    died: 1055-08-28
    prominence: 2
    note: "Yelü Zongzhen (Zhigu), seventh Liao emperor and eldest son of Shengzong. His mother Xiao Noujin dominated his reign and tried to replace him with his brother Zhongyuan, who told him; she was sent away from the palace. Failed against Western Xia (sandstorms) but pressed the Song into raising its indemnities. The article calls his reign the beginning of the end for the Liao: corruption, high taxes and a failing army. Succeeded by his son Daozong."
    coverage: partly
    coverage_note: "reign, life dates and a summary of the reign from the English Wikipedia article; consorts and court not entered; no artworks"
    sources: [wp-emperor-xingzong-of-liao]
  - key: emperor-daozong-of-liao
    name: Emperor Daozong of Liao
    type: Royalty
    realm: Liao dynasty
    house: Yelü
    born: 1032-09-14
    died: 1101-02-12
    prominence: 3
    note: "Yelü Hongji (Chala), eighth Liao emperor. Revived the dynastic name Great Liao in 1066, finished the Liao Tripitaka and built the Sakyamuni Pagoda (1056). Put down the 1063 rebellion of Zhongyuan after being wounded on a hunt. His minister Yelü Yixin framed Empress Xiao Guanyin (forced to suicide 1075) and the crown prince Yelü Jun (killed 1077); Yixin fell in 1080. His grandson Yanxi (Tianzuo) was raised as heir. Corruption and Jurchen unrest grew."
    coverage: partly
    coverage_note: "reign, life dates and main court events from the English Wikipedia article; consorts and ministers not entered; no artworks"
    sources: [wp-emperor-daozong-of-liao]
  - key: emperor-tianzuo-of-liao
    name: Emperor Tianzuo of Liao
    type: Royalty
    realm: Liao dynasty
    house: Yelü
    born: 1075-06-05
    died: 1128
    prominence: 3
    note: "Yelü Yanxi, ninth and last Liao emperor, grandson of Daozong. The Jurchen Jin, founded in 1115, took his Supreme Capital in 1120 and Central Capital in 1122; he fled the Southern Capital that year, then to Western Xia, and was captured by the Jin in 1125, the end of the Liao. His general Yelu Dashi left him in 1124 and founded the Western Liao. The year of his death is disputed (1128 in the History of Liao; 1156 in a novel)."
    coverage: partly
    coverage_note: "reign, life dates and the fall of the Liao from the English Wikipedia article; consorts and children not entered; no artworks"
    sources: [wp-emperor-tianzuo-of-liao]
  - key: yelu-dashi
    name: Yelü Dashi
    type: Royalty
    realm: Western Liao
    house: Yelü
    died: 1143
    prominence: 4
    note: "Founder of the Western Liao (Qara Khitai), also known as Emperor Dezong. An eighth-generation descendant of Liao Taizu who passed the top exam in 1115, held posts at Taizhou and Xiangzhou, and left the failing Liao in 1124 for Kedun. From 1130 he led his followers west; in 1132 he was proclaimed Gurkhan, in 1134 he took Balasaghun, and in 1141 he beat the Seljuk sultan Sanjar at the Battle of Qatwan, making the Qara Khitai dominant in Central Asia and making Khwarazm and the Karakhanids vassals. His birth year is uncertain (1087 or 1094). The Prester John legend is linked to him."
    coverage: partly
    coverage_note: "dates, the westward move, Gurkhan title and Qatwan from the English Wikipedia article; his later administration and successors not entered; no artworks"
    sources: [wp-yelu-dashi]

  # ---- Jin
  - key: emperor-taizu-of-jin
    name: Emperor Taizu of Jin
    type: Royalty
    realm: Jin dynasty
    house: Wanyan
    born: 1068-08-01
    died: 1123-09-19
    prominence: 4
    note: "Aguda (Wanyan Min), founder and first emperor of the Jin. Unified the Jurchen tribes, rebelled against the Liao in September 1114, declared himself emperor in January 1115 and took all five Liao capitals between 1119 and 1122. Allied with the Song against the Liao (the Alliance Conducted at Sea) and set up the Mingan-Mouke system and the Jurchen script. Died in 1123 (August or 19 September, see discrepancy); buried at Dafangshan outside Zhongdu. Temple name Taizu was given in 1145."
    coverage: partly
    coverage_note: "reign, life dates and the founding wars from the English Wikipedia article; consorts and sons not entered; no artworks"
    sources: [wp-emperor-taizu-of-jin]
  - key: emperor-taizong-of-jin
    name: Emperor Taizong of Jin
    type: Royalty
    realm: Jin dynasty
    house: Wanyan
    born: 1075-11-25
    died: 1135-02-09
    prominence: 3
    note: "Wuqimai (Wanyan Sheng), younger brother of Aguda and second Jin emperor. Ended the Liao by capturing Tianzuo in 1125, then attacked the Song from October 1125 and took Kaifeng in the Jingkang incident. In 1128 he gave Huizong and Qinzong insulting titles and resettled them at Wuguocheng. Named his grand-nephew Hela (Xizong) heir. Died in 1135 at Mingde Palace; his descendants were massacred by Wanyan Liang, and his remains were moved to Dafangshan."
    coverage: partly
    coverage_note: "reign, life dates and main events from the English Wikipedia article; sons not entered; no artworks"
    sources: [wp-emperor-taizong-of-jin]
  - key: emperor-xizong-of-jin
    name: Emperor Xizong of Jin
    type: Royalty
    realm: Jin dynasty
    house: Wanyan
    born: 1119-02-28
    died: 1150-01-09
    prominence: 2
    note: "Hela (Wanyan Dan), third Jin emperor and grandson of Aguda. Reformed the state on Han lines (Three Departments system) and abolished the bojilie succession custom; ended the Qi state of Liu Yu in 1137. The 1139 treaty with the Song was broken in 1140 and the Jin army was beaten in 1141. After his two sons died he turned to drink and killed indiscriminately (one victim was the Mongol chief Ambaghai); overthrown and murdered by Digunai (Wanyan Liang) on 9 January 1150."
    coverage: partly
    coverage_note: "reign, life dates and main events from the English Wikipedia article; consorts not entered; no artworks"
    sources: [wp-emperor-xizong-of-jin]
  - key: wanyan-liang
    name: Wanyan Liang
    type: Royalty
    realm: Jin dynasty
    house: Wanyan
    born: 1122-02-24
    died: 1161-12-15
    prominence: 3
    note: "Digunai, the Prince of Hailing, fourth Jin emperor. Seized the throne by murdering Xizong in 1150, killed Taizong's descendants, and moved the capital from Shangjing to Yanjing (Beijing) in 1153 as part of a policy of sinicisation. His 1161 invasion of the Southern Song failed at Tangdao and Caishi; his officers assassinated him on 15 December 1161 near the Yangtze. Demoted to prince in 1162 and to commoner in 1181 by Shizong."
    coverage: partly
    coverage_note: "reign, life dates and main events from the English Wikipedia article; consorts and children not entered; no artworks"
    sources: [wp-wanyan-liang]
  - key: emperor-shizong-of-jin
    name: Emperor Shizong of Jin
    type: Royalty
    realm: Jin dynasty
    house: Wanyan
    born: 1123-03-29
    died: 1189-01-20
    prominence: 3
    note: "Wulu (Wanyan Yong), fifth Jin emperor, grandson of Aguda. Rebelled against Digunai in 1161, became emperor on his death, abandoned the war on the Song and reversed sinicisation; promoted the Jurchen language (translations, a Jurchen jinshi from 1173). The longest and most stable Jin reign, called a 'miniature of Yao and Shun'."
    coverage: partly
    coverage_note: "reign, life dates and the policies from the English Wikipedia article; consorts and sons not entered; no artworks"
    sources: [wp-emperor-shizong-of-jin]
  - key: emperor-zhangzong-of-jin
    name: Emperor Zhangzong of Jin
    type: Royalty
    realm: Jin dynasty
    house: Wanyan
    born: 1168-08-31
    died: 1208-12-29
    prominence: 2
    note: "Madage (Wanyan Jing), sixth Jin emperor, grandson of Shizong. Built Taiye Lake in Beijing and Confucian temples; later favoured Concubine Li Shi'er and neglected government. The Tatars rebelled and joined the Mongols; the Song chancellor Han Tuozhou's 1206 invasion failed. All six sons died young, so his uncle Wanyan Yongji succeeded."
    coverage: partly
    coverage_note: "reign, life dates and main events from the English Wikipedia article; consorts not entered; no artworks"
    sources: [wp-emperor-zhangzong-of-jin]
  - key: emperor-aizong-of-jin
    name: Emperor Aizong of Jin
    type: Royalty
    realm: Jin dynasty
    house: Wanyan
    born: 1198-09-25
    died: 1234-02-09
    prominence: 3
    note: "Ningjiasu (Wanyan Shouxu), ninth and last Jin emperor, third son of Xuanzong. Ended the wars with the Song and Western Xia and reformed the state, but the Mongols conquered Western Xia in 1227 and crushed the Jin at Sanfengshan in 1232. He fled Kaifeng that year to Guide, then Caizhou. As the Mongols and the Song took Caizhou on 9 February 1234 he named Wanyan Chenglin his successor and hanged himself. Wanyan Chenglin died fighting; with that the dynasty ended."
    coverage: partly
    coverage_note: "reign, life dates and the fall of the Jin from the English Wikipedia article; consorts not entered; no artworks"
    sources: [wp-emperor-aizong-of-jin]

  # ---- Western Xia
  - key: emperor-jingzong-of-western-xia
    name: Emperor Jingzong of Western Xia
    type: Royalty
    realm: Western Xia
    house: Weiming (Li)
    born: 1003-06-07
    died: 1048-01-19
    prominence: 3
    note: "Li Yuanhao (Weiming Yuanhao), founding emperor of the Western Xia. Became Tangut leader in 1032, dropped the Song surname Zhao for Weiming, ordered the Tangut script, attacked Huanqing in 1034, took the Hexi Corridor from the Uyghurs and in 1038 declared himself emperor with the capital at Xingqing. Won three costly victories over the Song; peace came in 1043 or 1044. Wounded by his son Ningling Ge in a plot with the minister Mozang Epang and died days later in 1048."
    coverage: partly
    coverage_note: "reign, life dates, the founding and campaigns from the English Wikipedia article; consorts and administration not entered; no artworks"
    sources: [wp-emperor-jingzong-of-western-xia]

events:
  - key: qingli-reforms-1040
    name: Qingli Reforms
    type: Reform
    year: 1040
    end_year: 1045
    estimated: true
    people:
      - {person: emperor-renzong-of-song, role: sponsor}
    prominence: 3
    note: "Reform attempt begun around 1040-1045, pressed by Fan Zhongyan, Fu Bi, Han Qi and Ouyang Xiu: farming, land reclamation, fewer sub-official units, local militias and lower military cost. Conservatives opposed it and it was dropped after Fan Zhongyan resigned. Seen as a precursor of later reforms."
    sources: [wp-emperor-renzong-of-song]
  - key: western-xia-founded-1038
    name: Li Yuanhao proclaims the Western Xia
    type: Founding
    year: 1038
    place: xingqing
    people:
      - {person: emperor-jingzong-of-western-xia, role: founder}
      - {person: emperor-renzong-of-song, role: refused recognition}
    prominence: 3
    note: "The Tangut chief Li Yuanhao named himself emperor of Da Xia and demanded recognition as an equal. The Song court recognised him only as governor; Tangut acceptance of the Song emperor's seniority in exchange for annual gifts came in 1043 or 1044."
    sources: [wp-emperor-jingzong-of-western-xia, wp-emperor-renzong-of-song]
  - key: new-policies-1069
    name: Wang Anshi's New Policies
    type: Reform
    year: 1069
    end_year: 1085
    people:
      - {person: wang-anshi, role: reformer}
      - {person: emperor-shenzong-of-song, role: sponsor}
    prominence: 4
    note: "Shenzong made Wang Anshi head of government in 1069 and backed his New Policies: green sprouts loans, labour recruitment, balanced delivery, market exchange, equal tax, baojia militia, general and troops, three colleges. Abolished after Shenzong died in 1085 (end year given for that); revived under Zhezong from 1093 and continued under Huizong. No day is given for the start."
    sources: [wp-wang-anshi, wp-emperor-shenzong-of-song]
  - key: battle-of-yongle-city-1082
    name: Battle of Yongle City
    type: Battle
    year: 1082
    people:
      - {person: emperor-shenzong-of-song, role: defeated}
    prominence: 2
    note: "Song defeat in Shenzong's invasion of Western Xia. It broke Shenzong's spirit and strengthened Western Xia."
    sources: [wp-emperor-shenzong-of-song]
  - key: alliance-conducted-at-sea-1120
    name: Alliance Conducted at Sea
    type: Treaty
    year: 1120
    people:
      - {person: emperor-huizong-of-song, role: party}
      - {person: emperor-taizu-of-jin, role: party}
    prominence: 3
    note: "Jin-Song military alliance against the Liao: the Song would attack from the south and receive the Sixteen Prefectures. The date is disputed between articles (see discrepancy). The Song army then failed against the Liao and the Jin sold the Sixteen Prefectures at a price."
    sources: [wp-jingkang-incident, wp-emperor-taizu-of-jin, wp-emperor-huizong-of-song]
  - key: fall-of-liao-supreme-capital-1120
    name: Jin capture of the Liao Supreme Capital
    type: Battle
    year: 1120
    place: shangjing-liao
    people:
      - {person: emperor-taizu-of-jin, role: victor}
      - {person: emperor-tianzuo-of-liao, role: defeated}
    prominence: 3
    note: "The Jin took the Liao Supreme Capital in 1120 (Tianzuo's article) or by 1122 (Dashi's article); Taizu's article says all five Liao capitals fell 1119-1122. Place and date are both disputed (see discrepancy)."
    sources: [wp-emperor-tianzuo-of-liao, wp-yelu-dashi, wp-jingkang-incident, wp-emperor-taizu-of-jin]
  - key: founding-of-jin-1115
    name: Founding of the Jin dynasty
    type: Founding
    year: 1115
    people:
      - {person: emperor-taizu-of-jin, role: founder}
    prominence: 4
    note: "Aguda proclaimed himself emperor in January 1115 (no day given), taking the regnal name Shouguo, after rising against the Liao in September 1114."
    sources: [wp-emperor-taizu-of-jin]
  - key: fall-of-liao-1125
    name: Fall of the Liao dynasty
    type: Conquest
    year: 1125
    people:
      - {person: emperor-tianzuo-of-liao, role: captured}
      - {person: emperor-taizong-of-jin, role: victor}
    prominence: 4
    note: "The Jin general Wanyan Loushi captured Tianzuo, ending the Liao dynasty. (The Jingkang article's phrasing implies the Liao fell about 1120; see discrepancy.)"
    sources: [wp-emperor-tianzuo-of-liao, wp-emperor-taizong-of-jin]
  - key: western-liao-founded-1124
    name: Yelu Dashi founds the Western Liao
    type: Founding
    year: 1124
    people:
      - {person: yelu-dashi, role: founder}
    prominence: 3
    note: "Dashi left Tianzuo in 1124 with Liao officials for the garrison town of Kedun and the Tianzuo and Dashi articles date the Western Liao to this move. He ruled as king 1124-1132, then as emperor and Gurkhan (see the 1132 event and discrepancy)."
    sources: [wp-emperor-tianzuo-of-liao, wp-yelu-dashi]
  - key: dashi-proclaimed-gurkhan-1132
    name: Yelu Dashi proclaimed Gurkhan
    type: Proclamation
    year: 1132
    people:
      - {person: yelu-dashi, role: proclaimed}
    prominence: 3
    note: "His followers proclaimed him Gurkhan with the regnal name Tianyou. He took Balasaghun in 1134 and made it his capital."
    sources: [wp-yelu-dashi]
  - key: battle-of-qatwan-1141
    name: Battle of Qatwan
    type: Battle
    year: 1141
    people:
      - {person: yelu-dashi, role: victor}
    prominence: 4
    note: "Decisive Qara Khitai victory over the Seljuk sultan Ahmad Sanjar; Sanjar escaped but his wife and warriors were captured. Seljuk power declined, and Khwarazm and the Karakhanids became vassals."
    sources: [wp-yelu-dashi]
  - key: jingkang-incident-1127
    name: Jingkang incident (fall of Kaifeng)
    type: Siege
    date: 1127-01-09
    place: kaifeng
    people:
      - {person: emperor-qinzong-of-song, role: captured}
      - {person: emperor-huizong-of-song, role: captured}
      - {person: emperor-taizong-of-jin, role: victor}
      - {person: emperor-gaozong-of-song, role: escaped}
    prominence: 5
    note: "The Jin took Bianjing on 9 January 1127 after a second siege (the first, in early 1126, was ended by a ransom). They captured Qinzong, Huizong and over 14,000 people, looted the city, demoted the two emperors to commoners on 20 March 1127 and marched them north. The Northern Song ended; Zhao Gou, absent from the city, founded the Southern Song."
    sources: [wp-jingkang-incident, wp-emperor-huizong-of-song, wp-emperor-qinzong-of-song]
  - key: southern-song-founded-1127
    name: Founding of the Southern Song
    type: Founding
    year: 1127
    people:
      - {person: emperor-gaozong-of-song, role: founder}
    prominence: 4
    note: "Zhao Gou was proclaimed Emperor Gaozong with the era name Jianyan at Jiankang (present-day Nanjing, not a place record here), then moved to Yingtianfu, Yangzhou and Lin'an. The articles give no day."
    sources: [wp-emperor-gaozong-of-song, wp-jingkang-incident]
  - key: mutiny-of-miao-and-liu-1129
    name: Mutiny of Miao Fu and Liu Zhengyan
    type: Mutiny
    date: 1129-03-26
    end_year: 1129
    people:
      - {person: emperor-gaozong-of-song, role: deposed}
    prominence: 2
    note: "Palace guards led by Miao Fu and Liu Zhengyan killed Wang Yuan and forced Gaozong to abdicate for his two-year-old son Zhao Fu. Han Shizhong defeated them on 20 April 1129 and Gaozong was restored."
    sources: [wp-emperor-gaozong-of-song]
  - key: treaty-of-shaoxing-1142
    name: Treaty of Shaoxing
    type: Treaty
    date: 1142-10-11
    people:
      - {person: emperor-gaozong-of-song, role: signatory}
      - {person: emperor-xizong-of-jin, role: counterparty}
      - {person: emperor-qinzong-of-song, role: held captive}
    prominence: 4
    note: "Gaozong gave up all land north of the Huai River, accepted vassal status to the Jin and agreed to pay 250,000 taels of silver and 250,000 packs of silk a year. It ended Qinzong's chance of release; his mother and some of the imperial clan came back. Preceded by the dismissal of Han Shizhong and the death of Yue Fei (no date in the articles, so no separate event)."
    sources: [wp-emperor-gaozong-of-song, wp-emperor-qinzong-of-song]
  - key: jin-capital-moved-to-yanjing-1153
    name: Jin capital moved to Yanjing
    type: Capital move
    year: 1153
    place: beijing
    people:
      - {person: wanyan-liang, role: ruler}
    prominence: 3
    note: "Wanyan Liang moved the court from Shangjing (Harbin) to Yanjing, later called Zhongdu, and ordered Shangjing's palaces destroyed in 1157."
    sources: [wp-wanyan-liang]
  - key: battles-of-tangdao-and-caishi-1161
    name: Battles of Tangdao and Caishi
    type: Battle
    year: 1161
    people:
      - {person: wanyan-liang, role: defeated}
      - {person: emperor-gaozong-of-song, role: victor}
    prominence: 3
    note: "Wanyan Liang's fleet lost to the Song at Tangdao and Caishi on his attempt to conquer the Southern Song. His officers rebelled and he was assassinated on 15 December 1161."
    sources: [wp-wanyan-liang, wp-emperor-gaozong-of-song]
  - key: jin-song-war-1206
    name: Jin-Song war of 1206-1208
    type: War
    date: 1206-06-14
    end_year: 1208
    people:
      - {person: emperor-ningzong-of-song, role: Song ruler}
      - {person: emperor-zhangzong-of-jin, role: Jin ruler}
    prominence: 3
    note: "Han Tuozhou declared war on the Jin on 14 June 1206 and the Song attack failed. Wu Xi, governor of Sichuan, defected in December 1206 and was killed on 29 March 1207. A peace treaty was signed on 2 November 1208: the Song reinstated and raised its tribute and handed over Han Tuozhou's head."
    sources: [wp-emperor-ningzong-of-song, wp-emperor-zhangzong-of-jin]
  - key: mongol-conquest-of-the-jin-1234
    name: Fall of Caizhou and end of the Jin
    type: Conquest
    date: 1234-02-09
    place: caizhou
    people:
      - {person: emperor-aizong-of-jin, role: died}
    prominence: 4
    note: "Allied Mongol and Song forces took Caizhou; Aizong hanged himself after naming Wanyan Chenglin heir, and Chenglin died in the fighting, ending the Jin dynasty. The Mongol Empire had crushed the Jin army at Sanfengshan in 1232."
    sources: [wp-emperor-aizong-of-jin, wp-emperor-lizong-of-song]
  - key: surrender-of-lin-an-1276
    name: Surrender of Lin'an
    type: Surrender
    date: 1276-02-04
    place: hangzhou
    people:
      - {person: emperor-gongzong-of-song, role: surrendered}
    prominence: 4
    note: "The Southern Song capital fell to the Yuan general Bayan, who arrived outside the city on 18 January 1276. The Gong article puts the child emperor's surrender to the Yuan camp 'later that year' and his departure north in March 1276; the Bing article gives the city's fall as 4 February 1276."
    sources: [wp-emperor-bing-of-song, wp-emperor-gongzong-of-song]
  - key: battle-of-yamen-1279
    name: Battle of Yamen
    type: Battle
    date: 1279-03-19
    place: yamen-battlefield
    people:
      - {person: emperor-bing-of-song, role: died}
    prominence: 5
    note: "Last stand of the Song. Zhang Shijie chained about 1,000 ships together in the bay; the Yuan under Zhang Hongfan cut off water and wood, then attacked on 19 March and destroyed the fleet. Lu Xiufu took the seven-year-old Emperor Bing into the sea, where both drowned; the Song dynasty ended."
    sources: [wp-battle-of-yamen, wp-emperor-bing-of-song]

