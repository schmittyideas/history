batch:
  title: "WWII, batch 4b: the Holocaust and resistance — events"
  requested: "Ty: WWII build-out, batch 4 (Holocaust and resistance); do all batches"
  date: 2026-10-24

# Notes for the reviewer
# - Facts come from each event's English Wikipedia article, read through the Wikipedia API on 2026-10-24 (infobox and body). Site
#   coordinates come from each site's own article.
# - Needs batch 4a (2026-10-24-wwii-holocaust-people.yaml) applied first: most people linked here are added there.
# - Death tolls are given as the articles give them, with their ranges; disputed figures are logged as discrepancies.
# - The Holocaust itself is an umbrella event (1941-1945, the article's span), placed at Auschwitz, the largest killing centre;
#   the article has no coordinates of its own. It gets 5 stars: it defines the period as much as any battle.
# - Operation Reinhard began "around March 1942" and ended in November 1943: year only, with the months in the note. The
#   Grossaktion Warsaw is its own event, the 1942 deportations that came before the ghetto uprising.
# - Kristallnacht is placed at Berlin's Fasanenstrasse Synagogue, shown burning in the article's infobox (the pogrom was nationwide).
# - The White Rose event is the execution of Hans and Sophie Scholl on 22 February 1943, with their arrest at the university
#   (18 February) as a second site.
# - Wolf's Lair coordinates are from its own article. The Grossaktion Warsaw article's own coordinate falls outside Warsaw (it looks
#   mistyped), so the Umschlagplatz is used.
# - The existing place `chelmno` is the town of Chełmno (Kulm) in Pomerania; the extermination camp at Chełmno nad Nerem is new here.
# - People: only those the article names in a clear role for the event. Wallenberg, Sugihara, Sendler and Moulin are not named in
#   these articles; their own stories are in batch 4a.

