events:
  - key: nuremberg-laws
    name: Nuremberg Laws
    type: Law
    date: 1935-09-15
    place: nuremberg
    prominence: 4
    people: [{person: adolf-hitler, role: ordered}]
    note: Two laws passed at the Nuremberg Rally barred marriage between Jews and other Germans and limited citizenship to people of "German blood".
    sources: [wp-nuremberg-laws]
  - key: kristallnacht
    name: Kristallnacht
    type: Pogrom
    date: 1938-11-09
    end_year: 1938
    place: fasanenstrasse-synagogue
    prominence: 4
    people: [{person: reinhard-heydrich, role: sent instructions}, {person: hermann-goring, role: planned the expropriation}, {person: adolf-hitler, role: perpetrator}]
    note: A nationwide pogrom on 9–10 November 1938; over 1,400 synagogues were damaged and about 30,000 Jewish men were sent to camps.
    sources: [wp-kristallnacht, wp-fasanenstrasse-synagogue]
  - key: babi-yar-massacre
    name: Babi Yar massacre
    type: Massacre
    date: 1941-09-29
    end_year: 1941
    place: babi-yar
    prominence: 4
    note: German forces shot 33,771 Jews from Kyiv at the ravine on 29–30 September 1941; killings went on there until 1943.
    sources: [wp-babi-yar]
  - key: wannsee-conference
    name: Wannsee Conference
    type: Conference
    date: 1942-01-20
    place: house-of-the-wannsee-conference
    prominence: 4
    people: [{person: reinhard-heydrich, role: chaired}, {person: adolf-eichmann, role: wrote the minutes}]
    note: Heydrich met 15 senior officials to coordinate the deportation and murder of Europe's Jews, the "Final Solution".
    sources: [wp-wannsee-conference]
  - key: assassination-of-reinhard-heydrich
    name: Assassination of Reinhard Heydrich (Operation Anthropoid)
    type: Assassination
    date: 1942-05-27
    place: heydrich-attack-site
    places: [{place: saints-cyril-and-methodius-cathedral-prague, role: last stand, note: "The paratroopers died in the crypt on 18 June 1942"}]
    prominence: 3
    people: [{person: reinhard-heydrich, role: killed}, {person: adolf-hitler, role: ordered reprisals}]
    note: Czechoslovak soldiers trained in Britain fatally wounded Heydrich in Prague (he died on 4 June); brutal reprisals followed.
    sources: [wp-assassination-of-reinhard-heydrich, wp-cathedral-of-saints-cyril-and-methodius-prague]
  - key: lidice-massacre
    name: Lidice massacre
    type: Massacre
    date: 1942-06-10
    place: lidice
    places:
      - {place: chelmno-extermination-camp, role: killing site, note: "82 of the village's children were gassed here in summer 1942"}
      - {place: ravensbruck-concentration-camp, role: deportation, note: The women were sent here}
    prominence: 3
    people: [{person: adolf-hitler, role: ordered}, {person: adolf-eichmann, role: ordered the children killed}]
    note: In reprisal for Heydrich's death, the village was destroyed, its 173 men were shot, and the women and children were deported.
    sources: [wp-lidice-massacre, wp-chelmno-extermination-camp]
  - key: grossaktion-warsaw
    name: Grossaktion Warsaw (deportations from the Warsaw Ghetto)
    type: Deportation
    date: 1942-07-22
    end_year: 1942
    place: umschlagplatz
    places: [{place: treblinka-extermination-camp, role: destination}]
    prominence: 3
    people: [{person: heinrich-himmler, role: ordered}]
    note: About 254,000–265,000 Jews were deported from the Warsaw Ghetto to Treblinka and murdered, July to 21 September 1942.
    sources: [wp-grossaktion-warsaw, wp-umschlagplatz]
  - key: operation-reinhard
    name: Operation Reinhard
    type: Deportation
    year: 1942
    end_year: 1943
    place: treblinka-extermination-camp
    places:
      - {place: belzec-extermination-camp, role: extermination camp, note: Gassing from about March 1942}
      - {place: sobibor-extermination-camp, role: extermination camp, note: Operating by May 1942}
    prominence: 4
    people: [{person: heinrich-himmler, role: ordered}, {person: reinhard-heydrich, role: planned}]
    note: The SS plan, March 1942 to November 1943, to murder the Jews of occupied Poland in Bełżec, Sobibor and Treblinka; about two million were killed.
    sources: [wp-operation-reinhard, wp-belzec, wp-sobibor, wp-treblinka]
  - key: white-rose-executions
    name: Execution of Hans and Sophie Scholl (White Rose)
    type: Execution
    date: 1943-02-22
    place: stadelheim-prison
    places: [{place: lmu-munich, role: arrest, note: "Arrested distributing leaflets in the atrium on 18 February 1943"}]
    prominence: 3
    people: [{person: hans-scholl, role: executed}, {person: sophie-scholl, role: executed}]
    note: The People's Court sentenced the White Rose students to death; Hans and Sophie Scholl and Christoph Probst were guillotined the same day.
    sources: [wp-white-rose, wp-lmu-munich, wp-stadelheim-prison]
  - key: warsaw-ghetto-uprising
    name: Warsaw Ghetto Uprising
    type: Uprising
    date: 1943-04-19
    end_year: 1943
    place: warsaw-ghetto
    places: [{place: monument-to-the-ghetto-heroes, role: memorial}, {place: umschlagplatz, role: deportation}]
    prominence: 4
    people: [{person: mordechai-anielewicz, role: led}, {person: heinrich-himmler, role: ordered it crushed}]
    note: Jewish fighters resisted the ghetto's final deportation for four weeks, to 16 May 1943, as German forces razed it block by block.
    sources: [wp-warsaw-ghetto-uprising, wp-monument-to-the-ghetto-heroes]
  - key: rescue-of-the-danish-jews
    name: Rescue of the Danish Jews
    type: Rescue
    date: 1943-09-28
    place: oresund
    places:
      - {place: copenhagen, role: roundup, note: The night of 1–2 October 1943}
      - {place: theresienstadt-ghetto, role: deportation, note: "464 people deported; 51 died there"}
    prominence: 3
    people: [{person: adolf-hitler, role: ordered the deportation}]
    note: Warned of the roundup, the Danish resistance and ordinary people ferried about 7,500 of Denmark's 8,000 Jews to Sweden in October 1943.
    sources: [wp-rescue-of-the-danish-jews, wp-theresienstadt-ghetto]
  - key: twenty-july-plot
    name: 20 July plot
    type: Plot
    date: 1944-07-20
    place: wolfs-lair
    places: [{place: bendlerblock, role: execution, note: "Stauffenberg and three others were shot in the courtyard just after midnight"}]
    prominence: 4
    people:
      - {person: claus-von-stauffenberg, role: planted the bomb}
      - {person: adolf-hitler, role: survived}
      - {person: wilhelm-keitel, role: present}
      - {person: heinrich-himmler, role: crushed the coup}
    note: Stauffenberg's briefcase bomb only lightly wounded Hitler, and the coup in Berlin failed within hours; about 4,980 people were executed afterwards.
    sources: [wp-20-july-plot, wp-wolfs-lair, wp-bendlerblock]
  - key: arrest-of-anne-frank
    name: Arrest of Anne Frank
    type: Arrest
    date: 1944-08-04
    place: anne-frank-house
    places:
      - {place: westerbork-transit-camp, role: deportation}
      - {place: auschwitz-concentration-camp, role: deportation, note: On the last transport from Westerbork, 3 September 1944}
      - {place: bergen-belsen-concentration-camp, role: died, note: "Anne and Margot were moved here on 1 November 1944"}
    prominence: 3
    people: [{person: anne-frank, role: arrested}, {person: otto-frank, role: arrested}]
    note: Police stormed the Secret Annex and arrested the eight people hidden there after two years; who betrayed them is unknown.
    sources: [wp-anne-frank, wp-anne-frank-house]
  - key: liberation-of-auschwitz
    name: Liberation of Auschwitz
    type: Liberation
    date: 1945-01-27
    place: auschwitz-concentration-camp
    prominence: 4
    people: [{person: primo-levi, role: liberated}]
    note: Soviet troops found about 7,000 prisoners left behind; at least 1.1 million people were murdered there. 27 January is Holocaust Remembrance Day.
    sources: [wp-auschwitz-concentration-camp]
  - key: liberation-of-bergen-belsen
    name: Liberation of Bergen-Belsen
    type: Liberation
    date: 1945-04-15
    place: bergen-belsen-concentration-camp
    prominence: 3
    note: British troops found about 60,000 starving prisoners and 13,000 unburied bodies; about 14,000 more died after liberation.
    sources: [wp-bergen-belsen]
  - key: liberation-of-dachau
    name: Liberation of Dachau
    type: Liberation
    date: 1945-04-29
    place: dachau-concentration-camp
    prominence: 3
    people: [{person: heinrich-himmler, role: refused to surrender it}]
    note: US troops freed about 30,000 prisoners at Dachau, the first and longest-running Nazi concentration camp, opened in 1933.
    sources: [wp-dachau-concentration-camp]
  - key: eichmann-trial
    name: Eichmann trial
    type: Trial
    date: 1961-04-11
    end_year: 1961
    place: gerard-behar-center
    places: [{place: ayalon-prison, role: execution, note: Hanged in 1962}]
    prominence: 3
    people: [{person: adolf-eichmann, role: sentenced to death}, {person: simon-wiesenthal, role: helped find him}]
    note: Seized in Argentina in 1960, Eichmann was tried in Jerusalem in the first widely televised trial and sentenced to death on 15 December 1961.
    sources: [wp-eichmann-trial, wp-gerard-behar-center, wp-ayalon-prison]
  - key: the-holocaust
    name: The Holocaust
    type: Genocide
    year: 1941
    end_year: 1945
    place: auschwitz-concentration-camp
    prominence: 5
    people:
      - {person: adolf-hitler, role: ordered}
      - {person: heinrich-himmler, role: organised}
      - {person: reinhard-heydrich, role: organised}
      - {person: adolf-eichmann, role: organised}
    note: Nazi Germany and its collaborators murdered about six million Jews, two-thirds of Europe's Jews, by mass shootings and in extermination camps.
    sources: [wp-the-holocaust]
  # Existing events: link the people now in the database.
  - key: liquidation-of-the-krakow-ghetto-1943
    people: [{person: amon-goth, role: commander}]
    sources: [wp-krakow-ghetto]
  - key: nuremberg-trials
    people: [{person: rudolf-hoss, role: witness}]
    sources: [wp-nuremberg-trials]

discrepancies:
  - key: kristallnacht-death-toll
    question: How many people died in Kristallnacht?
    about: [{event: kristallnacht}]
    claims:
      - {value: "91 (early reports)", sources: [wp-kristallnacht]}
      - {value: "1,000–2,000, including 638 suicides (Richard J. Evans)", sources: [wp-kristallnacht], note: The article's modern figure}
  - key: grossaktion-warsaw-start
    question: Did the Grossaktion Warsaw begin on 22 or 23 July 1942?
    about: [{event: grossaktion-warsaw}]
    field: date
    claims:
      - {value: "1942-07-22 (the Judenrat was told of the 'resettlement')", sources: [wp-grossaktion-warsaw], note: Lead}
      - {value: "1942-07-23 (most transports from Tisha B'Av)", sources: [wp-grossaktion-warsaw, wp-warsaw-ghetto-uprising], note: "Infobox; the Warsaw Ghetto Uprising article"}
    note: The record uses 22 July, as the Grossaktion article's lead does.
  - key: auschwitz-first-gassing
    question: When were the first gassings at Auschwitz?
    about: [{place: auschwitz-concentration-camp}]
    field: date
    claims:
      - {value: "Around August 1941", sources: [wp-auschwitz-concentration-camp], note: Lead and two other passages}
      - {value: "3 September 1941 (about 850 people in Block 11)", sources: [wp-auschwitz-concentration-camp], note: Gas chamber section}
    note: No record uses this date yet.
  - key: lidice-children-killed
    question: How many children from Lidice were murdered?
    about: [{event: lidice-massacre}]
    claims:
      - {value: "82 children gassed at Chełmno", sources: [wp-lidice-massacre], note: Infobox}
      - {value: "88 children among about 340 victims (192 men, 60 women, 88 children)", sources: [wp-lidice-massacre], note: Lead}
    note: The place note uses 82, the number gassed at Chełmno.
  - key: eichmann-execution-date
    question: Was Eichmann hanged on 31 May or 1 June 1962?
    about: [{person: adolf-eichmann}, {event: eichmann-trial}]
    field: died
    claims:
