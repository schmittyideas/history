    place: kensington-palace
    people: [{person: victoria-of-the-united-kingdom, role: succeeded}]
    prominence: 4
    note: "Woken at Kensington Palace and told her uncle William IV had died, aged 18. She moved to Buckingham Palace, which became the principal royal residence."
    sources: [wp-prince-albert, wp-kensington-palace, wp-buckingham-palace]
  - key: great-exhibition-1851
    name: Great Exhibition
    type: Exhibition
    date: 1851-05-01
    place: hyde-park
