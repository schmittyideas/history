titles:
  # Rulers of Hanover. George I's rule of the Electorate dates from his father's death in 1698 (he was only ratified as elector in 1708).
  - {person: george-i-of-great-britain, title: Elector of Hanover, realm: Hanover, from: 1698-01-23, to: 1727-06-11, note: "Duke of Brunswick-Lüneburg and prince-elector; ratified as elector in 1708", sources: [wp-george-i]}
  - {person: george-ii-of-great-britain, title: Elector of Hanover, realm: Hanover, from: 1727-06-11, to: 1760-10-25, sources: [wp-george-ii]}
  - {person: george-iii, title: Elector of Hanover, realm: Hanover, from: 1760-10-25, to: 1814-10-12, note: "Duke and prince-elector; the Holy Roman Empire ended in 1806 and he continued as duke until the Congress of Vienna", sources: [wp-george-iii]}
  - {person: george-iii, title: King of Hanover, realm: Hanover, from: 1814-10-12, to: 1820-01-29, sources: [wp-george-iii]}
  - {person: george-iv, title: King of Hanover, realm: Hanover, from: 1820-01-29, to: 1830-06-26, sources: [wp-george-iv]}
  - {person: william-iv, title: King of Hanover, realm: Hanover, from: 1830-06-26, to: 1837-06-20, note: "Under Salic law Victoria could not rule Hanover; it passed to his brother Ernest Augustus", sources: [wp-william-iv]}

  # Kings and queens of Great Britain, then the United Kingdom.
  - {person: george-i-of-great-britain, title: King of Great Britain, realm: Great Britain, from: 1714-08-01, to: 1727-06-11, note: "Dates are Old Style", sources: [wp-george-i]}
  - {person: george-ii-of-great-britain, title: King of Great Britain, realm: Great Britain, from: 1727-06-11, to: 1760-10-25, note: "Dates are Old Style", sources: [wp-george-ii]}
  - {person: george-iii, title: King of Great Britain, realm: Great Britain, from: 1760-10-25, to: 1800-12-31, sources: [wp-george-iii]}
  - {person: george-iii, title: King of the United Kingdom, realm: United Kingdom, from: 1801-01-01, to: 1820-01-29, note: "King of Great Britain and Ireland from the Acts of Union 1800; son was Prince Regent from 1811", sources: [wp-george-iii]}
  - {person: george-iv, title: King of the United Kingdom, realm: United Kingdom, from: 1820-01-29, to: 1830-06-26, note: "Prince Regent from 5 February 1811", sources: [wp-george-iv]}
  - {person: william-iv, title: King of the United Kingdom, realm: United Kingdom, from: 1830-06-26, to: 1837-06-20, sources: [wp-william-iv]}
  - {person: victoria-of-the-united-kingdom, title: Queen of the United Kingdom, realm: United Kingdom, from: 1837-06-20, to: 1901-01-22, sources: [wp-prince-albert, wp-edward-vii, wp-osborne-house]}
  - {person: edward-vii, title: King of the United Kingdom, realm: United Kingdom, from: 1901-01-22, to: 1910-05-06, sources: [wp-edward-vii]}
  - {person: george-v, title: King of the United Kingdom, realm: United Kingdom, from: 1910-05-06, to: 1936-01-20, sources: [wp-george-v]}
  - {person: edward-viii, title: King of the United Kingdom, realm: United Kingdom, from: 1936-01-20, to: 1936-12-11, note: "Signed the instrument of abdication on 10 December; it took effect with royal assent on 11 December", sources: [wp-edward-viii]}
  - {person: george-vi, title: King of the United Kingdom, realm: United Kingdom, from: 1936-12-11, to: 1952-02-06, sources: [wp-george-vi]}
  - {person: elizabeth-ii, title: Queen of the United Kingdom, realm: United Kingdom, from: 1952-02-06, to: 2022-09-08, sources: [wp-elizabeth-ii]}
  - {person: charles-iii, title: King of the United Kingdom, realm: United Kingdom, from: 2022-09-08, sources: [wp-charles-iii]}

  # Empress and Emperor of India.
  - {person: victoria-of-the-united-kingdom, title: Empress of India, realm: British India, from: 1876, to: 1901-01-22, note: "Title given by Parliament in 1876 (exact date not in the downloaded articles)", sources: [wp-edward-vii]}
  - {person: edward-vii, title: Emperor of India, realm: British India, from: 1901-01-22, to: 1910-05-06, sources: [wp-edward-vii]}
