discrepancies:
  - key: george-ii-birth-date
    question: On what date was George II born?
    about: [{person: george-ii-of-great-britain}]
    field: born
    claims:
      - {value: "30 October 1683 (Old Style, the form of the article lead)", sources: [wp-george-ii]}
      - {value: "9 November 1683 (New Style, the Gregorian date used in Hanover)", sources: [wp-george-ii]}
    note: "The article lead gives both as '30 October / 9 November 1683'. The record uses 1683-11-09, the New Style date; the two are the same day."
  - key: george-vi-emperor-of-india-end
    question: When did George VI stop being Emperor of India?
    about: [{person: george-vi}]
    field: title end
    claims:
      - {value: "August 1947, when the British Raj was dissolved", sources: [wp-george-vi]}
      - {value: "June 1948, when he formally relinquished the title", sources: [wp-george-vi]}
    note: "The record uses 1948 (the formal relinquishing) as the end year; the lead says he was emperor 'until the British Raj was dissolved in August 1947, though the title was only formally relinquished in June 1948'."
  - key: edward-viii-abdication-date
    question: On what date did Edward VIII abdicate?
    about: [{event: abdication-of-edward-viii}, {person: edward-viii}]
    field: date
    claims:
      - {value: "10 December 1936, the day he signed the instruments of abdication at Fort Belvedere", sources: [wp-edward-viii]}
      - {value: "11 December 1936, when the Abdication Act received royal assent and George VI's reign began", sources: [wp-edward-viii, wp-george-vi]}
    note: "The event uses 10 December (the signing); the title end dates use 11 December (effect of the abdication)."
