  - key: house-of-windsor-1917
    name: Royal house renamed Windsor
    type: Proclamation
    date: 1917-07-17
    people: [{person: george-v, role: proclaimed}]
    prominence: 3
    note: "Royal proclamation changed the name from the German-sounding Saxe-Coburg and Gotha to Windsor."
    sources: [wp-george-v]
  - key: abdication-of-edward-viii
    name: Abdication of Edward VIII
    type: Abdication
    date: 1936-12-10
    place: fort-belvedere
    people:
      - {person: edward-viii, role: abdicated}
      - {person: george-vi, role: succeeded}
    prominence: 5
    note: "Edward signed the instruments of abdication on 10 December so he could marry Wallis Simpson; royal assent was given on 11 December and his brother, the Duke of York, became George VI."
    sources: [wp-edward-viii, wp-george-vi]
  - key: coronation-of-george-vi
    name: Coronation of George VI
    type: Coronation
    date: 1937-05-12
    place: westminster-abbey
    people: [{person: george-vi, role: crowned}]
    prominence: 3
