  - key: coronation-of-elizabeth-ii
    name: Coronation of Elizabeth II
    type: Coronation
    date: 1953-06-02
    place: westminster-abbey
    people: [{person: elizabeth-ii, role: crowned}]
    prominence: 4
    note: "Went ahead despite Queen Mary's death on 24 March 1953; the first coronation to be televised (except the anointing and communion)."
    sources: [wp-elizabeth-ii]
  - key: death-of-elizabeth-ii
