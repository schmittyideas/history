events:
  - key: accession-of-george-i
    name: Accession of George I
    type: Succession
    date: 1714-08-01
    people: [{person: george-i-of-great-britain, role: succeeded}]
    prominence: 4
    note: "Anne died; her Protestant heir George, Elector of Hanover, became the first Hanoverian king. Date is Old Style."
    sources: [wp-george-i]
  - key: jacobite-rising-1715
    name: The Fifteen (Jacobite rising of 1715)
    type: Rebellion
    year: 1715
    people: [{person: george-i-of-great-britain, role: defended throne}]
    prominence: 3
    note: "Led by the Earl of Mar in Scotland to put James Francis Edward Stuart on the throne; collapsed by the end of 1715 and James fled to France in February 1716."
    sources: [wp-george-i]
  - key: coronation-of-george-ii
    name: Coronation of George II
    type: Coronation
    date: 1727-10-11
    place: westminster-abbey
    people: [{person: george-ii-of-great-britain, role: crowned}]
    prominence: 2
    note: "Date is Old Style (22 October New Style). Handel wrote four anthems, including Zadok the Priest."
    sources: [wp-george-ii]
  - key: jacobite-rising-1745
    name: Jacobite rising of 1745
    type: Rebellion
    year: 1745
    end_year: 1746
    people: [{person: george-ii-of-great-britain, role: defended throne}]
    prominence: 4
    note: "Charles Edward Stuart landed in Scotland in July 1745, won at Prestonpans and marched into England, then retreated; ended at Culloden."
    sources: [wp-george-ii]
  - key: battle-of-culloden
    name: Battle of Culloden
    type: Battle
    date: 1746-04-16
    place: culloden-moor
    people:
      - {person: george-ii-of-great-britain, role: victor}
    prominence: 4
    note: "The Duke of Cumberland routed Charles Edward Stuart's Jacobites in the last pitched battle on British soil. Date is Old Style (27 April New Style)."
    sources: [wp-george-ii]
  - key: american-declaration-of-independence
    name: American Declaration of Independence
    type: Declaration
    year: 1776
    people: [{person: george-iii, role: addressed by the declaration}]
    prominence: 4
    note: "In July 1776 the thirteen colonies declared independence, listing grievances against the king. The day is not in the downloaded article."
    sources: [wp-george-iii]
  - key: treaty-of-paris-1783
    name: Treaty of Paris (American independence)
    type: Treaty
    year: 1783
    people: [{person: george-iii, role: signed for Britain}]
    prominence: 4
    note: "Britain formally recognised the independence of the United States in treaties signed in 1782 and 1783, after Cornwallis surrendered at Yorktown in 1781."
    sources: [wp-george-iii]
  - key: union-of-great-britain-and-ireland-1801
    name: United Kingdom of Great Britain and Ireland created
    type: Union
    date: 1801-01-01
    people: [{person: george-iii, role: king}]
    prominence: 4
    note: "The Acts of Union passed by the British and Irish parliaments in 1800 took effect, creating the United Kingdom."
    sources: [wp-george-iii]
  - key: battle-of-waterloo
    name: Battle of Waterloo
    type: Battle
    year: 1815
    people: [{person: george-iv, role: Prince Regent}]
    prominence: 4
    note: "Napoleon's final defeat, in the Regency of the future George IV. The day is not in the downloaded articles."
    sources: [wp-george-iii, wp-george-iv]
  - key: coronation-of-william-iv
    name: Coronation of William IV
    type: Coronation
    date: 1831-09-08
    people: [{person: william-iv, role: crowned}]
    prominence: 2
    note: "A modest ceremony; the Privy Council budgeted under 30,000 pounds against the 240,000 pounds of 1821."
    sources: [wp-william-iv]
  - key: slavery-abolition-act-1833
    name: Slavery Abolition Act
    type: Law
    year: 1833
    people: [{person: william-iv, role: reigning monarch}]
    prominence: 4
    note: "Emancipated slaves in most of the British Empire. Passed in the same reign as the Reform Act 1832 and the Factory Act 1833."
