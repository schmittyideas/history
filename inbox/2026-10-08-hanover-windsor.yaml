people:
  - key: george-i-of-great-britain
    name: George I
    type: Royalty
    house: Hanover
    realm: Great Britain
    born: 1660-05-28
    died: 1727-06-11
    prominence: 4
    note: "First Hanoverian king of Great Britain, as Anne's nearest Protestant heir; also Elector of Hanover. Died on a trip to Hanover."
    sources: [wp-george-i]
  - key: george-ii-of-great-britain
    name: George II
    type: Royalty
    house: Hanover
    realm: Great Britain
    born: 1683-11-09
    died: 1760-10-25
    prominence: 3
    note: "Last British monarch born outside Britain and last to lead an army in battle (Dettingen). Reigned through the 1745 Jacobite rising."
    sources: [wp-george-ii]
  - key: george-iii
    name: George III
    type: Royalty
    house: Hanover
    realm: United Kingdom
    born: 1738-06-04
    died: 1820-01-29
    prominence: 4
    note: "Lost the American colonies; reigned through the Napoleonic Wars and the union with Ireland. Recurrent mental illness; his son was Prince Regent from 1811."
    sources: [wp-george-iii]
  - key: george-iv
    name: George IV
    type: Royalty
    house: Hanover
    realm: United Kingdom
    born: 1762-08-12
    died: 1830-06-26
    prominence: 3
    note: "Prince Regent from 1811, king from 1820. Patron of the Regency style; commissioned the Royal Pavilion at Brighton."
    sources: [wp-george-iv]
  - key: william-iv
    name: William IV
    type: Royalty
    house: Hanover
    realm: United Kingdom
    born: 1765-08-21
    died: 1837-06-20
    prominence: 3
    note: "The 'Sailor King'. Reign of the Reform Act 1832 and the abolition of slavery in the empire; last Hanoverian monarch of the United Kingdom."
    sources: [wp-william-iv]
  - key: victoria-of-the-united-kingdom
    name: Victoria
    type: Royalty
    house: Hanover
    realm: United Kingdom
    born: 1819
    died: 1901-01-22
    prominence: 5
    note: "Queen from 1837 and Empress of India from 1876; her reign gave its name to the Victorian era. Born 1819 (day not in the downloaded articles). Died at Osborne House."
    sources: [wp-prince-albert, wp-edward-vii, wp-osborne-house, wp-kensington-palace]
  - key: prince-albert-of-saxe-coburg-and-gotha
    name: Prince Albert of Saxe-Coburg and Gotha
    type: Royalty
    house: Saxe-Coburg and Gotha
    born: 1819-08-26
    died: 1861-12-14
    prominence: 3
    note: "Victoria's husband from 1840 and Prince Consort from 1857; organised the Great Exhibition of 1851 and designed Osborne House."
    sources: [wp-prince-albert]
  - key: edward-vii
    name: Edward VII
    type: Royalty
    house: Saxe-Coburg and Gotha
    realm: United Kingdom
    born: 1841-11-09
    died: 1910-05-06
    prominence: 4
    note: "Prince of Wales for almost 60 years, then king 1901-1910; first monarch of the House of Saxe-Coburg and Gotha. Called 'Peacemaker'."
    sources: [wp-edward-vii]
  - key: george-v
    name: George V
    type: Royalty
    house: Windsor
    realm: United Kingdom
    born: 1865-06-03
    died: 1936-01-20
    prominence: 4
    note: "King through the First World War; renamed the royal house Windsor in 1917. Began the royal Christmas broadcast in 1932."
    sources: [wp-george-v]
  - key: edward-viii
    name: Edward VIII
    type: Royalty
    house: Windsor
    realm: United Kingdom
    born: 1894-06-23
    died: 1972-05-28
    prominence: 4
    note: "Reigned 326 days in 1936, then abdicated to marry Wallis Simpson; afterwards Duke of Windsor."
    sources: [wp-edward-viii]
  - key: george-vi
    name: George VI
    type: Royalty
    house: Windsor
    realm: United Kingdom
    born: 1895-12-14
    died: 1952-02-06
    prominence: 4
    note: "Became king on his brother's abdication; stayed in London through the Second World War. Last Emperor of India and first Head of the Commonwealth."
    sources: [wp-george-vi]
  - key: elizabeth-ii
    name: Elizabeth II
    type: Royalty
    house: Windsor
    realm: United Kingdom
    born: 1926-04-21
    died: 2022-09-08
    prominence: 5
    note: "Queen from 1952 to 2022, the longest-reigning British monarch (70 years 214 days). Died at Balmoral."
    sources: [wp-elizabeth-ii]
  - key: charles-iii
    name: Charles III
    type: Royalty
    house: Windsor
    realm: United Kingdom
    born: 1948-11-14
    prominence: 4
    note: "King since 8 September 2022; at 73 the oldest person to accede to the British throne, after the longest wait as heir. Crowned 6 May 2023."
    sources: [wp-charles-iii]
  - key: prince-philip-duke-of-edinburgh
    name: Prince Philip, Duke of Edinburgh
    type: Royalty
    house: Windsor
    born: 1921-06-10
    died: 2021-04-09
    prominence: 3
    note: "Born a prince of Greece and Denmark; husband of Elizabeth II from 1947 and the longest-serving royal consort in British history."
    sources: [wp-prince-philip]

