batch:
  title: "British monarchs: Hanover, Windsor and today, 1714-present"
  requested: "Kings and queens of Great Britain and the United Kingdom from George I to Charles III, with Prince Albert and Prince Philip"
  date: 2026-10-08

# NOTES ON WHAT WAS LEFT OUT (all because the downloaded Wikipedia text does not give the fact):
# - There is no downloaded article for Queen Victoria herself (the file Victoria.txt is the disambiguation page).
#   Her record is built from the Prince Albert, Edward VII, Osborne House, Kensington Palace and Balmoral articles.
#   Her birth day (24 May), birthplace and coronation date are not in those articles, so birth is the year alone,
#   there is no birth place, and there is no coronation event. Her coronation should be added when her article is available.
# - Battle of Waterloo: the downloaded articles name it only as 1815, so the event carries the year alone.
# - Coronations of George I, George III and George IV, and the place of William IV's coronation (8 September 1831), are not
#   dated or placed in the downloaded articles, so George IV's and George I's coronations are omitted.
# - Birthplaces left out: Elizabeth II (17 Bruton Street, Mayfair; a private house, not defined), Albert (Schloss Rosenau).
# - Deaths with no place in the articles: George II (no place given), Edward VIII (home in Paris), Charles III (living).
# - Death place of Edward VII: the article says he returned to Buckingham Palace on 27 April 1910 and died there that night
#   (the place is implied, not stated outright).
# - Dates for British events of 1727 and 1714 are Old Style, as Wikipedia gives them.
# - Elector of Hanover is included for George I to III, because the articles say each ruled the Electorate. Hanover
#   dukes/electors before George I are not in this batch.

