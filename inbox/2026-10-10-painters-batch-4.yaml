discrepancies:
- key: arshile-gorky-born
  question: When was Arshile Gorky born?
  about:
  - person: arshile-gorky
  field: born
  claims:
  - value: 1904 (April 15, 1904, the often-cited date)
    sources:
    - wp-arshile-gorky
  - value: 1902 or 1903
    sources:
    - wp-arshile-gorky
    note: The article says the year might have been 1902 or 1903; Gorky was vague about it and changed it year to year.
  note: The record uses 1904, marked estimated, year only.
- key: basquiat-first-painting-sold
  question: Which painting did Basquiat sell to Debbie Harry as his first sale?
  about:
  - person: jean-michel-basquiat
  field: date
  claims:
  - value: Cadillac Moon (1981), sold for $200
    sources:
    - wp-jean-michel-basquiat
  - value: Self-Portrait with Suzanne, per Debbie Harry's autobiography
    sources:
    - wp-jean-michel-basquiat
    note: The article says she states this on page 174 of her autobiography.
  note: No artwork record created for either painting.
- key: sigmar-polke-reichstag-lightboxes-authorship
  question: Who is the author of the five lenticular lightboxes made for the Reichstag in 1999?
  about:
  - person: sigmar-polke
  field: attribution
  claims:
  - value: Sigmar Polke
    sources:
    - wp-sigmar-polke
    note: Credited as sole artist
  - value: Polke with Philippe David Eisfeld as co-author
    sources:
    - wp-sigmar-polke
    note: Eisfeld, who did the technical 3D lenticular work, later claimed co-authorship
  note: The record credits Polke as the article does; authorship and licensing remain unresolved.
