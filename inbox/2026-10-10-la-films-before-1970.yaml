discrepancies:
  - key: birth-of-a-nation-battle-scenes-location
    question: Were The Birth of a Nation's battle scenes filmed in Griffith Park or on the Griffith Ranch?
    about: [{artwork: the-birth-of-a-nation-1915}, {place: griffith-park}]
    field: place
    claims:
      - {value: "Griffith Park", sources: [wp-griffith-park], note: "Griffith filmed the battle scenes in the park in 1915, as Lillian Gish described in her memoirs"}
      - {value: "Griffith Ranch, San Fernando Valley", sources: [wp-the-birth-of-a-nation-1915], note: "Much of the filming was on the Griffith Ranch; Petersburg scenes at today's Forest Lawn; others in Whittier, Ojai Valley and Big Bear Lake"}
    note: "The film is linked to Griffith Park on the park article's word; the two may both be true, but neither article mentions the other."
  - key: twenty-minutes-of-love-director
    question: Did Charlie Chaplin or Joseph Maddern direct Twenty Minutes of Love?
    about: [{artwork: twenty-minutes-of-love-1914}]
    field: creator
    claims:
      - {value: "Charlie Chaplin", sources: [wp-twenty-minutes-of-love-1914], note: "Widely reported as Chaplin's directorial debut"}
      - {value: "Joseph Maddern", sources: [wp-twenty-minutes-of-love-1914], note: "Some sources name Maddern, while crediting Chaplin as the creative force"}
    note: "The record credits Chaplin, as most sources do."
  - key: house-on-haunted-hill-release-year
    question: Is House on Haunted Hill a 1958 or a 1959 film?
    about: [{artwork: house-on-haunted-hill-1958}]
    field: made
    claims:
      - {value: "1958", sources: [wp-house-on-haunted-hill-1958], note: "A 1958 film; limited release on 17 December 1958, San Francisco premiere 14 January 1959"}
      - {value: "1959", sources: [wp-ennis-house], note: "The Ennis House article calls it the 1959 film"}
    note: "The record uses 1958, the first release; the difference is limited versus general release."
  - key: kiss-me-deadly-release-year
    question: Is Kiss Me Deadly a 1955 or a 1956 film?
    about: [{artwork: kiss-me-deadly-1955}]
    field: made
    claims:
      - {value: "1955", sources: [wp-kiss-me-deadly-1955], note: "Lead: a 1955 American film noir"}
      - {value: "1956", sources: [wp-bunker-hill-los-angeles], note: "Bunker Hill's list of films gives Kiss Me Deadly (1956)"}
    note: "The record uses 1955, from the film's own article."
  - key: henry-lehrman-birth-date
    question: Was Henry Lehrman born on 30 March 1881, or in 1886?
    about: [{person: henry-lehrman}]
    field: born
    claims:
      - {value: "1881-03-30", sources: [wp-henry-lehrman], note: "Wikipedia lead"}
      - {value: "1886-03-30", sources: [wd-henry-lehrman], note: "One of two Wikidata dates of birth"}
      - {value: "1886-04-21", sources: [wd-henry-lehrman], note: "The other Wikidata date of birth"}
    note: "The record uses Wikipedia's 1881-03-30."
  - key: michael-curtiz-death-date
    question: Did Michael Curtiz die on 10 April or 10 March 1962?
    about: [{person: michael-curtiz}]
    field: died
    claims:
      - {value: "1962-04-10", sources: [wp-michael-curtiz], note: "Wikipedia lead; also one of Wikidata's two dates"}
      - {value: "1962-03-10", sources: [wd-michael-curtiz], note: "Second Wikidata date of death"}
    note: "The record uses 1962-04-10."
  - key: phil-tucker-death-date
    question: Did Phil Tucker die on 30 November or 1 December 1985?
    about: [{person: phil-tucker}]
    field: died
    claims:
      - {value: "1985-11-30", sources: [wp-phil-tucker], note: "Wikipedia lead; also one of Wikidata's two dates"}
      - {value: "1985-12-01", sources: [wd-phil-tucker], note: "Second Wikidata date of death"}
    note: "The record uses 1985-11-30."
  - key: kent-mackenzie-death-date
    question: Did Kent Mackenzie die in May 1980 or May 1990?
    about: [{person: kent-mackenzie}]
    field: died
    claims:
      - {value: "1980-05-16", sources: [wp-kent-mackenzie], note: "Wikipedia lead; also one of Wikidata's two dates"}
      - {value: "1990 (May)", sources: [wd-kent-mackenzie], note: "Second Wikidata date of death, to the month"}
    note: "The record uses 1980-05-16."
