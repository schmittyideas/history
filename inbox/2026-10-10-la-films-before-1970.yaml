# Los Angeles films before 1970: more famous films, silent era to the 1960s, shot at places in the city of Los Angeles.
# Part of a "top 100 Los Angeles film locations" set (parallel batches cover 1970-1999 and 2000 onwards). Follows the
# conventions of inbox/2026-10-10-los-angeles-film-locations.yaml: each film is an artwork (kind: film) linked to its
# director (creator) and to the places it was shot (role: filmed). No cast, plot or posters: this is a locale database.
# VERIFIED against English Wikipedia articles downloaded on 2026-10-10 with tools/wiki.py (revision IDs in the session
# scratchpad). Candidates came from Wikidata "filming location" (P915) inside Los Angeles and the landmarks' own film
# lists; every film-place claim below is stated in the film's article, the place's article, or both (the cited sources
# say which).
# Stated honestly:
#  - Coordinates of new places are from general knowledge (the articles give none), approximate to ~3 decimals.
#  - Directors are added with life dates and one line only (coverage: not-read, "added as director of ...").
#  - Chaplin-Keaton-Lloyd Alley has no Wikipedia article of its own; its key is its name, and its only source is the
#    article on Cops (1922).
#  - Bunker Hill's Victorian streets, where Criss Cross, M, Cry Danger, Kiss Me Deadly and The Exiles were shot, were
#    razed in the 1960s redevelopment; the district itself is visitable, so it is kept as a place with that said.
#  - Angels Flight is linked for Criss Cross, M and Kiss Me Deadly: the cars ran on Third Street then and run half a
#    block south now (see the place's note from the earlier batch).
# Left out because Wikipedia doesn't confirm a Los Angeles location:
#  - North by Northwest (Wikidata says Griffith Park; the article names Wasco, New York, Chicago, Mount Rushmore and MGM).
#  - Easy Rider (no LA location named), Point Blank (the Los Angeles River money drop is only in the plot),
#    Safety Last! (as in the earlier batch), I Confess (Wikidata says Hollywood; the article doesn't).
#  - Recreation (1914): Echo Park Lake's article says it takes place there, but it has no article of its own to check.
# Left out because the place is gone, not visitable, or outside the city of Los Angeles:
#  - The Graduate's Ambassador Hotel (demolished), Stalag 17's prison-camp set on the John Show Ranch in Woodland Hills
#    (now a church), Double Indemnity's Jerry's Market, Big Business's private house in Cheviot Hills.
#  - Studio-lot films at MGM in Culver City (North by Northwest's interiors, Singin' in the Rain) and anything in
#    Pasadena, Glendale, Santa Monica or Beverly Hills; Sunset Boulevard's road scenes in Griffith Park are not added
#    here (the film is already in the database).
#  - Obscure films at already-linked places: While the City Sleeps (1928, City Hall in the background), The Unfaithful,
#    Shockproof, I, the Jury, Indestructible Man, Caprice and Marlowe (Bradbury Building).
# Sources disagree (recorded as discrepancies): where The Birth of a Nation's battle scenes were shot; who directed
# Twenty Minutes of Love; the release year of House on Haunted Hill and of Kiss Me Deadly; Henry Lehrman's birth date;
# Michael Curtiz's, Phil Tucker's and Kent Mackenzie's death dates.
batch:
  title: "Los Angeles films before 1970"
  requested: "About 25 more famous films released before 1970, shot at specific Los Angeles places, as artworks (kind: film) linked to their directors and to the places they were filmed"
  date: 2026-10-10

