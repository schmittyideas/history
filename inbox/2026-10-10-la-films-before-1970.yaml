places:
  - key: chaplin-keaton-lloyd-alley
    name: Chaplin-Keaton-Lloyd Alley
    kind: alley
    city: Los Angeles
    region: California
    country: United States
    lat: 34.101
    lng: -118.329
    visitable: true
    visit_site: "A one-block alley near Hollywood Boulevard and Cahuenga Boulevard, Hollywood"
    note: "One-block Hollywood alley where many silent films were shot, Keaton's Cops (1922) among them; later renamed after Chaplin, Keaton and Lloyd."
    sources: [wp-cops-1922]
  - key: sunset-bronson-studios
    name: Sunset Bronson Studios (Old Warner Brothers Studio)
    historical_name: Warner Bros. Studio, Sunset Boulevard
    kind: film studio
    city: Los Angeles
    region: California
    country: United States
    lat: 34.098
    lng: -118.321
    founded: 1919
    visitable: false
    visit_site: "A working studio; the Executive Office Building is seen from Sunset Boulevard at Bronson Avenue, Hollywood"
    note: "Warner Bros.' studio on Sunset Boulevard, where The Jazz Singer, the first talking feature, was filmed in 1927. Later KTLA and Tribune Studios; a Los Angeles Historic-Cultural Monument (1977), its Executive Office Building on the National Register (2002)."
    sources: [wp-sunset-bronson-studios]
  - key: ennis-house
    name: Ennis House
    kind: house
    city: Los Angeles
    region: California
    country: United States
    lat: 34.117
    lng: -118.293
    founded: 1925
    architect: "Frank Lloyd Wright"
    built_by: "Charles and Mabel Ennis; Lloyd Wright supervised construction"
    visitable: true
    visit_site: "2607 Glendower Avenue, Los Feliz: exterior from the street; a private house, open to the public at least 12 days a year under an easement"
    note: "Mayan Revival textile-block house by Frank Lloyd Wright, finished 1925. A favourite filming location since Female (1933); House on Haunted Hill made it famous as a haunted house, and it is J. F. Sebastian's home in Blade Runner."
    sources: [wp-ennis-house]
  - key: bunker-hill-los-angeles
    name: Bunker Hill
    kind: district
    city: Los Angeles
    region: California
    country: United States
    lat: 34.053
    lng: -118.252
    visitable: true
    visit_site: "Downtown district around Grand Avenue and Angels Flight; the Victorian streets seen in the films are gone"
    note: "Downtown hill of Victorian mansions and rooming houses, a favourite film noir setting in the 1940s and 1950s (Criss Cross, M, Cry Danger, Kiss Me Deadly). Lowered and rebuilt with high-rises from the 1960s."
    sources: [wp-bunker-hill-los-angeles]
  - key: bronson-canyon
    name: Bronson Canyon (Bronson Caves)
    kind: canyon
    city: Los Angeles
    region: California
    country: United States
    lat: 34.122
    lng: -118.314
    founded: 1903
    built_by: "Quarried by the Union Rock Company from 1903 to the late 1920s, leaving the caves"
    visitable: true
    visit_site: "Griffith Park, a short walk from the north end of Canyon Drive"
    note: "Old quarry in the southwest of Griffith Park whose short tunnel and craggy walls have stood in for wilderness in westerns and science fiction for a century; the Batcave entrance in the 1960s Batman series."
    sources: [wp-bronson-canyon, wp-griffith-park]
  - key: los-angeles-river
    name: Los Angeles River
    kind: river
    region: California
    country: United States
    lat: 34.042
    lng: -118.228
    visitable: true
    visit_site: "The concrete channel east of Downtown, seen from the First to Seventh Street bridges"
    note: "River flowing 51 miles from Canoga Park through the San Fernando Valley and Downtown to Long Beach; set in a concrete channel after the floods of the early 20th century. Its storm-channel stretch east of Downtown is a much-used filming location."
    sources: [wp-los-angeles-river, wp-them-1954]
  - key: echo-park-lake
    name: Echo Park Lake
    kind: park
    city: Los Angeles
    region: California
    country: United States
    lat: 34.073
    lng: -118.261
    founded: 1868
    visitable: true
    visit_site: "Echo Park, off Glendale Boulevard: the lake, boathouse and lotus beds"
    note: "Reservoir of 1868 made a park in the 1890s, beside the early studios of Edendale; Keystone shot comedies here until the city banned them for trampling the flowers."
    sources: [wp-echo-park-lake]
  - key: fox-studio-lot
    name: Fox Studio Lot
    historical_name: Fox Movietone City
    kind: film studio
    city: Los Angeles
    region: California
    country: United States
    lat: 34.051
    lng: -118.413
    founded: 1928
    built_by: "William Fox, for the Fox Film Corporation"
    visitable: false
    visit_site: "A working studio in Century City, off Pico Boulevard; not open to visitors"
    note: "20th Century Fox's studio from 1935; its northern land was sold in 1961 and became Century City. The backlot's New York Street was built for Hello, Dolly! (1969) and rebuilt from 2023."
    sources: [wp-fox-studio-lot]

