    people: [{person: isoroku-yamamoto, role: planned}, {person: chuichi-nagumo, role: commander}, {person: hirohito, role: approved}, {person: franklin-d-roosevelt, role: infamy speech}]
    sources: [wp-attack-on-pearl-harbor]
  - key: battle-of-midway
    people:
      - {person: chester-w-nimitz, role: victor}
      - {person: raymond-a-spruance, role: commander}
      - {person: isoroku-yamamoto, role: defeated}
      - {person: chuichi-nagumo, role: defeated}
