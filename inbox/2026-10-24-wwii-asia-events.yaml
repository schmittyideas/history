events:
  - key: mukden-incident
    name: Mukden incident
    type: Incident
    date: 1931-09-18
    place: mukden-incident-site
    prominence: 3
    note: Japanese officers set off a small charge by the Japanese-owned railway near Mukden, blamed Chinese dissidents, and used it to invade Manchuria.
    sources: [wp-mukden-incident]
  - key: japanese-invasion-of-manchuria
    name: Japanese invasion of Manchuria
    type: Invasion
    date: 1931-09-18
    end_year: 1932
    place: shenyang
    prominence: 4
    note: The Kwantung Army occupied Manchuria (official resistance ended 27 February 1932), and Japan set up the puppet state of Manchukuo.
    sources: [wp-japanese-invasion-of-manchuria]
  - key: battle-of-shanghai
    name: Battle of Shanghai
    type: Battle
    date: 1937-08-13
    end_year: 1937
    place: shanghai
    places: [{place: sihang-warehouse, role: last stand, note: "Defence of Sihang Warehouse, October 1937"}]
    prominence: 3
    people: [{person: chiang-kai-shek, role: commander}, {person: iwane-matsui, role: commander}, {person: fumimaro-konoe, role: prime minister}]
    note: The first major battle of the Second Sino-Japanese War, and its largest urban battle before Stalingrad; Japan took Shanghai by 26 November.
    sources: [wp-battle-of-shanghai, wp-defense-of-sihang-warehouse]
  - key: nanjing-massacre
    name: Nanjing Massacre
    type: Massacre
    date: 1937-12-13
    end_year: 1938
    place: nanjing
    places: [{place: nanjing-massacre-memorial-hall, role: memorial}]
    prominence: 4
    people: [{person: iwane-matsui, role: commander}, {person: fumimaro-konoe, role: prime minister}]
    note: After taking Nanjing, the Japanese army murdered and raped civilians and prisoners for weeks; most estimates put the dead at 100,000–200,000 or more.
    sources: [wp-nanjing-massacre, wp-nanjing-massacre-memorial-hall]
  - key: hundred-regiments-offensive
    name: Hundred Regiments Offensive
    type: Offensive
    date: 1940-08-20
    end_year: 1941
    place: niangzi-pass
    prominence: 3
    people: [{person: zhu-de, role: commander}, {person: mao-zedong, role: opposed the strategy}]
    note: The Communist Eighth Route Army's 105 regiments attacked Japanese railways and strongpoints across North China (to 24 January 1941).
    sources: [wp-hundred-regiments-offensive, wp-niangzi-pass]
  - key: unit-731
    name: Unit 731
    type: Atrocity
    year: 1933
    end_year: 1945
    place: unit-731-pingfang
    prominence: 3
    people: [{person: hirohito, role: decree of 1936}, {person: douglas-macarthur, role: granted immunity}]
    note: A secret Japanese army unit for biological and chemical warfare that experimented on and killed thousands of prisoners; its staff were given US immunity.
    sources: [wp-unit-731]
  - key: fall-of-singapore
    name: Fall of Singapore
    type: Battle
    date: 1942-02-08
    end_year: 1942
    place: singapore
    places: [{place: former-ford-factory, role: surrender, note: "Percival surrendered here on 15 February 1942"}]
    prominence: 4
    people: [{person: tomoyuki-yamashita, role: victor}, {person: arthur-percival, role: surrendered}, {person: winston-churchill, role: ordered resistance}]
    note: Japan crossed the Johor Strait and took Singapore on 15 February 1942, the largest surrender in British history (about 80,000 prisoners).
    sources: [wp-fall-of-singapore, wp-former-ford-factory]
  - key: bombing-of-darwin
    name: Bombing of Darwin
    type: Bombing
    date: 1942-02-19
    place: darwin
    prominence: 3
    people: [{person: chuichi-nagumo, role: commander}]
    note: 188 Japanese aircraft struck Darwin in two raids, the largest foreign attack on Australia; the official count is about 250 dead.
    sources: [wp-bombing-of-darwin]
  - key: bataan-death-march
    name: Bataan Death March
    type: Atrocity
    date: 1942-04-09
    end_year: 1942
    place: mariveles
    places: [{place: camp-odonnell, role: finish}]
    prominence: 3
    note: The Japanese army forced about 72,000–78,000 Filipino and American prisoners to march to Camp O'Donnell; thousands were killed or died.
    sources: [wp-bataan-death-march, wp-camp-odonnell, wp-mariveles]
  - key: doolittle-raid
    name: Doolittle Raid
    type: Raid
    date: 1942-04-18
    place: tokyo
    prominence: 3
    people: [{person: william-halsey-jr, role: escort commander}, {person: franklin-d-roosevelt, role: pressed for}]
    note: Sixteen US Army B-25s flew off the carrier Hornet to bomb Tokyo and other cities, the first American strike on Japan's home islands.
    sources: [wp-doolittle-raid]
  - key: battle-of-the-coral-sea
    name: Battle of the Coral Sea
    type: Battle
    date: 1942-05-04
    end_year: 1942
    place: coral-sea
    places: [{place: tulagi, role: invaded, note: "Taken by Japan on 3–4 May"}]
    prominence: 3
    people: [{person: douglas-macarthur, role: commander}, {person: chester-w-nimitz, role: commander}, {person: isoroku-yamamoto, role: commander}]
    note: The first battle between aircraft carriers (4–8 May 1942); a tactical Japanese win but a strategic Allied one that saved Port Moresby.
    sources: [wp-battle-of-the-coral-sea, wp-tulagi]
  - key: kokoda-track-campaign
    name: Kokoda Track campaign
    type: Campaign
    date: 1942-07-21
    end_year: 1942
    place: kokoda
    places: [{place: isurava, role: battle, note: From 26 August 1942}]
    prominence: 3
    people: [{person: douglas-macarthur, role: commander}, {person: thomas-blamey, role: commander}, {person: john-curtin, role: prime minister}]
    note: Australian and Papuan troops stopped Japan's overland drive on Port Moresby across the Owen Stanley Range and pushed it back, to 16 November.
    sources: [wp-kokoda-track-campaign]
  - key: guadalcanal-campaign
    name: Guadalcanal campaign
    type: Campaign
    date: 1942-08-07
    end_year: 1943
    place: guadalcanal
    places:
      - {place: henderson-field-guadalcanal, role: objective, note: "The airfield, taken on 8 August and fought over for months"}
      - {place: tulagi, role: landing}
    prominence: 4
    people:
      - {person: chester-w-nimitz, role: commander}
      - {person: william-halsey-jr, role: commander}
      - {person: isoroku-yamamoto, role: commander}
      - {person: chuichi-nagumo, role: commander}
    note: The first major Allied land offensive against Japan, fought over the island's airfield and the seas around it, to 9 February 1943.
    sources: [wp-guadalcanal-campaign]
  - key: battle-of-imphal
    name: Battle of Imphal
    type: Battle
    date: 1944-03-08
    end_year: 1944
    place: imphal
    places: [{place: imphal-war-cemetery, role: memorial}]
    prominence: 3
    people: [{person: william-slim, role: commander}, {person: louis-mountbatten, role: supreme commander}, {person: hideki-tojo, role: approved the offensive}]
    note: Japan's offensive into India failed around Imphal (to 3 July 1944), turning the Burma campaign in the Allies' favour.
    sources: [wp-battle-of-imphal, wp-imphal-war-cemetery]
  - key: battle-of-kohima
    name: Battle of Kohima
    type: Battle
    date: 1944-04-04
    end_year: 1944
    place: kohima
    places: [{place: kohima-war-cemetery, role: memorial}]
    prominence: 3
    people: [{person: william-slim, role: commander}]
    note: British and Indian troops held Kohima ridge in three stages and reopened the road to besieged Imphal on 22 June 1944.
    sources: [wp-battle-of-kohima, wp-kohima-war-cemetery]
  - key: battle-of-the-philippine-sea
    name: Battle of the Philippine Sea
    type: Battle
    date: 1944-06-19
    end_year: 1944
    place: philippine-sea
    prominence: 3
    people: [{person: raymond-a-spruance, role: commander}]
    note: The largest carrier battle in history, the "Great Marianas Turkey Shoot", which ended Japan's ability to fight big carrier actions.
    sources: [wp-battle-of-the-philippine-sea]
  - key: battle-of-leyte-gulf
    name: Battle of Leyte Gulf
    type: Battle
    date: 1944-10-23
    end_year: 1944
    place: leyte-gulf
    prominence: 4
    people: [{person: william-halsey-jr, role: commander}, {person: douglas-macarthur, role: pressed for the invasion}]
    note: By some measures the largest naval battle in history (23–26 October 1944); the US fleets defeated Japan's bid to stop the Philippine landings.
    sources: [wp-battle-of-leyte-gulf]
  - key: battle-of-iwo-jima
    name: Battle of Iwo Jima
    type: Battle
    date: 1945-02-19
    end_year: 1945
    place: iwo-jima
    places: [{place: mount-suribachi, role: flag raising, note: 23 February 1945}]
    prominence: 4
    people: [{person: raymond-a-spruance, role: commander}]
    note: US Marines took the island from dug-in defenders by 26 March 1945; the flag raising on Suribachi became one of the war's best-known photographs.
    sources: [wp-battle-of-iwo-jima, wp-mount-suribachi]
  - key: bombing-of-tokyo-1945
    name: Bombing of Tokyo (Operation Meetinghouse)
    type: Bombing
    date: 1945-03-09
    end_year: 1945
    place: tokyo
    places: [{place: yokoamicho-park, role: memorial}]
    prominence: 4
    people: [{person: hirohito, role: toured the ruins}]
    note: 279 B-29s firebombed eastern Tokyo overnight on 9–10 March 1945, the most destructive single air raid of the war; about 90,000–100,000 died.
    sources: [wp-bombing-of-tokyo-10-march-1945]
  - key: soviet-invasion-of-manchuria
    name: Soviet invasion of Manchuria
    type: Invasion
    date: 1945-08-09
    end_year: 1945
    place: manchuria
    prominence: 4
    people: [{person: joseph-stalin, role: ordered}]
    note: The Soviet Union declared war on Japan on 8 August and invaded Manchukuo just after midnight, between the two atomic bombings.
    sources: [wp-soviet-invasion-of-manchuria]
  - key: tokyo-trial
    name: Tokyo Trial (International Military Tribunal for the Far East)
    type: Trial
    date: 1946-04-29
    end_year: 1948
    place: ichigaya
    places: [{place: sugamo-prison, role: executions, note: "Seven were hanged here on 23 December 1948"}]
    prominence: 3
    people:
      - {person: hideki-tojo, role: sentenced to death}
      - {person: iwane-matsui, role: sentenced to death}
      - {person: douglas-macarthur, role: set up the tribunal}
    note: The Allies tried 28 Japanese leaders; on 12 November 1948 seven were sentenced to death and sixteen to life imprisonment.
    sources: [wp-international-military-tribunal-for-the-far-east, wp-sugamo-prison]
  # Existing events: link the people now in the database.
