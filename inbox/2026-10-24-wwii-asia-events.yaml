batch:
  title: "WWII, batch 3b: the war in Asia and the Pacific"
  requested: "Ty: go ahead with batch 3, the Pacific and China (with Southeast Asia, atrocities in Asia, the Chinese Communists, and Australia and New Zealand); do all batches"
  date: 2026-10-24

# Notes for the reviewer
# - Facts come from each event's English Wikipedia article, read through the Wikipedia API on 2026-10-24 (infobox and body). Site
#   coordinates come from each site's own article; Yokoamichō Park, Kokoda and Isurava come from Wikidata.
# - Needs batch 3a (2026-10-24-wwii-asia-commanders.yaml) applied first: the people linked here are added there.
# - Atrocities (Nanjing, Unit 731, Bataan) give death tolls as the articles do, with the range; the disputed figures are logged as
#   discrepancies rather than settled.
# - Unit 731 has no single event date: the event spans its existence in its infobox (1933-1945), placed at its Pingfang compound.
# - Sea battles are placed at the article's own point at sea (Philippine Sea; Coral Sea from the Coral Sea article, as the battle
#   article has none). The Doolittle Raid is placed at Tokyo, its main target; the article gives no coordinates.
# - The Tokyo Trial is placed at Ichigaya, the former army building where the court sat (article caption); the present Ministry
#   of Defense stands there. MacArthur's Leyte landing is not mentioned in the Leyte Gulf article, so it is left out.
# - People: infobox commanders and people the body names in a clear role. Desmond Doss is already linked to Okinawa.
# - Prominence: 4 for the invasion of Manchuria, Nanjing, Singapore, Guadalcanal, Leyte Gulf, Iwo Jima, the Tokyo firebombing and
#   the Soviet invasion of Manchuria; 3 for the rest.

