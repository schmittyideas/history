discrepancies:
  - key: anne-frank-death-date
    question: When did Anne Frank die?
    about: [{person: anne-frank}]
    field: died
    claims:
      - {value: "March 1945 (Red Cross estimate)", sources: [wp-anne-frank]}
      - {value: "31 March 1945 (the date set by the Dutch authorities)", sources: [wp-anne-frank]}
      - {value: "February 1945 (2015 research on when typhus was seen)", sources: [wp-anne-frank]}
    note: The record has 1945, estimated.
  - key: wallenberg-death
    question: When and how did Raoul Wallenberg die?
    about: [{person: raoul-wallenberg}]
    field: died
    claims:
      - {value: "17 July 1947 in his Lubyanka cell, probably of a heart attack (Soviet document, 1957)", sources: [wp-raoul-wallenberg]}
      - {value: "Executed in the Lubyanka in 1947 (Russian inquiries, 1991 and 2000; Serov diary)", sources: [wp-raoul-wallenberg]}
      - {value: "31 July 1952 (pro forma date when Sweden declared him dead, 2016)", sources: [wp-raoul-wallenberg]}
    note: The record has 1947, estimated, and no death place.
  - key: heydrich-deputy-protector-start
    question: Did Heydrich become Deputy Reich Protector on 27 or 29 September 1941?
    about: [{person: reinhard-heydrich}]
    field: date
    claims:
      - {value: "1941-09-27 (appointed)", sources: [wp-reinhard-heydrich], note: Body}
      - {value: "1941-09-29", sources: [wp-reinhard-heydrich], note: Infobox term start}
    note: The title uses the appointment date.
  - key: hoss-commandant-dates
    question: When was Höss commandant of Auschwitz?
    about: [{person: rudolf-hoss}]
    field: date
    claims:
      - {value: "4 May 1940 – November 1943", sources: [wp-rudolf-hoss], note: Lead}
      - {value: "From 30 April 1940", sources: [wp-rudolf-hoss], note: Infobox}
      - {value: "Until 1 December 1943 (his own 1946 affidavit); replaced by Liebehenschel on 10 November 1943 (body)", sources: [wp-rudolf-hoss]}
    note: The title runs 4 May 1940 – 10 November 1943.
  - key: moulin-death-place
    question: Where did Jean Moulin die?
    about: [{person: jean-moulin}]
    field: place
    claims:
      - {value: "In or near Metz station, on a train to Germany (German death certificate)", sources: [wp-jean-moulin]}
      - {value: "Uncertain: the article says reports of the place and time conflict", sources: [wp-jean-moulin]}
    note: Filed at Metz, as on the death certificate.
