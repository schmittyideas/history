batch:
  title: "WWII, batch 4a: the Holocaust and resistance — people"
  requested: "Ty: WWII build-out, batch 4 (Holocaust and resistance); do all batches"
  date: 2026-10-24

# Notes for the reviewer
# - Facts come from each person's English Wikipedia article, read through the Wikipedia API on 2026-10-24 (infobox and body).
#   Sitelinks are Wikipedia language editions only, from Wikidata on 2026-10-24. New places cite the person's own article (which
#   names the place) and the place's coordinates from its own article or Wikidata. This is sensitive history: notes stay factual.
# - Types. Government: Himmler and Heydrich (senior Nazi officials). Military: the SS officers Eichmann, Höss and Mengele, and
#   Stauffenberg. Writer: Anne Frank, Primo Levi, Elie Wiesel (the articles frame them as writers; their prominence follows the
#   sitelinks scale). Scholar: Bonhoeffer, a theologian and pastor (roles say so; Clergy is for popes and bishops). Notable: the
#   rescuers, resisters and witnesses known for one story (Otto Frank, Wallenberg, Sugihara, Sendler, the Scholls, Moulin,
#   Anielewicz, Wiesenthal).
# - SS and police posts are military titles, so they stay out of the Year view's rulers (Reichsführer-SS, head of the RSHA,
#   commandant of Auschwitz). Himmler's Interior Ministry and Heydrich's post in Bohemia and Moravia are plain titles; the
#   Protectorate of Bohemia and Moravia is a new realm.
# - Left out as titles: Eichmann's RSHA section (no end date), Moulin's National Council of the Resistance and Sugihara's Kaunas
#   consulate (a resistance body and a consular post, which would show as rulers of France and Japan). Their notes say what they did.
# - Uncertain deaths: Anne Frank died in February or March 1945 (year, estimated); Wallenberg's death is disputed (1947, estimated,
#   with no death place). Both are logged. Anielewicz's birth is the year only (1919).
# - Portraits: public domain or CC0 lead images only. Left out: Himmler, Otto Frank, Bonhoeffer (CC BY-SA), Hans Scholl (non-free),
#   Primo Levi and Elie Wiesel (CC BY-SA). Sophie Scholl's lead image is the Gestapo photograph taken after her arrest; it is the
#   article's own lead image and public domain, so it is used.
# - Places moved here from batch 4b because people died there: Bergen-Belsen, Stadelheim Prison, the Bendlerblock, Ayalon Prison,
#   the Warsaw Ghetto. No burial is recorded where there is no grave: Eichmann's and Höss's ashes were scattered, Himmler's grave
#   is unmarked and unknown, Bonhoeffer has no known grave, and Anne Frank lies in a mass grave at Bergen-Belsen.

