# Presidents' wives, batch 1 of 2: the wives of the presidents who took office 1789-1881 (Washington to Arthur) (every wife, not only First Ladies).
# Ty's choices (2026-10-18): every wife; type Notable (prominence from sitelinks, like cultural figures), except where
# a wife is best known for something else (Hillary Clinton: Government, as senator and Secretary of State; Jane Wyman:
# Artist, as an actress); the First Ladyship as a title, "First Lady of the United States", realm United States.
# Hostesses who weren't wives (Harriet Lane, Martha Jefferson Randolph, Emily Donelson...) are left out.
# VERIFIED: wives and marriage dates from Wikidata (P26 with start/end qualifiers), each checked against the wife's
# English Wikipedia article downloaded on 2026-10-18 with tools/wiki.py (revision IDs in the session scratchpad):
# birth and death dates in the lead, and the marriage date in the text. Sitelinks read from Wikidata on 2026-10-18.
# First Lady years: her husband's term dates (from inbox/2026-10-13-us-presidents-*.yaml, from his own article), cut to
# the marriage and her life: a wife who married during the term starts on the wedding day; one who died ends that day.
# Wives who were never First Lady get no title, and their note says why.
# Stated honestly:
#  - Martha Washington: her article gives her birth only in the Old Style, 2 June 1731; kept as given, with a note.
#  - Rachel Jackson: married Jackson c. 1791 believing her divorce final; they remarried on 18 January 1794 (the date
#    used). She died on 22 December 1828, before his inauguration, so she was never First Lady.
#  - Julia Gardiner Tyler: Wikipedia says born 4 May 1820, Wikidata 22 April; Lucretia Garfield: Wikipedia says died
#    13 March 1918, Wikidata 14 March. Both recorded as discrepancies; the records use Wikipedia.
#  - James Buchanan never married.
batch:
  title: "Presidents' wives, batch 1"
  requested: "Have we added all the US presidents and their wives? Add the wives (all of them), as Notable people with the First Lady title"
  date: 2026-10-18

