discrepancies:
  - key: alp-arslan-birth
    question: When was Alp Arslan born?
    about: [{person: alp-arslan}]
    field: born
    claims:
      - {value: "10 January 1030", sources: [wp-alp-arslan], note: "Zahir al-Din Nishapuri, al-Husaini al-Yazidi, Mirkhvand, Khvandamir and Hasan-i Yazdi"}
      - {value: "1032-1033", sources: [wp-alp-arslan], note: "Bundari, Ibn Khallikan, Ibn al-Adim and Ibn al-Athir (main account)"}
      - {value: "20 January 1029", sources: [wp-alp-arslan], note: "Ibn al-Athir's alternative; the article says the literature generally accepts it because 1032-33 does not fit the known facts of his life"}
    note: "The record uses 20 January 1029."
  - key: rum-sultanate-founding
    question: When did Suleiman ibn Qutalmish found the Sultanate of Rum?
    about: [{person: suleiman-ibn-qutulmish}]
    field: date
    claims:
      - {value: "1075", sources: [wp-suleiman-ibn-qutulmish], note: "He captured Nicaea in 1075 (al-Azimi), and some historians date the state to then"}
      - {value: "1077", sources: [wp-suleiman-ibn-qutulmish, wp-sultanate-of-rum], note: "Both articles' leads: seceded from the Seljuk Empire in 1077 (ruled 1077-1086)"}
      - {value: "1078-1081", sources: [wp-suleiman-ibn-qutulmish], note: "Other historians: founding between 1078 and 1081; Nicaea won 1075-1081 and the sultanate set up 'around two years later' (Rum article)"}
      - {value: "1084", sources: [wp-sultanate-of-rum], note: "Officially recognised as a vassal by Malik-Shah I in 1084"}
    note: "The title row starts in 1077, the year both leads give."
  - key: suleiman-ibn-qutulmish-death
    question: How did Suleiman ibn Qutalmish die at Ain Salm in 1086?
    about: [{person: suleiman-ibn-qutulmish}]
    field: died
    claims:
      - {value: "Killed in battle when his forces fled before Tutush's army under Artuk Bey", sources: [wp-suleiman-ibn-qutulmish]}
      - {value: "Died at Ain Salm 'either fighting his enemies or by suicide'", sources: [wp-sultanate-of-rum]}
    note: "Both give 1086 and Ain Salm."
  - key: kilij-arslan-ii-birth-year
    question: In what year was Kilij Arslan II born?
    about: [{person: kilij-arslan-ii}]
    field: born
    claims:
      - {value: "1113", sources: [wp-kilij-arslan-ii], note: "'Born in 1113'"}
      - {value: "about 1115 (aged 77 at his death in August 1192)", sources: [wp-kilij-arslan-ii], note: "The same article's death line gives his age"}
    note: "The record uses 1113, the stated birth year."
  - key: kaykhusraw-i-death-place
    question: In which battle did Kaykhusraw I die in 1211?
    about: [{person: kaykhusraw-i}]
    field: place
    claims:
      - {value: "The Battle of Antioch on the Meander, 1211", sources: [wp-kaykhusraw-i]}
      - {value: "He died 'following the battle of Alasehir' in 1211", sources: [wp-kayqubad-i]}
    note: "Both give 1211. No place is recorded."
  - key: kose-dag-location
    question: Where is the pass of Kose Dag, where the Mongols beat Kaykhusraw II?
    about: [{event: battle-of-kose-dag-1243}, {place: kose-dag-battlefield}]
    field: place
    claims:
      - {value: "Between Erzincan and Gumushane", sources: [wp-kaykhusraw-ii]}
      - {value: "A mountain between Sivas and Erzincan", sources: [wp-sultanate-of-rum]}
    note: "The Kose Dag article says only 'in eastern Anatolia'. The point on the map is approximate; the date, 26 June 1243, agrees in the articles that give it."
  - key: osman-birth
    question: When was Osman I born?
    about: [{person: osman-i}]
    field: born
    claims:
      - {value: "13 February 1258", sources: [wp-osman-i], note: "'Some sources', the day the Mongols took Baghdad"}
      - {value: "1254/5", sources: [wp-osman-i], note: "Kemalpasazade, the sixteenth-century Ottoman historian; the article thinks it 'most likely' around the middle of the century"}
    note: "The record uses c.1255, estimated. Born at Sogut, per the few sources."
  - key: osman-accession-and-state-founding
    question: When did Osman become leader, and when was the Ottoman beylik founded?
    about: [{person: osman-i}]
    field: date
    claims:
      - {value: "Around 1281, on his father Ertugrul's death", sources: [wp-osman-i, wp-battle-of-bapheus]}
      - {value: "The beylik was founded c.1299", sources: [wp-ottoman-empire]}
    note: "The title row starts c.1281. Some historians add that Osman had to fight relatives for the leadership (Osman article)."
  - key: osman-death
    question: When did Osman I die?
    about: [{person: osman-i}]
    field: died
    claims:
      - {value: "1323/4", sources: [wp-osman-i, wp-ottoman-empire, wp-orhan], note: "Osman's lead; Orhan's article says 1323 or 1324"}
      - {value: "21 August 1326, at about 70, after hearing of the fall of Bursa", sources: [wp-osman-i], note: "'It is said'; other sources say he died just before Bursa fell"}
      - {value: "1320", sources: [wp-osman-i], note: "Rouhi Celebi"}
      - {value: "1327", sources: [wp-osman-i], note: "Uruc adiloglu"}
    note: "The record uses c.1324. Necdet Sakaoglu notes no document mentions Osman after 1320 and documents confirm Orhan's accession in 1324 (Osman article)."
  - key: battle-of-bapheus-date
    question: In what year was the Battle of Bapheus fought?
    about: [{event: battle-of-bapheus-1302}]
    field: date
    claims:
      - {value: "27 July 1299", sources: [wp-battle-of-bapheus], note: "The article's lead, Gibbon (following Poussines) and a 2017 reassessment of Pachymeres, matching the severe winter of 1298-99"}
      - {value: "27 July 1301", sources: [wp-battle-of-bapheus], note: "von Hammer-Purgstall's first proposal"}
      - {value: "27 July 1302", sources: [wp-battle-of-bapheus, wp-osman-i], note: "von Hammer's later date, accepted by many scholars; the body of the Bapheus article and Osman's article"}
    note: "The record uses 27 July 1302, the date accepted by many scholars and given by the body of the article, against its own lead."
  - key: orhan-accession
    question: When did Orhan become ruler?
    about: [{person: orhan}]
    field: date
    claims:
      - {value: "1323/4", sources: [wp-orhan], note: "The lead: sultan from 1323/4 to 1362"}
      - {value: "1324", sources: [wp-osman-i], note: "Documents confirm his accession in 1324 (Sakaoglu)"}
      - {value: "1326", sources: [wp-orhan], note: "The article says he died in 1362 'after a reign of thirty-six years'"}
    note: "The title row starts in 1324, estimated."
  - key: bursa-fall
    question: How did Bursa fall to the Ottomans?
    about: [{event: capture-of-bursa-1326}, {place: bursa}]
    field: date
    claims:
      - {value: "After a six to nine year blockade the Byzantine emperor ordered the governor to evacuate; Orhan entered on 6 April 1326", sources: [wp-osman-i]}
      - {value: "Orhan captured Bursa by persuading its Byzantine commander to defect, after taking Mudanya in 1321", sources: [wp-orhan]}
    note: "Only Osman's article gives a day. Osman may have died just before, or heard the news on his deathbed."
  - key: murad-i-death-date-1389
    question: On what day did the Battle of Kosovo take place and Murad I die?
    about: [{person: murad-i}, {event: battle-of-kosovo-1389}]
    field: died
    claims:
      - {value: "15 June 1389, during the battle", sources: [wp-battle-of-kosovo, wp-murad-i, wp-bayezid-i]}
      - {value: "16 June 1389, immediately after the battle", sources: [wp-bayezid-i]}
      - {value: "28 June 1389 (St Vitus day)", sources: [wp-battle-of-kosovo], note: "The Florentine senate's letter to Tvrtko (20 October 1389); the article says Vidovdan is observed by the Julian calendar, equal to 28 June Gregorian today"}
    note: "The record uses 15 June 1389."
  - key: murad-i-killer-and-timing
    question: Who killed Murad I at Kosovo, and when in the battle?
    about: [{person: murad-i}, {event: battle-of-kosovo-1389}]
    field: died
    claims:
      - {value: "Milos Obilic stabbed him in the first hours, pretending to defect", sources: [wp-murad-i, wp-battle-of-kosovo]}
      - {value: "Killed by a sword wound by one of twelve Serbian lords who cut through the line, unnamed (Obilic 'allegedly')", sources: [wp-murad-i, wp-battle-of-kosovo], note: "The Florentine letter of 20 October 1389"}
      - {value: "Assassinated while inspecting the battlefield after the battle ended", sources: [wp-murad-i], note: "Most Ottoman chroniclers, including Cantemir"}
      - {value: "Killed by Lazar himself", sources: [wp-battle-of-kosovo], note: "Mignanelli, 1416"}
    note: "Contemporary sources record only that the sultan and Lazar died; the stories were written down decades later."
  - key: ankara-1402-date
    question: On what day was the Battle of Ankara fought?
    about: [{event: battle-of-ankara-1402}]
    field: date
    claims:
      - {value: "20 July 1402", sources: [wp-bayezid-i, wp-mehmed-i]}
      - {value: "28 July 1402", sources: [wp-ottoman-interregnum]}
    note: "Existing event (year only). The record keeps the year; not edited here."
  - key: bayezid-i-death
    question: How did Bayezid I die in Timur's captivity in 1403?
    about: [{person: bayezid-i}]
    field: died
    claims:
      - {value: "Suicide, by striking his head on the bars or taking poison", sources: [wp-bayezid-i], note: "Ottoman historians Lutfi Pasha and Ashik Pasha-Zade"}
      - {value: "Suicide with poison from his ring, on seeing his wife serve wine at a feast", sources: [wp-bayezid-i], note: "Constantine of Ostrovica; ibn Arabshah says his heart was broken"}
      - {value: "Poisoned on Timur's order", sources: [wp-bayezid-i], note: "Considered unlikely: Timur's own doctors cared for him"}
      - {value: "Treated with respect and mourned by Timur", sources: [wp-bayezid-i], note: "Sharafaddin Yazdi's Zafar-nama, a court source; no cell or humiliation in contemporary accounts"}
    note: "The record gives only the date, 8 March 1403. The cage is a later legend (Neshri, Pius II)."
  - key: murad-ii-mother
    question: Who was Murad II's mother?
    about: [{person: murad-ii}]
    field: born
    claims:
      - {value: "An unnamed concubine", sources: [wp-murad-ii], note: "Sukrullah, fifteenth century"}
      - {value: "Sahzade Hatun, daughter of Divitdar Ahmed Pasha", sources: [wp-murad-ii], note: "Huseyin Husameddin Yasar, early twentieth century"}
      - {value: "Emine Hatun of the Dulkadirids", sources: [wp-murad-ii, wp-mehmed-i], note: "The most widely accepted view"}
    note: "No consort is entered."
  - key: murad-ii-recall-1444
    question: Who brought Murad II back to lead the army in 1444?
    about: [{person: murad-ii}, {event: battle-of-varna-1444}]
    field: date
    claims:
      - {value: "Mehmed II asked his father to lead the armies, writing 'If I am the sultan, I order you to come'", sources: [wp-mehmed-ii], note: "Seventeenth-century chronicles"}
      - {value: "The grand vizier Candarli Halil Pasha recalled Murad against Mehmed's wishes", sources: [wp-mehmed-ii, wp-murad-ii, wp-battle-of-varna], note: "Halil Inalcik: Mehmed did not ask his father"}
    note: "Both agree Murad commanded at Varna on 10 November 1444."
  - key: siege-of-constantinople-length
    question: How long did the siege of Constantinople last?
    about: [{event: fall-of-constantinople-1453}]
    field: date
    claims:
      - {value: "A 53-day siege that began on 6 April and ended 29 May 1453", sources: [wp-fall-of-constantinople]}
      - {value: "A 57-day siege; it began 'in early April'", sources: [wp-mehmed-ii]}
    note: "Existing event; both give the fall on 29 May 1453."
  - key: bayezid-ii-birth-year
    question: In which year was Bayezid II born?
    about: [{person: bayezid-ii}]
    field: born
    claims:
      - {value: "3 December 1447", sources: [wp-bayezid-ii]}
      - {value: "3 December 1448", sources: [wp-bayezid-ii]}
    note: "The article writes '3 December 1447/1448'. The record uses 1447, estimated."
  - key: selim-i-mother
    question: Was Selim I's mother a Dulkadirid princess or a concubine?
    about: [{person: selim-i}, {person: bayezid-ii}]
    field: born
    claims:
      - {value: "Ayse Gulbahar Hatun, daughter of Alaueddevle Bozkurt Bey, the eleventh ruler of the Dulkadirids", sources: [wp-selim-i, wp-bayezid-ii], note: "'The most widely accepted view'"}
      - {value: "A concubine", sources: [wp-selim-i, wp-bayezid-ii]}
    note: "No consort is entered."
  - key: tabriz-entry-1514
    question: On what day did Selim I enter Tabriz after Chaldiran?
    about: [{event: battle-of-chaldiran-1514}, {person: selim-i}]
    field: date
    claims:
      - {value: "5 September 1514, in triumph", sources: [wp-selim-i]}
      - {value: "7 September 1514, captured, pillaged and evacuated", sources: [wp-selim-i, wp-battle-of-chaldiran]}
    note: "Both claims are in Selim I's article."
  - key: chaldiran-executions
    question: How many were executed before Chaldiran, and who?
    about: [{event: battle-of-chaldiran-1514}, {person: selim-i}]
    field: date
    claims:
      - {value: "50,000 Alevis massacred on the march east", sources: [wp-selim-i]}
      - {value: "Some 40,000 Qizilbash executed in Anatolia before the campaign", sources: [wp-battle-of-chaldiran]}
    note: "Selim I's article also says a register of Shiites aged 7 to 70 was made in central Anatolian cities and 'all' found were beheaded."
  - key: selim-i-death-cause
    question: What killed Selim I in 1520?
    about: [{person: selim-i}]
    field: died
    claims:
      - {value: "A mistreated carbuncle", sources: [wp-selim-i], note: "The official cause"}
      - {value: "Cancer", sources: [wp-selim-i], note: "Some historians"}
      - {value: "Poison given by his physician", sources: [wp-selim-i], note: "Some historians"}
      - {value: "Plague", sources: [wp-selim-i], note: "Others note a plague epidemic and sources implying he had it"}
    note: "All agree on 22 September 1520."
  - key: selim-ii-accession-1566
    question: When did Selim II take the throne, and how long was Suleiman's death kept secret?
    about: [{person: selim-ii}, {person: suleiman-the-magnificent}]
    field: date
    claims:
      - {value: "Ascended on 29 September 1566 (23 days after Suleiman's death on 6 September); the vizier kept the death secret until Selim arrived at the army in Belgrade", sources: [wp-selim-ii]}
      - {value: "Suleiman's death was kept secret for 48 days", sources: [wp-suleiman-the-magnificent]}
    note: "The title row uses 29 September 1566."
