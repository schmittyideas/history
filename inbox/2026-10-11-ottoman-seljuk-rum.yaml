batch:
  title: "The Seljuks of Rum and the Ottoman sultans, 1063-1595"
  requested: "Suleiman ibn Qutalmish to Kaykhusraw II (Sultanate of Rum), Alp Arslan and Malik-Shah I (Great Seljuk Empire), and the Ottoman sultans from Osman I to Murad III, with their battles, capitals and discrepancies"
  date: 2026-10-11

# Notes for the reviewer
# - Source: local copies of the English Wikipedia articles (wp5 directory); nothing was fetched. Line 1-3 of all 34 files were checked: each is the right article. The long ones (Alp Arslan, Malik-Shah I, Osman I, Mehmed II, Suleiman, Fall of Constantinople, Ottoman Empire, Selim I, Mohacs, Lepanto, Kosovo) were read selectively (lead, rise, reign overview, battles, death and succession), not every section; family sections were used only for parent links. Facts not in the articles are left out.
# - New realms: Sultanate of Rum, Great Seljuk Empire, Ottoman Empire. Titles: 'Sultan of Rum', 'Sultan of the Great Seljuk Empire', 'Ottoman Sultan' (one wording per realm). Osman I and Orhan were bey / emir (Osman's article: he never carried the title Sultan; Orhan is called second sultan in his lead); both stay 'Ottoman Sultan' with that said in the note. Murad I: his article lists Bey, Emir, Ghazi, Khan, Padishah and 'Sultan of sultans' among the titles in Ottoman sources and Tsar in Bulgarian and Serbian sources. Bayezid I adopted Sultan-i Rum (his article).
# - Title rows NOT entered because the article states no start date (or no clear reign): Suleiman Celebi and Musa Celebi (Ottoman Interregnum). The article says Suleiman 'ruled' Thrace from Edirne after 1403 and was strangled on 17 February 1411, and that Musa was then ruler of Thrace until Chamurli (5 July 1413), but gives no accession date for either, and says their coins style them 'Emir Suleyman b. Bayezid' and 'Musa b. Bayezid' (only Mehmed minted coins as Sultan). Both are entered as people with events and notes. Isa Celebi and Mustafa Celebi are not entered as people.
# - Also left out: the Rum sultans between Kilij Arslan I and Kilij Arslan II (Mesud I and others), Suleiman II (died 1204), Kilij Arslan III, Kaykaus I, the joint rule after 1246 and the last sultans (no article downloaded); Tughril and the Great Seljuk sultans after Malik-Shah I; Mehmed II's, Selim's and Suleiman's viziers, generals and the Safavid, Mamluk, Hungarian and Holy League leaders (Ismail I, Tuman bay II, Louis II, John Hunyadi, Wladyslaw III, Lazar, Milos Obilic, John of Austria, Venier, Ali Pasha, Niklas Salm, Baiju and others have no keys here; they are named in event notes). Consorts, sons and daughters are not entered except the direct line of succession as parent links.
# - Places NOT defined: bapheus-site (the article calls the site unidentified, perhaps east of Nicomedia) and myriokephalon-site (location debated; the existing Myriokephalon event already has no place). The Chamurli field (modern Samokov, Bulgaria), Pelekanon (Maltepe), Szigetvar (Suleiman died there; his heart and organs were buried at Turbek outside it), Amasya, Trabzon, Manisa, Merv (Alp Arslan's burial), Isfahan (Malik-Shah's burial), Havsa (Bayezid II's death), Aksaray and Kayseri have no place records; they are in notes. Topkapi Palace has no founding year: Mehmed II's article says only that he built it (and Selim II's article, oddly, has him born in it in 1524).
# - Existing records only linked: events battle-of-manzikert-1071 (alp-arslan victor), battle-of-ankara-1402 (bayezid-i defeated, timur victor; timur was not on it), fall-of-constantinople-1453 (mehmed-ii victor), battle-of-myriokephalon-1176 (kilij-arslan-ii victor). Places constantinople, nicaea, vienna, belgrade, hagia-sophia. People timur, manuel-i-komnenos, andronikos-iii-palaiologos, alexios-i-komnenos, sigismund-holy-roman-emperor, pius-v, philip-ii-of-spain. Not redefined. The Pelekanon day (10 or 15 June 1329) is already a discrepancy (pelekanon-june-1329, Byzantium batch); the new Pelekanon event cites it instead of repeating it.
# - Discrepancies recorded below: Alp Arslan's birth; the founding of the Rum sultanate; Suleiman ibn Qutalmish's death; Kilij Arslan II's birth year; where Kaykhusraw I died (Antioch on the Meander or Alasehir); where Kose Dag lies; Osman's birth, accession (c.1281 or c.1299) and death (1320, 1323/4, 1326, 1327); the date of Bapheus (1299, 1301 or 1302); Orhan's accession; how Bursa fell; the day Murad I died at Kosovo and the day of the battle (15, 16 or 28 June 1389); who killed Murad I and when; the day of Ankara (20 or 28 July 1402); how Bayezid I died; Murad II's mother; who recalled Murad II in 1444; the length of the siege of Constantinople; Bayezid II's birth year; Selim I's mother, his entry into Tabriz, the executions before Chaldiran and his death; Selim II's accession against the secrecy of Suleiman's death. Seen and not entered as discrepancies: the Hijri / Gregorian pairs inside single articles; Rovine (10 October 1394 or 17 May 1395, Bayezid I article; no event entered); Suleiman's age at death (71 in one line, 72 in another); Mustafa Celebi's death ('1402 or 1422?'); the cage of Bayezid I (a legend; in his death discrepancy).
# - Dates: a full date only where the article gives the day; month-only dates are the year (Mehmed II's reigns 'August 1444' and 'February 1451', Murad II's birth 'June 1404', Orhan's death 'March 1362'). Osman I's reign is c.1281 to c.1324 (both estimated; the article gives 1281 'around' and 1323/4). Bayezid II's birth is 3 December 1447/1448: the year 1447 is used, estimated. Suleiman's birth is 'probably 6 November 1494': the full date is used and the note says so. Alp Arslan's birth uses 20 January 1029, the date the article says the literature generally accepts.
# - Moments take a year only (checked): every moment has an integer year or none. Births and burials with uncertain dates have no year.
# - Coordinates are from general knowledge (2-3 decimals), approximate for all battlefields (Kose Dag, Varna, Mohacs, Chaldiran, Lepanto, Kosovo, Nicopolis); Mohacs (beside Satorhely, article) and Chaldiran (near Gal Ashaqi, article) follow the villages the articles name. Visitable flags and visit_site are general knowledge.
# - Size: 22 people, 23 title rows, 3 realms, 12 places, 21 events (4 of them link-only), 25 discrepancies (126 rows), 18 links, 24 moments.

