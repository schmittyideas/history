people:
  - {key: anterus, name: "Anterus", type: Clergy, roles: [pope], died: 0236-01-03, realm: Papacy, prominence: 1, sitelinks: 78, sitelinks_on: 2026-10-18,
     note: "Of Greek descent from Petelia (Strongoli); pope for some six weeks (235-236).",
     sources: [wp-anterus]}
  - {key: fabian, name: "Fabian", type: Clergy, roles: [pope], died: 0250-01-20, realm: Papacy, prominence: 1, sitelinks: 80, sitelinks_on: 2026-10-18,
     note: "Chosen, the story goes, when a dove settled on his head; divided Rome's Christians into seven districts under deacons. Martyred in the Decian persecution (250).",
     sources: [wp-fabian]}
  - {key: cornelius, name: "Cornelius", type: Clergy, roles: [pope], died: 253, realm: Papacy, prominence: 2, sitelinks: 80, sitelinks_on: 2026-10-18,
     note: "Pope 251-253 during persecution and the schism over the lapsed; with Cyprian of Carthage he held that those who had lapsed could be readmitted, against Novatian. Died a martyr.",
     sources: [wp-cornelius]}
  - {key: lucius-i, name: "Lucius I", type: Clergy, roles: [pope], died: 0254-03-05, realm: Papacy, prominence: 1, sitelinks: 80, sitelinks_on: 2026-10-18,
     note: "Banished soon after his consecration, he was allowed back; mistakenly counted a martyr of Valerian's persecution, which began after his death.",
     sources: [wp-lucius-i]}
  - {key: stephen-i, name: "Stephen I", type: Clergy, roles: [pope], died: 0257-08-02, realm: Papacy, prominence: 1, sitelinks: 79, sitelinks_on: 2026-10-18,
     note: "Of Greek descent; by some accounts killed while celebrating Mass (257). A saint.",
     sources: [wp-stephen-i]}
  - {key: sixtus-ii, name: "Sixtus II", type: Clergy, roles: [pope], died: 0258-08-06, realm: Papacy, prominence: 2, sitelinks: 83, sitelinks_on: 2026-10-18,
     note: "Killed with seven deacons, among them Lawrence of Rome, in Valerian's persecution (6 August 258).",
     sources: [wp-sixtus-ii]}
  - {key: dionysius, name: "Dionysius", type: Clergy, roles: [pope], died: 268, realm: Papacy, prominence: 1, sitelinks: 82, sitelinks_on: 2026-10-18,
     note: "Of Greek descent; led the Roman church from Valerian's persecution to Gallienus's toleration (260) and reorganised it into parishes under presbyters.",
     sources: [wp-dionysius]}
  - {key: felix-i, name: "Felix I", type: Clergy, roles: [pope], died: 0274-12-30, realm: Papacy, prominence: 1, sitelinks: 77, sitelinks_on: 2026-10-18,
     note: "A Roman; wrote a dogmatic letter on the unity of Christ's person and opposed Paul of Samosata.",
     sources: [wp-felix-i]}
  - {key: eutychian, name: "Eutychian", type: Clergy, roles: [pope], died: 0283-12-07, realm: Papacy, prominence: 1, sitelinks: 78, sitelinks_on: 2026-10-18,
     note: "Known almost only from his epitaph in the catacomb of Callixtus; the Liber Pontificalis gives him nearly nine years (275-283), Eusebius ten months.",
     sources: [wp-eutychian]}
  - {key: caius, name: "Caius", type: Clergy, roles: [pope], died: 0296-04-22, realm: Papacy, prominence: 1, sitelinks: 75, sitelinks_on: 2026-10-18,
     note: "From Salona in Dalmatia; little is known beyond a legendary account in the Liber Pontificalis. Martyred, by legend.",
     sources: [wp-caius]}
  - {key: marcellinus, name: "Marcellinus", type: Clergy, roles: [pope], died: 304, realm: Papacy, prominence: 1, sitelinks: 78, sitelinks_on: 2026-10-18,
     note: "Pope during Diocletian's persecution; some sources say he lapsed, a claim Augustine rejected. A saint.",
     sources: [wp-marcellinus]}
  - {key: marcellus-i, name: "Marcellus I", type: Clergy, roles: [pope], born: 0255-01-06, died: 0309-01-16, realm: Papacy, prominence: 1, sitelinks: 74, sitelinks_on: 2026-10-18,
     note: "Succeeded Marcellinus after a long vacancy; Maxentius banished him in 309 over the tumult caused by his harsh penances for the lapsed, and he died in exile that year.",
     sources: [wp-marcellus-i]}
  - {key: eusebius, name: "Eusebius", type: Clergy, roles: [pope], died: 310, realm: Papacy, prominence: 1, sitelinks: 74, sitelinks_on: 2026-10-18,
     note: "Of Greek descent; quarrelled with Heraclius over the lapsed, and Maxentius banished both. Died in exile in Sicily (310).",
     sources: [wp-eusebius]}
  - {key: miltiades, name: "Miltiades (Melchiades)", type: Clergy, roles: [pope], died: 0314-01-11, realm: Papacy, prominence: 2, sitelinks: 73, sitelinks_on: 2026-10-18,
     note: "Of Berber descent, the first pope after the persecutions ended: in his time Constantine issued the Edict of Milan (313), and the pope was given Empress Fausta's palace, where the Lateran would rise.",
     sources: [wp-miltiades]}
  - {key: sylvester-i, name: "Sylvester I", type: Clergy, roles: [pope], died: 0335-12-31, realm: Papacy, prominence: 3, sitelinks: 89, sitelinks_on: 2026-10-18,
     note: "Pope 314-335 at a turning point for the Church, though little is known of him; in his time came the Council of Arles (314) and the First Council of Nicaea (325).",
     sources: [wp-sylvester-i]}
  - {key: mark, name: "Mark", type: Clergy, roles: [pope], realm: Papacy, prominence: 1, sitelinks: 79, sitelinks_on: 2026-10-18,
     note: "A Roman, son of Priscus; pope for most of 336. May have founded two churches in Rome.",
     sources: [wp-mark]}
  - {key: julius-i, name: "Julius I", type: Clergy, roles: [pope], realm: Papacy, prominence: 2, sitelinks: 83, sitelinks_on: 2026-10-18,
     note: "Backed Athanasius of Alexandria when Arian bishops deposed him, asserting the pope's authority over the Arian East.",
     sources: [wp-julius-i]}
  - {key: liberius, name: "Liberius", type: Clergy, roles: [pope], born: 310, died: 0366-09-24, realm: Papacy, prominence: 2, sitelinks: 80, sitelinks_on: 2026-10-18,
     note: "Banished by the Arian-leaning Constantius II, who installed Felix II, and later yielded to him; the earliest pope not venerated as a saint.",
     sources: [wp-liberius]}
  - {key: damasus-i, name: "Damasus I", type: Clergy, roles: [pope], born: 305, born_estimated: true, died: 0384-12-11, realm: Papacy, prominence: 3, sitelinks: 84, sitelinks_on: 2026-10-18,
     note: "From Egitania in modern Portugal, elected in 366 against the rival Ursicinus. His Council of Rome (382) fixed the canon of scripture, and he commissioned Jerome's Vulgate.",
     sources: [wp-damasus-i]}
  - {key: novatian-antipope, name: "Novatian (antipope)", type: Clergy, roles: [antipope], born: 200, born_estimated: true, died: 258, died_estimated: true, realm: Papacy, prominence: 2, sitelinks: 46, sitelinks_on: 2026-10-18,
     note: "A noted theologian, the first Roman to write theology in Latin; set up against Cornelius in the dispute over readmitting the lapsed, he founded Novatianism.",
     sources: [wp-novatian-antipope]}
  - {key: heraclius-antipope, name: "Heraclius (antipope)", type: Clergy, roles: [antipope], realm: Papacy, prominence: 1, sitelinks: 5, sitelinks_on: 2026-10-18,
     note: "Known only from Damasus I's epitaph for Eusebius: the two disagreed over the lapsed, and Maxentius banished both.",
     sources: [wp-heraclius-antipope]}
  - {key: felix-ii-antipope, name: "Felix II (antipope)", type: Clergy, roles: [antipope], died: 0365-11-22, realm: Papacy, prominence: 1, sitelinks: 40, sitelinks_on: 2026-10-18,
     note: "An archdeacon of Rome installed by Emperor Constantius II in place of the banished Liberius (355).",
     sources: [wp-felix-ii-antipope]}
  - {key: ursicinus-antipope, name: "Ursicinus (antipope)", type: Clergy, roles: [antipope], died: 381, died_estimated: true, realm: Papacy, prominence: 1, sitelinks: 35, sitelinks_on: 2026-10-18,
     note: "Elected at the same time as Damasus I amid rioting (366); ruled in Rome for some months, was later declared an antipope, and died after 381.",
     sources: [wp-ursicinus-antipope]}

