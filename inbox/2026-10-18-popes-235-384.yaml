# The Papacy, 235-384 (persecution, toleration and the Arian controversy): the 19 popes from Anterus to Damasus I, the
# antipopes Novatian, Heraclius, Felix II and Ursicinus, the Edict of Milan (313) and the First Council of Nicaea (325).
# Conventions and checks as the earlier Papacy batches (inbox/2026-10-18-popes-*.yaml). Birth and death dates from each
# article's lead; a Wikidata full date that differs is recorded as a discrepancy, the record using the article.
# Stated honestly: Eusebius's article gives his death as 21 October 310 (in exile in Sicily) while his pontificate in the
# List of popes ends 17 August 310; the death date is the article's. Birthplaces that are regions (Achaea, Africa) are
# left in the notes.
batch:
  title: "The Papacy, 235-384"
  requested: "Do we have all popes? Get them all, with the disputed ones (antipopes) marked disputed"
  date: 2026-10-18

