# US vice presidents: the 35 who never became president, added, and the title "Vice President of the United States"
# (realm United States) for all 50, including the 15 who later became president (already here as presidents).
# Ty's choice (2026-10-18): vice presidents, type Government with the title, then their wives (next batches).
# VERIFIED: the list and term dates from Wikidata (P39 "Vice President of the United States" with start/end
# qualifiers; fictional vice presidents from television, which Wikidata also lists, left out), checked against each
# vice president's English Wikipedia article downloaded on 2026-10-18 with tools/wiki.py (revision IDs in the session
# scratchpad): birth and death dates in the lead; term dates are the inauguration days of the presidential terms
# (inbox/2026-10-13-us-presidents-*.yaml), and every irregular one was found in the article: Clinton, Gerry,
# Hendricks, Hobart, Sherman, Wilson and King died in office (their death dates); Calhoun resigned 28 December 1832;
# Agnew resigned 10 October 1973; Ford took office 6 December 1973 and Rockefeller 19 December 1974.
# Prominence (hand-set, as officials): 3 for vice presidents with a larger place in history (Burr, Calhoun,
# Humphrey, Rockefeller, Gore, Cheney, Harris, Vance), 2 for the rest. Sitelinks recorded for all.
# Stated honestly:
#  - John Adams: his term formally began on 4 March 1789; he began serving on 21 April (the date used), with a note,
#    as Washington's presidential title uses his 30 April inauguration.
#  - Elbridge Gerry's article gives his birth as 17 July (Old Style 6 July) 1744; the New Style date is used.
#  - Notes are short: years, president(s), and one fact from the article for a few.
batch:
  title: "US vice presidents"
  requested: "And then vice presidents and their wives"
  date: 2026-10-18

