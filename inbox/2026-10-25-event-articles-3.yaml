batch:
  title: "Events cite their own Wikipedia article (3)"
  requested: "When an event mentions the Truce of God or a similar act, reference that act's own article too: every event"
  date: 2026-10-25

# Each event below gets its own Wikipedia article as a source (the article about that battle, treaty, council or act,
# e.g. the Truce of God at Caen -> 'Peace and Truce of God'). Matched by title search, then checked by hand or by a
# reviewer reading the article; events with no dedicated article were left out. Existing sources are reused.

