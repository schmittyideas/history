batch:
  title: "Korea, 1009-1608: Goryeo kings, the Ch'oe military ruler, Joseon kings, the Mongol invasions and the Imjin War"
  requested: "Eleven kings of Goryeo (Hyeonjong to Gongmin), Ch'oe Ch'unghon, nine kings of Joseon (Taejo to Seonjo), Admiral Yi Sun-sin, with reigns, the Mongol invasions of Korea, the Imjin War, key places and discrepancies"
  date: 2026-10-11

# Notes for the reviewer (batch D of the East Asia build-out)
# - Source: local copies of the English Wikipedia articles (wp4 directory); nothing fetched. All 24 files were checked: every one resolved to the article that was asked for (first lines read). Short stubs (Munjong, Sukjong, Uijong, Myeongjong, Gojong, Chungseon, Hyeonjong) are used only for what they say. Sejong the Great (62k), Yi Sun-sin, Choe Chung-heon and the Mongol invasions were read in full; Imjin_War (120k) was read for the lead, background, the landing and first advance, the naval campaigns of 1592, both Jinju sieges, the second invasion, Hideyoshi's death, Noryang and the aftermath (the army, Ming, firearms and legacy sections were skipped).
# - Existing records only referenced, not redefined: realm Goryeo, mokjong-of-goryeo (named in Hyeonjong's note, no link). toyotomi-hideyoshi is defined in batch C (inbox ea-c-japan, applied before this one) and is referenced as the invader in the Imjin War event. No other batch's place or person key is used.
# - New realm: Joseon (East Asia, South Korea). Title wordings: "King of Goryeo" (realm Goryeo) and "King of Joseon" (realm Joseon); Ch'oe Ch'unghon "Military ruler of Goryeo" (realm Goryeo).
# - Title rows left out because the article states no start date: none for Joseon or Goryeo kings except as noted. Uijong's start (1146) and Myeongjong's (1170) are taken from the Injong and Uijong articles (Hyeon succeeded at Injong's death in April 1146; the 1170 coup put his brother on the throne) and cited to both. Reign ends are the stated abdication/deposition year, or the death date where the article gives no separate reign end (Hyeonjong, Sukjong, Yejong, Injong, Sejong, Jungjong, Seonjo; Sejo and Yeonsangun use the year only). Month without day: Yeonsangun's deposition (September 1506) and Jungjong's accession (September 1506) are entered as the year 1506 with the month in the note.
# - Ch'oe Ch'unghon: "Military ruler of Goryeo" has no formal office date in the article. It is dated from 9 April 1196 (the day he beheaded Yi Uimin and seized power) to his death on 29 October 1219; the article also says he announced his retirement in favour of his son Ch'oe U without a year, so the end is the death. Named offices (Chancellor 1205, etc.) are not entered as rows.
# - Lunar dates not converted. Sejong's article gives many dates as lunar "day, month of year" (his accession 10th day, 8th month 1418; Hangul shown to the court in the 12th month of 1443, which in the Gregorian calendar may fall in January 1444; Hunminjeongeum published in the 9th month of 1446; Taejong's death 10th day, 5th month 1422). The accession is entered as the year 1418; the Hangul event is entered 1443 to 1446 as years. Death dates in leads (Sejong 8 April 1450, Taejong 8 June 1422) are used as given. The Seongjong end (1494 or 29 January 1495) and the Chungseon/Chungnyeol hand-over (1307 or 1308) are discrepancies.
# - Khitan wars: the brief expected 1010-11 and 1018 (Gwiju). The Hyeonjong article gives 1010 for the first and 1019 for the second (Battle of Kwiju), so 1010 and 1019 are used and Kwiju is not given as a place. Not in the articles: Gwiju is not defined.
# - Left out, because the article gives no date or place: Gyeongbokgung's founding year and builder (the brief said Taejo, 1395, but none of the articles read states it; only Sejong's 1421 move and 1427 residence and the 1592 burning are in them, so no founded/built_by); Jeongjong's, Sejo's and Jungjong's places of death; Taejo's coronation place; Hyeonjong's flight to Naju (named, no place record); the fifth to ninth Mongol invasions as separate events (kept in the series note; the first, third and the 1259 peace are events); the second siege of Jinju (20-27 July 1593, in the first siege's note); Sukjong's Namgyeong (Southern Capital, no year); Yeonsangun's mother Queen Yun and Choe U, Choe Hang and other minor figures (no person records). Consorts and children are not entered except as parent/child links between kings.
# - Existing notes about the Imjin War: batch C's Hideyoshi note names it. This batch defines imjin-war-1592 (start date 23 May 1592, the article's date for the landing at Busan; end_year 1598), prominence 5, with Hansan Island 1592, the fall of Hanseong 1592, the first siege of Jinju 1592, Okpo 1592, Chilcheollyang 1597, Myeongnyang 1597 and Noryang 1598 as separate events.
# - Moments take a year only (checked): every moment below has an integer year or none. Full dates sit in title notes, events or discrepancies.
# - Coordinates come from general knowledge (2-3 decimals); visitable flags and visit_site names are general knowledge, not from the articles. No place has a founded year (none is in the articles).
# - Prominence: Sejong and Yi Sun-sin 5, the Imjin War, the founding of Joseon and the creation of Hangul 5 (as the brief says); other kings are hand-set 2 to 4. Cultural-figure rules do not apply (no Artist/Writer types in this batch), so no sitelinks.
# - Discrepancies recorded (19): Sukjong's accession (abdication or coup), Sukjong's death route, Myeongjong's reign length, the Tripitaka's completion year, the Ganghwa move date, when the Mongol wars ended (1259 or 1270), when they began (1231 or 1238), Chungnyeol's Mongol marriage (1269 or 1271, who proposed), Chungseon's second accession (1307 or 1308), Queen Yun's elevation (1474 or 1476), Queen Yun's death, Seongjong's reign end, Seonjo's age at accession, the Japanese landing date, the fall of Hanseong, the date of Okpo (June or July 1592), the size of Yi's fleet at Hansan, Myeongnyang Japanese losses, who the Koreans fought at Sangju. Seen and not entered as records: Taejo's "475 years" of Goryeo against "400-year-old" (rounding); the Hyeonjong-era Tripitaka (6,000 volumes) against Gojong's (81,000 blocks), which are two different carvings; Ganuidae's founding year (1434 or 1438) and the Ui-bang-yu-chwi's (1445 or 1447), both within Sejong's article and not tied to a record here.
# - Size: 22 people, 23 title rows, 1 realm, 11 places, 31 events, 19 discrepancies (107 rows), 13 links, 17 moments.

