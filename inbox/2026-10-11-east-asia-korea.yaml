discrepancies:
  - key: sukjong-1095-accession
    question: Did Sukjong come to the throne in 1095 on his nephew's abdication, or by a coup?
    about: [{person: sukjong-of-goryeo}]
    field: other
    claims:
      - {value: "He rose to the throne in 1095 upon the abdication of his young nephew, King Heonjong", sources: [wp-sukjong-of-goryeo]}
      - {value: "He took the throne in 1095 after a coup (coup d'etat) against the eleven-year-old King Heonjong", sources: [wp-yejong-of-goryeo]}
    note: "The record says he took the throne in 1095 and describes both versions in the person note."
  - key: sukjong-1105-death-journey
    question: Was Sukjong travelling to Pyongyang when he died in 1105, or returning from it?
    about: [{person: sukjong-of-goryeo}, {place: pyongyang}]
    field: place
    claims:
      - {value: "He died while on the way to the western capital, Pyongyang", sources: [wp-sukjong-of-goryeo]}
      - {value: "He died returning from Jangnak Palace in Seogyeong (the Western Capital)", sources: [wp-yejong-of-goryeo]}
    note: "No place is recorded for his death."
  - key: myeongjong-reign-length
    question: Did Myeongjong reign 27 or 28 years?
    about: [{person: myeongjong-of-goryeo}]
    field: date
    claims:
      - {value: "Twenty-seven years on the throne before exile by Ch'oe Ch'unghon", sources: [wp-myeongjong-of-goryeo]}
      - {value: "On the throne for 28 years when deposed in 1197 (also 'nearly 30 years')", sources: [wp-choe-chung-heon]}
    note: "The record uses 1170 to 1197 (27 years), which fits the Uijong and Ch'oe articles' dates."
  - key: tripitaka-koreana-completion
    question: When was the carving of the Goryeo Tripitaka completed?
    about: [{event: tripitaka-koreana-carving-1237}, {person: gojong-of-goryeo}]
    field: date
    claims:
      - {value: "Completed in 1251 (some 81,000 wooden blocks)", sources: [wp-gojong-of-goryeo]}
      - {value: "Work began in 1237 and the Goryeo Daejanggyeong was completed in 1248", sources: [wp-mongol-invasions-of-korea]}
    note: "The record spans 1237 to 1251 (the later date) and keeps both."
  - key: ganghwa-move-1232-date
    question: When did the Goryeo court move to Ganghwa Island in 1232?
    about: [{event: court-moved-to-ganghwa-1232}, {person: gojong-of-goryeo}]
    field: date
    claims:
      - {value: "August 1232: Gojong moved the capital from Songdo to Ganghwa", sources: [wp-gojong-of-goryeo]}
      - {value: "Proposed in the spring of 1232; the royal family relocated and by the summer of 1232 the transfer was complete", sources: [wp-mongol-invasions-of-korea]}
    note: "Entered with the year only."
  - key: mongol-wars-end-1259-1270
    question: When did the Mongol wars on Goryeo end?
    about: [{event: mongol-invasions-of-korea-1231}, {event: goryeo-mongol-peace-1259}]
    field: date
    claims:
      - {value: "1259: a peace agreement in the spring of 1259; Gojong's resistance of nearly thirty years ended then", sources: [wp-gojong-of-goryeo, wp-mongol-invasions-of-korea]}
      - {value: "1270: the campaigns between 1231 and 1270 ended with a peace treaty making Goryeo a Yuan vassal", sources: [wp-mongol-invasions-of-korea]}
    note: "The series event runs to 1259; 1270 is the year the Sambyeolcho Rebellion began."
  - key: mongol-wars-start-1231-1238
    question: When did the Mongol invasions of Korea begin?
    about: [{event: mongol-invasions-of-korea-1231}, {person: gongmin-of-goryeo}]
    field: date
    claims:
      - {value: "1231 (first invasion, 26 August 1231)", sources: [wp-mongol-invasions-of-korea]}
      - {value: "1238, the 'forty year long Mongol invasion of Korea of 1238'", sources: [wp-gongmin-of-goryeo]}
    note: "The record uses 1231."
  - key: chungnyeol-mongol-marriage
    question: When, and by whom, was the marriage of Chungnyeol to a daughter of Kublai Khan proposed?
    about: [{person: chungnyeol-of-goryeo}, {person: chungseon-of-goryeo}]
    field: date
    claims:
      - {value: "1271: Chungnyeol, then crown prince, proposed the marriage to Kublai Khan", sources: [wp-chungnyeol-of-goryeo]}
      - {value: "1269: his father Wonjong requested the marriage of his son to a daughter of the Khan", sources: [wp-chungseon-of-goryeo]}
    note: "Neither is entered as a record."
  - key: chungseon-second-accession
    question: Was Chungseon crowned for the second time in 1307 or 1308?
    about: [{person: chungseon-of-goryeo}, {person: chungnyeol-of-goryeo}]
    field: date
    claims:
      - {value: "1307: the Crown Prince was crowned as Chungseon while Chungnyeol was detained in Dadu", sources: [wp-chungnyeol-of-goryeo]}
      - {value: "1308: after his father's death he returned to the throne; reigned 1308 to 1313", sources: [wp-chungseon-of-goryeo]}
    note: "Chungnyeol's second reign ends 1307 and Chungseon's starts 1308 in the title rows; Chungnyeol's lead also says his reign ran to 1308."
  - key: queen-yun-elevation
    question: When did Lady Yun become Seongjong's queen?
    about: [{person: seongjong-of-joseon}, {person: yeonsangun-of-joseon}]
    field: date
    claims:
      - {value: "After the first wife died in 1474, he decided to promote the concubine Lady Yun to queen", sources: [wp-seongjong-of-joseon]}
      - {value: "Lady Yun was formally married in 1476, with Yeonsangun born several months later", sources: [wp-yeonsangun-of-joseon]}
    note: "Neither is entered as a record; Yeonsangun's birth is 2 December 1476."
  - key: queen-yun-death
    question: How did the deposed Queen Yun die?
    about: [{person: seongjong-of-joseon}, {person: yeonsangun-of-joseon}]
    field: other
    claims:
      - {value: "She was executed after attempts to poison other concubines and harm the king", sources: [wp-seongjong-of-joseon]}
      - {value: "She was exiled, then ordered to commit suicide by drinking poison; she died in 1482", sources: [wp-yeonsangun-of-joseon]}
    note: "No record of her is made."
  - key: seongjong-reign-end
    question: Did Seongjong's reign end in 1494 or 1495?
    about: [{person: seongjong-of-joseon}]
    field: died
    claims:
      - {value: "1494: reign given as 1469 to 1494", sources: [wp-sejong-the-great]}
      - {value: "He died on 29 January 1495", sources: [wp-seongjong-of-joseon]}
    note: "The record uses 29 January 1495; the Sejong article's year probably follows the Korean calendar year, but that is not stated."
  - key: seonjo-accession-age
    question: Was Seonjo 14 or 16 when he was crowned?
    about: [{person: seonjo-of-joseon}]
    field: other
    claims:
      - {value: "He ascended the throne at the age of 14, upon the death of King Myeongjong", sources: [wp-seonjo-of-joseon]}
      - {value: "He was crowned king in 1567 at the age of 16", sources: [wp-seonjo-of-joseon]}
    note: "Born December 1552, so he was 14 by Western count in 1567; the record uses 1567."
  - key: imjin-landing-date
    question: When did the Japanese land at Busan in 1592?
    about: [{event: imjin-war-1592}, {place: busan-fortress}]
    field: date
    claims:
      - {value: "23 May 1592, the First Division under Konishi Yukinaga (7,000 men)", sources: [wp-imjin-war]}
      - {value: "13 April 1592, 700 ships with 18,700 troops under Konishi Yukinaga", sources: [wp-seonjo-of-joseon]}
    note: "The record uses 23 May 1592. 13 April is probably a Korean lunar-calendar date, but the article does not say so."
  - key: hanseong-fall-date
    question: When did the Japanese reach Hanseong in 1592?
    about: [{event: fall-of-hanseong-1592}, {person: yi-sun-sin}]
    field: date
    claims:
      - {value: "10 June 1592, after the First Division raced the Second Division upriver", sources: [wp-imjin-war]}
      - {value: "2 May 1592, 'just nineteen days' after the landing", sources: [wp-yi-sun-sin]}
    note: "The record uses 10 June 1592; the articles do not say how the two dates were calendar-converted."
  - key: okpo-date
    question: When was the Battle of Okpo?
    about: [{event: battle-of-okpo-1592}, {person: yi-sun-sin}]
    field: date
    claims:
      - {value: "13 to 16 June 1592: the fleet set sail on 13 June and met Won Kyun on 15 June", sources: [wp-yi-sun-sin]}
      - {value: "21 to 23 July 1592: the fleet set sail on 21 July (although the same article dates Sacheon, three weeks after Okpo, to 8 July)", sources: [wp-imjin-war]}
    note: "Only the year is entered. The Imjin article is inconsistent with itself."
  - key: hansan-fleet-size
    question: How many ships did Yi Sun-sin command at Hansan Island?
    about: [{event: battle-of-hansan-island-1592}, {person: yi-sun-sin}]
    field: other
    claims:
      - {value: "70 ships under Yi Sun-sin and Yi Okki", sources: [wp-yi-sun-sin]}
      - {value: "53 ships", sources: [wp-imjin-war]}
    note: "Not entered as a record value."
  - key: myeongnyang-japanese-losses
    question: How many Japanese ships were lost at Myeongnyang?
    about: [{event: battle-of-myeongnyang-1597}, {person: yi-sun-sin}]
    field: other
    claims:
      - {value: "About 31 of the 333 ships that entered the strait were destroyed or damaged", sources: [wp-yi-sun-sin]}
      - {value: "About 30 combat ships destroyed and about 30 more damaged, of about 133 warships", sources: [wp-imjin-war]}
    note: "Both give 13 Joseon ships and no Joseon ship lost."
  - key: sangju-1592-opponent
    question: Whom did the Korean general Yi Il fight at Sangju in 1592?
    about: [{event: imjin-war-1592}, {person: seonjo-of-joseon}]
    field: other
    claims:
      - {value: "Katō Kiyomasa", sources: [wp-seonjo-of-joseon]}
      - {value: "Konishi Yukinaga's First Division, on 4 June 1592", sources: [wp-imjin-war]}
    note: "Not entered as a record."
