discrepancies:
  - key: duncan-i-death-day
    question: On what day was Duncan I killed at Bothnagowan in 1040?
    about: [{person: duncan-i-of-scotland}, {event: battle-of-bothnagowan-1040}]
    field: died
    claims:
      - {value: "14 August 1040 ('probably')", sources: [wp-duncan-i-of-scotland, wp-macbeth-of-scotland]}
      - {value: "15 August 1040", sources: [wp-malcolm-iii-of-scotland]}
    note: "The record uses 14 August 1040."
  - key: macbeth-place-of-death
    question: Where did Macbeth die in 1057?
    about: [{person: macbeth-of-scotland}, {event: battle-of-lumphanan-1057}]
    field: place
    claims:
      - {value: "Mortally wounded or killed in the battle of Lumphanan", sources: [wp-macbeth-of-scotland, wp-malcolm-iii-of-scotland]}
      - {value: "Wounded at Lumphanan and died at Scone some days later (Prophecy of Berchan)", sources: [wp-macbeth-of-scotland]}
    note: "The record uses Lumphanan. William of Malmesbury's claim that Siward killed Macbeth in 1054 is contradicted by Macbeth outliving Siward (Malcolm III article)."
  - key: malcolm-iii-death-place-and-burial
    question: Where was Malcolm III killed and where was he first buried?
    about: [{person: malcolm-iii-of-scotland}, {event: battle-of-alnwick-1093}]
    field: place
    claims:
      - {value: "Killed at Inber Alda (Alnmouth) on 13 November 1093; buried at Tynemouth Priory, later moved to Dunfermline Abbey 'or possibly Iona'", sources: [wp-malcolm-iii-of-scotland]}
      - {value: "Killed near Alnwick (the later tradition); Duncan II's article names the killer Arkil Morel, steward of Bamburgh, where Malcolm III's article says Morel of Bamburgh, steward of Robert de Mowbray", sources: [wp-duncan-ii-of-scotland, wp-malcolm-iii-of-scotland]}
    note: "No place is attached to the event. The moment records the Dunfermline reburial of 1250 (beside Margaret after her canonisation)."
  - key: donald-iii-fate
    question: What happened to Donald III after 1097?
    about: [{person: donald-iii-of-scotland}]
    field: died
    claims:
      - {value: "Blinded and imprisoned for life by Edgar, at Rescobie near Forfar; died there in 1099 (Fordun and the king-lists)", sources: [wp-donald-iii-of-scotland]}
      - {value: "Expelled (Anglo-Saxon Chronicle); blinded by his brother (Annals of Tigernach); 'slain by the craftiness of David and the strength of William' (William of Malmesbury)", sources: [wp-donald-iii-of-scotland]}
      - {value: "Alexander I slew Donald III after Donald killed Edgar (Orderic Vitalis)", sources: [wp-edgar-of-scotland]}
    note: "The record uses 1099 for his death. Burial: Dunfermline Abbey or Dunkeld Cathedral first, then agreed to be moved to Iona."
  - key: duncan-ii-killer-and-burial
    question: Who killed Duncan II on 12 November 1094, and where was he buried?
    about: [{person: duncan-ii-of-scotland}]
    field: died
    claims:
      - {value: "Killed by Máel Petair, Mormaer of Mearns (13th-century note; Fordun says at Monthechin), at Donald III's instigation", sources: [wp-duncan-ii-of-scotland, wp-donald-iii-of-scotland, wp-edgar-of-scotland]}
      - {value: "Killed by Donald III (Annals of Inisfallen) or treacherously by 'his brothers Domnall and Edmond' (Annals of Ulster, probably meaning his uncle Donald III and half-brother Edmund)", sources: [wp-duncan-ii-of-scotland]}
      - {value: "Buried at Dunfermline Abbey, or on Iona", sources: [wp-duncan-ii-of-scotland]}
    note: "The date, 12 November 1094, is agreed by both articles. No burial moment is entered."
  - key: edgar-death
    question: Did Edgar die peacefully in Edinburgh in 1107, or was he killed by Donald III?
    about: [{person: edgar-of-scotland}]
    field: died
    claims:
      - {value: "Died at Edinburgh on 8 January 1107, buried at Dunfermline Abbey", sources: [wp-edgar-of-scotland]}
      - {value: "Murdered by his uncle Donald III, who was then killed by Alexander I (Orderic Vitalis)", sources: [wp-edgar-of-scotland]}
    note: "The record uses 8 January 1107. The Edgar article quotes Benjamin Hudson calling Orderic's account 'completely false', probably a confusion with Duncan II's murder."
  - key: alexander-ii-death-date
    question: On what day did Alexander II die, and so when did Alexander III become king?
    about: [{person: alexander-ii-of-scotland}, {person: alexander-iii-of-scotland}]
    field: died
    claims:
      - {value: "Alexander II died on 8 July 1249 at about three in the afternoon on Kerrera", sources: [wp-alexander-ii-of-scotland]}
      - {value: "Alexander II died on 6 July 1249, when Alexander III became king; inaugurated at Scone on 13 July 1249", sources: [wp-alexander-iii-of-scotland]}
    note: "The record uses 8 July 1249 for Alexander II's death and the start of Alexander III's reign."
  - key: margaret-maid-of-norway-death-day
    question: On what day did Margaret, Maid of Norway die in Orkney?
    about: [{person: margaret-maid-of-norway}]
    field: died
    claims:
      - {value: "Between 26 and 29 September 1290", sources: [wp-margaret-maid-of-norway]}
      - {value: "'Late September 1290'", sources: [wp-william-wallace]}
    note: "Year only is recorded."
  - key: robert-bruce-birthplace
    question: Where was Robert the Bruce born on 11 July 1274?
    about: [{person: robert-i-of-scotland}]
    field: place
    claims:
      - {value: "Most likely Turnberry Castle, Ayrshire, head of his mother's earldom of Carrick", sources: [wp-robert-i-of-scotland]}
      - {value: "Perhaps Lochmaben, Dumfriesshire", sources: [wp-robert-i-of-scotland]}
      - {value: "Perhaps Writtle, Essex", sources: [wp-robert-i-of-scotland]}
    note: "No birth moment is entered."
  - key: robert-ii-coronation-day
    question: On what date was Robert II crowned at Scone in 1371?
    about: [{person: robert-ii-of-scotland}]
    field: crowned
    claims:
      - {value: "26 March 1371 (delayed by William, Earl of Douglas's armed protest)", sources: [wp-robert-ii-of-scotland]}
      - {value: "27 March 1371", sources: [wp-robert-iii-of-scotland]}
    note: "The moment records the year only."
  - key: james-ii-coronation-day
    question: On what date was James II crowned at Holyrood Abbey in 1437?
    about: [{person: james-ii-of-scotland}]
    field: crowned
    claims:
      - {value: "26 March 1437, by Michael Ochiltree, Bishop of Dunblane", sources: [wp-james-ii-of-scotland]}
      - {value: "25 March 1437: the Earl of Atholl was beheaded on 26 March, 'the day after the coronation of the young James II'", sources: [wp-james-i-of-scotland]}
    note: "The moment records the year only."
  - key: james-iii-birth
    question: When and where was James III born?
    about: [{person: james-iii-of-scotland}]
    field: born
    claims:
      - {value: "Late May 1452 at St Andrews (argued by Norman Macdougall)", sources: [wp-james-iii-of-scotland]}
      - {value: "10 or 20 July 1451, at Stirling Castle", sources: [wp-james-iii-of-scotland]}
      - {value: "May 1452 (James II's article)", sources: [wp-james-ii-of-scotland]}
    note: "The record uses 1452 (estimated) and enters no birth place."
