batch:
  title: "The kings and queens of Scotland, 1005-1513, and William Wallace"
  requested: "Malcolm II through James IV, plus Margaret Maid of Norway, John Balliol, Robert the Bruce and William Wallace: lives, reigns, battles, treaties, places"
  date: 2026-10-08

# Notes for the reviewer
# - Source: local copies of the English Wikipedia articles for the 24 people. Nothing was fetched. Every file was checked: line 1 of each is the right article (no disambiguation pages). James IV's article is titled "James IV" (not "James IV of Scotland"), and John Balliol's and William the Lion's likewise have no "of Scotland".
# - Lulach (king Sept 1057 to 23 April 1058, Macbeth's stepson, crowned at Scone) has no downloaded article, so he is NOT entered. Malcolm III's title therefore starts in 1058 and Macbeth's ends on 15 August 1057, leaving a gap that is Lulach's reign.
# - Interregnums (1290-92, 1296-1306) are gaps; no title is invented. Margaret has a "Queen of Scotland" row 19 March 1286 to 1290 and the note says she was never inaugurated (see "Margaret" below).
# - Titles: "King of Scotland" (realm Scotland, existing) for every king, with a note where the article says "King of Alba" or "King of Scots" (the articles use Alba up to Alexander III, Scots from Balliol on). Kenneth III's existing "King of Alba" row is untouched; his reign ends 1005.
# - Start dates: where an article gives both the death of the predecessor and the inauguration, the title starts at the predecessor's death (as the Stuarts batch does) and the note gives the inauguration. Exceptions: Duncan I starts on his acclamation, 30 November 1034, because Malcolm II's death date (25 November) and his acclamation differ. Duncan II and Donald III have year-only starts for 1094 because the articles give no day.
# - David I's title starts on 23 April 1124, the death date of Alexander I taken from Alexander I's own article; David I's article gives only "1124" and says he was crowned at Scone in April or May. David's earlier title Prince of the Cumbrians (1113-1124) is left out: no realm of that name is entered.
# - Left out (no article or a title with no realm): Lulach; Saint Margaret (Malcolm III's queen) and Edgar Ætheling; Ingibiorg; Earl Henry (David I's son, father of Malcolm IV and William the Lion); the rival Edward Balliol (crowned by the English 24 September 1332, in David II's article); Guardians of Scotland other than Wallace (Bruce and Comyn 1298, the six guardians 1286, Moray and Murray); Andrew Moray; the Lords of the Isles; Mary of Guelders, Margaret of Denmark and Margaret Tudor. Consort links are therefore not entered, only parent-to-child links between kings.
# - Wallace: the article gives no start date for his Guardianship beyond "after" Stirling Bridge (11 September 1297) and says he resigned by September 1298 (after Falkirk, July 1298). The title therefore runs 1297 to 1298 (years only), with Andrew Moray as joint Guardian until his death in late 1297. The Bruce article says Bruce and Comyn followed him as joint Guardians; those titles are not entered here.
# - Existing events reused (people only, no other fields): battle-of-bannockburn-1314 (adds Robert the Bruce as victor) and battle-of-falkirk-1298 (adds Wallace as defeated). Existing places reused: edinburgh, edinburgh-castle, london, tower-of-london, dunbar (for the 1296 battle; the existing record is the 1650 site), chateau-gaillard (David II lived there in exile). Because the intake only adds event_people rows for an existing event, I send just key + people + sources for those two; if the preview objects to a nameless event entry, drop those two blocks and add the moments instead.
# - Not entered because the article gives no date or place, or the date is month-only: Carham (probably 1018, no day); Dunsinane (1054, no day or defined place); Largs place; Methven (June 1306); Loudoun Hill (1307); Neville's Cross place; Dupplin Moor and Halidon Hill (only in the David II article, not requested); the Treaty of Berwick (3 October 1357) and Treaty of Birgham (18 July 1290); Murdoch Stewart's execution (24/25 May 1425, Stirling Castle); James IV's marriage (8 August 1503, Holyrood Abbey), which is in the note on the Perpetual Peace instead. The Treaty of Edinburgh-Northampton is month-only (May 1328), so it is dated by year. The Battle of Dunbar 1296 is dated by year (the articles give only the 27 April fall of the castle).
# - Declaration of Arbroath: the Bruce article dates it 1320 (no day) and does not name the place. The place arbroath-abbey is taken from the William the Lion article ("Arbroath Abbey, the site of the later Declaration of Arbroath"). Prominence 5, as instructed. Stirling Bridge (11 September 1297) is 5; Bannockburn is the existing event.
# - Births and deaths whose place is not in the article, or whose place is not defined here, are left out: Malcolm III's birth, Alexander II's birth (Haddington), Alexander III's birth (Roxburgh, not the castle), Malcolm IV's death (Jedburgh), Alexander I's death (the court at Stirling), Robert III's death (Rothesay Castle), Margaret's death (Orkney), Balliol's death (Hélicourt, Picardy: no reliable coordinates in hand). Robert the Bruce's birthplace is disputed and not entered (see discrepancy).
# - Reburials: Malcolm III's moment is the 1250 reburial beside Margaret at Dunfermline Abbey (the article's year); his first burial at Tynemouth Priory is in the discrepancy. Robert I's heart (Melrose Abbey, buried after 1330) and viscera (St Serf's chapel, Dumbarton) are in the person note; the moment 'heart buried' at Melrose has no year because the article gives none for the burial itself.
# - James IV: body held unburied at Sheen Priory, Surrey; the article's long account (excommunication, lost body) is in the note only.
# - Dates: where an article gives a month but no day, I used the year (and the note says so). All English-style calendar differences are irrelevant here (no entry is after 1752).
# - Coordinates are from general knowledge (2-3 decimals); battlefield and monastery points (Lumphanan, Stirling Bridge, the Standard, Flodden, Cardross) are approximate. The "visitable" flags are also general knowledge, not from the articles. The exact site of Cardross manor and of the 1297 bridge is not given in the articles.
# - Shared keys defined here that other batches might also send: scone, dunfermline-abbey, iona, stirling-castle, holyrood-abbey, holyrood-palace, carlisle-castle, roxburgh-castle, perth, kelso-abbey, flodden-battlefield, battle-of-flodden-1513. If the Tudors/England batch also defines flodden or carlisle, keep one.
# - Size: 24 people, 25 title rows, 24 places, 27 new events plus 2 people-only references to existing events (about 100 rows), 14 links, 47 moments, 12 discrepancies.
# - Discrepancies recorded below: Duncan I's death day; Macbeth's place of death; Malcolm III's death place and burial; Donald III's fate; Duncan II's killer and burial; Edgar's death; the death/accession date at the Alexander II to Alexander III handover; Margaret's death day; Robert the Bruce's birthplace; Robert II's coronation day; James II's coronation day; James III's birth. Seen and not entered: Earl Henry's death (12 June 1152 in the Malcolm IV article, 12 July 1152 in the David I article; he is not in this batch); Donald III's birth (c. 1032 in the lead, about 1033 in the text; the record uses c. 1032).

