# Notes for the reviewer
# - Paintings by our painters in 114 museums' collections (part 2 of 3), read from Wikidata (WikiProject sum of all paintings, CC0 open data) with images from Wikimedia Commons (public domain or free licences only, checked per file). Nothing was read from the museums' own sites. The 4 best-documented works per painter, ranked by how many Wikipedia editions cover the work.
# - Inventory numbers come from Wikidata (P217). A link back is given only where Wikidata has the French Ministry of Culture's Joconde id (French museums); otherwise the picture links to its Commons page and the museum's page is left for a later pass.
# - Works already in the database (from the painters' articles or earlier museum API passes) were updated with the museum, inventory number and image; the museum is the one Wikidata names as holding the work.

