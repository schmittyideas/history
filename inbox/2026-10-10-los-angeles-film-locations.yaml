places:
  - key: chaplin-studios
    name: Chaplin Studios (Charlie Chaplin Studios)
    kind: film studio
    city: Los Angeles
    region: California
    country: United States
    lat: 34.096
    lng: -118.344
    founded: 1917
    built_by: "Charlie Chaplin; later A&M Records (1966-1999) and the Jim Henson Company (2000-2024)"
    visitable: false
    visit_site: "A working studio; seen from La Brea Avenue, just south of Sunset Boulevard"
    note: "Chaplin's own studio from 1917 to 1953, where he made The Kid, The Gold Rush, City Lights, Modern Times and The Great Dictator. A Los Angeles Historic-Cultural Monument; the name Chaplin Studios was restored in 2026."
    sources: [wp-chaplin-studios]
  - key: music-box-steps
    name: Music Box Steps
    kind: staircase
    city: Los Angeles
    region: California
    country: United States
    lat: 34.087
    lng: -118.275
    visitable: true
    visit_site: "Public stairway at 923-925 North Vendome Street, Silver Lake; a plaque on a lower step"
    note: "133 public steps from Vendome Street up to Descanso Drive, where Laurel and Hardy hauled a piano in The Music Box (1932); a popular tourist attraction near Laurel and Hardy Park."
    sources: [wp-the-music-box-1932]
  - key: venice-los-angeles
    name: Venice
    historical_name: Venice of America
    kind: district
    city: Los Angeles
    region: California
    country: United States
    lat: 33.985
    lng: -118.469
    founded: 1905
    built_by: "Abbot Kinney"
    visitable: true
    visit_site: "Venice Beach boardwalk, the canals and Abbot Kinney Boulevard"
    note: "Beach district founded by Abbot Kinney as the resort town Venice of America, opened 4 July 1905; part of Los Angeles since 1926. A common filming location: piers, skate park, canals and boardwalk."
    sources: [wp-venice-los-angeles]
  - key: los-angeles-central-library
    name: Los Angeles Central Library
    kind: library
    city: Los Angeles
    region: California
    country: United States
    lat: 34.0505
    lng: -118.2551
    founded: 1926
    architect: "Bertram Goodhue (Goodhue Building); Tom Bradley wing added 1993"
    visitable: true
    visit_site: "Richard J. Riordan Central Library, 630 West 5th Street, Downtown"
    note: "Main branch of the Los Angeles Public Library, opened July 1926; the Goodhue Building is a downtown landmark on the National Register of Historic Places (1970)."
    sources: [wp-los-angeles-central-library]
  - key: angels-flight
    name: Angels Flight
    kind: funicular
    city: Los Angeles
    region: California
    country: United States
    lat: 34.0514
    lng: -118.2500
    founded: 1901
    visitable: true
    visit_site: "Between Hill Street and California Plaza, Bunker Hill, opposite Grand Central Market"
    note: "Narrow-gauge funicular with two cars, Olivet and Sinai. Ran on Third Street from 1901 to 1969, reopened half a block south in 1996; closed after accidents and back in service since 31 August 2017."
    sources: [wp-angels-flight]
  - key: fox-plaza
    name: Fox Plaza (2121 Avenue of the Stars)
    kind: office tower
    city: Los Angeles
    region: California
    country: United States
    lat: 34.0555
    lng: -118.4130
    founded: 1987
    built_by: "Marvin Davis, on land kept back from his sale of 20th Century Fox"
    architect: "Scott Johnson (Johnson Fain)"
    visitable: true
    visit_site: "Exterior only, on Avenue of the Stars in Century City; the building cannot be toured"
    note: "34-storey Century City tower completed in 1987, now called 2121 Avenue of the Stars. Ronald Reagan kept his offices on the 34th floor after leaving office. Nakatomi Plaza in Die Hard."
    sources: [wp-fox-plaza-los-angeles, wp-die-hard-1988]
  - key: university-of-southern-california
    name: University of Southern California
    kind: university
    city: Los Angeles
    region: California
    country: United States
    lat: 34.0224
    lng: -118.2851
    founded: 1880
    built_by: "Robert M. Widney, with land given by Ozro Childs, John G. Downey and Isaias W. Hellman"
    visitable: true
    visit_site: "University Park campus, south of Downtown"
    note: "California's oldest private research university, founded 1880. Its campus is a frequent filming location (Forrest Gump, Ghostbusters, The Graduate, The Social Network)."
    sources: [wp-university-of-southern-california]

