# Los Angeles film locations: famous films shot at places in and around Los Angeles that a visitor can find today.
# Each film is an artwork (kind: film) linked to its director (creator) and to the places it was shot (role: filmed,
# new: "scenes were shot here"). No poster images: posters are not freely licensed.
# VERIFIED against English Wikipedia articles downloaded on 2026-10-10 with tools/wiki.py (revision IDs in the session
# scratchpad). Candidates came from Wikidata "filming location" (P915) and the landmarks' own popular-culture lists; every
# film-place claim below is stated in the film's article, the place's article, or both (the cited sources say which).
# Stated honestly:
#  - Coordinates of new places are from general knowledge (the articles give none), approximate to ~3 decimals.
#  - Directors are added with life dates and one line only (coverage: not-read, "added as director of ...").
#  - Left out because Wikipedia doesn't confirm the LA location: The Terminator at Griffith Observatory, Safety Last!'s
#    downtown buildings, Blade Runner at Union Station, L.A. Confidential at City Hall (only the plot is set there).
#  - Left out because the place is gone or not visitable: the Ambassador Hotel (demolished; The Graduate, Pretty Woman,
#    Catch Me If You Can), the Spruce Goose hangar sound stages (Titanic), the Heim Bridge (Inception).
#  - The War of the Worlds (1953) is left out: its City Hall is a miniature, and its Pacific Tech is the Paramount lot only
#    as a stand-in, not a scene a visitor can recognise.
#  - A Star Is Born (1937): the Hollywood Bowl's list of films names "A Star Is Born" without a year (there are several
#    versions), so only the Chinese Theatre, which names the 1937 film, is linked.
#  - Chinatown (1974): the only LA location Wikipedia names is the Bradbury Building, in the building's list of films;
#    the film's own article gives no locations. Kept, at prominence 3.
#  - Zemeckis's birth year: Wikipedia 1951, Wikidata 1952; Ritchie's birth day: Wikipedia 28 November, Wikidata both
#    18 and 28 November. Both recorded as discrepancies.
batch:
  title: "Los Angeles film locations, 1921-2016"
  requested: "About 20-25 famous films shot at specific, visitable Los Angeles places, as artworks (kind: film) linked to their directors and to the places they were filmed"
  date: 2026-10-10

