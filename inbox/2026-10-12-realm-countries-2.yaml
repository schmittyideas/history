  - {key: wp-moldavia,                      title: "Moldavia (Wikipedia)",                           url: "https://en.wikipedia.org/wiki/Moldavia"}
  - {key: wp-wallachia,                     title: "Wallachia (Wikipedia)",                          url: "https://en.wikipedia.org/wiki/Wallachia"}
