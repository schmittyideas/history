batch: {title: "Realm years and countries, batch 2", requested: "Ty: realms with start and end dates, mapped to today's countries", date: 2026-10-12}

# Years come from each article's infobox (year_start / year_end / life_span); countries from its
# "Today part of" list. Where an article has no such list, the countries are the ones its text
# clearly names, and a comment says so. Where the infobox and the article's own text disagree on
# a start or end year, the record holds the infobox value (unless noted) and a discrepancy below
# records both sides. All articles read 2026-10-12.

sources:
  - {key: wp-golden-horde,                  title: "Golden Horde (Wikipedia)",                       url: "https://en.wikipedia.org/wiki/Golden_Horde"}
  - {key: wp-grand-duchy-of-lithuania,      title: "Grand Duchy of Lithuania (Wikipedia)",           url: "https://en.wikipedia.org/wiki/Grand_Duchy_of_Lithuania"}
  - {key: wp-grand-principality-of-moscow,  title: "Grand Principality of Moscow (Wikipedia)",       url: "https://en.wikipedia.org/wiki/Grand_Principality_of_Moscow"}
  - {key: wp-vladimir-suzdal,               title: "Vladimir-Suzdal (Wikipedia)",                    url: "https://en.wikipedia.org/wiki/Vladimir-Suzdal"}
