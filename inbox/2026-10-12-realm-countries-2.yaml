  - {key: wp-ayyubid-dynasty,               title: "Ayyubid dynasty (Wikipedia)",                    url: "https://en.wikipedia.org/wiki/Ayyubid_dynasty"}
  - {key: wp-buyid-dynasty,                 title: "Buyid dynasty (Wikipedia)",                      url: "https://en.wikipedia.org/wiki/Buyid_dynasty"}
  - {key: wp-empire-of-trebizond,           title: "Empire of Trebizond (Wikipedia)",                url: "https://en.wikipedia.org/wiki/Empire_of_Trebizond"}
