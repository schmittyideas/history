# The Papacy, 999-1503, part 1: the 13 lawful popes of the period not yet here (John XVII to Honorius IV), and the 15
# antipopes whose claims began 1012-1179, from Gregory VI to Innocent III (the antipope). The Western Schism antipopes
# (1328-1449) follow in part 2 (inbox/2026-10-18-popes-antipopes-1328-1449.yaml).
# Ty's choices (2026-10-18): every pope on the official list; antipopes with the same title "Pope", marked
# `disputed: true`, keyed <name>-antipope, roles [antipope]; the lawful popes undisputed (their notes say who
# contested them, as the earlier Papacy batches did).
# VERIFIED against English Wikipedia articles downloaded on 2026-10-18 with tools/wiki.py (revision IDs in the session
# scratchpad): each pope's and antipope's own article for his dates and note; the List of popes and the Antipope
# article's table for pontificates and birthplaces; Wikidata for sitelinks and new places' coordinates.
# Stated honestly:
#  - Early dates are often a year or "c.": recorded as given, estimated where the article says c. Where the article
#    gives only a month or "June or July", the year alone is used.
#  - Disagreements recorded as discrepancies, the record using the person's own article: John XVII's and Celestine IV's
#    deaths (vs Wikidata); the first day of Sylvester III, Lucius II and Anastasius IV (vs the List of popes); Benedict
#    X's election, Paschal III's end, Innocent III's (antipope) start, Nicholas V's end and Alexander V's start (vs the
#    Antipope table); Benedict XIII's (antipope) birth and Clement VIII's (antipope) death (vs Wikidata).
#  - Felix V is entered under his own name, Amadeus VIII of Savoy, typed Nobility (he was Count and then the first Duke
#    of Savoy), with both Savoy titles and the disputed papal title.
#  - Benedict XIV (antipope) is two men in one article: Bernard Garnier and Jean Carrier, entered separately.
#  - Celestine II (1124) resigned before consecration; Wikipedia calls him a "pope-elect" and lists him with the
#    antipopes, so he is entered as one.
#  - Birthplaces not on Wikidata with coordinates (Corvaro, Pildenau) and states rather than towns (County of Savoy) are
#    left out; the notes keep them.
batch:
  title: "The Papacy, 999-1503, and its antipopes, part 1"
  requested: "Do we have all popes? Get them all, with the disputed ones (antipopes) marked disputed"
  date: 2026-10-18

