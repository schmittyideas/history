batch:
  title: "English royal families 2a: Henry II, Richard I, John and Henry III (1154-1272)"
  requested: "Ty (issue #292): fill in each English monarch's parents, spouses (with marriage year) and legitimate children who reached 12, with sex on the monarchs"
  date: 2026-10-25
  notes: "Family links for Henry II, Richard I, John and Henry III. New people are the spouses and children with their own Wikipedia articles, with birth and burial places where the article names them. No title changes."

# Built from the English Wikipedia articles on each monarch (scratchpad copies, October 2026) and each new
# person's own article, cited per person below. Coordinates from each place article (Wikipedia coordinates).
#
# Left out (died before 12): William, Count of Poitiers (1153-1156), Henry II's eldest son; Katherine
#   (1253-1257), Henry III's daughter; the two sons Eleanor of Provence bore before her daughters (died very young, unnamed).
# Left out (illegitimate): Henry II's children by mistresses (Geoffrey, Archbishop of York; William Longespée and
#   others); John's (Richard FitzRoy, Joan Lady of Wales, Oliver fitz Regis and others).
# Richard I had no children by Berengaria. Edward I is linked here as Henry III's son; his own family is in file 2b.
# Moments left out because the article names no place: births of Henry the Young King, Geoffrey II, Isabella
#   of Angouleme, Joan Queen of Scotland, Isabella of England, Eleanor of Provence and Beatrice; Berengaria's
#   birth ("in Navarre", a kingdom, not a place); Isabella of Gloucester's birth and burial (the article only
#   says she was "likely" buried at Keynsham).
# Matilda of Saxony's birth is put in London: her article says "in London or, less likely, at Windsor Castle".
# Joan of Sicily was buried first at Rouen Cathedral and re-interred at Fontevraud (year not given): the moment
#   is Fontevraud with no year. Edmund Crouchback was buried at Westminster Abbey in 1301, five years after his death.
# Eleanor of Leicester was buried at Montargis Abbey, which has no article: the moment uses the town, Montargis.
# Uncertain birth years are marked estimated: Eleanor Queen of Castile (c. 1161), Berengaria (c. 1165-1170, record
#   1165), Isabella of Gloucester (c. 1160-1166, record 1160), Isabella of Angouleme (c. 1186/1188, record 1186),
#   Isabella of England ("around 1214"), Eleanor of Provence (c. 1223, "probably born latest in 1223").
# Months without a day become the year alone: Matilda of Saxony (June 1156 - June/July 1189), Joan of Sicily
#   (October 1165), Isabella of Gloucester (died October 1217), Eleanor of Provence (died 24/25 June 1291).
# Isabella of Gloucester is Nobility: she was not crowned with John in May 1199 ("only a consort, rather than a
#   queen") and the marriage was annulled by spring 1200.

