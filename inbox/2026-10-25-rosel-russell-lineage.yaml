  - {key: web-1066-roussel, title: "Hugue de Roussel (1066.co.nz, family history page; cites no archive)", url: "https://www.1066.co.nz/Mosaic%20DVD/text/people/roussel.htm"}
  - {key: stirnet-russell-01, title: "Russell 1 (Stirnet, genealogy site: early generations 'with some caution')", url: "https://www.stirnet.com/genie/data/british/qr/russell01.php"}
