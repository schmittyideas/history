  - {key: wiffen-house-of-russell, title: "J. H. Wiffen, Historical Memoirs of the House of Russell (1833), bibliographic record", url: "https://armorial.bibsoc.org.uk/node/60919.html"}
  - {key: wp-john-russell-1st-earl-of-bedford, title: "John Russell, 1st Earl of Bedford (Wikipedia)", url: "https://en.wikipedia.org/wiki/John_Russell,_1st_Earl_of_Bedford"}
