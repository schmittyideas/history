batch:
  title: "The Rosel-to-Russell line: Hugh de Rosel to John Russell, 1st Earl of Bedford"
  requested: "Ty: add the traditional lineage from Hugh de Rosel to the 1st Earl of Bedford, marking documented links as solid and traditional ones as uncertain (agreed 2026-10-25)"
  date: 2026-10-25

# Notes for the reviewer
# - Agreed with Ty on 2026-10-25: unproven parent links go in with `uncertain: true` and a note (sql/021), and the site shows them
#   as "traditional, unproven". Robert and Odo are sourced to the Stirnet genealogy site, labelled as such. The line stops at the 1st Earl.
#   Types: Nobility for the Norman landholders, Sir John and the Earl; Notable for the Weymouth merchants and the Berwick gentry.
# - Documented: Hugh Rosel held land at Grainville of William I and gave it to St Stephen's, Caen, when he became a monk
#   (William I's charter, c. 1077, Calendar of Documents preserved in France no. 450). Henry II's charter of 1156-7 (no. 453)
#   names a Hugh de Rosel whose father became a monk there, holding land at Rosel and Grouchy.
# - Traditional only: Hugh II -> Robert -> Odo -> Sir John of Kingston Russell. Nothing links Sir John (d. c. 1224) to Stephen
#   Russell of Weymouth, the first proven ancestor of the Bedfords, so there is no parent link across that gap; the discrepancy
#   `russell-descent-from-rosel` records both sides.
# - Left out: RootsWeb's birth years (Robert c. 1125, Odo c. 1160): the page refuses automated reading, so they could not be checked.
#   Hugh, Hugh II, Odo and Stephen have no dates any source gives, so they have none here (notes say when they were active).
#   No Earl of Bedford title: the database holds no peerage titles, and a realm "Bedford" would list him among rulers in the Year view.
# - Grainville: the calendar does not say which Grainville; Grainville-sur-Odon, beside Rosel and near Caen, is the likely one.
#   "Berwick, Swyre" uses Swyre village's coordinates; Berwick is a farm in that parish with no article of its own.

