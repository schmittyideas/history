people:
  - key: hugh-de-rosel
    name: Hugh de Rosel
    type: Nobility
    prominence: 1
    note: "Norman landholder (fl. c. 1077). Held land at Grainville of William I and gave it to St Stephen's, Caen, when he became a monk there. Claimed as founder of the Russells, Dukes of Bedford, by family tradition (J. H. Wiffen, 1833); the descent is unproven."
    sources: [cdf-france-calvados-1, web-1066-roussel]
  - key: hugh-de-rosel-ii
    name: Hugh de Rosel II
    type: Nobility
    prominence: 1
    note: "Son of Hugh de Rosel (fl. late 11th century). Henry II's charter of 1156-7 confirms a gift on Hugh de Rosel's fief 'of the land which his father gave St. Stephen's when he was made a monk there', and Hugh's own gift of land and tithes at Rosel and Grouchy. 1066.co.nz says he fought at Hastings and held Dorset land in 1086; no record found supports either."
    sources: [cdf-france-calvados-1, web-1066-roussel]
  - key: robert-russel-of-berwick
    name: Robert Russel
    type: Nobility
    died: 1201
    prominence: 1
    note: "Traditional ancestor of the Russells: only in genealogy sources. Stirnet's 'TUDOR' source gives Robert de Russell (d. 1201) as Odo's father; 1066.co.nz names a Robert Russel, son of Hugh II, in a charter of Stephen's reign (not identified). Family trees give his birth as c. 1125 at Berwick, Dorset; not checked."
    sources: [stirnet-russell-01, web-1066-roussel]
  - key: odo-russel
    name: Odo Russel
    type: Nobility
    prominence: 1
    note: "Odo (Eudo) Russell of Barwick (Berwick), Dorset, fl. c. 1200. Only in genealogy sources, which disagree on his father (Robert or Hugh) and make him the father of Sir John Russell of Kingston Russell."
    sources: [stirnet-russell-01]
  - key: john-russell-knight
    name: John Russell (knight)
    type: Nobility
    died: 1224
    died_estimated: true
    prominence: 2
    coverage: partly
    coverage_note: "Death, Kingston Russell serjeanty and offices captured; castles held (Corfe, Sherborne, Peveril, Bolsover) and family not built out."
    note: "Household knight of Richard I, John and Henry III, steward of Henry III's household, sheriff of Somerset (1223-1224). Held Kingston Russell, Dorset, by grand serjeanty as marshal of the king's buttery (Book of Fees, 1211). Wikipedia names no father."
    sources: [wp-john-russell-knight]
  - key: stephen-russell-of-weymouth
    name: Stephen Russell
    type: Notable
    prominence: 1
    note: "Weymouth merchant in the wine trade with Bordeaux (late 14th century); the earliest ancestor of the Russells, Earls and Dukes of Bedford, that records prove. His son Henry called himself 'son and heir of Sir Stephen Russell and of Alice, his wife' in a deed of April 1440."
    sources: [wp-john-russell-1st-earl-of-bedford, britannica-1911-russell-family]
  - key: henry-russell-of-weymouth
    name: Henry Russell
    type: Notable
    died: 1464
    died_estimated: true
    prominence: 1
    note: "Wine merchant and shipper of Weymouth, four times its member in the House of Commons (between 1425 and 1442); died 1463/4. A 1442 pardon names him 'Henry Russell alias Henry Gascoign', the root of the theory that the family were Gascon wine merchants."
    sources: [wp-john-russell-1st-earl-of-bedford, britannica-1911-russell-family]
  - key: john-russell-the-elder
    name: John Russell (the elder)
    type: Notable
    died: 1505
    prominence: 1
    note: "Son of Henry Russell, grandfather of the 1st Earl of Bedford; married Alice Froxmere. Died before November 1505."
    sources: [wp-john-russell-1st-earl-of-bedford]
  - key: james-russell-of-berwick
    name: James Russell
    type: Notable
    died: 1505
    prominence: 1
    note: "Sir James Russell of Berwick, Dorset, father of the 1st Earl of Bedford; married Alice Wyse of Sidenham, Devon. Died November 1505 (some sources: December 1505 to February 1506)."
    sources: [wp-john-russell-1st-earl-of-bedford]
  - key: john-russell-1st-earl-of-bedford
    name: John Russell, 1st Earl of Bedford
    type: Nobility
    born: 1485
    born_estimated: true
    died: 1555-03-14
    prominence: 3
    coverage: partly
    coverage_note: "Ancestry, birth, the 1506 Castile shipwreck, Chenies, Woburn and burial captured; his career under Henry VIII and Edward VI (Lord Privy Seal, Lord High Admiral) and the earldom (19 January 1550) not built out."
    note: "Founder of the Russells' fortune. Born probably at Berwick, Dorset; attended Philip and Joanna of Castile when a storm drove them ashore in Dorset (1506) and was recommended to Henry VII. Gained Chenies by marrying Anne Sapcote (1526) and Woburn Abbey after the Dissolution. Created Earl of Bedford in 1550; buried in the Bedford Chapel at Chenies."
    sources: [wp-john-russell-1st-earl-of-bedford]

events:
  - key: hugh-rosel-gives-grainville-to-st-stephens
    name: Hugh Rosel becomes a monk and gives Grainville to St Stephen's, Caen
    type: Donation
    year: 1077
    estimated: true
    place: abbaye-aux-hommes
    places:
      - {place: grainville-sur-odon, role: land, note: "The land Hugh held of William I; probably this Grainville (the calendar does not say which)"}
    people:
      - {person: hugh-de-rosel, role: donor}
      - {person: william-i-of-england, role: confirmed}
    prominence: 1
    note: "William I's charter to his abbey of St Stephen's (c. 1077) grants 'the land that Hugh Rosel held of him in Grainville, and gave the said monastery when he became a monk'. The only record linking a Rosel to the Conqueror."
    sources: [cdf-france-calvados-1]
  - key: philip-and-joanna-driven-ashore-1506
    name: Philip and Joanna of Castile driven ashore in Dorset
    type: Shipwreck
    year: 1506
    month: 1
    place: weymouth
    people:
      - {person: john-russell-1st-earl-of-bedford, role: attendant}
    prominence: 2
    note: "Sailing to Spain, Philip and Joanna were caught in a storm and forced ashore near Melcombe Regis (now part of Weymouth). Sir Thomas Trenchard hosted them at Wolfeton House; John Russell attended them, and Philip recommended him to Henry VII, the start of his career at court."
    sources: [wp-philip-i-of-castile, wp-john-russell-1st-earl-of-bedford]

links:
  - {parent: hugh-de-rosel, child: hugh-de-rosel-ii, note: "Henry II's charter of 1156-7 names a Hugh de Rosel whose father gave land to St Stephen's on becoming a monk there; 1066.co.nz says the son Hugh consented to the gift", sources: [cdf-france-calvados-1, web-1066-roussel]}
  - {parent: hugh-de-rosel-ii, child: robert-russel-of-berwick, uncertain: true, note: "Claimed by 1066.co.nz from a charter of Stephen's reign it does not identify. Stirnet's 'TUDOR' source puts an unnamed generation between. Hugh II was grown by 1077, so a son born c. 1125 is unlikely", sources: [web-1066-roussel, stirnet-russell-01]}
  - {parent: robert-russel-of-berwick, child: odo-russel, uncertain: true, note: "Only in genealogy sources ('TUDOR', via Stirnet). Stirnet's other source (MGH) makes Odo a son of Hugh de Russell", sources: [stirnet-russell-01]}
  - {parent: odo-russel, child: john-russell-knight, uncertain: true, note: "Only in genealogy sources (MGH, via Stirnet). Wikipedia's article on Sir John names no father", sources: [stirnet-russell-01]}
  - {parent: stephen-russell-of-weymouth, child: henry-russell-of-weymouth, sources: [wp-john-russell-1st-earl-of-bedford]}
  - {parent: henry-russell-of-weymouth, child: john-russell-the-elder, sources: [wp-john-russell-1st-earl-of-bedford]}
  - {parent: john-russell-the-elder, child: james-russell-of-berwick, sources: [wp-john-russell-1st-earl-of-bedford]}
  - {parent: james-russell-of-berwick, child: john-russell-1st-earl-of-bedford, sources: [wp-john-russell-1st-earl-of-bedford]}

moments:
  - {person: hugh-de-rosel, role: held, place: grainville-sur-odon, year: 1077, sources: [cdf-france-calvados-1]}
  - {person: hugh-de-rosel-ii, role: held, place: rosel-calvados, sources: [cdf-france-calvados-1]}
  - {person: john-russell-knight, role: held, place: kingston-russell, year: 1211, sources: [wp-john-russell-knight, wp-kingston-russell]}
  - {person: stephen-russell-of-weymouth, role: worked, place: weymouth, sources: [wp-john-russell-1st-earl-of-bedford, britannica-1911-russell-family]}
  - {person: henry-russell-of-weymouth, role: worked, place: weymouth, sources: [wp-john-russell-1st-earl-of-bedford, britannica-1911-russell-family]}
  - {person: john-russell-1st-earl-of-bedford, role: born, place: berwick-swyre, year: 1485, sources: [wp-john-russell-1st-earl-of-bedford]}
  - {person: john-russell-1st-earl-of-bedford, role: lived, place: chenies-manor-house, year: 1526, sources: [wp-john-russell-1st-earl-of-bedford, wp-chenies-manor-house]}
  - {person: john-russell-1st-earl-of-bedford, role: lived, place: woburn-abbey, year: 1547, sources: [wp-john-russell-1st-earl-of-bedford, wp-woburn-abbey]}
  - {person: john-russell-1st-earl-of-bedford, role: buried, place: st-michaels-chenies, year: 1555, sources: [wp-john-russell-1st-earl-of-bedford]}

discrepancies:
  - key: russell-descent-from-rosel
    question: Do the Russells, Earls and Dukes of Bedford, descend from Hugh de Rosel through the Russells of Kingston Russell?
    about: [{person: hugh-de-rosel}, {person: john-russell-knight}, {person: stephen-russell-of-weymouth}, {person: john-russell-1st-earl-of-bedford}]
    claims:
      - {value: "Yes: Hugh de Rosel, then the Russells of Kingston Russell, then Weymouth and Bedford", sources: [wiffen-house-of-russell, web-1066-roussel, stirnet-russell-01], note: "Family tradition, set out by J. H. Wiffen (1833) and repeated by family-tree sites"}
      - {value: "Unproven: the line is certain only from Stephen Russell of Weymouth (late 14th century)", sources: [wp-john-russell-1st-earl-of-bedford, britannica-1911-russell-family], note: "Gladys Scott Thomson (1930) found the Kingston Russell link unproven; the 1911 Britannica calls the early pedigree padding and suggests Gascon wine merchants (Henry Russell 'alias Henry Gascoign', 1442)"}
    note: "The database links Hugh de Rosel down to Sir John Russell (d. c. 1224) with uncertain links, and Stephen Russell down to the 1st Earl with proven ones. Nothing links Sir John to Stephen."
  - key: odo-russel-father
    question: Was Odo Russel the son of Robert Russel or of Hugh de Russell?
    about: [{person: odo-russel}, {person: robert-russel-of-berwick}]
    field: parent
    claims:
      - {value: "Robert de Russell (d. 1201)", sources: [stirnet-russell-01], note: "'TUDOR' (2003, 2021), as reported by Stirnet"}
      - {value: "Hugh de Russell of Barwick", sources: [stirnet-russell-01], note: "MGH (1914), which Stirnet provisionally follows"}
    note: "The record uses Robert (an uncertain link), the line Ty asked for on 2026-10-25."
  - key: james-russell-death
    question: When did Sir James Russell, father of the 1st Earl of Bedford, die?
    about: [{person: james-russell-of-berwick}]
    field: died
    claims:
      - {value: "November 1505", sources: [wp-john-russell-1st-earl-of-bedford]}
      - {value: "Between December 1505 and February 1506", sources: [wp-john-russell-1st-earl-of-bedford], note: "Other sources, per Wikipedia"}
    note: "The record uses 1505."
  - key: john-russell-1st-earl-death
    question: Did John Russell, 1st Earl of Bedford, die on 14 March or 14 May 1555?
    about: [{person: john-russell-1st-earl-of-bedford}]
    field: died
    claims:
      - {value: "1555-03-14", sources: [wp-john-russell-1st-earl-of-bedford], note: "Wikipedia's lead and its death and burial section (14 March 1554/5)"}
      - {value: "1555-05-14", sources: [wp-john-russell-1st-earl-of-bedford], note: "Wikipedia's infobox"}
    note: "The record uses 14 March 1555, which the article's text gives twice."
