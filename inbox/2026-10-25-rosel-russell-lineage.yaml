  - {key: berwick-swyre, name: "Berwick, Swyre", kind: manor, city: Swyre, region: Dorset, country: England, lat: 50.6919, lng: -2.6699, sources: [wp-swyre, wp-john-russell-1st-earl-of-bedford]}
  - {key: weymouth, name: Weymouth, historical_name: "Weymouth and Melcombe Regis (two towns until 1571)", kind: harbour, region: Dorset, country: England, lat: 50.6097, lng: -2.4547, sources: [wp-weymouth-dorset]}
  - {key: chenies-manor-house, name: Chenies Manor House, kind: manor house, city: Chenies, region: Buckinghamshire, country: England, lat: 51.6744, lng: -0.5330, visitable: true, visit_site: "Chenies Manor House (open at limited times; a private home)", built_by: "John Russell, 1st Earl of Bedford, probably c. 1530-1550", sources: [wp-chenies-manor-house]}
