batch:
  title: "The Papacy, part 2: the popes from Innocent III to Alexander VI, 1198-1503"
  requested: "Reigns, lives, deaths and key events of the 34 popes from Innocent III (1198) to Alexander VI (1503): the height of papal power, the Hohenstaufen wars, the Avignon papacy, the Western Schism, the councils and the Renaissance popes"
  date: 2026-10-08

# Notes for the reviewer
# - Facts come only from the 34 downloaded pope articles (Pope_Innocent_III ... Pope_Alexander_VI) plus Avignon_Papacy, Western_Schism and Council_of_Constance. Investiture_Controversy.txt was read but covers 1050-1122 and adds nothing for this range. The Supabase database was not queried, so the "look for them first" check was not done: the keys here are the plain regnal names (innocent-iii ... alexander-vi) and should be previewed for duplicates.
# - Apply AFTER the first Papacy batch (inbox/2026-10-08-popes-1012-1198.yaml) and the HRE, France, Byzantium, Plantagenets and Castile-Leon batches. Keys referenced, NOT redefined: places rome, st-peters-basilica-rome, lateran-palace-rome, anagni, viterbo, arezzo, pisa, florence, venice, konstanz, constantinople (all from those batches); people frederick-ii-holy-roman-emperor, philip-iv-of-france, louis-iv-holy-roman-emperor (HRE and France batches); events sack-of-constantinople-1204, recapture-of-constantinople-1261, council-of-florence-1439, fall-of-constantinople-1453 (Byzantium); albigensian-crusade-1208, aragonese-crusade-1285, attack-on-boniface-viii-at-anagni-1303 (France); sixth-crusade-1228, council-of-lyon-1245, council-of-constance-1414, imperial-coronation-of-frederick-iii-1452 (HRE); second-council-of-lyon-1274 (Byzantium); treaty-of-bretigny-1360 (existing); magna-carta-1215 (existing). Those event entries below are stubs (key, a few added fields, people, sources): the people lists add the popes. A stub adds a place or a day only where the pope article gives one: council-of-lyon-1245 and second-council-of-lyon-1274 get place lyon; council-of-florence-1439 gets place florence; the Anagni attack gets place anagni and the day 7 September 1303 (the France batch gave the year only).
# - Defined here and possibly sent by other batches: places avignon, lyon, naples, perugia, orvieto; events fourth-crusade-1202, western-schism-1378, move-of-the-papacy-to-avignon-1309, council-of-vienne-1311, council-of-pisa-1409, council-of-basel-1431, unam-sanctam-1302. viterbo is used by moments but its note (from batch 1) is not extended here.
# - Antipopes are out of scope and not entered: Clement VII (Robert of Geneva, 1378-94, elected at Fondi 20 September 1378), Benedict XIII (Pedro de Luna, 1394-1423), Clement VIII (1423-29), Benedict XIV (two claimants), the Pisan Alexander V (1409-10) and John XXIII (Baldassare Cossa, 1410-15), Felix V (Amadeus VIII of Savoy, elected at Basel 5 November 1439, resigned 7 April 1449) and Nicholas V (Pietro Rainalducci, set up by Louis IV in May 1328, submitted 1330). A later batch should key them with the suffix, for example `clement-vii-antipope`, `nicholas-v-antipope`, `alexander-v-antipope`, `john-xxiii-antipope`, so they do not clash with the lawful popes here. Alexander VI took his number (and not "V") because of confusion over Alexander V; the Alexander VI article says so.
# - Popes of the period who were not requested and have no downloaded article, so they are NOT entered and the gaps between pontificates are real: Celestine IV (elected 25 October 1241, fifteen days), Innocent V (elected 21 January 1276, died 22 June 1276), Adrian V (elected 11 July 1276, died 18 August 1276), John XXI (elected 8 September 1276, died 20 May 1277) and Honorius IV (died 3 April 1287), all named in the articles; and Pius III (1503), named in the Pius II and Alexander VI articles. Do not fill them from here.
# - Pontificate dates use each article's lead where it gives a date. Where the lead gives the election and the body a later coronation (Clement V 1305, Urban V 1362, Innocent VI 1352, Gregory XI 1370, Eugene IV 1431, Nicholas IV 1288) the lead's date is used and the other is in the note. Where only a month is known the year alone is used (Clement V: elected June 1305, crowned 14 November 1305).
# - `disputed` is NOT used. The four Roman-line popes of the Western Schism (Urban VI, Boniface IX, Innocent VII, Gregory XII) were contested by the Avignon and Pisan claimants, who are not entered here, so flagging only the Roman line would mislead; each title note records the contest. This matches the first Papacy batch, which used no `disputed` flag.
# - Elected popes who left office without dying: Celestine V resigned 13 December 1294 (title row ends there, died 19 May 1296 in the castle of Fumone) and Gregory XII resigned 4 July 1415 through proxies at Constance (title row ends there, died 18 October 1417). Both are given the dates the articles give, and a note.
# - Left out because the article gives no date or no firm fact: the year of the Sistine Chapel (the Sixtus IV article says only that he sponsored its construction, so `founded` is left blank; the Sistine place has `built_by` only); the year of Nicholas V's Vatican wing and Innocent VIII's Belvedere; the Treaty of Tordesillas as an event (the articles say only that Inter caetera of 4 May 1493 became its basis, and the Nicholas V article gives 1494 in passing); the Battle of Benevento and Tagliacozzo (Clement IV article, no dates); the Battle of Varna (Eugene IV article, no date); the Battle of Belgrade 22 July 1456 and the noon-bell order of 29 June 1456 (Callixtus III; in his note only); the Pazzi conspiracy 1478 and the Spanish Inquisition bull of 1 November 1478 (Sixtus IV; in his note only); Dum Diversas 18 June 1452 and Romanus Pontifex 8 January 1455 (Nicholas V; in his note only); the Hussite crusade bull of 1 March 1420 (Martin V; note only); the canonisation of Thomas Aquinas, 18 July 1323 (John XXII; note only); Cola di Rienzo (Clement VI); Savonarola's execution 23 May 1498 (Alexander VI); Palazzo Venezia (Paul II) and the Santa Maria Maggiore palace of Nicholas IV, left unplaced. Birth places not defined here (Gavignano, Genoa, Troyes, Piacenza, Villandraut and others) are left out rather than adding a place for one line. Burials in places not defined (Clement V at Uzeste, Clement VI at La Chaise-Dieu, Urban V at Saint-Victor in Marseille, Innocent VI at Villeneuve-lès-Avignon, Pius II and others in later tombs) are in the notes only.
# - Family ties between popes (Gregory IX a cousin of Innocent III, Alexander IV a nephew of Gregory IX, Eugene IV a nephew of Gregory XII, Paul II a nephew of Eugene IV, Callixtus III the uncle of Alexander VI, Clement VI the uncle of Gregory XI) are in the notes. The `links` section has no uncle or cousin relation, so there is none.
# - Discrepancies found and recorded below: Avignon/Carpentras for the 1309 move, 1294/1295 for Boniface VIII's election, the death dates of Martin IV (22/28 March) and Boniface VIII (11/12 October), the year of Gregory X's election (1271/1270, an error in the Martin IV article), Innocent IV's return to Rome (1250/1253), Alexander IV's and Innocent VI's birth, the end of Gregory XII's pontificate (1415/1409) and Benedict XII's start (30 December 1334/8 January 1335). Smaller points sit in the notes: Gregory XI born c. 1329 (lead) or 1330 (Early life); Celestine V born 1209/1210 or 1215 (the record uses 1209 as c.); the age at Gregory XI's death; Gregory XII's later honours (Frascati in one passage, Porto and Santa Rufina in another and in the Constance article); the Avignon stay is "nearly 70", "68" and "67" years in different passages.
# - Doubts: Innocent III's birth year is 1160 or 1161 (the record uses 1160, estimated); Gregory IX's lies anywhere in 1145-1170 (1145, estimated); Alexander IV's pontificate start 12 December 1254 is the day after the vote began (election at Naples), consistent in two articles; Nicholas IV was elected 15 February 1288 but agreed on 22 February, which the lead gives as the start. The Gregory XI article dates the peace of Tivoli to July 1378, the Urban VI article to 28 July 1378. No Obsidian links are set.

