discrepancies:
  - key: move-to-avignon-1309-site
    question: Where did Clement V settle the curia in 1309?
    about: [{event: move-of-the-papacy-to-avignon-1309}, {person: clement-v}]
    field: place
    claims:
      - {value: "Avignon: 'On 9 March 1309 ... Clement settled the curia at the Dominican priory in Avignon'", sources: [wp-clement-v, wp-avignon-papacy]}
      - {value: "Carpentras: the Clement V article's next sentence says 'This move, actually to Carpentras, the capital of the territory'", sources: [wp-clement-v]}
      - {value: "Priory of Grauselle near Malaucene, where he signed a mandate on 18 October 1309", sources: [wp-boniface-viii]}
    note: "The record uses Avignon and 9 March 1309, which the Avignon Papacy article also gives for the move of the court."
  - key: boniface-viii-election-year
    question: In which year was Boniface VIII elected?
    about: [{person: boniface-viii}]
    field: title start
    claims:
      - {value: "24 December 1294 (Celestine V abdicated 13 December 1294; conclave opened 23 December)", sources: [wp-boniface-viii, wp-celestine-v]}
      - {value: "24 December 1295 ('Christmas Eve, 1295' / 'elected Pope Boniface VIII on 24 December 1295')", sources: [wp-benedict-xi, wp-martin-iv]}
    note: "The record uses 24 December 1294, which fits Celestine V's abdication and Boniface's own article; 1295 looks like a slip for his coronation year (23 January 1295)."
  - key: martin-iv-death-date
    question: On what day did Martin IV die?
    about: [{person: martin-iv}]
    field: died
    claims:
      - {value: "28 March 1285 (the lead's dates line and the Death section: Easter Wednesday, after Mass on Easter Sunday 25 March)", sources: [wp-martin-iv]}
      - {value: "22 March 1285 (the lead's sentence 'until his death on 22 March 1285')", sources: [wp-martin-iv]}
    note: "The record uses 28 March, the detailed account."
  - key: boniface-viii-death-date
    question: On what day did Boniface VIII die?
    about: [{person: boniface-viii}]
    field: died
    claims:
      - {value: "11 October 1303 (lead and the Burial passage: 'died of a violent fever on 11 October')", sources: [wp-boniface-viii]}
      - {value: "12 October 1303 (Giovanni Villani's chronicle, quoted)", sources: [wp-boniface-viii]}
    note: "The record uses 11 October."
  - key: gregory-x-election-year
    question: In which year was Gregory X elected?
    about: [{person: gregory-x}]
    field: title start
    claims:
      - {value: "1 September 1271", sources: [wp-gregory-x, wp-nicholas-iii]}
      - {value: "1 September 1270 (the Martin IV article, which also dates his arrival in Italy to 1 January 1271 and entry into Rome to 13 March)", sources: [wp-martin-iv]}
    note: "The record uses 1271. The Martin IV article gives both 1270 and 1271 and looks a year out in these passages; Gregory X's own article has the arrival at Brindisi on 1 January 1272."
  - key: innocent-iv-return-to-rome
    question: When did Innocent IV return to Italy and Rome after the Council of Lyon?
    about: [{person: innocent-iv}]
    field: date
    claims:
      - {value: "1250, after the death of Frederick II (the lead)", sources: [wp-innocent-iv]}
      - {value: "Left Lyon 19 April 1251; Genoa 18 May; Milan 1 July; Perugia 5 November 1251; Rome first week of October 1253 (body)", sources: [wp-innocent-iv]}
    note: "No return event is entered; the body's dates are in the note. Frederick II died in December 1250."
  - key: alexander-iv-birth
    question: In which year was Alexander IV born?
    about: [{person: alexander-iv}]
    field: born
    claims:
      - {value: "c. 1185", sources: [wp-alexander-iv]}
      - {value: "1199", sources: [wp-alexander-iv]}
    note: "The lead gives 'c. 1185 or 1199'; the record uses 1185, estimated. He was made cardinal in 1227, which suits the earlier date better."
