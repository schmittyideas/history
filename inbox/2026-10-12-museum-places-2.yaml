# Founding years where the museum record (from an earlier batch) and its own
# Wikipedia article disagree. Discrepancies can't be about a museum, so each is
# about the museum's new place. The museum records are left as they are.
# Expected preview warnings: the "museum record" claims for the Uffizi, Belvedere,
# Städel, Hamburger Kunsthalle and Dulwich have no source, because the article the
# museum record cites does not give that year. They are kept so the question stays open.
discrepancies:
  - key: uffizi-founding-year
    question: In what year was the Uffizi Gallery founded as a museum?
    about: [{place: uffizi}]
    claims:
      - {value: "1560", note: "Museum record. The year Vasari began the building, not a museum date"}
      - {value: "1581", sources: [wp-uffizi], note: "Infobox 'established'; the year the building was completed"}
      - {value: "1769", sources: [wp-uffizi], note: "Text: officially opened to the public (formally a museum from 1865)"}
    note: The place uses 1560 as the building's year; the museum record's founding year needs settling.

  - key: albertina-founding-year
    question: In what year was the Albertina founded?
    about: [{place: albertina}]
    claims:
      - {value: "1776", sources: [wp-albertina], note: "Museum record; the article's text says Count Durazzo gave the duke nearly 1,000 works in 1776"}
      - {value: "1805", sources: [wp-albertina], note: "Infobox 'established', marked citation needed"}

  - key: belvedere-vienna-founding-year
    question: When was the Belvedere in Vienna begun?
    about: [{place: belvedere-vienna}]
    claims:
      - {value: "1714", note: "Museum record; the article does not give this year"}
      - {value: "1712", sources: [wp-belvedere-vienna], note: "Construction of the Lower Belvedere had begun by 1712; Upper Belvedere completed 1723"}
    note: The place uses 1712 (estimated).

  - key: stadel-founding-year
    question: In what year was the Städel founded?
    about: [{place: stadel}]
    claims:
      - {value: "1816", note: "Museum record. The year Johann Friedrich Städel died, leaving the bequest"}
      - {value: "1817", sources: [wp-stadel], note: "Infobox and text: founded in 1817"}

  - key: hamburger-kunsthalle-founding-year
    question: In what year was the Hamburger Kunsthalle founded?
    about: [{place: hamburger-kunsthalle}]
    claims:
      - {value: "1868", note: "Museum record; the article does not give this year"}
      - {value: "1850", sources: [wp-hamburger-kunsthalle], note: "Text: founded in 1850 (collection established by the Kunstverein in 1849)"}
      - {value: "1869", sources: [wp-hamburger-kunsthalle], note: "Infobox 'established' (20 August 1869), the opening of the main building"}
    note: The place uses 1869, the main building's year.

  - key: dulwich-picture-gallery-founding-year
    question: In what year was Dulwich Picture Gallery founded?
    about: [{place: dulwich-picture-gallery}]
    claims:
      - {value: "1811", note: "Museum record. The year Sir Francis Bourgeois died, leaving the collection and his instructions for a gallery"}
      - {value: "1817", sources: [wp-dulwich-picture-gallery], note: "Infobox and text: opened 1817"}

  - key: russian-museum-founding-year
    question: In what year was the Russian Museum established?
    about: [{place: russian-museum}]
    claims:
      - {value: "1895", sources: [wp-russian-museum], note: "Infobox 'established' and the museum record; its first director's term is given as 1895-1917"}
      - {value: "1896", sources: [wp-russian-museum], note: "Text: 'established on April 13, 1896'"}
    note: Both from the same article. The grand opening was 17 March 1898.
