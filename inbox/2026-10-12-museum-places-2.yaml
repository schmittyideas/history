# Museums on the map, batch 2: give each museum a place, so an artwork's Work card
# and the Place card can show where it hangs.
#
# Every fact was checked against the museum's English Wikipedia article (infobox,
# coordinates and text, read 2026-10-12). Coordinates are the article's; all were
# within ~200 m of the museum record, so no museum lat/lng changes.
#
# A place's `founded` is the year this building opened as the museum. Where the
# building is much older and the article dates it, `founded` is the building's year
# and the note says what it is. The institution's own founding year goes in the note.
# `architect` is set only where the article's infobox names one.
#
# Skipped:
#   - royal-collection: not a building. The Royal Collection is spread over 13 royal
#     residences (Buckingham Palace, Windsor Castle, Hampton Court...), so no one place.

batch:
  title: "Museums on the map, batch 2"
  requested: "Ty: link museums to places"
  date: 2026-10-12

sources:
  # The National Museum of Sculpture article's own coordinates are rounded to two
  # decimals (41.66, -4.72, about 450 m off); the museum record matches the
  # Colegio de San Gregorio article, the building it is housed in, so that is cited.
  - key: wp-colegio-de-san-gregorio
    title: "Colegio de San Gregorio (Wikipedia)"
    url: https://en.wikipedia.org/wiki/Colegio_de_San_Gregorio

