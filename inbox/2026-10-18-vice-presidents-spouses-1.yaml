# Vice presidents' spouses, batch 1 of 2: the wives of the vice presidents who took office 1789-1873 (Burr to Wilson),
# and the Second Lady title for the wives already here whose husbands were vice president before president
# (Abigail Adams, Letitia Tyler, Abigail Fillmore, Eliza Johnson).
# Ty's choices (2026-10-18): every wife, type Notable (prominence from sitelinks), with the title "Second Lady of the
# United States" (realm United States) for the years she held it, mirroring the First Ladies.
# VERIFIED: spouses from Wikidata (P26), checked against English Wikipedia downloaded on 2026-10-18 with tools/wiki.py
# (revision IDs in the session scratchpad): her own article's lead for her dates, and her article or his for the
# wedding. Titles: the vice president's term dates (inbox/2026-10-18-vice-presidents.yaml), cut to the marriage and her
# life. Sitelinks read from Wikidata on 2026-10-18.
# Stated honestly:
#  - Wives with no Wikipedia article of their own cite their husband's article and record only what it says: Sarah
#    Cornelia Tappen (George Clinton; died 1800, Wikidata says 1804: a discrepancy), Sarah Jane Emery (Hannibal Hamlin's
#    first wife; married 1833, died 1855) and Harriet Malvina Howe (Henry Wilson; 1824-1870).
#  - Julia Chinn: Richard Mentor Johnson's common-law wife, an enslaved woman he could not legally marry (his and her
#    articles); the spouse link has no year. William R. King never married.
#  - Aaron Burr's wives: Theodosia Bartow Prevost (married 2 July 1782; died 18 May 1794, Wikidata 28 May) and Eliza
#    Jumel (married 1 July 1833; born 2 April 1775, Wikidata 7 April); neither was Second Lady.
#  - Sophia Dallas: born 24 June 1798 (Wikidata 25 June). Every Wikidata difference is a discrepancy; the records use
#    Wikipedia.
batch:
  title: "Vice presidents' spouses, batch 1"
  requested: "And then vice presidents and their wives"
  date: 2026-10-18

