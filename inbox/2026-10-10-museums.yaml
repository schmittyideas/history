# Notes for the reviewer
# - Art museums and galleries picked by hand from the collections our artworks name, with name, location and website from Wikidata (each cited to its English Wikipedia article). City is the nearest major city to the coordinates, because Wikidata often gives a neighbourhood.
# - data_access records what we may do with each museum's collection data. Checked 2026-10-10 by fetching each site's robots.txt and, for known open-data providers, by calling the live API or reading the GitHub licence. open-api / open-data-download: Met, Art Institute of Chicago, Cleveland, V&A, SMK, Rijksmuseum, National Gallery of Art, MoMA, Tate, Minneapolis, the Smithsonian museums, Harvard (needs a key). Everything else is `unknown`: robots.txt does not block it (or could not be read), but terms of use and any official API are not checked yet. One museum (Ateneum) forbids all crawling: `no-access`.
# - Nothing was scraped. Where a site returns 403 or 429 to bots (Art Institute, Met, Prado), use only its official API.

batch:
  title: Museums and galleries, with notes on how their collections can be read
  requested: A museums table (name, location, city, country, website) and a check of whether their sites can be read
  date: '2026-10-10'
