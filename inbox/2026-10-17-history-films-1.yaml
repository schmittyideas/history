# History films, batch 1: the twelve best-known films in Ty's entertainment database tagged History (by TMDB vote
# count), each as an artwork (kind: film) linked to its director (creator) and to the places and events it depicts
# (role: depicts). This is the locale database: no cast, plot or posters; everything else about a film stays in the
# entertainment database, linked with `external` (its id there, plus its TMDB id).
# Candidates came from the entertainment database (read-only: titles tagged History, their TMDB keywords and
# descriptions). Ty chose (2026-10-17): link the cities a film is set in as well as the specific places and events;
# add missing places and events; where Wikipedia doesn't confirm a link, keep it and cite TMDB.
# VERIFIED against English Wikipedia articles downloaded on 2026-10-17 with tools/wiki.py (revision IDs in the session
# scratchpad). Every depicts link below is stated in the film's article (lead, plot or historical-accuracy section),
# so none needed the TMDB fallback in this batch. Coordinates of new places are from Wikidata (P625), rounded.
# Stated honestly:
#  - Directors are added with life dates, sitelinks and one line only (coverage: not-read), as in the Los Angeles
#    batches. Prominence for them comes from sitelinks (read from Wikidata on 2026-10-17).
#  - Theodore Melfi: his Wikipedia article gives no birth date (Wikidata says 27 October 1970), so it is left out.
#  - 1917 is "inspired by" Operation Alberich: the film is set just after the withdrawal, on 6 April 1917; the link
#    note says so.
#  - Saving Private Ryan's Ramelle and Neuville-au-Plain, The King's Speech's 1925 British Empire Exhibition, and
#    Oppenheimer's Berkeley years, security hearing and the Hiroshima and Nagasaki bombings (shown only in passing)
#    are left for later.
#  - The Favourite, Apocalypto and the other thirteen top films go in batch 2.
batch:
  title: "History films, batch 1"
  requested: "Match the History films in the entertainment database to our places and events, as an intake file for review (cities too; add missing places and events)"
  date: 2026-10-17

