events:
  - key: norman-magnates-swear-fealty-to-william-1035
    name: Norman magnates swear fealty to William as Robert I's heir
    type: Oath
    year: 1035
    month: 1
    prominence: 3
    note: "Before leaving on pilgrimage to Jerusalem, Robert I convened a council in January 1035 and had the magnates swear fealty to William, his only son, as heir. The article does not say where the council met."
    people:
      - {person: robert-i-of-normandy, role: convened the council}
      - {person: william-i-of-england, role: named heir}
    sources: [wp-william-i]

  - key: william-succeeds-as-duke-of-normandy-1035
    name: William succeeds as Duke of Normandy
    type: Succession
    year: 1035
    month: 7
    prominence: 4
    note: "Robert I died at Nicaea in early July 1035 (2 July, says his own article) on his way back from Jerusalem. William, seven or eight and illegitimate, succeeded with the support of Archbishop Robert of Rouen and King Henry I of France. The article names no place for the succession."
    people:
      - {person: william-i-of-england, role: succeeded}
      - {person: robert-i-of-normandy, role: died}
      - {person: henry-i-of-france, role: supporter}
    sources: [wp-william-i, wp-robert-i-of-normandy]

  - key: attempt-to-seize-william-at-valognes-1046
    name: Rebels try to seize William at Valognes
    type: Rebellion
    year: 1046
    prominence: 2
    place: valognes
    places:
      - {place: poissy, role: refuge, note: "King Henry I's court, where William fled (Val-ès-Dunes article)"}
    note: "Late 1046, in the rebellion led by Guy of Burgundy. William escaped under cover of darkness to King Henry. The article warns the story may have legendary elements."
    people:
      - {person: william-i-of-england, role: escaped}
      - {person: henry-i-of-france, role: gave refuge}
    sources: [wp-william-i, wp-battle-of-val-es-dunes]

  - key: battle-of-val-es-dunes-1047
    place: val-es-dunes-battlefield
    prominence: 3
    note: "William and Henry I of France beat the rebel barons led by Guy of Burgundy on the plain near Caen: the turning point in William's control of Normandy. The date is disputed (see discrepancies), so only the year is kept."
    people:
      - {person: william-i-of-england, role: victor}
    sources: [wp-william-i, wp-battle-of-val-es-dunes]

  - key: truce-of-god-caen-1047
    name: William declares the Truce of God at Caen
    type: Council
    year: 1047
    month: 10
    prominence: 2
    place: caen
    note: "Shortly after Val-ès-Dunes. Private war was banned from Wednesday evening to Monday morning; William and the king were exempt."
    people:
      - {person: william-i-of-england, role: promulgated}
    sources: [wp-william-i, wp-battle-of-val-es-dunes]

  - key: siege-of-brionne-1047
    name: Siege of Brionne
    type: Siege
    year: 1047
    end_year: 1050
    prominence: 2
    place: brionne
    note: "Guy of Burgundy held out in his castle at Brionne after Val-ès-Dunes; after a long siege William exiled him in 1050."
    people:
      - {person: william-i-of-england, role: besieger}
    sources: [wp-william-i, wp-battle-of-val-es-dunes]

  - key: council-of-reims-forbids-william-marriage-1049
    name: Leo IX forbids William's marriage at the Council of Reims
    type: Council
    year: 1049
    month: 10
    prominence: 2
    place: reims
    note: "The marriage had been arranged in 1049; the pope banned it on grounds of consanguinity (the couple were third cousins once removed)."
    people:
      - {person: leo-ix, role: forbade the marriage}
      - {person: william-i-of-england, role: groom}
      - {person: matilda-of-flanders, role: bride}
    sources: [wp-william-i, wp-matilda-of-flanders]

  - key: marriage-of-william-and-matilda-1051
    name: Marriage of William and Matilda of Flanders
    type: Marriage
    year: 1051
    estimated: true
    prominence: 4
    place: chateau-d-eu
    note: "c. 1051-1052 at the castle of Eu (William of Jumièges); the William article says only 'the early 1050s'. Matilda, daughter of Count Baldwin V of Flanders, brought a powerful ally. They had four sons and five or six daughters, and founded the two abbeys in Caen."
    people:
      - {person: william-i-of-england, role: groom}
      - {person: matilda-of-flanders, role: bride}
    sources: [wp-matilda-of-flanders, wp-william-i]

  - key: edward-chooses-william-as-heir-1051
    name: Edward the Confessor appears to choose William as his heir
    type: Succession
    year: 1051
    prominence: 3
    note: "During the exile of Earl Godwin's family. The basis of William's claim to England; no English source mentions the embassy that is said to have carried the promise."
    people:
      - {person: edward-the-confessor, role: named his heir}
      - {person: william-i-of-england, role: heir}
    sources: [wp-william-i]

  - key: battle-of-mortemer-1054
    name: Battle of Mortemer
    type: Battle
    year: 1054
    month: 2
    prominence: 3
    place: mortemer
    note: "Henry I and the rebels invaded Normandy on two fronts. William faced the king himself; his second army, under Robert of Eu and others, routed Odo's wing at Mortemer. A turning point in William's hold on the duchy."
    people:
      - {person: william-i-of-england, role: victor (his army; he was facing the king elsewhere)}
      - {person: henry-i-of-france, role: defeated}
    sources: [wp-william-i, wp-battle-of-mortemer]

  - key: battle-of-varaville-1057
    name: Battle of Varaville
    type: Battle
    year: 1057
    month: 8
    prominence: 3
    place: varaville
    note: "William attacked the half of the French and Angevin army left behind when the tide cut the ford on the Dives estuary. The last invasion of Normandy in his lifetime."
    people:
      - {person: william-i-of-england, role: victor}
      - {person: henry-i-of-france, role: defeated}
    sources: [wp-william-i, wp-battle-of-varaville]

  - key: siege-of-thimert-1058
    name: Siege of Thimert
    type: Siege
    year: 1058
    end_year: 1060
    prominence: 2
    place: thimert
    note: "William invaded the County of Dreux and took Tillières-sur-Avre and Thimert; Henry I's siege of Thimert dragged on until the king's death in 1060."
    people:
      - {person: william-i-of-england, role: held the castle}
      - {person: henry-i-of-france, role: besieger}
    sources: [wp-william-i]

  - key: william-conquers-maine-1062
    name: William conquers the county of Maine
    type: Campaign
    year: 1062
    end_year: 1064
    prominence: 3
    place: le-mans
    note: "After Count Herbert II of Maine died in 1062, William claimed the county through his son Robert's betrothal to Herbert's sister, and had control by 1064. He appointed a Norman bishop of Le Mans in 1065."
    people:
      - {person: william-i-of-england, role: conqueror}
      - {person: robert-curthose, role: claimant by betrothal}
    sources: [wp-william-i]

  - key: william-breton-campaign-1064
    name: William's campaign in Brittany
    type: Campaign
    year: 1064
    prominence: 2
    note: "Obscure in its details; it destabilised Duke Conan II. Some sources say Harold Godwinson took part and swore to uphold William's claim to England, but no English source reports it. The article names no place."
    people:
      - {person: william-i-of-england, role: commander}
      - {person: harold-ii-of-england, role: said to have taken part}
    sources: [wp-william-i]

  - key: norman-invasion-fleet-assembles-1066
    name: William's invasion fleet assembles
    type: Campaign
    year: 1066
    month: 8
    prominence: 3
    place: dives-sur-mer
    note: "Ready by early August, then held in Normandy by adverse winds until late September. Where it was built is disputed: the mouth of the Dives (William of Poitiers) or Saint-Valery-sur-Somme (William of Jumièges). Matilda governed Normandy while William was away."
    people:
      - {person: william-i-of-england, role: commander}
      - {person: matilda-of-flanders, role: regent of Normandy}
    sources: [wp-william-i, wp-matilda-of-flanders]

  - key: norman-fleet-sails-1066
    name: The Norman fleet sails for England
    type: Campaign
    date: 1066-09-27
    prominence: 3
    place: saint-valery-sur-somme
    note: "Two days after Harold beat Harald Hardrada and Tostig at Stamford Bridge."
    people:
      - {person: william-i-of-england, role: commander}
    sources: [wp-william-i]

  - key: norman-landing-at-pevensey-1066
    name: The Normans land at Pevensey
    type: Invasion
    date: 1066-09-28
    prominence: 4
    place: pevensey-castle
    places:
      - {place: hastings-castle, role: base, note: "William moved to Hastings a few miles east and built a castle as his base"}
    note: "The army sheltered in the Roman fort for the night, then moved to Hastings, built a castle, ravaged the interior and waited for Harold."
    people:
      - {person: william-i-of-england, role: commander}
    sources: [wp-william-i, wp-pevensey-castle, wp-hastings-castle]

  - key: english-submit-at-wallingford-1066
    name: William crosses the Thames at Wallingford; Stigand submits
    type: Submission
    year: 1066
    month: 12
    prominence: 2
    place: wallingford
    note: "Early December 1066. After Hastings William secured Dover, Kent and Canterbury, reached Southwark in late November, and circled south and west of London, burning as he went."
    people:
      - {person: william-i-of-england, role: received the submission}
    sources: [wp-william-i]

  - key: english-submit-at-berkhamsted-1066
    name: The English leaders submit to William at Berkhamsted
    type: Submission
    year: 1066
    month: 12
    prominence: 3
    place: berkhamsted-castle
    note: "Edgar the Ætheling, Earls Morcar and Edwin and Archbishop Ealdred submitted. William then sent men into London to build a castle."
    people:
      - {person: william-i-of-england, role: received the submission}
    sources: [wp-william-i, wp-siege-of-exeter-1068]

  - key: siege-of-exeter-1068
    name: Siege of Exeter
    type: Siege
    year: 1068
    prominence: 3
    place: exeter
    places:
      - {place: rougemont-castle, role: castle, note: "William built a castle to hold the city"}
    note: "Early 1068. Exeter, where Harold's mother Gytha had taken refuge, refused fealty; it held out 18 days and surrendered on generous terms."
    people:
      - {person: william-i-of-england, role: besieger}
    sources: [wp-william-i, wp-siege-of-exeter-1068]

  - key: coronation-of-matilda-of-flanders-1068
    name: Coronation of Matilda of Flanders
    type: Coronation
    date: 1068-05-11
    prominence: 3
    place: westminster-abbey
    note: "At Pentecost, presided over by the archbishop of York; William was crowned again at the same time. The William article says only that she was crowned in May 1068."
    people:
      - {person: matilda-of-flanders, role: crowned}
      - {person: william-i-of-england, role: crowned again}
    sources: [wp-matilda-of-flanders, wp-william-i]

  - key: harrying-of-the-north-1069
    name: Crown-wearing at York and the Harrying of the North
    type: Campaign
    year: 1069
    month: 12
    end_year: 1070
    prominence: 4
    place: york
    note: "After Edgar the Ætheling and Sweyn of Denmark took York, William wore his crown in its ruins on Christmas Day 1069, bought off the Danes and laid waste to the north as far as the Tees, then crossed the Pennines to beat the last rebels at Shrewsbury. Over by April 1070. Domesday suggests up to 75% of the population died or never returned."
    people:
      - {person: william-i-of-england, role: commander}
    sources: [wp-william-i, wp-harrying-of-the-north]

  - key: papal-legates-crown-william-at-winchester-1070
    name: Papal legates crown William at Winchester
    type: Coronation
    year: 1070
    prominence: 2
    place: winchester-cathedral
    note: "At the Easter court of 1070 (in the Old Minster, on the site of today's cathedral). David Bates calls it the papacy's seal of approval on the conquest; councils then deposed Stigand and other English prelates."
    people:
      - {person: william-i-of-england, role: crowned}
    sources: [wp-william-i]

  - key: siege-of-ely-1071
    name: Siege of Ely
    type: Siege
    year: 1071
    prominence: 3
    place: ely
    note: "William built a causeway to reach the Isle of Ely, where Hereward the Wake and Earl Morcar were hiding. Hereward escaped; Morcar was captured. The last rebellion of the north."
    people:
      - {person: william-i-of-england, role: victor}
    sources: [wp-william-i]

  - key: treaty-of-abernethy-1072
    name: Treaty of Abernethy
    type: Treaty
    year: 1072
    prominence: 3
    place: abernethy
    note: "William invaded Scotland; Malcolm III swore allegiance, probably gave his son Duncan as a hostage, and expelled Edgar the Ætheling."
    people:
      - {person: william-i-of-england, role: signatory}
      - {person: malcolm-iii-of-scotland, role: signatory}
    sources: [wp-william-i, wp-treaty-of-abernethy]

  - key: william-retakes-le-mans-1073
    name: William retakes Le Mans
    type: Campaign
    year: 1073
    month: 3
    prominence: 2
    place: le-mans
    note: "A swift campaign against Fulk le Rechin of Anjou, complete by 30 March 1073."
    people:
      - {person: william-i-of-england, role: victor}
    sources: [wp-william-i]

  - key: siege-of-dol-1076
    name: Siege of Dol
    type: Siege
    year: 1076
    month: 9
    prominence: 3
    place: dol-de-bretagne
    note: "William besieged the rebel Ralph de Gael in Dol; Philip I of France relieved it. William's first defeat in battle."
    people:
      - {person: william-i-of-england, role: defeated}
      - {person: philip-i-of-france, role: victor}
    sources: [wp-william-i, wp-siege-of-dol]

  - key: siege-of-gerberoy-1079
    name: Siege of Gerberoy
    type: Siege
    year: 1079
    month: 1
    prominence: 3
    place: gerberoy
    note: "William besieged his rebel son Robert, who was given the castle by Philip I. After three weeks the garrison sallied out; Robert unhorsed his father, who was saved by the Englishman Toki son of Wigod. The siege was lifted."
    people:
      - {person: william-i-of-england, role: defeated}
      - {person: robert-curthose, role: victor}
    sources: [wp-william-i]

  - key: council-of-lillebonne-1080
    name: Council of Lillebonne
    type: Council
    year: 1080
    prominence: 2
    place: lillebonne
    note: "Confirmed William's ultimate authority over the Norman church."
    people:
      - {person: william-i-of-england, role: presided}
    sources: [wp-william-i]

  - key: william-in-wales-1081
    name: William goes to St Davids
    type: Campaign
    year: 1081
    prominence: 2
    place: st-davids-cathedral
    note: "A military campaign, says the Anglo-Saxon Chronicle; a pilgrimage to St Davids, say Welsh sources (see discrepancies)."
    people:
      - {person: william-i-of-england, role: visitor}
    sources: [wp-william-i]

  - key: salisbury-oath-1086
    name: The Salisbury Oath
    type: Oath
    date: 1086-08-01
    prominence: 3
    place: old-sarum
    note: "William received the Domesday survey, ordered at Christmas 1085, and the chief magnates renewed their oaths of allegiance."
    people:
      - {person: william-i-of-england, role: received the oath}
    sources: [wp-william-i]

  - key: sack-of-mantes-1087
    name: William seizes Mantes and is fatally hurt
    type: Campaign
    year: 1087
    month: 7
    prominence: 3
    place: mantes-la-jolie
    note: "On campaign against the French Vexin, William fell ill or was injured by the pommel of his saddle while seizing Mantes. He was carried to the priory of Saint-Gervais at Rouen and died there on 9 September."
    people:
      - {person: william-i-of-england, role: commander}
    sources: [wp-william-i]

