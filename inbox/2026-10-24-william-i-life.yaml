batch:
  title: "William I: parents, battles, marriage and the path of his life"
  requested: "Expand William I: his significant events, when and who he married, his battles, when and where he became Duke of Normandy, so his path can be followed on a map"
  date: 2026-10-24

# Built from the English Wikipedia articles on William the Conqueror (revision 1380609130), Robert I of
# Normandy (1365575215), Herleva (1362211466), Matilda of Flanders (1379839811) and the battle and siege
# articles cited below. Coordinates from Wikidata (P625).
#
# Where William became duke: the article gives no place. Robert I had the Norman magnates swear fealty to
# William as his heir at a council in January 1035 (no place named), then died at Nicaea on his way back
# from Jerusalem in early July 1035, when William succeeded at seven or eight. Both events are in, without
# a place. Fécamp, often named for the council, is not in any of these articles, so it is left out.
#
# Left out: the 1051 visit to England (the article calls it unlikely), the capture of Alençon and Domfront
# (no year), the 1067 visits to Rouen and Fécamp, the Revolt of the Earls and the siege of Sainte-Suzanne
# (William was not there), Odo's arrest (no place), and the Tower of London's White Tower (no year).
# Herleva's husband Herluin and her sons Odo and Robert of Mortain are not in the database; not added here.
# `month` is set where the source gives a month but no day, so the journey map can order a year's stops.

sources:
  - {key: wp-william-i, title: "William the Conqueror (Wikipedia)", url: "https://en.wikipedia.org/wiki/William_the_Conqueror"}
  - {key: wp-robert-i-of-normandy, title: "Robert I of Normandy (Wikipedia)", url: "https://en.wikipedia.org/wiki/Robert_I_of_Normandy"}
  - {key: wp-herleva, title: "Herleva (Wikipedia)", url: "https://en.wikipedia.org/wiki/Herleva"}
  - {key: wp-matilda-of-flanders, title: "Matilda of Flanders (Wikipedia)", url: "https://en.wikipedia.org/wiki/Matilda_of_Flanders"}
  - {key: wp-battle-of-val-es-dunes, title: "Battle of Val-ès-Dunes (Wikipedia)", url: "https://en.wikipedia.org/wiki/Battle_of_Val-%C3%A8s-Dunes"}
  - {key: wp-battle-of-mortemer, title: "Battle of Mortemer (Wikipedia)", url: "https://en.wikipedia.org/wiki/Battle_of_Mortemer"}
  - {key: wp-battle-of-varaville, title: "Battle of Varaville (Wikipedia)", url: "https://en.wikipedia.org/wiki/Battle_of_Varaville"}
  - {key: wp-siege-of-exeter-1068, title: "Siege of Exeter (1068) (Wikipedia)", url: "https://en.wikipedia.org/wiki/Siege_of_Exeter_(1068)"}
  - {key: wp-harrying-of-the-north, title: "Harrying of the North (Wikipedia)", url: "https://en.wikipedia.org/wiki/Harrying_of_the_North"}
  - {key: wp-treaty-of-abernethy, title: "Treaty of Abernethy (Wikipedia)", url: "https://en.wikipedia.org/wiki/Treaty_of_Abernethy"}
  - {key: wp-siege-of-dol, title: "Siege of Dol (Wikipedia)", url: "https://en.wikipedia.org/wiki/Siege_of_Dol"}
  - {key: wp-hastings-castle, title: "Hastings Castle (Wikipedia)", url: "https://en.wikipedia.org/wiki/Hastings_Castle"}
  - {key: wp-pevensey-castle, title: "Pevensey Castle (Wikipedia)", url: "https://en.wikipedia.org/wiki/Pevensey_Castle"}

people:
  - key: william-i-of-england
    born_estimated: true
    coverage: partly
    coverage_note: "Article read: parents, marriage, battles, sieges, campaigns, the 1066 invasion route, castles he built, and the councils and crown-wearings with a place. Not captured: his daughters' marriages, Odo's arrest, the Revolt of the Earls, Domesday Book as an event."
    sources: [wp-william-i]

  - key: robert-i-of-normandy
    name: Robert I of Normandy
    type: Nobility
    born: 1000-06-22
    died: 1035-07-02
    house: Normandy
    realm: Normandy
    prominence: 3
    sitelinks: 45
    sitelinks_on: 2026-10-24
    coverage: partly
    coverage_note: "Life dates, reign, death at Nicaea and his son William. Not captured: his revolt against Richard III, the Flanders and Brittany campaigns, the failed invasion of England."
    note: "Duke of Normandy 1027-1035, called the Magnificent and the Devil. He made his illegitimate son William his heir before going on pilgrimage to Jerusalem, and died at Nicaea on the way back."
    sources: [wp-robert-i-of-normandy]

  - key: herleva
    name: Herleva
    type: Notable
    born: 1005
    born_estimated: true
    died: 1050
    died_estimated: true
    prominence: 2
    sitelinks: 22
    sitelinks_on: 2026-10-24
    coverage: partly
    coverage_note: "Life dates, her son William and her burial at Grestain (death year approximate). Not captured: her marriage to Herluin de Conteville (1031) and her sons Odo of Bayeux and Robert of Mortain, who are not in the database yet."
    note: "Mother of William the Conqueror by Robert I of Normandy, whom she never married; probably from Falaise, the daughter of Fulbert, perhaps a tanner or embalmer."
    sources: [wp-herleva]

