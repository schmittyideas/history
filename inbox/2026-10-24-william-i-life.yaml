discrepancies:
  - key: william-i-birth-year
    question: Was William the Conqueror born in 1027 or 1028?
    about: [{person: william-i-of-england}]
    field: born
    claims:
      - {value: "1028 (most likely towards the end of the year)", sources: [wp-william-i]}
      - {value: "1026/1027, per Orderic Vitalis", sources: [wp-herleva]}
    note: The record uses 1028, marked approximate.

  - key: val-es-dunes-date
    question: When in 1047 was the Battle of Val-ès-Dunes fought?
    about: [{event: battle-of-val-es-dunes-1047}]
    field: date
    claims:
      - {value: "Early 1047", sources: [wp-william-i, wp-battle-of-val-es-dunes], note: "David Douglas, from the flooded Orne"}
      - {value: "10 August 1047 (traditional)", sources: [wp-battle-of-val-es-dunes], note: "No decisive evidence"}
      - {value: "Summer 1047", sources: [wp-battle-of-val-es-dunes], note: "David Bates: the tide explains the drownings"}
    note: The record keeps the year alone.

  - key: norman-fleet-built-where-1066
    question: Where was William's invasion fleet built in 1066?
    about: [{event: norman-invasion-fleet-assembles-1066}]
    field: place
    claims:
      - {value: "At the mouth of the River Dives (William of Poitiers)", sources: [wp-william-i]}
      - {value: "At Saint-Valery-sur-Somme (William of Jumièges)", sources: [wp-william-i]}
    note: Both agree it sailed from Saint-Valery. The assembly event uses Dives-sur-Mer; the sailing event uses Saint-Valery.

  - key: william-matilda-papal-sanction
    question: When did the pope sanction William's marriage to Matilda?
    about: [{event: marriage-of-william-and-matilda-1051}]
    field: date
    claims:
      - {value: "1059, after Lanfranc won a dispensation from Nicholas II", sources: [wp-matilda-of-flanders]}
      - {value: "Probably earlier in the 1050s; the 1059 date comes from a late source not generally thought reliable", sources: [wp-william-i]}
    note: No event is recorded for the sanction.

  - key: william-wales-1081-purpose
    question: Was William's 1081 visit to Wales a military campaign or a pilgrimage to St Davids?
    about: [{event: william-in-wales-1081}]
    claims:
      - {value: "A military campaign (Anglo-Saxon Chronicle; David Bates thinks this more likely)", sources: [wp-william-i]}
      - {value: "A pilgrimage to St Davids in honour of Saint David (Welsh sources)", sources: [wp-william-i]}
