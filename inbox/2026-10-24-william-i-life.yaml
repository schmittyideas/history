  - {key: saint-valery-sur-somme, name: Saint-Valery-sur-Somme, kind: harbour, region: Hauts-de-France, country: France, lat: 50.1883, lng: 1.6294, note: "Where the invasion fleet sailed from in September 1066.", sources: [wp-william-i]}
  - {key: pevensey-castle, name: Pevensey Castle, historical_name: Anderitum, kind: castle, city: Pevensey, region: East Sussex, country: England, lat: 50.8192, lng: 0.3331, visitable: true, visit_site: "Pevensey Castle (English Heritage)", founded: 1066, built_by: "A Roman Saxon Shore fort, reoccupied by William the Conqueror in 1066; Norman castle built by Robert, Count of Mortain", note: "The Normans landed in Pevensey Bay on 28 September 1066 and sheltered in the old Roman fort.", sources: [wp-pevensey-castle, wp-william-i]}
