batch:
  title: "The world in 1400: rulers of the main states"
  requested: "One ruler for each major state on the Year-view map at 1400 (snapshot-year batch of the build-out), with a few dated events of 1385-1415"
  date: 2026-10-11

# Notes for the reviewer
# - Source: local copies of the English Wikipedia articles (wp6 directory; wp2 for Sigismund and Wenceslaus IV); nothing was fetched. Line 1-3 of every file was checked; all 29 plan lines had the right article, none is a disambiguation page. Headings that differ from the plan title: Vytautas is "Vytautas the Great" (key vytautas-the-great), Mircea_I_of_Wallachia is "Mircea the Elder" (key mircea-the-elder), Stephen_Ostoja is "Ostoja of Bosnia" (key ostoja-of-bosnia), Dawit_I_of_Ethiopia is "Dawit I" (key dawit-i-of-ethiopia), Nasir-ud-Din_Mahmud_Shah_Tughluq is "Mahmud Shah II" (key mahmud-shah-ii-of-delhi), Muhammad VII is wp6/Muhammad_VII_of_Granada.txt, Bunei of Chuzan is wp6/Bunei.txt (key bunei-of-chuzan), Ramracha is wp6/Ramaracha.txt whose heading is "Ramrachathirat" (key ramrachathirat), Margaret_I_of_Denmark and Stefan_Lazarevic keep their plan titles (keys margaret-i-of-denmark, stefan-lazarevic), Wladyslaw II Jagiello is key wladyslaw-ii-jagiello (the article calls him Jogaila first). Long articles (Margaret, Vytautas, Wladyslaw, Stefan Lazarevic, Dawit, Charles III) were read selectively: lead, rise, reign, death; Stefan Lazarevic's Hungarian alliance, Zeta and civil-war sections were not worked through, nor was Wladyslaw's later reign after 1411.
# - New realms (7): Principality of Wallachia, Principality of Moldavia, Bosnia, Hafsid Sultanate, Aztec Empire, Ryukyu Kingdom, Ayutthaya Kingdom (all from the plan lines). Realms only referenced, defined in sibling batches: Aragon and Navarre (inbox/2026-10-11-world-1100.yaml), and Grand Duchy of Lithuania, Grand Duchy of Moscow, Serbia, Empire of Trebizond, Emirate of Granada, Marinid Sultanate, Golden Horde, Mamluk Sultanate and Ethiopian Empire (the 1300 draft, in review), so the 1100 and 1300 batches must be applied first. The 1300 draft also defines the place szekesfehervar, which this batch does not use.
# - Title wording differs from the plan in several places, because the plan wording is not the rank the article gives (the rule from earlier batches). Mircea: the article calls him Voivode of Wallachia, so 'Voivode of Wallachia' (plan: Prince). Alexander the Good: Voivode of Moldavia (plan: Prince). Hafsid ruler: his article calls him a Hafsid Caliph of Ifriqiya, so 'Hafsid Caliph' (plan: Hafsid Sultan). Huitzilihuitl: the article calls him Tlatoani or king of Tenochtitlan (and Moctezuma I 'fifth Huey Tlatoani'), so 'Tlatoani of Tenochtitlan' (plan: Huey Tlatoani); realm Aztec Empire as in the plan, although the article says the Mexica were still tributaries of Azcapotzalco. Margaret: three rows with the wording 'Queen of Denmark / Norway / Sweden' (the plan said King of ...), the English convention for a woman ruling in her own right; her article's lead and titles section call her queen regnant, and say that in Denmark she was 'sovereign lady and lord and guardian' and 'Regent of Norway and Denmark' in 1388, and that she stopped using the double-gendered title in 1392/1396 while continuing as regent; the three rows start on 24 February 1389, the day the article gives for 'Queen of Denmark, Norway and Sweden' (see discrepancy). Vasily I: 'Grand Prince of Moscow', the plan wording and the article's 'Grand Prince of Vladimir and Moscow from 1389'; Daniel of Moscow in the 1300 draft is 'Prince of Moscow' because his article says he never became grand prince, so the realm now has two wordings, each following its article. Stefan Lazarevic: 'Prince of Serbia' 1389-1402 and 'Despot of Serbia' 1402-1427 (the plan said Ruler of Serbia; the 1300 draft's 'King of Serbia' does not fit him). Ostoja: 'King of Bosnia' as the article says. Jogaila: 'King of Poland' (plan) plus 'Grand Duke of Lithuania' 1377-1381 and 1382-1401 and 'Supreme Duke of Lithuania' 1401-1434 (the article's own wording); Vytautas: 'Regent of Lithuania' 1392-1401 (the article: regent for his cousin Jogaila) and 'Grand Duke of Lithuania' 1401-1430, so the Year view shows him at 1400.
# - Title rows NOT entered (extra titles or no stated start): Martin of Aragon as Count of Barcelona (from 1396), King of Valencia, Sardinia and Corsica, and King of Sicily from 1409; Charles III as Count of Evreux; Gian Galeazzo's earlier lordships (Verona, Vicenza, Padua, Pavia); Mircea's lands (Dobruja and others); Wenceslaus IV as King of the Romans (already in the database). Ladislaus of Naples's claim to Hungary and Croatia is in the person's note only (his coronation at Zara on 5 August 1403 is in the note, no title row: the article says his rule never went beyond Dalmatia). Shadi Beg: 'late 1399 or early 1400' in the body against 1399 in the lead; the row uses the lead's year. Sigismund: the article states the start (crowned at Szekesfehervar on 31 March 1387) but never says when the Hungarian crown ended, so the row ends at his death on 9 December 1437 (an inference from the article: it records him as king until his death, and gives no loss of the throne). The end of Wenceslaus IV's Bohemian row is the lead's 'until his death in 1419' with the day from the same lead (16 August 1419); the start is 1378 (the article: 'on Charles' death in 1378 he inherited the Crown of Bohemia'; he had already been crowned on 15 June 1363 as a two-year-old, which is in the note). Faraj's row is one row 1399-1412 though the article says his brother Abd al-Aziz held the throne briefly from September to November 1405 (in the note). Abu Faris: no day or birth year in the article, so no born/died; his row 1394-1434 is the lead's 'reigned 1394-1434'.
# - Dates given as year because the article gives no day or only a month: Margaret's birth (March 1353), Ostoja's death (September 1418), Mahmud Shah II's death (February 1413), Mircea's and Alexander's births ('c.' in the article), Martin of Aragon's accession (1396), Gian Galeazzo's dukedom (1395), Ladislaus's accession (1386), Mahmud Shah II's accession (the article gives the day his predecessor died, 8 March 1394, not the accession itself), Ramrachathirat's reign (1395, and 1409).
# - Moment years are integers only (checked). Several people have no born/died place because the article gives none. Coordinates are general knowledge (2-3 decimals); Soborg Castle, Bistrita Monastery, Kreva, Cozia and Resava are approximate points.
# - Discrepancies recorded below (10): the date of the battle of Rovine (Mircea's article 10 October 1394 against Stefan Lazarevic's 17 May 1395); when Margaret began to rule Denmark; Jogaila's birth (c. 1352 or c. 1362); Martin of Aragon's birthplace (Girona or Perpignan); George VII's reign (1393-1407 or 1395-1405); how George VII died; when Dawit I's reign began; when Dawit I's reign ended; Huitzilihuitl's reign (three codices); the fate of Ramrachathirat. Seen and not entered (a range inside one article, a calendar point, or not about a record here): the date of Sa'ad ad-Din of Ifat's death (Dawit's article: 1402/03, 1408/09 or 1415; a death of someone who is not a record here); the place of the battle of Asle (Aasle or Falan, Margaret's article, 24 February 1389); Martin's cause of death (plague, uremic coma or poison); Bayezid's 1394 campaign numbers; Bunei's fate (the article says only that he likely died at the hands of the rebels or fled); Jogaila's election day (2 February 1386), baptism (15 February) and coronation (4 March 1386; the row starts on the coronation day); whether Vytautas became Grand Duke in 1392 (the Treaty of Ostrow / Astrava) or 1401 (his own article: regent 1392-1401, formal grand duke 1401); Harihara II's end (the lead says he died on 31 August 1404).
# - Events: 6 new events (Union of Krewo 1385, Kalmar Union 1397, Vorskla 1399, Grunwald 1410, Ceuta 1415, Rovine) and 3 link-only updates to existing events (battle-of-aljubarrota-1385 gets John I of Portugal, battle-of-nicopolis-1396 gets Mircea the Elder and Stefan Lazarevic, battle-of-ankara-1402 gets Stefan Lazarevic). Left out for size: the Union of Vilnius and Radom (1401, year only), Ladislaus's coronation at Zara (5 August 1403), the Aragon-Granada treaty of 4 May 1405, the sack of Delhi (Timur, 1398, year only), the Treaty of Salynas (12 October 1398) and the Union of Horodlo (2 October 1413). Kosovo 1389 is not linked: none of these articles puts a person here on the field (Stefan Lazarevic's article says his father died there). The brief named the Union of Krewo as 14 August 1385 (Kreva Castle), which is the Wladyslaw article's date. The existing event battle-of-aljubarrota-1385 has John I of Castile only; the Portuguese king is added as victor.
# - Existing records reused, not redefined: places roskilde-cathedral, flensburg, lisbon, coimbra, naples, venice, barcelona, delhi, hampi, pamplona, belgrade; people timur, bayezid-i, sigismund-holy-roman-emperor, wenceslaus-iv-of-bohemia; events as above. The sources wp-sigismund-holy-roman-emperor and wp-wenceslaus-iv-of-bohemia are repeated with the same key and URL as in 2026-10-08-holy-roman-empire.yaml (a plain upsert). Obsidian: no links. Images: none.

