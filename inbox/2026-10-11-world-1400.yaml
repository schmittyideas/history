realms:
  - {name: Principality of Wallachia, region: Eastern Europe,              country: Romania, note: "Mircea the Elder's article calls him Voivode of Wallachia from 1386; the state reached its largest extent under him"}
  - {name: Principality of Moldavia,  region: Eastern Europe,              country: Moldova, note: "Alexander the Good was its Voivode 1400-1432 (his article)"}
  - {name: Bosnia,                    region: Eastern Europe,              country: Bosnia and Herzegovina, note: "Kingdom of the Kotromanic dynasty; Ostoja was king 1398-1404 and 1409-1418 (his article)"}
  - {name: Hafsid Sultanate,          region: Middle East and North Africa, country: Tunisia, note: "Hafsid state of Ifriqiya; Abu Faris Abd al-Aziz II reigned 1394-1434 and completed its reunification (his article calls the ruler a Hafsid Caliph of Ifriqiya)"}
  - {name: Aztec Empire,              region: Americas,                    country: Mexico, note: "Huitzilihuitl's article calls him the second Tlatoani of Tenochtitlan; the Mexica were then tributaries of Azcapotzalco, so the empire proper is later"}
  - {name: Ryukyu Kingdom,            region: East Asia,                   country: Japan, note: "Bunei was king of Chuzan, one of the three Okinawan polities, 1398-1406 (his article)"}
  - {name: Ayutthaya Kingdom,         region: Southeast Asia,              country: Thailand, note: "Ramrachathirat reigned from 1395 until the coup of Inracha in 1409 (his article)"}

people:
  - key: emperor-go-komatsu
    name: Emperor Go-Komatsu
    type: Royalty
    realm: Japan
    born: 1377-08-01
    died: 1433-12-01
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "100th emperor of Japan, first son of Go-En'yu, the sixth and last Emperor of the Northern Court. Northern pretender from 24 May 1382 to 21 October 1392; when the Southern emperor Go-Kameyama handed over the regalia in 1392 he is counted as legitimate. Agreed with the shogunate to alternate the throne between the two courts, but abdicated on 5 October 1412 for his own son, Emperor Shoko. Father of Emperor Shoko; Ikkyu Sojun is listed among his sons in the article. Tomb at Fukakusa no kita no misasagi, Fushimi-ku, Kyoto."
    sources: [wp-emperor-go-komatsu]
  - key: wladyslaw-ii-jagiello
    name: Wladyslaw II Jagiello (Jogaila)
    type: Royalty
    realm: Poland
    house: Jagiellon
    died: 1434-06-01
    prominence: 4
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Jogaila, Grand Duke of Lithuania from 1377 (1377-1381, 1382-1401), then Supreme Duke; elected King of Poland on 2 February 1386, baptised Wladyslaw at Wawel on 15 February, married the young queen Jadwiga and was crowned on 4 March 1386. Concluded the Union of Krewo on 14 August 1385; co-ruled with Jadwiga until her death in 1399; won the battle of Grunwald with Vytautas on 15 July 1410; confirmed the Union of Horodlo on 2 October 1413. Birth year uncertain (c. 1352 or c. 1362; see discrepancy). Died at Grodek in 1434; the article gives no burial place."
    sources: [wp-wladyslaw-ii-jagiello]
  - key: vytautas-the-great
    name: Vytautas the Great
    type: Royalty
    realm: Grand Duchy of Lithuania
    house: Gediminid
    born: 1350
    born_estimated: true
    died: 1430-10-27
    prominence: 4
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Son of Kestutis, cousin of Jogaila. Imprisoned at Kreva in 1382 after his father's death, allied with and broke from the Teutonic Order several times, was regent for Jogaila 1392-1401 and then Grand Duke until his death (Union of Vilnius and Radom, 1401). Stretched Lithuania from the Baltic to the Black Sea, was crushed on the Vorskla in 1399, and commanded the Lithuanian forces at Grunwald in 1410. Married his daughter Sophia to Vasily I of Moscow in 1391. Planned a royal crown in 1429-1430, stopped at the Polish border. Died at Trakai Island Castle, buried in Vilnius Cathedral (the remains are lost)."
    sources: [wp-vytautas-the-great]
  - key: vasily-i-of-moscow
    name: Vasily I of Moscow
    type: Royalty
    realm: Grand Duchy of Moscow
    house: Rurikid
    born: 1371-12-30
    died: 1425-02-27
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Vasily I Dmitriyevich, eldest son of Dmitry Donskoy; Grand Prince of Vladimir and Moscow from 1389. Hostage at Tokhtamysh's court 1383-1386; took Nizhny Novgorod-Suzdal in 1393 and Murom; allied with Lithuania in 1392 and married Sophia, only daughter of Vytautas (war with Vytautas 1406-1408). Timur's raid of 1395 left the Golden Horde in anarchy and Moscow stopped paying tribute; Edigu burnt towns in 1408 but not Moscow; Vasily submitted to the Horde again in 1412. Married his daughter Anna to John VIII Palaiologos. Father of Vasily II."
    sources: [wp-vasily-i-of-moscow]
  - key: margaret-i-of-denmark
    name: Margaret I of Denmark
    type: Royalty
    realm: Denmark
    house: Estridsen
    born: 1353
    died: 1412-10-28
    prominence: 4
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Margrete Valdemarsdatter, born in March 1353 (the month is given, no day), youngest daughter of Valdemar IV. Married Haakon VI of Norway in 1363 (queen consort of Norway 1363-1380). Her article calls her queen regnant of Denmark, Norway and Sweden from the late 1380s; she ruled Denmark and Norway as regent for her son Olaf (died 1387), was chosen Regent of Norway and Denmark in 1388, won Sweden at the battle of Asle / Falan on 24 February 1389 and founded the Kalmar Union, with her great-nephew Erik of Pomerania crowned king of all three on 17 June 1397. Retook Gotland and most of Schleswig. Died on board ship in Flensburg harbour on the night of 28 October 1412; sarcophagus (1423) behind the high altar of Roskilde Cathedral."
    sources: [wp-margaret-i-of-denmark]
  - key: john-i-of-portugal
    name: John I of Portugal
    type: Royalty
    realm: Portugal
    house: Aviz
    born: 1357-04-11
    died: 1433-08-14
    prominence: 4
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "John of Aviz, natural son of Peter I, Master of the Order of Aviz from 1364. Declared king by the Cortes at Coimbra on 6 April 1385 after the 1383-1385 interregnum and defeated John I of Castile at Aljubarrota on 14 August 1385 with his constable Nuno Alvares Pereira. Married Philippa of Lancaster on 2 February 1387 at Porto, sealing the Anglo-Portuguese Alliance. Took Ceuta in 1415 (start of Portugal's overseas expansion); father of Edward, Peter and Henry the Navigator. Reigned 48 years."
    sources: [wp-john-i-of-portugal]
  - key: martin-of-aragon
    name: Martin of Aragon
    type: Royalty
    realm: Aragon
    house: Barcelona
    born: 1356-07-29
    died: 1410-05-31
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Martin the Humane, second son of Peter IV. King of Aragon, Valencia, Sardinia and Corsica and Count of Barcelona from 1396 (he succeeded his brother John I); King of Sicily as Martin II from 1409. Regent of Sicily from 1380, led an expedition there in 1392. Supported the Avignon pope Benedict XIII (rescued him in 1403). His son Martin the Younger won at Sanluri in 1409 and died soon after. Died on 31 May 1410 in the monastery of Valldonzella outside Barcelona with no heir; the interregnum ended with the Compromise of Caspe on 28 June 1412, which chose Ferdinand of Castile."
    sources: [wp-martin-of-aragon]
  - key: charles-iii-of-navarre
    name: Charles III of Navarre
    type: Royalty
    realm: Navarre
    house: Evreux
    born: 1361-07-22
    died: 1425-09-08
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Charles the Noble, born at Mantes, King of Navarre from 1 January 1387 and Count of Evreux 1387-1404 (exchanged for the Duchy of Nemours). Married Eleanor of Castile on 27 May 1375; crowned alone in 1390 after a seven-year estrangement; succeeded by his third daughter Blanche I. Mended relations with France, built a web of marriage alliances across Iberia, finished the Gothic cathedral of Pamplona and the royal palaces at Olite and Tafalla, and united the three boroughs of Pamplona in 1423. Died suddenly on 8 September 1425; buried in Pamplona Cathedral beside Eleanor."
    sources: [wp-charles-iii-of-navarre]
  - key: ladislaus-of-naples
    name: Ladislaus of Naples
    type: Royalty
    realm: Naples
    house: Anjou
    born: 1377-02-15
    died: 1414-08-06
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Ladislao, born at Naples, son of Charles III of Naples; king at nine in 1386 under his mother's regency, recognised by Boniface IX in 1389. Won back Naples in 1399 from Louis II of Anjou, was crowned King of Hungary and Croatia at Zara on 5 August 1403 (an unsuccessful claim that never went beyond Dalmatia; he sold Dalmatia to Venice in 1409), and conquered much of the Papal States (Rome in 1408, 1413). Beaten in Tuscany in 1409; won against Louis II (1411-1412). The last male of the Angevin House. Died at Naples on 6 August 1414, buried in San Giovanni a Carbonara; succeeded by his sister Joanna II."
    sources: [wp-ladislaus-of-naples]
  - key: michele-steno
    name: Michele Steno
    type: Nobility
    realm: Venice
    house: Steno
    born: 1331
    died: 1413-12-26
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "63rd Doge of Venice from 1 December 1400, elected as a compromise after deadlocked votes. Born in Venice to a family of some wealth; as a young man he and others were nearly executed for scrawling inscriptions on Marino Faliero's throne. His reign saw the war on Padua (from 1400) and the growth of the Domini di Terraferma; Venice sided with Alexander V in 1408. Died on 26 December 1413 and was buried in the Basilica of Santi Giovanni e Paolo; succeeded by Tommaso Mocenigo. Johannes Ciconia's motet 'Venecia, mundi splendor' is dedicated to him."
    sources: [wp-michele-steno]
  - key: gian-galeazzo-visconti
    name: Gian Galeazzo Visconti
    type: Nobility
    realm: Milan
    house: Visconti
    born: 1351-10-16
    died: 1402-09-03
    prominence: 4
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "First Duke of Milan: seized Milan in 1385 from his uncle Bernabo, took Verona, Vicenza and Padua, controlled almost the whole Po Valley, and bought the ducal title from Wenceslaus, King of the Romans, in 1395 for 100,000 florins. Founding patron of the Certosa di Pavia and builder of the Visconti castle at Pavia; furthered the Duomo of Milan. Quarrelled with France over Genoa and his daughter Valentina; suspected of warning the Turks before Nicopolis (1396). Won at Casalecchio on 26-27 June 1402; fell ill at Melegnano (10 August) and died on 3 September 1402, after which his realm broke up among his children."
    sources: [wp-gian-galeazzo-visconti]
  - key: stefan-lazarevic
    name: Stefan Lazarevic
    type: Royalty
    realm: Serbia
    house: Lazarevic
    born: 1377
    born_estimated: true
    died: 1427-07-19
    prominence: 4
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Stefan the Tall, son of Prince Lazar (killed at Kosovo, 15 June 1389), born at Krusevac; ruled with his mother Milica until he came of age in 1393 and was an Ottoman vassal, fighting for Bayezid I at Rovine, Nicopolis (his heavy cavalry broke Sigismund's line) and Ankara (he commanded the right wing). John VII Palaiologos made him Despot in August 1402; he beat Djuradj Brankovic at Tripolje and allied with Sigismund (1403-04), receiving Belgrade. Founder member of the Order of the Dragon; issued the Code of Mines (1412); writer of 'A Homage to Love'. Died on 19 July 1427 near Mt Kosmaj, buried at Resava; canonised in 1927."
    sources: [wp-stefan-lazarevic]
  - key: mircea-the-elder
    name: Mircea the Elder
    type: Royalty
    realm: Principality of Wallachia
    house: Basarab
    born: 1355
    born_estimated: true
    died: 1418-01-31
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Mircea cel Batran, Voivode of Wallachia from 1386, son of Radu I and brother of Dan I; Wallachia reached its largest extent under him (Dobruja 1388, the Banate of Severin 1388/9). Allied with Wladyslaw II Jagiello (1389) and Sigismund; fought Bayezid I at Rovine (the article dates it 10 October 1394), took part in the crusade of Nicopolis (1396), helped place Musa on the Ottoman throne after Ankara, and regained Dobruja in 1404. Built the Cozia Monastery c. 1390. Ancestor of Vlad II Dracul and Vlad the Impaler. Paid the Ottomans 3,000 gold pieces a year near the end of his reign."
    sources: [wp-mircea-the-elder]
  - key: alexander-the-good
    name: Alexander the Good
    type: Royalty
    realm: Principality of Moldavia
    house: Musat
    born: 1375
    born_estimated: true
    died: 1432-01-01
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Alexandru cel Bun, Voivode of Moldavia 1400-1432, son of Roman I, backed to the throne by Sigismund of Hungary. Created the Council of the Voivode and the Chancellery, gave trade privileges to Lviv (1408) and Krakow (1409), swore vassalage to Jogaila in 1402 (renewed 1404, 1407, 1411, 1415), fought the Teutonic Order at Grunwald (1410) and Marienburg (1422), and held Cetatea Alba against the first Ottoman incursion in 1420. Built the Bistrita Monastery, where he is buried. Died on 1 January 1432; the Treaty of Suceava (18 November 1431) ended his late war with Poland."
    sources: [wp-alexander-the-good]
  - key: ostoja-of-bosnia
    name: Ostoja of Bosnia
    type: Royalty
    realm: Bosnia
    house: Kotromanic
    died: 1418
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Stephen Ostoja, most likely a son of Vladislaus and brother of Tvrtko I. Crowned king on 10 May 1398 by the forces of Hrvoje Vukcic, who deposed Queen Jelena Gruba; backed Ladislaus of Naples in 1403 and fought Dubrovnik; replaced in 1404 by his brother Tvrtko II for his pro-Hungarian views, fled to Hungary, and was restored by Sigismund in 1409, after which he accepted Hungarian suzerainty (visited Buda in 1412). Divorced Kujava in 1417 and married Hrvoje's widow Jelena Nelipcic. Died in September 1418 (month only); his son Stephen Ostojic was elected king."
    sources: [wp-ostoja-of-bosnia]
  - key: manuel-iii-of-trebizond
    name: Manuel III of Trebizond
    type: Royalty
    realm: Empire of Trebizond
    house: Komnenos
    born: 1364-12-16
    died: 1417-03-05
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Manuel III Megas Komnenos, heir from 1377, emperor of Trebizond from 20 March 1390. Avoided joining Timur's war but sent twenty galleys; Timur's victory over Bayezid at Ankara (1402) lifted the Ottoman threat for decades. Received the envoy Clavijo in April 1404; signed a golden bull for Venice in 1396; quarrelled with Genoa. Gave the Soumela Monastery a staurotheke in the year of his accession. Late in his reign his son Alexios IV revolted; Manuel died in March 1417 and Alexios succeeded him (rumoured to have hastened his death)."
    sources: [wp-manuel-iii-of-trebizond]
  - key: george-vii-of-georgia
    name: George VII of Georgia
    type: Royalty
    realm: Georgia
    house: Bagrationi
    died: 1407
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Born in the 1360s, eldest son of Bagrat V, co-king from 1369 and sole king from his father's death in 1393 (alternatively from 1395 to 1405; see discrepancy). Ambushed Timur's force with his brother Constantine and freed Bagrat after the fall of Tbilisi (22 November 1386). Reannexed western Georgia in 1392 and 1401; fought Timur's seven more expeditions between 1387 and 1403, lost the battle on the Sagim River in 1400, and made peace in late 1401. After Timur's death in 1405 he retook Nakhchivan and Ganja. Died childless in 1407; his brother Constantine I succeeded him."
    sources: [wp-george-vii-of-georgia]
  - key: dawit-i-of-ethiopia
    name: Dawit I of Ethiopia
    type: Royalty
    realm: Ethiopian Empire
    house: Solomonic
    died: 1413-10-06
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Throne name Qwestantinos, a younger son of Newaya Krestos, who took the throne from his brother Newaya Maryam, probably with the help of his sister Dil Sefa. Emperor from 1382 (see discrepancy), reign of 33 years; raided Upper Egypt c. 1380 to protect the Copts and was persuaded back by the Patriarch of Alexandria; sent gifts to the Mamluk sultan Barquq; fought Ifat in the east; sent an embassy to Venice that arrived by 23 June 1402 asking for artisans; brought a fragment of the True Cross; allowed the Ewostathian Sabbath in 1404. Killed by a kick from his horse on 6 October 1413 (the date other historians put at 1411-1412)."
    sources: [wp-dawit-i-of-ethiopia]
  - key: an-nasir-faraj
    name: Al-Nasir Faraj
    type: Royalty
    realm: Mamluk Sultanate
    house: Burji
    born: 1386
    died: 1412-05-23
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Faraj ibn Barquq, Circassian Burji sultan of the Mamluk Sultanate from 1399, at thirteen, on his father Barquq's sudden death. His reign saw Timur's sack of Aleppo and Damascus in 1400, rebellions, plague and famine that reduced the population to a third. Briefly replaced by his brother Abd al-Aziz in September-November 1405. Defeated by the emirs at Baalbek in his seventh and last conflict with them, he surrendered in Damascus and was stabbed to death in his prison cell on 23 May 1412; buried in the Bab al-Faradis cemetery. The emirs installed the caliph al-Musta'in as a stopgap."
    sources: [wp-an-nasir-faraj]
  - key: shadi-beg
    name: Shadi Beg
    type: Royalty
    realm: Golden Horde
    house: Jochid
    died: 1409
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Khan of the Golden Horde from 1399 (the body: late 1399 or early 1400), son of Qutlu Beg and first cousin of Timur Qutluq; made khan by the beglerbeg Edigu, who really ruled. Edigu killed the former khan Tokhtamysh on the Tobol in 1406. Shadi Beg plotted against Edigu, was discovered in late 1407 and fled to Astrakhan and then to Shirvan, where the Shirwanshah Ibrahim recognised him as khan and struck coins in his name until 1409. Edigu's agents murdered him at Shamakhi in 1409."
    sources: [wp-shadi-beg]
  - key: mahmud-shah-ii-of-delhi
    name: Nasir-ud-Din Mahmud Shah II
    type: Royalty
    realm: Delhi Sultanate
    house: Tughlaq
    died: 1413
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Last Tughlaq sultan of Delhi, son of Nasir ud din Muhammad Shah III; succeeded his brother Ala ud-din Sikandar Shah (died 8 March 1394). A war of succession with Nusrat Shah (who ruled from Firozabad) lasted from 1394 to 1397. Timur invaded in 1398, won a decisive battle near Delhi and massacred the city; the sultanate shrank as Gujarat, Bengal, Jaunpur and others became independent. Died in February 1413 (month only); Khizr Khan, first of the Sayyid dynasty, followed."
    sources: [wp-mahmud-shah-ii-of-delhi]
  - key: harihara-ii
    name: Harihara II
    type: Royalty
    realm: Vijayanagara Empire
    house: Sangama
    died: 1404-08-31
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Emperor of Vijayanagara of the Sangama dynasty, son of Bukka Raya I, whom he succeeded in 1377. Fought the Reddis of Kondavidu, took Addanki, Srisailam and most of the land south of the Krishna, and after Mujahid Bahmani's death in 1378 extended to the northwest, taking ports such as Goa, Chaul and Dabhol. Gave Mysore to Yaduraya. Patron of the Kannada poet Madhura and of the Vedic works; a tank for Gomatteshvara and the Kumthu-Jinanatha temple were built under his general Iruguppa. Died on 31 August 1404; succeeded by his son Virupaksha Raya."
    sources: [wp-harihara-ii]
  - key: muhammad-vii-of-granada
    name: Muhammad VII of Granada
    type: Royalty
    realm: Emirate of Granada
    house: Nasrid
    born: 1377
    born_estimated: true
    died: 1408-05-13
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Twelfth Nasrid ruler, son of Yusuf II, whom he succeeded on 3 October 1392 (16 Dhu al-Qidah 794 AH). Defeated the crusade of the Order of Alcantara (entered Granada on 26 April 1394). Signed a treaty of friendship with Martin I of Aragon on 4 May 1405, kept Charles III of Navarre as a quiet ally, and a truce with Castile in Madrid on 6 October 1406. After Henry III's death on 25 December 1406 he fought the regent Ferdinand (Zahara fell on 30 September 1407). Died on 13 May 1408; his older brother Yusuf III succeeded him."
    sources: [wp-muhammad-vii-of-granada]
  - key: abu-faris-abd-al-aziz-ii
    name: Abu Faris Abd al-Aziz II
    type: Royalty
    realm: Hafsid Sultanate
    house: Hafsid
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Hafsid Caliph of Ifriqiya, who reigned from 1394 to 1434, son of Abu al-Abbas Ahmad II. Strong, orthodox monarch who abolished uncanonical taxes and raised revenue by privateering against Christian shipping. Campaigned in Libya from 1404 (Nafusa Mountains, Derj, Ghadames, Matmata, Nefzaoua by 1410), took Algiers in 1413, fought Portuguese fleets from 1415, and in 1431 attacked Tlemcen. Completed the reunification of Ifriqiya, absorbing Bejaia, Constantine, Tripoli, Gafsa, Tozeur and Biskra. The article gives no birth or death date."
    sources: [wp-abu-faris-abd-al-aziz-ii]
  - key: abu-said-uthman-iii
    name: Abu Said Uthman III
    type: Royalty
    realm: Marinid Sultanate
    house: Marinid
    born: 1383
    died: 1420-10-21
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Marinid sultan from 19 March 1398, at sixteen, succeeding his brother Abu Amir Abdallah; the last effective Marinid. The garrison of Gibraltar declared for him in 1410, but Granada retook it in 1411. After the Portuguese seized Ceuta in 1415 he failed to retake it in 1419. A coup in Fez in 1420 killed him (he left a one-year-old son); his vizier Abu Zakariya Yahya al-Wattasi took power and founded the Wattasid dynasty."
    sources: [wp-abu-said-uthman-iii]
  - key: huitzilihuitl
    name: Huitzilihuitl
    type: Royalty
    realm: Aztec Empire
    died: 1417
    died_estimated: true
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Hummingbird Feather, second tlatoani of Tenochtitlan, born in the 1370s (the article gives no year) and elected at 16 after his father Acamapichtli's death. The codices disagree on his reign (see discrepancy). Founded the Tlatocan council with four electors; married Ayauhcihuatl, daughter of Tezozomoc of Azcapotzalco, and so cut the tribute to a symbol; their son Chimalpopoca succeeded him, and his son by Miahuaxihuitl was Moctezuma I. Joined Tezozomoc's war on Texcoco from c. 1416. Died probably in 1417."
    sources: [wp-huitzilihuitl]
  - key: bunei-of-chuzan
    name: Bunei of Chuzan
    type: Royalty
    realm: Ryukyu Kingdom
    house: Satto
    born: 1356
    died: 1406
    died_estimated: true
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "King of Chuzan 1398-1406, second and last ruler of the Satto dynasty, who succeeded his father Satto. Built a headquarters for Chinese envoys and a trade centre at Naha; the royal annals (Rekidai Hoan) were first compiled in 1403; sent an embassy to Siam in 1409 (after his reign) and kept ties with Java and Sumatra. China, in upheaval after Zhu Di took Nanking, took eleven years to invest him, finally in 1406. Overthrown by Sho Hashi's rebellion within a year of that; his fate is not recorded (death c. 1406)."
    sources: [wp-bunei]
  - key: ramrachathirat
    name: Ramrachathirat
    type: Royalty
    realm: Ayutthaya Kingdom
    house: Uthong
    born: 1356
    born_estimated: true
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Ram or Ramracha, king of Ayutthaya, son of Ramesuan, who succeeded his father in 1395 (1395/96 by the Luang Prasoet chronicle) and was deposed in 1409 (1409/10) by Inracha, ruler of Suphan Buri, of the Suphannaphum line. Sent his first envoy to China in 1397/98 and imposed a criminal law on Sukhothai (Inscription 38), which broke away in 1400. Possibly born in 1356/57 on the Dutch account that he was 21 at his accession. His fate is disputed (see discrepancy); no date or place of death."
    sources: [wp-ramrachathirat]

titles:
  - {person: emperor-go-komatsu, title: Emperor of Japan, realm: Japan, from: 1392-10-21, to: 1412-10-05, note: "Counted as the legitimate emperor from 21 October 1392, when Go-Kameyama conveyed the regalia; Northern pretender from 24 May 1382 (his own court's reckoning). Abdicated 5 October 1412 for his son Shoko", sources: [wp-emperor-go-komatsu]}
  - {person: wladyslaw-ii-jagiello, title: King of Poland, realm: Poland, from: 1386-03-04, to: 1434-06-01, note: "Elected 2 February 1386 at Lublin, baptised 15 February and married Jadwiga three days later, crowned 4 March 1386 by Archbishop Bodzanta of Gniezno; co-ruler with Jadwiga until 1399, then sole king; died 1434", sources: [wp-wladyslaw-ii-jagiello]}
  - {person: wladyslaw-ii-jagiello, title: Grand Duke of Lithuania, realm: Grand Duchy of Lithuania, from: 1377, to: 1381, note: "Succeeded Algirdas in 1377; overthrown by Kestutis in 1381", sources: [wp-wladyslaw-ii-jagiello]}
  - {person: wladyslaw-ii-jagiello, title: Grand Duke of Lithuania, realm: Grand Duchy of Lithuania, from: 1382, to: 1401, note: "Back in 1382 after the civil war with Kestutis; in 1401 Vytautas became Grand Duke and Jogaila Supreme Duke", sources: [wp-wladyslaw-ii-jagiello]}
  - {person: wladyslaw-ii-jagiello, title: Supreme Duke of Lithuania, realm: Grand Duchy of Lithuania, from: 1401, to: 1434-06-01, note: "Overlord of Lithuania under the Union of Vilnius and Radom; the article's own wording ('Supreme Duke')", sources: [wp-wladyslaw-ii-jagiello]}
  - {person: vytautas-the-great, title: Regent of Lithuania, realm: Grand Duchy of Lithuania, from: 1392, to: 1401, note: "The article: 'regent for his cousin Jogaila (1392-1401)'; he de facto held all the grand duke's power", sources: [wp-vytautas-the-great]}
  - {person: vytautas-the-great, title: Grand Duke of Lithuania, realm: Grand Duchy of Lithuania, from: 1401, to: 1430-10-27, note: "Recognised as formal grand duke for life by the Union of Vilnius and Radom (1401), under Jogaila as Supreme Duke; died at Trakai", sources: [wp-vytautas-the-great]}
  - {person: vasily-i-of-moscow, title: Grand Prince of Moscow, realm: Grand Duchy of Moscow, from: 1389, to: 1425-02-27, note: "The article: Grand Prince of Vladimir and Moscow from 1389, heir of Dmitry Donskoy (reigned 1359-1389)", sources: [wp-vasily-i-of-moscow]}
  - {person: margaret-i-of-denmark, title: Queen of Denmark, realm: Denmark, from: 1389-02-24, to: 1412-10-28, note: "The article: 'From 24 February 1389 to 28 October 1412, she was Queen of Denmark, Norway and Sweden'; a queen regnant, though in Denmark she was 'sovereign lady and lord and guardian' and Regent of Norway and Denmark in 1388, and she ruled for her son Olaf from 1375 (see discrepancy)", sources: [wp-margaret-i-of-denmark]}
  - {person: margaret-i-of-denmark, title: Queen of Norway, realm: Norway, from: 1389-02-24, to: 1412-10-28, note: "Ruled Norway for Olaf from 1380 and as regent after 1387; her great-nephew Erik of Pomerania was proclaimed king of Norway in 1389 (elected 1392) and she continued as regent beside him", sources: [wp-margaret-i-of-denmark]}
  - {person: margaret-i-of-denmark, title: Queen of Sweden, realm: Sweden, from: 1389-02-24, to: 1412-10-28, note: "Elected 'Sovereign Lady and Ruler' by the Swedish nobles in March 1388 and won the kingdom at Asle / Falan on 24 February 1389; Erik of Pomerania was crowned king of all three realms at Kalmar on 17 June 1397", sources: [wp-margaret-i-of-denmark]}
  - {person: john-i-of-portugal, title: King of Portugal, realm: Portugal, from: 1385-04-06, to: 1433-08-14, note: "Declared king by the Cortes at Coimbra on 6 April 1385; reign of 48 years", sources: [wp-john-i-of-portugal]}
  - {person: martin-of-aragon, title: King of Aragon, realm: Aragon, from: 1396, to: 1410-05-31, note: "Succeeded his brother John I in 1396 (the article gives the year only; his wife acted for him until he arrived in 1397); no heir, interregnum until the Compromise of Caspe, 28 June 1412", sources: [wp-martin-of-aragon]}
  - {person: charles-iii-of-navarre, title: King of Navarre, realm: Navarre, from: 1387-01-01, to: 1425-09-08, note: "Succeeded his father Charles II on 1 January 1387; crowned alone in 1390", sources: [wp-charles-iii-of-navarre]}
  - {person: ladislaus-of-naples, title: King of Naples, realm: Naples, from: 1386, to: 1414-08-06, note: "King at nine in 1386 under his mother's regency; recognised by Boniface IX in 1389; regained the city of Naples in 1399", sources: [wp-ladislaus-of-naples]}
  - {person: michele-steno, title: Doge of Venice, realm: Venice, from: 1400-12-01, to: 1413-12-26, sources: [wp-michele-steno]}
  - {person: gian-galeazzo-visconti, title: Duke of Milan, realm: Milan, from: 1395, to: 1402-09-03, note: "Title bought from Wenceslaus, King of the Romans, in 1395 for 100,000 florins (year only in the article); lord of Milan since 1385", sources: [wp-gian-galeazzo-visconti]}
  - {person: stefan-lazarevic, title: Prince of Serbia, realm: Serbia, from: 1389, to: 1402, note: "Prince after his father Lazar fell at Kosovo (15 June 1389); his mother Milica ruled for him until he came of age in 1393; an Ottoman vassal. The plan said 'Ruler of Serbia'; the article says prince (1389-1402) and despot (1402-1427)", sources: [wp-stefan-lazarevic]}
  - {person: stefan-lazarevic, title: Despot of Serbia, realm: Serbia, from: 1402, to: 1427-07-19, note: "Byzantine title of despot awarded by John VII Palaiologos in August 1402 in Constantinople; died 19 July 1427", sources: [wp-stefan-lazarevic]}
  - {person: mircea-the-elder, title: Voivode of Wallachia, realm: Principality of Wallachia, from: 1386, to: 1418-01-31, note: "Took the throne in 1386 after the death of his step-brother Dan I; the article's wording is Voivode (the plan said Prince)", sources: [wp-mircea-the-elder]}
  - {person: alexander-the-good, title: Voivode of Moldavia, realm: Principality of Moldavia, from: 1400, to: 1432-01-01, note: "Succeeded Iuga; the article's wording is Voivode (the plan said Prince)", sources: [wp-alexander-the-good]}
  - {person: ostoja-of-bosnia, title: King of Bosnia, realm: Bosnia, from: 1398-05-10, to: 1404, note: "Crowned on 10 May 1398 by the forces of Hrvoje Vukcic; replaced in 1404 by his brother Tvrtko II", sources: [wp-ostoja-of-bosnia]}
  - {person: ostoja-of-bosnia, title: King of Bosnia, realm: Bosnia, from: 1409, to: 1418, note: "Restored in 1409 after Sigismund beat the Bosnian nobility in 1408; died in September 1418 (month only)", sources: [wp-ostoja-of-bosnia]}
  - {person: manuel-iii-of-trebizond, title: Emperor of Trebizond, realm: Empire of Trebizond, from: 1390-03-20, to: 1417-03-05, sources: [wp-manuel-iii-of-trebizond]}
  - {person: george-vii-of-georgia, title: King of Georgia, realm: Georgia, from: 1393, to: 1407, note: "From his father Bagrat V's death in 1393 to his death in 1407; the article adds 'alternatively, from 1395 to 1405' (see discrepancy)", sources: [wp-george-vii-of-georgia]}
  - {person: dawit-i-of-ethiopia, title: Emperor of Ethiopia, realm: Ethiopian Empire, from: 1382, to: 1413-10-06, note: "The lead: emperor from 1382 until his death on 6 October 1413; the body: took the throne around 1379/80 and most historians end the reign in 1411-1412 (see discrepancies)", sources: [wp-dawit-i-of-ethiopia]}
  - {person: an-nasir-faraj, title: Mamluk Sultan, realm: Mamluk Sultanate, from: 1399, to: 1412-05-23, note: "Sultan from his father Barquq's death in 1399, aged 13; briefly replaced by his brother Abd al-Aziz from September to November 1405; stabbed to death on 23 May 1412", sources: [wp-an-nasir-faraj]}
  - {person: shadi-beg, title: Khan of the Golden Horde, realm: Golden Horde, from: 1399, to: 1407, note: "Made khan by Edigu after the death of Timur Qutluq (late 1399 or early 1400 in the body); fled in late 1407 after his plot against Edigu failed", sources: [wp-shadi-beg]}
  - {person: mahmud-shah-ii-of-delhi, title: Sultan of Delhi, realm: Delhi Sultanate, from: 1394, to: 1413, note: "Succeeded his brother Ala ud-din Sikandar Shah, who died on 8 March 1394 (the article gives no accession day); died in February 1413 (month only)", sources: [wp-mahmud-shah-ii-of-delhi]}
  - {person: harihara-ii, title: Vijayanagara Emperor, realm: Vijayanagara Empire, from: 1377, to: 1404-08-31, note: "Succeeded Bukka Raya I in 1377", sources: [wp-harihara-ii]}
  - {person: muhammad-vii-of-granada, title: Emir of Granada, realm: Emirate of Granada, from: 1392-10-03, to: 1408-05-13, note: "Twelfth Nasrid ruler; the article calls him 'sultan' in places and the Emirate of Granada once", sources: [wp-muhammad-vii-of-granada]}
