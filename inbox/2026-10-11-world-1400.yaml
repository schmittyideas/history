discrepancies:
  - key: rovine-battle-date
    question: When was the battle of Rovine fought?
    about: [{event: battle-of-rovine-1395}, {person: mircea-the-elder}, {person: stefan-lazarevic}]
    field: date
    claims:
      - {value: "10 October 1394", sources: [wp-mircea-the-elder], note: "Mircea's article: the armies 'finally clashed' on 10 October 1394 after Bayezid crossed the Danube in 1394"}
      - {value: "17 May 1395", sources: [wp-stefan-lazarevic], note: "Stefan Lazarevic's article: Bayezid gathered forces in autumn 1394 and 'the Battle of Rovine took place on 17 May 1395', near present-day Pitesti"}
    note: "The event record uses 17 May 1395, the more detailed date, until a source settles it."
  - key: margaret-start-of-rule
    question: When, and in what capacity, did Margaret I begin to rule Denmark?
    about: [{person: margaret-i-of-denmark}]
    field: from
    claims:
      - {value: "1375", sources: [wp-margaret-i-of-denmark], note: "After her father's death in 1375 she had her infant son Olaf elected king and ruled in his name; she 'only styled herself Queen of Denmark in 1375'"}
      - {value: "1388", sources: [wp-margaret-i-of-denmark], note: "Chosen Regent of Norway and Denmark in 1388, after Olaf's death in 1387"}
      - {value: "24 February 1389", sources: [wp-margaret-i-of-denmark], note: "'From 24 February 1389 to 28 October 1412, she was Queen of Denmark, Norway and Sweden', the date of the decisive battle against Albert"}
    note: "The title rows use 24 February 1389, the one date the article gives for the three crowns together."
  - key: jogaila-birth
    question: When was Jogaila born?
    about: [{person: wladyslaw-ii-jagiello}]
    field: born
    claims:
      - {value: "c. 1352", sources: [wp-wladyslaw-ii-jagiello], note: "What historians previously assumed"}
      - {value: "c. 1362", sources: [wp-wladyslaw-ii-jagiello], note: "Recent research, supported by his mother acting as regent in his early reign"}
    note: "No birth year is recorded; the lead gives 'c. 1352/1362'."
  - key: martin-of-aragon-birthplace
    question: Where was Martin of Aragon born?
    about: [{person: martin-of-aragon}]
    field: place
    claims:
      - {value: Girona, sources: [wp-martin-of-aragon]}
      - {value: Perpignan, sources: [wp-martin-of-aragon], note: "Both then in the Principality of Catalonia; the article says 'in either Girona or Perpignan'"}
    note: "No born place is recorded."
  - key: george-vii-reign
    question: When did George VII reign over Georgia?
    about: [{person: george-vii-of-georgia}]
    field: from
    claims:
      - {value: "1393 to 1407", sources: [wp-george-vii-of-georgia], note: "The lead's main statement; Bagrat V died in 1393"}
      - {value: "1395 to 1405", sources: [wp-george-vii-of-georgia], note: "The lead: 'alternatively, from 1395 to 1405'"}
    note: "The title row uses 1393-1407."
  - key: george-vii-death
    question: How did George VII die?
    about: [{person: george-vii-of-georgia}]
    field: died
    claims:
      - {value: "Killed in battle against Turkoman nomads", sources: [wp-george-vii-of-georgia], note: "Vakhushti of Kartli: apparently the Qara Qoyunlu"}
      - {value: "Natural causes", sources: [wp-george-vii-of-georgia], note: "Some historians consider Vakhushti's account doubtful"}
  - key: dawit-i-reign-start
    question: When did Dawit I take the throne?
    about: [{person: dawit-i-of-ethiopia}]
    field: from
    claims:
      - {value: "1382", sources: [wp-dawit-i-of-ethiopia], note: "The lead: emperor from 1382"}
      - {value: "c. 1379/80", sources: [wp-dawit-i-of-ethiopia], note: "The body, citing the History of the Patriarchs of the Egyptian Church; his brother Newaya Maryam held the throne from 1372"}
    note: "The title row uses the lead's 1382."
  - key: dawit-i-reign-end
    question: When did Dawit I's reign end?
    about: [{person: dawit-i-of-ethiopia}]
    field: died
    claims:
      - {value: "6 October 1413", sources: [wp-dawit-i-of-ethiopia], note: "Killed by a kick from his horse"}
      - {value: "1411-1412", sources: [wp-dawit-i-of-ethiopia], note: "'The overwhelming majority of historians' (Taddesse Tamrat, Hassen, Trimingham, Budge and others)"}
    note: "The record holds the lead's 6 October 1413."
  - key: huitzilihuitl-reign
    question: When did Huitzilihuitl reign as tlatoani of Tenochtitlan?
    about: [{person: huitzilihuitl}]
    field: from
    claims:
      - {value: "1390 to 1415", sources: [wp-huitzilihuitl], note: "Codex Chimalpahin"}
      - {value: "1396 to 1417", sources: [wp-huitzilihuitl], note: "Codex Aubin"}
      - {value: "1403 to 1417", sources: [wp-huitzilihuitl], note: "Codex Chimalpopoca"}
    note: "The title row uses the Codex Aubin's 1396-1417, marked estimated; two of the three codices end the reign in 1417 and the article says he died 'probably in 1417'."
  - key: ramrachathirat-fate
    question: What happened to Ramrachathirat after Inracha's coup?
    about: [{person: ramrachathirat}]
    field: died
    claims:
      - {value: "Banished to Patha Khu Cham", sources: [wp-ramrachathirat], note: "The Luang Prasoet chronicle and the Minor Wars Chronicle: Inracha did not want to kill a relative; Ram died there on an unknown date"}
      - {value: "Executed by Inracha", sources: [wp-ramrachathirat], note: "The Dutch document of 1640 (which also says Ram reigned only three years), the Magadhi Chronicle and the Buddhist Councils Chronicle"}
    note: "No death date or place is recorded."
