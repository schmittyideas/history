events:
  - key: union-of-krewo-1385
    name: Union of Krewo
    type: Treaty
    date: 1385-08-14
    place: kreva-castle
    people:
      - {person: wladyslaw-ii-jagiello, role: signatory}
      - {person: vytautas-the-great, role: participated}
    prominence: 4
    note: "At Kreva Castle Jogaila confirmed his promises: to adopt Christianity, to bring back lands taken from Poland and to join Lithuania and Russia to the Polish Crown (read by historians from a personal union to complete incorporation). It led to his marriage to Jadwiga and his coronation in 1386. Vytautas took part and was rebaptised a Catholic in 1386."
    sources: [wp-wladyslaw-ii-jagiello, wp-vytautas-the-great]
  - key: kalmar-union-1397
    name: Kalmar Union
    type: Treaty
    date: 1397-06-17
    place: kalmar
    people:
      - {person: margaret-i-of-denmark, role: founder}
    prominence: 4
    note: "Margaret summoned the three Councils of the Realm to Kalmar in June 1397, and on Trinity Sunday, 17 June, her great-nephew Erik of Pomerania was crowned king of Denmark, Norway and Sweden. The treaty of Kalmar, issued on 20 July (the article gives no year for the day), proposed 'everlasting union'; the Act of Union was never completed, but the union lasted in practice into the early 16th century (Denmark and Norway until 1814)."
    sources: [wp-margaret-i-of-denmark]
  - key: battle-of-the-vorskla-1399
    name: Battle of the Vorskla River
    type: Battle
    year: 1399
    people:
      - {person: vytautas-the-great, role: defeated}
    prominence: 3
    note: "Vytautas's crusade against the Mongols, backed by Pope Boniface IX, ended in a crushing defeat: over twenty princes, including two brothers of Jogaila, were killed and Vytautas barely escaped. Smolensk and other territories revolted; Vytautas's eastern ambitions ended. The article gives the year only and no place."
    sources: [wp-vytautas-the-great, wp-wladyslaw-ii-jagiello]
  - key: battle-of-grunwald-1410
    name: Battle of Grunwald
    type: Battle
    date: 1410-07-15
    place: grunwald-battlefield
    people:
      - {person: wladyslaw-ii-jagiello, role: victor}
      - {person: vytautas-the-great, role: victor}
      - {person: alexander-the-good, role: victor}
    prominence: 5
    note: "Władysław II's army of about 20,000 mounted nobles, 15,000 armed commoners and 2,000 professional cavalry, joined by Vytautas's 11,000 light cavalry, destroyed the Teutonic Order's army (about 18,000 cavalry and 5,000 infantry); the Grand Master Ulrich von Jungingen and the Grand Marshal Friedrich von Wallenrode were killed. The siege of Marienburg (25 July to 19 September) failed; the Peace of Thorn followed in 1411. Alexander the Good's article credits him with a victory over the Teutonic Order here."
    sources: [wp-wladyslaw-ii-jagiello, wp-vytautas-the-great, wp-alexander-the-good]
  - key: conquest-of-ceuta-1415
    name: Portuguese conquest of Ceuta
    type: Siege
    year: 1415
    place: ceuta
    people:
      - {person: john-i-of-portugal, role: victor}
      - {person: abu-said-uthman-iii, role: defeated}
    prominence: 4
    note: "John I seized Ceuta in 1415, the start of European overseas expansion; the Marinid sultan Abu Said Uthman III failed to retake it in 1419, when the garrison under Pedro de Menezes sallied against his camp. Pope Martin V's bull of 4 April 1418 confirmed to John the lands he might win from the Moors."
    sources: [wp-john-i-of-portugal, wp-abu-said-uthman-iii]
  - key: battle-of-rovine-1395
    name: Battle of Rovine
    type: Battle
    date: 1395-05-17
    people:
      - {person: mircea-the-elder, role: victor}
      - {person: stefan-lazarevic, role: fought for Bayezid}
      - {person: bayezid-i, role: defeated}
    prominence: 3
    note: "Bayezid I crossed the Danube with about 40,000 men against Mircea's 10,000, who fought a guerrilla war and then met him in forested, swampy ground near present-day Pitesti; Wallachia won, though Mircea had to retreat to Hungary and the Turks installed Vlad the Usurper. Stefan Lazarevic led the largest Serbian heavy cavalry squadron on the Ottoman side; the Serbian nobles Marko and Konstantin Dejanovic were killed. The date is disputed between the two articles (see discrepancy)."
    sources: [wp-mircea-the-elder, wp-stefan-lazarevic]
  - key: battle-of-aljubarrota-1385
    people:
      - {person: john-i-of-portugal, role: victor}
    sources: [wp-john-i-of-portugal]
  - key: battle-of-nicopolis-1396
    people:
      - {person: mircea-the-elder, role: crusader}
      - {person: stefan-lazarevic, role: fought for Bayezid (broke Sigismund's line)}
    sources: [wp-mircea-the-elder, wp-stefan-lazarevic]
  - key: battle-of-ankara-1402
    people:
      - {person: stefan-lazarevic, role: Ottoman vassal, commanded the right wing}
    sources: [wp-stefan-lazarevic]

