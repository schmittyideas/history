  - {person: bunei-of-chuzan, title: King of Chuzan, realm: Ryukyu Kingdom, from: 1398, to: 1406, note: "Inherited the throne on his father Satto's death; China invested him in 1406 and Sho Hashi's rebellion overthrew him within a year", sources: [wp-bunei]}
