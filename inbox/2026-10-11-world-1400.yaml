  - {person: sigismund-holy-roman-emperor, title: King of Hungary, realm: Hungary, from: 1387-03-31, to: 1437-12-09, note: "Crowned at Szekesfehervar on 31 March 1387 after marrying Mary, Queen of Hungary (jure uxoris); the article never states an end, so the row ends at his death (see header)", sources: [wp-sigismund-holy-roman-emperor]}
