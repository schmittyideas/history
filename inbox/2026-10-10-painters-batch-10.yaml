- key: martin-schongauer
  name: Martin Schongauer
  type: Artist
  roles:
  - engraver
  - painter
  born: 1450
  born_estimated: true
  died: '1491-02-02'
  prominence: 4
  note: Alsatian engraver and painter, the most important printmaker north of the Alps before Albrecht Durer; 116 engravings are attributed to him.
  image_url: https://upload.wikimedia.org/wikipedia/commons/e/e9/Hans_Burgkmair_d.%C3%84._-_Bildnis_Martin_Schongauer_%28Kopie%29.jpg
  image_thumb: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/Hans_Burgkmair_d.%C3%84._-_Bildnis_Martin_Schongauer_%28Kopie%29.jpg/500px-Hans_Burgkmair_d.%C3%84._-_Bildnis_Martin_Schongauer_%28Kopie%29.jpg
  image_page: https://commons.wikimedia.org/wiki/File:Hans_Burgkmair_d.%C3%84._-_Bildnis_Martin_Schongauer_(Kopie).jpg
  image_license: Public domain
  coverage: partly
  coverage_note: Dates, training, places and one dated painting captured; the 116 engravings and the Breisach Last Judgment not built out.
  sources:
  - wp-martin-schongauer
- key: lorenzo-costa
  name: Lorenzo Costa
  type: Artist
  roles:
  - painter
  born: 1460
  died: '1535-03-05'
  prominence: 3
  note: Italian painter of Ferrara and Bologna who became court painter at Mantua to the Gonzaga and Isabella d'Este.
  image_url: https://upload.wikimedia.org/wikipedia/commons/2/28/Lorenzo_Costa_002.jpg
  image_thumb: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/28/Lorenzo_Costa_002.jpg/500px-Lorenzo_Costa_002.jpg
  image_page: https://commons.wikimedia.org/wiki/File:Lorenzo_Costa_002.jpg
  image_license: Public domain
  coverage: partly
  coverage_note: Dates, places and the Bentivoglio Altarpiece captured; patrons (Gonzaga, Isabella d'Este) not linked as they are not yet in the database; other works not built out.
  sources:
  - wp-lorenzo-costa
- key: jan-gossaert
  name: Jan Gossaert
  type: Artist
  roles:
  - painter
  born: 1478
  born_estimated: true
  died: '1532-10-01'
  prominence: 4
  note: Painter from the Low Countries (also called Jan Mabuse), a leader of Romanism who brought Italian Renaissance elements north after his 1508-09 trip to Rome.
  image_url: https://upload.wikimedia.org/wikipedia/commons/e/e8/Jan_Gossart_-_Portrait_of_a_Man_%28Self-Portrait%29%2C_circa_1520-1525%2C_1951.6.jpg
  image_thumb: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e8/Jan_Gossart_-_Portrait_of_a_Man_%28Self-Portrait%29%2C_circa_1520-1525%2C_1951.6.jpg/500px-Jan_Gossart_-_Portrait_of_a_Man_%28Self-Portrait%29%2C_circa_1520-1525%2C_1951.6.jpg
  image_page: https://commons.wikimedia.org/wiki/File:Jan_Gossart_-_Portrait_of_a_Man_(Self-Portrait),_circa_1520-1525,_1951.6.jpg
  image_license: Public domain
  coverage: partly
  coverage_note: Dates, places and two signed works captured; Habsburg-circle patrons (Philip of Burgundy, Adolf of Burgundy, Christian II) and pupils not linked as they are not yet in the database; other
