batch:
  title: "WWII, batch 2a: the European war's commanders"
  requested: "Ty: go ahead with batch 2, the European war and its commanders"
  date: 2026-10-24

# Notes for the reviewer
# - Facts come from each person's English Wikipedia article, read through the Wikipedia API on 2026-10-24 (infobox and body).
#   Sitelinks are Wikipedia language editions only, from Wikidata on 2026-10-24. Place coordinates are from Wikidata.
# - Types: Military for the soldiers, sailors and airmen. Goring is Government (a Nazi leader who also held civil offices for
#   twelve years), with his Luftwaffe command as a military title. Marshall and Donitz are Military: known mainly for their service,
#   with their later or brief civil offices (Secretary of State and of Defense; President of Germany for 23 days) as plain titles.
# - Military titles (kind: military) are each commander's main WWII-era commands, with the realm of the forces they served. Where the
#   article gives only a month or a year, the title has the year alone. Commands with no end date in the article are left out
#   (Zhukov's Leningrad, Western and 1st Belorussian Fronts; Donitz as Commander of the U-boats; Guderian as Inspector General).
#   Konev's article does not say when the 2nd Ukrainian Front gave way to the 1st, so it is one title for both.
# - Portraits: the article lead image, linked only, where Commons marks it public domain or CC0 (Patton's is CC0). Left out, as
#   Commons gives them CC BY or CC BY-SA: Zhukov, Konev, Rokossovsky (CC BY 4.0), Manstein, Keitel, Jodl, Donitz (CC BY-SA 3.0 de,
#   Bundesarchiv).
# - Birth moments left out where the place has no coordinates on Wikipedia or Wikidata: Zhukov (Strelkovka), Konev (Lodeyno),
#   Keitel (Helmscherode), Dowding (Moffat). Rokossovsky's birthplace is disputed (see discrepancies), so it is left out too.
#   Montgomery was born in Kennington and Donitz in Grunau: both are filed at London and Berlin. Keitel, Jodl and Goring died in
#   Nuremberg's prison: filed at Nuremberg. Rommel's death and burial are filed at Herrlingen (now part of Blaustein). Burials are
#   left out where the cemetery has no record here and no coordinates (Montgomery at Binsted, Manstein at Dorfmark, Guderian at
#   Goslar, Harris at Goring). Keitel, Jodl and Goring have no grave: their ashes were scattered.
# - Existing places reused: london, berlin, moscow, nuremberg, dresden, baden-baden, new-york-city, washington-dc,
#   arlington-national-cemetery, kremlin-wall-necropolis, westminster-abbey.
# - Their roles in battles come in batch 2b (2026-10-24-wwii-europe-battles.yaml).

