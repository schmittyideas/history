discrepancies:
  - key: montgomery-death-place
    question: Did Montgomery die at Alton or at Isington Mill, Isington?
    about: [{person: bernard-montgomery}]
    field: place
    claims:
      - {value: "Alton, Hampshire", sources: [wp-bernard-montgomery], note: Infobox}
      - {value: "His home, Isington Mill, Isington, Hampshire", sources: [wp-bernard-montgomery], note: Body}
    note: Filed at Isington, the more precise place (a hamlet near Alton).
  - key: omar-bradley-birthplace
    question: Was Omar Bradley born in Clark or near Moberly, Missouri?
    about: [{person: omar-bradley}]
    field: place
    claims:
