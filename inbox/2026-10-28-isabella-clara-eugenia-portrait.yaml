# Isabella Clara Eugenia's betrothal to Archduke Rudolf, and her portrait by Alonso Sánchez Coello (Prado).
# Ty asked for this on 2026-10-28 from an Instagram reel (not readable by Claude; facts are from English Wikipedia
# and the Commons file page for the painting, read the same day).
# Stated honestly:
#  - Wikipedia says only that Isabella was promised to her cousin Rudolf (later Emperor Rudolf II) "at age two" and
#    waited over twenty years until he said he would marry no one. It gives no exact date, so no betrothal event is
#    created (events need a clear date); the facts go in her note. Rudolf II's own article says he never married.
#  - The painting's date, 1585-1588, is the Prado/Commons range; Commons records the Prado object P00861.
#  - Coello's sitelinks (20) are the language-edition count shown on his Wikipedia page, not read from Wikidata
#    (Wikidata was rate-limiting); recheck when convenient.
#  - The dwarf in the painting, Magdalena Ruiz, is named by the Prado but has no person record here.
