people:
  - key: isabella-clara-eugenia
    note: "Daughter of Philip II of Spain. Promised as a child (at about two) to her cousin Archduke Rudolf, later Emperor Rudolf II, who never married and let the match lapse after some twenty years; she married Archduke Albert in 1599 and ruled the Habsburg Netherlands with him 1598-1621, then as governess. Patron of Rubens."
