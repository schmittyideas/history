# Notes for the reviewer
# - Public-domain paintings by our painters, read through the official National Gallery of Art API (https://github.com/NationalGalleryOfArt/opendata); nothing was scraped. Only works the museum marks as public domain / CC0 with an image. Second wave: painters with 40 or more Wikipedia editions. Up to 3 per painter, matched on the painter's full name in the museum's artist field.
# - 327 new artworks (works already in the database were skipped: 4) (images are hotlinked from the museum's servers, CC0).
# - Dates are the museum's own begin/end years; `estimated` where its date text says ca./c./probably.

batch:
  title: Paintings from the National Gallery of Art open collection
  requested: Add images, accession numbers and links back for our painters' works in the National Gallery of Art
  date: '2026-10-11'
