events:
  # Wars of the Roses
  - {key: battle-of-towton, name: Battle of Towton, type: Battle, date: 1461-03-29, place: towton-battlefield,
     people: [{person: edward-iv-of-england, role: victor}], prominence: 4,
     note: "Fought in a snowstorm; the bloodiest battle ever fought on English soil (estimates of the dead run from 9,000 to 20,000). A decisive Yorkist victory.", sources: [wp-edward-iv-of-england]}
  - {key: coronation-of-edward-iv, name: Coronation of Edward IV, type: Coronation, date: 1461-06-28,
     people: [{person: edward-iv-of-england, role: crowned}], prominence: 3,
     note: "Edward was hastily appointed king in London in March 1461 and crowned on 28 June.", sources: [wp-edward-iv-of-england]}
  - {key: battle-of-barnet, name: Battle of Barnet, type: Battle, date: 1471-04-14, place: barnet-battlefield,
     people: [{person: edward-iv-of-england, role: victor}], prominence: 3,
     note: "Warwick the Kingmaker was killed.", sources: [wp-edward-iv-of-england]}
  - {key: battle-of-tewkesbury, name: Battle of Tewkesbury, type: Battle, date: 1471-05-04, place: tewkesbury-battlefield,
     people: [{person: edward-iv-of-england, role: victor}], prominence: 3,
     note: "The Lancastrian army was destroyed and Edward of Westminster, Henry VI's only son and heir, died on the field.", sources: [wp-edward-iv-of-england]}
  - {key: treaty-of-picquigny, name: Treaty of Picquigny, type: Treaty, year: 1475,
     people: [{person: edward-iv-of-england, role: signatory}], prominence: 3,
     note: "Edward invaded France in 1475 and was bought off by Louis XI; the treaty formally ended the Hundred Years' War.", sources: [wp-edward-iv-of-england]}
  - {key: princes-in-the-tower, name: Disappearance of the Princes in the Tower, type: Disappearance, year: 1483, estimated: true, place: tower-of-london,
     people: [{person: edward-v-of-england, role: disappeared}, {person: richard-iii-of-england, role: suspected}], prominence: 4,
     note: "Edward V and his brother Richard of Shrewsbury were seen less and less in the Tower and vanished from view in late summer or autumn 1483. Their fate is unknown; most accept they were murdered, usually blamed on Richard III.", sources: [wp-edward-v-of-england, wp-richard-iii-of-england]}
  - {key: coronation-of-richard-iii, name: Coronation of Richard III, type: Coronation, date: 1483-07-06,
     people: [{person: richard-iii-of-england, role: crowned}], prominence: 3,
     note: "An assembly had proclaimed him king on 25 June, after declaring Edward IV's marriage invalid and his children illegitimate.", sources: [wp-richard-iii-of-england]}
  - {key: buckinghams-rebellion, name: Buckingham's rebellion, type: Rebellion, year: 1483,
     people: [{person: richard-iii-of-england, role: defeated rebels}], prominence: 2,
     note: "October 1483 revolt led by Richard's former ally the Duke of Buckingham; it failed.", sources: [wp-richard-iii-of-england]}
  - {key: battle-of-bosworth-field, name: Battle of Bosworth Field, type: Battle, date: 1485-08-22, place: bosworth-field,
     people: [{person: henry-vii-of-england, role: victor}, {person: richard-iii-of-england, role: died}], prominence: 5,
     note: "Richard III was killed, the last English king to die in battle. Henry Tudor took the crown, effectively ending the Wars of the Roses.", sources: [wp-henry-vii-of-england, wp-richard-iii-of-england]}
  - {key: coronation-of-henry-vii, name: Coronation of Henry VII, type: Coronation, date: 1485-10-30, place: westminster-abbey,
     people: [{person: henry-vii-of-england, role: crowned}], prominence: 3, sources: [wp-henry-vii-of-england]}
  - {key: marriage-of-henry-vii-and-elizabeth-of-york, name: Marriage of Henry VII and Elizabeth of York, type: Marriage, year: 1486, place: westminster-abbey,
     people: [{person: henry-vii-of-england, role: groom}], prominence: 3,
     note: "Joined the Lancastrian and Yorkist claims. Henry was 29, she was 20.", sources: [wp-henry-vii-of-england]}
  - {key: battle-of-stoke-field, name: Battle of Stoke Field, type: Battle, year: 1487,
     people: [{person: henry-vii-of-england, role: victor}], prominence: 2,
     note: "Defeated the Yorkist rebellion backing the pretender Lambert Simnel; the Earl of Lincoln was killed. Called the end of the Wars of the Roses (1455-1487).", sources: [wp-henry-vii-of-england]}

  # Henry VIII and the Reformation
  - {key: coronation-of-henry-viii, name: Coronation of Henry VIII and Catherine of Aragon, type: Coronation, date: 1509-06-24, place: westminster-abbey,
     people: [{person: henry-viii-of-england, role: crowned}, {person: catherine-of-aragon, role: crowned}], prominence: 4, sources: [wp-henry-viii]}
  - {key: field-of-the-cloth-of-gold, name: Field of the Cloth of Gold, type: Summit, date: 1520-06-07,
     people: [{person: henry-viii-of-england, role: host}], prominence: 3,
     note: "Fortnight of lavish entertainment near Calais at which Henry met Francis I of France.", sources: [wp-henry-viii]}
  - {key: annulment-of-henry-viii-and-catherine, name: Annulment of Henry VIII's marriage to Catherine of Aragon, type: Annulment, date: 1533-05-23, place: dunstable-priory,
     people: [{person: henry-viii-of-england, role: petitioner}, {person: catherine-of-aragon, role: annulled}], prominence: 4,
     note: "Archbishop Cranmer's special court declared the marriage void. The pope refused to agree and excommunicated Henry.", sources: [wp-henry-viii, wp-catherine-of-aragon]}
  - {key: coronation-of-anne-boleyn, name: Coronation of Anne Boleyn, type: Coronation, date: 1533-06-01, place: westminster-abbey,
     people: [{person: anne-boleyn, role: crowned}, {person: henry-viii-of-england, role: husband}], prominence: 3,
     note: "The last queen consort of England to be crowned separately from her husband.", sources: [wp-anne-boleyn]}
  - {key: act-of-supremacy-1534, name: Act of Supremacy, type: Law, year: 1534,
     people: [{person: henry-viii-of-england, role: Supreme Head}], prominence: 4,
     note: "Declared the king 'the only Supreme Head on Earth of the Church of England'; the Treasons Act 1534 made denying it high treason.", sources: [wp-henry-viii]}
  - {key: english-reformation, name: English Reformation, type: Reformation, year: 1534, end_year: 1559,
     people: [{person: henry-viii-of-england, role: initiator}, {person: edward-vi-of-england, role: furthered}, {person: mary-i-of-england, role: reversed}, {person: elizabeth-i-of-england, role: restored}], prominence: 5,
     note: "Henry broke with Rome (Act of Supremacy 1534). Protestantism was established under Edward VI, reversed under Mary I, and restored by Elizabeth in 1559. Span begins at the Act of Supremacy, though Wikipedia dates Henry's appeal for an annulment to 1527.", sources: [wp-henry-viii, wp-edward-vi, wp-mary-i-of-england]}
  - {key: execution-of-anne-boleyn, name: Execution of Anne Boleyn, type: Execution, date: 1536-05-19, place: tower-of-london,
     people: [{person: anne-boleyn, role: executed}, {person: henry-viii-of-england, role: ordered}], prominence: 4,
     note: "Beheaded on Tower Green at 8 am after a trial for treasonable adultery, incest and conspiracy, charges most historians dispute.", sources: [wp-anne-boleyn, wp-henry-viii]}
  - {key: dissolution-of-the-monasteries, name: Dissolution of the monasteries, type: Reformation, year: 1536, end_year: 1540,
     people: [{person: henry-viii-of-england, role: ordered}], prominence: 4,
     note: "Began with religious houses worth less than 200 pounds vested in the Crown in January 1536; about 800 houses were dissolved. End date disputed within Wikipedia (1540 or 1542).", sources: [wp-henry-viii]}
  - {key: pilgrimage-of-grace, name: Pilgrimage of Grace, type: Rebellion, year: 1536, end_year: 1537,
     people: [{person: henry-viii-of-england, role: suppressed}], prominence: 3,
     note: "Large uprising in northern England led by Robert Aske against Henry's religious reforms; about 200 rebels were executed.", sources: [wp-henry-viii]}

  # Edward VI, Jane, Mary
  - {key: coronation-of-edward-vi, name: Coronation of Edward VI, type: Coronation, date: 1547-02-20, place: westminster-abbey,
     people: [{person: edward-vi-of-england, role: crowned}], prominence: 3,
     note: "Crowned aged nine in a shortened ceremony; Cranmer called him a second Josiah.", sources: [wp-edward-vi]}
  - {key: book-of-common-prayer-1549, name: First Book of Common Prayer and Act of Uniformity, type: Law, year: 1549,
     people: [{person: edward-vi-of-england, role: king}], prominence: 3,
     note: "Cranmer's English liturgy was made compulsory. A revised, more Protestant prayer book followed in 1552 under a second Act of Uniformity.", sources: [wp-edward-vi]}
  - {key: prayer-book-rebellion, name: Prayer Book Rebellion, type: Rebellion, year: 1549,
     people: [{person: edward-vi-of-england, role: suppressed}], prominence: 2,
     note: "Revolt in Devon and Cornwall in which over 5,500 people died.", sources: [wp-edward-vi]}
  - {key: devise-for-the-succession, name: Edward VI's Devise for the Succession, type: Succession, year: 1553,
     people: [{person: edward-vi-of-england, role: author}, {person: lady-jane-grey, role: named heir}], prominence: 3,
     note: "The dying king named Lady Jane Grey his heir, excluding his half-sisters Mary and Elizabeth.", sources: [wp-edward-vi, wp-lady-jane-grey]}
  - {key: proclamation-of-lady-jane-grey, name: Proclamation of Lady Jane Grey as queen, type: Proclamation, date: 1553-07-10, place: tower-of-london,
     people: [{person: lady-jane-grey, role: proclaimed}], prominence: 3,
     note: "Proclaimed in London; she awaited her coronation in the Tower.", sources: [wp-lady-jane-grey]}
  - {key: mary-i-proclaimed-queen, name: Mary I proclaimed queen, type: Accession, date: 1553-07-19, place: framlingham-castle,
     people: [{person: mary-i-of-england, role: victor}, {person: lady-jane-grey, role: deposed}], prominence: 4,
     note: "Mary raised a force at Framlingham by 12 July; the Privy Council changed sides and proclaimed her on 19 July, deposing Jane. She rode into London on 3 August.", sources: [wp-mary-i-of-england, wp-lady-jane-grey]}
  - {key: execution-of-lady-jane-grey, name: Execution of Lady Jane Grey, type: Execution, date: 1554-02-12, place: tower-of-london,
     people: [{person: lady-jane-grey, role: executed}], prominence: 3,
     note: "Beheaded with her husband Guildford Dudley after Wyatt's rebellion made her a danger to Mary.", sources: [wp-lady-jane-grey]}
  - {key: wyatts-rebellion, name: Wyatt's rebellion, type: Rebellion, year: 1554,
     people: [{person: mary-i-of-england, role: defeated rebels}], prominence: 2,
     note: "Revolt from Kent against Mary's marriage to Philip of Spain; Wyatt's army surrendered within sight of the Tower.", sources: [wp-mary-i-of-england]}
  - {key: marriage-of-mary-i-and-philip, name: Marriage of Mary I and Philip of Spain, type: Marriage, date: 1554-07-25, place: winchester-cathedral,
     people: [{person: mary-i-of-england, role: bride}, {person: philip-ii-of-spain, role: groom}], prominence: 4,
     note: "Two days after they first met. Philip became King of England jure uxoris; the couple had no children.", sources: [wp-mary-i-of-england, wp-philip-ii-of-spain]}
  - {key: marian-persecutions, name: Marian persecutions, type: Persecution, year: 1555, end_year: 1558,
     people: [{person: mary-i-of-england, role: ordered}], prominence: 3,
     note: "The first burnings were in February 1555; more than 280 people were burned for heresy, including Cranmer, Ridley and Latimer.", sources: [wp-mary-i-of-england]}
  - {key: loss-of-calais, name: Loss of Calais, type: Siege, year: 1558,
     people: [{person: mary-i-of-england, role: lost}], prominence: 3,
     note: "French forces took Calais in January 1558, England's last possession on the continent.", sources: [wp-mary-i-of-england]}

  # Elizabeth
  - {key: elizabethan-religious-settlement, name: Elizabethan Religious Settlement, type: Reformation, year: 1559,
     people: [{person: elizabeth-i-of-england, role: restored}], prominence: 4,
     note: "Elizabeth restored the Protestant reforms of Edward VI's reign in 1559.", sources: [wp-edward-vi]}
  - {key: coronation-of-elizabeth-i, name: Coronation of Elizabeth I, type: Coronation, date: 1559-01-15, place: westminster-abbey,
     people: [{person: elizabeth-i-of-england, role: crowned}], prominence: 3,
     note: "Date chosen by her astrologer John Dee. Crowned and anointed by Owen Oglethorpe, the Catholic bishop of Carlisle.", sources: [wp-elizabeth-i]}
  - {key: spanish-armada, name: Spanish Armada, type: Naval campaign, year: 1588, place: gravelines,
     people: [{person: elizabeth-i-of-england, role: defender}, {person: philip-ii-of-spain, role: aggressor}], prominence: 5,
     note: "Philip II sent the fleet to cross the Channel with the Army of Flanders and overthrow Elizabeth. The English navy denied it a link-up at Gravelines and storms wrecked much of the fleet on its return. Over 7,000 English sailors died of disease.", sources: [wp-philip-ii-of-spain, wp-spanish-armada]}

