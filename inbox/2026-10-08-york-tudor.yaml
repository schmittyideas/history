discrepancies:
  - key: princes-in-the-tower-fate
    question: What happened to Edward V and his brother Richard of Shrewsbury after they disappeared in 1483?
    about: [{person: edward-v-of-england}, {event: princes-in-the-tower}]
    field: died
    claims:
      - {value: "Murdered on the orders of their uncle Richard III (the most widely accepted theory; Thomas More says smothered with pillows)", sources: [wp-edward-v-of-england, wp-richard-iii-of-england]}
      - {value: "Fate unknown, with other suspects proposed, including Buckingham and Henry VII; no conclusive evidence", sources: [wp-edward-v-of-england, wp-richard-iii-of-england]}
    note: "The record gives Edward V's death as 1483 (estimated). Bones found in 1674 and placed in Westminster Abbey have never been proven to be the princes."
  - key: anne-boleyn-birth-year
    question: When was Anne Boleyn born?
    about: [{person: anne-boleyn}]
    field: born
    claims:
      - {value: "c. 1501 (Eric Ives)", sources: [wp-anne-boleyn]}
      - {value: "c. 1507 (Retha Warnicke; supported by William Camden)", sources: [wp-anne-boleyn]}
    note: "The record uses c. 1501 (estimated) for now."
  - key: jane-seymour-birth-year
    question: When was Jane Seymour born?
    about: [{person: jane-seymour}]
    field: born
    claims:
      - {value: "c. 1508 (accounts range from 1504 to 1509)", sources: [wp-jane-seymour]}
      - {value: "c. 1512-1513 (Elizabeth Norton)", sources: [wp-jane-seymour]}
    note: "The record uses c. 1508 (estimated) for now."
  - key: lady-jane-grey-birth
    question: When and where was Lady Jane Grey born?
    about: [{person: lady-jane-grey}]
    field: born
    claims:
      - {value: "October 1537 at Bradgate House, Leicestershire (the traditional view)", sources: [wp-lady-jane-grey]}
      - {value: "Earlier: possibly in London, before May 1537 or between May 1536 and February 1537 (more recent research; fits her being in her 17th year at her execution)", sources: [wp-lady-jane-grey]}
    note: "The record uses 1537 (estimated) and gives no birthplace."
  - key: lady-jane-grey-reign-length
    question: How long did Lady Jane Grey reign?
    about: [{person: lady-jane-grey}]
    field: date
    claims:
      - {value: "Nine days, 10 to 19 July 1553 (proclamation to deposition)", sources: [wp-lady-jane-grey]}
      - {value: "About 13 days if dated from Edward VI's death on 6 July 1553", sources: [wp-lady-jane-grey]}
    note: "The title record uses 10-19 July 1553."
  - key: dissolution-of-the-monasteries-end
    question: When did the dissolution of the English monasteries end?
    about: [{event: dissolution-of-the-monasteries}]
    field: date
    claims:
      - {value: "January 1540: no religious houses remained, about 800 dissolved", sources: [wp-henry-viii]}
      - {value: "1542: England's remaining monasteries were all dissolved", sources: [wp-henry-viii]}
    note: "Two passages of the same article differ. The event record ends at 1540."
  - key: richard-iii-burial-fate
    question: Was Richard III's body thrown into the River Soar?
    about: [{person: richard-iii-of-england}]
    field: place
    status: resolved
    claims:
      - {value: "Thrown into the River Soar at the Dissolution (long-standing tradition, now called discredited)", sources: [wp-richard-iii-of-england]}
      - {value: "Buried in the choir of Greyfriars Church, Leicester; the skeleton was found there in 2012 and identified in 2013", sources: [wp-richard-iii-of-england]}
    resolution: "The 2012 excavation found him at Greyfriars; the record gives burial at Greyfriars (1485) and reburial in Leicester Cathedral (2015)."
