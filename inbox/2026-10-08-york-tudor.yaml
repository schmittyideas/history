# English monarchs: York and Tudor, 1461-1603.
# VERIFIED against the downloaded English Wikipedia articles (scratchpad/wp/). Every date, place and
# role below comes from those articles. Exceptions, stated honestly:
#  - Coordinates are from general knowledge (the articles give none) and are approximate to ~3 decimals.
#  - NOT DOWNLOADED, so left out or sourced from other articles: Elizabeth I (rate-limited error file),
#    Spanish Armada, English Reformation, Battle of Towton/Barnet/Tewkesbury/Bosworth/Stoke Field, Hampton Court,
#    Richmond Palace, Nonsuch Palace, Elizabeth of York, Mary Queen of Scots. Elizabeth I's facts come from
#    the Anne Boleyn, Mary I, James VI and I and Philip II articles; the battle dates from Edward IV,
#    Henry VII and Richard III; the Armada from Philip II. Elizabeth I's place of death, the Armada's
#    detail, and the Nonsuch/Richmond founding facts are therefore left out.
#  - Left out: Irish titles (Lord/King of Ireland) to keep one title per realm; Henry VI's 1470-71 reign
#    (another agent); any founding dates or builders for Tudor palaces (no downloaded article gives them).
#    Existing shared places (tower-of-london, windsor etc.) are referenced by key, not re-sent.
batch:
  title: "English monarchs: York and Tudor, 1461-1603"
  requested: "Edward IV to Elizabeth I: reigns, Wars of the Roses battles, Reformation, Armada, Tudor places"
  date: 2026-10-08

