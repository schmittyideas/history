people:
  - {key: edward-iv-of-england, name: Edward IV, type: Royalty, house: York, realm: England, born: 1442-04-28, died: 1483-04-09, prominence: 4,
     note: "First Yorkist king. Won the throne at Towton (1461), lost it to Warwick and Henry VI in 1470, regained it at Barnet and Tewkesbury (1471).", sources: [wp-edward-iv-of-england]}
  - {key: edward-v-of-england, name: Edward V, type: Royalty, house: York, realm: England, born: 1470-11-02, died: 1483, died_estimated: true, prominence: 3,
     note: "Reigned 9 April to 25 June 1483, never crowned. One of the Princes in the Tower; he disappeared in 1483 (died 'presumably July 1483').", sources: [wp-edward-v-of-england]}
  - {key: richard-iii-of-england, name: Richard III, type: Royalty, house: York, realm: England, born: 1452-10-02, died: 1485-08-22, prominence: 4,
     note: "Last Plantagenet king and last English king to die in battle (Bosworth). His remains were found in Leicester in 2012 and reburied in the cathedral in 2015.", sources: [wp-richard-iii-of-england]}
  - {key: henry-vii-of-england, name: Henry VII, type: Royalty, house: Tudor, realm: England, born: 1457-01-28, died: 1509-04-21, prominence: 4,
     note: "First Tudor king; won the crown at Bosworth, married Elizabeth of York and ended the Wars of the Roses at Stoke Field (1487).", sources: [wp-henry-vii-of-england]}
  - {key: henry-viii-of-england, name: Henry VIII, type: Royalty, house: Tudor, realm: England, born: 1491-06-28, died: 1547-01-28, prominence: 5,
     note: "Six wives; broke with Rome, became Supreme Head of the Church of England and dissolved the monasteries.", sources: [wp-henry-viii]}
  - {key: edward-vi-of-england, name: Edward VI, type: Royalty, house: Tudor, realm: England, born: 1537-10-12, died: 1553-07-06, prominence: 3,
     note: "Crowned aged nine; the first Protestant-raised English monarch. Ruled through regency councils under Somerset and Northumberland.", sources: [wp-edward-vi]}
  - {key: lady-jane-grey, name: Lady Jane Grey, type: Royalty, realm: England, born: 1537, born_estimated: true, died: 1554-02-12, prominence: 3,
     note: "The 'Nine Days Queen', proclaimed 10 July 1553 and deposed 19 July; beheaded in the Tower. Birth year uncertain (1536 or 1537).", sources: [wp-lady-jane-grey]}
  - {key: mary-i-of-england, name: Mary I, type: Royalty, house: Tudor, realm: England, born: 1516-02-18, died: 1558-11-17, prominence: 4,
     note: "First undisputed queen regnant of England. Restored Catholicism; more than 280 Protestants were burned. Lost Calais in 1558.", sources: [wp-mary-i-of-england]}
  - {key: elizabeth-i-of-england, name: Elizabeth I, type: Royalty, house: Tudor, realm: England, born: 1533-09-07, died: 1603-03-24, prominence: 5,
     note: "Daughter of Henry VIII and Anne Boleyn. Succeeded Mary I in 1558, restored Protestantism in 1559, and survived the Spanish Armada of 1588. Died childless; James VI of Scotland succeeded her.", sources: [wp-anne-boleyn, wp-mary-i-of-england, wp-james-vi-and-i, wp-philip-ii-of-spain]}
  - {key: catherine-of-aragon, name: Catherine of Aragon, type: Royalty, realm: England, born: 1485-12-16, died: 1536-01-07, prominence: 3,
     note: "Henry VIII's first wife (married 11 June 1509, annulled 23 May 1533). Regent in 1513 when the English beat the Scots at Flodden. Mother of Mary I.", sources: [wp-catherine-of-aragon]}
  - {key: anne-boleyn, name: Anne Boleyn, type: Royalty, realm: England, born: 1501, born_estimated: true, died: 1536-05-19, prominence: 4,
     note: "Henry VIII's second wife and Queen 1533-1536; mother of Elizabeth I. Beheaded for treason. Birth year is c. 1501 or c. 1507.", sources: [wp-anne-boleyn]}
  - {key: jane-seymour, name: Jane Seymour, type: Royalty, realm: England, born: 1508, born_estimated: true, died: 1537-10-24, prominence: 2,
     note: "Henry VIII's third wife (Queen from 30 May 1536); mother of Edward VI; died twelve days after his birth. Birth year uncertain.", sources: [wp-jane-seymour]}
  - {key: philip-ii-of-spain, name: Philip II of Spain, type: Royalty, house: Habsburg, realm: Spain, born: 1527-05-21, died: 1598-09-13, prominence: 4,
     note: "King of Spain from 1556. Held the title King of England jure uxoris (by right of his wife) through his marriage to Mary I, 1554-1558. Sent the Spanish Armada against Elizabeth I in 1588.", sources: [wp-philip-ii-of-spain]}

