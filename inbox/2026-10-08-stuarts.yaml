batch:
  title: "English and British monarchs: the Stuarts, 1603-1714"
  requested: "Reigns, lives and key events of James I, Charles I, Cromwell, Charles II, James II, William III, Mary II and Anne"
  date: 2026-10-08

# Notes for the reviewer
# - All dates before 1752 are as the Wikipedia articles give them (English Old Style calendar), e.g. the Boyne is 1 July 1690 O.S.
# - Mary II: the article Mary_II_of_England was NOT downloaded (rate-limited). Her facts come only from the William III, James II and Anne articles. Her birthplace and place/date of burial are left out.
# - William III's Dutch offices (Prince of Orange, Stadtholder) are left out: no Dutch realms are in this batch. His Irish crown is left out too (no Ireland title wording agreed).
# - Charles II's coronation (April 1661), the Battle of Blenheim and the Banqueting House are left out: no clear date or founding fact in the downloaded articles.
# - Anne's place of death is not stated in the downloaded article, so there is no "died" moment for her.
# - The Great Fire, the Boyne, and other battlefield coordinates are present-day site coordinates to about 2 decimals, set from general knowledge of the locations.

sources:
  - {key: wp-james-vi-and-i,   title: "James VI and I (Wikipedia)",                 url: "https://en.wikipedia.org/wiki/James_VI_and_I"}
  - {key: wp-charles-i,        title: "Charles I of England (Wikipedia)",           url: "https://en.wikipedia.org/wiki/Charles_I_of_England"}
  - {key: wp-oliver-cromwell,  title: "Oliver Cromwell (Wikipedia)",                url: "https://en.wikipedia.org/wiki/Oliver_Cromwell"}
  - {key: wp-charles-ii,       title: "Charles II of England (Wikipedia)",          url: "https://en.wikipedia.org/wiki/Charles_II_of_England"}
  - {key: wp-james-ii,         title: "James II of England (Wikipedia)",            url: "https://en.wikipedia.org/wiki/James_II_of_England"}
  - {key: wp-william-iii,      title: "William III of England (Wikipedia)",         url: "https://en.wikipedia.org/wiki/William_III_of_England"}
  - {key: wp-anne,             title: "Anne, Queen of Great Britain (Wikipedia)",   url: "https://en.wikipedia.org/wiki/Anne,_Queen_of_Great_Britain"}
  - {key: wp-acts-of-union-1707, title: "Acts of Union 1707 (Wikipedia)",           url: "https://en.wikipedia.org/wiki/Acts_of_Union_1707"}

realms:
  - {name: Commonwealth of England, region: Western Europe, country: United Kingdom, note: "The republic of 1649-1660; Cromwell was Lord Protector 1653-1658"}
  - {name: Great Britain, region: Western Europe, country: United Kingdom, note: "England and Scotland united by the Acts of Union, 1 May 1707"}

people:
  - key: james-i-of-england
    name: James VI and I
    type: Royalty
    house: Stuart
    realm: England
    born: 1566-06-19
    died: 1625-03-27
    prominence: 4
    note: "King of Scotland as James VI from 1567 and of England and Ireland as James I from 1603; first Stuart king of England."
    sources: [wp-james-vi-and-i]
  - key: charles-i-of-england
    name: Charles I
    type: Royalty
    house: Stuart
    realm: England
    born: 1600-11-19
    died: 1649-01-30
    prominence: 5
    note: "Lost the English Civil War and was beheaded at Whitehall; the only English king executed."
    sources: [wp-charles-i]
  - key: oliver-cromwell
    name: Oliver Cromwell
    type: Nobility
    roles: [soldier, statesman]
    realm: Commonwealth of England
    born: 1599-04-25
    died: 1658-09-03
    prominence: 5
    note: "Parliamentarian commander who backed the execution of Charles I; Lord Protector from December 1653 until his death."
    sources: [wp-oliver-cromwell]
  - key: charles-ii-of-england
    name: Charles II
    type: Royalty
    house: Stuart
    realm: England
    born: 1630-05-29
    died: 1685-02-06
    prominence: 4
    note: "Restored to the throne in 1660 after nine years in exile; the 'Merry Monarch' of the Restoration."
    sources: [wp-charles-ii]
  - key: james-ii-of-england
    name: James II and VII
    type: Royalty
    house: Stuart
    realm: England
    born: 1633-10-14
    died: 1701-09-16
    prominence: 3
    note: "Last Catholic king of England; deposed in the Glorious Revolution of 1688 and died in exile at Saint-Germain-en-Laye."
    sources: [wp-james-ii]
  - key: william-iii-of-england
    name: William III and II
    type: Royalty
    house: Orange
    realm: England
    born: 1650-11-04
    died: 1702-03-08
    prominence: 4
    note: "Prince of Orange who invaded England in 1688; ruled jointly with Mary II to 1694, then alone."
    sources: [wp-william-iii]
  - key: mary-ii-of-england
    name: Mary II
    type: Royalty
    house: Stuart
    realm: England
    born: 1662-04-30
    died: 1694-12-28
    prominence: 3
    note: "Elder Protestant daughter of James II; joint sovereign with her husband William III from 1689; died of smallpox."
    sources: [wp-james-ii, wp-william-iii]
  - key: anne-of-great-britain
    name: Anne
    type: Royalty
    house: Stuart
    realm: Great Britain
    born: 1665-02-06
    died: 1714-08-01
    prominence: 4
    note: "Last Stuart monarch; Queen of England from 1702 and of Great Britain from the 1707 union."
    sources: [wp-anne]

titles:
  # James I. England reign from 24 March 1603 (Elizabeth I's death); Scottish reign from his mother's abdication.
  - {person: james-i-of-england, title: King of England, realm: England, from: 1603-03-24, to: 1625-03-27, sources: [wp-james-vi-and-i]}
  - {person: james-i-of-england, title: King of Scotland, realm: Scotland, from: 1567-07-24, to: 1625-03-27, note: "As James VI; crowned 29 July 1567 aged 13 months", sources: [wp-james-vi-and-i]}
  # Charles I.
  - {person: charles-i-of-england, title: King of England, realm: England, from: 1625-03-27, to: 1649-01-30, sources: [wp-charles-i]}
  - {person: charles-i-of-england, title: King of Scotland, realm: Scotland, from: 1625-03-27, to: 1649-01-30, sources: [wp-charles-i]}
  # Cromwell. Sworn in 16 December 1653.
  - {person: oliver-cromwell, title: Lord Protector, realm: Commonwealth of England, from: 1653-12-16, to: 1658-09-03, note: "Ruled England, Scotland and Ireland under the Instrument of Government; offered the crown in 1657 and declined", sources: [wp-oliver-cromwell]}
  # Charles II. Scots proclaimed him 5 Feb 1649; English reign taken from the 1660 Restoration (see discrepancy).
  - {person: charles-ii-of-england, title: King of Scotland, realm: Scotland, from: 1649-02-05, to: 1651, note: "Crowned at Scone 1 January 1651; defeated at Worcester 3 September 1651", sources: [wp-charles-ii]}
  - {person: charles-ii-of-england, title: King of England, realm: England, from: 1660-05-29, to: 1685-02-06, note: "Restored 1660. Royalists dated his reign from his father's death in 1649", sources: [wp-charles-ii]}
  # James II.
  - {person: james-ii-of-england, title: King of England, realm: England, from: 1685-02-06, to: 1688-12-11, note: "Tried to flee on 11 December 1688; left for France on 23 December; throne declared vacant February 1689", sources: [wp-james-ii]}
  - {person: james-ii-of-england, title: King of Scotland, realm: Scotland, from: 1685-02-06, to: 1689-04-11, note: "As James VII; Scottish Estates declared the throne forfeited on 11 April 1689", sources: [wp-james-ii]}
  # William and Mary: joint monarchs; William alone after Mary's death.
  - {person: william-iii-of-england, title: King of England, realm: England, from: 1689-02-13, to: 1702-03-08, note: "Joint monarch with Mary II to 1694", sources: [wp-william-iii]}
  - {person: william-iii-of-england, title: King of Scotland, realm: Scotland, from: 1689-04-11, to: 1702-03-08, sources: [wp-william-iii, wp-james-ii]}
  - {person: mary-ii-of-england, title: Queen of England, realm: England, from: 1689-02-13, to: 1694-12-28, note: "Joint sovereign with William; he held the sole exercise of regal power", sources: [wp-william-iii]}
  - {person: mary-ii-of-england, title: Queen of Scotland, realm: Scotland, from: 1689-04-11, to: 1694-12-28, sources: [wp-william-iii, wp-james-ii]}
  # Anne. England to the union, Great Britain from 1 May 1707.
  - {person: anne-of-great-britain, title: Queen of England, realm: England, from: 1702-03-08, to: 1707-04-30, sources: [wp-anne]}
  - {person: anne-of-great-britain, title: Queen of Scotland, realm: Scotland, from: 1702-03-08, to: 1707-04-30, sources: [wp-anne]}
  - {person: anne-of-great-britain, title: Queen of Great Britain, realm: Great Britain, from: 1707-05-01, to: 1714-08-01, sources: [wp-anne, wp-acts-of-union-1707]}

