events:
  - key: union-of-the-crowns-1603
    name: Union of the Crowns
    type: Succession
    date: 1603-03-24
    people: [{person: james-i-of-england, role: succeeded}]
    prominence: 4
    note: "James VI of Scotland became James I of England on Elizabeth I's death; the two kingdoms kept separate parliaments until 1707."
    sources: [wp-james-vi-and-i]
  - key: coronation-of-james-i
    name: Coronation of James I
    type: Coronation
    date: 1603-07-25
    place: westminster-abbey
    people: [{person: james-i-of-england, role: crowned}]
    prominence: 3
    note: "Festivities were restricted by an outbreak of plague."
    sources: [wp-james-vi-and-i]
  - key: gunpowder-plot
    name: Gunpowder Plot
    type: Conspiracy
    date: 1605-11-05
    people: [{person: james-i-of-england, role: target}]
    prominence: 4
    note: "Guy Fawkes was found guarding 36 barrels of gunpowder in the cellars of Parliament on the night of 4-5 November, the eve of the state opening."
    sources: [wp-james-vi-and-i]
  - key: charles-i-raises-the-royal-standard-1642
    name: Charles I raises the royal standard
    type: War
    date: 1642-08-22
    place: nottingham
    people: [{person: charles-i-of-england, role: king}]
    prominence: 3
    note: "The start of the English Civil War in the field."
    sources: [wp-charles-i]
  - key: battle-of-edgehill
    name: Battle of Edgehill
    type: Battle
    date: 1642-10-23
    place: edgehill-battlefield
    people: [{person: charles-i-of-england, role: commander}]
    prominence: 3
    note: "The first major battle of the Civil War; it ended inconclusively as daylight faded."
    sources: [wp-charles-i]
  - key: battle-of-marston-moor
    name: Battle of Marston Moor
    type: Battle
    year: 1644
    place: marston-moor-battlefield
    people: [{person: oliver-cromwell, role: victor}, {person: charles-i-of-england, role: defeated}]
    prominence: 3
    note: "July 1644 (the day is not given in the downloaded articles). Cromwell's cavalry was a major factor in the Parliamentarian victory."
    sources: [wp-oliver-cromwell, wp-charles-i]
  - key: battle-of-naseby
    name: Battle of Naseby
    type: Battle
    date: 1645-06-14
    place: naseby-battlefield
    people: [{person: oliver-cromwell, role: victor}, {person: charles-i-of-england, role: defeated}]
    prominence: 4
    note: "The New Model Army smashed the King's main army; the military balance tipped decisively to Parliament."
    sources: [wp-charles-i, wp-oliver-cromwell]
  - key: execution-of-charles-i
    name: Execution of Charles I
    type: Execution
    date: 1649-01-30
    place: palace-of-whitehall
    people: [{person: charles-i-of-england, role: executed}, {person: oliver-cromwell, role: signatory}]
    prominence: 5
    note: "Beheaded on a scaffold outside the Banqueting House at about 2 pm; the monarchy was abolished and the Commonwealth declared."
    sources: [wp-charles-i, wp-oliver-cromwell]
  - key: siege-of-drogheda
    name: Siege of Drogheda
    type: Siege
    year: 1649
    place: drogheda
    people: [{person: oliver-cromwell, role: commander}]
    prominence: 3
    note: "September 1649. After the town fell, Cromwell's troops killed nearly 3,500 people, including civilians, prisoners and priests."
    sources: [wp-oliver-cromwell]
  - key: battle-of-dunbar-1650
    name: Battle of Dunbar
    type: Battle
    date: 1650-09-03
    place: dunbar
    people: [{person: oliver-cromwell, role: victor}]
    prominence: 3
    note: "Cromwell smashed the main Scottish army, killing about 4,000 and taking 10,000 prisoner, then took Edinburgh."
    sources: [wp-oliver-cromwell, wp-charles-ii]
  - key: battle-of-worcester
    name: Battle of Worcester
    type: Battle
    date: 1651-09-03
    place: worcester
    people: [{person: oliver-cromwell, role: victor}, {person: charles-ii-of-england, role: defeated}]
    prominence: 4
    note: "The last major battle of the Civil Wars; Charles II escaped and spent nine years in exile."
    sources: [wp-oliver-cromwell, wp-charles-ii]
  - key: cromwell-made-lord-protector
    name: Cromwell sworn in as Lord Protector
    type: Political
    date: 1653-12-16
    people: [{person: oliver-cromwell, role: protector}]
    prominence: 4
    note: "Under the Instrument of Government; he wore plain black, not regalia."
    sources: [wp-oliver-cromwell]
  - key: restoration-of-charles-ii
    name: Restoration of the monarchy
    type: Restoration
    date: 1660-05-29
    people: [{person: charles-ii-of-england, role: restored}]
    prominence: 4
    note: "Charles II reached London on his 30th birthday after landing at Dover on 25 May."
    sources: [wp-charles-ii]
  - key: posthumous-execution-of-cromwell
    name: Posthumous execution of Cromwell
    type: Execution
    date: 1661-01-30
    place: tyburn
    people: [{person: oliver-cromwell, role: exhumed}]
    prominence: 2
    note: "Exhumed from Westminster Abbey on the 12th anniversary of Charles I's execution, hanged in chains, and his head displayed at Westminster Hall."
    sources: [wp-oliver-cromwell]
  - key: great-fire-of-london
    name: Great Fire of London
    type: Disaster
    date: 1666-09-02
    place: pudding-lane
    people: [{person: charles-ii-of-england, role: directed firefighting}, {person: james-ii-of-england, role: directed firefighting}]
    prominence: 4
    note: "Destroyed about 13,200 houses and 87 churches, including St Paul's Cathedral. Date is the day it began."
    sources: [wp-charles-ii, wp-james-ii]
  - key: treaty-of-dover-1670
    name: Secret Treaty of Dover
    type: Treaty
    year: 1670
    people: [{person: charles-ii-of-england, role: signatory}]
    prominence: 2
    note: "Alliance with Louis XIV against the Dutch; Charles secretly promised to announce a conversion to Catholicism. Day not given in the downloaded article."
    sources: [wp-charles-ii]
  - key: battle-of-sedgemoor
    name: Battle of Sedgemoor
    type: Battle
    date: 1685-07-06
    place: sedgemoor-battlefield
    people: [{person: james-ii-of-england, role: victor}]
    prominence: 3
    note: "Monmouth's rebels were routed; he was captured and executed at the Tower of London on 15 July. The Bloody Assizes followed."
    sources: [wp-james-ii, wp-charles-ii]
  - key: acquittal-of-the-seven-bishops
    name: Acquittal of the Seven Bishops
    type: Trial
    date: 1688-06-30
    people: [{person: james-ii-of-england, role: prosecutor}]
    prominence: 3
    note: "Seen as an assault on the Church of England; the same day seven nobles invited William of Orange to England."
    sources: [wp-james-ii, wp-william-iii]
  - key: glorious-revolution
    name: Glorious Revolution
    type: Revolution
    date: 1688-11-05
    end_year: 1689
    place: brixham
    people: [{person: william-iii-of-england, role: invader}, {person: james-ii-of-england, role: deposed}, {person: mary-ii-of-england, role: joint sovereign}]
    prominence: 5
    note: "William landed at Brixham on 5 November 1688; James's army deserted and he went into exile on 23 December. Parliament offered the crown to William and Mary."
    sources: [wp-william-iii, wp-james-ii]
  - key: declaration-of-right-1689
    name: Declaration of Right
    type: Law
    date: 1689-02-13
    people: [{person: william-iii-of-england, role: accepted}, {person: mary-ii-of-england, role: accepted}]
    prominence: 3
    note: "Parliament declared James II had abdicated and the throne was vacant; the basis of the Bill of Rights 1689. See discrepancy on the date."
    sources: [wp-william-iii, wp-james-ii]
  - key: coronation-of-william-and-mary
    name: Coronation of William III and Mary II
    type: Coronation
    date: 1689-04-11
    place: westminster-abbey
    people: [{person: william-iii-of-england, role: crowned}, {person: mary-ii-of-england, role: crowned}]
    prominence: 3
    note: "Crowned by Henry Compton, Bishop of London, because Archbishop Sancroft refused to recognise James's removal."
    sources: [wp-william-iii]
  - key: battle-of-the-boyne
    name: Battle of the Boyne
    type: Battle
    date: 1690-07-01
    place: boyne-battlefield
    people: [{person: william-iii-of-england, role: victor}, {person: james-ii-of-england, role: defeated}]
    prominence: 4
