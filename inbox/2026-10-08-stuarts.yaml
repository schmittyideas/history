discrepancies:
  - key: charles-ii-english-reign-start
    question: When did Charles II's reign as King of England begin?
    about: [{person: charles-ii-of-england}]
    field: title start
    claims:
      - {value: "1660-05-29, the Restoration (the article lead says King of England 'from the 1660 Restoration')", sources: [wp-charles-ii]}
      - {value: "30 January 1649, his father's death; the Scottish Parliament proclaimed him king on 5 February 1649", sources: [wp-charles-ii]}
    note: "The record uses 29 May 1660 for England and 5 February 1649 for Scotland."
  - key: declaration-of-right-date
    question: On what date did Parliament issue the Declaration of Right?
    about: [{event: declaration-of-right-1689}]
    field: date
    claims:
      - {value: "13 February 1689", sources: [wp-william-iii]}
      - {value: "12 February 1689", sources: [wp-james-ii]}
    note: "The record uses 13 February, which the William III article gives twice (the Declaration and the start of his kingship)."
  - key: james-ii-reign-end
    question: When did James II's reign end?
    about: [{person: james-ii-of-england}]
    field: title end
    claims:
      - {value: "11 December 1688, when he first tried to flee and threw the Great Seal in the Thames", sources: [wp-james-ii]}
      - {value: "23 December 1688, when William let him escape to France", sources: [wp-james-ii]}
      - {value: "13 February 1689, when Parliament declared the throne vacant", sources: [wp-william-iii]}
    note: "The record uses 11 December 1688 for England. Mary and William's reign is dated from 13 February 1689."
  - key: cromwell-remains
    question: Is the body hanged at Tyburn, and the head later buried at Cambridge, really Cromwell's?
    about: [{person: oliver-cromwell}, {place: tyburn}]
    field: burial
    claims:
      - {value: "Body exhumed from Westminster Abbey in 1661, hanged at Tyburn and thrown into a pit; head buried at Sidney Sussex College in 1960", sources: [wp-oliver-cromwell]}
      - {value: "Doubts that these were his remains, because the body was assumed to have been reburied in several places between September 1658 and January 1661", sources: [wp-oliver-cromwell]}
    note: "The record keeps the standard account (buried at Westminster Abbey 1658)."
