discrepancies:
  - key: hoover-burial-place
    question: "Where is Herbert Hoover buried: in the Herbert Hoover National Historic Site, or at the Presidential Library and Museum?"
    about: [{person: herbert-hoover}, {place: herbert-hoover-national-historic-site}]
    field: place
    claims:
      - {value: "Herbert Hoover National Historic Site, West Branch (grave on its grounds, near the library and his birthplace)", sources: [wp-herbert-hoover, wp-herbert-hoover-national-historic-site], note: "Article text, Death section"}
      - {value: "Herbert Hoover Presidential Library and Museum, West Branch", sources: [wp-herbert-hoover], note: "Article infobox, resting place"}
    note: "Both are in West Branch, side by side. The burial moment uses the National Historic Site, which the article text names and which holds the grave."
