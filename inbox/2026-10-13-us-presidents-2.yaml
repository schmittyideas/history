# US Presidents, batch 2 of 3: the 16th to the 31st president (Lincoln to Hoover).
# Batches 1 and 3 run in parallel; they share the realm `United States`, the title wording
# "President of the United States" and the place keys united-states-capitol,
# arlington-national-cemetery, washington-dc and new-york-city (re-sending a place is harmless).
#
# Every fact is from the person's English Wikipedia article (infobox and text), read on
# 2026-10-13. Inauguration dates and places are from the list of inauguration ceremonies in
# the "United States presidential inauguration" article. Place coordinates and dates are from
# each place's own article. Titles run from the infobox's term start to term end.
#
# Prominence (hand-set; 5 = most important): Lincoln 5 (Civil War, emancipation, assassination).
# 4 for two-term presidents and the consequential single-term ones: Andrew Johnson (Reconstruction,
# first impeachment), Grant, Cleveland, McKinley, Theodore Roosevelt, Wilson (First World War),
# Coolidge (most of two terms) and Hoover (the Great Depression). 3 for single terms with less
# lasting weight: Hayes, Garfield, Arthur, Benjamin Harrison, Taft, Harding.
#
# Sitelinks: Wikipedia language editions counted from Wikidata on 2026-10-13.
# Portraits: each article's lead image; Wikimedia Commons marks all fifteen public domain.
# Size: about 208 rows, over the usual 150, because each of the 44 new places cites its own
# article (88 rows for places and their sources). Kept as one batch so the presidents stay together.
# Temple of Music has no `ended`: its article says it was demolished after the 1901 fair, no year.
# Unusual inaugurations use the place the source names: Andrew Johnson (Kirkwood House hotel,
# shown as washington-dc), Arthur (his New York home, shown as new-york-city), Theodore Roosevelt
# (Ansley Wilcox House, Buffalo) and Coolidge (the family home, Plymouth Notch).
# No parent-child links: no two presidents in this batch are parent and child (Benjamin
# Harrison was the grandson of William Henry Harrison, who is in batch 1; not linked here).

batch:
  title: "US Presidents, batch 2: Abraham Lincoln–Herbert Hoover"
  requested: "Ty: build out US Presidents"
