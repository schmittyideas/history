- key: luca-signorelli
  name: Luca Signorelli
  type: Artist
  roles:
  - painter
  born: 1441
  born_estimated: true
  died: '1523-10-16'
  prominence: 4
  note: Italian Renaissance painter from Cortona, noted as a draftsman and for foreshortening; best known for the Last Judgment frescoes in Orvieto Cathedral.
  sources:
  - wp-luca-signorelli
  image_url: https://upload.wikimedia.org/wikipedia/commons/2/20/Signorelli%2C_Luca_-_selfportrait_alone.jpg
