  image_license: Public domain
  coverage: partly
  coverage_note: Dates, teacher link, places, Orvieto frescoes captured; full list of works not built out.
- key: pinturicchio
  name: Pinturicchio
  type: Artist
  roles:
  - painter
  born: 1454
  died: 1513
  prominence: 3
  note: Italian Renaissance painter of Perugia (born Bernardino di Betto), known for fresco cycles in Rome and Umbria including the Borgia Apartments.
  sources:
  - wp-pinturicchio
  coverage: partly
  coverage_note: Dates, patron, assistant link, places and Borgia Apartments captured; full portfolio not built out.
- key: filippino-lippi
