# The Papacy, 1503-1800: the 22 popes of the period not yet here (Pius III to Pius VI), with their births and burials,
# new birthplaces, the Trevi Fountain, Pius VI's death at Valence, and the Council of Trent.
# Part of "all the popes" (Ty, 2026-10-18): every pope on the official list (Wikipedia's "List of popes"); antipopes
# with the same title, marked disputed (none in this period); lawful popes undisputed.
# VERIFIED against English Wikipedia articles downloaded on 2026-10-18 with tools/wiki.py (revision IDs in the session
# scratchpad): each pope's article for his dates, burial and note (with the List of popes' notes); the List of popes
# for pontificate dates and birthplaces; Wikidata for sitelinks and the new places' coordinates (P625).
# Conventions as inbox/2026-10-18-popes-since-1800.yaml. Prominence hand-set: 3 for popes with a lasting mark
# (Adrian VI, Paul IV, Pius IV, Gregory XV, Innocent XI, Clement XI, Benedict XIV, Pius VI), 2 for the rest.
# Stated honestly:
#  - Where Wikidata or the List of popes differs from the pope's own article, the article is used and the difference is
#    a discrepancy: Pius III's birth (9 May 1439; Wikidata 7 June), Innocent XI's birth (16 May 1611; Wikidata 19 May),
#    and the first day of Marcellus II (10 April 1555; the list 9 April) and Pius IV (25 December 1559; the list 26th).
#  - Burials are the final resting place, with the year where the article gives it (Paul IV moved to Santa Maria
#    sopra Minerva in 1566, Urban VII in 1606, Pius IV to Santa Maria degli Angeli in 1583, Clement XII to St John
#    Lateran in 1742, Pius VI from Valence to Rome in 1802). Adrian VI's tomb in Santa Maria dell'Anima is not a place
#    record and is left in his article. Births are the List of popes' birthplaces.
batch:
  title: "The Papacy, 1503-1800"
  requested: "Do we have all popes? Get them all, with the disputed ones (antipopes) marked disputed"
  date: 2026-10-18

