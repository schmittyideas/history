people:
  - {key: pius-iii, name: "Pius III", type: Clergy, roles: [pope], born: 1439-05-09, died: 1503-10-18, realm: Papacy, prominence: 2, sitelinks: 80, sitelinks_on: 2026-10-18,
     note: "Francesco Todeschini Piccolomini, nephew of Pius II, who made him Archbishop of Siena at 21. Elected as a compromise between the Borgia and della Rovere factions; died after 26 days, one of the shortest pontificates.",
     sources: [wp-pius-iii]}
  - {key: adrian-vi, name: "Adrian VI", type: Clergy, roles: [pope], born: 1459-03-02, died: 1523-09-14, realm: Papacy, prominence: 3, sitelinks: 87, sitelinks_on: 2026-10-18,
     note: "Adriaan Florensz of Utrecht, professor and rector at Leuven and tutor of the future Charles V: the only Dutch pope, and the last non-Italian until John Paul II.",
     sources: [wp-adrian-vi]}
  - {key: marcellus-ii, name: "Marcellus II", type: Clergy, roles: [pope], born: 1501-05-06, died: 1555-05-01, realm: Papacy, prominence: 2, sitelinks: 76, sitelinks_on: 2026-10-18,
     note: "Marcello Cervini, Cardinal of Santa Croce in Gerusalemme. Died 22 days after his election; the last pope to keep his own name. Palestrina's Missa Papae Marcelli honours him.",
     sources: [wp-marcellus-ii]}
  - {key: paul-iv, name: "Paul IV", type: Clergy, roles: [pope], born: 1476-06-28, died: 1559-08-18, realm: Papacy, prominence: 3, sitelinks: 82, sitelinks_on: 2026-10-18,
     note: "Gian Pietro Carafa, co-founder of the Theatines. Anti-Spanish after serving as nuncio in Spain, he called in the French against Spain; established the Roman Ghetto (1555) and the Index of Forbidden Books (1559). Rome rioted at his death.",
     sources: [wp-paul-iv]}
  - {key: pius-iv, name: "Pius IV", type: Clergy, roles: [pope], born: 1499-03-31, died: 1565-12-09, realm: Papacy, prominence: 3, sitelinks: 86, sitelinks_on: 2026-10-18,
     note: "Giovanni Angelo Medici of Milan, Archbishop of Ragusa. Reopened and closed the Council of Trent (1563) and issued the Tridentine Creed; his nephew Charles Borromeo was his close adviser. Improved Rome's water supply.",
     sources: [wp-pius-iv]}
  - {key: urban-vii, name: "Urban VII", type: Clergy, roles: [pope], born: 1521-08-04, died: 1590-09-27, realm: Papacy, prominence: 2, sitelinks: 82, sitelinks_on: 2026-10-18,
     note: "Giovanni Battista Castagna, Archbishop of Rossano and a father at the Council of Trent. Reigned 13 days, the shortest recognised papacy, and died before his coronation; set the first known smoking ban, in and near churches.",
     sources: [wp-urban-vii]}
  - {key: gregory-xiv, name: "Gregory XIV", type: Clergy, roles: [pope], born: 1535-02-11, died: 1591-10-16, realm: Papacy, prominence: 2, sitelinks: 80, sitelinks_on: 2026-10-18,
     note: "Niccolò Sfondrato of the Duchy of Milan. In his ten months he made gambling on papal elections punishable by excommunication (Cogit nos, 1591).",
     sources: [wp-gregory-xiv]}
  - {key: innocent-ix, name: "Innocent IX", type: Clergy, roles: [pope], born: 1519-07-20, died: 1591-12-30, realm: Papacy, prominence: 2, sitelinks: 75, sitelinks_on: 2026-10-18,
     note: "Giovanni Antonio Facchinetti, canon lawyer and diplomat; as legate to Venice helped form the Holy League that won at Lepanto. Pope for two months in 1591; supported Philip II and the Catholic League in France.",
     sources: [wp-innocent-ix]}
  - {key: leo-xi, name: "Leo XI", type: Clergy, roles: [pope], born: 1535-06-02, died: 1605-04-27, realm: Papacy, prominence: 2, sitelinks: 85, sitelinks_on: 2026-10-18,
     note: "Alessandro de' Medici, great-nephew of Leo X, Archbishop of Florence and legate to France. Elected at almost seventy, he died within a month: the 'Lightning Pope'.",
     sources: [wp-leo-xi]}
  - {key: gregory-xv, name: "Gregory XV", type: Clergy, roles: [pope], born: 1554-01-09, died: 1623-07-08, realm: Papacy, prominence: 3, sitelinks: 84, sitelinks_on: 2026-10-18,
     note: "Alessandro Ludovisi. Founded the Congregation for the Propagation of the Faith (1622), required secret ballots in conclaves, and canonised Ignatius of Loyola, Francis Xavier, Teresa of Ávila and Philip Neri.",
     sources: [wp-gregory-xv]}
  - {key: clement-ix, name: "Clement IX", type: Clergy, roles: [pope], born: 1600-01-28, died: 1669-12-09, realm: Papacy, prominence: 2, sitelinks: 80, sitelinks_on: 2026-10-18,
     note: "Giulio Rospigliosi, poet, librettist and patron of Poussin, nuncio to Spain. Mediated the Peace of Aachen (1668).",
     sources: [wp-clement-ix]}
  - {key: clement-x, name: "Clement X", type: Clergy, roles: [pope], born: 1590-07-13, died: 1676-07-22, realm: Papacy, prominence: 2, sitelinks: 80, sitelinks_on: 2026-10-18,
     note: "Emilio Altieri of the Roman nobility, elected at almost 80 after a four-month conclave. Canonised Rose of Lima, the first saint from the Americas (1671), and decorated the Ponte Sant'Angelo with ten statues of angels.",
     sources: [wp-clement-x]}
  - {key: innocent-xi, name: "Innocent XI", type: Clergy, roles: [pope], born: 1611-05-16, died: 1689-08-12, realm: Papacy, prominence: 3, sitelinks: 85, sitelinks_on: 2026-10-18,
     note: "Benedetto Odescalchi of Como, beatified. Frugal and against nepotism, he cut taxes and balanced the papal budget; clashed constantly with Louis XIV and built the Holy League against the Ottomans.",
     sources: [wp-innocent-xi]}
  - {key: alexander-viii, name: "Alexander VIII", type: Clergy, roles: [pope], born: 1610-04-22, died: 1691-02-01, realm: Papacy, prominence: 2, sitelinks: 80, sitelinks_on: 2026-10-18,
     note: "Pietro Ottoboni of Venice, a lawyer from Padua. Reversed many of Innocent XI's policies and returned to nepotism; the last pope named Alexander.",
     sources: [wp-alexander-viii]}
  - {key: innocent-xii, name: "Innocent XII", type: Clergy, roles: [pope], born: 1615-03-13, died: 1700-09-27, realm: Papacy, prominence: 2, sitelinks: 80, sitelinks_on: 2026-10-18,
     note: "Antonio Pignatelli of the Kingdom of Naples. His bull Romanum decet Pontificem (1692) forbade nepotism, barring popes from giving revenues or land to relatives.",
     sources: [wp-innocent-xii]}
  - {key: clement-xi, name: "Clement XI", type: Clergy, roles: [pope], born: 1649-07-23, died: 1721-03-19, realm: Papacy, prominence: 3, sitelinks: 80, sitelinks_on: 2026-10-18,
     note: "Giovanni Francesco Albani, patron of arts, science and the Vatican Library; opened excavations of the Roman catacombs. Ruled in the Chinese Rites controversy.",
     sources: [wp-clement-xi]}
  - {key: innocent-xiii, name: "Innocent XIII", type: Clergy, roles: [pope], born: 1655-05-13, died: 1724-03-07, realm: Papacy, prominence: 2, sitelinks: 80, sitelinks_on: 2026-10-18,
     note: "Michelangelo dei Conti, the last pope named Innocent. Reform-minded and frugal, he forbade his successors to grant land, offices or income to relatives, and barred the Jesuits from taking new members for China.",
     sources: [wp-innocent-xiii]}
  - {key: benedict-xiii, name: "Benedict XIII", type: Clergy, roles: [pope], born: 1649-02-02, died: 1730-02-21, realm: Papacy, prominence: 2, sitelinks: 81, sitelinks_on: 2026-10-18,
     note: "Pietro Francesco (Vincenzo Maria) Orsini, a Dominican, the last of three Orsini popes. Devoted to his work as bishop, he left administration to a secretary whose abuses ruined the papal treasury.",
     sources: [wp-benedict-xiii]}
  - {key: clement-xii, name: "Clement XII", type: Clergy, roles: [pope], born: 1652-04-07, died: 1740-02-06, realm: Papacy, prominence: 2, sitelinks: 86, sitelinks_on: 2026-10-18,
     note: "Lorenzo Corsini of Florence. With a papal surplus he built the new façade of St John Lateran, began the Trevi Fountain (1732) and bought the Albani antiquities; In eminenti (1738) first condemned Freemasonry.",
     sources: [wp-clement-xii]}
  - {key: benedict-xiv, name: "Benedict XIV", type: Clergy, roles: [pope], born: 1675-03-31, died: 1758-05-03, realm: Papacy, prominence: 3, sitelinks: 91, sitelinks_on: 2026-10-18,
     note: "Prospero Lambertini of Bologna, 'the Enlightenment Pope': a great scholar who promoted science teaching, the arts and Thomism, reformed the training of priests, and founded academies.",
     sources: [wp-benedict-xiv]}
  - {key: clement-xiii, name: "Clement XIII", type: Clergy, roles: [pope], born: 1693-03-07, died: 1769-02-02, realm: Papacy, prominence: 2, sitelinks: 82, sitelinks_on: 2026-10-18,
     note: "Carlo della Torre di Rezzonico of Venice. Under pressure to suppress the Jesuits, he defended them (Apostolicum pascendi, 1765); sought dialogue with Protestants.",
     sources: [wp-clement-xiii]}
  - {key: pius-vi, name: "Pius VI", type: Clergy, roles: [pope], born: 1717-12-25, died: 1799-08-29, realm: Papacy, prominence: 3, sitelinks: 90, sitelinks_on: 2026-10-18,
     note: "Giovanni Angelo Braschi of Cesena. Condemned the French Revolution; Napoleon's army took the Papal States in 1796, and in 1798 the pope was carried off a prisoner to France, where he died at Valence. One of the longest pontificates.",
     sources: [wp-pius-vi]}

