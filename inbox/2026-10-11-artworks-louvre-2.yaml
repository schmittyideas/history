# Notes for the reviewer
# - Paintings by our painters in the Louvre's Department of Paintings, read from Wikidata (WikiProject sum of all paintings, CC0 open data) with images from Wikimedia Commons (public domain or free licences only). Nothing was read from the Louvre's own site, whose terms give no right to automated access and restrict its images. Up to 5 per painter, the most widely documented works first.
# - Inventory numbers come from Wikidata (P217). The link back is the French Ministry of Culture's Joconde notice (pop.culture.gouv.fr, open licence) where Wikidata has its id; works without one have no link back yet.
# - 18 works already in the database (from the painters' articles) were updated with inventory number, link and image.

