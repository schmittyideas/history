batch:
  title: "Places shown in landscapes and city views, part 2"
  requested: "Ty: link the places in painting titles, starting with landscapes and city views"
  date: 2026-10-13

# Drafted by tools/depicts.py from Wikidata (P195 + P217 match, P136 landscape/city-view genre, P180 depicts with P625),
# then checked by hand: each new place against its English Wikipedia article (or, where there is none, its Wikidata item).
#
# Dropped: Seine (x2: Soleil couchant à Ivry, On the Seine near Mantes), River Thames, Aven, Oise, Spaarne, Lek,
# because they are rivers; Amsterdam–Rhine Canal, because it is a waterway and was dug in the 20th century, long after
# Ruisdael's c. 1670 painting; Alpilles (x2: The Olive Trees, The Starry Night), Catskill Mountains, Sierra Nevada,
# because they are mountain ranges; Siberia, Arctic, Italian Riviera, Oslofjord, Forest of Fontainebleau and Eggedal
# (a valley and parish), because they are regions or large areas, not one spot; crucifixion of Jesus (x2: Calvary,
# Crucifixion with Saint Mary Magdalene), because it is not a place; Mount Sinai (The Adoration of the Golden Calf),
# because Poussin paints the biblical mountain from imagination and which real mountain it was is disputed;
# Gazzada (Q30026024), because it is the main village of Gazzada Schianno, which the painting is already linked to.
# Fixed: the draft linked Ivry-sur-Seine to ivry-cemetery (a name-match slip); the town is now a place of its own.
# The Olive Trees has no link left, so it is left out.
# niagara-falls and nieuwe-kerk-delft are also in part 1; they are repeated here so this file stands alone
# (re-sending a key updates it, never duplicates it).

