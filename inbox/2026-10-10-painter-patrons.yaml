# Notes for the reviewer
# - 74 patrons named in the painters' articles (popes, cardinals, kings, queens, ministers, collectors), from their English Wikipedia articles, with titles and realms (22 new realms), born/died/buried moments where the article names the place, and image links where the licence allows.
# - 89 patron links: found by searching the painters' article text for each patron's name near words such as commission, court, appointed, then judged by an agent on the sentences alone. Links are kept only where the article says the patron employed, commissioned or appointed the painter; sitters and passing mentions are left out. 19 links already existed (years updated only).
# - Thomas Cromwell was not written (agent gap): his one link is left out.
# - Articles were cut at 32,000 characters, so some death places and later titles are missing and left out, not guessed.
# - Every person is `coverage: partly`. Coordinates of new places are approximate (general knowledge, not the articles).

batch:
  title: 'Patrons of the painters: popes, monarchs, ministers and collectors, with their patron links'
  requested: Add the patrons the painters served (popes, kings, cardinals, collectors) and link them to the painters whose articles say they employed or commissioned them
  date: '2026-10-10'
