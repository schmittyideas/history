discrepancies:
- key: henrietta-maria-born
  question: What was Henrietta Maria's birth date?
  about:
  - person: henrietta-maria
  field: born
  claims:
  - value: 25 November 1609
    sources:
    - wp-henrietta-maria
    note: Date given in the article's lead and early-life section.
  - value: 26 November 1609
    sources:
    - wp-henrietta-maria
    note: Some historians give this date.
  - value: 16 November 1609 (Old Style)
    sources:
    - wp-henrietta-maria
    note: Often recorded in England, which still used the Julian calendar.
  note: The record uses 25 November 1609, as the article's lead does.
- key: rudolf-ii-bohemia-end
  question: When did Rudolf II's reign as King of Bohemia end?
  about:
  - person: rudolf-ii-holy-roman-emperor
  field: date
  claims:
  - value: '1608'
    sources:
    - wp-rudolf-ii-holy-roman-emperor
    note: The lead gives 1575-1608/1611, the same span as his rule in Hungary and Austria.
  - value: '1611'
    sources:
    - wp-rudolf-ii-holy-roman-emperor
    note: The other end date in the lead.
  note: The title row uses 1611 for now; the article does not say which is better supported.
- key: federico-ii-gonzaga-duke-of-mantua-died
  question: On what date did Federico II Gonzaga die in 1540?
  about:
  - person: federico-ii-gonzaga-duke-of-mantua
  field: died
  claims:
  - value: 28 August 1540 (article lead)
    sources:
    - wp-federico-ii-gonzaga-duke-of-mantua
  - value: 28 June 1540 at his villa at Marmirolo (article text)
    sources:
    - wp-federico-ii-gonzaga-duke-of-mantua
  note: The record holds the year 1540 only, since the two dates in the same article disagree.
- key: charles-iv-of-spain-died
  question: On what day did Charles IV of Spain die in January 1819?
  about:
  - person: charles-iv-of-spain
  field: died
  claims:
  - value: 20 January 1819
    sources:
    - wp-charles-iv-of-spain
    note: Lead of the article
  - value: 19 January 1819
    sources:
    - wp-charles-iv-of-spain
    note: Later and death section of the same article
  note: Record holds the year only.
- key: jean-baptiste-colbert-controller-general-start
  question: When did Colbert become Controller-General of Finances?
  about:
  - person: jean-baptiste-colbert
  field: date
  claims:
  - value: '1661'
    sources:
    - wp-jean-baptiste-colbert
    note: 'Lead: took over as Controller-General after Fouquet''s arrest (Intendant of Finances 4 May 1661)'
  - value: '1665'
    sources:
    - wp-jean-baptiste-colbert
    note: Biography section
  note: No Controller-General title is recorded until settled.
