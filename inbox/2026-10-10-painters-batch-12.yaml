- key: hendrick-goltzius
  name: Hendrick Goltzius
  type: Artist
  roles:
  - painter
  - printmaker
  - draftsman
  born: 1558
  died: '1617-01-01'
  prominence: 4
  note: German-born Dutch engraver, draftsman and painter, the leading Dutch engraver of the early Baroque (Northern Mannerism), based in Haarlem.
  sources:
  - wp-hendrick-goltzius
  image_url: https://upload.wikimedia.org/wikipedia/commons/8/81/Hendrick_Goltzius_-_Self-Portrait%2C_c._1593-1594_-_Google_Art_Project.jpg
  image_thumb: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/Hendrick_Goltzius_-_Self-Portrait%2C_c._1593-1594_-_Google_Art_Project.jpg/500px-Hendrick_Goltzius_-_Self-Portrait%2C_c._1593-1594_-_Google_Art_Project.jpg
  image_page: https://commons.wikimedia.org/wiki/File:Hendrick_Goltzius_-_Self-Portrait,_c._1593-1594_-_Google_Art_Project.jpg
  image_license: Public domain
  coverage: partly
  coverage_note: Dates, Haarlem base, career outline and teacher context captured; no individual works with dates; his teacher Coornhert and colleagues not in the database.
- key: abraham-bloemaert
  name: Abraham Bloemaert
  type: Artist
  roles:
  - painter
  - printmaker
  born: '1566-12-25'
  died: '1651-01-27'
  prominence: 3
  note: Dutch painter and printmaker of Utrecht, moving from Haarlem Mannerism to the Baroque, and the teacher of most of the Utrecht Caravaggisti.
  sources:
  - wp-abraham-bloemaert
  image_url: https://upload.wikimedia.org/wikipedia/commons/2/2d/Meyssens%2C_Johannes_-_Abraham_Bloemaert.jpg
