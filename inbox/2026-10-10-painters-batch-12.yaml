discrepancies:
- key: nikolai-yaroshenko-died
  question: On what day did Nikolai Yaroshenko die, and of what?
  about:
  - person: nikolai-yaroshenko
  field: died
  claims:
  - value: 7 July 1898 (25 June Old Style), of tuberculosis
    sources:
    - wp-nikolai-yaroshenko
    note: Given in the article's lead and biography section
  - value: 26 June 1898, of a heart attack after running 10 km in the rain
    sources:
    - wp-nikolai-yaroshenko
    note: Given later in the same article; calendar not stated
  note: The record uses 1898-07-07 from the lead; the article contradicts itself.
- key: theo-van-rysselberghe-died
  question: On what day did Théo van Rysselberghe die in December 1926?
  about:
  - person: theo-van-rysselberghe
  field: died
  claims:
  - value: 13 December 1926
    sources:
    - wp-theo-van-rysselberghe
    note: Given in the article's opening line
  - value: 14 December 1926
    sources:
    - wp-theo-van-rysselberghe
    note: Given in the article's Later years section
  note: The record uses 13 December (the opening line); the same article gives both days.
