  # George V's wife and children (Edward VIII and George VI are already in)
  - key: mary-of-teck
    name: Mary of Teck
    type: Royalty
    sex: female
    born: 1867-05-26
    died: 1953-03-24
    coverage: not-read
    note: "Queen of the United Kingdom as wife of George V (married 6 July 1893); first engaged to his elder brother Prince Albert Victor, who died in 1892."
    sources: [wp-mary-of-teck]
  - key: mary-princess-royal-and-countess-of-harewood
    name: Mary, Princess Royal
    type: Royalty
    sex: female
    house: Windsor
    born: 1897-04-25
    died: 1965-03-28
    coverage: not-read
    note: "Only daughter of George V; married Henry Lascelles, Viscount Lascelles (later 6th Earl of Harewood), in 1922."
    sources: [wp-mary-princess-royal-and-countess-of-harewood]
  - key: prince-henry-duke-of-gloucester
    name: Prince Henry, Duke of Gloucester
    type: Royalty
    sex: male
    house: Windsor
    born: 1900-03-31
    died: 1974-06-10
    coverage: not-read
    note: "Third son of George V; Governor-General of Australia 1945-1947."
    sources: [wp-prince-henry-duke-of-gloucester]
  - key: prince-george-duke-of-kent
    name: Prince George, Duke of Kent
    type: Royalty
    sex: male
    house: Windsor
    born: 1902-12-20
    died: 1942-08-25
    coverage: not-read
    note: "Fourth son of George V; served in the Royal Navy in the 1920s; killed in an air crash in Scotland in 1942."
    sources: [wp-prince-george-duke-of-kent]
  - key: prince-john-of-the-united-kingdom
    name: Prince John
    type: Royalty
    sex: male
    house: Windsor
    born: 1905-07-12
    died: 1919-01-18
    coverage: not-read
    note: "Youngest child of George V; found to have epilepsy in 1909, he died after a seizure at Wood Farm, Sandringham, aged 13."
    sources: [wp-prince-john-of-the-united-kingdom]

  # George VI's younger daughter (Elizabeth II is already in)
  - key: princess-margaret-countess-of-snowdon
    name: Princess Margaret, Countess of Snowdon
    type: Royalty
    sex: female
    house: Windsor
    born: 1930-08-21
    died: 2002-02-09
    coverage: not-read
    note: "Younger daughter of George VI and only sibling of Elizabeth II; married Antony Armstrong-Jones, later Earl of Snowdon, in 1960 (divorced 1978)."
    sources: [wp-princess-margaret-countess-of-snowdon]

  # Elizabeth II's children (Charles III is already in)
  - key: anne-princess-royal
    name: Anne, Princess Royal
    type: Royalty
    sex: female
    house: Windsor
    born: 1950-08-15
    coverage: not-read
    note: "Only daughter of Elizabeth II and Prince Philip."
    sources: [wp-anne-princess-royal]
  - key: andrew-mountbatten-windsor
    name: Andrew Mountbatten-Windsor
    type: Royalty
    sex: male
    house: Windsor
    born: 1960-02-19
    coverage: not-read
    note: "Second son of Elizabeth II and Prince Philip; Royal Navy helicopter pilot in the Falklands War; created Duke of York in 1986. Charles III removed his remaining royal styles and honours in 2025."
    sources: [wp-andrew-mountbatten-windsor]
  - key: prince-edward-duke-of-edinburgh
    name: Prince Edward, Duke of Edinburgh
    type: Royalty
    sex: male
    house: Windsor
    born: 1964-03-10
    coverage: not-read
    note: "Youngest child of Elizabeth II and Prince Philip; made Duke of Edinburgh, his father's title, in 2023."
    sources: [wp-prince-edward-duke-of-edinburgh]

  # Charles III's wives and sons
  - key: diana-princess-of-wales
    name: Diana, Princess of Wales
    type: Royalty
    sex: female
    born: 1961-07-01
    died: 1997-08-31
    coverage: not-read
    note: "First wife of Charles III (married 29 July 1981 at St Paul's Cathedral, divorced 1996) and mother of Princes William and Harry; died after a car crash in Paris."
    sources: [wp-diana-princess-of-wales]
  - key: queen-camilla
    name: Queen Camilla
    type: Royalty
    sex: female
    born: 1947-07-17
    coverage: not-read
    note: "Born Camilla Shand; wife of Charles III since 2005 and Queen since his accession in 2022."
    sources: [wp-queen-camilla]
  - key: william-prince-of-wales
    name: William, Prince of Wales
    type: Royalty
    sex: male
    house: Windsor
    born: 1982-06-21
    coverage: not-read
    note: "Elder son of Charles III and Diana; heir apparent to the throne."
    sources: [wp-william-prince-of-wales]
  - key: prince-harry-duke-of-sussex
    name: Prince Harry, Duke of Sussex
    type: Royalty
    sex: male
    house: Windsor
    born: 1984-09-15
    coverage: not-read
    note: "Younger son of Charles III and Diana."
    sources: [wp-prince-harry-duke-of-sussex]

