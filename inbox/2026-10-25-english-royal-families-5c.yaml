batch:
  title: "Royal families, part 5c: Windsor, George V to Charles III (1910-today)"
  requested: "Ty: fill in parents, spouses and children (who reached 12) for each English monarch (issue #292, agreed 2026-10-25)"
  date: 2026-10-25
  notes: "Sex for George V, Edward VIII, George VI, Elizabeth II and Charles III; their marriages and legitimate children who reached age 12, each with their own Wikipedia article, birth and burial places. George V's parents are linked in part 5b. Living people get birth facts only."

# Notes for the reviewer
# - Already in: Edward VIII's marriage to Wallis Simpson (1937) and George VI's to Elizabeth Bowes-Lyon (1923), so no new
#   spouse links for them; Edward VIII had no children. Queen Elizabeth The Queen Mother and Prince Philip are existing records.
# - Burial moments carry a year only where the article dates the burial; otherwise the year is left out. Where someone was
#   moved, the moment is the final resting place: Prince George, Duke of Kent (reburied in the Royal Burial Ground, Frogmore,
#   1968); Princess Margaret (ashes placed in the King George VI Memorial Chapel, St George's Chapel, Windsor, 2002).
#   Diana's grave is on an island in the grounds of Althorp; the article does not date the burial.
# - Living people (Anne, Andrew, Edward, Camilla, William, Harry): birth date and birthplace only, no death.
# - Royal Burial Ground, Frogmore is also defined in part 5b (same key and values), so either part can go in first.
# Left out
# - Nobody: every legitimate child of these monarchs reached 12 (George V's youngest, Prince John, died at 13).
# - No title changes in this batch.

