  - {key: clement-viii-antipope, name: "Clement VIII (antipope)", type: Clergy, roles: [antipope], born: 1369, born_estimated: true, died: 1446, died_estimated: true, realm: Papacy, prominence: 1, sitelinks: 32, sitelinks_on: 2026-10-18,
