  - {key: benedict-xiv-antipope-garnier, name: "Benedict XIV (antipope, Bernard Garnier)", type: Clergy, roles: [antipope], died: 1429, died_estimated: true, realm: Papacy, prominence: 1, sitelinks: 9, sitelinks_on: 2026-10-18,
