     note: "Robert of Geneva, son of Amadeus III of Geneva, Archbishop of Cambrai; as legate he is said to have authorised the massacre at Cesena (1377). The cardinals who rejected Urban VI elected him in 1378: the first Avignon antipope, whose election began the Western Schism.",
     sources: [wp-clement-vii-antipope]}
  - {key: benedict-xiii-antipope, name: "Benedict XIII (antipope)", type: Clergy, roles: [antipope], born: 1342, died: 1423-05-23, realm: Papacy, prominence: 3, sitelinks: 45, sitelinks_on: 2026-10-18,
     note: "Pedro de Luna, 'Papa Luna', an Aragonese noble: the Avignon claimant of the Western Schism from 1394, who never gave up his claim and died in 1423.",
     sources: [wp-benedict-xiii-antipope]}
  - {key: alexander-v-antipope, name: "Alexander V (antipope)", type: Clergy, roles: [antipope], born: 1339, born_estimated: true, died: 1410-05-03, realm: Papacy, prominence: 2, sitelinks: 48, sitelinks_on: 2026-10-18,
     note: "Peter of Candia (Petros Philarges) of Crete, elected by the Council of Pisa against both Gregory XII and Benedict XIII; reigned less than a year. Alexander VI later took his number.",
     sources: [wp-alexander-v-antipope]}
  - {key: john-xxiii-antipope, name: "John XXIII (antipope)", type: Clergy, roles: [antipope], died: 1419, realm: Papacy, prominence: 3, sitelinks: 53, sitelinks_on: 2026-10-18,
