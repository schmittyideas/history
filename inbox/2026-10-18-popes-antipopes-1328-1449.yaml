# The Papacy, antipopes 1328-1449 (part 2 of the 999-1503 batch): Nicholas V, the Avignon and Pisan claimants of the
# Western Schism (Clement VII, Benedict XIII, Alexander V, John XXIII), their successors (Clement VIII and the two
# Benedict XIVs), and Felix V, entered under his own name, Amadeus VIII of Savoy, with his Savoy titles.
# Conventions and checks as part 1 (inbox/2026-10-18-popes-999-1503.yaml): title "Pope", `disputed: true`, keyed
# <name>-antipope, display name "(antipope)"; each claimant's own article for dates and note, the Antipope table for
# pontificates, Wikidata for sitelinks and coordinates.
# Stated honestly:
#  - Discrepancies recorded, the record using the claimant's own article: Nicholas V's end (25 July 1330; the table
#    12 August), Alexander V's start (26 June 1409; the table 25th), Benedict XIII's birth (1342; Wikidata 1328) and
#    Clement VIII's death (1445/46; Wikidata 1447).
#  - Benedict XIV is two men in one article, Bernard Garnier and Jean Carrier, entered separately with year-only dates.
#  - Nicholas V's birthplace, Corvaro, has no coordinates on Wikidata; Clement VII's, Benedict XIII's and John XXIII's
#    birthplaces are not given in the table and are left out.
