  - {key: hf-ww2-innovations, title: "7 Innovations That Came Out of World War II (History Facts, Tony Dunnell, 14 May 2026)", url: "https://historyfacts.com/science-industry/article/7-innovations-that-came-out-of-world-war-ii/"}
