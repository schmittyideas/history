batch:
  title: "US Presidents, batch 3: Franklin D. Roosevelt–Joe Biden"
  requested: "Ty: build out US Presidents"
  date: 2026-10-13

# Notes for the reviewer
# - Facts come from each president's English Wikipedia article (read through the Wikipedia API on 2026-10-13: infobox, birth, death and burial
#   passages), inauguration dates and places from 'United States presidential inauguration' (its table of all inaugurations), and each place's
#   coordinates from its own article. Sitelinks from Wikidata on 2026-10-13 (Wikipedia language editions only).
# - Living as of 2026-10-13 (no death in their articles): Clinton, George W. Bush, Obama, Trump, Biden. Jimmy Carter died on 29 December 2024
#   at his home in Plains, Georgia (confirmed in his article). Trump's second title row has no end: in office.
# - Prominence (hand-set): 5 for Franklin D. Roosevelt only (four terms, the Depression and World War II). 4 for two-term or otherwise
#   consequential presidents (Truman, who decided the end of the war and the post-war order; Eisenhower; Kennedy, for the assassination and his
#   standing; Johnson; Nixon, for Watergate and the only resignation; Reagan; Clinton; George W. Bush; Obama; Trump, two non-consecutive terms).
#   3 for one-term or short presidencies (Ford, Carter, George H. W. Bush, Biden).
# - Inaugurations: all 27 are in (one per term, plus the extraordinary ones of Truman 1945, Johnson 1963 and Ford 1974). Dates are the public
#   ceremony; for 1957, 1985 and 2013 the term began on Sunday 20 January with a private oath and the public ceremony was on Monday 21 January
#   (the event note says so; not a disagreement). Roosevelt's 1945 inauguration was at the White House (South Portico); Reagan 1985 and
#   Trump 2025 were in the Capitol Rotunda, so they keep united-states-capitol. Inauguration prominence 3, as asked; Kennedy's assassination and
#   Nixon's resignation 5.
# - Portraits: the article lead image, linked only, for every president whose image Commons marks public domain (14 of 15). Franklin D.
#   Roosevelt's lead image (FDR-1944-Campaign-Portrait, 3x4 retouched, cropped) is CC BY 2.0 on Commons, not public domain or CC0, so his
#   image fields are left out.
# - Places: Roosevelt's birthplace is 'Hyde Park, New York' in his article; the Home of FDR National Historic Site article names Springwood as
#   his birthplace, lifelong home and burial place, so one place serves for born and buried. Johnson's birth, death and grave all fall inside the
#   Lyndon B. Johnson National Historical Park (its article: 'protects the birthplace, home, ranch, and grave'); his infobox says Gillespie County.
#   Nixon's birth house is on the Nixon Library campus (the library article). Deaths in hospital use the city (Truman: Kansas City; Eisenhower:
#   Washington, D.C.; Kennedy: Dallas; Nixon: New York City) (hospitals: Research Hospital, Walter Reed, Parkland, NewYork-Presbyterian; moments have no note field). Existing places reused:
#   washington-dc, kansas-city-missouri, new-york-city, los-angeles, houston, and united-states-capitol and arlington-national-cemetery (added by
#   batch 2) and white-house (batch 1), both already applied, so not redefined here. federal-hall is not used in this batch.
#   The Jimmy Carter House is marked not visitable (a private home inside
#   the National Historical Park; the article does not say it is open).
# - Burial years: Ford was buried in January 2007 (he died on 26 December 2006) and Carter in January 2025 (died 29 December 2024).
# - Discrepancies: none found. The articles agree with their infoboxes on every date and place used here.
# - Family: George H. W. Bush -> George W. Bush (both articles).

