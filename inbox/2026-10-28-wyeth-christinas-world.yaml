# Andrew Wyeth and Christina's World (1948): the painter, the painting, the people and place around it, and four
# other key works. Ty asked for this on 2026-10-28 (scope: this painting plus key works; people: close circle).
# Facts read on 2026-10-28 from English Wikipedia (Andrew Wyeth, Christina's World, Olson House, Betsy Wyeth,
# N. C. Wyeth, The Helga Pictures, Winter 1946, Wind from the Sea) and MoMA's open collection data (CC0, GitHub).
# Stated honestly:
#  - No image of Christina's World, Wind from the Sea, Winter 1946, Public Sale or Braids: they are 20th-century
#    works whose Commons status is not public domain or free, so the image fields are left out.
#  - Ty's caption says Wyeth enlarged the field and that the body is modelled on Betsy, 26. Wikipedia says Betsy posed
#    for the torso and Wyeth "altered the land's lay" and separated the house from its barn; it does not say the field
#    was enlarged. Betsy was born 1921-09-26, so she was 26 for most of 1948. Ty's caption is kept in the private log.
#  - Where Wikipedia pages disagree, a discrepancy is recorded (Braids date, size of the Helga series, Helga's birth
#    year, Christina's diagnosis).
#  - Christina Olson, Alvaro Olson and Helga Testorf have no Wikipedia article of their own (Christina redirects to the
#    painting's article); they cite the article that covers them. Alvaro's birth year is not given anywhere read.
#  - Wyeth's burial place is from his article (Hathorn Cemetery, Cushing); the Olson House article's claim that he lies
#    in the Olson family cemetery is tagged "citation needed", so it is not used.
batch:
  title: "Andrew Wyeth and Christina's World"
