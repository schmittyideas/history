    museum_url: https://www.moma.org/collection/works/78455
    # No image: a 1948 work, not public domain or freely licensed on Commons.
    prominence: 5
    note: "Wyeth painted Christina Olson (55 per Wikipedia) crawling across a field toward the Olson House, which he saw from a window of the house. Betsy Wyeth posed for the torso and suggested the title. Wyeth separated the house from its barn and altered the lay of the land. First shown at the Macbeth Gallery, New York, in 1948; bought by MoMA's founding director Alfred Barr for $1,800 (MoMA records it acquired 3 February 1949). Wyeth said he wanted to do justice to her 'extraordinary conquest of a life which most people would consider hopeless'."
