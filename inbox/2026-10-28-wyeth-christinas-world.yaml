log:
  - key: 2026-10-28-christinas-world-caption
    title: "Christina's World: how much of it is invented?"
    learned_on: 2026-10-28
    medium: article
    source_title: "Museum-style caption supplied by Ty"
    source_detail: "Christina's World (1948), Andrew Wyeth, MoMA"
    notes: >-
      Caption text: the enormous distance is partly invented; Wyeth enlarged the field so the farmhouse feels farther
      from Christina, who could not walk; she was about 55, and much of the younger body was modelled on his
      26-year-old wife Betsy. Ty's question: does that honour Christina, or reshape her for us? Checked against
      Wikipedia: Betsy posed for the torso (agreed), Wyeth altered the land and moved the house from its barn
      (partly agrees), but no source read says the field was enlarged.
    details:
      follow_up: ["Find a source for the enlarged field", "Read the Farnsworth Art Museum's Olson House notes"]
    about:
      - {person: andrew-wyeth}
      - {person: christina-olson}
      - {person: betsy-wyeth}
      - {place: olson-house}
