      - {place: industry-hills-mountain-bike-course, role: venue, note: "Mountain biking (17-18 July)"}
      - {place: riviera-country-club, role: venue, note: "Golf (19-29 July)"}
      - {place: rose-bowl-aquatics-center, role: venue, note: "Diving (16-22 and 25-28 July)"}
      - {place: santa-anita-park, role: venue, note: "Equestrian: eventing 15-18, dressage 20-24, jumping 25-29 July (calendar; see discrepancy)"}
      - {place: trestles-surfing, role: venue, note: "Surfing (15-18 July)"}
      - {place: universal-studios-hollywood, role: venue, note: "Squash (15-24 July, its Olympic debut) on the Universal Studios Lot"}
