      - {place: sofi-stadium, role: venue, note: "Swimming (22-30 July); opening ceremony with the Coliseum (14 July)"}
      - {place: dodger-stadium, role: venue, note: "Baseball (13-19 July), as in 1984"}
      - {place: crypto-com-arena, role: venue, note: "Artistic gymnastics (15-25 July), trampoline (21 July), boxing finals (27-30 July)"}
      - {place: intuit-dome, role: venue, note: "Basketball (12-30 July)"}
