# Los Angeles 2028: the Summer Olympics and Paralympics, and where they will happen.
# VERIFIED against English Wikipedia articles downloaded on 2026-10-10 (wikitext; revision IDs below):
#   "2028 Summer Olympics" rev 1378337444 (dates, ceremonies, venues section and the competition calendar,
#   which the article dates to LA28's schedule of 12 November 2025); "Venues of the 2028 Summer Olympics and
#   Paralympics" rev 1379633073 (venue tables, last venue-plan update 15 April 2025, Paralympic plan 3 June 2025);
#   "2028 Summer Paralympics" rev 1374314041; each venue's own article; and the sport articles that exist
#   (most "<sport> at the 2028 Summer Olympics" titles still redirect to the main article).
# THE PLAN IS STILL CHANGING. Every date here is the scheduled date as of those revisions, not something that
# has happened; the notes say so. Where articles disagree there is a `discrepancies` entry.
#
# MODELLING. The Games are one event, 2028-summer-olympics (named like 1932-summer-olympics and
# 1984-summer-olympics, type "Olympic Games"), with the Coliseum as its main `place` and every other venue linked
# through the event's `places` list (event_places, sql/016): role venue, start, finish or village, and a note
# with the sports held there and their scheduled days (from the Olympic calendar). No per-sport events. The
# Paralympics are one event with SoFi Stadium (their opening ceremony) as main place and their venues the same
# way. The Olympic opening ceremony (SoFi Stadium, co-hosted by the Coliseum) and closing ceremony (Coliseum)
# are events of their own.
#
# EVERY SPORT-VENUE PAIRING is confirmed in two places: the venues article plus the sport's own article or the
# venue's own article. Temporary venues on an existing site are that site (Sepulveda Basin, Venice Beach, the
# Long Beach waterfront = Downtown Long Beach, Alamitos Beach). Existing keys reused: los-angeles-memorial-coliseum,
# dodger-stadium, griffith-observatory, venice-los-angeles, university-of-california-los-angeles, and
# universal-studios-hollywood (our record for the Universal studio site; squash is on the Universal Studios Lot).
#
# LEFT OUT:
#  - Grand Park (race walking): the venues article marks it "citation needed" and no other article confirms it.
#  - LA Clays Shooting Sports Park / Whittier Narrows Clay Shooting Center, South El Monte (shotgun): only the
#    venues article names it; the South El Monte and Whittier Narrows articles don't, and Shooting has no article.
#  - The six preliminary football stadiums outside the area: Etihad Park (New York), ScottsMiracle-Gro Field
#    (Columbus), Geodis Park (Nashville), Energizer Park (St. Louis), PayPal Park (San Jose) and Snapdragon Stadium
#    (San Diego). The last two are in California but outside Los Angeles County and the agreed extra cities.
#  - Non-competition sites: Main Press Center (NFL Los Angeles at Hollywood Park), International Broadcast Center
#    (Warner Bros. Ranch, Burbank), Media Village (USC), the Oklahoma City University sub-village.
#  - The Olympic marathon route and the race-walk course: not final (see discrepancy 2028-olympic-marathon-start).
#  - Paralympic venue links the venue's own article doesn't confirm: wheelchair tennis at Dignity Health Sports
#    Park and paratriathlon / marathon start at Venice Beach (only the venues article gives them).
#  - Images: Commons licences not checked in this batch.
# Small things noticed: the Diving article once says "16 and 22 June" but means July (its schedule and the main
# calendar say July); the main article gives 351 medal events in its text and 353 in its infobox.
batch:
  title: "Los Angeles 2028 Olympics and Paralympics venues"
  requested: "The 2028 Summer Olympics and Paralympics: the Games, ceremonies and every competition venue in Southern California and Oklahoma City, linked to the Games"
  date: 2026-10-10

