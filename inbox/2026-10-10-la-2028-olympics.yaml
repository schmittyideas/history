      - {place: belmont-veterans-memorial-pier, role: venue, note: "Sailing: kiteboarding and windfoiling (sailing runs 16-28 July)"}
      - {place: port-of-los-angeles, role: venue, note: "Sailing: dinghy, multihull and skiff (sailing runs 16-28 July)"}
      - {place: long-beach-marine-stadium, role: venue, note: "Rowing (15-22 July), canoe sprint (25-29 July), on the 1932 rowing course"}
      - {place: sepulveda-basin-recreation-area, role: venue, note: "Modern pentathlon (15-18 July), BMX (15-16 and 28-29 July), 3x3 basketball (16-22 July), skateboarding (18-20 and 25-27 July)"}
      - {place: knight-riders-cricket-ground, role: venue, note: "T20 cricket: women 12-20 July, men 22-29 July"}
