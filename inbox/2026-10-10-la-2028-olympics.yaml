    date: 2028-07-14
    end_year: 2028
    place: los-angeles-memorial-coliseum
    prominence: 5
    note: "Scheduled for 14-30 July 2028 (as of October 2026): Los Angeles's third Games after 1932 and 1984, making it the third three-time host city after London and Paris. Awarded on 13 September 2017. Some 351 medal events in 36 sports, with flag football and squash new and cricket, lacrosse and baseball/softball returning. The Coliseum, the main site, holds athletics (15-30 July, in the first week for the first time since 1968), the opening ceremony with SoFi Stadium and the closing ceremony; it is the first stadium to host Olympic athletics at three Games. No new permanent venues built for the Games. Dates in the venue notes are from the Olympic calendar (schedule of 12 November 2025)."
