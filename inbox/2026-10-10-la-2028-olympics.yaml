discrepancies:
  - key: 2028-olympics-closing-ceremony-venue
    question: Where will the 2028 Olympic and Paralympic closing ceremonies be held?
    about: [{event: 2028-summer-olympics-closing-ceremony}, {event: 2028-summer-paralympics}]
    field: place
    claims:
      - {value: "Los Angeles Memorial Coliseum (Olympic and Paralympic closing ceremonies)", sources: [wp-2028-summer-olympics, wp-venues-of-the-2028-summer-olympics-and-paralympics, wp-2028-summer-paralympics, wp-los-angeles-memorial-coliseum], note: "LA28's ceremonies plan of 8 May 2025"}
      - {value: "SoFi Stadium hosts the opening and closing ceremonies of both Games, with the Coliseum also in the Olympic ceremonies", sources: [wp-sofi-stadium]}
    note: "The record uses the Coliseum, which four articles and LA28's May 2025 announcement give."
  - key: 2028-olympic-football-rose-bowl-matches
    question: Which 2028 Olympic football matches will the Rose Bowl host?
    about: [{event: 2028-summer-olympics}, {place: rose-bowl-stadium}]
    claims:
      - {value: "Preliminaries and finals", sources: [wp-venues-of-the-2028-summer-olympics-and-paralympics], note: "Its table; the same article says all preliminary matches were moved out of Los Angeles in April 2025"}
      - {value: "All semifinals, bronze-medal and gold-medal matches", sources: [wp-football-at-the-2028-summer-olympics]}
      - {value: "A women's quarterfinal (21 July), both semifinals and both gold-medal matches; no bronze match listed", sources: [wp-rose-bowl-stadium]}
    note: "The Rose Bowl venue note says knockout matches and finals from the first semifinal on 24 July, which all agree on. Schedule as released 16 March 2026."
  - key: 2028-olympic-mens-football-final-date
    question: On what day is the 2028 Olympic men's football final?
    about: [{event: 2028-summer-olympics}, {place: rose-bowl-stadium}]
    field: date
    claims:
      - {value: "2028-07-28", sources: [wp-football-at-the-2028-summer-olympics, wp-2028-summer-olympics], note: "Football schedule table; the Olympic calendar has football gold medals on 28 and 29 July"}
      - {value: "2028-07-29 (same day as the women's final)", sources: [wp-rose-bowl-stadium]}
    note: "Only the Rose Bowl venue note touches it (medal matches 27-29 July either way)."
  - key: 2028-olympic-equestrian-dates
    question: When will the 2028 Olympic equestrian events be held?
    about: [{event: 2028-summer-olympics}, {place: santa-anita-park}]
    field: date
    claims:
      - {value: "15-29 July 2028 (eventing 15-18, dressage 20-24, jumping 25-29)", sources: [wp-2028-summer-olympics], note: "Olympic calendar, schedule of 12 November 2025"}
      - {value: "27 July to 6 August 2028", sources: [wp-equestrian-events-at-the-2028-summer-olympics]}
    note: "The Santa Anita venue note uses the Olympic calendar: the Games close on 30 July, so 6 August looks out of date."
  - key: 2028-olympic-marathon-start
    question: Where do the 2028 Olympic marathons start and finish?
    about: [{event: 2028-summer-olympics}, {place: venice-los-angeles}]
    field: place
    claims:
      - {value: "Start at Venice Beach (Boardwalk)", sources: [wp-venues-of-the-2028-summer-olympics-and-paralympics, wp-athletics-at-the-2028-summer-olympics, wp-venice-los-angeles], note: "Venue plan update of 15 April 2025"}
      - {value: "Start and finish not yet decided as of July 2026; to be finalised later in 2026", sources: [wp-venues-of-the-2028-summer-olympics-and-paralympics], note: "Citing LA28, 9 June 2025"}
    note: "Venice Beach is linked for triathlon and the road-race start; its note gives the marathon start only as planned."
  - key: 2028-olympic-modern-pentathlon-venue
    question: Where will 2028 Olympic modern pentathlon be held?
    about: [{event: 2028-summer-olympics}, {place: sepulveda-basin-recreation-area}, {place: velo-sports-center}]
    field: place
    claims:
      - {value: "Sepulveda Basin Recreation Area (Valley Complex 2)", sources: [wp-venues-of-the-2028-summer-olympics-and-paralympics, wp-sepulveda-dam]}
      - {value: "The fencing part at the Velo Sports Center, Carson", sources: [wp-velo-sports-center]}
