      - {place: dignity-health-sports-park, role: venue, note: "Field hockey (12-29 July), rugby sevens (12-18 July), archery (19-28 July), tennis (19-28 July)"}
      - {place: velo-sports-center, role: venue, note: "Track cycling (25-30 July)"}
      - {place: los-angeles-convention-center, role: venue, note: "Fencing (15-23 July), judo (15-22), table tennis (15-29), wrestling (24-30), taekwondo (26-29)"}
      - {place: peacock-theater, role: venue, note: "Boxing preliminaries (from 15 July), weightlifting (25-29 July)"}
      - {place: bmo-stadium, role: venue, note: "Flag football (15-22 July, its Olympic debut), lacrosse (24-29 July)"}
      - {place: galen-center, role: venue, note: "Badminton (15-24 July), rhythmic gymnastics (27-29 July)"}
