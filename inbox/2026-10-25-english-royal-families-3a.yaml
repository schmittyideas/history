batch:
  title: "English royal families 3a: Lancaster and York, 1399-1485"
  requested: "Issue #292: parents, spouses (with marriage year) and children who reached 12 for Henry IV, Henry V, Henry VI, Edward IV, Edward V and Richard III"
  date: 2026-10-25
  notes: "Family links for the Lancastrian and Yorkist kings, with sex on each king and their family. Part 3b covers the Tudors and Philip II."

# Notes for the reviewer
# - Facts checked against each person's own English Wikipedia article (fetched 2026-10-25 with tools/wiki.py).
# - Children left out because they died before 12: Richard of Shrewsbury, Duke of York (b. 1473, disappeared 1483 aged 9),
#   Margaret of York (1472) and George, Duke of Bedford (1477-1479), children of Edward IV; Edward of Middleham (d. 1484 aged
#   about 7-10), son of Richard III. Henry IV and Joan of Navarre had no surviving children. No illegitimate children.
# - John of Gaunt is a child of Edward III, whom batch 2 covers; he is defined here with the same key (john-of-gaunt) so this
#   file works whichever merges first. His link to Edward III and Philippa of Hainault is left to batch 2.
# - Elizabeth of York is defined in both 3a and 3b (same key and fields); her moments are only here.
# - Places left out (article unsure or silent): Thomas, Duke of Clarence's birthplace ("probably London, but some sources give
#   Kenilworth"); Cecily of York's burial ("one version" Quarr Abbey, Isle of Wight, versus Hatfield per Rosemary Horrox);
#   Catherine of York's birthplace ("the alleged birthplace is Eltham Palace"). No birthplace in the articles for Mary de Bohun,
#   Joan of Navarre, John of Bedford, Humphrey of Gloucester, Richard of York.
# - Clarence's burial: his article says his remains went "to Canterbury for their interment", so the moment uses the city.
# - Burial moments without a year are reburials the article dates no further (Richard of York, first buried at Pontefract and
#   later moved to Fotheringhay; Anne of York, first buried at Thetford Priory and later moved to Framlingham).
# - Richard of York's article gives 21 September 1411 in the lead and 22 September in "Descent"; the lead (and Wikidata) is used.
# - Bridget of York: Wikidata still says 1517, but her article says she was dead by December 1507 (Henry VII paid for her grave
#   stone), as Elizabeth Woodville's article also gives 1507; died 1507, estimated.
# - Philippa of England is "mid-1394" and Blanche of England "spring 1392" in their articles: years only.
# - Blanche of England's burial church (St Mary's, now St Aegidius, Neustadt) has no article: the moment uses Neustadt itself.

