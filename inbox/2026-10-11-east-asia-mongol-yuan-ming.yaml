batch:
  title: "The Mongol Empire, the Yuan dynasty and the Ming dynasty, 1206-1620"
  requested: "Twenty-one rulers and the admiral Zheng He, from Genghis Khan to the Wanli Emperor, with reigns, key events, places and discrepancies"
  date: 2026-10-11

# Notes for the reviewer
# - Source: local copies of the English Wikipedia articles (wp4 directory); nothing fetched. Facts are taken only from those articles; coordinates come from general knowledge (2-3 decimals). The first line of every file was checked. All 23 requested files are present and on the right article. The Zhengtong article is the file Zhengtong_Emperor.txt (its first line is "Emperor Yingzong of Ming"; there is no file called Emperor_Yingzong_of_Ming.txt). Its source URL is the one in that file's header.
# - Existing records: none of these people exist. beijing, yamen-battlefield are defined by batch A and only referenced here (Dadu/Khanbaliq/Zhongdu, the Ming capital after 1420, and the last battle of the Song). Mongol_invasions_of_Japan was read for context only: the events mongol-invasions-of-japan-1274 and -1281 are batch C's and are not defined or linked here. Kublai's part in them is not entered as a link; it is the subject of his own article only.
# - New realms defined here: Mongol Empire (Central Asia, Mongolia), Yuan dynasty (East Asia, China), Ming dynasty (East Asia, China). Title wordings: "Great Khan", "Emperor of the Yuan", "Emperor of the Ming". Person keys are ASCII (temur-khan, kulug-khan, toghon-temur, ogedei-khan, mongke-khan).
# - Two title rows each for Kublai Khan (Great Khan from 5 May 1260 and Emperor of the Yuan from 1271) and for Emperor Yingzong of Ming (Emperor of the Ming 1435-1449 as Zhengtong and 1457-1464 as Tianshun). Temur Khan and Kulug Khan are called nominal Great Khans (sixth and seventh) in their articles, but the articles say the title was only nominal after the empire divided; they get one row, Emperor of the Yuan. Genghis Khan's Great Khan row runs from the 1206 kurultai to 1227. The Mongol khans of the Golden Horde, Ilkhanate and Chagatai Khanate are not entered.
# - Dates the articles do not give, so the title rows use the year only: Zhengtong's accession (the article says only that Xuande died on 31 January 1435), the Chenghua accession (Yingzong died 23 February 1464; the article gives no enthronement day), the Longqing accession (twelve days after 23 January 1567; no date), Toghon Temur's accession (1333, after a six-month delay) and his departure from Dadu (1368; the Red Turban article puts the fall of Khanbaliq on 14 September 1368, but the Toghon Temur article gives only the year).
# - Genghis Khan: born c.1162 (estimated; see discrepancy) and died 1227 (18 or 25 August; the day is not entered). Ogedei Khan born c.1186. Zheng He: died 1433 (estimated; see discrepancy). The birth place of Genghis (Delun Boldog, disputed between two places) and his burial place (Burkhan Khaldun) have no place records; neither has Mongke's death at Diaoyu, the Yongle Emperor's death at Yumuchuan, or the Toghon Temur death at Yingchang.
# - Places defined (all are given a role in an article): karakorum, shangdu, nanjing, forbidden-city, ming-tombs, tumu-fortress. Hongwu's Xiao Mausoleum and Zheng He's cenotaph are in the notes of nanjing; the other Ming tombs are mentioned in the ming-tombs note. The Tumu coordinates are approximate (the article names the post station, not a modern site). The Beijing/Dadu/Khanbaliq/Zhongdu/Beiping naming is in the events, not redefined.
# - Left out: consorts and most children; the Mongol conquests of Khwarazm, Rus', Persia, Syria and Korea (Korea is batch D's); the Mongol invasions of Vietnam, Burma, Java; the Yongle campaigns in Mongolia and Dai Viet (no clear single date); the Imjin War (batch D's); Zhengde's and Wanli's campaigns (Ningxia, the Three Great Campaigns); Wanli's restoration of the Jianwen era in 1595; Altan Khan's 1550 raid; the Great Rites Controversy. Hongxi's plan to move the capital back to Nanjing (16 April 1425) is not an event. The Hongxi, Xuande and Chenghua tombs have no place records.
# - Discrepancies recorded below: Genghis Khan's birth year (1155, 1162, 1167) and day of death; Kublai's proclamation as Great Khan (15 April or 5 May 1260, both in his article); the end of the Song (1276 or 1279) and 1271 against 1279 as the date of the Yuan; Mongke's accession and death; the date Shangdu fell (1369 or 1370); the Jianwen Emperor's fate; the Jingtai Emperor's birth day (21 or 11 September 1428) and accession day (17 or 23 September 1449); Zheng He's death year (1433 or 1435); the Karakorum building dates. Seen and not entered as records: the Yongle article says the Beijing capital "from 1421" and the Beijing authorities "principal capital on 28 October 1420" (both used in the event note, not a conflict); the Zhengde/Jiajing/Chenghua articles all agree on the dates used here.
# - Lunar/Gregorian: none of these articles puts a death in a lunar month that crosses into the next Gregorian year. All dates are as the articles write them.
# - Size: 21 people, 22 title rows, 3 realms, 6 places, 17 events, 11 discrepancies, 11 links, 17 moments (about 108 rows plus sources).

