titles:
  # Mongol Empire and Yuan
  - {person: genghis-khan, title: Great Khan, realm: Mongol Empire, from: 1206, to: 1227, note: "Adopted the title Genghis Khan at the kurultai at the source of the Onon River in 1206. Died in 1227 (18 or 25 August; see the discrepancy). Tolui held the regency until Ogedei was elected in 1229", sources: [wp-genghis-khan]}
  - {person: ogedei-khan, title: Great Khan, realm: Mongol Empire, from: 1229-09-13, to: 1241-12-11, note: "Proclaimed Khan at the Kurultai of the Kherlen's Khodoo Aral on 13 September 1229, after ritually declining three times. Died at dawn on 11 December 1241", sources: [wp-ogedei-khan]}
  - {person: mongke-khan, title: Great Khan, realm: Mongol Empire, from: 1251-07-01, to: 1259-08-11, note: "The lead gives the reign as 1 July 1251 to 11 August 1259; the text says he sent envoys to Goryeo announcing his coronation in October 1251 (see the discrepancy)", sources: [wp-mongke-khan]}
  - {person: kublai-khan, title: Great Khan, realm: Mongol Empire, from: 1260-05-05, to: 1294-02-18, note: "Proclaimed Khagan at his residence in Shangdu on 5 May 1260 (the article's Capital section); the kurultai that proclaimed him is dated 15 April 1260 earlier in the same article (see the discrepancy). Rival Ariq Boke, elected at Karakorum, surrendered at Xanadu on 21 August 1264. Real power was limited to the Yuan lands. Died 18 February 1294", sources: [wp-kublai-khan]}
  - {person: kublai-khan, title: Emperor of the Yuan, realm: Yuan dynasty, from: 1271, to: 1294-02-18, note: "The article says he proclaimed the dynastic name Great Yuan in 1271 (no day) and the capital Dadu the following year. The Song was finished in 1279 (see the discrepancy). Died 18 February 1294", sources: [wp-kublai-khan]}
  - {person: temur-khan, title: Emperor of the Yuan, realm: Yuan dynasty, from: 1294-05-10, to: 1307-02-10, note: "Lead: ruled 10 May 1294 to 10 February 1307. Called the sixth Great Khan of the Mongol Empire in the article, but only nominally, so no Great Khan row", sources: [wp-temur-khan]}
  - {person: kulug-khan, title: Emperor of the Yuan, realm: Yuan dynasty, from: 1307-06-21, to: 1311-01-27, note: "Enthroned at a kurultai in Shangdu on 21 June 1307. Called the seventh Great Khan of the Mongol Empire in the article, but only nominally, so no Great Khan row. Died suddenly on 27 January 1311", sources: [wp-kulug-khan]}
  - {person: toghon-temur, title: Emperor of the Yuan, realm: Yuan dynasty, from: 1333, to: 1368, note: "Acceded in 1333 after El Temur delayed the enthronement six months (no day given). The Yuan in China ended when the Ming took Khanbaliq in September 1368 and he withdrew to Shangdu; the remnant court is the Northern Yuan, which he ruled until his death on 23 May 1370", sources: [wp-toghon-temur, wp-red-turban-rebellions]}
  # Ming
  - {person: hongwu-emperor, title: Emperor of the Ming, realm: Ming dynasty, from: 1368-01-23, to: 1398-06-24, note: "Proclaimed himself emperor and named the dynasty Great Ming on 23 January 1368; the first year of the Hongwu era. Died 24 June 1398", sources: [wp-hongwu-emperor]}
  - {person: jianwen-emperor, title: Emperor of the Ming, realm: Ming dynasty, from: 1398-06-30, to: 1402-07-13, note: "Ascended on 30 June 1398. Nanjing opened its gates on 13 July 1402; his fate after the palace fire is disputed (see the discrepancy). The Yongle Emperor erased his era; the Wanli Emperor restored it in 1595", sources: [wp-jianwen-emperor]}
  - {person: yongle-emperor, title: Emperor of the Ming, realm: Ming dynasty, from: 1402-07-17, to: 1424-08-12, note: "Enthroned 17 July 1402, four days after entering Nanjing. Died 12 August 1424 at Yumuchuan", sources: [wp-yongle-emperor, wp-jianwen-emperor]}
  - {person: hongxi-emperor, title: Emperor of the Ming, realm: Ming dynasty, from: 1424-09-07, to: 1425-05-29, note: "Became emperor on 7 September 1424, 26 days after his father's death. Died 29 May 1425", sources: [wp-hongxi-emperor]}
  - {person: xuande-emperor, title: Emperor of the Ming, realm: Ming dynasty, from: 1425-06-27, to: 1435-01-31, note: "Ascended the throne in Beijing on 27 June 1425. Died 31 January 1435", sources: [wp-xuande-emperor]}
  - {person: emperor-yingzong-of-ming, title: Emperor of the Ming, realm: Ming dynasty, from: 1435, to: 1449-09-17, key: emperor-yingzong-of-ming--zhengtong, note: "First reign, as the Zhengtong Emperor. The article gives no accession day (Xuande died 31 January 1435); aged eight. Captured at Tumu on 1 September 1449; the Jingtai Emperor was enthroned on 17 September and made him Emperor Emeritus (see the Jingtai accession discrepancy)", sources: [wp-emperor-yingzong-of-ming, wp-tumu-crisis]}
  - {person: jingtai-emperor, title: Emperor of the Ming, realm: Ming dynasty, from: 1449-09-17, to: 1457-02-11, note: "Enthroned on 17 (or 23) September 1449 after Empress Dowager Sun made him administrator on 4 September. Deposed in the coup of 11 February 1457; died 14 March 1457", sources: [wp-jingtai-emperor, wp-tumu-crisis]}
  - {person: emperor-yingzong-of-ming, title: Emperor of the Ming, realm: Ming dynasty, from: 1457-02-11, to: 1464-02-23, key: emperor-yingzong-of-ming--tianshun, note: "Second reign, as the Tianshun Emperor, from the night coup of 11 February 1457 (the seizure of the gate). Died 23 February 1464", sources: [wp-emperor-yingzong-of-ming]}
  - {person: chenghua-emperor, title: Emperor of the Ming, realm: Ming dynasty, from: 1464, to: 1487-09-09, note: "The article gives no enthronement day (Yingzong died 23 February 1464, and a council was appointed the next day). Died 9 September 1487", sources: [wp-chenghua-emperor]}
  - {person: hongzhi-emperor, title: Emperor of the Ming, realm: Ming dynasty, from: 1487-09-17, to: 1505-06-08, note: "Ascended 17 September 1487, eight days after his father's death. Died 8 June 1505", sources: [wp-hongzhi-emperor]}
  - {person: zhengde-emperor, title: Emperor of the Ming, realm: Ming dynasty, from: 1505-06-19, to: 1521-04-20, note: "Ascended on 19 June 1505, eleven days after his father's death. Died 20 April 1521 without an heir", sources: [wp-zhengde-emperor]}
  - {person: jiajing-emperor, title: Emperor of the Ming, realm: Ming dynasty, from: 1521-05-27, to: 1567-01-23, note: "Ceremonially ascended in Beijing on 27 May 1521 after forcing the court to welcome him as emperor, not heir. Died 23 January 1567", sources: [wp-jiajing-emperor]}
  - {person: longqing-emperor, title: Emperor of the Ming, realm: Ming dynasty, from: 1567, to: 1572-07-05, note: "The article says he became emperor twelve days after the Jiajing Emperor's death on 23 January 1567 and gives no date. Died 5 July 1572", sources: [wp-longqing-emperor]}
  - {person: wanli-emperor, title: Emperor of the Ming, realm: Ming dynasty, from: 1572-07-19, to: 1620-08-18, note: "Succeeded two weeks after his father's death, on 19 July 1572, aged nine. Longest reign of the Ming (48 years). Died 18 August 1620", sources: [wp-wanli-emperor]}

places:
  - key: karakorum
    name: Karakorum
    kind: city
    region: Övörkhangai
    country: Mongolia
    lat: 47.198
    lng: 102.846
    visitable: true
    founded: 1235
    built_by: "Ogedei Khan; decorated by Mongke Khan"
    note: "Capital of the Mongol Empire. The Ogedei article dates the completion of the city to 1235 and also says palaces were built from 1235 to 1238 (see the discrepancy). Mongke decorated it with Chinese, European and Persian architecture; William of Rubruck visited in 1253. The war between Kublai and Ariq Boke destroyed it. Kublai's move to Khanbaliq provoked an uprising there; the Northern Yuan court withdrew to it in 1370."
    sources: [wp-ogedei-khan, wp-mongke-khan, wp-kublai-khan, wp-toghon-temur]
  - key: shangdu
    name: Shangdu (Xanadu)
    historical_name: Shangdu, "Upper Capital", also called Xanadu
    kind: city
    region: Inner Mongolia
    country: China
    lat: 42.358
    lng: 116.179
    visitable: true
    note: "Kublai Khan's summer capital, near what is today Dolon Nor. Kublai was proclaimed Khagan here on 5 May 1260; Ariq Boke surrendered to him at Xanadu on 21 August 1264. Temur Khan's kurultai (1294) and Kulug Khan's enthronement (21 June 1307) were held here. Toghon Temur retreated here from Dadu in 1368. The Ming took it in 1369 or 1370 (see the discrepancy)."
    sources: [wp-kublai-khan, wp-temur-khan, wp-kulug-khan, wp-toghon-temur, wp-red-turban-rebellions]
  - key: nanjing
    name: Nanjing
    historical_name: Yingtian
    kind: city
    region: Jiangsu
    country: China
    lat: 32.06
    lng: 118.797
    visitable: true
    visit_site: "Xiaoling Mausoleum of the Ming (Hongwu Emperor's tomb) and Zheng He's tomb on Cattle Head Hill"
    note: "Zhu Yuanzhang took the city on 10 April 1356, renamed it Yingtian and made it his capital; the first Ming capital, with 26 km of walls. The Hongwu Emperor was buried in the Xiao Mausoleum on the south side of Purple Mountain, east of the city. Zhu Di's army entered on 13 July 1402, ending the Jianwen Emperor's reign. Zheng He's treasure fleet was built and prepared here (a foreign-language institute and the Treasure Shipyard), and he held the post of Defender of Nanjing from 1425. Beijing replaced it as the principal capital in 1420."
    sources: [wp-hongwu-emperor, wp-red-turban-rebellions, wp-jianwen-emperor, wp-yongle-emperor, wp-zheng-he]
  - key: forbidden-city
    name: Forbidden City
    kind: palace
    city: Beijing
    region: Beijing
    country: China
    lat: 39.916
    lng: 116.397
    visitable: true
    visit_site: "Palace Museum"
    founded: 1420
    built_by: "Yongle Emperor"
    architect: "Cai Xin, Nguyen An, Kuai Xiang and Lu Xiang (chief architects and engineers, per the Yongle article)"
    note: "Built for the new capital between 1407 and 1420; most palaces were done by the end of 1417 and the city was ready for the government in 1420. Three audience halls burned in 1421 and again in 1557 (rebuilt by 1562); more palaces burned in April 1596. The Xuande Emperor died in the Palace of Heavenly Purity (1435). The Southern Palace in the southeast corner held the former Emperor Yingzong from 1450 to 1457. The Jiajing Emperor died here in 1567."
    sources: [wp-yongle-emperor, wp-xuande-emperor, wp-emperor-yingzong-of-ming, wp-jiajing-emperor, wp-wanli-emperor]
  - key: ming-tombs
    name: Ming tombs
    kind: tomb complex
    city: Beijing
    region: Beijing
    country: China
    lat: 40.296
    lng: 116.241
    visitable: true
    visit_site: "Ming Dynasty Tombs (Changling and Dingling are open)"
    note: "The imperial burial ground north of Beijing at the foot of Tianshou Mountain, where thirteen of the sixteen Ming emperors lie. Chang Mausoleum (the Yongle Emperor, the first of the tombs), Yong Mausoleum (Jiajing), Zhao Mausoleum (Longqing) and Ding Mausoleum (Wanli, built 1584-1590 and excavated 1956-1957) are named in the articles."
    sources: [wp-yongle-emperor, wp-jiajing-emperor, wp-longqing-emperor, wp-wanli-emperor]
  - key: tumu-fortress
    name: Tumu Fortress
    historical_name: Tumu post station
    kind: battlefield
    region: Hebei
    country: China
    lat: 40.33
    lng: 115.65
    note: "Site of the Ming camp on 31 August 1449 and of the battle on 1 September in which the Oirat Mongols under Esen Taishi defeated the Ming army and captured Emperor Yingzong. The article names the post station, not a modern site; the point is approximate (near Huailai, Hebei)."
    sources: [wp-tumu-crisis, wp-emperor-yingzong-of-ming]

events:
  - key: proclamation-of-genghis-khan-1206
    name: Kurultai proclaiming Genghis Khan
    type: Proclamation
    year: 1206
    people:
      - {person: genghis-khan, role: proclaimed}
    prominence: 5
    note: "After defeating the Naiman and executing Jamukha, Temujin held a large kurultai at the source of the Onon River and formally adopted the title Genghis Khan; the keshig was enlarged to 10,000 men and the tribal structure reorganised."
    sources: [wp-genghis-khan]
  - key: fall-of-zhongdu-1215
    name: Mongol capture of Zhongdu
    type: Siege
    date: 1215-05-31
    place: beijing
    people:
      - {person: genghis-khan, role: victor}
    prominence: 4
    note: "Genghis Khan invaded the Jin dynasty in May 1211. The Jin moved their court south to Kaifeng; the inhabitants of the Jin capital Zhongdu surrendered on 31 May 1215 but the city was sacked. Zhongdu is the later Dadu and Beijing."
    sources: [wp-genghis-khan]
  - key: mongol-conquest-of-western-xia-1227
    name: Mongol conquest of Western Xia
    type: Campaign
    year: 1227
    people:
      - {person: genghis-khan, role: commander}
    prominence: 4
    note: "Genghis raided Western Xia in 1209 and the Xia agreed to terms in 1210. He returned in 1226 when the Xia stopped supporting the Mongols, fell from his horse while hunting in the winter of 1226-1227, and died on 18 or 25 August 1227 during the siege of Zhongxing. The city fell the following month and was put to the sword. The month and year (September 1227) are not given as a day. No place defined."
    sources: [wp-genghis-khan]
  - key: mongol-conquest-of-jin-1234
    name: End of the Jin dynasty
    type: Campaign
    year: 1234
    people:
      - {person: ogedei-khan, role: commander}
    prominence: 3
    note: "After taking several cities, the Mongols, with the belated help of the Song, destroyed the Jin with the fall of Caizhou in February 1234 (no day given)."
    sources: [wp-ogedei-khan]
  - key: toluid-civil-war-1260
    name: Toluid Civil War
    type: Civil war
    year: 1260
    end_year: 1264
    place: shangdu
    people:
      - {person: kublai-khan, role: victor}
    prominence: 3
    note: "Fought after Mongke's death in 1259 between Kublai and his younger brother Ariq Boke, who held a rival kurultai at Karakorum. Ariq Boke surrendered at Xanadu on 21 August 1264. It began the division of the Mongol Empire."
    sources: [wp-kublai-khan, wp-mongke-khan]
  - key: kublai-proclaimed-great-khan-1260
    name: Kublai Khan proclaimed Great Khan
    type: Proclamation
    date: 1260-05-05
    place: shangdu
    people:
      - {person: kublai-khan, role: proclaimed}
    prominence: 4
    note: "The Capital section says he was proclaimed Khagan at his residence in Shangdu on 5 May 1260; the earlier narrative says the kurultai he summoned proclaimed him on 15 April 1260 (see the discrepancy). Few of Genghis Khan's descendants attended, and Ariq Boke had already been elected at Karakorum."
    sources: [wp-kublai-khan]
  - key: founding-of-yuan-dynasty-1271
    name: Kublai proclaims the Yuan dynasty
    type: Founding
    year: 1271
    places:
      - {place: beijing, role: capital, note: "Dadu (Khanbaliq) proclaimed the capital in 1272"}
    people:
      - {person: kublai-khan, role: founder}
    prominence: 4
    note: "In the eighth year of Zhiyuan (1271) Kublai renamed the Mongol regime in China Dai Yuan and claimed succession from earlier Chinese dynasties; the capital Dadu followed in 1272 and Shangdu was the summer capital. The Yuan ruled all of China proper only after 1279."
    sources: [wp-kublai-khan]
  - key: fall-of-southern-song-1279
    name: Yuan conquest of the Southern Song
    type: Conquest
    year: 1279
    place: yamen-battlefield
    people:
      - {person: kublai-khan, role: victor}
    prominence: 4
    note: "The Song imperial family surrendered in 1276; three years later Yuan marines crushed the last Song loyalists at Yamen, where the child emperor Zhao Bing drowned, ending the Song dynasty and making Kublai the first non-Han emperor of all China proper."
    sources: [wp-kublai-khan]
  - key: red-turban-rebellions-1351
    name: Red Turban Rebellions
    type: Rebellion
    year: 1351
    end_year: 1368
    people:
      - {person: hongwu-emperor, role: rebel leader}
      - {person: toghon-temur, role: opponent}
    prominence: 4
    note: "Uprisings against the Yuan from 1351 to 1368, following floods, famine, epidemics and the Yuan court's inability to keep order; religious sects waiting for Maitreya joined the movement. Zhu Yuanzhang joined in 1352, took Nanjing in 1356 and defeated Chen Youliang, Zhang Shicheng and Fang Guozhen. Ming armies entered Dadu in September 1368."
    sources: [wp-red-turban-rebellions, wp-hongwu-emperor, wp-toghon-temur]
  - key: founding-of-ming-dynasty-1368
    name: Founding of the Ming dynasty
    type: Founding
    date: 1368-01-23
    people:
      - {person: hongwu-emperor, role: founder}
    prominence: 5
    note: "Zhu Yuanzhang proclaimed himself emperor on 23 January 1368, renamed his state Great Ming and made 1368 the first year of the Hongwu era. The article does not name the place."
    sources: [wp-hongwu-emperor]
  - key: fall-of-dadu-1368
    name: Ming capture of Dadu
    type: Siege
    date: 1368-09-14
    place: beijing
    people:
      - {person: hongwu-emperor, role: victor}
      - {person: toghon-temur, role: defeated}
    prominence: 4
    note: "Ming general Xu Da took Tongzhou on 10 September 1368 and Khanbaliq fell on 14 September (Red Turban article); Toghon Temur fled to Shangdu, ending the Yuan in China. The Hongwu article says only that the army reached Dadu in early September. The city was renamed Beiping."
    sources: [wp-red-turban-rebellions, wp-hongwu-emperor, wp-toghon-temur]
  - key: jingnan-campaign-1399
    name: Jingnan campaign
    type: Civil war
    year: 1399
    end_year: 1402
    place: nanjing
    people:
      - {person: yongle-emperor, role: victor}
      - {person: jianwen-emperor, role: defeated}
      - {person: zheng-he, role: participant}
    prominence: 4
    note: "Zhu Di, Prince of Yan, rebelled against his nephew the Jianwen Emperor in 1399 after the court moved to reduce the princes. After three years the rebels crossed the Yangtze and Nanjing opened its gates on 13 July 1402; the palace burned. Zhu Di was enthroned on 17 July."
    sources: [wp-jianwen-emperor, wp-yongle-emperor, wp-zheng-he]
  - key: zheng-he-treasure-voyages-1405
    name: Zheng He's treasure voyages
    type: Voyage
    year: 1405
    end_year: 1433
    place: nanjing
    people:
      - {person: zheng-he, role: commander}
      - {person: yongle-emperor, role: patron}
      - {person: xuande-emperor, role: patron}
    prominence: 4
    note: "Seven voyages through the Indian Ocean under the Yongle and Xuande emperors, the first departing on 11 July 1405 and the last in 1431-1433; the fleets reached Southeast Asia, India, the Persian Gulf, Arabia and East Africa. The Hongxi Emperor ended them on his enthronement (7 September 1424) and the Xuande Emperor allowed the seventh."
    sources: [wp-zheng-he, wp-yongle-emperor, wp-hongxi-emperor, wp-xuande-emperor]
  - key: ming-capital-moved-to-beijing-1420
    name: Ming capital moved to Beijing
    type: Political
    date: 1420-10-28
    place: beijing
    places:
      - {place: forbidden-city, role: palace, note: "New imperial palace, ready for the government in 1420"}
    people:
      - {person: yongle-emperor, role: ordered}
    prominence: 4
    note: "On 28 October 1420 the Yongle Emperor declared Beijing the principal capital, and by February 1421 the ministries had moved; the Beijing authorities governed the empire from 1421. Beijing, called Beiping until 1403, had been a second capital since February 1403."
    sources: [wp-yongle-emperor]
  - key: tumu-crisis-1449
    name: Tumu Crisis
    type: Battle
    date: 1449-09-01
    place: tumu-fortress
    people:
      - {person: emperor-yingzong-of-ming, role: captured}
      - {person: jingtai-emperor, role: succeeded}
    prominence: 4
    note: "Esen Taishi's Oirat Mongols invaded in July 1449; the Zhengtong Emperor, led by the eunuch Wang Zhen, took the army out on 4 August, retreated from Datong and was caught at Tumu. The Mongols attacked on the morning of 1 September; Wang Zhen died and the Emperor was captured (taken to Esen's camp on 3 September). Yu Qian held Beijing and the Jingtai Emperor was enthroned on 17 (or 23) September. Esen released Yingzong in September 1450."
    sources: [wp-tumu-crisis, wp-emperor-yingzong-of-ming, wp-jingtai-emperor]
  - key: restoration-of-emperor-yingzong-1457
    name: Seizure of the Gate (restoration of Emperor Yingzong)
    type: Coup
    date: 1457-02-11
    place: forbidden-city
    people:
      - {person: emperor-yingzong-of-ming, role: restored}
      - {person: jingtai-emperor, role: deposed}
    prominence: 3
    note: "On the night of 11 February 1457, while the Jingtai Emperor was ill, the generals Shi Heng and Zhang Yue, the eunuch Cao Jixiang and the strategist Xu Youzhen brought the former emperor from the Southern Palace to the throne room; the second reign is the Tianshun era."
    sources: [wp-emperor-yingzong-of-ming, wp-jingtai-emperor]
  - key: wokou-raids-jiajing-era-1520
    name: Smuggler and pirate raids on the south-east coast (Jiajing era)
    type: Raid
    year: 1520
    estimated: true
    end_year: 1565
    people:
      - {person: jiajing-emperor, role: ruler}
    prominence: 2
    note: "Piracy and smuggling grew along the coast from Zhejiang to Guangdong from the 1520s, with bases on islands such as Shuangyu near Ningbo; raids peaked in the late 1540s and 1550s and reached the suburbs of Hangzhou and Jiaxing. Hu Zongxian, Yu Dayou and Qi Jiguang broke up the groups in the latter half of the 1550s; Fujian was clear by 1563 and Guangdong and Guangxi by the mid-1560s. Both dates are approximate readings of 'the 1520s' and 'the mid-1560s'. The Jiajing Emperor kept the sea ban; it was lifted after his death."
    sources: [wp-jiajing-emperor]

discrepancies:
  - key: genghis-khan-birth-year
    question: In which year was Genghis Khan (Temujin) born?
    about: [{person: genghis-khan}]
    field: born
    claims:
      - {value: "1155", sources: [wp-genghis-khan], note: "Supported by Zhao Hong and Rashid al-Din; fits the Year of the Pig; implies he had no children until past thirty"}
      - {value: "1162", sources: [wp-genghis-khan], note: "History of Yuan and the Shengwu; accepted by most historians"}
      - {value: "1167", sources: [wp-genghis-khan], note: "Paul Pelliot, from a text by the Yuan artist Yang Weizhen; also fits the Year of the Pig"}
    note: "The record uses 1162, marked estimated."
  - key: genghis-khan-death-day
    question: On which day in August 1227 did Genghis Khan die?
    about: [{person: genghis-khan}, {event: mongol-conquest-of-western-xia-1227}]
    field: died
    claims:
      - {value: "18 August 1227", sources: [wp-genghis-khan]}
      - {value: "25 August 1227", sources: [wp-genghis-khan]}
    note: "Only the year (1227) is entered. His death was kept secret and Zhongxing fell the following month."
  - key: mongke-accession-and-death
    question: When did Mongke become Great Khan, and how and when did he die?
    about: [{person: mongke-khan}]
    field: date
    claims:
      - {value: "Reign from 1 July 1251 (lead)", sources: [wp-mongke-khan]}
      - {value: "Coronation announced to Goryeo in October 1251", sources: [wp-mongke-khan], note: "The envoys' announcement may follow a separate coronation kurultai"}
      - {value: "Died 11 August 1259 of dysentery or cholera at Diaoyu", sources: [wp-mongke-khan], note: "Persian accounts from Rashid al-Din; the History of Yuan mentions an epidemic but not this"}
      - {value: "Killed in the assault on Diaoyu by a crossbow arrow or a stone projectile", sources: [wp-mongke-khan], note: "A Song poem and Bar Hebraeus; History of Yuan names a stone from a siege engine"}
      - {value: "Drowned when a war ship sank", sources: [wp-mongke-khan], note: "Hayton of Corycus, whose account the article says may confuse the later invasions of Japan"}
    note: "The record uses 1 July 1251 and 11 August 1259 (the Persian date, the only day given)."
  - key: kublai-great-khan-proclamation-1260
    question: On what date was Kublai proclaimed Great Khan?
    about: [{person: kublai-khan}, {event: kublai-proclaimed-great-khan-1260}, {place: shangdu}]
    field: date
    claims:
      - {value: "15 April 1260, by the kurultai Kublai summoned", sources: [wp-kublai-khan]}
      - {value: "5 May 1260, proclaimed Khagan at his residence in Shangdu", sources: [wp-kublai-khan]}
    note: "Both dates are in the same article. The record uses 5 May because it names the place."
  - key: kublai-yuan-end-of-song
    question: When did the Yuan become the ruler of China, and when did the Song end?
    about: [{person: kublai-khan}, {event: founding-of-yuan-dynasty-1271}, {event: fall-of-southern-song-1279}]
    field: date
    claims:
      - {value: "1271: Kublai proclaims the dynastic name Great Yuan", sources: [wp-kublai-khan, wp-genghis-khan]}
      - {value: "1276: the Song imperial family surrenders to the Yuan", sources: [wp-kublai-khan]}
      - {value: "1279: the Yuan conquest of the Song is complete (Yamen)", sources: [wp-kublai-khan, wp-yongle-emperor, wp-hongwu-emperor]}
    note: "Not a conflict of fact: 1271 is the founding of the dynasty and 1279 the completion of the conquest. Kublai's Yuan title starts in 1271; the Song end event is dated 1279."
  - key: shangdu-ming-capture
    question: When did the Ming capture Shangdu?
    about: [{place: shangdu}, {person: toghon-temur}]
    field: date
    claims:
      - {value: "20 July 1369, taken by Chang Yuchun", sources: [wp-red-turban-rebellions]}
      - {value: "1369", sources: [wp-toghon-temur]}
      - {value: "1370, Li Wenzhong's forces advanced to Shangdu and forced Toghon Temur north to Yingchang", sources: [wp-hongwu-emperor]}
    note: "Entered only in the place note."
  - key: jianwen-emperor-fate
    question: Did the Jianwen Emperor die in the palace fire of 1402?
    about: [{person: jianwen-emperor}]
    field: died
    claims:
      - {value: "Died 13 July 1402 in the burning palace; three bodies announced as his, his wife's and his eldest son's", sources: [wp-jianwen-emperor, wp-yongle-emperor]}
      - {value: "Survived and lived as a Buddhist monk", sources: [wp-jianwen-emperor], note: "Folk legend spread by non-state historians from the Jiajing era"}
    note: "The record uses 13 July 1402, the date Nanjing fell."
  - key: jingtai-emperor-birth-day
