people:
  # ---- Mongol Empire
  - key: genghis-khan
    name: Genghis Khan
    type: Royalty
    house: Borjigin
    realm: Mongol Empire
    born: 1162
    born_estimated: true
    died: 1227
    prominence: 5
    note: "Born Temujin, founder and first khan of the Mongol Empire. United the Mongol tribes, took the title Genghis Khan at the 1206 kurultai, raided Western Xia (1209), invaded the Jin dynasty (1211, taking Zhongdu in 1215) and broke Khwarazm (from 1219). Died in 1227 while subduing the rebellious Western Xia (18 or 25 August); buried near Burkhan Khaldun. Succeeded by his third son Ogedei after a two-year regency by Tolui. The birth year is disputed (1155, 1162, 1167)."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-genghis-khan]
  - key: ogedei-khan
    name: Ögedei Khan
    type: Royalty
    house: Borjigin
    realm: Mongol Empire
    born: 1186
    born_estimated: true
    died: 1241-12-11
    prominence: 4
    note: "Third son of Genghis Khan and second khan of the Mongol Empire. Elected at the kurultai on the Kherlen on 13 September 1229. Completed the conquest of the Jin dynasty (fall of Caizhou, February 1234), began the invasions of Korea (1231) and sent Batu and Subutai into Europe. Founded Karakorum (building 1235-1238) and the Yam post system. Died at dawn on 11 December 1241 after a drinking bout; succeeded by Guyuk after a five-year regency by his widow Toregene."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-ogedei-khan]
  - key: mongke-khan
    name: Möngke Khan
    type: Royalty
    house: Borjigin
    realm: Mongol Empire
    born: 1209-01-11
    died: 1259-08-11
    prominence: 4
    note: "Eldest son of Tolui and fourth Khagan, first of the Toluid line; ruled from 1 July 1251. Purged the Ogedeid and Chagataid families, held a census of the whole empire (1252-1259), and sent Hulagu west (Baghdad fell in 1258) and Kublai against Dali (1253). Died in 1259 at the siege of Diaoyucheng; the cause is disputed. His death led to the Toluid Civil War between Kublai and Ariq Boke."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-mongke-khan]

  # ---- Yuan dynasty
  - key: kublai-khan
    name: Kublai Khan
    type: Royalty
    house: Borjigin
    realm: Yuan dynasty
    born: 1215-09-23
    died: 1294-02-18
    prominence: 5
    note: "Second son of Tolui; Great Khan from 1260 and founder and first emperor of the Yuan dynasty (temple name Shizu). Won the Toluid Civil War against Ariq Boke (1260-1264), proclaimed the dynastic name Great Yuan in 1271, built the capital Dadu (Khanbaliq, modern Beijing) with Shangdu as the summer capital, and completed the conquest of the Song in 1279. Ordered invasions of Japan, Vietnam, Burma and Java. Died 18 February 1294; his body was taken to the Khans' burial place in Mongolia."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-kublai-khan]
  - key: temur-khan
    name: Temür Khan
    type: Royalty
    house: Borjigin
    realm: Yuan dynasty
    born: 1265-10-15
    died: 1307-02-10
    prominence: 2
    note: "Born Temur, Oljeyitu Khan, second emperor of the Yuan (temple name Chengzong), grandson of Kublai through the crown prince Zhenjin. Declared emperor at a Shangdu kurultai in 1294 after winning a contest on Genghis Khan's sayings against his brother Gammala. Called off the invasions of Burma, Dai Viet and Japan. About 1304 the western khanates acknowledged him as nominal suzerain. Died in Khanbaliq on 10 February 1307 without a male heir."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-temur-khan]
  - key: kulug-khan
    name: Külüg Khan
    type: Royalty
    house: Borjigin
    realm: Yuan dynasty
    born: 1281-08-04
    died: 1311-01-27
    prominence: 2
    note: "Born Khayishan, regnal name Kulug (warrior or fine horse) Khan, third emperor of the Yuan (temple name Wuzong). Commanded the western front against Kaidu, who died of a wound after clashing with him in 1301. Enthroned at Shangdu on 21 June 1307. Died suddenly on 27 January 1311 after a reign of under four years."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-kulug-khan]
  - key: toghon-temur
    name: Toghon Temür
    type: Royalty
    house: Borjigin
    realm: Yuan dynasty
    born: 1320-05-25
    died: 1370-05-23
    prominence: 3
    note: "Last emperor of the Yuan (temple name Huizong, posthumous name Shun by the Ming) and first of the Northern Yuan. Acceded in 1333, ruled under the ministers El Temur and Bayan until 1340, and lost control as the Red Turban Rebellion of 1351 spread. Abandoned Khanbaliq to the Ming in 1368 and withdrew to Shangdu, then Yingchang, where he died on 23 May 1370. Patron of Tibetan Buddhism."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-toghon-temur, wp-red-turban-rebellions]

  # ---- Ming dynasty
  - key: hongwu-emperor
    name: Hongwu Emperor
    type: Royalty
    house: Zhu
    realm: Ming dynasty
    born: 1328-10-21
    died: 1398-06-24
    prominence: 5
    note: "Zhu Yuanzhang, founder of the Ming. Born a peasant in Zhongli village, Haozhou (present-day Fengyang, Anhui); orphaned by plague in 1344. Joined the Red Turbans in 1352, took Nanjing in 1356, beat Chen Youliang (1363) and Zhang Shicheng, proclaimed the Ming on 23 January 1368 and drove the Yuan from Dadu that year. Ruled thirty years from Nanjing; died 24 June 1398 and was buried in the Xiao Mausoleum east of Nanjing."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-hongwu-emperor, wp-red-turban-rebellions]
  - key: jianwen-emperor
    name: Jianwen Emperor
    type: Royalty
    house: Zhu
    realm: Ming dynasty
    born: 1377-12-05
    died: 1402-07-13
    prominence: 3
    note: "Zhu Yunwen, grandson of the Hongwu Emperor and second Ming emperor (30 June 1398 to 1402). His effort to reduce the princes provoked his uncle Zhu Di's rebellion (the Jingnan campaign, 1399-1402). Nanjing opened its gates on 13 July 1402 and the palace burned; three bodies were announced as his, but rumours said he escaped as a monk. His era was erased by the Yongle Emperor and restored by the Wanli Emperor in 1595."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-jianwen-emperor]
  - key: yongle-emperor
    name: Yongle Emperor
    type: Royalty
    house: Zhu
    realm: Ming dynasty
    born: 1360-05-02
    died: 1424-08-12
    prominence: 5
    note: "Zhu Di, fourth son of the Hongwu Emperor, Prince of Yan at Beiping. Rebelled in 1399, entered Nanjing on 13 July 1402 and was enthroned on 17 July. Made Beijing the principal capital (declared 28 October 1420), built the Forbidden City, rebuilt the Grand Canal, commissioned the Yongle Encyclopedia and sent Zheng He's fleets to the Indian Ocean. Led five campaigns into Mongolia; died on 12 August 1424 at Yumuchuan on the last. Buried in Chang Mausoleum, the first of the Ming tombs."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-yongle-emperor]
  - key: hongxi-emperor
    name: Hongxi Emperor
    type: Royalty
    house: Zhu
    realm: Ming dynasty
    born: 1378-08-16
    died: 1425-05-29
    prominence: 2
    note: "Zhu Gaochi, eldest son of the Yongle Emperor and fourth Ming emperor. Became emperor on 7 September 1424, ended Zheng He's voyages and reformed taxes, and decided in April 1425 to return the capital to Nanjing. Died suddenly in Beijing on 29 May 1425, reportedly of a heart attack, after under a year."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-hongxi-emperor]
  - key: xuande-emperor
    name: Xuande Emperor
    type: Royalty
    house: Zhu
    realm: Ming dynasty
    born: 1399-03-16
    died: 1435-01-31
    prominence: 3
    note: "Zhu Zhanji, fifth Ming emperor, enthroned 27 June 1425. Cancelled the move of the capital to Nanjing, put down his uncle Zhu Gaoxu's revolt in person, accepted Le Loi's offer in 1427 and so gave up Dai Viet, and allowed Zheng He's seventh voyage (1431-1433). His reign is remembered as a golden age. Died in the Palace of Heavenly Purity in the Forbidden City on 31 January 1435."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-xuande-emperor]
  - key: emperor-yingzong-of-ming
    name: Emperor Yingzong of Ming
    type: Royalty
    house: Zhu
    realm: Ming dynasty
    born: 1427-11-29
    died: 1464-02-23
    prominence: 3
    note: "Zhu Qizhen, sixth and eighth Ming emperor. Reigned as the Zhengtong Emperor from 1435 (aged eight) to 1449, and as the Tianshun Emperor from 1457 to 1464. Led the army against Esen Taishi at the Tumu Fortress and was captured on 1 September 1449; released in September 1450, held in the Southern Palace of the Forbidden City by his brother the Jingtai Emperor, and restored by a palace coup on 11 February 1457. Died 23 February 1464."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article (two reigns entered as two title rows); consorts and court mostly not entered; no artworks"
    sources: [wp-emperor-yingzong-of-ming, wp-tumu-crisis]
  - key: jingtai-emperor
    name: Jingtai Emperor
    type: Royalty
    house: Zhu
    realm: Ming dynasty
    born: 1428-09-21
    died: 1457-03-14
    prominence: 2
    note: "Zhu Qiyu, younger half-brother of Emperor Yingzong and seventh Ming emperor. Put in charge of Beijing in 1449, enthroned after the Tumu defeat, and held the capital with the minister Yu Qian. Fell ill in early 1457 and was deposed in the coup of 11 February; died on 14 March 1457, possibly murdered. Buried outside the imperial mausoleums at Yuchuanshan. The article gives his birth as 21 September 1428 in the lead and 11 September in the text."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-jingtai-emperor, wp-tumu-crisis]
  - key: chenghua-emperor
    name: Chenghua Emperor
    type: Royalty
    house: Zhu
    realm: Ming dynasty
    born: 1447-12-09
    died: 1487-09-09
    prominence: 2
    note: "Zhu Jianshen, eldest son of Emperor Yingzong and ninth Ming emperor (1464-1487). Heir at two, demoted by Jingtai and reinstated in 1457. Dominated by his consort Wan Zhen'er and by eunuchs such as Wang Zhi. Attacked the Jurchens in 1465 and 1479. Died 9 September 1487; buried in Mao Mausoleum."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-chenghua-emperor]
  - key: hongzhi-emperor
    name: Hongzhi Emperor
    type: Royalty
    house: Zhu
    realm: Ming dynasty
    born: 1470-07-30
    died: 1505-06-08
    prominence: 3
    note: "Zhu Youcheng, tenth Ming emperor (enthroned 17 September 1487). Confucian and hardworking, he cut taxes and spending and kept only one consort, Empress Zhang. Fell ill on 1 June 1505 and died on 8 June."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-hongzhi-emperor]
  - key: zhengde-emperor
    name: Zhengde Emperor
    type: Royalty
    house: Zhu
    realm: Ming dynasty
    born: 1491-11-14
    died: 1521-04-20
    prominence: 3
    note: "Zhu Houzhao, eleventh Ming emperor (enthroned 19 June 1505). Disliked the Confucian bureaucracy and relied on eunuchs; Liu Jin ran the government from 1506 to 1510. Spent 1517 at Datong, beating a Mongol raid under Dayan Khan, and 1519-1520 in the south. Fell into water while drunk, fell ill and died on 20 April 1521 in the Leopard Quarter without an heir."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-zhengde-emperor]
  - key: jiajing-emperor
    name: Jiajing Emperor
    type: Royalty
    house: Zhu
    realm: Ming dynasty
    born: 1507-09-16
    died: 1567-01-23
    prominence: 3
    note: "Zhu Houcong, cousin of the Zhengde Emperor and twelfth Ming emperor (enthroned 27 May 1521). Won the Great Rites Controversy (1521-1524), later withdrew to the West Park and pursued immortality with Taoist priests. His reign saw Altan Khan's raids from the north and the rise and suppression of coastal smuggler and pirate groups. Died around midday on 23 January 1567 in the Forbidden City; buried in Yong Mausoleum."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-jiajing-emperor]
  - key: longqing-emperor
    name: Longqing Emperor
    type: Royalty
    house: Zhu
    realm: Ming dynasty
    born: 1537-03-04
    died: 1572-07-05
    prominence: 2
    note: "Zhu Zaiji, thirteenth Ming emperor. Became emperor twelve days after the Jiajing Emperor's death on 23 January 1567, reinstated exiled officials, lifted the sea ban and made peace with Altan Khan. Died 5 July 1572 aged 35; buried in Zhao Mausoleum."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-longqing-emperor]
  - key: wanli-emperor
    name: Wanli Emperor
    type: Royalty
    house: Zhu
    realm: Ming dynasty
    born: 1563-09-04
    died: 1620-08-18
    prominence: 4
    note: "Zhu Yijun, fourteenth Ming emperor and the longest-reigning (19 July 1572 to 18 August 1620, 48 years). Enthroned at nine; Zhang Juzheng governed until his death on 9 July 1582. Later withdrew from court, quarrelled with officials over the succession and opened silver mines in 1596 to refill a treasury drained by the rebuilding of the Forbidden City after the April 1596 fire. Died 18 August 1620; buried in the Ding Mausoleum at the Ming tombs."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; the Imjin War and the late Wanli wars are not entered"
    sources: [wp-wanli-emperor]
  - key: zheng-he
    name: Zheng He
    type: Nobility
    roles: [admiral, diplomat, eunuch]
    house: Zhu
    realm: Ming dynasty
    born: 1371
    died: 1433
    died_estimated: true
    prominence: 4
    note: "Born Ma He to a Muslim family in Kunyang, Yunnan; castrated after the Ming conquest of Yunnan, he served the Prince of Yan and helped in the Jingnan campaign. Renamed Zheng by the Yongle Emperor, made Grand Director of the Directorate of Palace Servants and commanded seven treasure voyages across the Indian Ocean (1405-1433). Defender of Nanjing from 1425. Died during or soon after the last voyage (1433) or in 1435 (see the discrepancy); buried at sea, with a cenotaph on Cattle Head Hill, Nanjing. The article gives no dated office, so no title row."
    coverage: partly
    coverage_note: "dates, voyages and main places from the English Wikipedia article; individual voyages, ports and ships not entered; no artworks"
    sources: [wp-zheng-he]

