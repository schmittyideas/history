batch:
  title: The first artwork record, a portrait of Inigo Jones
  requested: "Show how artworks link to their maker, their sitter and the original they copy (Hogarth's print after Van Dyck)"
  date: 2026-10-08

# Notes for the reviewer
# - Everything about the artwork comes from its Wikimedia Commons file page (date "from 1757 until 1758", credit "After Anthony van Dyck / William Hogarth", public domain).
#   Commons does not say the medium (print or engraving), so `kind` and `medium` are left out. The original Van Dyck painting is not recorded here (no article date or owner found yet).
# - William Hogarth is added only as the maker; his own works and links are left for a later batch. Facts from his English Wikipedia article.

