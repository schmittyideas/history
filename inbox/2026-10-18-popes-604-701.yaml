# The Papacy, 604-701 (the Byzantine Papacy and the Monothelite controversy): the 20 popes of the century not yet here,
# from Sabinian to Sergius I, the antipopes Theodore and Paschal (687), the consecration of the Pantheon as a church
# (609) and the Third Council of Constantinople (680-681).
# Conventions and checks as the earlier Papacy batches (inbox/2026-10-18-popes-*.yaml). Birth and death dates from each
# article's lead; Wikidata's differing full dates recorded as discrepancies (often a few days apart), the records using
# the articles.
# Also: Samnium, added by the previous batch as Felix IV's birthplace, is a region, not a town; its kind is corrected.
# Stated honestly: birthplaces that are regions (Marsica, Thrace), "near" a town (Martin I, near Todi) or unidentified
# (Aydonum) are left in the notes.
batch:
  title: "The Papacy, 604-701"
  requested: "Do we have all popes? Get them all, with the disputed ones (antipopes) marked disputed"
  date: 2026-10-18

