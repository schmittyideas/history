people:
  - {key: sabinian, name: "Sabinian", type: Clergy, roles: [pope], died: 0606-02-22, realm: Papacy, prominence: 1, sitelinks: 72, sitelinks_on: 2026-10-18,
     note: "A former apocrisiarius to Constantinople, pope 604-606 under Byzantine rule.",
     sources: [wp-sabinian]}
  - {key: boniface-iii, name: "Boniface III", type: Clergy, roles: [pope], realm: Papacy, prominence: 1, sitelinks: 72, sitelinks_on: 2026-10-18,
     note: "Of Greek descent; pope for nine months in 607.",
     sources: [wp-boniface-iii]}
  - {key: boniface-iv, name: "Boniface IV", type: Clergy, roles: [pope], born: 550, died: 0615-05-08, realm: Papacy, prominence: 2, sitelinks: 74, sitelinks_on: 2026-10-18,
     note: "A Benedictine from the Marsica who ran the Lateran as a monastery; with Emperor Phocas's leave he consecrated the Pantheon as a church on 13 May 609, and conferred with Mellitus, Bishop of London (610). A saint.",
     sources: [wp-boniface-iv]}
  - {key: adeodatus-i, name: "Adeodatus I", type: Clergy, roles: [pope], born: 570, died: 0618-11-08, realm: Papacy, prominence: 1, sitelinks: 76, sitelinks_on: 2026-10-18,
     note: "The first priest elected pope since John II; the first lead seals (bullae) on papal documents are his. A saint.",
     sources: [wp-adeodatus-i]}
  - {key: boniface-v, name: "Boniface V", type: Clergy, roles: [pope], died: 0625-10-25, realm: Papacy, prominence: 1, sitelinks: 79, sitelinks_on: 2026-10-18,
     note: "A Neapolitan who furthered the conversion of Anglo-Saxon England and decreed that churches were places of sanctuary.",
     sources: [wp-boniface-v]}
  - {key: honorius-i, name: "Honorius I", type: Clergy, roles: [pope], died: 0638-10-12, realm: Papacy, prominence: 2, sitelinks: 83, sitelinks_on: 2026-10-18,
     note: "Of Campania; sent Birinus to the West Saxons and urged the Irish and British to adopt the Roman Easter. Condemned as a heretic for Monothelitism by the Third Council of Constantinople (680).",
     sources: [wp-honorius-i]}
  - {key: severinus, name: "Severinus", type: Clergy, roles: [pope], died: 0640-08-02, realm: Papacy, prominence: 1, sitelinks: 72, sitelinks_on: 2026-10-18,
     note: "Refused Emperor Heraclius's demand that he accept Monothelitism, which held up his recognition for eighteen months; confirmed on 28 May 640, he died two months later.",
     sources: [wp-severinus]}
  - {key: john-iv, name: "John IV", type: Clergy, roles: [pope], died: 0642-10-12, realm: Papacy, prominence: 1, sitelinks: 77, sitelinks_on: 2026-10-18,
     note: "A Dalmatian from Zadar; condemned Monothelitism and corrected the Irish and Scots on the date of Easter.",
     sources: [wp-john-iv]}
  - {key: theodore-i, name: "Theodore I", type: Clergy, roles: [pope], died: 0649-05-14, realm: Papacy, prominence: 1, sitelinks: 75, sitelinks_on: 2026-10-18,
     note: "A Greek from Jerusalem, the last pope from Palestine; his pontificate was taken up with the fight against Monothelitism.",
     sources: [wp-theodore-i]}
  - {key: martin-i, name: "Martin I", type: Clergy, roles: [pope], born: 590, born_estimated: true, died: 0655-09-16, realm: Papacy, prominence: 2, sitelinks: 78, sitelinks_on: 2026-10-18,
     note: "Born near Todi; Theodore I's envoy to Constantinople, elected without waiting for imperial assent. For opposing Monothelitism, Constans II had him arrested and carried to Constantinople; he died in exile, the last pope venerated as a martyr.",
     sources: [wp-martin-i]}
  - {key: eugene-i, name: "Eugene I", type: Clergy, roles: [pope], died: 0657-06-02, realm: Papacy, prominence: 1, sitelinks: 71, sitelinks_on: 2026-10-18,
     note: "Chosen after Constans II deposed and banished Martin I over Monothelitism (654). A saint.",
     sources: [wp-eugene-i]}
  - {key: vitalian, name: "Vitalian", type: Clergy, roles: [pope], died: 0672-01-27, realm: Papacy, prominence: 1, sitelinks: 75, sitelinks_on: 2026-10-18,
     note: "Sought to resolve the Monothelite dispute and was on good terms with Constans II, who visited him in Rome. A saint.",
     sources: [wp-vitalian]}
  - {key: adeodatus-ii, name: "Adeodatus II", type: Clergy, roles: [pope], born: 621, born_estimated: true, died: 0676-06-17, realm: Papacy, prominence: 1, sitelinks: 77, sitelinks_on: 2026-10-18,
     note: "A Benedictine; spent his pontificate (672-676) restoring churches and fighting Monothelitism.",
     sources: [wp-adeodatus-ii]}
  - {key: donus, name: "Donus", type: Clergy, roles: [pope], died: 0678-04-11, realm: Papacy, prominence: 1, sitelinks: 72, sitelinks_on: 2026-10-18,
     note: "Pope 676-678; little is known beyond the Liber Pontificalis.",
     sources: [wp-donus]}
  - {key: agatho, name: "Agatho", type: Clergy, roles: [pope], born: 577, born_estimated: true, died: 0681-01-10, realm: Papacy, prominence: 2, sitelinks: 76, sitelinks_on: 2026-10-18,
     note: "A Sicilian Greek; heard Wilfrid of York's appeal, and in his time the Sixth Ecumenical Council (Third of Constantinople, 680-681) condemned Monothelitism. A saint in East and West.",
     sources: [wp-agatho]}
  - {key: leo-ii, name: "Leo II", type: Clergy, roles: [pope], born: 611, born_estimated: true, died: 0683-06-28, realm: Papacy, prominence: 1, sitelinks: 78, sitelinks_on: 2026-10-18,
     note: "A Sicilian Greek of the Byzantine Papacy, described as just and learned; confirmed the Sixth Council. A saint.",
     sources: [wp-leo-ii]}
  - {key: benedict-ii, name: "Benedict II", type: Clergy, roles: [pope], realm: Papacy, prominence: 1, sitelinks: 81, sitelinks_on: 2026-10-18,
     note: "A Roman, pope 684-685. A saint.",
     sources: [wp-benedict-ii]}
  - {key: john-v, name: "John V", type: Clergy, roles: [pope], died: 0686-08-02, realm: Papacy, prominence: 1, sitelinks: 75, sitelinks_on: 2026-10-18,
     note: "A Syrian from Antioch: the first pope of the Byzantine Papacy consecrated without prior imperial consent and the first of ten successive popes of Eastern origin.",
     sources: [wp-john-v]}
  - {key: conon, name: "Conon", type: Clergy, roles: [pope], died: 0687-09-21, realm: Papacy, prominence: 1, sitelinks: 73, sitelinks_on: 2026-10-18,
     note: "From Thrace; a compromise between Rome's military and clerical factions (686). Consecrated the Irish missionary Kilian and sent him to Franconia.",
     sources: [wp-conon]}
  - {key: sergius-i, name: "Sergius I", type: Clergy, roles: [pope], born: 650, born_estimated: true, died: 0701-09-08, realm: Papacy, prominence: 2, sitelinks: 77, sitelinks_on: 2026-10-18,
     note: "A Syrian born in Palermo, elected over the rivals Theodore and Paschal (687). Refused the canons of the Quinisext Council; when Justinian II ordered his arrest, the Romans protected him. Brought the Agnus Dei into the Mass.",
     sources: [wp-sergius-i]}
  - {key: theodore-antipope, name: "Theodore (antipope)", type: Clergy, roles: [antipope], born: 599, born_estimated: true, realm: Papacy, prominence: 1, sitelinks: 27, sitelinks_on: 2026-10-18,
     note: "One of the two rivals, with the archdeacon Paschal, whose deadlock after Conon's death (687) was settled by electing Sergius I.",
     sources: [wp-theodore-antipope]}
  - {key: paschal-antipope, name: "Paschal (antipope, 687)", type: Clergy, roles: [antipope], born: 598, born_estimated: true, died: 692, died_estimated: true, realm: Papacy, prominence: 1, sitelinks: 27, sitelinks_on: 2026-10-18,
     note: "The archdeacon who, with Theodore, contested the papacy in 687; Sergius I was elected over both.",
     sources: [wp-paschal-antipope]}

