  - key: richard-meier
    name: Richard Meier
    type: Artist
    roles: [architect]
    born: 1934-10-12
    prominence: 3
    note: "American architect of white geometric buildings; Pritzker Prize 1984; chosen in 1984 to design the Getty Center. Resigned from his firm in 2021 after sexual assault accusations."
