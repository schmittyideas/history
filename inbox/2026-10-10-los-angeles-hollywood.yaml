     note: "Beach city on the Pacific west of Los Angeles; founded in 1875 by John P. Jones and Robert and Arcadia Baker, incorporated in 1886.", sources: [wp-santa-monica-california]}
  # Hollywood
  - key: hollywood-sign
    name: Hollywood Sign
    historical_name: Hollywoodland Sign
    kind: landmark
    city: Los Angeles
    region: California
    country: United States
    lat: 34.134
    lng: -118.322
