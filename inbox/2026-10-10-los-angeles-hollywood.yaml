events:
  - key: griffith-park-donated
    name: Griffith Park given to Los Angeles
    type: Founding
    date: 1896-12-16
    place: griffith-park
    prominence: 3
    people:
      - {person: griffith-j-griffith, role: donor}
    note: "Griffith and his wife Christina gave 3,015 acres of the Rancho Los Feliz to the city, asking that no one be excluded by race, creed or colour."
    sources: [wp-griffith-park, wp-griffith-j-griffith]
  - key: venice-of-america-opens
    name: Venice of America opens
    type: Founding
    date: 1905-07-04
    place: venice-canals
    prominence: 2
    people:
      - {person: abbot-kinney, role: founder}
    note: "Kinney's seaside resort opened with canals, a 1,200-foot pier, a salt-water plunge and an arcaded Venetian business street."
    sources: [wp-venice-los-angeles]
  - key: hollywood-merges-with-los-angeles
    name: Hollywood merges with Los Angeles
    type: Political
    date: 1910-02-07
    place: hollywood
    prominence: 3
    note: "Incorporated as a city on 9 November 1903, Hollywood voted to consolidate with Los Angeles for water and sewers; Prospect Avenue became Hollywood Boulevard. The film industry moved in soon after."
    sources: [wp-hollywood-los-angeles]
  - key: in-old-california-filmed
    name: In Old California, the first film shot in Hollywood
    type: Film
    year: 1910
    place: hollywood
    prominence: 4
    people:
      - {person: d-w-griffith, role: director}
    note: "A 17-minute Biograph melodrama of Mexican-era California. Long thought lost; a monument at 1713 Vine Street was set up in 2004. See discrepancy on the first Hollywood film."
    sources: [wp-in-old-california-1910, wp-hollywood-los-angeles]
  - key: nestor-studio-opens
    name: Nestor opens the first film studio in Hollywood
    type: Founding
    date: 1911-10-27
    place: hollywood
    prominence: 2
    note: "The Nestor Film Company opened a studio in the Blondeau Tavern at Sunset Boulevard and Gower Street, with the first film stage in Hollywood behind it. Merged into Universal in 1912. See discrepancy on the first studio."
    sources: [wp-nestor-film-company]
  - key: the-squaw-man-filmed
    name: The Squaw Man filmed in Hollywood
    type: Film
    date: 1913-12-29
    end_year: 1914
    place: lasky-demille-barn
    prominence: 4
    people:
      - {person: cecil-b-demille, role: director}
      - {person: jesse-l-lasky, role: producer}
    note: "DeMille's first film, co-directed with Oscar Apfel, shot from 29 December 1913 to 20 January 1914 in a barn at Selma and Vine; the first feature-length film made in Hollywood. Its success made Hollywood the new home of the U.S. film industry."
    sources: [wp-the-squaw-man-1914, wp-cecil-b-demille]
  - key: universal-city-opens
    name: Universal City opens
    type: Founding
    date: 1915-03-14
    place: universal-studios-hollywood
    prominence: 3
    people:
      - {person: carl-laemmle, role: founder}
    note: "A two-day grand opening with 10,000 people for the world's largest film production facility; visitors could watch filming for five cents. Date disputed by a day (see discrepancy)."
    sources: [wp-universal-studios-hollywood, wp-carl-laemmle]
  - key: united-artists-founded
    name: United Artists founded
    type: Founding
    date: 1919-02-05
    prominence: 4
    people:
      - {person: charlie-chaplin, role: founder}
      - {person: mary-pickford, role: founder}
      - {person: douglas-fairbanks, role: founder}
      - {person: d-w-griffith, role: founder}
    note: "Four stars set up their own distribution company so actors and directors could make films on their own terms."
    sources: [wp-united-artists, wp-d-w-griffith]
  - key: hollywood-bowl-opens
    name: Hollywood Bowl opens
    type: Founding
    date: 1922-07-11
    place: hollywood-bowl
    prominence: 3
    note: "The first season opened with Alfred Hertz conducting the Los Angeles Philharmonic, on a stage of little more than wooden platforms and canvas."
    sources: [wp-hollywood-bowl]
  - key: egyptian-theatre-robin-hood-premiere
    name: Robin Hood opens the Egyptian Theatre, the first film premiere
    type: Premiere
    year: 1922
    place: grauman-s-egyptian-theatre
    prominence: 3
    people:
      - {person: sid-grauman, role: builder}
      - {person: douglas-fairbanks, role: star}
    note: "Grauman's Egyptian Theatre opened with Douglas Fairbanks in Robin Hood, called the world's first film premiere. The article gives the year only."
    sources: [wp-grauman-s-egyptian-theatre]
  - key: hollywoodland-sign-dedicated
    name: Hollywoodland sign dedicated
    type: Building
    date: 1923-07-13
    place: hollywood-sign
    prominence: 4
    note: "A temporary advertisement for the Hollywoodland housing development, meant to last a year and a half; it stayed, lost 'LAND' in 1949 and was rebuilt in steel in 1978."
    sources: [wp-hollywood-sign]
  - key: paramount-moves-to-marathon-street
    name: Paramount moves to its Marathon Street lot
    type: Founding
    date: 1926-05-08
    place: paramount-studios
    prominence: 2
    people:
      - {person: jesse-l-lasky, role: buyer}
    note: "Outgrowing the Sunset and Vine lot, Lasky bought the 26-acre Robert Brunton Studios for $1 million; Paramount took the barn with it."
    sources: [wp-paramount-pictures, wp-hollywood-heritage-museum]
  - key: chinese-theatre-first-handprints
    name: First handprints at the Chinese Theatre
    type: Ceremony
    date: 1927-04-30
    place: grauman-s-chinese-theatre
    prominence: 2
    people:
      - {person: mary-pickford, role: imprinted}
      - {person: douglas-fairbanks, role: imprinted}
      - {person: sid-grauman, role: host}
    note: "Pickford and Fairbanks were the first stars to leave prints in the forecourt; the story of how the tradition began varies (see discrepancy)."
    sources: [wp-grauman-s-chinese-theatre]
  - key: chinese-theatre-opens
    name: Grauman's Chinese Theatre opens
    type: Premiere
    date: 1927-05-18
    place: grauman-s-chinese-theatre
    prominence: 4
    people:
      - {person: sid-grauman, role: builder}
      - {person: cecil-b-demille, role: director of the opening film}
    note: "Opened with the premiere of DeMille's The King of Kings, after 18 months' building at a cost of $2.1 million."
    sources: [wp-grauman-s-chinese-theatre, wp-sid-grauman]
  - key: first-academy-awards
    name: First Academy Awards
    type: Ceremony
    date: 1929-05-16
    place: hollywood-roosevelt-hotel
    prominence: 4
    people:
      - {person: douglas-fairbanks, role: host}
    note: "A 15-minute private dinner for 270 people ($5 a ticket) honouring films of 1927-28 in 12 categories; the winners were announced three months before. The only ceremony not broadcast."
    sources: [wp-1st-academy-awards]
  - key: griffith-observatory-opens
    name: Griffith Observatory opens
    type: Founding
    date: 1935-05-14
    place: griffith-observatory
    prominence: 3
    people:
      - {person: griffith-j-griffith, role: benefactor}
    note: "Built from Griffith's bequest to make astronomy free to the public; 13,000 visitors in its first five days. Used to train pilots in celestial navigation in the Second World War."
    sources: [wp-griffith-observatory]
  - key: disneyland-opens
    name: Disneyland opens
    type: Founding
    date: 1955-07-17
    place: disneyland
    prominence: 4
    people:
      - {person: walt-disney, role: founder}
    note: "Dedicated in a live ABC broadcast the day before its public opening; it set the pattern for theme parks."
    sources: [wp-disneyland, wp-walt-disney]
  - key: capitol-records-building-completed
    name: Capitol Records Building completed
    type: Building
    year: 1956
    place: capitol-records-building
    prominence: 2
    note: "Completed in April 1956 (the article gives no day)."
    sources: [wp-capitol-records-building]
  - key: walk-of-fame-first-star
    name: First permanent star on the Hollywood Walk of Fame
    type: Building
    date: 1960-03-28
    place: hollywood-walk-of-fame
    prominence: 3
    people:
