discrepancies:
  - key: first-film-shot-in-hollywood
    question: Which was the first film shot in Hollywood?
    about: [{event: in-old-california-filmed}, {event: the-squaw-man-filmed}]
    claims:
      - {value: "In Old California (D. W. Griffith, 1910)", sources: [wp-in-old-california-1910, wp-hollywood-los-angeles], note: "The first film of any length shot in Hollywood."}
      - {value: "The Squaw Man (DeMille, 1914)", sources: [wp-in-old-california-1910, wp-cecil-b-demille], note: "Long thought the first; it is the first feature-length film shot there."}
    status: resolved
    resolution: "Both hold: In Old California (1910) was the first film shot in Hollywood, The Squaw Man (1913-14) the first feature. The records say so."
  - key: first-studio-in-hollywood
    question: When and where did the first film studio in Hollywood open?
    about: [{event: nestor-studio-opens}]
    field: date
    claims:
      - {value: "27 October 1911, Nestor Film Company, Blondeau Tavern at Sunset and Gower", sources: [wp-nestor-film-company, wp-hollywood-los-angeles]}
      - {value: "Early 1913, on Formosa Avenue", sources: [wp-hollywood-los-angeles]}
    note: "The Hollywood article gives both, in consecutive sentences. The event uses Nestor, 1911, which the Nestor article details."
  - key: universal-city-opening-date
    question: On what day did Universal City open in 1915?
    about: [{event: universal-city-opens}]
    field: date
    claims:
      - {value: 1915-03-14, sources: [wp-universal-studios-hollywood], note: "Start of a two-day grand opening."}
      - {value: 1915-03-15, sources: [wp-carl-laemmle]}
    note: "Both may be right if the 15th was the second day. The event uses 14 March, the start."
  - key: mary-pickford-birth-year
    question: Was Mary Pickford born in 1892 or 1893?
    about: [{person: mary-pickford}]
    field: born
    claims:
      - {value: 1892-04-08, sources: [wp-mary-pickford]}
      - {value: 1893-04-08, sources: [wp-mary-pickford], note: "The date on the plaque at her Toronto birthplace (1973); she let people think she was a year younger."}
    note: "The record uses 1892, the article's date; her birth was never registered."
  - key: simon-rodia-birth-year
    question: When was Simon Rodia born?
    about: [{person: simon-rodia}, {place: watts-towers}]
    field: born
    claims:
      - {value: 1878-02-12, sources: [wp-watts-towers], note: "The article's biography section."}
      - {value: "1879 or 1886", sources: [wp-watts-towers], note: "The article's opening paragraph."}
    note: "The record uses 1878, marked approximate, until a better source settles it."
  - key: chinese-theatre-handprints-origin
    question: How did the Chinese Theatre's handprint tradition begin?
    about: [{place: grauman-s-chinese-theatre}, {event: chinese-theatre-first-handprints}]
    claims:
      - {value: "Norma Talmadge stepped in the wet concrete by accident", sources: [wp-grauman-s-chinese-theatre, wp-sid-grauman], note: "The theatre's official account."}
      - {value: "Sid Grauman stepped in it himself, then asked Mary Pickford to add her foot", sources: [wp-grauman-s-chinese-theatre, wp-sid-grauman], note: "Grauman on Lux Radio Theatre, 1937."}
      - {value: "Mason Jean Klossner and Grauman thought of it together", sources: [wp-grauman-s-chinese-theatre], note: "Klossner's account, which he later changed."}
    note: "Pickford and Fairbanks were the first to be imprinted (30 April 1927) in every telling."
  - key: walk-of-fame-originator
    question: Who came up with the Hollywood Walk of Fame?
    about: [{place: hollywood-walk-of-fame}]
    field: built_by
    claims:
      - {value: "Harry Sugarman, Hollywood Improvement Association", sources: [wp-hollywood-walk-of-fame], note: "Some sources."}
      - {value: "E. M. Stuart, 1953 volunteer president of the Hollywood Chamber of Commerce", sources: [wp-hollywood-walk-of-fame], note: "The Chamber's own account."}
    note: "The place record names the Chamber and both men."
