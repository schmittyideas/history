people:
  # Film
  - key: d-w-griffith
    name: D. W. Griffith
    type: Artist
    roles: [film director]
    born: 1875-01-22
    died: 1948-07-23
    prominence: 4
    note: "Pioneer of film editing and narrative film; his short In Old California (1910) was the first film shot in Hollywood. Directed The Birth of a Nation (1915), a landmark denounced for glorifying the Ku Klux Klan. Co-founded United Artists (1919). Died in Los Angeles, found unconscious at the Knickerbocker Hotel."
    image_url: https://upload.wikimedia.org/wikipedia/commons/9/93/David_Wark_Griffith_portrait.jpg
    image_thumb: https://upload.wikimedia.org/wikipedia/commons/thumb/9/93/David_Wark_Griffith_portrait.jpg/500px-David_Wark_Griffith_portrait.jpg
    image_page: https://commons.wikimedia.org/wiki/File:David_Wark_Griffith_portrait.jpg
    image_license: Public domain
    coverage: partly
    coverage_note: "Life dates, In Old California and United Artists; filmography (about 520 films) not built out."
    sources: [wp-d-w-griffith, wp-in-old-california-1910]
  - key: cecil-b-demille
    name: Cecil B. DeMille
    type: Artist
    roles: [film director, film producer]
    born: 1881-08-12
    died: 1959-01-21
    prominence: 4
    note: "Founding father of American cinema: his first film, The Squaw Man (1914), was the first feature-length film shot in Hollywood, made in a rented barn at Selma and Vine. Co-founded what became Paramount. His The King of Kings opened Grauman's Chinese Theatre (1927). Entombed at Hollywood Forever."
    image_url: https://upload.wikimedia.org/wikipedia/commons/c/c9/Demille_-_c1920_%283x4_cropped%29.JPG
    image_thumb: https://upload.wikimedia.org/wikipedia/commons/thumb/c/c9/Demille_-_c1920_%283x4_cropped%29.JPG/500px-Demille_-_c1920_%283x4_cropped%29.JPG
    image_page: https://commons.wikimedia.org/wiki/File:Demille_-_c1920_(3x4_cropped).JPG
    image_license: Public domain
    coverage: partly
    coverage_note: "Life dates, The Squaw Man, the barn, Paramount and the Chinese Theatre premiere; his 70 features not built out."
    sources: [wp-cecil-b-demille, wp-the-squaw-man-1914]
  - key: jesse-l-lasky
    name: Jesse L. Lasky
    type: Artist
    roles: [film producer]
    born: 1880-09-13
    died: 1958-01-13
    prominence: 3
    note: "Vaudeville promoter turned producer; with Samuel Goldfish (Goldwyn) and DeMille he formed the Jesse L. Lasky Feature Play Company in 1913, a key founder of what became Paramount Pictures. Moved Paramount's studio to Marathon Street in 1926."
    image_url: https://upload.wikimedia.org/wikipedia/commons/d/d3/Jesse-lasky-1915.jpg
    image_thumb: https://upload.wikimedia.org/wikipedia/commons/d/d3/Jesse-lasky-1915.jpg
    image_page: https://commons.wikimedia.org/wiki/File:Jesse-lasky-1915.jpg
    image_license: Public domain
    coverage: partly
    coverage_note: "Life dates, the Lasky company, The Squaw Man and Paramount's move; later career not built out."
    sources: [wp-jesse-l-lasky, wp-paramount-pictures]
  - key: carl-laemmle
    name: Carl Laemmle
    type: Artist
    roles: [film producer]
    born: 1867-01-17
    died: 1939-09-24
    prominence: 3
    note: "German-born co-founder and, until 1934, owner of Universal Pictures. Opened Universal City in the San Fernando Valley in March 1915, the world's largest film production facility, with public tours. Died in Beverly Hills."
    image_url: https://upload.wikimedia.org/wikipedia/commons/0/09/Carl_Laemmle_holding_an_Oscar_trophy%2C_1930_Retouched.jpg
    image_thumb: https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/Carl_Laemmle_holding_an_Oscar_trophy%2C_1930_Retouched.jpg/500px-Carl_Laemmle_holding_an_Oscar_trophy%2C_1930_Retouched.jpg
    image_page: https://commons.wikimedia.org/wiki/File:Carl_Laemmle_holding_an_Oscar_trophy,_1930_Retouched.jpg
    image_license: Public domain
    coverage: partly
    coverage_note: "Life dates and Universal City; his 400 films and the Universal mergers not built out."
    sources: [wp-carl-laemmle]
  - key: mary-pickford
    name: Mary Pickford
    type: Artist
    roles: [actor, film producer]
    born: 1892-04-08
    died: 1979-05-29
    prominence: 4
    note: "'America's Sweetheart', Hollywood's first millionaire (by 1916). Co-founded United Artists (1919) and the Academy (1927); co-owned Grauman's Chinese Theatre and left the first prints in its forecourt with Fairbanks. Born in Toronto; died in a Santa Monica hospital. Birth year disputed (see discrepancy)."
    image_url: https://upload.wikimedia.org/wikipedia/commons/8/88/Mary_Pickford_cph.3c17995u.jpg
    image_thumb: https://upload.wikimedia.org/wikipedia/commons/thumb/8/88/Mary_Pickford_cph.3c17995u.jpg/500px-Mary_Pickford_cph.3c17995u.jpg
    image_page: https://commons.wikimedia.org/wiki/File:Mary_Pickford_cph.3c17995u.jpg
    image_license: Public domain
    coverage: partly
    coverage_note: "Life dates, United Artists, the Chinese Theatre and marriage to Fairbanks; films and Pickfair not built out."
    sources: [wp-mary-pickford]
  - key: douglas-fairbanks
    name: Douglas Fairbanks
    type: Artist
    roles: [actor, film producer]
    born: 1883-05-23
    died: 1939-12-12
    prominence: 3
    note: "'The King of Hollywood', the first screen Zorro. Co-founded United Artists (1919) and the Academy, and hosted the 1st Academy Awards (1929) as its president. His Robin Hood was the first premiere at the Egyptian Theatre (1922). Married Mary Pickford in 1920."
    image_url: https://upload.wikimedia.org/wikipedia/commons/6/6e/Douglas_Fairbanks_cropped.jpg
    image_thumb: https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Douglas_Fairbanks_cropped.jpg/500px-Douglas_Fairbanks_cropped.jpg
    image_page: https://commons.wikimedia.org/wiki/File:Douglas_Fairbanks_cropped.jpg
    image_license: Public domain
    coverage: partly
    coverage_note: "Life dates, United Artists, the Academy, the Hollywood theatres; films not built out."
    sources: [wp-douglas-fairbanks]
  - key: charlie-chaplin
    name: Charlie Chaplin
    type: Artist
    roles: [actor, film director]
    born: 1889-04-16
    died: 1977-12-25
    prominence: 5
    note: "English comic actor and filmmaker, creator of the Tramp. Built his own studio off Sunset Boulevard (completed January 1918) and co-founded United Artists (1919). His Walk of Fame star was withheld in 1960 under pressure from local businesses."
    image_url: https://upload.wikimedia.org/wikipedia/commons/8/82/Charlie_Chaplin_portrait_Getty_1739411952.jpg
    image_thumb: https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Charlie_Chaplin_portrait_Getty_1739411952.jpg/500px-Charlie_Chaplin_portrait_Getty_1739411952.jpg
    image_page: https://commons.wikimedia.org/wiki/File:Charlie_Chaplin_portrait_Getty_1739411952.jpg
    image_license: Public domain
    coverage: partly
    coverage_note: "Life dates, his studio and United Artists; films, exile and later life not built out."
    sources: [wp-charlie-chaplin, wp-hollywood-walk-of-fame]
  - key: walt-disney
    name: Walt Disney
    type: Artist
    roles: [animator, film producer]
    born: 1901-12-05
    died: 1966-12-15
    prominence: 5
    note: "Animation pioneer; moved to Hollywood in July 1923 and founded the Disney Brothers Studio with his brother Roy; created Mickey Mouse with Ub Iwerks (1928). Holds the record for Academy Awards won by an individual (22). Opened Disneyland in 1955. The concert hall downtown is named for him (his widow Lillian's gift)."
    image_url: https://upload.wikimedia.org/wikipedia/commons/5/50/Walt_Disney_1946_%28cropped2%29.JPG
    image_thumb: https://upload.wikimedia.org/wikipedia/commons/5/50/Walt_Disney_1946_%28cropped2%29.JPG
    image_page: https://commons.wikimedia.org/wiki/File:Walt_Disney_1946_(cropped2).JPG
    image_license: Public domain
    coverage: partly
    coverage_note: "Life dates, the studio's founding and Disneyland; films and studios not built out."
    sources: [wp-walt-disney]
  - key: sid-grauman
    name: Sid Grauman
    type: Artist
    roles: [showman, film exhibitor]
    born: 1879-03-17
    died: 1950-03-05
    prominence: 3
    note: "Showman who built Hollywood's two great movie palaces, the Egyptian (1922) and the Chinese (1927), and began the forecourt handprints. Died at Cedars-Sinai in Los Angeles."
    image_url: https://upload.wikimedia.org/wikipedia/commons/2/27/Sid_Grauman.jpg
    image_thumb: https://upload.wikimedia.org/wikipedia/commons/thumb/2/27/Sid_Grauman.jpg/500px-Sid_Grauman.jpg
    image_page: https://commons.wikimedia.org/wiki/File:Sid_Grauman.jpg
    image_license: Public domain
    coverage: partly
    coverage_note: "Life dates and the two Hollywood theatres; the downtown theatres (Million Dollar, Rialto, Metropolitan) not added."
    sources: [wp-sid-grauman]
  # Builders and benefactors
  - key: griffith-j-griffith
    name: Griffith J. Griffith
    type: Patron
    roles: [industrialist, philanthropist]
    born: 1850-01-04
    died: 1919-07-06
    prominence: 3
    note: "Welsh-born mining magnate who gave Los Angeles 3,015 acres for Griffith Park (1896) and left the money for the Greek Theatre and Griffith Observatory. Shot his wife in 1903 and served almost two years in prison."
    image_url: https://upload.wikimedia.org/wikipedia/commons/4/44/Griffith_Jenkins_Griffith.jpg
    image_thumb: https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/Griffith_Jenkins_Griffith.jpg/500px-Griffith_Jenkins_Griffith.jpg
    image_page: https://commons.wikimedia.org/wiki/File:Griffith_Jenkins_Griffith.jpg
    image_license: Public domain
    coverage: partly
    coverage_note: "Life dates, the park gift and the observatory bequest."
    sources: [wp-griffith-j-griffith]
  - key: abbot-kinney
    name: Abbot Kinney
    type: Patron
    roles: [developer, conservationist]
    born: 1850-11-16
    died: 1920-11-04
    prominence: 2
    note: "Tobacco fortune heir and developer who built 'Venice of America' (opened 4 July 1905), with canals dug to drain the marshes, on land south of Santa Monica."
    image_url: https://upload.wikimedia.org/wikipedia/commons/0/0b/Abbot_Kinney_portrait_circa_1900.jpg
    image_thumb: https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/Abbot_Kinney_portrait_circa_1900.jpg/500px-Abbot_Kinney_portrait_circa_1900.jpg
    image_page: https://commons.wikimedia.org/wiki/File:Abbot_Kinney_portrait_circa_1900.jpg
    image_license: Public domain
    coverage: partly
    coverage_note: "Life dates and Venice; Kinneloa, forestry and water work not built out."
    sources: [wp-abbot-kinney, wp-venice-los-angeles]
  - key: simon-rodia
    name: Simon Rodia
    type: Artist
    roles: [sculptor, tile mason]
    born: 1878
    born_estimated: true
    died: 1965-07-17
    prominence: 3
    note: "Sabato 'Simon' Rodia, an Italian immigrant construction worker from Serino, built the Watts Towers by himself from 1921 to 1954, then gave the property to a neighbour (1955) and moved to Martinez. Birth year disputed (see discrepancy)."
    coverage: partly
    coverage_note: "From the Watts Towers article (his name redirects there); no separate article."
    sources: [wp-watts-towers]
  - key: j-paul-getty
    name: J. Paul Getty
    type: Patron
    roles: [industrialist, art collector]
    born: 1892-12-15
    died: 1976-06-06
    prominence: 3
    note: "Oil industrialist (Getty Oil, 1942), once the world's wealthiest private citizen. His collection founded the J. Paul Getty Museum; he set up the Getty Trust in 1953 and built the Getty Villa (1974), which he never visited. The museum inherited over $661 million and built the Getty Center."
    image_url: https://upload.wikimedia.org/wikipedia/commons/c/ca/JP_Getty_1944_%28cropped%29_%282%29.jpg
    image_thumb: https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/JP_Getty_1944_%28cropped%29_%282%29.jpg/500px-JP_Getty_1944_%28cropped%29_%282%29.jpg
    image_page: https://commons.wikimedia.org/wiki/File:JP_Getty_1944_(cropped)_(2).jpg
    image_license: CC BY 4.0
    coverage: partly
    coverage_note: "Life dates and the Getty museums; business career and family not built out."
    sources: [wp-j-paul-getty, wp-getty-villa]
  - key: eli-broad
    name: Eli Broad
    type: Patron
    roles: [businessman, art collector, philanthropist]
    born: 1933-06-06
    died: 2021-04-30
    prominence: 2
    note: "Businessman and philanthropist; with his wife Edythe he paid for The Broad, the free contemporary art museum on Grand Avenue (2015). Died at Cedars-Sinai, Los Angeles."
    image_url: https://upload.wikimedia.org/wikipedia/commons/8/8a/Eli_Broad_%28cropped%29.jpg
    image_thumb: https://upload.wikimedia.org/wikipedia/commons/thumb/8/8a/Eli_Broad_%28cropped%29.jpg/500px-Eli_Broad_%28cropped%29.jpg
    image_page: https://commons.wikimedia.org/wiki/File:Eli_Broad_(cropped).jpg
    image_license: CC BY 2.0
    coverage: partly
    coverage_note: "Life dates and The Broad; his companies and education philanthropy not built out."
    sources: [wp-eli-broad, wp-the-broad]
  # Architects
  - key: frank-lloyd-wright
    name: Frank Lloyd Wright
    type: Artist
    roles: [architect]
    born: 1867-06-08
    died: 1959-04-09
    prominence: 4
    note: "American architect of organic architecture and the Prairie School; over 1,000 structures in 70 years, among them Fallingwater (1935). In Los Angeles he designed Hollyhock House (1919-1921) for Aline Barnsdall."
    image_url: https://upload.wikimedia.org/wikipedia/commons/3/30/Frank_Lloyd_Wright_portrait.jpg
    image_thumb: https://upload.wikimedia.org/wikipedia/commons/thumb/3/30/Frank_Lloyd_Wright_portrait.jpg/500px-Frank_Lloyd_Wright_portrait.jpg
    image_page: https://commons.wikimedia.org/wiki/File:Frank_Lloyd_Wright_portrait.jpg
    image_license: Public domain
    coverage: partly
    coverage_note: "Life dates and Hollyhock House only; his other works not built out."
    sources: [wp-frank-lloyd-wright, wp-hollyhock-house]
  - key: frank-gehry
    name: Frank Gehry
    type: Artist
    roles: [architect]
    born: 1929-02-28
    died: 2025-12-05
    prominence: 4
    note: "Canadian-American architect of sculptural, undulating buildings: the Guggenheim Bilbao, the Walt Disney Concert Hall (2003) and his own house in Santa Monica, where he died."
    image_url: https://upload.wikimedia.org/wikipedia/commons/7/75/Frank_Gehry%2C_Viljo_Revell_Centenary_reception%2C_2010_%28S2311_fl2969_it0089%29_%28cropped%29.jpg
