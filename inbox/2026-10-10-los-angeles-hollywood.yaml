# Los Angeles for a visitor: Hollywood, film and the landmarks, from about 1900 to today.
# VERIFIED against English Wikipedia articles downloaded on 2026-10-10 with tools/wiki.py (revision IDs in the
# session scratchpad). Every date, builder and role below comes from those articles. Stated honestly:
#  - Coordinates are from general knowledge (the articles give none) and are approximate to ~3 decimals.
#  - Leaves out mayors, City Hall, Union Station, the Coliseum, Dodger Stadium, the aqueduct and civic disasters:
#    a parallel batch covers those (PR #91, the mayors batch). The city place `los-angeles` comes from that batch,
#    so this file must be applied after it.
#  - TYPE QUESTION FOR TY: Griffith J. Griffith (industrialist), Abbot Kinney (developer), J. Paul Getty (oil, art
#    collector) and Eli Broad (businessman, art collector) fit none of the existing types (Royalty, Nobility, Clergy,
#    Artist, Writer, Composer, Scholar). They are typed `Patron` for now, which the site shows outside the Show
#    groups (always visible, sorted last). Change the type if you'd rather fold them into an existing group.
#  - Film people are `type: Artist` with film roles (film director, actor, film producer, animator); Sid Grauman
#    is an Artist with roles showman and film exhibitor. Architects are Artist with `architect`.
#  - Left out: Harvey Henderson Wilcox, who named Hollywood in 1887 (a landowner, same type question; he is named
#    in the Hollywood place note instead); Aline Barnsdall (Hollyhock House's client, named in built_by);
#    Louis B. Mayer and the Academy's founding (the Academy's article gives the Jan 1927 banquet, not a founding
#    day); Lloyd Wright's Bowl shells; Lillian Disney's gift; artworks (the free images are modern photos by
#    Commons users, not people in the database). Person pictures are linked directly, every one checked on
#    Commons as public domain or a free licence.
#  - Disneyland is in Anaheim (Orange County), not Los Angeles, but it is kept: Walt Disney built it and it is
#    on every visitor's list.
batch:
  title: "Los Angeles: Hollywood and the visitor's landmarks, 1900-today"
  requested: "Los Angeles from a tourist's perspective, working back from today to about 1900: the places a visitor goes, the people behind them, and the events that made them"
  date: 2026-10-10

