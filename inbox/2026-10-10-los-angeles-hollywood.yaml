    image_thumb: https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Richard_Meier_at_the_2009_Tribeca_Film_Festival.jpg/500px-Richard_Meier_at_the_2009_Tribeca_Film_Festival.jpg
    image_page: https://commons.wikimedia.org/wiki/File:Richard_Meier_at_the_2009_Tribeca_Film_Festival.jpg
    image_license: CC BY 3.0
    coverage: partly
    coverage_note: "Life dates and the Getty Center; other works not built out."
    sources: [wp-richard-meier, wp-getty-center]

places:
  # Districts and cities (the city of Los Angeles itself, `los-angeles`, comes from the mayors batch). Coordinates approximate.
