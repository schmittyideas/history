discrepancies:
  - key: james-ii-of-aragon-birth
    question: When was James II of Aragon born?
    about: [{person: james-ii-of-aragon}]
    field: born
    claims:
      - {value: "10 April 1267", sources: [wp-james-ii-of-aragon]}
      - {value: "c. 1264", sources: [wp-james-ii-of-aragon]}
    note: "The lead gives '10 April 1267 or c. 1264'. The record uses 10 April 1267, the first and the only dated value."
  - key: james-ii-of-aragon-death
    question: On which day of November 1327 did James II of Aragon die?
    about: [{person: james-ii-of-aragon}]
    field: died
    claims:
      - {value: "2 November 1327", sources: [wp-james-ii-of-aragon]}
      - {value: "3 November 1327", sources: [wp-james-ii-of-aragon]}
      - {value: "5 November 1327", sources: [wp-james-ii-of-aragon]}
    note: "The lead gives '2 or 5 or 3 November 1327'. The record and the title row hold the year only."
  - key: wenceslaus-ii-polish-kingship
    question: From when was Wenceslaus II King of Poland?
    about: [{person: wenceslaus-ii-of-bohemia}]
    field: date
    claims:
      - {value: "1296 (the lead: 'King of Poland (1296-1305)'; after Przemysl II died in 1296 Wenceslaus 'became overlord of Poland')", sources: [wp-wenceslaus-ii-of-bohemia]}
      - {value: "1300 (the body: he 'had himself crowned its king' in 1300)", sources: [wp-wenceslaus-ii-of-bohemia]}
    note: "The title row uses 1300, the coronation, as the plan asks. Przemysl II had himself been crowned king in 1295."
  - key: frederick-iii-sicily-coronation
    question: When was Frederick III crowned king of Sicily?
    about: [{person: frederick-iii-of-sicily}]
    field: date
    claims:
      - {value: "12 December 1295 (Charles II's article: Frederick 'was crowned king of Sicily on 12 December 1295'; his own lead has him king from 1295)", sources: [wp-charles-ii-of-naples, wp-frederick-iii-of-sicily]}
      - {value: "1296, 'crowned king by the nobles at Palermo' (his own biography)", sources: [wp-frederick-iii-of-sicily]}
    note: "The title row starts 1295, the lead's year; no coronation moment is entered."
  - key: treaty-of-anagni-1295-date
    question: On which day of June 1295 was the Treaty of Anagni concluded?
    about: [{event: treaty-of-anagni-1295}]
    field: date
    claims:
      - {value: "10 June 1295", sources: [wp-frederick-iii-of-sicily]}
      - {value: "12 June 1295 (Boniface VIII 'confirmed the compromise between James and Charles in Anagni')", sources: [wp-charles-ii-of-naples]}
    note: "The two dates may be the signing and the papal confirmation; neither article says so. The event holds the year only."
  - key: toqta-defeat-of-nogai
    question: When did Toqta defeat Nogai?
    about: [{person: toqta}, {event: toqta-defeats-nogai-1300}]
    field: date
    claims:
      - {value: "1299 ('In 1299, Tokhta finally defeated Nogai'; Stefan Milutin's article also gives Nogai's death as 1299)", sources: [wp-toqta, wp-stefan-milutin-of-serbia]}
      - {value: "1300 (battle of the Kagamlyk River, 'in 1300')", sources: [wp-toqta]}
      - {value: "1296 (Ghazan's article: Nogai was murdered and his wife Chubei fled to Ghazan in 1296)", sources: [wp-ghazan]}
    note: "The event uses 1300, the year of the battle named in Toqta's article. Milutin's article also hedges ('until 1296 or Nogai Khan's death in 1299')."
  - key: theodore-svetoslav-accession
    question: When did Theodore Svetoslav become tsar of Bulgaria?
    about: [{person: theodore-svetoslav-of-bulgaria}]
    field: date
    claims:
      - {value: "1300, after he had Chaka strangled (the lead and the main account)", sources: [wp-theodore-svetoslav-of-bulgaria]}
      - {value: "1299, with Chaka only a de facto suzerain (a 'more recent interpretation')", sources: [wp-theodore-svetoslav-of-bulgaria]}
    note: "The title row uses 1300, the lead's year."
  - key: vytenis-death
    question: When did Vytenis die?
    about: [{person: vytenis}]
    field: died
    claims:
      - {value: "c. 1316 (the lead: Grand Duke 'from c. 1295 to c. 1316')", sources: [wp-vytenis]}
      - {value: "ca. 1315 (the body; last mentioned in September 1315 at Christmemel)", sources: [wp-vytenis]}
    note: "The record has no died field; the title row ends 1315, estimated, the body's year."
  - key: david-viii-accession
    question: When did David VIII become king of Georgia?
    about: [{person: david-viii-of-georgia}]
    field: date
    claims:
      - {value: "1292 (the lead: king 'from 1292 until his death in 1311')", sources: [wp-david-viii-of-georgia]}
      - {value: "1293 (the body: appointed by Gaykhatu 'as reward for his military service during the Rumelian uprising in 1293')", sources: [wp-david-viii-of-georgia]}
    note: "The title row uses 1292, the lead's year."
  - key: maravarman-kulasekara-death
    question: When did Maravarman Kulasekara Pandyan I die?
    about: [{person: maravarman-kulasekara-pandyan-i}]
    field: died
    claims:
      - {value: "1308 (the article: 'ruled ... between 1268-1308' and 'died in 1308 CE')", sources: [wp-maravarman-kulasekara-pandyan-i]}
      - {value: "1310 (historian Sailendra Sen; also the Muslim chroniclers Wassaf and Amir Khusrau, who say he was killed by his son Sundara Pandyan III in 1310)", sources: [wp-maravarman-kulasekara-pandyan-i]}
    note: "The record and the title row use 1308."
  - key: ramkhamhaeng-death
    question: When did Ramkhamhaeng die?
    about: [{person: ramkhamhaeng}]
    field: died
    claims:
      - {value: "1298, succeeded by his son Loe Thai (the History of Yuan; also the lead's reign dates 1279-1298)", sources: [wp-ramkhamhaeng]}
      - {value: "'shortly before 1318' (George Coedes: 'more probable')", sources: [wp-ramkhamhaeng]}
    note: "The record has no died field; the title row ends 1298, the lead's year. The article also gives legends of his death (rapids at Sawankhalok; slain by a Malay warrior princess)."
  - key: raden-wijaya-accession
    question: When did Raden Wijaya's reign begin?
    about: [{person: raden-wijaya}, {event: founding-of-majapahit-1293}]
    field: date
    claims:
      - {value: "1292 (the lead: 'His reign lasted from 1292 to his death in 1309')", sources: [wp-raden-wijaya]}
      - {value: "1293 (the section 'Reign (1293-1309)'; Kediri fell and the Mongols were driven off in 1293)", sources: [wp-raden-wijaya]}
    note: "The title row and the founding event use 1293. Kertanagara was killed in 1292 and the Mongol force landed in November 1292."
