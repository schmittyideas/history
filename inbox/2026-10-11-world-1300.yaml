batch:
  title: "The world in 1300: rulers of the main states"
  requested: "One ruler for each major state on the Year-view map at 1300 (snapshot-year batch of the build-out), with a few dated events of 1285-1315"
  date: 2026-10-11

# Notes for the reviewer
# - Source: local copies of the English Wikipedia articles (wp6 directory; wp2 for Philip IV of France); nothing was fetched. Line 1-3 of every file was checked; all 29 plan articles were present and were the right article, none is a disambiguation page. Headings that differ from the plan title: Haakon_V_of_Norway is "Haakon V" (key haakon-v-of-norway), Stefan_Milutin is "Stefan Milutin" (Stefan Uros II Milutin, key stefan-milutin-of-serbia), Theodore_Svetoslav is "Theodore Svetoslav of Bulgaria" (key theodore-svetoslav-of-bulgaria), David_VIII_of_Georgia is "David VIII" (key david-viii-of-georgia), Ram_Khamhaeng is "Ramkhamhaeng" (key ramkhamhaeng), Kertarajasa_Jayawardhana is "Raden Wijaya" (key raden-wijaya; regnal name Kertarajasa Jayawardhana), Birger,_King_of_Sweden is "Birger, King of Sweden" (key birger-of-sweden), and the Pandya king's file is wp6/Maravarman_Kulasekara_Pandyan_I.txt (key maravarman-kulasekara-pandyan-i). Long articles (Ghazan, Al-Nasir Muhammad, Muhammad II of Granada, Denis, Charles II of Naples) were read selectively: lead, rise, reign, wars with the neighbours named here, death; their family sections and long detail were not worked through.
# - New realms (14): Grand Duchy of Lithuania, Grand Duchy of Moscow, Serbia, Empire of Trebizond, Emirate of Granada, Marinid Sultanate, Ilkhanate, Golden Horde, Chagatai Khanate, Mamluk Sultanate, Pandya dynasty, Ethiopian Empire, Sukhothai Kingdom, Majapahit. Aragon and Navarre come from inbox/2026-10-11-world-1100.yaml and Armenian Kingdom of Cilicia from inbox/2026-10-11-world-1200.yaml (referenced, never redefined), so those two batches must be applied first. Bulgaria, Georgia, Khmer Empire, Sicily, Naples, Barcelona, Venice, Bohemia, Poland and the other Western realms already exist. The place acre is defined in the 1200 batch and only referenced here; anagni, budapest, lisbon, naples, barcelona, palermo, oslo, cairo, venice and moscow already exist in earlier batches (moscow and others from the painters batches).
# - Title wording differs from the plan in two places, because the plan wording is not the person's actual rank: Stefan Milutin is "King of Serbia" (the plan said "Ruler of Serbia"; his article calls him King of Serbia 1282-1321), and Daniel of Moscow is "Prince of Moscow" (the plan said "Grand Prince of Moscow"; his article says he never became grand prince of Vladimir and calls him Prince of Moscow, forefather of the Moscow princes). Realm for both is as in the plan. Alexios II is "Emperor of Trebizond", Hethum II "King of Armenia" (realm Armenian Kingdom of Cilicia, as in the 1200 batch), David VIII "King of Georgia" (the article says mepe, king), Muhammad II "Emir of Granada" and al-Nasir Muhammad "Mamluk Sultan", all as in the plan.
# - Title rows NOT entered (extra titles or no stated start): James II of Aragon as King of Sicily (his article dates it 1285 in the lead and 1286 in the body) and King of Majorca 1291-1295 and Sardinia; Wenceslaus II as Duke of Cracow (1291); Andrew III as King of Croatia (lead only says Hungary and Croatia 1290-1301); Haakon V as Duke of Norway (from 1273); Charles II as Count of Provence, Prince of Achaea and the like; Frederick III as regent of Sicily 1291-1295; Ramkhamhaeng's elder brother Ban Mueang and Muhammad II's relatives. Toqta's death and Vytenis's death are only "c." in their articles, so those title ends are marked estimated; Indravarman III's end 1308 is the lead's range and the article gives no death date or place, so he has no died field. Nothing in the plan had to be dropped.
# - Dates given as year because the article gives no day or only a month: Abu Yaqub Yusuf (accession March 1286), Al-Nasir Muhammad's first reign (installed December 1293), the Serrata del Maggior Consiglio (February 1297), the Treaty of Caltabellotta (August 1302), Haakon V (1299), Denis (1279), Pietro Gradenigo (1289), Birger (1290). Charles II's title starts 1285 (his father's death on 7 January 1285; he was a prisoner and his realms were run by regents until 1288; Nicholas IV crowned him at Rieti on Whit Sunday 1289, a day the article does not number), so the row uses the lead's year.
# - Moment years are integers only (checked). Several people have no born/died place because the article gives none (Birger, Ghazan, Toqta, Duwa, Pietro Gradenigo's grave on Murano, Go-Fushimi's tomb in Fushimi-ku).
# - Discrepancies recorded below (12): James II's birth, James II's death day, Wenceslaus II's Polish kingship (1296 or 1300), Frederick III's coronation (1295 or 1296), the date of the Treaty of Anagni (10 or 12 June 1295), when Toqta beat Nogai (1296, 1299 or 1300), Theodore Svetoslav's accession (1299 or 1300), Vytenis's death (c. 1315 or c. 1316), David VIII's accession (1292 or 1293), Maravarman Kulasekara's death (1308 or 1310), Ramkhamhaeng's death (1298 or shortly before 1318), Raden Wijaya's accession (1292 or 1293). Seen and not entered (a range inside one article, a calendar point, or not about a record here): Alexios II's birth "Sept./Dec. 1282" (entered as 1282), Muhammad II's birth "1235 or 1236" (entered 1235, estimated), the Marinid siege of Tarifa "1293 (or 1294)" (Abu Yaqub's article) against "1294" (Muhammad II's article), the Wadi al-Khazandar day "23 or 24 December 1299", Hethum's alleged visit to Jerusalem in 1300 (the article says historians disagree and it is not entered), the Marj al-Saffar fighting (Hethum's article: 21 April 1303; Al-Nasir's: arrived 20 April, three days of fighting; Ghazan's: April 1303), Al-Nasir's mother and the Muhammad II poisoning allegation, Ramkhamhaeng's ceramics and alphabet claims.
# - Events: 11 new events (Fall of Acre 1291, Treaty of Anagni 1295, Ghazan's conversion 1295, Treaty of Alcanices 1297, Serrata del Maggior Consiglio 1297, Wadi al-Khazandar 1299, Toqta beats Nogai 1300, Treaty of Caltabellotta 1302, Marj al-Saffar 1303, founding of Majapahit 1293, coronation of Andrew III 1290) and 1 link-only update to an existing event (sicilian-vespers-1282, in inbox/2026-10-08-france-capetians-valois.yaml). The Aragonese Crusade (aragonese-crusade-1285) and the Battle of the Golden Spurs (battle-of-the-golden-spurs-1302) were looked at and not linked: none of the 29 articles names a person here as taking part in them. Bapheus is in the Ottoman batch. The Fall of Acre has no people linked: its leader, the Mamluk sultan al-Ashraf Khalil, is not a record here and Hethum II and Gradenigo are only mentioned in connection with it.
# - ADD title rows for existing persons: philip-iv-of-france gets "King of Navarre" 1284-1305 (his wp2 article's lead: "King of Navarre and Count of Champagne as Philip I from 1284 to 1305"; the marriage with Joan I of Navarre was on 16 August 1284). The source wp-philip-iv-of-france is repeated below with the same key and URL as in 2026-10-08-france-capetians-valois.yaml (a plain upsert). Wenceslaus II also gets a Poland row (King of Poland from 1300, see discrepancy).
# - Coordinates are general knowledge (2-3 decimals); Danilov Monastery, Odivelas, Caltabellotta and Anazarbus are approximate points. Alhambra is a new key (no earlier batch defines it). Obsidian: no links. Images: none.

