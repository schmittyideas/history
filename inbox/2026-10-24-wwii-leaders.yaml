discrepancies:
  - key: stalin-birth-date
    question: Was Stalin born on 18 December 1878 or 21 December 1879?
    about: [{person: joseph-stalin}]
    field: born
    claims:
      - {value: "1878-12-18 (6 December Old Style)", sources: [wp-joseph-stalin], note: "Church records and all pre-revolution documents (article footnote)"}
      - {value: "1879-12-21", sources: [wp-joseph-stalin], note: "The date Stalin gave after coming to power, celebrated in the USSR"}
    note: The record uses 1878-12-18, as the article does.
  - key: hirohito-birthplace
    question: Was Hirohito born at the Takanawa Imperial Residence or at Tōgū Palace in Aoyama?
    about: [{person: hirohito}]
    field: place
    claims:
      - {value: "Takanawa Imperial Residence, Tokyo", sources: [wp-hirohito], note: Infobox}
      - {value: "Tōgū Palace, Aoyama, Tokyo", sources: [wp-hirohito], note: "Body text (its link points to the Takanawa Residence article)"}
    note: The birth is filed at Tokyo until a source settles the building.
  - key: mussolini-dismissal-date
    question: Was Mussolini dismissed on 25 or 26 July 1943?
    about: [{person: benito-mussolini}, {person: victor-emmanuel-iii-of-italy}]
    field: date
    claims:
      - {value: "Grand Council vote 24 July, dismissed 25 July 1943", sources: [wp-benito-mussolini]}
      - {value: "Grand Council vote on the night of 25 July, audience the following afternoon", sources: [wp-victor-emmanuel-iii-of-italy]}
    note: His Prime Minister title ends on 25 July, as the Mussolini article and infobox give it.
  - key: de-gaulle-provisional-government-end
    question: Did de Gaulle's time as head of the Provisional Government end on 20 or 26 January 1946?
    about: [{person: charles-de-gaulle}]
    field: date
    claims:
      - {value: "1946-01-26", sources: [wp-charles-de-gaulle], note: Infobox (presumably when Félix Gouin took over)}
      - {value: "1946-01-20", sources: [wp-charles-de-gaulle], note: "Body: he abruptly resigned on 20 January 1946"}
    note: The title ends on 26 January, the infobox date; both may be right (resignation vs successor taking office).
  - key: eisenhower-shaef-start
    question: When did Eisenhower become Supreme Commander, Allied Expeditionary Force?
    about: [{person: dwight-d-eisenhower}]
    field: date
    claims:
      - {value: "1943-12-24", sources: [wp-dwight-d-eisenhower], note: Infobox}
      - {value: "February 1944", sources: [wp-dwight-d-eisenhower], note: "Body: chosen in December 1943, officially designated two months later; the succession box says 1944–1945"}
    note: The title starts on 24 December 1943, the infobox date (when Roosevelt's choice was announced).
  - key: victor-emmanuel-iii-ethiopia-end
    question: When did Victor Emmanuel III stop being Emperor of Ethiopia?
    about: [{person: victor-emmanuel-iii-of-italy}]
    field: date
    claims:
      - {value: "1941-05-05 (Haile Selassie back in Addis Ababa)", sources: [wp-victor-emmanuel-iii-of-italy], note: Infobox}
      - {value: "November 1943 (renounced his claims)", sources: [wp-victor-emmanuel-iii-of-italy], note: Body}
    note: The title ends on 5 May 1941, the infobox date.
