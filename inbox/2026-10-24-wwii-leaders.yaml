batch:
  title: "WWII, batch 1a: the war's leaders"
  requested: "Ty: search and find WWII events and famous people to add (batch 1 of the WWII build-out: leaders)"
  date: 2026-10-24

# Notes for the reviewer
# - Facts come from each person's English Wikipedia article, read through the Wikipedia API on 2026-10-24 (infobox, lead, birth and
#   death passages). Sitelinks are Wikipedia language editions only, from Wikidata on 2026-10-24. Place coordinates come from each
#   place's own article, or from its Wikidata coordinates where the article has none.
# - The outline events of the war (Munich, Poland, Pearl Harbor, Stalingrad, Hiroshima, the surrenders...) are in the next file,
#   2026-10-24-wwii-outline-events.yaml, so each preview stays near 150 rows.
# - Titles use each person's real offices, one wording per office (agreed with Ty on 2026-10-24). New realms: Germany, Soviet Union,
#   Italy, China, Italian Social Republic (the Mussolini article treats it as a separate German puppet state), Albania.
#   Chiang's presidency 1950-1975 was on Taiwan; it stays under realm China (the Republic of China), as his article does.
# - Military titles (kind: military, new in sql/018): Eisenhower's four commands, from his infobox, and Petain's two First World War
#   commands (2nd Army at Verdun; commander-in-chief of the French Army). Supreme commands held ex officio by heads of state
#   (Hitler over the Wehrmacht, Stalin as People's Commissar for Defence) are left out: they were powers of the office, not service.
#   Commanders proper (Patton, Zhukov, Rommel, Yamamoto...) come in batches 2 and 3.
# - Leslie Groves and Desmond Doss become type Military (agreed with Ty). Eisenhower stays Government.
# - Victor Emmanuel III as Emperor of Ethiopia (1936-1941) is marked disputed: a title taken by conquest while Haile Selassie
#   reigned in exile. King of the Albanians (1939-1943) likewise came by invasion but was not contested in the article.
# - Portraits: the article lead image, linked only, where Commons marks it public domain. Left out: Hitler (Commons: CC BY-SA 3.0 de,
#   Bundesarchiv/Hoffmann) and Chiang Kai-shek (Commons: Taiwan's GWOIA attribution licence), as the site links only public-domain
#   or CC0 pictures. Attlee's image is public domain on Commons but its author is uncertain (presumably Yousuf Karsh).
# - Places: Stalin's death is filed at Moscow (infobox "Moscow"; the body says he was found at his Kuntsevo Dacha, which has no
#   coordinates on Wikipedia or Wikidata). Hirohito's birth is filed at Tokyo, as the building is disputed (see discrepancies).
#   Attlee was born in Putney and died at Westminster Hospital: both are filed at London. Chamberlain was born at Southbourne,
#   Edgbaston: filed at Birmingham. Petain died in a private house at Port-Joinville on the Ile d'Yeu: filed at the island.
#   Hitler and Eva Braun died in the Fuhrerbunker (Death of Adolf Hitler; the Hitler article says only that they died "the next day"
#   after marrying in the bunker). Existing places reused: london, birmingham, munich, naples, alexandria, lille, moscow, tokyo,
#   westminster-abbey.
# - Not confirmed, so left out: Hitler's birth house, Chamberlain's house at Heckfield (the village is used), de Gaulle's churchyard
#   (Colombey is used), Chiang's place of death beyond Taipei.
# - Chiang's death: 5 April 1975 in the article; a hidden editor comment in the infobox says "(or 4 April)". The visible date is used;
#   not logged as a discrepancy, as no source is cited for 4 April.
# - Churchill's first term runs unbroken 1940-1945 as in his infobox (he resigned on 23 May 1945 and formed the caretaker ministry
#   the same day).

