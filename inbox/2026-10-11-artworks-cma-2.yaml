# Notes for the reviewer
# - Public-domain paintings by our painters, read through the official Cleveland Museum of Art API (https://openaccess-api.clevelandart.org/); nothing was scraped. Only works the museum marks as public domain / CC0 with an image. Second wave: painters with 40 or more Wikipedia editions. Up to 3 per painter, matched on the painter's full name in the museum's artist field.
# - 104 new artworks (works already in the database were skipped: 105) (images are hotlinked from the museum's servers, CC0).
# - Dates are the museum's own begin/end years; `estimated` where its date text says ca./c./probably.

