titles:
  # Cholas
  - {person: rajendra-chola-i, title: Chola Emperor, realm: Chola Empire, from: 1014, to: 1044, note: "Co-regent with Rajaraja I from 1012; became sole emperor in 1014. Died 1044; succeeded by Rajadhiraja I", sources: [wp-rajendra-chola-i]}
  - {person: rajadhiraja-chola-i, title: Chola Emperor, realm: Chola Empire, from: 1044, to: 1052-05-28, note: "Viceroy of the Pandya country from about 1018 and co-regent with his father; succeeded in 1044. Killed at Koppam on 28 May 1052 (the date is disputed, see the discrepancy)", sources: [wp-rajadhiraja-chola-i, wp-rajendra-chola-ii]}
  - {person: rajendra-chola-ii, title: Chola Emperor, realm: Chola Empire, from: 1052-05-28, to: 1063, note: "Co-regent from 1044 to 1052; took the throne on the battlefield at Koppam. Ruled to 1063", sources: [wp-rajendra-chola-ii]}
  - {person: virarajendra-chola, title: Chola Emperor, realm: Chola Empire, from: 1063, from_estimated: true, to: 1070, note: "The article says only that his rule lasted under ten years and ended in early 1070. The start year is the end of Rajendra II's reign. Succeeded by his son Athirajendra (not entered), then by Kulottunga I", sources: [wp-virarajendra-chola, wp-rajendra-chola-ii]}
  - {person: kulottunga-chola-i, title: Chola Emperor, realm: Chola Empire, from: 1070, to: 1122, to_estimated: true, note: "Succeeded his cousin Athirajendra. Also Eastern Chalukya king 1061-1118 (not entered). Vikrama Chola shared rule from 1118", sources: [wp-kulottunga-chola-i, wp-vikrama-chola]}
  - {person: vikrama-chola, title: Chola Emperor, realm: Chola Empire, from: 1118-06-29, to: 1135, note: "The article dates his accession to 29 June 1118 as co-regent with Kulottunga I, who lived until 1122; sole ruler from then. Ruled to 1135", sources: [wp-vikrama-chola]}
  - {person: kulottunga-chola-ii, title: Chola Emperor, realm: Chola Empire, from: 1135, to: 1150, note: "His inscriptions count his reign from 1133, when Vikrama Chola made him heir and co-regent. Succeeded by Rajaraja II in 1150", sources: [wp-kulottunga-chola-ii]}
  - {person: rajaraja-chola-ii, title: Chola Emperor, realm: Chola Empire, from: 1150, to: 1173, note: "His inscriptions count from 1146, when he became co-regent. The last regnal year in his inscriptions is 26, giving 1173", sources: [wp-rajaraja-chola-ii]}
  - {person: rajadhiraja-chola-ii, title: Chola Emperor, realm: Chola Empire, from: 1173, from_estimated: true, to: 1178, note: "The lead gives 1166-1178 and the Kulothunga III article 1163-1178; the Rajaraja II article implies accession at his death in 1173 (see the discrepancy). Kulottunga III dates his reign from 1178 although Rajadhiraja II lived to 1182", sources: [wp-rajadhiraja-chola-ii, wp-rajaraja-chola-ii]}
  - {person: kulottunga-chola-iii, title: Chola Emperor, realm: Chola Empire, from: 1178-07-07, from_estimated: true, to: 1218, note: "Article: ruled from c. 7 July 1178 to 1218 and made co-regent by Rajadhiraja II while young. Driven into exile with his son Rajaraja III by Maravarman Sundara Pandya in 1216, and restored by the Hoysalas. Died some time in 1218", sources: [wp-kulottunga-chola-iii]}
  - {person: rajaraja-chola-iii, title: Chola Emperor, realm: Chola Empire, from: 1216, to: 1246, note: "His own article: reigned from July 1216 to 1246 and died 1260; Kulothunga III's article puts him at 1218-1256. A civil war with his brother and rival Rajendra III ended his reign (see the discrepancies)", sources: [wp-rajaraja-chola-iii, wp-kulottunga-chola-iii]}
  - {person: rajendra-chola-iii, title: Chola Emperor, realm: Chola Empire, from: 1246, to: 1279, note: "The last Chola emperor. No confirmed account of his death; no Chola inscriptions after 1279", sources: [wp-rajendra-chola-iii]}
  # Western Chalukyas
  - {person: someshvara-i-western-chalukya, title: Western Chalukya King, realm: Western Chalukya Empire, from: 1045, from_estimated: true, to: 1068-03-29, note: "The article gives no accession year (he succeeded Jayasimha II). The start is c.1045, when the Cholas plundered Kalyani and he was already king; treat as a placeholder. Moved the capital from Manyakheta to Kalyani. Died by ritual drowning on 29 March 1068", sources: [wp-someshvara-i-western-chalukya]}
  - {person: someshvara-ii-western-chalukya, title: Western Chalukya King, realm: Western Chalukya Empire, from: 1068, to: 1076, note: "Succeeded in April 1068 (the article gives no day). Deposed and imprisoned by Vikramaditya VI in 1076", sources: [wp-someshvara-ii-western-chalukya]}
  - {person: vikramaditya-vi-western-chalukya, title: Western Chalukya King, realm: Western Chalukya Empire, from: 1076, to: 1126, note: "Article: Western Chalukya emperor. Started the Chalukya-Vikrama era in 1076", sources: [wp-vikramaditya-vi-western-chalukya]}
  - {person: someshvara-iii-western-chalukya, title: Western Chalukya King, realm: Western Chalukya Empire, from: 1126, to: 1138, note: "The article says he ascended in 1126 or 1127", sources: [wp-someshvara-iii-western-chalukya]}
  - {person: jagadhekamalla-ii-western-chalukya, title: Western Chalukya King, realm: Western Chalukya Empire, from: 1138, to: 1151, sources: [wp-jagadhekamalla-ii-western-chalukya]}
  - {person: tailapa-iii-western-chalukya, title: Western Chalukya King, realm: Western Chalukya Empire, from: 1151, to: 1162, note: "Killed by the Hoysala Vira Narasimha in 1162", sources: [wp-tailapa-iii-western-chalukya]}
  # Hoysalas
  - {person: vishnuvardhana-hoysala, title: Hoysala King, realm: Hoysala Empire, from: 1108, to: 1152, to_estimated: true, note: "Succeeded his elder brother Veera Ballala I in 1108. The end date is disputed (c.1152 against a little earlier)", sources: [wp-vishnuvardhana-hoysala]}
  - {person: veera-ballala-ii, title: Hoysala King, realm: Hoysala Empire, from: 1173-07-22, to: 1220, note: "Ascended on 22 July 1173 after a rebellion against his father Narasimha I", sources: [wp-veera-ballala-ii]}
  - {person: veera-ballala-iii, title: Hoysala King, realm: Hoysala Empire, from: 1303, from_estimated: true, to: 1342-09-08, note: "The article gives no accession year; 1303 (his first dated act as king) is a placeholder. Held both the northern and southern Hoysala branches from Halebidu. Died 8 September 1342 (c.1343 elsewhere in the article)", sources: [wp-veera-ballala-iii]}
  # Kakatiyas
  - {person: ganapati-deva-kakatiya, title: Kakatiya King, realm: Kakatiya dynasty, from: 1199, from_estimated: true, to: 1262, to_estimated: true, note: "Article: r. c. 1199-1262. Father Mahadeva died in 1198-1199; Ganapati was free by the Manthena inscription of 26 December 1199. Alive until at least 1269, but Rudrama ruled from about 1260", sources: [wp-ganapati-deva-kakatiya]}
  - {person: rudrama-devi, title: Kakatiya King, realm: Kakatiya dynasty, from: 1262, to: 1289, note: "Queen regnant ruling as Rudra-deva Maharaja; the same title as the kings. Co-regent from c.1260, sole ruler from 1263 and not formally anointed until at least 1269 (see the discrepancy). Died before 27 November 1289", sources: [wp-rudrama-devi, wp-ganapati-deva-kakatiya]}
  - {person: prataparudra-kakatiya, title: Kakatiya King, realm: Kakatiya dynasty, from: 1289, from_estimated: true, to: 1323, note: "Article: r. c. 1289-1323. Called Kumara Rudra in some records for some years after he became king. The dynasty ended with the Tughluq conquest of Warangal in 1323", sources: [wp-prataparudra-kakatiya, wp-rudrama-devi]}
  # Eastern Gangas, Gajapatis
  - {person: anantavarman-chodaganga-deva, title: Eastern Ganga King, realm: Eastern Ganga dynasty, from: 1078, to: 1150, note: "Article: Eastern Ganga emperor from 1078 until his death in 1150 (a 72-year reign). His father Rajaraja Deva I died in 1078 (Kulottunga I article)", sources: [wp-anantavarman-chodaganga-deva, wp-kulottunga-chola-i]}
  - {person: narasimhadeva-i-eastern-ganga, title: Eastern Ganga King, realm: Eastern Ganga dynasty, from: 1238, to: 1264, sources: [wp-narasimhadeva-i-eastern-ganga]}
  - {person: kapilendra-deva, title: Gajapati King, realm: Gajapati Kingdom, from: 1435-06-29, to: 1466-11-25, note: "Coronation as Gajapati at Old Bhubaneswar on 29 June 1435 (the article's conversion of the Madala Panji date), succeeding the last Eastern Ganga ruler Bhanu Deva IV; internal rebels suppressed by 1440. Died 25 November 1466", sources: [wp-kapilendra-deva]}
  # Vijayanagara
  - {person: harihara-i, title: Vijayanagara Emperor, realm: Vijayanagara Empire, from: 1336-04-18, to: 1355-11-20, note: "Founder of the empire; the Sangama dynasty's first ruler. Succeeded by his brother Bukka Raya I", sources: [wp-harihara-i]}
  - {person: bukka-raya-i, title: Vijayanagara Emperor, realm: Vijayanagara Empire, from: 1356, to: 1377-02-24, note: "Article: reigned 1356 to 24 February 1377, a 21-year reign (37 according to Nuniz). A gap of a few months follows Harihara I's death in November 1355; the article says only that Bukka reigned from 1356", sources: [wp-bukka-raya-i]}
  - {person: deva-raya-ii, title: Vijayanagara Emperor, realm: Vijayanagara Empire, from: 1423-02-10, to: 1446-05-24, sources: [wp-deva-raya-ii]}
  - {person: krishnadevaraya, title: Vijayanagara Emperor, realm: Vijayanagara Empire, from: 1509, to: 1529-10-17, note: "Emperor from 1509 (the article gives no day or place); the third ruler of the Tuluva dynasty. Died 17 October 1529", sources: [wp-krishnadevaraya]}
  - {person: achyuta-deva-raya, title: Vijayanagara Emperor, realm: Vijayanagara Empire, from: 1529-10-17, to: 1542, note: "Succeeded his brother Krishnadevaraya in 1529 (start taken from his death date). Died June 1542; the article gives no day", sources: [wp-achyuta-deva-raya, wp-krishnadevaraya]}
  - {person: aliya-rama-raya, title: Regent of Vijayanagara, realm: Vijayanagara Empire, from: 1542, to: 1565-01-23, note: "Regent and de facto ruler; the legal emperor in this period was Sadasiva Raya, a puppet (not entered). Not 'Vijayanagara Emperor' because the article calls him a regent. Killed at Talikota", sources: [wp-aliya-rama-raya, wp-achyuta-deva-raya]}
  # Bahmanis
  - {person: alauddin-bahman-shah, title: Bahmani Sultan, realm: Bahmani Sultanate, from: 1347-08-03, to: 1358-02-10, note: "Founder of the sultanate, proclaimed after Ismail Mukh abdicated at Daulatabad; headquarters at Hasanabad (Gulbarga)", sources: [wp-alauddin-bahman-shah]}
  - {person: firuz-shah-bahmani, title: Bahmani Sultan, realm: Bahmani Sultanate, from: 1397-11-16, to: 1422-09-22, note: "Abdicated in favour of his brother Ahmad on 22 September 1422; died 1 October", sources: [wp-firuz-shah-bahmani]}
  - {person: mahmud-gawan, title: Prime Minister of the Bahmani Sultanate, realm: Bahmani Sultanate, from: 1459, to: 1481-04-05, note: "Chief minister (Wakil-us-Sultanat) from Humayun Shah's accession in 1459 (the lead says 1458); after 1466 de facto ruler as prime minister. One row covers both stages. Executed 5 April 1481", sources: [wp-mahmud-gawan]}

places:
  - key: thanjavur
    name: Thanjavur
    kind: city
    region: Tamil Nadu
    country: India
    lat: 10.787
    lng: 79.139
    visitable: true
    visit_site: "Brihadisvara Temple"
    built_by: "The Rajarajeswaramudaiya Mahadevar (Brihadisvara) Temple was built by Rajaraja I and developed by Rajendra I"
    note: "Birthplace of Rajendra Chola I and the Chola capital before Gangaikonda Cholapuram. Maravarman Sundara Pandya sacked it in 1216. A 1058 inscription on the Brihadisvara Temple's south wall records Rajendra II's victory at Koppam."
    sources: [wp-rajendra-chola-i, wp-rajendra-chola-ii, wp-kulottunga-chola-iii]
  - key: gangaikonda-cholapuram
    name: Gangaikonda Cholapuram
    kind: city
    region: Tamil Nadu
    country: India
    lat: 11.206
    lng: 79.449
    visitable: true
    visit_site: "Gangaikonda Choleeswarar Temple"
    founded: 1022
    founded_estimated: true
    built_by: "Rajendra Chola I, to celebrate his victory on the Ganges"
    note: "The Chola capital Rajendra I built after the Ganges expedition, with a Shiva temple, a palace of burnt brick, fortifications and the Cholagangam tank. The article says construction began after his forces returned in 1022. The base of Chola coronations and Kulottunga I's capital; Rajendra II issued a grant from its Chola-Kerala palace."
    sources: [wp-rajendra-chola-i, wp-rajendra-chola-ii, wp-kulottunga-chola-i]
  - key: kanchipuram
    name: Kanchipuram
    historical_name: Kanchi
    kind: city
    region: Tamil Nadu
    country: India
    lat: 12.835
    lng: 79.704
    visitable: true
    note: "Next in importance to the Chola capital under Kulottunga I, who had a palace and bathing hall here. Vikramaditya VI held it from 1085 for a few years; Kulottunga III drove the Nellore Choda Nallasiddha out in 1196; the Hoysalas and Kakatiyas each occupied it."
    sources: [wp-kulottunga-chola-i, wp-vikramaditya-vi-western-chalukya, wp-kulottunga-chola-iii, wp-prataparudra-kakatiya]
  - key: madurai
    name: Madurai
    kind: city
    region: Tamil Nadu
    country: India
    lat: 9.925
    lng: 78.12
    visitable: true
    note: "Pandya capital. Rajendra I made it the headquarters of a Chola-Pandya viceroy over the Pandya and Chera lands. Kulottunga III performed a Virabhishekam at its court and demolished the Pandya coronation hall there in 1205. A Sultanate of Madurai arose about 1335-6."
    sources: [wp-rajendra-chola-i, wp-kulottunga-chola-iii, wp-veera-ballala-iii]
  - key: hampi
    name: Hampi (Vijayanagara)
    historical_name: Vijayanagara
    kind: city
    region: Karnataka
    country: India
    lat: 15.335
    lng: 76.462
    visitable: true
    visit_site: "Hampi (Group of Monuments)"
    note: "Capital of the Vijayanagara Empire. The articles give several accounts: Harihara I's 'Vidya Nagara' (1346); Bukka Raya I moving the capital to the south bank from Anegondi; Veera Ballala III's Hosapattna on the Tungabhadra, said to be the later Vijayanagara. Krishnadevaraya rebuilt the Virupaksha Temple. Sacked after Talikota (1565); the Royal Center was never rebuilt."
    built_by: "The Sangama rulers (Harihara I and Bukka Raya I); see note"
    sources: [wp-harihara-i, wp-bukka-raya-i, wp-krishnadevaraya, wp-battle-of-talikota, wp-veera-ballala-iii]
  - key: bidar
    name: Bidar
    kind: city
    region: Karnataka
    country: India
    lat: 17.913
    lng: 77.519
    visitable: true
    visit_site: "Bidar Fort and the Mahmud Gawan Madrasa"
    note: "Bahmani capital: Deva Raya II's article says Vijayanagara pressure forced the Bahmanis to move here about 1426. Gawan arrived at Bidar in 1453; the Malwa ruler besieged the fort in 1462 and the Gajapati Kapilendra came within ten miles in 1461."
    sources: [wp-deva-raya-ii, wp-mahmud-gawan, wp-kapilendra-deva]
  - key: mahmud-gawan-madrasa
    name: Mahmud Gawan Madrasa
    kind: madrasa
    city: Bidar
    region: Karnataka
    country: India
    lat: 17.9156
    lng: 77.5122
    visitable: true
    visit_site: "Mahmud Gawan Madrasa (Archaeological Survey of India)"
    founded: 1472
    built_by: "Mahmud Gawan"
    note: "A three-storey college with two minarets, a mosque, a library of 3,000 manuscripts and lecture halls. Damaged by a gunpowder explosion and storm in 1696; taken over by the Archaeological Survey of India in 1914. The coordinates are a point in the old town."
    sources: [wp-mahmud-gawan]
  - key: gulbarga
    name: Gulbarga (Kalaburagi)
    historical_name: Hasanabad
    kind: city
    region: Karnataka
    country: India
    lat: 17.329
    lng: 76.834
    visitable: true
    visit_site: "Gulbarga Fort and the Haft Gumbaz tombs"
    note: "First Bahmani capital: Bahman Shah's headquarters at Hasanabad from 1347. Firuz Shah proclaimed himself sultan here, died here on 1 October 1422 and was buried in the Haft Gumbaz, which he built in his lifetime. He founded Firozabad a few kilometres south. The second Bahmani capital was Bidar. Krishnadevaraya razed its fortress in his last battle."
    sources: [wp-alauddin-bahman-shah, wp-firuz-shah-bahmani, wp-krishnadevaraya]
  - key: warangal
    name: Warangal
    historical_name: Orugallu
    kind: city
    region: Telangana
    country: India
    lat: 17.968
    lng: 79.594
    visitable: true
    visit_site: "Warangal Fort"
    built_by: "Ganapati Deva (a new fortification with 75 bastions); the walls were raised and an outer wall and moat added by Rudrama"
    note: "Kakatiya capital, moved here from Anumakonda. Kulottunga III claimed to have entered it in 1208. Besieged by Alauddin Khalji's generals in 1302-3 and 1310 and by Ulugh Khan in 1323, when Prataparudra surrendered."
    sources: [wp-ganapati-deva-kakatiya, wp-rudrama-devi, wp-prataparudra-kakatiya]
  - key: belur
    name: Belur
    kind: city
    region: Karnataka
    country: India
    lat: 13.165
    lng: 75.865
    visitable: true
    visit_site: "Chennakesava Temple (UNESCO World Heritage Site)"
    built_by: "Vishnuvardhana; the Kappe Chennigaraya shrine within it by his queen Shantaladevi"
    note: "Vishnuvardhana built the Chennakesava (Vijayanarayana) Temple here to celebrate his victory over the Cholas."
    sources: [wp-vishnuvardhana-hoysala]
  - key: halebidu
    name: Halebidu
    historical_name: Dwarasamudra
    kind: city
    region: Karnataka
    country: India
    lat: 13.213
    lng: 75.994
    visitable: true
    visit_site: "Hoysaleswara Temple (UNESCO World Heritage Site)"
    built_by: "Vishnuvardhana (Hoysaleswara Temple, consecrated at about the same time as Belur); Veera Ballala II (Kedareshwara Temple)"
    note: "Hoysala capital. Plundered by Malik Kafur on 26 February 1311 and rebuilt in 1316; plundered again about 1327. Veera Ballala III ruled both Hoysala branches from here."
    sources: [wp-vishnuvardhana-hoysala, wp-veera-ballala-ii, wp-veera-ballala-iii]
  - key: talikota-battlefield
    name: Talikota battlefield
    historical_name: Rakshasi-Tangadi
    kind: battlefield
    region: Karnataka
    country: India
    lat: 16.47
    lng: 76.31
    note: "Site of the Battle of Talikota, 23 January 1565, on the banks of the Krishna. The article says the venue is variously given as Talikota, Rakkasagi-Tangadigi and Banahatti. The point is the town of Talikota and is approximate."
    sources: [wp-battle-of-talikota]
  - key: raichur
    name: Raichur Fort
    kind: fort
    region: Karnataka
    country: India
    lat: 16.205
    lng: 77.356
    visitable: true
    note: "Fortified by the Kakatiya feudatory Gona Vithala after he took Raichur in 1294. Krishnadevaraya took it from Ismail Adil Shah on 19 May 1520 after a siege that cost 16,000 Vijayanagara soldiers, with Portuguese gunners; Firuz Shah had earlier taken the Raichur Doab from Vijayanagara."
    sources: [wp-krishnadevaraya, wp-prataparudra-kakatiya, wp-firuz-shah-bahmani]
  - key: kalyani
    name: Kalyani (Basavakalyan)
    kind: city
    region: Karnataka
    country: India
    lat: 17.874
    lng: 76.949
    visitable: true
    note: "Western Chalukya capital from Someshvara I (who moved it from Manyakheta). Sacked by Rajadhiraja Chola I, who took the title Vijayarajendra and brought back a Dwarapalaka statue; Bijjala II seized it in 1157; Bahmani forces took the Kalyan fort after a five-month siege."
    sources: [wp-someshvara-i-western-chalukya, wp-rajadhiraja-chola-i, wp-tailapa-iii-western-chalukya, wp-alauddin-bahman-shah]
  - key: jagannath-temple-puri
    name: Jagannath Temple, Puri
    kind: temple
    city: Puri
    region: Odisha
    country: India
    lat: 19.805
    lng: 85.818
    visitable: true
    visit_site: "Jagannath Temple"
    built_by: "Anantavarman Chodaganga Deva (rebuilt late 11th century); Ananga Bhima Deva II built the walls; Kapilendra Deva expanded it and built the Narendra tank"
    note: "The article dates Chodaganga's building to the 11th century, 'near the end of the eleventh century'. Kapilendra Deva's Kurma and Meghanada walls and the Chandan Jatra festival belong to his reign."
    sources: [wp-anantavarman-chodaganga-deva, wp-kapilendra-deva]
  - key: konark-sun-temple
    name: Konark Sun Temple
    kind: temple
    city: Konark
    region: Odisha
    country: India
    lat: 19.888
    lng: 86.095
    visitable: true
    visit_site: "Konark Sun Temple"
    built_by: "Narasingha Deva I"
    note: "Built by Narasingha Deva I to commemorate his victories over the Bengal Muslims. The article gives no date for it; the legend of Dharmapada has no source before the 19th century."
    sources: [wp-narasimhadeva-i-eastern-ganga]

events:
  - key: chola-ganges-expedition-1021
    name: Chola expedition to the Ganges
    type: Campaign
    year: 1021
    end_year: 1022
    people:
      - {person: rajendra-chola-i, role: commander}
      - {person: mahipala-i, role: defeated}
    prominence: 4
    note: "Rajendra I's forces went through Kalinga to the Ganges and defeated the Pala king Mahipala, bringing back Ganges water in golden pots. Began in 1021 from Sakkarakottam and ended in 1022; he took the title Gangaikondan and founded Gangaikonda Cholapuram. Historians disagree on whether it was a pilgrimage or a military expedition (the article favours military)."
    sources: [wp-rajendra-chola-i]
  - key: chola-srivijaya-expedition-1025
    name: Chola naval expedition to Srivijaya
    type: Campaign
    year: 1025
    people:
      - {person: rajendra-chola-i, role: commander}
    prominence: 4
    note: "A fleet crossed the Indian Ocean, sacked Kadaram and Pannai and captured the Sailendra king Sangrama Vijayatunggavarman, ending Srivijaya's maritime power. The article's chronology also says the fleet sailed in 1023 and returned in 1024 (see the discrepancy); 1025 is the invasion year it gives in the section on Southeast Asia."
    sources: [wp-rajendra-chola-i]
  - key: battle-of-koppam-1052
    name: Battle of Koppam
    type: Battle
    date: 1052-05-28
    people:
      - {person: rajadhiraja-chola-i, role: killed}
      - {person: rajendra-chola-ii, role: victor}
      - {person: someshvara-i-western-chalukya, role: defeated}
    prominence: 4
    note: "Rajadhiraja I, leading from his elephant, was killed by Chalukya arrows. His brother Rajendra II took command, crowned himself on the field and routed Someshvara I, according to Chola inscriptions; the only Chalukya account is of c.1071 and mentions only Rajadhiraja's death. The date and site are disputed (see the discrepancy). No place defined."
    sources: [wp-rajadhiraja-chola-i, wp-rajendra-chola-ii, wp-someshvara-i-western-chalukya]
  - key: sack-of-kalyani-1045
    name: Chola sack of Kalyani
    type: Siege
    year: 1045
    estimated: true
    place: kalyani
    people:
      - {person: rajadhiraja-chola-i, role: victor}
      - {person: someshvara-i-western-chalukya, role: defeated}
    prominence: 3
    note: "Rajadhiraja I burned the Chalukya capital, performed the Virabhisheka there and took the title Vijayarajendra. The Someshvara I article dates it c.1045; the Rajadhiraja I article places it towards the end of his reign (see the discrepancy)."
    sources: [wp-someshvara-i-western-chalukya, wp-rajadhiraja-chola-i]
  - key: accession-of-kulottunga-i-1070
    name: Accession of Kulottunga Chola I
    type: Coronation
    year: 1070
    people:
      - {person: kulottunga-chola-i, role: crowned}
    prominence: 3
    note: "After the death of Virarajendra and the short reign of Athirajendra, Kulottunga ascended the Chola throne in 1070, ending a period of anarchy. Vikramaditya VI had tried to keep him out. The article gives no day or place."
    sources: [wp-kulottunga-chola-i, wp-vikramaditya-vi-western-chalukya]
  - key: battle-of-kannanur-1342
    name: Battle of Kannanur
    type: Battle
    year: 1342
    estimated: true
    people:
      - {person: veera-ballala-iii, role: captured}
    prominence: 3
    note: "Veera Ballala III fought Ghiyas-ud-din, Sultan of Madurai, in about 1342-3 and was captured when victory seemed near; one account says he was strangled and flayed. His death ended Hoysala power; his son Veera Ballala IV (not entered) is said to have died the same way about 1346. No place defined."
    sources: [wp-veera-ballala-iii]
  - key: sack-of-halebidu-1311
    name: Sack of Halebidu
    type: Siege
    date: 1311-02-26
    place: halebidu
    people:
      - {person: veera-ballala-iii, role: defeated}
    prominence: 3
    note: "Malik Kafur, Alauddin Khalji's commander, plundered the Hoysala capital; Veera Ballala III had to accept defeat and pay tribute and send his son Veera Virupaksha to Delhi (returned 1313). The city was rebuilt in 1316. The article says that Ferishta's claim that Kafur built a mosque there is legend."
    sources: [wp-veera-ballala-iii]
  - key: founding-of-vijayanagara-empire-1336
    name: Founding of the Vijayanagara Empire
    type: Founding
    date: 1336-04-18
    people:
      - {person: harihara-i, role: founder}
    prominence: 4
    note: "Harihara I ruled from 18 April 1336, as founder of the empire and the Sangama dynasty. The article gives no place for the founding."
    sources: [wp-harihara-i]
  - key: bahmani-capital-moves-to-bidar-1426
    name: Bahmani capital moves to Bidar
    type: Political
    year: 1426
    estimated: true
    place: bidar
    people:
      - {person: deva-raya-ii, role: opponent}
    prominence: 2
    note: "The Deva Raya II article says his successes against the Bahmanis as crown prince about 1423 forced them to switch capitals to Bidar about 1426. The Bahmani articles do not give the date; the Gawan article calls Bidar the capital by 1453."
    sources: [wp-deva-raya-ii, wp-mahmud-gawan]
  - key: founding-of-bahmani-sultanate-1347
    name: Founding of the Bahmani Sultanate
    type: Founding
    date: 1347-08-03
    place: gulbarga
    people:
      - {person: alauddin-bahman-shah, role: founder}
    prominence: 4
    note: "Ismail Mukh, the rebels' Sultan of Daulatabad, abdicated in favour of Zafar Khan, who founded the Bahmani Sultanate with its headquarters at Hasanabad (Gulbarga) on 3 August 1347."
    sources: [wp-alauddin-bahman-shah]
  - key: coronation-of-kapilendra-deva-1435
    name: Coronation of Kapilendra Deva
    type: Coronation
    date: 1435-06-29
    people:
      - {person: kapilendra-deva, role: crowned}
    prominence: 3
    note: "Rajyabhisheka at Old Bhubaneswar, as Gajapati, succeeding the last Eastern Ganga king Bhanu Deva IV (away on campaign). The date is the article's conversion of the Madala Panji's Odia date; he began the Kapilabda era. No place defined."
    sources: [wp-kapilendra-deva]
  - key: battle-of-katasin-1244
    name: Battle of Katasin
    type: Battle
    year: 1244
    estimated: true
    people:
      - {person: narasimhadeva-i-eastern-ganga, role: victor}
    prominence: 3
    note: "Narasingha Deva I's army beat the Bengal governor Tughril Tughan Khan at the fort of Katasin (Contai) with a surprise ambush. The article's heading says 1243 and its text 1244; the Bengal expedition began in 1242-1243. No place defined."
    sources: [wp-narasimhadeva-i-eastern-ganga]
  - key: accession-of-krishnadevaraya-1509
    name: Accession of Krishnadevaraya
    type: Coronation
    year: 1509
    people:
      - {person: krishnadevaraya, role: crowned}
    prominence: 4
    note: "Krishnadevaraya became emperor in 1509, the third Tuluva ruler. The article gives no day or place; it says his prime minister Timmarusu was the architect of his rise."
    sources: [wp-krishnadevaraya]
  - key: capture-of-raichur-1520
    name: Capture of Raichur
    type: Siege
    date: 1520-05-19
    place: raichur
    people:
      - {person: krishnadevaraya, role: victor}
    prominence: 4
    note: "After a hard siege in which 16,000 Vijayanagara soldiers died, Krishnadevaraya took Raichur Fort from Ismail Adil Shah of Bijapur with the help of Portuguese gunners under Cristovao de Figueiredo. He then advanced to Bijapur and later razed Gulbarga."
    sources: [wp-krishnadevaraya]
  - key: fall-of-warangal-1323
    name: Fall of Warangal
    type: Siege
    year: 1323
    place: warangal
    people:
      - {person: prataparudra-kakatiya, role: defeated}
    prominence: 4
    note: "Ulugh Khan (the future Muhammad bin Tughluq) besieged Warangal for Ghiyath al-Din Tughluq. A rumour of the Sultan's death forced him to retreat, but within four months he besieged the fort again and Prataparudra surrendered. The Kakatiya dynasty ended and the kingdom was annexed to the Delhi Sultanate."
    sources: [wp-prataparudra-kakatiya]
  - key: pandya-sack-of-thanjavur-1216
    name: Pandya conquest of the Chola heartland
    type: Campaign
    year: 1216
    place: thanjavur
    people:
      - {person: kulottunga-chola-iii, role: defeated}
      - {person: veera-ballala-ii, role: ally}
    prominence: 3
    note: "Maravarman Sundara Pandya invaded soon after his accession, sacked Thanjavur and Uraiyur, drove Kulottunga III and his son Rajaraja III into exile and performed a Virabhishekam in the Chola coronation hall at Ayirattali. Veera Ballala II's son Narasimha II then forced the Pandya to make peace and restore the Cholas as tributaries. The beginning of the second Pandya empire."
    sources: [wp-kulottunga-chola-iii, wp-veera-ballala-ii]
  - key: battle-of-talikota-1565
    name: Battle of Talikota
    type: Battle
    date: 1565-01-23
    place: talikota-battlefield
    people:
      - {person: aliya-rama-raya, role: defeated}
    prominence: 5
    note: "Also called Rakshasi-Tangadi. The sultans of Ahmadnagar (Husain Nizam Shah I), Bijapur (Ali Adil Shah I), Bidar (Ali Barid Shah I) and Golconda (Ibrahim Quli Qutb Shah) united against Rama Raya, who was killed (beheaded). Vijayanagara was then sacked and the Royal Center was never rebuilt; the Aravidu dynasty continued elsewhere. The four victorious sultans are not entered as people in this batch. The date, site and manner of Rama Raya's death are disputed."
    sources: [wp-battle-of-talikota, wp-aliya-rama-raya]

discrepancies:
  - key: koppam-date-and-site
    question: When and where was the Battle of Koppam, in which Rajadhiraja I died?
    about: [{event: battle-of-koppam-1052}, {person: rajadhiraja-chola-i}, {person: rajendra-chola-ii}]
    field: date
    claims:
      - {value: "28 May 1052 (Rajadhiraja's death; Rajendra II emperor from that date)", sources: [wp-rajadhiraja-chola-i, wp-rajendra-chola-ii]}
      - {value: "1054: the Chola invasion of Chalukya territory began in 1054, then Koppam", sources: [wp-rajadhiraja-chola-i]}
      - {value: "c.1054", sources: [wp-someshvara-i-western-chalukya]}
      - {value: "1053-54", sources: [wp-rajendra-chola-ii]}
    note: "The record uses 28 May 1052, given in two articles. The site is also given two ways: Koppam on the Krishna (Rajadhiraja article) and Koppal on the Tungabhadra (Rajendra II article)."
  - key: chola-srivijaya-expedition-dates
    question: When was Rajendra I's expedition against Srivijaya?
    about: [{event: chola-srivijaya-expedition-1025}, {person: rajendra-chola-i}]
    field: date
    claims:
      - {value: "1023 to 1024: the fleet sailed in 1023 and the expedition ended in 1024", sources: [wp-rajendra-chola-i]}
      - {value: "1025: Chola forces crossed the Indian Ocean and invaded Srivijaya", sources: [wp-rajendra-chola-i]}
    note: "Both claims are in the same article. The record uses 1025, the year given in the dedicated section and in the silver kasu of 1025."
  - key: kulottunga-i-lifespan
    question: What were Kulottunga I's birth and death dates?
    about: [{person: kulottunga-chola-i}]
    field: born
    claims:
      - {value: "Born c.1025, died c.1122 aged about 97 ('disputed')", sources: [wp-kulottunga-chola-i]}
      - {value: "In his teens or barely in his twenties when he ascended in 1070 (Sastri), which implies a birth about the 1040s", sources: [wp-kulottunga-chola-i]}
      - {value: "Died 1118: 'after the death of Kulottunga in 1118 AD' Vengi came under Vikrama Chola", sources: [wp-anantavarman-chodaganga-deva]}
    note: "The record uses 1025 and 1122, both estimated. Vikrama Chola's article has him co-regent from 1118 with Kulottunga alive until 1122."
  - key: rajadhiraja-ii-accession
    question: When did Rajadhiraja II's reign begin?
    about: [{person: rajadhiraja-chola-ii}, {person: rajaraja-chola-ii}, {person: kulottunga-chola-iii}]
    field: reign
    claims:
      - {value: "1166-1178", sources: [wp-rajadhiraja-chola-ii]}
      - {value: "1163-1178", sources: [wp-kulottunga-chola-iii]}
      - {value: "Rajaraja II's last regnal year is 26, i.e. 1173; he died four years after naming Rajadhiraja heir", sources: [wp-rajaraja-chola-ii]}
    note: "The record starts his title at 1173 (estimated), following Rajaraja II's article, and ends it at 1178. Kulottunga III dates his reign from 1178 although Rajadhiraja II lived to 1182."
  - key: rajaraja-iii-reign-dates
    question: When did Rajaraja III reign?
    about: [{person: rajaraja-chola-iii}, {person: kulottunga-chola-iii}, {person: rajendra-chola-iii}]
    field: reign
    claims:
      - {value: "July 1216 to 1246 (a Jambai inscription of 1239 is dated in his 23rd year)", sources: [wp-rajaraja-chola-iii]}
      - {value: "1218 to 1256", sources: [wp-kulottunga-chola-iii]}
      - {value: "1216-1257", sources: [wp-rajaraja-chola-iii]}
      - {value: "Rajendra III from 1246", sources: [wp-rajendra-chola-iii]}
    note: "The record uses 1216-1246, which two articles support and which the 1239 inscription fits. This overlaps Kulottunga III, whose article has him alive to 1218. The 1257 figure is in a passage about the Kadava Kopperunchinga."
  - key: rajaraja-iii-death
    question: How did Rajaraja III die, and when?
    about: [{person: rajaraja-chola-iii}, {person: rajendra-chola-iii}]
    field: died
    claims:
      - {value: "Died 1260", sources: [wp-rajaraja-chola-iii]}
      - {value: "Killed by Rajendra III after 'making him wear the double crown for three years'", sources: [wp-rajendra-chola-iii]}
    note: "The Rajaraja III article's own civil-war paragraph is garbled: it says Rajaraja killed Rajendra and took the throne, while quoting Rajendra's inscription that Rajendra killed Rajaraja. The record keeps 1260 only."
  - key: virarajendra-death-year
    question: When did Virarajendra die?
    about: [{person: virarajendra-chola}]
    field: died
    claims:
      - {value: "Early 1070", sources: [wp-virarajendra-chola, wp-someshvara-ii-western-chalukya]}
      - {value: "1069", sources: [wp-vikramaditya-vi-western-chalukya]}
    note: "The record uses 1070."
  - key: someshvara-i-death
    question: Where and how did Someshvara I die?
    about: [{person: someshvara-i-western-chalukya}]
    field: place
    claims:
      - {value: "Ritual drowning in the Tungabhadra at Kuruvatti (Bellary), 29 March 1068", sources: [wp-someshvara-i-western-chalukya]}
      - {value: "Virarajendra's records: he tried to hide in the western sea, possibly drowning in the Arabian Sea; March 1068", sources: [wp-virarajendra-chola]}
      - {value: "Bilhana: ritual suicide by drowning in the Tungabhadra", sources: [wp-kulottunga-chola-i]}
    note: "The record uses 29 March 1068, the only exact date, and the Tungabhadra."
  - key: sack-of-kalyani-date
    question: When did Rajadhiraja I sack Kalyani?
    about: [{event: sack-of-kalyani-1045}, {person: rajadhiraja-chola-i}]
    field: date
    claims:
      - {value: "c.1045, after victories at Dannada, Kampili and Pundur", sources: [wp-someshvara-i-western-chalukya]}
      - {value: "Towards the end of his reign (the second invasion, after 1050 and before 1054); he had earlier invaded in 1046", sources: [wp-rajadhiraja-chola-i]}
    note: "The Rajadhiraja article also seems to describe two campaigns and says 'the titles Kalyanapuramkonda and Vijaya Rajendra' came after his Kalyani victory late in his reign; Rajendra II's article suggests the burning of Kalyanapuram and the pillar at Kollapuram were earlier expeditions. The record uses c.1045."
  - key: vishnuvardhana-death-year
    question: When did Vishnuvardhana die?
    about: [{person: vishnuvardhana-hoysala}]
    field: died
    claims:
      - {value: "c.1152 (Sastri, Aiyangar, Desai)", sources: [wp-vishnuvardhana-hoysala]}
      - {value: "A little before c.1145, since the Yalladahalli record of c.1145 proclaims his son Narasimha I king (Kamath)", sources: [wp-vishnuvardhana-hoysala]}
    note: "The record uses c.1152, estimated."
  - key: veera-ballala-iii-death
    question: When did Veera Ballala III die?
    about: [{person: veera-ballala-iii}, {event: battle-of-kannanur-1342}]
    field: died
    claims:
      - {value: "8 September 1342", sources: [wp-veera-ballala-iii]}
      - {value: "c.1343 ('with his death in c. 1343'); Kannanur c.1342-3", sources: [wp-veera-ballala-iii, wp-harihara-i]}
    note: "The record uses 8 September 1342 for the person and c.1342 for the battle."
  - key: rudrama-reign-and-death
    question: When did Rudrama Devi's reign begin and end?
    about: [{person: rudrama-devi}, {person: ganapati-deva-kakatiya}]
    field: reign
    claims:
      - {value: "Reigned 1262 to November 1289", sources: [wp-rudrama-devi]}
      - {value: "Co-regent from c.1260 (1259-60 in the Ganapati article), sole ruler from 1263, but not formally anointed 'at least until 1269'; Ganapati is called the ruling sovereign in an inscription of 1266 and alive in 1269", sources: [wp-rudrama-devi, wp-ganapati-deva-kakatiya]}
      - {value: "Earlier historians: ruled until 1295; corrected by the Chandupatla inscription of 27 November 1289", sources: [wp-rudrama-devi, wp-prataparudra-kakatiya]}
    note: "The record uses 1262-1289; the old 1295 date is rejected by two articles."
  - key: prataparudra-birth
    question: When was Prataparudra born?
    about: [{person: prataparudra-kakatiya}]
    field: born
    claims:
      - {value: "Shaka 1166 (1244 CE), per Telugu-rajula-charitramu", sources: [wp-prataparudra-kakatiya]}
      - {value: "Shaka 1176 (1254 CE), if the 1166 is a copying mistake", sources: [wp-prataparudra-kakatiya]}
    note: "The record uses 1254, estimated. His grandmother Rudrama is said (Sastry) to have been about eighty in 1289, which also sits better with a later date; the earliest record naming him is of 1261."
  - key: chodaganga-maternal-grandfather
    question: Who was Anantavarman Chodaganga's maternal grandfather?
    about: [{person: anantavarman-chodaganga-deva}, {person: virarajendra-chola}, {person: kulottunga-chola-i}]
    field: parent
    claims:
      - {value: "Virarajendra Chola (his mother Rajasundari was Virarajendra's daughter)", sources: [wp-anantavarman-chodaganga-deva, wp-virarajendra-chola]}
      - {value: "Kulottunga I (S.N. Sen; Kielhorn, per the Kulottunga article)", sources: [wp-anantavarman-chodaganga-deva, wp-kulottunga-chola-i]}
      - {value: "Rajendra Chola (unspecified); Sastri identifies him with Virarajendra", sources: [wp-kulottunga-chola-i]}
    note: "Rajasundari's father is not linked in this batch."
  - key: first-gajapati-title
    question: Who first used the title Gajapati?
    about: [{person: anantavarman-chodaganga-deva}, {person: narasimhadeva-i-eastern-ganga}]
    field: title
    claims:
      - {value: "Anantavarman Chodaganga, 'the first Gajapati/Kunjaradhiparti' per the Ronaki stone inscription", sources: [wp-anantavarman-chodaganga-deva]}
      - {value: "Narasingha Deva I, first king of Kalinga to use Gajapati; first used in a 1246 inscription at Kapilash", sources: [wp-narasimhadeva-i-eastern-ganga]}
    note: "Both stay in their person notes. Kapilendra Deva's 'Gajapati King' title is for a different realm, the Gajapati Kingdom."
  - key: bukka-raya-i-end
    question: When did Bukka Raya I's reign end, and when did he die?
    about: [{person: bukka-raya-i}]
    field: died
    claims:
      - {value: "Reigned 1356 to 24 February 1377 (21 years)", sources: [wp-bukka-raya-i]}
      - {value: "Died about 1380, succeeded by Harihara II", sources: [wp-bukka-raya-i]}
      - {value: "A reign of 37 years, according to Nuniz", sources: [wp-bukka-raya-i]}
    note: "The record ends his title on 24 February 1377 and leaves out a death date."
  - key: krishnadevaraya-raichur-doab
    question: When did Krishnadevaraya conquer the Raichur Doab?
    about: [{person: krishnadevaraya}]
    field: date
    claims:
      - {value: "1509: the clash with the Deccan sultans in which Yusuf Adil Shah was killed and the Raichur Doab annexed", sources: [wp-krishnadevaraya]}
      - {value: "1512: the lead lists 'the conquest of the Raichur Doab in 1512'", sources: [wp-krishnadevaraya]}
    note: "Both are in the same article. Raichur Fort itself was taken on 19 May 1520. Only the 1520 capture is an event record."
  - key: talikota-date-site-death
    question: Where and when was the Battle of Talikota fought, and who killed Rama Raya?
    about: [{event: battle-of-talikota-1565}, {person: aliya-rama-raya}]
    field: place
    claims:
      - {value: "23 January 1565 at Talikota, on the banks of the Krishna", sources: [wp-battle-of-talikota, wp-aliya-rama-raya]}
      - {value: "The venue is also given as Rakkasagi-Tangadigi and Banahatti; there is 'debate as to the precise dates'", sources: [wp-battle-of-talikota]}
      - {value: "Rama Raya was beheaded by Sultan Nizam Hussain himself or by someone acting on his behalf, though Ali Adil Shah, a friend, did not intend it", sources: [wp-battle-of-talikota, wp-aliya-rama-raya]}
    note: "The record uses 23 January 1565 (in both articles) and the Talikota point. Whether the Gilani generals' defection decided the battle is also disputed in the article."
  - key: bahman-shah-origins
    question: Where was Ala-ud-Din Bahman Shah born and what was his background?
    about: [{person: alauddin-bahman-shah}]
    field: born
    claims:
      - {value: "Born at Ghazni (Isami); an Afghan by birth (Firishta)", sources: [wp-alauddin-bahman-shah]}
      - {value: "A native of Delhi and a servant of a Brahmin named Gangu (Firishta, Majumdar)", sources: [wp-alauddin-bahman-shah]}
      - {value: "A convert to Islam, described as a Brahmin in some later sources", sources: [wp-alauddin-bahman-shah]}
    note: "The record gives only 1291 as an estimated birth year (the article says 1290-1292) and no birthplace."
  - key: gawan-appointment-year
    question: When did Mahmud Gawan become chief minister?
    about: [{person: mahmud-gawan}]
    field: date
    claims:
      - {value: "1458 (lead)", sources: [wp-mahmud-gawan]}
      - {value: "1459, after Ahmad Shah II's death, by Humayun Shah", sources: [wp-mahmud-gawan]}
    note: "The record starts his title at 1459, with the full supremacy as prime minister from 1466."
