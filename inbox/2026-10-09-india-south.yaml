people:
  # ---- Cholas
  - key: rajendra-chola-i
    name: Rajendra Chola I
    type: Royalty
    realm: Chola Empire
    born: 971
    born_estimated: true
    died: 1044
    prominence: 5
    note: "Rajendra the Great, son of Rajaraja I; co-regent from 1012, Chola Emperor 1014-1044. Took the empire to its zenith: conquered Ruhuna in Sri Lanka, reached the Ganges (1021-1022), and sent a fleet against Srivijaya (1025). Built the new capital Gangaikonda Cholapuram. Died in 1044 at Brahmadesam; his queen Viramahadevi is recorded as dying with him. The lead gives a birth date of 26 July 971 but the text says the exact date is unknown."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-rajendra-chola-i]
  - key: rajadhiraja-chola-i
    name: Rajadhiraja Chola I
    type: Royalty
    realm: Chola Empire
    born: 994
    died: 1052-05-28
    prominence: 3
    note: "Rajendra I's second son, viceroy of the Pandya country from about 1018 and Chola Emperor 1044-1052. Sacked the Western Chalukya capital Kalyani and took the title Vijayarajendra. The only Chola emperor killed leading his army: died on his elephant at the Battle of Koppam (remembered as 'the king who died on top of an elephant')."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-rajadhiraja-chola-i]
  - key: rajendra-chola-ii
    name: Rajendra Chola II
    type: Royalty
    realm: Chola Empire
    born: 997
    born_estimated: true
    died: 1063
    prominence: 3
    note: "Rajendra I's third son; co-regent under Rajadhiraja I, then Chola Emperor from 28 May 1052 to 1063. Took command and turned Koppam into a Chola victory after his brother fell. Fought the Western Chalukyas again at Muddakaru and Kudalasangamam."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-rajendra-chola-ii]
  - key: virarajendra-chola
    name: Virarajendra Chola
    type: Royalty
    realm: Chola Empire
    born: 1002
    died: 1070
    prominence: 3
    note: "Youngest of Rajendra I's sons named in the article. Emperor for under ten years, ending in early 1070. Defeated Someshvara I repeatedly (Someshvara failed to appear at the appointed battle at Kudal Sangamam on 10 September 1067), allied with Vikramaditya VI and gave him a daughter in marriage. Founded a school for the Vedas and a hospital."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-virarajendra-chola]
  - key: kulottunga-chola-i
    name: Kulottunga Chola I
    type: Royalty
    realm: Chola Empire
    born: 1025
    born_estimated: true
    died: 1122
    died_estimated: true
    prominence: 4
    note: "Born Rajendra Choda, grandson of Rajendra I through his mother Ammangadevi and son of the Eastern Chalukya king Rajaraja Narendra; Eastern Chalukya king 1061-1118 and Chola Emperor 1070-1122. Ended the succession crisis, beat Vikramaditya VI in the Nangili campaign, put down the Pandya rebels, surveyed the land for tax and abolished tolls. Maintained ties with Srivijaya, China and the Khmer."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-kulottunga-chola-i]
  - key: vikrama-chola
    name: Vikrama Chola
    type: Royalty
    realm: Chola Empire
    prominence: 2
    note: "Fourth son of Kulothunga I; viceroy of Vengi from 1089, recalled in 1118 as co-regent and Chola Emperor from 29 June 1118 to 1135. Recovered Vengi from the Western Chalukyas by 1133 and covered the Chidambaram temple's vimana with gold. Called Tyagasamudra, 'ocean of sacrifice'."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-vikrama-chola]
  - key: kulottunga-chola-ii
    name: Kulottunga Chola II
    type: Royalty
    realm: Chola Empire
    died: 1150
    prominence: 2
    note: "Chola Emperor 1135-1150 (his inscriptions count from 1133, when he was made co-regent). Preferred Chidambaram to the capital and gilded the Nataraja temple's roof. Sekkizhar's Periyapuranam was written in his reign. Some historians say he was not Vikrama's son; some identify him with the Vaishnava persecutor Krimikanta Chola."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-kulottunga-chola-ii]
  - key: rajaraja-chola-ii
    name: Rajaraja Chola II
    type: Royalty
    realm: Chola Empire
    prominence: 2
    note: "Chola Emperor 1150-1173 (his inscriptions count from 1146, when he was made co-regent). A weak reign, with a Pandya succession dispute at its end. Began the Airavatesvara Temple at Darasuram. Chose Rajadhiraja II as heir as he had no suitable son."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-rajaraja-chola-ii]
  - key: rajadhiraja-chola-ii
    name: Rajadhiraja Chola II
    type: Royalty
    realm: Chola Empire
    died: 1182
    prominence: 2
    note: "Grandson of Vikrama Chola, chosen heir by Rajaraja II. Chola Emperor to 1178, then made Kulottunga III his co-regent; lived until 1182. Intervened on the side of Kulasekara in the Pandya civil war; the Chola and Sinhalese intervention ended with the Pandyas swallowing both."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-rajadhiraja-chola-ii]
  - key: kulottunga-chola-iii
    name: Kulottunga Chola III
    type: Royalty
    realm: Chola Empire
    died: 1218
    prominence: 3
    note: "Chola Emperor from about 7 July 1178 to 1218, the last great Chola ruler. Won three Pandya campaigns, checked the Hoysalas, recovered Vengi and Kanchipuram, and built the Sarabeswara Temple at Tribhuvanam. Lost to Maravarman Sundara Pandya in 1216 and became a tributary; the Hoysalas under Veera Ballala II restored him."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-kulottunga-chola-iii]
  - key: rajaraja-chola-iii
    name: Rajaraja Chola III
    type: Royalty
    realm: Chola Empire
    died: 1260
    prominence: 2
    note: "Described in his article as weak and incompetent. A Pandya invasion drove him out, and the Kadava chief Kopperunchinga imprisoned him at Sendamangalam until the Hoysala Vira Narasimha II forced his release. Overthrown by his brother and rival Rajendra III. Reign dates conflict between articles."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-rajaraja-chola-iii]
  - key: rajendra-chola-iii
    name: Rajendra Chola III
    type: Royalty
    realm: Chola Empire
    died: 1279
    died_estimated: true
    prominence: 3
    note: "The last Chola emperor, 1246-1279. Won early victories against the Pandyas and Hoysalas, but Jatavarman Sundara Pandya I forced him to acknowledge Pandya overlordship. No confirmed report of his death: he lived in obscurity at Pazhayarai, and no Chola inscriptions follow 1279."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-rajendra-chola-iii]

  # ---- Western Chalukyas
  - key: someshvara-i-western-chalukya
    name: Someshvara I
    type: Royalty
    realm: Western Chalukya Empire
    died: 1068-03-29
    prominence: 3
    note: "Ahavamalla or Trilokamalla, son of Jayasimha II. Moved the capital from Manyakheta to Kalyani. Fought the Cholas for decades (defeated at Dannada and Koppam, driven from Vengi, beaten at Kudalasangama) while raiding central India. Ended his life by ritual drowning on 29 March 1068 after failing to appear at Kudal Sangamam. The article gives no accession year."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-someshvara-i-western-chalukya]
  - key: someshvara-ii-western-chalukya
    name: Someshvara II
    type: Royalty
    realm: Western Chalukya Empire
    prominence: 2
    note: "Eldest son of Someshvara I; king from April 1068 to 1076. His brother Vikramaditya VI allied with the Chola Virarajendra against him. Allied with Kulothunga I, was defeated in a brief civil war in 1075 and imprisoned; his fate is unknown."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-someshvara-ii-western-chalukya]
  - key: vikramaditya-vi-western-chalukya
    name: Vikramaditya VI
    type: Royalty
    realm: Western Chalukya Empire
    died: 1126
    prominence: 4
    note: "The greatest Western Chalukya king and the longest-reigning, 1076-1126. Deposed his brother Someshvara II, founded the Chalukya-Vikrama era, held the empire from Tumkur and Cuddapah to the Narmada, and married a Chola princess. Patron of Bilhana (Vikramankadevacharita) and Vijnaneshwara (Mitakshara)."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-vikramaditya-vi-western-chalukya]
  - key: someshvara-iii-western-chalukya
    name: Someshvara III
    type: Royalty
    realm: Western Chalukya Empire
    died: 1138
    prominence: 2
    note: "Son of Vikramaditya VI; king 1126-1138 (the article says 1126 or 1127). Held the empire against the Cholas and a Hoysala rebellion under Vishnuvardhana. Scholar and author of the Manasollasa, an encyclopedia, and an unfinished biography of his father."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-someshvara-iii-western-chalukya]
  - key: jagadhekamalla-ii-western-chalukya
    name: Jagadhekamalla II
    type: Royalty
    realm: Western Chalukya Empire
    prominence: 2
    note: "King 1138-1151; Vengi was lost entirely in his reign, though he still controlled the Hoysalas and the Seuna. A Jain patron and author of the music treatise Sangita-chudamani."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-jagadhekamalla-ii-western-chalukya]
  - key: tailapa-iii-western-chalukya
    name: Tailapa III
    type: Royalty
    realm: Western Chalukya Empire
    died: 1162
    prominence: 2
    note: "King 1151-1162, brother of Jagadhekamalla II. Captured by the Kakatiya Prola II; the Kalachuri Bijjala II took Kalyani in 1157 and he fled to Annigeri. Killed by the Hoysala Vira Narasimha in 1162."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-tailapa-iii-western-chalukya]

  # ---- Hoysalas
  - key: vishnuvardhana-hoysala
    name: Vishnuvardhana
    type: Royalty
    realm: Hoysala Empire
    died: 1152
    died_estimated: true
    prominence: 4
    note: "Bittideva, Hoysala king from 1108 after his brother Veera Ballala I. Won Gangavadi from the Cholas (taking the title Talakadugonda), reached Kanchi, then pushed against the Western Chalukyas until defeated near the Krishna about 1122. Built or inspired the Chennakesava Temple at Belur and the Hoysaleswara Temple at Halebidu. Historians disagree on his death year (c.1152 against a little earlier)."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-vishnuvardhana-hoysala]
  - key: veera-ballala-ii
    name: Veera Ballala II
    type: Royalty
    realm: Hoysala Empire
    prominence: 4
    note: "The most notable Hoysala king, reigned 22 July 1173 to 1220. Beat the Yadavas at Soratur and Lakkundi in 1191, ruled Karnataka as far as the Malaprabha and Krishna, then lost the north to the Yadava Singhana II after 1212. Restored Kulottunga III against the Pandyas (taking the title 'Establisher of the Chola kingdom'). His daughter Somaladevi married Kulottunga III. Rebelled against his father Narasimha I."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-veera-ballala-ii]
  - key: veera-ballala-iii
    name: Veera Ballala III
    type: Royalty
    realm: Hoysala Empire
    born: 1262
    born_estimated: true
    died: 1342-09-08
    prominence: 3
    note: "The last great Hoysala king. Resisted Malik Kafur (Halebidu plundered 26 February 1311, rebuilt 1316) and Muhammad bin Tughluq's army (c.1327); founded a second capital, Hosapattna, on the Tungabhadra, said to have become Vijayanagara. Captured at the Battle of Kannanur by the Sultan of Madurai and, according to one account, strangled and flayed. Harihara I and Bukka Raya I served him."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-veera-ballala-iii]

  # ---- Kakatiyas
  - key: ganapati-deva-kakatiya
    name: Ganapati Deva
    type: Royalty
    realm: Kakatiya dynasty
    prominence: 4
    note: "Longest-reigning Kakatiya (c.1199-1262). Held captive by the Yadavas after his father Mahadeva died in 1198-1199; free by 26 December 1199. Brought most of the Telugu country under Kakatiya rule, fortified Warangal and fought the Eastern Gangas and Pandyas. Had no son; named his daughter Rudrama as successor. Still alive in 1269."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-ganapati-deva-kakatiya]
  - key: rudrama-devi
    name: Rudrama Devi
    type: Royalty
    realm: Kakatiya dynasty
    died: 1289
    prominence: 4
    note: "Rudra-deva Maharaja, Kakatiya queen regnant 1262-1289, ruling in her own right under a male name. Made co-regent about 1260 and sole ruler from 1263. Beat Yadava and Gajapati invasions, strengthened Warangal's walls and moat, and adopted her grandson Prataparudra as heir. Probably killed in November 1289 in the revolt of the Kayastha chief Amba-deva; the 27 November 1289 Chandupatla inscription records her death. Her Queen title is the same as a king's: 'Kakatiya King'."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-rudrama-devi]
  - key: prataparudra-kakatiya
    name: Prataparudra
    type: Royalty
    realm: Kakatiya dynasty
    born: 1254
    born_estimated: true
    died: 1323
    died_estimated: true
    prominence: 3
    note: "Last Kakatiya king (c.1289-1323), Rudrama's grandson. Crushed Amba-deva's Kayastha rebellion, then paid tribute to Alauddin Khalji after Malik Kafur's 1310 invasion. Surrendered Warangal to Ulugh Khan in 1323 and died on the way to Delhi, probably by suicide on the Narmada. Distinct from the Gajapati king Prataparudra Deva named in the Krishnadevaraya article (not entered)."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-prataparudra-kakatiya]

  # ---- Eastern Gangas, Gajapatis
  - key: anantavarman-chodaganga-deva
    name: Anantavarman Chodaganga Deva
    type: Royalty
    realm: Eastern Ganga dynasty
    died: 1150
    prominence: 3
    note: "Eastern Ganga emperor 1078-1150, ruling by his own inscription for 72 years; often counted the founder of the dynasty. Son of Rajaraja Deva I and the Chola princess Rajasundari. Conquered Utkala, moved the capital to Kataka (Cuttack), and built the Jagannath Temple at Puri. Defeated by Kulottunga I's general Karunakara Tondaiman, according to the Kalingattuparani."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-anantavarman-chodaganga-deva]
  - key: narasimhadeva-i-eastern-ganga
    name: Narasingha Deva I
    type: Royalty
    realm: Eastern Ganga dynasty
    prominence: 3
    note: "Langula Narasingha Deva I, Eastern Ganga king 1238-1264. Marched into Bengal in 1242-1243 and beat the Delhi Sultanate's governor Tughril Tughan Khan; built the Konark Sun Temple and the Raibania fort. First king of Kalinga to use the title Gajapati (1246 inscription, by his article)."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-narasimhadeva-i-eastern-ganga]
  - key: kapilendra-deva
    name: Kapilendra Deva
    type: Royalty
    realm: Gajapati Kingdom
    died: 1466-11-25
    prominence: 4
    note: "Founder of the Gajapati line and the most powerful Hindu king of his time. Seized the Eastern Ganga throne from Bhanu Deva IV (coronation 29 June 1435), put down internal rebels by 1440 and beat Jaunpur and Bengal. Took Rajamahendravaram, Kondaveedu and Telangana and reached Tiruchirappalli. By 1464 ruled from the Ganga to the south of the Krishna; took the titles Gauḍeśvara and Kalavargeśvara. Died 25 November 1466; his youngest son Purushottama succeeded him."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-kapilendra-deva]

  # ---- Vijayanagara
  - key: harihara-i
    name: Harihara I
    type: Royalty
    realm: Vijayanagara Empire
    born: 1306
    died: 1355-11-20
    prominence: 4
    note: "Hakka, founder of the Vijayanagara Empire and the Sangama dynasty; ruled from 18 April 1336. His origins are uncertain: a theory has the brothers as Kakatiya commanders taken to Delhi. Took full control of the Hoysala lands after Veera Ballala III's death in 1343; an inscription of 1346 calls him ruler of the country between the eastern and western seas, with his capital at Vidya Nagara."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-harihara-i]
  - key: bukka-raya-i
    name: Bukka Raya I
    type: Royalty
    realm: Vijayanagara Empire
    prominence: 3
    note: "Harihara I's brother and successor, reigned 1356 to 24 February 1377 (the article also says he died about 1380). Beat the Sultanate of Madurai in 1371 and extended the empire to Rameswaram; held the Tungabhadra-Krishna doab against the Bahmanis. Moved the capital from Anegondi to Vijayanagara on the south bank."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-bukka-raya-i]
  - key: deva-raya-ii
    name: Deva Raya II
    type: Royalty
    realm: Vijayanagara Empire
    died: 1446
    prominence: 4
    note: "Greatest of the Sangama emperors, reigned 10 February 1423 to 24 May 1446. Fought the Gajapatis of Odisha three times and the Bahmanis with mixed results. Scholar and patron of Kannada and Telugu poets; visited by Abdur Razzak and Nicolo Conti. The article gives the end of his reign but not a separate death date; the Kapilendra Deva article says he had died by 1446."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-deva-raya-ii]
  - key: krishnadevaraya
    name: Krishnadevaraya
    type: Royalty
    realm: Vijayanagara Empire
    born: 1471-01-17
    died: 1529-10-17
    prominence: 5
    note: "Third Tuluva ruler and the greatest Vijayanagara emperor, 1509-1529. Beat the Deccan sultans, took Udayagiri and Kondaveedu from the Gajapati Prataparudra Deva (1512-1514) and secured Raichur Fort on 19 May 1520. Patron of Telugu literature (the Ashtadiggajas) and author of the Amuktamalyada. Guided by his prime minister Timmarusu. Died 17 October 1529, succeeded by his brother Achyuta Deva Raya."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-krishnadevaraya]
  - key: achyuta-deva-raya
    name: Achyuta Deva Raya
    type: Royalty
    realm: Vijayanagara Empire
    died: 1542
    prominence: 2
    note: "Krishnadevaraya's brother, emperor from 1529 to June 1542. Contended with the growing power of Rama Raya, who imprisoned him in a coup about 1540. Built the Tiruvengalanatha (Achyutaraya) temple at Vijayanagara. On his death the succession was disputed; his son Venkata I was killed and Sadasiva Raya became emperor under Rama Raya's regency."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-achyuta-deva-raya]
  - key: aliya-rama-raya
    name: Aliya Rama Raya
    type: Nobility
    roles: [regent]
    realm: Vijayanagara Empire
    born: 1484
    died: 1565-01-23
    prominence: 4
    note: "Rama Raya, son-in-law ('aliya') of Krishnadevaraya and founder of the Aravidu dynasty. Regent and de facto ruler 1542-1565 while Sadasiva Raya was the legal emperor and kept as a virtual prisoner. Played the Deccan sultans against each other until they united. Led the defence at Talikota in 1565 and was beheaded after the battle; Vijayanagara was then sacked."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-aliya-rama-raya, wp-battle-of-talikota]

  # ---- Bahmanis
  - key: alauddin-bahman-shah
    name: Ala-ud-Din Bahman Shah
    type: Royalty
    realm: Bahmani Sultanate
    born: 1291
    born_estimated: true
    died: 1358-02-10
    prominence: 4
    note: "Born Zafar Khan (Hasan Gangu), founder and first Sultan of the Bahmani Sultanate, 3 August 1347 to 1358. Took Gulbarga from the Tughlaqs in 1346 and was proclaimed when Ismail Mukh abdicated at Daulatabad; headquarters at Hasanabad (Gulbarga). Campaigned against Warangal in 1350 and fought Vijayanagara. His origin and birthplace are disputed."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-alauddin-bahman-shah]
  - key: firuz-shah-bahmani
    name: Taj ud-Din Firuz Shah
    type: Royalty
    realm: Bahmani Sultanate
    died: 1422-10-01
    prominence: 3
    note: "Firuz Shah Bahmani, Sultan from 16 November 1397 to 22 September 1422. Won the Raichur Doab, beat Vijayanagara in 1398 and 1406 (the 'War of the Goldsmith's Daughter', after which he married Deva Raya I's daughter), lost at Pangal and abdicated to his brother Ahmad. Founded the city of Firozabad near Gulbarga. Died at Gulbarga on 1 October 1422 and was buried in the Haft Gumbaz."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-firuz-shah-bahmani]
  - key: mahmud-gawan
    name: Mahmud Gawan
    type: Nobility
    roles: [statesman]
    realm: Bahmani Sultanate
    born: 1411
    died: 1481-04-05
    prominence: 4
    note: "Imadu'd-din Mahmud, a Persian merchant who came to Bidar in 1453 and became chief minister, then de facto ruler as prime minister from 1466. Pushed the Bahmani Sultanate to its greatest extent (Konkan, Goa in February 1472, Belgaum) and built the Mahmud Gawan Madrasa at Bidar (1472). Executed on 5 April 1481 on Muhammad Shah III's orders over a forged letter; the Deccani nobles, his rivals, had forged it."
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    sources: [wp-mahmud-gawan]

