batch:
  title: "South India, 1000-1600: Cholas, Western Chalukyas, Hoysalas, Kakatiyas, Eastern Gangas, Gajapatis, Vijayanagara and the Bahmanis"
  requested: "Thirty-six rulers and ministers of South India from Rajendra Chola I to Aliya Rama Raya, with reigns, key events, places and discrepancies"
  date: 2026-10-09

# Notes for the reviewer
# - Source: local copies of the English Wikipedia articles (wp3 directory); nothing fetched. Every file was read in full. Several article titles differ from the request: Rajendra_Chola_I is "Rajendra I", Kulottunga_Chola_I is "Kulottunga I", Kulothunga_Chola_II/III are "Kulothunga II/III", Aliya_Rama_Raya is "Rama Raya", Narasimhadeva_I is "Narasingha Deva I", Anantavarman_Chodaganga_Deva is "Anantavarman Chodaganga", Firuz_Shah_Bahmani is "Taj ud-Din Firuz Shah", Alauddin_Bahman_Shah is "Ala-ud-Din Bahman Shah". Source URLs below are the ones in each file header.
# - Existing records: rajaraja-i (Chola Emperor 985-1014) is only used as the parent in one link; mahipala-i only as the defeated party in the Ganges expedition. satyashraya is not touched (no article in this batch adds anything to him). Realms Chola Empire and Western Chalukya Empire are not redefined.
# - New realms defined here: Hoysala Empire, Kakatiya dynasty, Eastern Ganga dynasty, Gajapati Kingdom, Vijayanagara Empire, Bahmani Sultanate. The sibling (north) batch may define some of these too; the spelling is the one in the brief.
# - Titles: "Chola Emperor", "Western Chalukya King", "Hoysala King", "Kakatiya King" (also for Rudrama, a woman ruling in her own right), "Eastern Ganga King", "Gajapati King", "Vijayanagara Emperor", "Bahmani Sultan", "Prime Minister of the Bahmani Sultanate" (Mahmud Gawan, Nobility). Rama Raya: the article says he was regent and de facto ruler 1542-1565 while Sadasiva Raya was the legal (puppet) emperor, so he gets the title "Regent of Vijayanagara" (Nobility). Sadasiva Raya has no article in this batch and is not entered.
# - Left out: Kulottunga I's other title, Eastern Chalukya king of Vengi 1061-1118 (no such realm entered); Chola co-regencies (Rajadhiraja I 1018-1044, Rajendra II 1044-1052, Kulothunga II from 1133, Rajaraja II from 1146, Kulottunga III's guardian arrangement) are mentioned in notes only, titles start at the sole reign. The four sultans who won at Talikota (Husain Nizam Shah I, Ali Adil Shah I, Ali Barid Shah I, Ibrahim Quli Qutb Shah) have no article in this batch and no dates, so they are named in the event note and not entered as people; the brief's "link the sultans who won" could not be done without inventing records. Their sultanates have no realm entries here. Consorts, courts, poets, Sri Lankan, Pandya, Yadava and Delhi opponents are not entered (Alauddin Khalji, Malik Kafur, Ulugh Khan/Muhammad bin Tughluq and Ghiyath al-Din Tughluq belong to the north batch, whose keys are unknown here).
# - Accession years the articles do not give (flagged in each title note): Someshvara I (the article never dates his accession; title starts c.1045, the first date at which he is shown as king, estimated), Veera Ballala III (title starts c.1303, the first dated act of his reign, estimated), Virarajendra (1063, taken from the end of Rajendra II's reign; the article says only "less than 10 years"). Treat these three starts as placeholders.
# - Overlaps: Vikrama Chola's title starts 29 June 1118 as the article's lead says, while Kulothunga I's runs to 1122 (joint rule); Kulottunga III runs to 1218 and Rajaraja III starts 1216 (see discrepancy). Shown as overlaps rather than invented gaps.
# - Dates: where an article gives a month but no day the year is used. Vijayanagara's founding date (18 April 1336) and Krishnadevaraya's birth (17 January 1471) are as the articles give them. Krishnadevaraya's accession in 1509 has no day or place in the article. The Kapilendra coronation date, 29 June 1435, is the article's conversion from the Madala Panji's Odia date.
# - Coordinates are from general knowledge (2-3 decimals); the Talikota, Raichur and Kalyani points are approximate. "visitable" flags and visit_site names are general knowledge, not from the articles. Founding years for places are given only where an article supports them (Gangaikonda Cholapuram, estimated; Mahmud Gawan Madrasa 1472).
# - Hampi/Vijayanagara: the articles give three accounts of the capital's origin (Harihara I at "Vidya Nagara" in 1346; Bukka I moving it to the south bank from Anegondi; Veera Ballala III founding "Hosapattna", later Vijayanagara, per Heras and Coelho). Recorded in the place note, not as a discrepancy record.
# - Thanjavur: the Rajendra I article both says Gangaikonda Cholapuram replaced Thanjavur as capital and that Thanjavur "became the capital for the next 250 years"; no date or role is taken from that sentence.
# - Not entered because the article gives no date, or gives only a vague one: Rajendra I's death place (Brahmadesam, Tiruvannamalai district; no place record); Kulothunga II's coronation at Chidambaram (no year); Rajendra I's Maski, Donur and Unkal campaigns; Hoysala Talakad (1116 only in the Vikramaditya VI article); Kakatiya siege of Warangal 1310 and Malik Kafur's invasion (in the Prataparudra note only); Ganapati's release from captivity (26 December 1199 inscription, in the title note); Devarakonda 1458 and the Gajapati-Bahmani wars; Bahmani-Vijayanagara wars (Firuz's defeat at Pangal: 1419 in the lead, 1420 in the text); Vikramaditya VI's deposing of Someshvara II (1076, in title notes); Mahmud Gawan's execution (5 April 1481) is in his person record only; Rudrama's death (November 1289) likewise.
# - Discrepancies recorded below: Koppam date and site; Chola expedition to Srivijaya; Kulottunga I's lifespan; Rajadhiraja II's accession; Rajaraja III's reign and death; Virarajendra's death year; Someshvara I's death; the sack of Kalyani; Vishnuvardhana's death; Veera Ballala III's death; Rudrama's reign start; Prataparudra's birth; Anantavarman's maternal grandfather; the first Gajapati title; Bukka Raya I's end; Krishnadevaraya's Raichur Doab conquest; Talikota's date, site and Rama Raya's killer; Bahman Shah's origins; Mahmud Gawan's appointment year. Seen and not entered as records: Rajendra I's birth (26 July 971 in the lead, "around 971, exact date unknown" in the text; the record uses 971, estimated); Someshvara III's accession (1126 or 1127); Kulothunga II's parentage (Sastri and Subramanian say he was not Vikrama's son; his article otherwise says Vikrama named him heir); Kulottunga III's length of reign (40 years in his article, 50 for Kulottunga I there, against 52 elsewhere); Narasingha Deva I's reign (1238-1264 against "27 years"); Katasin dated 1243 in a heading and 1244 in the text (event uses 1244, estimated); Firuz Shah's defeat at Pangal (1419 or 1420).
# - Size: 36 people, 36 title rows, 6 realms, 16 places, 17 events, 20 discrepancies (131 rows), 10 links, 3 moments. Slightly over the 120 guide: no ruler dropped.

