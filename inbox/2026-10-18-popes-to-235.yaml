# The Papacy, c. 30-235 (the early Roman church): the 19 popes from Saint Peter to Pontian, the first to abdicate, and
# the earliest antipopes, Natalius (c. 199) and Hippolytus of Rome (217-235).
# Ty's choice (2026-10-18): every pope on the official list, including those whose dates and even whose lives rest on
# tradition, with the dates marked estimated ("c.") and a note where the article calls them traditional.
# Conventions and checks as the earlier Papacy batches (inbox/2026-10-18-popes-*.yaml): each person's own English
# Wikipedia article (2026-10-18) for dates and note, the List of popes and the Antipope table for pontificates and
# birthplaces. Pontificate dates before 230 are the List of popes' traditional years and are all estimated.
# Stated honestly: the earliest birthplaces are the List of popes' traditional ones (Bethsaida, Volterra, Athens,
# Bethlehem, Aquileia, Emesa, Fundi); regional ones ("Italia", Nicopolis, the province of Africa) are left in the notes.
batch:
  title: "The Papacy, c. 30-235"
  requested: "Do we have all popes? Get them all, with the disputed ones (antipopes) marked disputed"
  date: 2026-10-18

