people:
  - {key: saint-peter, name: "Saint Peter", type: Clergy, roles: [pope], died: 64, died_estimated: true, realm: Papacy, prominence: 5, sitelinks: 154, sitelinks_on: 2026-10-18,
     note: "Simon, son of Jonah, a fisherman like his brother Andrew and one of the twelve apostles of Jesus, prominent in the gospels and Acts. Catholic and Orthodox tradition counts him the first bishop of Rome and of Antioch; by tradition he was crucified upside down in Rome under Nero. Dates traditional.",
     sources: [wp-saint-peter]}
  - {key: linus, name: "Linus", type: Clergy, roles: [pope], realm: Papacy, prominence: 2, sitelinks: 98, sitelinks_on: 2026-10-18,
     note: "Traditionally the second bishop of Rome, after Peter; Irenaeus identified him with the Linus of the Second Epistle to Timothy. Dates traditional (c. 64-76, or 68-80).",
     sources: [wp-linus]}
  - {key: anacletus, name: "Anacletus", type: Clergy, roles: [pope], realm: Papacy, prominence: 1, sitelinks: 92, sitelinks_on: 2026-10-18,
     note: "Cletus, traditionally the third bishop of Rome and the first Greek; credited with ordaining priests and setting up about 25 parishes in Rome. Dates uncertain.",
     sources: [wp-anacletus]}
  - {key: clement-i, name: "Clement I", type: Clergy, roles: [pope], died: 99, realm: Papacy, prominence: 3, sitelinks: 110, sitelinks_on: 2026-10-18,
     note: "Clement of Rome, the first of the Apostolic Fathers, said by Tertullian to have been ordained by Peter; author of the letter known as First Clement.",
     sources: [wp-clement-i]}
  - {key: evaristus, name: "Evaristus", type: Clergy, roles: [pope], died: 107, died_estimated: true, realm: Papacy, prominence: 1, sitelinks: 87, sitelinks_on: 2026-10-18,
     note: "A Hellenised Jew, traditionally born in Bethlehem; pope c. 99-107, when John the Apostle probably died, ending the Apostolic Age.",
     sources: [wp-evaristus]}
  - {key: alexander-i, name: "Alexander I", type: Clergy, roles: [pope], died: 115, died_estimated: true, realm: Papacy, prominence: 1, sitelinks: 87, sitelinks_on: 2026-10-18,
     note: "Traditionally the fifth pope after Peter, perhaps martyred under Trajan or Hadrian; credited with the custom of blessing houses with holy water.",
     sources: [wp-alexander-i]}
  - {key: sixtus-i, name: "Sixtus I", type: Clergy, roles: [pope], died: 126, died_estimated: true, realm: Papacy, prominence: 1, sitelinks: 86, sitelinks_on: 2026-10-18,
     note: "A Roman of Greek descent, pope c. 117-126; feast day 6 April.",
     sources: [wp-sixtus-i]}
  - {key: telesphorus, name: "Telesphorus", type: Clergy, roles: [pope], died: 137, died_estimated: true, realm: Papacy, prominence: 1, sitelinks: 83, sitelinks_on: 2026-10-18,
     note: "Of Greek descent, pope c. 126-137 under Hadrian and Antoninus Pius; traditionally a martyr.",
     sources: [wp-telesphorus]}
  - {key: hyginus, name: "Hyginus", type: Clergy, roles: [pope], died: 142, died_estimated: true, realm: Papacy, prominence: 1, sitelinks: 83, sitelinks_on: 2026-10-18,
     note: "A Greek, pope c. 138-142; tradition credits him with defining the grades of the clergy and instituting godparents at baptism.",
     sources: [wp-hyginus]}
  - {key: pius-i, name: "Pius I", type: Clergy, roles: [pope], died: 154, died_estimated: true, realm: Papacy, prominence: 1, sitelinks: 83, sitelinks_on: 2026-10-18,
     note: "Brother of the freedman Hermas; pope c. 140-154, opposed the Valentinians and Gnostics. Traditionally martyred.",
     sources: [wp-pius-i]}
  - {key: anicetus, name: "Anicetus", type: Clergy, roles: [pope], died: 168, realm: Papacy, prominence: 1, sitelinks: 81, sitelinks_on: 2026-10-18,
     note: "From Emesa, the first Syrian pope (c. 157-168); opposed Gnosticism and Marcionism and received Polycarp of Smyrna in Rome over the Easter controversy.",
     sources: [wp-anicetus]}
  - {key: soter, name: "Soter", type: Clergy, roles: [pope], died: 174, died_estimated: true, realm: Papacy, prominence: 1, sitelinks: 80, sitelinks_on: 2026-10-18,
     note: "From Fundi (Fondi) in Lazio, pope c. 167-174; held that marriage was valid only when blessed by a priest. Traditionally martyred.",
     sources: [wp-soter]}
  - {key: eleutherius, name: "Eleutherius", type: Clergy, roles: [pope], died: 0189-05-24, realm: Papacy, prominence: 1, sitelinks: 84, sitelinks_on: 2026-10-18,
     note: "A Greek from Nicopolis, pope c. 174-189; a legend has him receive a letter from 'Lucius, King of Britain'.",
     sources: [wp-eleutherius]}
  - {key: victor-i, name: "Victor I", type: Clergy, roles: [pope], died: 199, realm: Papacy, prominence: 2, sitelinks: 82, sitelinks_on: 2026-10-18,
     note: "A Berber from the Roman province of Africa, the first pope born in Africa (c. 189-199). Feast day 28 July.",
     sources: [wp-victor-i]}
  - {key: zephyrinus, name: "Zephyrinus", type: Clergy, roles: [pope], died: 0217-12-20, realm: Papacy, prominence: 1, sitelinks: 80, sitelinks_on: 2026-10-18,
     note: "A Roman who fought the heresies of his day and defended the divinity of Christ; succeeded by his adviser Callixtus I (217).",
     sources: [wp-zephyrinus]}
  - {key: callixtus-i, name: "Callixtus I", type: Clergy, roles: [pope], died: 222, died_estimated: true, realm: Papacy, prominence: 2, sitelinks: 81, sitelinks_on: 2026-10-18,
     note: "Of Greek descent, pope c. 218-222 under Elagabalus and Severus Alexander; readmitted repentant sinners to the Church, which drew Hippolytus's opposition. Martyred.",
     sources: [wp-callixtus-i]}
  - {key: urban-i, name: "Urban I", type: Clergy, roles: [pope], died: 230, realm: Papacy, prominence: 1, sitelinks: 84, sitelinks_on: 2026-10-18,
     note: "A Roman, successor of the martyred Callixtus I; long thought a martyr, he probably died of natural causes.",
     sources: [wp-urban-i]}
  - {key: pontian, name: "Pontian", type: Clergy, roles: [pope], died: 235, realm: Papacy, prominence: 1, sitelinks: 80, sitelinks_on: 2026-10-18,
     note: "Arrested in Maximinus Thrax's persecution and sent with Hippolytus to the mines of Sardinia, he resigned on 28 September 235 so a successor could be chosen: the first pope to abdicate. He and Hippolytus may have been reconciled before they died.",
     sources: [wp-pontian]}
  - {key: natalius-antipope, name: "Natalius (antipope)", type: Clergy, roles: [antipope], realm: Papacy, prominence: 1, sitelinks: 12, sitelinks_on: 2026-10-18,
     note: "A priest who took the bishopric of the Adoptionists in Rome; he soon repented and tearfully begged Zephyrinus to readmit him. Known only from Eusebius.",
     sources: [wp-natalius-antipope]}
  - {key: hippolytus-of-rome, name: "Hippolytus of Rome", type: Clergy, roles: [antipope], born: 170, born_estimated: true, died: 235, died_estimated: true, realm: Papacy, prominence: 3, sitelinks: 62, sitelinks_on: 2026-10-18,
     note: "One of the most important Christian thinkers of the 2nd and 3rd centuries, who opposed Callixtus I and led a rival community against him and his successors; exiled with Pontian to Sardinia (235), he is venerated as a saint.",
     sources: [wp-hippolytus-of-rome]}

