batch:
  title: "North India and the Delhi Sultanate to the Mughals, c.1000-1600"
  requested: "Rulers of North India (Palas, Senas, Ghurids, Chahamanas, Delhi Sultanate in five dynasties, Timur's sack, Paramaras, Chaulukyas, Mewar, Gujarat Sultanate, Mughals, Sur Empire) with their main battles, places and disagreements between sources"
  date: 2026-10-09

# Notes for the reviewer (NORTH batch of the India build-out; the SOUTH batch is written separately)
# - Source: local copies of English Wikipedia articles (scratchpad wp3/). Nothing was fetched. Every article was read in full except Akbar (read lines 1-135 plus the death and consort passages: campaigns, capitals and death only) and Timur (read the lead, the Delhi campaign, the title section and the death; the rest is Middle East and Central Asia).
# - Vijaya Sena and Kumarapala (Chaulukya) were added from the corrected articles. Vijaya Sena's article gives no reign dates (only 'about 62 years' and 'immediately after the demise of Ramapala'), so he has NO title row; he is a person with a parent link to Ballala Sena. Kumarapala (Chaulukya King, 1143-1172, end of reign estimated) has a title; the article's Vikrama-to-CE conversions are inconsistent (see kumarapala-accession). The Pala king Kumarapala is not entered.
# - Left out: Aram Shah, Ruknuddin Firuz, Muizuddin Bahram, Qaiqabad, Kayumars, Qutb ud-Din Mubarak Shah, Khusrau Khan, Mubarak Shah and Alam Shah (Sayyids), Islam Shah and Adil Shah Suri, Malik Kafur, Ghiyath al-Din of Ghor, Taj al-Din Yildiz, Qabacha, Bairam Khan, Man Singh I, Udai Singh II, the rulers of Malwa and the Chandelas: no article was supplied. Their names appear only in notes.
# - Places not in the NORTH list and not defined: Dhar (Bhoja's capital), Champaner and Ahmedabad (Begada), Kalanaur (Akbar's enthronement), Kabul and Samarkand (Babur's and Timur's burials), Kalinjar (Sher Shah's death), Sasaram, Ranthambore, Gwalior, Kalpi, Kumbhalgarh, Gogunda and Chavand (Mewar), Dhamiak, Amarkot, Kara-Manikpur and Thatta. Events and moments that need them carry no place. Two places outside the list ARE defined because the brief names the events: qutb-minar (Aibak's tower, and the burial place of Iltutmish and Alauddin) and daulatabad (Muhammad bin Tughluq's capital move of 1327). If the SOUTH batch also sends daulatabad, keep one; the keys are the same.
# - Left out as minor or undated: Ramapala's Varendra campaign and the move to Ramavati (no dates); Bakhtiyar Khalji's capture of Nadia (the Lakshmana Sena article gives no year); Rana Kumbha's battles (Sarangpur, Nagore, Mandalgarh: no dates in the article); Bayana (Feb 1527), Chanderi (1528) and Ghaghra (1529); Akbar's Gujarat, Bengal and Deccan campaigns; Bhoja's wars (only c. dates, none dated to a year); Mahmud Begada's Junagadh, Dwarka and Kutch campaigns. Only the Pavagadh/Champaner conquest (21 Nov 1484) is entered for Begada.
# - Titles: one wording per realm as the brief fixes it. Notes say where the articles use another form (Khalji sultans, Mewar's 'Maharana'). Timur's 'Amir' is from the article's Legitimization section (he used Amir, not Khan); his start is 'around 1370' so from_estimated. Hemu's 'Hindu Emperor' title row follows the brief; the Hemu and Akbar articles say he 'claimed royal status' as Vikramaditya, and historians disagree whether it was an independent kingship (Satish Chandra doubts it), so it is marked disputed: true and given the realm 'Delhi Sultanate' as instructed. Khizr Khan took no royal title (he used Rayat-i-Ala) but the article calls him sultan of Delhi 1414-1421, so he has the common title with a note.
# - Prominence 5: Second Tarain, the founding of the Delhi Sultanate, First Panipat, and the persons Alauddin Khalji, Babur and Akbar (as the brief says). Khanwa, Second Panipat and Haldighati are 4.
# - Dates: where an article gives only a month the year is used and the note says so (Chausa June 1539, Jalal-ud-din's accession June 1290, Razia's accession November 1236, Ranthambore July 1301, Mongol siege August 1303). Dates are as the articles print them (Julian before 1582, so Babur's death is 26 December 1530 in the lead; see the discrepancy).
# - Coordinates are from general knowledge (2-3 decimals); the Khanwa and Haldighati battlefield points and Tarain are approximate. 'visitable' and 'visit_site' are general knowledge, not from the articles.
# - Iltutmish: the lead gives 1192 as his birth year, but the text says he was a boy sold as a slave and bought by Aibak after 1197. These cannot both hold, so no birth year is entered (see iltutmish-birth). Likewise Ghiyath al-Din Tughluq, Bahlul Lodi, Ballala Sena, Lakshmana Sena, Vijaya Sena and Kumarapala have no birth year in their articles; Mahmud Begada has only an age at accession (about 13-14) so none is entered; Timur is '1320s' (see timur-dates), so none is entered.
# - Prithviraj Chauhan is entered as prithviraj-iii-chauhan, Ghiyath al-Din Balban as ghiyas-ud-din-balban (article title 'Balban'), Razia as razia-sultana (article title 'Razia Sultan'), Bhoja as bhoja-of-malwa (the Paramara king, r. c. 1010-1055).
# - Existing records are not touched. mahmud-of-ghazni, mahipala-i, rajaraja-i and satyashraya are not referenced: none of these articles gives a new fact about them that is dated. Mahmud's sack of Somnath is a Ghaznavid record and is not entered; Alauddin's 1299 raid on Gujarat (which also hit Somnath) is a separate event here.
# - Doubts: (1) the Delhi Sultanate title for Aibak starts on 25 June 1206 in Lahore (informal accession; formal recognition 1208-09 by Ghiyas al-Din Mahmud); (2) Jalal-ud-din's start is year only; (3) Ibrahim Lodi's start is 'late 1517' so year only; (4) Hemu's Delhi occupation is dated 7 Oct 1556 (the Hemu and Second Panipat articles agree) but the coronation is 6 Oct in Second Panipat; (5) Muhammad of Ghor has one title row from 1173, though 1173-1203 was a dyarchy with his brother Ghiyath al-Din (who is not entered); (6) Ramapala and the Senas have reigns only: the articles give no birth or death dates (Ramapala's death is dated only by the end of his reign).
# - Discrepancies recorded below: Prithviraj's death; capture of Delhi (1192 or 1193); when the Delhi Sultanate began; Muhammad of Ghor's killers; Iltutmish's birth; Razia's death; Balban's accession; Jalal-ud-din's death day; Alauddin's early raids (Bhilsa, Devagiri); Ghiyath Tughluq's death; Muhammad bin Tughluq's place of death; start of the Sayyid dynasty; Ibrahim Lodi's death day; Timur's dates; Sanga's death; Babur's death; Humayun's death; Hemu's coronation day; Akbar's death; Sher Shah's birth; Bhoja's reign start; Jayasimha's birth and coronation; Haldighati's result.
# - Size: 32 people, 33 title rows, 16 places, 35 events (116 records), 8 links, 29 moments, 11 new realms, 24 discrepancies, 39 sources.

