discrepancies:
  - key: prithviraj-death
    question: How and where did Prithviraj III die in 1192?
    about: [{person: prithviraj-iii-chauhan}, {event: second-battle-of-tarain-1192}]
    field: died
    claims:
      - {value: "Captured near Sursuti/Sirsa after the battle and summarily executed (Minhaj, Firishta; the Muhammad article says on the bank of the Saraswati, present-day Sirsa)", sources: [wp-prithviraj-iii-chauhan, wp-second-battle-of-tarain, wp-muhammad-of-ghor]}
      - {value: "Taken to Ajmer, intended to rule as a vassal, then rebelled and was beheaded for treason (Hasan Nizami; Prabandha-Chintamani; coins with both names issued from Delhi)", sources: [wp-prithviraj-iii-chauhan, wp-second-battle-of-tarain]}
      - {value: "Killed on the battlefield (Lakshmidhara); or died in captivity (Hammira Mahakavya); or blinded at Ghazna and killed Muhammad (Prithviraj Raso, called fictional)", sources: [wp-prithviraj-iii-chauhan]}
    note: "The record uses 1192 only. No death place is entered."
  - key: ghurid-capture-of-delhi-year
    question: In which year did the Ghurids take Delhi?
    about: [{event: ghurid-capture-of-delhi-1192}]
    field: date
    claims:
      - {value: "1192; Aibak deposed the Tomara vassal in 1193", sources: [wp-qutb-ud-din-aibak]}
      - {value: "1193, by Muhammad and Aibak, with a puppet Rajput installed and soon deposed", sources: [wp-muhammad-of-ghor]}
    note: "The record uses 1192."
  - key: delhi-sultanate-start
    question: When did the Delhi Sultanate begin?
    about: [{event: founding-of-delhi-sultanate-1206}, {person: qutb-ud-din-aibak}, {person: iltutmish}]
    field: date
    claims:
      - {value: "1206: Aibak, after Muhammad's assassination, informally ascended 25 June 1206 as first Sultan of Delhi", sources: [wp-delhi-sultanate, wp-qutb-ud-din-aibak]}
      - {value: "Formal recognition 1208-09 (chatr and deed of investiture from Ghiyas al-Din Mahmud)", sources: [wp-qutb-ud-din-aibak]}
      - {value: "1192, from the presence and claims of Muhammad of Ghor after Tarain (some historians)", sources: [wp-delhi-sultanate]}
      - {value: "Iltutmish (1211) as the effective founder and first to rule from Delhi", sources: [wp-iltutmish]}
    note: "The record uses 25 June 1206."
  - key: muhammad-of-ghor-killers
    question: Who killed Muhammad of Ghor at Dhamiak on 15 March 1206?
    about: [{person: muhammad-of-ghor}, {event: assassination-of-muhammad-of-ghor-1206}]
    field: died
    claims:
      - {value: "Khokhars who had lost relatives in his suppression of their revolt (Tarikh-i Alfi, Firishta)", sources: [wp-muhammad-of-ghor]}
      - {value: "Khokhars with two Muslim men, a joint Khokhar-Isma'ili attack (Ibn al-Athir)", sources: [wp-muhammad-of-ghor]}
      - {value: "Isma'ili emissaries (lead of the article; Aibak's article says 'Khokhars or Ismailis')", sources: [wp-muhammad-of-ghor, wp-qutb-ud-din-aibak]}
    note: "The date, 15 March 1206, and the place Dhamiak are agreed."
  - key: iltutmish-birth
    question: When was Iltutmish born?
    about: [{person: iltutmish}]
    field: born
    claims:
      - {value: "1192 (the Iltutmish article lead)", sources: [wp-iltutmish]}
      - {value: "He was sold as a young boy and bought by Aibak after the Gujarat campaign of c. 1197, and was already an officer by 1200 (the same article's text)", sources: [wp-iltutmish]}
    note: "These cannot both be right, so no birth year is entered."
  - key: razia-death
    question: When and where did Razia Sultan die in October 1240?
    about: [{person: razia-sultana}]
    field: died
    claims:
      - {value: "15 October 1240 (lead)", sources: [wp-razia-sultana, wp-iltutmish]}
      - {value: "13 October 1240, 'more likely' murdered by captors at Kaithal after defeat on 14 October", sources: [wp-razia-sultana]}
      - {value: "A later source has her and Altunia murdered by bandits while asleep under a tree outside Kaithal; her grave is at Mohalla Bulbuli Khana near Turkman Gate, Delhi, though a ruined building in Kaithal is said to be her original grave", sources: [wp-razia-sultana]}
    note: "The record uses the lead date, 15 October 1240, and Delhi for the burial moment. The same article also says defeat on 14 October, which would be one day after a 13 October death, so the sequence is not consistent."
  - key: balban-accession-year
    question: When did Balban become Sultan?
    about: [{person: ghiyas-ud-din-balban}]
    field: date
    claims:
      - {value: "1266, on Nasiruddin Mahmud's death at age fifty", sources: [wp-ghiyas-ud-din-balban, wp-delhi-sultanate]}
      - {value: "Ruled as Sultan from 1265 until 1287 (Death section of the same article)", sources: [wp-ghiyas-ud-din-balban]}
    note: "The record uses 1266."
  - key: jalal-ud-din-death-day
    question: On what day was Jalal-ud-din Khalji killed and Alauddin proclaimed?
    about: [{person: jalal-ud-din-khalji}, {person: alauddin-khalji}]
    field: died
    claims:
      - {value: "19 July 1296 (16 Ramazan 695), Amir Khusrau, the more reliable", sources: [wp-jalal-ud-din-khalji]}
      - {value: "20 July 1296 (Ziauddin Barani; also the Alauddin article)", sources: [wp-jalal-ud-din-khalji, wp-alauddin-khalji]}
    note: "The record uses 19 July for the end of Jalal-ud-din's title and the start of Alauddin's."
  - key: alauddin-early-raids-dates
    question: In what years did Alauddin raid Bhilsa and Devagiri?
    about: [{person: alauddin-khalji}, {person: jalal-ud-din-khalji}]
    field: date
    claims:
      - {value: "Bhilsa 1293, Devagiri 1296", sources: [wp-jalal-ud-din-khalji, wp-alauddin-khalji]}
      - {value: "Malwa/Bhilsa 1292, Devagiri 1294", sources: [wp-delhi-sultanate]}
    note: "Neither raid is entered as an event; the person note uses 'Devagiri' with no year."
  - key: ghiyath-tughluq-death
    question: How did Ghiyath al-Din Tughluq die in 1325?
    about: [{person: ghiyath-al-din-tughluq}]
    field: died
    claims:
      - {value: "A wooden pavilion collapsed at Kara-Manikpur in February 1325 (also killing his second son Mahmud Khan)", sources: [wp-ghiyath-al-din-tughluq]}
      - {value: "Conspiracy by his vizier Jauna Khan, i.e. the future Muhammad bin Tughluq (Ibn Battuta)", sources: [wp-ghiyath-al-din-tughluq]}
      - {value: "Killed by his son Juna Khan, who then assumed power (Vincent Smith and some historians)", sources: [wp-delhi-sultanate]}
    note: "The record uses 1 February 1325 and the accident."
  - key: muhammad-bin-tughluq-death-place
    question: Where did Muhammad bin Tughluq die in March 1351?
    about: [{person: muhammad-bin-tughluq}]
    field: place
    claims:
      - {value: "On the way to Thatta in Sindh, campaigning against the Taghi", sources: [wp-muhammad-bin-tughluq, wp-firuz-shah-tughlaq]}
      - {value: "Trying to chase and punish rebels in Gujarat", sources: [wp-delhi-sultanate]}
    note: "No death place is entered; the date is 20 March 1351 (Firuz succeeded on 23 March on the banks of the Indus)."
  - key: sayyid-dynasty-start
    question: When did the Sayyid dynasty begin?
    about: [{person: khizr-khan}, {event: khizr-khan-takes-delhi-1414}]
    field: date
    claims:
      - {value: "1414: Khizr Khan, sultan 1414-1421, captured Delhi on 28 May 1414", sources: [wp-khizr-khan]}
      - {value: "1414-1450 in the Delhi Sultanate heading; but 'ruled the Delhi Sultanate from 1415 to 1451' in its text, and the Lodis followed in 1451", sources: [wp-delhi-sultanate]}
    note: "The record uses 28 May 1414."
  - key: ibrahim-lodi-death-day
    question: On what day did Ibrahim Lodi die at Panipat?
    about: [{person: ibrahim-lodi}, {event: first-battle-of-panipat-1526}]
    field: died
    claims:
      - {value: "21 April 1526", sources: [wp-ibrahim-lodi, wp-first-battle-of-panipat, wp-babur]}
      - {value: "20 April 1526 (the Ibrahim Lodi article's 'Death' paragraph; the same article's lead and the next sentence say 21 April; the Babur article says Babur reached Panipat on 20 April and the battle began the next day)", sources: [wp-ibrahim-lodi, wp-babur]}
    note: "The record uses 21 April 1526."
  - key: timur-dates
    question: When was Timur born and on what day did he die?
    about: [{person: timur}]
    field: died
    claims:
      - {value: "Born in the late 1320s (most sources of his lifetime); died 17 or 18 February 1405 at Farab", sources: [wp-timur]}
      - {value: "Born 8 April 1336 (later Timurid dynastic histories, said to link him to the Ilkhan Abu Sa'id, who died that year)", sources: [wp-timur, wp-babur]}
    note: "No birth year is entered. The record uses 17 February 1405 and the title start about 1370."
  - key: rana-sanga-death
    question: When and where did Rana Sanga die?
    about: [{person: rana-sanga}]
    field: died
    claims:
      - {value: "30 January 1528 (lead)", sources: [wp-rana-sanga]}
      - {value: "At Kalpi in January 1528 or on 20 May 1528, poisoned by nobles who did not want another war with Babur", sources: [wp-rana-sanga, wp-battle-of-khanwa]}
    note: "The record uses 30 January 1528; Kalpi is not defined so no place is entered."
  - key: babur-death-date
    question: On what date did Babur die?
    about: [{person: babur}]
    field: died
    claims:
      - {value: "26 December 1530 (lead); Humayun's article says he succeeded on 26 December 1530", sources: [wp-babur, wp-humayun]}
      - {value: "5 January 1531 (new style) = 26 December 1530 (old style), at Agra (Death and legacy section)", sources: [wp-babur]}
    note: "The same day in two calendars. The record uses 26 December 1530 as in the lead."
  - key: humayun-death-date
    question: On what day did Humayun die?
    about: [{person: humayun}]
    field: died
    claims:
      - {value: "27 January 1556 (lead; fall on 24 January, died 'three days later')", sources: [wp-humayun, wp-second-battle-of-panipat]}
      - {value: "26 January 1556", sources: [wp-hemu]}
      - {value: "24 January 1556 (Lane-Poole's quotation of the date of the fall)", sources: [wp-humayun]}
    note: "The record uses 27 January 1556."
  - key: hemu-coronation-day
    question: On what day did Hemu take Delhi and assume the title Vikramaditya?
    about: [{person: hemu}, {event: hemu-takes-delhi-1556}]
    field: date
    claims:
      - {value: "7 October 1556: took possession of Delhi after a day's battle and claimed royal status", sources: [wp-hemu, wp-second-battle-of-panipat]}
      - {value: "Coronation at Purana Qila on 6 October 1556", sources: [wp-second-battle-of-panipat]}
    note: "The record uses 7 October 1556. Whether he declared himself an independent king is a separate dispute among historians (title marked disputed)."
  - key: akbar-death-date
    question: On what day did Akbar die?
    about: [{person: akbar}]
    field: died
    claims:
      - {value: "27 October 1605 (lead)", sources: [wp-akbar]}
      - {value: "'Believed to have died on 26 October 1605' after falling ill on 3 October with dysentery", sources: [wp-akbar]}
    note: "The record uses 27 October 1605."
  - key: sher-shah-birth
    question: When was Sher Shah Suri born?
    about: [{person: sher-shah-suri}]
    field: born
    claims:
      - {value: "1472", sources: [wp-sher-shah-suri]}
      - {value: "1486", sources: [wp-sher-shah-suri]}
    note: "The article gives both (death at the age of '73 or 59'). The record uses 1472 marked estimated, as the first-listed."
  - key: bhoja-reign-start
    question: When did Bhoja's reign begin, and whom did he succeed?
    about: [{person: bhoja-of-malwa}]
    field: date
    claims:
      - {value: "c. 1010 (Modasa copper plates of 1010-11 are the earliest record)", sources: [wp-bhoja-of-malwa]}
      - {value: "1000-1055 (Merutunga's 55 years 7 months 3 days; D. C. Ganguly, K. C. Jain)", sources: [wp-bhoja-of-malwa]}
      - {value: "Succeeded his uncle Munja (Tilaka-Manjari, Prabandha-Chintamani) rather than his father Sindhuraja (inscriptions, Padmagupta)", sources: [wp-bhoja-of-malwa]}
    note: "The record uses c. 1010 and his father Sindhuraja as predecessor (no link entered)."
  - key: jayasimha-birth-and-coronation
    question: When was Jayasimha Siddharaja born and crowned?
    about: [{person: jayasimha-siddharaja}]
    field: born
    claims:
      - {value: "Born 1091, crowned at three on 7 January 1094 (Merutunga's legend)", sources: [wp-jayasimha-siddharaja]}
      - {value: "Reigned c. 1092 - c. 1142 (the article's lead); Merutunga's story is not in Hemachandra, so 'does not seem to be accurate'", sources: [wp-jayasimha-siddharaja]}
    note: "The record uses c. 1092 for the start and c. 1142 for the end and enters no birth year."
  - key: kumarapala-accession
    question: When did Kumarapala become king?
    about: [{person: kumarapala}, {person: jayasimha-siddharaja}]
    field: date
    claims:
      - {value: "1143 (the article's reign, r. 1143-1172)", sources: [wp-kumarapala]}
      - {value: "1199 VS, given by later Jain chroniclers and converted in the article to '1042 CE'; known to be inaccurate because a 1200 VS inscription of Jayasimha exists at Bali", sources: [wp-kumarapala]}
      - {value: "Jayasimha's reign ends c. 1142", sources: [wp-jayasimha-siddharaja]}
    note: "The record uses 1143. The article's CE conversions of the Vikrama years (1199 VS = 1042 CE, 1200 VS = 1043 CE) do not fit its own reign dates, so only the reign dates are used."
  - key: haldighati-result
    question: Who won the Battle of Haldighati?
    about: [{event: battle-of-haldighati-1576}, {person: maharana-pratap}]
    field: date
    claims:
      - {value: "The Mughals won after heavy losses to Mewar but failed to capture Pratap; a 'futile victory' (Mainstream; Abu'l-Fazl; Badayuni)", sources: [wp-battle-of-haldighati, wp-maharana-pratap]}
      - {value: "Pratap won or the battle was a victory (a reading ascribed to Hindu nationalist retellings; rejected by most mainstream historians such as D. N. Jha, Tanuja Kothiyal and Rima Hooja)", sources: [wp-battle-of-haldighati]}
    note: "The record follows the mainstream: Pratap defeated. The date, 18 June 1576, is agreed."
