  - key: inauguration-of-andrew-jackson-1833
    name: Second inauguration of Andrew Jackson
    type: Inauguration
    date: 1833-03-04
    place: united-states-capitol
    people: [{person: andrew-jackson, role: inaugurated}]
    prominence: 3
    note: "In the House Chamber of the Capitol, because of Jackson's poor health; the last of John Marshall's nine presidential oaths."
    sources: [wp-second-inauguration-of-andrew-jackson]
  - key: inauguration-of-martin-van-buren
    name: Inauguration of Martin Van Buren
