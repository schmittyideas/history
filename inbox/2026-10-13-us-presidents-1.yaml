    date: 1841-03-04
    place: united-states-capitol
    people: [{person: william-henry-harrison, role: inaugurated}]
    prominence: 3
    note: "On the East Portico of the Capitol, on a cold, wet day; Harrison died a month later."
    sources: [wp-inauguration-of-william-henry-harrison, wp-william-henry-harrison]
  - key: inauguration-of-john-tyler
    name: Inauguration of John Tyler
    type: Inauguration
    date: 1841-04-06
    place: washington-dc
    people: [{person: john-tyler, role: inaugurated}]
    prominence: 3
    note: "The first extraordinary (unscheduled) inauguration, on a president's death: Chief Judge William Cranch gave the oath in the lobby of Brown's Indian Queen Hotel, Washington."
