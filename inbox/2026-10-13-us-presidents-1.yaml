  - key: inauguration-of-james-k-polk
    name: Inauguration of James K. Polk
    type: Inauguration
    date: 1845-03-04
    place: united-states-capitol
    people: [{person: james-k-polk, role: inaugurated}]
    prominence: 3
    note: "On the East Portico of the Capitol; the first inauguration reported by telegraph."
    sources: [wp-inauguration-of-james-k-polk, wp-james-k-polk]
  - key: inauguration-of-zachary-taylor
    name: Inauguration of Zachary Taylor
    type: Inauguration
    date: 1849-03-05
    place: united-states-capitol
    people: [{person: zachary-taylor, role: inaugurated}]
    prominence: 3
    note: "On the East Portico of the Capitol, on Monday, March 5, because March 4 was a Sunday."
    sources: [wp-inauguration-of-zachary-taylor, wp-zachary-taylor]
  - key: inauguration-of-millard-fillmore
    name: Inauguration of Millard Fillmore
    type: Inauguration
    date: 1850-07-10
    place: united-states-capitol
    people: [{person: millard-fillmore, role: inaugurated}]
    prominence: 3
    note: "In the House chamber of the Capitol, the day after Taylor's death; oath by William Cranch, as for Tyler."
    sources: [wp-inauguration-of-millard-fillmore, wp-millard-fillmore]
  - key: inauguration-of-franklin-pierce
    name: Inauguration of Franklin Pierce
    type: Inauguration
    date: 1853-03-04
    place: united-states-capitol
    people: [{person: franklin-pierce, role: inaugurated}]
    prominence: 3
    note: "On the East Portico of the Capitol; Pierce affirmed the oath rather than swearing it, and gave his address from memory."
    sources: [wp-inauguration-of-franklin-pierce]
  - key: inauguration-of-james-buchanan
    name: Inauguration of James Buchanan
    type: Inauguration
    date: 1857-03-04
    place: united-states-capitol
    people: [{person: james-buchanan, role: inaugurated}]
    prominence: 3
    note: "On the East Portico of the Capitol; oath by Chief Justice Roger B. Taney, two days before the Dred Scott decision."
    sources: [wp-inauguration-of-james-buchanan, wp-james-buchanan]

