# US Presidents, batch 1 of 3: George Washington to James Buchanan (presidents 1-15).
# VERIFIED against English Wikipedia articles read on 2026-10-13 with tools/wiki.py (revision IDs below) and the
# Wikipedia/Wikidata/Commons APIs:
#  - Each president's own article (lead, infobox, early life, presidency and death sections) for life dates, places
#    and term dates. Revisions: Washington 1379814106, J. Adams 1379689199, Jefferson 1379854500, Madison 1379665696,
#    Monroe 1379665734, J. Q. Adams 1379665486, Jackson 1379665658, Van Buren 1380008751, W. H. Harrison 1379664756,
#    Tyler 1379766213, Polk 1379665175, Taylor 1379665325, Fillmore 1379664625, Pierce 1379665164, Buchanan 1379664429.
#  - Each inauguration's own article ("First inauguration of George Washington" etc.) for its date and place.
#  - Each new place's own article for its coordinates (the article's {{coord}}), kind and founding year.
#  - Wikidata sitelinks (Wikipedia language editions only), read 2026-10-13.
#  - Portraits: each article's lead image; every one is marked "Public domain" on its Wikimedia Commons file page.
# Conventions (shared with batches 2 and 3): type Government; title "President of the United States", realm
# "United States"; one inauguration event per term, keyed inauguration-of-<person> (second terms -<year>).
# Prominence (hand-set): 5 for Washington alone (first president; set the precedents of the office); 4 for
# two-term or otherwise consequential presidents (J. Adams, Jefferson, Madison, Monroe, Jackson, Polk: Polk for
# the Mexican War and the doubling of US territory); 3 for short, one-term or minor presidencies (J. Q. Adams,
# Van Buren, W. H. Harrison, Tyler, Taylor, Fillmore, Pierce, Buchanan). Inaugurations 3, Washington's first 5.
# Notes:
#  - Calendar: Washington (Old Style 11 February 1731), J. Adams (O.S. 19 October 1735), Jefferson (O.S. 2 April
#    1743) and Madison (O.S. 5 March 1750) were born under the Julian calendar; the dates here are the New Style
#    dates their articles lead with. Not recorded as discrepancies: the articles give both and agree.
#  - Term dates are the infobox dates. Taylor's term began on Sunday 4 March 1849; he was sworn in on 5 March.
#    Tyler's presidency began on Harrison's death on 4 April 1841; he took the oath on 6 April.
#  - Monroe's first inauguration was outdoors in front of the Old Brick Capitol (where the Supreme Court building
#    now stands) and Tyler's was in the lobby of Brown's Indian Queen Hotel; neither building is a place record,
#    so both events are placed in Washington, D.C. with a note.
#  - Burials: only the final resting place is recorded, with the year the body was laid there where the article
#    gives it (Monroe was moved from New York City Marble Cemetery to Hollywood Cemetery in 1858; Polk from Polk Place
#    to the Tennessee State Capitol grounds in 1893; Taylor from the Congressional Cemetery vault to the family plot,
#    now Zachary Taylor National Cemetery, in 1850; Harrison from the Congressional Cemetery to North Bend in 1841).
#    J. Q. Adams's re-interment in the United First Parish Church crypt has no exact year in his article (after
#    Louisa Adams's death in 1852), so that moment has no year. Temporary resting places are left out.
#  - Andrew Jackson died at the Hermitage (the Hermitage article; his infobox says Nashville, where it is).
#  - Shared places added here: white-house, united-states-capitol, federal-hall. arlington-national-cemetery is not
#    used in this batch (no president from 1 to 15 is buried there).
#  - Family: only John Adams -> John Quincy Adams falls inside this batch.
batch:
  title: "US Presidents, batch 1: George Washington–James Buchanan"
  requested: "Ty: build out US Presidents"
  date: 2026-10-13

