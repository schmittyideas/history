    place: united-states-capitol
    people: [{person: martin-van-buren, role: inaugurated}]
    prominence: 3
    note: "On the East Portico of the Capitol; the first time the outgoing and incoming presidents rode to the Capitol together."
    sources: [wp-inauguration-of-martin-van-buren, wp-martin-van-buren]
  - key: inauguration-of-william-henry-harrison
    name: Inauguration of William Henry Harrison
