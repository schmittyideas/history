  - key: inauguration-of-john-quincy-adams
    name: Inauguration of John Quincy Adams
    type: Inauguration
    date: 1825-03-04
    place: united-states-capitol
    people: [{person: john-quincy-adams, role: inaugurated}]
    prominence: 3
    note: "In the House chamber of the Capitol; Adams swore on a book of law rather than a Bible."
    sources: [wp-inauguration-of-john-quincy-adams, wp-john-quincy-adams]
  - key: inauguration-of-andrew-jackson
    name: Inauguration of Andrew Jackson
