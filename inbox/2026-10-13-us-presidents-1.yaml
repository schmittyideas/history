    place: united-states-capitol
    people: [{person: james-madison, role: inaugurated}]
    prominence: 3
    note: "In the House chamber of the Capitol; followed by the first official inaugural ball, at Long's Hotel."
    sources: [wp-first-inauguration-of-james-madison, wp-james-madison]
  - key: inauguration-of-james-madison-1813
    name: Second inauguration of James Madison
