    date: 1817-03-04
    place: washington-dc
    people: [{person: james-monroe, role: inaugurated}]
    prominence: 3
    note: "The first held outdoors, on a platform in front of the Old Brick Capitol (the temporary Capitol after the British burned the Capitol in 1814), where the Supreme Court building now stands."
