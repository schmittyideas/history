  - key: inauguration-of-thomas-jefferson-1805
    name: Second inauguration of Thomas Jefferson
    type: Inauguration
    date: 1805-03-04
    place: united-states-capitol
    people: [{person: thomas-jefferson, role: inaugurated}]
    prominence: 3
    note: "In the Senate Chamber of the Capitol."
    sources: [wp-second-inauguration-of-thomas-jefferson]
  - key: inauguration-of-james-madison
