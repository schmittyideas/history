discrepancies:
  - key: andrew-jackson-birthplace
    question: Was Andrew Jackson born in South Carolina or North Carolina?
    about: [{person: andrew-jackson}, {place: waxhaws}]
    field: place
    claims:
      - {value: "The Crawford plantation, Lancaster County, South Carolina", sources: [wp-andrew-jackson], note: "Jackson's own later statement"}
      - {value: "Another uncle's home in North Carolina", sources: [wp-andrew-jackson], note: "Second-hand evidence the article mentions"}
    note: "The record uses the Waxhaws, the border region the article and infobox name, without choosing a side."
  - key: george-washington-first-term-start
    question: Did Washington's presidency begin on March 4 or April 30, 1789?
    about: [{person: george-washington}, {event: inauguration-of-george-washington}]
    field: from
    claims:
      - {value: "1789-04-30", sources: [wp-george-washington], note: "Infobox term start: the day he took the oath"}
      - {value: "1789-03-04", sources: [wp-first-inauguration-of-george-washington], note: "The first presidential term started on March 4, 1789, the date set for the new government to begin; the inauguration came nearly two months later"}
    note: "The title row uses April 30, 1789, the date his own article gives."
  - key: john-tyler-death-place
    question: Did John Tyler die at the Exchange Hotel or the Ballard House in Richmond?
    about: [{person: john-tyler}, {place: exchange-hotel-richmond}]
    field: place
    claims:
      - {value: "Exchange Hotel", sources: [wp-john-tyler, wp-exchange-hotel-richmond], note: "Tyler's article text and the hotel's article"}
      - {value: "Ballard House", sources: [wp-john-tyler], note: "Tyler's infobox (death place)"}
    note: "The two hotels faced each other and were joined by a footbridge under one owner; the record uses one place, the Exchange Hotel (and Ballard House)."
