places:
  # shared with batches 2 and 3
  - key: white-house
    name: White House
    kind: presidential residence
    city: Washington, D.C.
    region: District of Columbia
    country: United States
    lat: 38.8978
    lng: -77.0364
    founded: 1792
    architect: James Hoban
    visitable: true
    note: "The president's official residence and workplace, at 1600 Pennsylvania Avenue NW. Its cornerstone was laid on October 13, 1792; every president since John Adams (1800) has lived there."
    sources: [wp-white-house]
  - key: united-states-capitol
    name: United States Capitol
    kind: capitol
    city: Washington, D.C.
    region: District of Columbia
    country: United States
    lat: 38.8897
    lng: -77.0089
    founded: 1793
    visitable: true
    note: "Seat of the United States Congress, on Capitol Hill. Washington laid the cornerstone on September 18, 1793; the first sections were finished in 1800. Most inaugurations from 1801 on were held here, inside or on the East Portico; the West Front has been used since 1981."
    sources: [wp-united-states-capitol]
  - key: federal-hall
    name: Federal Hall
    kind: capitol
    city: New York City
    region: New York
    country: United States
    lat: 40.7072
    lng: -74.0103
    founded: 1703
    visitable: true
    visit_site: "Federal Hall National Memorial (the 1842 New York Custom House on the site), run by the National Park Service"
    note: "The first capitol of the United States under the Constitution, on Wall Street, where the First Congress met and Washington was first inaugurated (April 30, 1789). The old hall stood from 1703 until it was demolished in 1812; the building on the site today was completed in 1842."
    sources: [wp-federal-hall]
