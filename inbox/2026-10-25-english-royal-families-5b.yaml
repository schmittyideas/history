  # George IV's wife and daughter; William IV's wife
  - key: caroline-of-brunswick
    name: Caroline of Brunswick
    type: Royalty
    sex: female
    born: 1768-05-17
    died: 1821-08-07
    coverage: not-read
    note: "Wife of George IV (married 1795), separated soon after their daughter's birth; Queen from 1820, but barred from his coronation in 1821."
    sources: [wp-caroline-of-brunswick]
  - key: princess-charlotte-of-wales-1796-1817
    name: Princess Charlotte of Wales
    type: Royalty
    sex: female
    house: Hanover
    born: 1796-01-07
    died: 1817-11-06
    coverage: not-read
    note: "Only child of George IV, expected to succeed him; married Prince Leopold of Saxe-Coburg-Saalfeld in 1816 and died in childbirth at 21."
    sources: [wp-princess-charlotte-of-wales-1796-1817]
  - key: adelaide-of-saxe-meiningen
    name: Adelaide of Saxe-Meiningen
    type: Royalty
    sex: female
    born: 1792-08-13
    died: 1849-12-02
    coverage: not-read
    note: "Queen of the United Kingdom and of Hanover as wife of William IV (married 1818); none of their children survived infancy."
    sources: [wp-adelaide-of-saxe-meiningen]

  # Victoria's mother and children (Prince Albert is already in)
  - key: princess-victoria-of-saxe-coburg-saalfeld
    name: Princess Victoria of Saxe-Coburg-Saalfeld
    type: Royalty
    sex: female
    born: 1786-08-17
    died: 1861-03-16
    coverage: not-read
    note: "Duchess of Kent and Strathearn; widow of Emich Karl, Prince of Leiningen, then wife of Prince Edward, Duke of Kent (married 1818), and mother of Queen Victoria."
    sources: [wp-princess-victoria-of-saxe-coburg-saalfeld]
  - key: victoria-princess-royal
    name: Victoria, Princess Royal
    type: Royalty
    sex: female
    house: Saxe-Coburg and Gotha
    born: 1840-11-21
    died: 1901-08-05
    coverage: not-read
    note: "Eldest child of Queen Victoria; German Empress and Queen of Prussia as wife of Frederick III (married 1858), mother of Wilhelm II."
    sources: [wp-victoria-princess-royal]
  - key: princess-alice-of-the-united-kingdom
    name: Princess Alice
    type: Royalty
    sex: female
    house: Saxe-Coburg and Gotha
    born: 1843-04-25
    died: 1878-12-14
    coverage: not-read
    note: "Second daughter of Queen Victoria; Grand Duchess of Hesse and by Rhine as wife of Louis IV (married 1862). Mother of Alexandra, the last Russian empress."
    sources: [wp-princess-alice-of-the-united-kingdom]
  - key: alfred-duke-of-saxe-coburg-and-gotha
    name: Alfred, Duke of Saxe-Coburg and Gotha
    type: Royalty
    sex: male
    house: Saxe-Coburg and Gotha
    born: 1844-08-06
    died: 1900-07-30
    coverage: not-read
    note: "Second son of Queen Victoria; Duke of Edinburgh from 1866, naval officer, and sovereign Duke of Saxe-Coburg and Gotha from 1893."
    sources: [wp-alfred-duke-of-saxe-coburg-and-gotha]
  - key: princess-helena-of-the-united-kingdom
    name: Princess Helena
    type: Royalty
    sex: female
    house: Saxe-Coburg and Gotha
    born: 1846-05-25
    died: 1923-06-09
    coverage: not-read
    note: "Third daughter of Queen Victoria; married Prince Christian of Schleswig-Holstein in 1866 and stayed in Britain as Princess Christian."
    sources: [wp-princess-helena-of-the-united-kingdom]
  - key: princess-louise-duchess-of-argyll
    name: Princess Louise, Duchess of Argyll
    type: Royalty
    sex: female
    house: Saxe-Coburg and Gotha
    born: 1848-03-18
    died: 1939-12-03
    coverage: not-read
    note: "Fourth daughter of Queen Victoria; sculptor and supporter of the arts, higher education and the feminist cause; wife of the Marquess of Lorne, later 9th Duke of Argyll."
    sources: [wp-princess-louise-duchess-of-argyll]
  - key: prince-arthur-duke-of-connaught-and-strathearn
    name: Prince Arthur, Duke of Connaught and Strathearn
    type: Royalty
    sex: male
    house: Saxe-Coburg and Gotha
    born: 1850-05-01
    died: 1942-01-16
    coverage: not-read
    note: "Third son of Queen Victoria; army officer and Governor General of Canada (1911-1916)."
    sources: [wp-prince-arthur-duke-of-connaught-and-strathearn]
  - key: prince-leopold-duke-of-albany
    name: Prince Leopold, Duke of Albany
    type: Royalty
    sex: male
    house: Saxe-Coburg and Gotha
    born: 1853-04-07
    died: 1884-03-28
    coverage: not-read
    note: "Youngest son of Queen Victoria; had haemophilia and died at 30 after a fall."
    sources: [wp-prince-leopold-duke-of-albany]
  - key: princess-beatrice-of-the-united-kingdom
    name: Princess Beatrice
    type: Royalty
    sex: female
    house: Saxe-Coburg and Gotha
    born: 1857-04-14
    died: 1944-10-26
    coverage: not-read
    note: "Youngest child of Queen Victoria and her constant companion; wife of Prince Henry of Battenberg (married 1885)."
    sources: [wp-princess-beatrice-of-the-united-kingdom]

  # Edward VII's wife and children (George V is already in)
  - key: alexandra-of-denmark
    name: Alexandra of Denmark
    type: Royalty
    sex: female
    born: 1844-12-01
    died: 1925-11-20
    coverage: not-read
    note: "Queen of the United Kingdom as wife of Edward VII (married 10 March 1863 at St George's Chapel, Windsor)."
    sources: [wp-alexandra-of-denmark]
  - key: prince-albert-victor-duke-of-clarence-and-avondale
    name: Prince Albert Victor, Duke of Clarence and Avondale
    type: Royalty
    sex: male
    house: Saxe-Coburg and Gotha
    born: 1864-01-08
    died: 1892-01-14
    coverage: not-read
    note: "Eldest son of Edward VII and second in line to the throne; engaged to Mary of Teck in late 1891, he died of pneumonia at Sandringham in January 1892, aged 28."
    sources: [wp-prince-albert-victor-duke-of-clarence-and-avondale]
  - key: louise-princess-royal
    name: Louise, Princess Royal
    type: Royalty
    sex: female
    house: Saxe-Coburg and Gotha
    born: 1867-02-20
    died: 1931-01-04
    coverage: not-read
    note: "Eldest daughter of Edward VII, created Princess Royal in 1905; wife of Alexander Duff, 1st Duke of Fife."
    sources: [wp-louise-princess-royal]
  - key: princess-victoria-of-the-united-kingdom
    name: Princess Victoria
    type: Royalty
    sex: female
    house: Saxe-Coburg and Gotha
    born: 1868-07-06
    died: 1935-12-03
    coverage: not-read
    note: "Second daughter of Edward VII; never married, and stayed close to her mother and her brother George V."
    sources: [wp-princess-victoria-of-the-united-kingdom]
  - key: maud-of-wales
    name: Maud of Wales
    type: Royalty
    sex: female
    house: Saxe-Coburg and Gotha
    born: 1869-11-26
    died: 1938-11-20
    coverage: not-read
    note: "Youngest daughter of Edward VII; Queen of Norway from 1905 as wife of Haakon VII."
    sources: [wp-maud-of-wales]

