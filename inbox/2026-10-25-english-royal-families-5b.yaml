batch:
  title: "Royal families, part 5b: George IV to Edward VII (1820-1910)"
  requested: "Ty: fill in parents, spouses and children (who reached 12) for each English monarch (issue #292, agreed 2026-10-25)"
  date: 2026-10-25
  notes: "Sex for George IV, William IV, Victoria and Edward VII; their marriages and legitimate children who reached age 12, each with their own Wikipedia article, birth and burial places, and Victoria's mother. Their fathers' links are in part 5a (George III, and Victoria's father Prince Edward, Duke of Kent)."

# Notes for the reviewer
# - Burial moments carry a year only where the article dates the burial; otherwise the year is left out.
#   Where someone was moved, the moment is the final resting place: Princess Helena (Royal Burial Ground, Frogmore, 1928),
#   Princess Louise, Duchess of Argyll (ashes moved there in 1940), Prince Arthur (reburied there 1942), Princess Victoria
#   (reburied there 1936), Princess Beatrice (Whippingham, 1945), Louise, Princess Royal (removed to the private chapel at
#   Mar Lodge, Braemar; no date given).
#   Prince Leopold and Prince Albert Victor lie in the Albert Memorial Chapel at Windsor, which has no article of its own:
#   their moments use St George's Chapel, Windsor, which it adjoins.
#   Alfred lies in the ducal mausoleum in the Friedhof am Glockenberg, Coburg (no article): the moment uses Coburg.
# Left out
# - George IV: his 1785 marriage to Maria Fitzherbert, void under the Royal Marriages Act 1772 (no spouse link).
# - William IV: no legitimate child reached 12. He and Adelaide had two short-lived daughters (Charlotte, 1819;
#   Elizabeth, 1820-1821) and she had two miscarriages. His ten illegitimate FitzClarence children by Dorothea Jordan are left out.
# - Edward VII: Prince Alexander John (1871), died the day after his birth.
# - All nine of Victoria's children reached adulthood; all are here.
# - No title changes in this batch.

