batch:
  title: "The kings of France: Capetians and Valois, 1031-1498"
  requested: "Henry I through Charles VIII of France: lives, reigns, consorts, coronations, battles, treaties, places"
  date: 2026-10-08

# Notes for the reviewer
# - Source: local copies of the English Wikipedia articles for the 20 kings (Henry I to Charles VIII). Nothing was fetched. Robert II (robert-ii-of-france, 996-1031) already exists and is used only as a parent link.
# - Title wording: every king here is "King of France", realm France. The early kings (Henry I to Louis VII or so) were styled "King of the Franks" (rex Francorum); the Philip II article says Philip II was the first to style himself rex Francie, from 1190. Robert II's existing title says "King of the Franks"; it is left as it is.
# - Three people are added who are not kings: Blanche of Castile (regent 1226-1234 and during Louis IX's crusade, so two "Regent of France" titles) and Joan of Arc (Orléans 1429). Joan's key joan-of-arc is defined here; her birth is not in the downloaded articles and is left out. Her type "Nobility" is only a colour grouping (she was not noble).
# - Left out (no confident source in these articles, or out of scope): Navarre titles (Philip IV, Louis X, Charles IV were also kings of Navarre; no Navarre realm agreed), Dauphin and Duke titles of Philip VI / John II / Charles V, John II's Duke of Burgundy claim, the antiking/rival claims of Henry VI of England (other batch), Henry V (other batch). The Western Schism (1378), Black Death (1348), Battle of Cassel (1328), Mons-en-Pevele (1304), Nájera/Montiel and the Pragmatic Sanction of Bourges (1438) are left out of events to keep the batch to size; they are named in the notes of the reigns where they matter.
# - Persecutions: the expulsions and measures against Jews (Philip II 1182, Philip IV 22 July 1306, Charles VI 17 Sept 1394, plus Louis IX's burning of the Talmud 1242) are in the articles. Only the 1306 expulsion is entered as an event.
# - Days not given in the articles, so years only: the Sicilian Vespers (1282), the Anagni attack (September 1303), the Jacquerie (1358), the Treaty of Arras (1435; congress opened 5 Aug 1435), Treaty of Paris 1229 and 1259, Louis X's coronation (August 1315), Charles V's coronation (1364), Charles IV's coronation (1322), Henry V of England's death (Charles VII says July 1422, Charles VI says August 1422; not entered because Henry V is in another batch).
# - Death places not given or not placed: Louis VI, Philip V (Longchamp, Paris), Philip VI (Coulombs Abbey, Eure-et-Loir, coordinates not certain), Charles V, Philip II (Mantes-la-Jolie), Henry I (Vitry-en-Brie), Charles VIII's burial. Birthplaces left out: Henry I (Reims), Philip I (Champagne-et-Fontaine), Philip II (Gonesse), Philip V (Lyon).
# - Coordinates are from general knowledge (about 3 decimals), and some are approximate: Chateau de Montpensier, Barbeau Abbey, Chateau du Plessis-les-Tours, Melun castle. "visitable" flags are also general knowledge, not from the articles.
# - Shared keys (defined here, other batches may send the same key): reims-cathedral, basilica-of-saint-denis, paris, notre-dame-de-paris, louvre-palace, savoy-palace, orleans, tunis, second-crusade-1147, albigensian-crusade-1208, seventh-crusade-1248, eighth-crusade-1270, start-of-the-hundred-years-war-1337, battle-of-the-golden-spurs-1302, prince-louis-invasion-of-england-1216, italian-war-of-1494, joan-of-arc. Only the facts the French articles give are sent.
# - Existing events (battle-of-poitiers-1356, treaty-of-bretigny-1360, battle-of-crecy-1346, siege-of-calais-1346, battle-of-sluys-1340, battle-of-agincourt-1415, treaty-of-troyes-1420, battle-of-castillon-1453, loss-of-normandy-1204, capture-of-acre-1191, treaty-of-picquigny, great-revolt-1173) are not redefined. They appear in the "events" block with only key, people and sources, to link the French kings to them (the apply step only adds missing people).
# - Size: 22 people, 22 titles, 31 new events plus 12 link-only updates to existing events, 27 places (about 115 rows with the updates); over the 60-80 target because all 20 kings are covered with places and events. If it must be split, cut it at Philip IV / Louis X (1314).
# - Discrepancies recorded below: Philip I death date; Philip II birth date; John I's reign length; Charles IV birth day; Charles VI death date; Charles VIII death date. Also seen, not entered: John II's second marriage (9 or 19 Feb 1350 inside the John II article); Charles IV's third marriage (1324 or 1325 inside the Charles IV article); the day of Jacques de Molay's burning (March 1314, "disputed by scholars", no days given); the Seventh Crusade landing (4 or 5 June 1249).

