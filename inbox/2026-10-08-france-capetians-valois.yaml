discrepancies:
  - key: philip-i-death-date
    question: On what day did Philip I die in July 1108?
    about: [{person: philip-i-of-france}]
    field: died
    claims:
      - {value: "29 July 1108", sources: [wp-philip-i-of-france, wp-louis-vi-of-france]}
      - {value: "30 July 1108", sources: [wp-henry-i-of-france]}
    note: "The record uses 29 July, which the Philip I article gives twice and the Louis VI article confirms (Louis succeeded on 29 July)."
  - key: philip-ii-birth-date
    question: On what day in August 1165 was Philip II born?
    about: [{person: philip-ii-of-france}]
    field: born
    claims:
      - {value: "21 August 1165", sources: [wp-philip-ii-of-france]}
      - {value: "22 August 1165", sources: [wp-louis-vii-of-france]}
    note: "The record uses 21 August, from Philip II's own article (opening line and early life section)."
  - key: john-i-reign-length
    question: How long did John I the Posthumous live and reign?
    about: [{person: john-i-of-france}]
    field: died
    claims:
      - {value: "Born 15 November, died 19 November 1316; four days", sources: [wp-john-i-of-france, wp-philip-v-of-france]}
      - {value: "Lived five days", sources: [wp-louis-x-of-france, wp-philip-v-of-france]}
    note: "The record uses 15 and 19 November 1316 from the John I article. Five days counts both end days; the Philip V article says both four and five."
  - key: charles-iv-birth-date
    question: On what day in June 1294 was Charles IV born?
    about: [{person: charles-iv-of-france}]
    field: born
    claims:
      - {value: "18 June 1294", sources: [wp-charles-iv-of-france]}
      - {value: "19 June 1294", sources: [wp-charles-iv-of-france]}
    note: "The article gives '18/19 June 1294'. The record keeps the year only."
  - key: charles-vi-death-date
    question: On what day in October 1422 did Charles VI die?
    about: [{person: charles-vi-of-france}]
    field: died
    claims:
      - {value: "21 October 1422", sources: [wp-charles-vi-of-france]}
      - {value: "22 October 1422", sources: [wp-charles-v-of-france]}
    note: "The record uses 21 October, from Charles VI's own article (given twice). Charles VII's reign starts in 1422, year only."
  - key: charles-viii-death-date
    question: On what day in April 1498 did Charles VIII die?
    about: [{person: charles-viii-of-france}]
    field: died
    claims:
      - {value: "7 April 1498", sources: [wp-charles-viii-of-france]}
      - {value: "8 April 1498", sources: [wp-louis-xi-of-france]}
    note: "The record uses 7 April, from Charles VIII's own article."
