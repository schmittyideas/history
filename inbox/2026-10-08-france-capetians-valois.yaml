people:
  - key: henry-i-of-france
    name: Henry I
    type: Royalty
    house: Capet
    realm: France
    born: 1008-05-04
    died: 1060-08-04
    prominence: 3
    note: "King of the Franks 1031-1060; the royal demesne was at its smallest in his reign. Crowned in his father's lifetime in 1027; helped Duke William of Normandy at Val-es-Dunes in 1047."
    sources: [wp-henry-i-of-france]
  - key: philip-i-of-france
    name: Philip I
    type: Royalty
    house: Capet
    realm: France
    born: 1052
    born_estimated: true
    died: 1108-07-29
    prominence: 3
    note: "Called the Amorous; king for nearly 48 years from age seven. Added the Vexin and Bourges to the royal demesne; excommunicated for marrying Bertrada of Montfort."
    sources: [wp-philip-i-of-france]
  - key: louis-vi-of-france
    name: Louis VI
    type: Royalty
    house: Capet
    realm: France
    born: 1081-12-01
    died: 1137-08-01
    prominence: 3
    note: "Called the Fat; fought the 'robber barons' of the Ile-de-France and Henry I of England over Normandy and Gisors. Married his heir to Eleanor of Aquitaine a week before he died."
    sources: [wp-louis-vi-of-france]
  - key: louis-vii-of-france
    name: Louis VII
    type: Royalty
    house: Capet
    realm: France
    born: 1120
    died: 1180-09-18
    prominence: 4
    note: "Led the Second Crusade; his marriage to Eleanor of Aquitaine was annulled in 1152 and she married Henry of Anjou, creating the Angevin power that dominated his reign."
    sources: [wp-louis-vii-of-france]
  - key: philip-ii-of-france
    name: Philip II Augustus
    type: Royalty
    house: Capet
    realm: France
    born: 1165-08-21
    died: 1223-07-14
    prominence: 4
    note: "First to style himself 'King of France' (from 1190). Took Normandy and most Angevin lands from John and won Bouvines in 1214; walled Paris and built the first Louvre."
    sources: [wp-philip-ii-of-france]
  - key: louis-viii-of-france
    name: Louis VIII
    type: Royalty
    house: Capet
    realm: France
    born: 1187-09-05
    died: 1226-11-08
    prominence: 3
    note: "Called the Lion. As prince proclaimed King of England in London in 1216 but never crowned; as king took Poitou and La Rochelle (1224) and led the Albigensian Crusade in 1226."
    sources: [wp-louis-viii-of-france]
  - key: blanche-of-castile
    name: Blanche of Castile
    type: Royalty
    house: Capet
    realm: France
    died: 1252
    prominence: 3
    note: "Married Louis VIII in 1200; regent of France during Louis IX's minority and again during his crusade; ended the Albigensian Crusade in 1229. Died in November 1252 (day not in the articles)."
    sources: [wp-louis-viii-of-france, wp-louis-ix-of-france]
  - key: louis-ix-of-france
    name: Louis IX (Saint Louis)
    type: Royalty
    house: Capet
    realm: France
    born: 1214-04-25
    died: 1270-08-25
    prominence: 5
    note: "Saint Louis, the only French king canonised (1297). Built the Sainte-Chapelle, reformed royal justice, led the Seventh and Eighth Crusades and died at Tunis."
    sources: [wp-louis-ix-of-france]
  - key: philip-iii-of-france
    name: Philip III
    type: Royalty
    house: Capet
    realm: France
    born: 1245-05-01
    died: 1285-10-05
    prominence: 3
    note: "Called the Bold. Proclaimed king at Tunis in 1270; gained Toulouse in 1271; died at Perpignan after the failed Aragonese Crusade."
    sources: [wp-philip-iii-of-france]
  - key: philip-iv-of-france
    name: Philip IV the Fair
    type: Royalty
    house: Capet
    realm: France
    born: 1268
    died: 1314-11-29
    prominence: 4
    note: "Born between April and June 1268. Centralised royal government; clashed with Pope Boniface VIII and suppressed the Knights Templar; his three sons were the last direct Capetian kings."
    sources: [wp-philip-iv-of-france]
  - key: louis-x-of-france
    name: Louis X the Quarrelsome
    type: Royalty
    house: Capet
    realm: France
    born: 1289-10-04
    died: 1316-06-05
    prominence: 2
    note: "King of France from 1314 (and of Navarre as Louis I from 1305); freed serfs who could buy their liberty and readmitted the Jews; died leaving his wife pregnant."
    sources: [wp-louis-x-of-france]
  - key: john-i-of-france
    name: John I the Posthumous
    type: Royalty
    house: Capet
    realm: France
    born: 1316-11-15
    died: 1316-11-19
    prominence: 1
    note: "Posthumous son of Louis X; king from birth and for the few days he lived. His death ended three centuries of father-to-son succession."
    sources: [wp-john-i-of-france]
  - key: philip-v-of-france
    name: Philip V the Tall
    type: Royalty
    house: Capet
    realm: France
    born: 1291
    born_estimated: true
    died: 1322-01-03
    prominence: 3
    note: "Regent for his unborn nephew, then king; set the precedent barring women from the throne (later called the Salic law). Created the Court of Accounts in 1320."
    sources: [wp-philip-v-of-france]
  - key: charles-iv-of-france
    name: Charles IV the Fair
    type: Royalty
    house: Capet
    realm: France
    born: 1294
    died: 1328-02-01
    prominence: 2
    note: "Last king of the direct Capetian line. Fought the War of Saint-Sardos (1324) against Edward II; died without a male heir, passing the crown to Philip of Valois."
    sources: [wp-charles-iv-of-france]
  - key: philip-vi-of-france
    name: Philip VI
    type: Royalty
    house: Valois
    realm: France
    born: 1293
    died: 1350-08-22
    prominence: 4
    note: "First Valois king. His succession was disputed by Edward III of England, and the Hundred Years' War began in his reign; defeated at Crecy (1346); bought the Dauphine in 1349."
    sources: [wp-philip-vi-of-france]
  - key: john-ii-of-france
    name: John II the Good
    type: Royalty
    house: Valois
    realm: France
    born: 1319-04-26
    died: 1364-04-08
    prominence: 3
    note: "Captured at Poitiers in 1356 and held in England; the Treaty of Bretigny set his ransom. Returned to England voluntarily in 1364 and died at the Savoy Palace."
    sources: [wp-john-ii-of-france]
  - key: charles-v-of-france
    name: Charles V the Wise
    type: Royalty
    house: Valois
    realm: France
    born: 1338-01-21
    died: 1380-09-16
    prominence: 4
    note: "Regent while his father was a prisoner; as king (1364-1380) reconquered most of what Bretigny gave England, with Bertrand du Guesclin. Built the Bastille, rebuilt the Louvre and Vincennes."
    sources: [wp-charles-v-of-france]
  - key: charles-vi-of-france
    name: Charles VI the Mad
    type: Royalty
    house: Valois
    realm: France
    born: 1368-12-03
    died: 1422-10-21
    prominence: 4
    note: "King at 11; first attack of madness in 1392. The Armagnac-Burgundian civil war and Agincourt (1415) led to the Treaty of Troyes (1420), which disinherited his son."
    sources: [wp-charles-vi-of-france]
  - key: charles-vii-of-france
    name: Charles VII the Victorious
    type: Royalty
    house: Valois
    realm: France
    born: 1403-02-22
    died: 1461-07-22
    prominence: 4
    note: "The 'King of Bourges' who, with Joan of Arc, was crowned at Reims in 1429 and ended the Hundred Years' War (Castillon, 1453). Built a standing army."
    sources: [wp-charles-vii-of-france]
  - key: joan-of-arc
    name: Joan of Arc
    type: Nobility
    roles: [military leader]
    realm: France
    died: 1431-05-30
    prominence: 5
    note: "Peasant girl from Domremy who persuaded Charles VII at Chinon in February 1429 and lifted the siege of Orleans; captured at Compiegne, tried for heresy by pro-English clergy and burned. Birth date not in the downloaded articles. Type 'Nobility' is only a colour grouping."
    sources: [wp-charles-vii-of-france]
  - key: louis-xi-of-france
    name: Louis XI the Prudent
    type: Royalty
    house: Valois
    realm: France
    born: 1423-07-03
    died: 1483-08-30
    prominence: 4
    note: "The 'Universal Spider'. Rebelled against his father; as king broke the power of Charles the Bold of Burgundy, made the Treaty of Picquigny (1475) with Edward IV and built the royal postal roads."
    sources: [wp-louis-xi-of-france]
  - key: charles-viii-of-france
    name: Charles VIII the Affable
    type: Royalty
    house: Valois
    realm: France
    born: 1470-06-30
    died: 1498-04-07
    prominence: 3
    note: "King at 13; married Anne of Brittany in 1491; invaded Italy in 1494 and was crowned King of Naples in 1495 but lost it all. Last of the elder Valois line."
    sources: [wp-charles-viii-of-france]

titles:
  # Henry I. Co-king from his coronation on 14 May 1027; sole ruler on his father's death in 1031.
  - {person: henry-i-of-france, title: King of France, realm: France, from: 1031, to: 1060-08-04, note: "King of the Franks; crowned at Reims on 14 May 1027 in his father's lifetime", sources: [wp-henry-i-of-france]}
  # Philip I. Crowned at Reims in 1059 aged seven; regents Baldwin V of Flanders and Anne of Kiev.
  - {person: philip-i-of-france, title: King of France, realm: France, from: 1060-08-04, to: 1108-07-29, note: "King of the Franks; crowned at Reims in 1059; Baldwin V of Flanders and Anne of Kiev were regents", sources: [wp-philip-i-of-france, wp-henry-i-of-france]}
  - {person: louis-vi-of-france, title: King of France, realm: France, from: 1108-07-29, to: 1137-08-01, note: "Crowned at Orleans on 3 August 1108 by the Archbishop of Sens, because his half-brother kept him from Reims", sources: [wp-louis-vi-of-france]}
  # Louis VII. Anointed and crowned co-king by Pope Innocent II at Reims in October 1131.
  - {person: louis-vii-of-france, title: King of France, realm: France, from: 1137-08-01, to: 1180-09-18, note: "Crowned co-ruler at Reims in October 1131", sources: [wp-louis-vii-of-france, wp-louis-vi-of-france]}
  # Philip II. Crowned co-king at Reims on 1 November 1179, aged 14.
  - {person: philip-ii-of-france, title: King of France, realm: France, from: 1180-09-18, to: 1223-07-14, note: "Crowned at Reims on 1 November 1179 in his father's lifetime; from 1190 the first king to style himself King of France", sources: [wp-philip-ii-of-france]}
  - {person: louis-viii-of-france, title: King of France, realm: France, from: 1223-07-14, to: 1226-11-08, note: "Crowned at Reims on 6 August 1223", sources: [wp-louis-viii-of-france]}
  # Louis IX. Regency of Blanche to 1234; Blanche regent again from 1248 while he was on crusade.
  - {person: louis-ix-of-france, title: King of France, realm: France, from: 1226-11-08, to: 1270-08-25, note: "Crowned at Reims on 29 November 1226, aged 12; personal rule from 1234", sources: [wp-louis-ix-of-france, wp-louis-viii-of-france]}
  - {person: blanche-of-castile, title: Regent of France, realm: France, from: 1226-11-08, to: 1234, note: "Ruled for her son Louis IX during his minority; historians date his personal rule from 1234", sources: [wp-louis-ix-of-france]}
  - {person: blanche-of-castile, title: Regent of France, realm: France, from: 1248, to: 1252, note: "Headed the regency while Louis IX was on the Seventh Crusade (departure 1248); held it until her death in November 1252", sources: [wp-louis-ix-of-france]}
  - {person: philip-iii-of-france, title: King of France, realm: France, from: 1270-08-25, to: 1285-10-05, note: "Proclaimed king at Tunis in 1270; crowned at Reims on 15 August 1271", sources: [wp-philip-iii-of-france]}
  - {person: philip-iv-of-france, title: King of France, realm: France, from: 1285-10-05, to: 1314-11-29, note: "Crowned at Reims on 6 January 1286, aged 17; also King of Navarre (as Philip I) through his wife, 1284-1305, not entered", sources: [wp-philip-iv-of-france, wp-philip-iii-of-france]}
  - {person: louis-x-of-france, title: King of France, realm: France, from: 1314-11-29, to: 1316-06-05, note: "Crowned at Reims in August 1315 with Clemence of Hungary", sources: [wp-louis-x-of-france, wp-philip-iv-of-france]}
  - {person: john-i-of-france, title: King of France, realm: France, from: 1316-11-15, to: 1316-11-19, note: "Born king; lived four days (the Louis X and Philip V articles say five). Philip the Tall was regent", sources: [wp-john-i-of-france]}
  - {person: philip-v-of-france, title: King of France, realm: France, from: 1316-11-19, to: 1322-01-03, note: "Regent from Louis X's death on 5 June 1316; crowned at Reims on 9 January 1317", sources: [wp-philip-v-of-france, wp-john-i-of-france]}
  - {person: charles-iv-of-france, title: King of France, realm: France, from: 1322-01-03, to: 1328-02-01, note: "Crowned at Reims in 1322; last king of the direct Capetian line", sources: [wp-charles-iv-of-france, wp-philip-v-of-france]}
  - {person: philip-vi-of-france, title: King of France, realm: France, from: 1328-04-01, to: 1350-08-22, note: "Regent from 9 February 1328; proclaimed king on 1 April after Charles IV's widow bore a daughter; crowned at Reims on 29 May 1328", sources: [wp-philip-vi-of-france]}
  - {person: john-ii-of-france, title: King of France, realm: France, from: 1350-08-22, to: 1364-04-08, note: "Crowned at Reims on 26 September 1350; prisoner in England from Poitiers (1356) apart from 1360-1364", sources: [wp-john-ii-of-france, wp-philip-vi-of-france]}
  - {person: charles-v-of-france, title: King of France, realm: France, from: 1364-04-08, to: 1380-09-16, note: "Crowned at Reims in 1364 (day not given). Regent for his captive father 1356-1360", sources: [wp-charles-v-of-france, wp-john-ii-of-france]}
  - {person: charles-vi-of-france, title: King of France, realm: France, from: 1380-09-16, to: 1422-10-21, note: "Crowned at Reims on 4 November 1380, aged 11; his uncles ruled until 1388; mental illness from 1392. Henry V of England was named heir by the Treaty of Troyes (1420)", sources: [wp-charles-vi-of-france]}
  - {person: charles-vii-of-france, title: King of France, realm: France, from: 1422, to: 1461-07-22, note: "Claimed the crown on his father's death in October 1422 (Henry VI of England was the other claimant); crowned at Reims only on 17 July 1429", sources: [wp-charles-vii-of-france]}
  - {person: louis-xi-of-france, title: King of France, realm: France, from: 1461-07-22, to: 1483-08-30, sources: [wp-louis-xi-of-france]}
  - {person: charles-viii-of-france, title: King of France, realm: France, from: 1483-08-30, to: 1498-04-07, note: "King at 13; his sister Anne of France and her husband Peter of Bourbon were regents until 1491", sources: [wp-charles-viii-of-france]}

