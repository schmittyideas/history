    visitable: true
    note: "Royal burial church just north of Paris: Henry I, Louis VI, Philip II, Louis VIII, Louis IX (bones, 1271), Philip III (bones), Philip IV, Louis X, John I, Philip V, Charles IV, Philip VI, John II, Charles V, Charles VI and Charles VII."
    sources: [wp-louis-vi-of-france, wp-louis-ix-of-france, wp-philip-iv-of-france, wp-charles-v-of-france]
  - key: paris
    name: Paris
    kind: city
    region: Ile-de-France
    country: France
    lat: 48.857
    lng: 2.352
    visitable: true
    note: "Capital of the Capetian and Valois kings. Birthplace of Louis VI and Louis X; Louis VII died here in 1180; Charles VII entered the city without resistance on 13 April 1436."
    sources: [wp-louis-vi-of-france, wp-louis-x-of-france, wp-louis-vii-of-france, wp-charles-vii-of-france]
  - key: hotel-saint-pol
    name: Hotel Saint-Pol
    kind: palace
    city: Paris
    region: Ile-de-France
    country: France
    lat: 48.854
    lng: 2.364
    note: "Royal residence in Paris. Charles VI (3 December 1368) and Charles VII (1403) were born here, and Charles VI died here on 21 October 1422; the entrances were walled up to keep him inside during his madness. In Paris."
    sources: [wp-charles-vi-of-france, wp-charles-vii-of-france]
  - key: sainte-chapelle
    name: Sainte-Chapelle
    kind: chapel
    city: Paris
    region: Ile-de-France
    country: France
    lat: 48.855
    lng: 2.345
    visitable: true
    visit_site: "Sainte-Chapelle, Ile de la Cite, Paris"
    founded: 1241
    built_by: "Louis IX"
    note: "Rayonnant Gothic palace chapel built to house the Crown of Thorns and a fragment of the True Cross, bought in 1239-41 for 135,000 livres. Foundation laid 1241; consecrated 26 April 1248. Inside the royal palace on the Ile de la Cite, now the Paris Hall of Justice."
    sources: [wp-louis-ix-of-france]
  - key: louvre-palace
    name: Louvre Palace
    kind: palace
    city: Paris
    region: Ile-de-France
    country: France
    lat: 48.861
    lng: 2.338
    visitable: true
    visit_site: "Louvre Museum"
    built_by: "Philip II (first Louvre, a fortress); expanded by Charles V"
    note: "Philip II built the first Louvre as a fortress; Louis IX had Enguerrand IV of Coucy brought here in 1256; Philip IV's royal treasure moved here from the Paris Temple c. 1295; Charles V expanded it and housed his library of over 1,200 volumes there."
    sources: [wp-philip-ii-of-france, wp-louis-ix-of-france, wp-philip-iv-of-france, wp-charles-v-of-france]
  - key: notre-dame-de-paris
    name: Notre-Dame de Paris
    kind: cathedral
    city: Paris
    region: Ile-de-France
    country: France
    lat: 48.853
    lng: 2.350
    visitable: true
    founded: 1163
    note: "Construction begun in 1163; continued under Philip II and favoured by Louis VII. In March 1314 Jacques de Molay, the last Templar Grand Master, heard his sentence on a scaffold in front of the cathedral. Founded year is when construction began."
    sources: [wp-philip-ii-of-france, wp-louis-vii-of-france, wp-philip-iv-of-france]
  - key: poissy
    name: Poissy
    kind: town
    region: Yvelines
    country: France
    lat: 48.929
    lng: 2.046
    note: "Birthplace of Louis IX (25 April 1214; baptised in the Collegiale Notre-Dame) and of Philip III (1 May 1245)."
    sources: [wp-louis-ix-of-france, wp-philip-iii-of-france]
  - key: bouvines-battlefield
    name: Bouvines battlefield
    kind: battlefield
    region: Nord
    country: France
    lat: 50.584
    lng: 3.191
    note: "Site of Philip II's victory of 27 July 1214 on a small tributary of the Lys near the bridge at Bouvines, near Lille."
    sources: [wp-philip-ii-of-france]
  - key: orleans
    name: Orleans
    kind: city
    region: Loiret
    country: France
    lat: 47.903
    lng: 1.909
    note: "Louis VI was crowned in the cathedral of Orleans on 3 August 1108. Besieged by the English from October 1428; Joan of Arc and the French lifted the siege on 8 May 1429."
    sources: [wp-louis-vi-of-france, wp-charles-vii-of-france]
  - key: melun-castle
    name: Melun castle
    kind: castle
    city: Melun
    region: Seine-et-Marne
    country: France
    lat: 48.541
    lng: 2.660
    note: "Philip I died in the castle of Melun on 29 July 1108; Louis VI held court here in March 1111. Coordinates approximate."
    sources: [wp-philip-i-of-france, wp-louis-vi-of-france]
  - key: saint-benoit-sur-loire-abbey
    name: Abbey of Saint-Benoit-sur-Loire
    kind: abbey
    city: Saint-Benoit-sur-Loire
    region: Loiret
    country: France
    lat: 47.805
    lng: 2.310
    note: "Philip I was buried here at his own request, not at Saint-Denis, apparently because he had not treated Saint-Denis as well as his predecessors had."
    sources: [wp-philip-i-of-france]
  - key: barbeau-abbey
    name: Barbeau Abbey
    kind: abbey
    region: Seine-et-Marne
    country: France
    lat: 48.48
    lng: 2.74
    built_by: "Louis VII"
    note: "Founded by Louis VII, who was buried here the day after his death on 18 September 1180. His remains were moved to Saint-Denis in 1817. Coordinates approximate (near Fontaine-le-Port)."
    sources: [wp-louis-vii-of-france]
  - key: saint-andre-cathedral-bordeaux
    name: Bordeaux Cathedral (Saint-Andre)
    kind: cathedral
    city: Bordeaux
    region: Gironde
    country: France
    lat: 44.838
    lng: -0.574
    visitable: true
    note: "Where Louis VII married Eleanor of Aquitaine on 25 July 1137."
    sources: [wp-louis-vi-of-france]
  - key: tunis
    name: Tunis
    kind: city
    country: Tunisia
    lat: 36.806
    lng: 10.181
    note: "Louis IX died here on 25 August 1270 on the Eighth Crusade, in an epidemic of dysentery. The crusaders landed at Carthage on 17 July 1270. Philip III was proclaimed king here."
    sources: [wp-louis-ix-of-france, wp-philip-iii-of-france]
  - key: damietta
    name: Damietta
    kind: city
    country: Egypt
    lat: 31.416
    lng: 31.814
    note: "Port on the Nile delta taken by Louis IX on landing in Egypt on 4 or 5 June 1249; surrendered back as part of his ransom after his capture on 8 February 1250."
    sources: [wp-louis-ix-of-france]
  - key: girona
    name: Girona
    kind: city
    region: Girona
    country: Spain
    lat: 41.979
    lng: 2.821
    note: "Besieged by Philip III's army from 26 June 1285 and taken on 7 September 1285 in the Aragonese Crusade."
    sources: [wp-philip-iii-of-france]
  - key: perpignan
    name: Perpignan
    kind: city
    region: Pyrenees-Orientales
    country: France
    lat: 42.699
    lng: 2.895
    note: "Philip III died of dysentery here on 5 October 1285, at the end of the Aragonese Crusade."
    sources: [wp-philip-iii-of-france]
  - key: kortrijk-battlefield
    name: Battlefield of the Golden Spurs (Kortrijk)
    kind: battlefield
    region: West Flanders
    country: Belgium
    lat: 50.828
    lng: 3.265
    historical_name: Courtrai
    note: "Site of the French defeat by the Flemish on 11 July 1302 near Kortrijk (Courtrai)."
    sources: [wp-philip-iv-of-france]
  - key: fontainebleau-castle
    name: Fontainebleau castle
    kind: castle
    city: Fontainebleau
    region: Seine-et-Marne
    country: France
    lat: 48.402
    lng: 2.700
    note: "Philip IV was born in the medieval fortress of Fontainebleau in 1268 and died here on 29 November 1314. Louis IX installed Trinitarians here; Charles IV founded a library here."
    sources: [wp-philip-iv-of-france, wp-louis-ix-of-france, wp-charles-iv-of-france]
  - key: amboise-castle
    name: Chateau d'Amboise
    kind: castle
    city: Amboise
    region: Indre-et-Loire
    country: France
    lat: 47.413
    lng: 0.985
    visitable: true
    note: "Charles VIII was born here in 1470 and died here in 1498 after, it is said, striking his head on a doorway lintel."
    sources: [wp-charles-viii-of-france]
  - key: mehun-sur-yevre
    name: Mehun-sur-Yevre
    kind: town
    region: Cher
    country: France
    lat: 47.146
    lng: 2.215
    note: "Charles VII died here on 22 July 1461 after an infection of the jaw stopped him swallowing; his younger son Charles was with him."
    sources: [wp-charles-vii-of-france]
  - key: chateau-de-plessis-les-tours
    name: Chateau de Plessis-les-Tours
    kind: castle
    city: La Riche (Tours)
    region: Indre-et-Loire
    country: France
    lat: 47.392
    lng: 0.655
    note: "Louis XI died here on 30 August 1483. Coordinates approximate."
    sources: [wp-louis-xi-of-france]
  - key: notre-dame-de-clery
    name: Basilica of Notre-Dame de Clery
    kind: basilica
    city: Clery-Saint-Andre
    region: Loiret
    country: France
    lat: 47.819
    lng: 1.756
    note: "Louis XI was buried here in 1483, and his widow Charlotte of Savoy a few months later."
    sources: [wp-louis-xi-of-france]
  - key: bourges
    name: Bourges
    kind: city
    region: Cher
    country: France
    lat: 47.081
    lng: 2.398
    note: "Birthplace of Louis XI (3 July 1423; baptised at the cathedral of Saint-Etienne). The Dauphin Charles set up his court here in 1418, giving him the name 'King of Bourges'."
    sources: [wp-louis-xi-of-france, wp-charles-vii-of-france]
  - key: chateau-de-montpensier
    name: Chateau de Montpensier
    kind: castle
    region: Puy-de-Dome
    country: France
    lat: 46.04
    lng: 3.20
    note: "Louis VIII died of dysentery here on 8 November 1226 on his way back from the Albigensian Crusade. Auvergne; coordinates approximate."
    sources: [wp-louis-viii-of-france]
  - key: savoy-palace
    name: Savoy Palace
    kind: palace
    city: London
    region: Greater London
    country: England
    lat: 51.510
    lng: -0.120
    note: "John II was held here after Poitiers, and died here in April 1364 after returning to England of his own will. In London."
    sources: [wp-john-ii-of-france]

events:
  # ---- New events ----
  - key: battle-of-val-es-dunes-1047
    name: Battle of Val-es-Dunes
    type: Battle
    year: 1047
    people: [{person: henry-i-of-france, role: victor}]
    prominence: 2
    note: "Henry I came to the aid of the young Duke William of Normandy (the future William the Conqueror) and won a decisive victory over William's rebel vassals near Caen. Only the year is given in the article."
    sources: [wp-henry-i-of-france]
  - key: marriage-of-louis-vii-and-eleanor-of-aquitaine-1137
    name: Marriage of Louis VII and Eleanor of Aquitaine
    type: Marriage
    date: 1137-07-25
    place: saint-andre-cathedral-bordeaux
    people: [{person: louis-vii-of-france, role: groom}, {person: eleanor-of-aquitaine, role: bride}, {person: louis-vi-of-france, role: arranged the marriage}]
    prominence: 4
    note: "On 9 April 1137 the dying Duke William X named Louis VI guardian of Eleanor; Louis VI married her to his heir and died a week later. The marriage was annulled on 21 March 1152 by the Council of Beaugency (kinship); Eleanor married Henry of Anjou on 18 May 1152, giving him Aquitaine."
    sources: [wp-louis-vi-of-france, wp-louis-vii-of-france]
  - key: second-crusade-1147
    name: Second Crusade
    type: Crusade
    year: 1147
    end_year: 1149
    people: [{person: louis-vii-of-france, role: leader}]
    prominence: 4
    note: "Louis VII set out from Saint-Denis in June 1147 with Eleanor. His army was ambushed by Turks at Mount Cadmus, he reached Antioch in March 1148, and the joint siege of Damascus with Conrad III and Baldwin III was abandoned after four days. He left Acre after Easter 1149 and reached Paris in November 1149. The costs and quarrels with Eleanor led to the annulment of their marriage."
    sources: [wp-louis-vii-of-france]
  - key: battle-of-bouvines-1214
    name: Battle of Bouvines
    type: Battle
    date: 1214-07-27
    place: bouvines-battlefield
    people: [{person: philip-ii-of-france, role: victor}, {person: louis-viii-of-france, role: commanded the western front against John}]
    prominence: 5
    note: "Philip's army of about 7,000 beat about 9,000 under Emperor Otto IV and the Count of Flanders (who was captured); Philip was unhorsed but saved by his mail. It ended John's attempt to rebuild the Angevin Empire and left him so weakened that he had to accept Magna Carta (1215). A Sunday battle."
    sources: [wp-philip-ii-of-france, wp-louis-viii-of-france]
  - key: prince-louis-invasion-of-england-1216
    name: Prince Louis's invasion of England
    type: War
    date: 1216-05-21
    end_year: 1217
    place: london
    people: [{person: louis-viii-of-france, role: claimant to the English throne}]
    prominence: 3
    note: "Invited by rebel barons in the First Barons' War, the future Louis VIII landed on Thanet on 21 May 1216, was excommunicated on 29 May and was proclaimed King of England at Old St Paul's on 2 June (never crowned). John's death in October 1216 drew barons away; Louis lost at Lincoln (20 May 1217) and at sea off Sandwich (24 August 1217) and made the Treaty of Lambeth: 10,000 marks and a pledge never to attack England again."
    sources: [wp-louis-viii-of-france]
  - key: albigensian-crusade-1208
    name: Albigensian Crusade
    type: Crusade
    year: 1208
    end_year: 1244
    people: [{person: louis-viii-of-france, role: crusader as prince (1219-1223) and king (1226)}, {person: blanche-of-castile, role: ended the crusade by agreement in 1229}, {person: philip-ii-of-france, role: allowed his vassals to join}]
    prominence: 4
    note: "Called against the Cathars of Languedoc by Pope Innocent III in 1208. Philip II gave no direct support. Louis VIII took Beziers, Carcassonne, Beaucaire and Marseille in 1226 and took Avignon on 9 September 1226 at heavy cost, then died on the way home. Blanche ended it with Raymond VII of Toulouse in 1229; the last Cathar strongholds fell in 1244."
    sources: [wp-philip-ii-of-france, wp-louis-viii-of-france, wp-louis-ix-of-france]
  - key: treaty-of-paris-1229
    name: Treaty of Paris (1229)
    type: Treaty
    year: 1229
    people: [{person: blanche-of-castile, role: signatory for the crown}, {person: louis-ix-of-france, role: king}]
    prominence: 3
    note: "Blanche of Castile, regent, ended the Albigensian Crusade by agreement with Raymond VII of Toulouse; the county of Toulouse came to the crown in 1271 on the death of Alphonse of Poitiers. Day not given in the articles."
    sources: [wp-louis-ix-of-france, wp-louis-viii-of-france]
  - key: treaty-of-corbeil-1258
    name: Treaty of Corbeil (1258)
    type: Treaty
    date: 1258-03-11
    people: [{person: louis-ix-of-france, role: signatory}]
    prominence: 2
    note: "With James I of Aragon: Louis renounced overlordship over Barcelona and Roussillon and James renounced claims to Provence, Languedoc and other southern counties (except Montpellier and Carlat). Philip III married Isabella of Aragon in 1262 under its terms."
    sources: [wp-louis-ix-of-france, wp-philip-iii-of-france]
  - key: treaty-of-paris-1259
    name: Treaty of Paris (1259)
    type: Treaty
    year: 1259
    people: [{person: louis-ix-of-france, role: signatory}]
    prominence: 3
    note: "Henry III of England renounced Normandy, Anjou, Maine, Touraine and Poitou, and was recognised as Duke of Aquitaine and Louis's vassal for Guyenne and Gascony. Day not given in the articles."
    sources: [wp-louis-ix-of-france]
  - key: seventh-crusade-1248
    name: Seventh Crusade
    type: Crusade
    year: 1248
    end_year: 1254
    place: damietta
    people: [{person: louis-ix-of-france, role: leader}, {person: blanche-of-castile, role: regent in France}]
    prominence: 4
    note: "Louis IX left in 1248, landed in Egypt on 4 or 5 June 1249 and took Damietta. His army was lost and he was captured at Fariskur on 8 February 1250; he was ransomed for 400,000 bezants (about 200,000 livres tournois) and the surrender of Damietta. He then spent four years fortifying Acre, Caesarea and Jaffa, left Acre on 24 April 1254 and reached France in July 1254."
    sources: [wp-louis-ix-of-france]
  - key: eighth-crusade-1270
    name: Eighth Crusade
    type: Crusade
    date: 1270-07-17
    place: tunis
    people: [{person: louis-ix-of-france, role: leader (died)}, {person: philip-iii-of-france, role: proclaimed king at Tunis}]
    prominence: 3
    note: "Louis took the cross at Paris on 24 March 1267. The crusaders landed at Carthage on 17 July 1270 and an epidemic of dysentery followed: John Tristan died on 3 August and Louis on 25 August. Charles of Anjou negotiated a treaty with the Hafsid ruler on 5 November 1270."
    sources: [wp-louis-ix-of-france, wp-philip-iii-of-france]
  - key: sicilian-vespers-1282
    name: Sicilian Vespers
    type: Rebellion
    year: 1282
    people: [{person: philip-iii-of-france, role: kinsman of the deposed ruler (his uncle Charles I of Naples)}]
    prominence: 3
    note: "Sicily rose against Charles I of Naples, Philip III's uncle, after years of heavy taxation, massacring many Angevins and French. Peter III of Aragon was crowned king of Sicily on 4 September 1282; Pope Martin IV excommunicated him and granted Aragon to Philip's son Charles of Valois. Philip's brother Peter, Count of Perche, was killed at Reggio Calabria. The day of the rising is not given in the article."
    sources: [wp-philip-iii-of-france]
  - key: aragonese-crusade-1285
    name: Aragonese Crusade
    type: Crusade
    year: 1285
    place: girona
    people: [{person: philip-iii-of-france, role: leader (died)}]
    prominence: 3
    note: "Urged by his wife Marie of Brabant and his uncle Charles of Naples, Philip III invaded Aragon via Roussillon. His army was before Girona by 26 June 1285 and took it on 7 September; dysentery then struck the camp and the French were defeated while withdrawing at the Col de Panissars on 1 October. Philip died at Perpignan on 5 October. One historian called it 'perhaps the most unjust, unnecessary and calamitous enterprise ever undertaken by the Capetian monarchy'; it nearly bankrupted the crown."
    sources: [wp-philip-iii-of-france, wp-philip-iv-of-france]
  - key: battle-of-the-golden-spurs-1302
    name: Battle of the Golden Spurs
    type: Battle
    date: 1302-07-11
    place: kortrijk-battlefield
    people: [{person: philip-iv-of-france, role: defeated (his army)}]
    prominence: 3
    note: "An army of 2,500 men-at-arms and 4,000 infantry sent to put down the Flemish rising was defeated near Kortrijk, decimating a generation of French nobles. Philip avenged it at Mons-en-Pevele in 1304 and in 1305 took Lille, Douai and Bethune."
    sources: [wp-philip-iv-of-france, wp-louis-x-of-france]
  - key: attack-on-boniface-viii-at-anagni-1303
    name: Attack on Pope Boniface VIII at Anagni
    type: Political
    year: 1303
    people: [{person: philip-iv-of-france, role: instigator}]
    prominence: 3
    note: "In September 1303 Philip's agent Guillaume de Nogaret, with the Colonna family, seized Pope Boniface VIII at Anagni; he was held for several days and died soon after. The conflict led to Clement V and the Avignon papacy (1309-1376). The day is not given in the article."
    sources: [wp-philip-iv-of-france]
  - key: expulsion-of-the-jews-from-france-1306
    name: Philip IV expels the Jews from France
    type: Political
    date: 1306-07-22
    people: [{person: philip-iv-of-france, role: ordered the expulsion}]
    prominence: 2
    note: "Philip ordered the expulsion of the Jews on 22 July 1306 and confiscated their property on 23 August, taking at least 140,000 livres parisis. Louis X readmitted them under a twelve-year charter in 1315."
    sources: [wp-philip-iv-of-france, wp-louis-x-of-france]
  - key: suppression-of-the-knights-templar-1307
    name: Suppression of the Knights Templar
    type: Political
    date: 1307-10-13
    end_year: 1314
    people: [{person: philip-iv-of-france, role: instigator}]
    prominence: 4
    note: "At daybreak on Friday 13 October 1307 hundreds of Templars in France were arrested on Philip's orders and later tortured into confessing heresy. Pope Clement V disbanded the order. In March 1314 (the day is disputed) the Grand Master Jacques de Molay and Geoffroi de Charney were burned at the stake on the Ile des Juifs after withdrawing their confessions. Clement died about a month later and Philip within eight months."
    sources: [wp-philip-iv-of-france]
  - key: tour-de-nesle-affair-1314
    name: Tour de Nesle affair
    type: Scandal
    year: 1314
    people: [{person: philip-iv-of-france, role: king}, {person: louis-x-of-france, role: husband of an accused wife}, {person: charles-iv-of-france, role: husband of an accused wife}, {person: philip-v-of-france, role: husband of an accused wife}]
    prominence: 2
    note: "Margaret of Burgundy (wife of Louis X) and Blanche of Burgundy (wife of Charles IV) were convicted of adultery and imprisoned for life (Margaret at Chateau Gaillard); their alleged lovers Philippe and Gauthier d'Aunay were tortured and executed. Joan, wife of Philip V, was cleared by 1315. Doubts about Louis X's daughter Joan's paternity fed the succession dispute of 1316."
    sources: [wp-philip-iv-of-france, wp-louis-x-of-france, wp-philip-v-of-france]
  - key: succession-crisis-of-1316
    name: Succession crisis of 1316-1317
    type: Succession
    date: 1316-06-05
    end_year: 1317
    place: reims-cathedral
    people: [{person: louis-x-of-france, role: died without a son}, {person: john-i-of-france, role: posthumous king}, {person: philip-v-of-france, role: regent then king}]
    prominence: 4
    note: "Louis X died on 5 June 1316 leaving a pregnant widow and a daughter, Joan. Philip the Tall was regent; the baby John I lived four days and Philip was crowned at Reims on 9 January 1317. At an assembly on 2 February he laid down that Joan, as a woman, could not inherit; this precedent was later called the Salic law."
    sources: [wp-philip-v-of-france, wp-louis-x-of-france, wp-john-i-of-france]
  - key: shepherds-crusade-1320
    name: Shepherds' Crusade
    type: Rebellion
    year: 1320
    people: [{person: philip-v-of-france, role: suppressed it}]
    prominence: 2
    note: "A popular crusade (the Pastoreaux) that began in Normandy in 1320 and attacked castles, royal officials, priests, lepers and Jews. Condemned by Pope John XXII; Philip crushed it and drove the remnants across the Pyrenees into Aragon."
    sources: [wp-philip-v-of-france, wp-charles-iv-of-france]
  - key: war-of-saint-sardos-1324
    name: War of Saint-Sardos
    type: War
    year: 1324
    people: [{person: charles-iv-of-france, role: victor}]
    prominence: 2
    note: "Began after Gascon forces destroyed a French bastide at Saint-Sardos in November 1323. Charles of Valois took almost all of Aquitaine, Charles IV declared Edward II's lands forfeit, and in the peace of 1327 Edward III kept a much-reduced Guyenne."
    sources: [wp-charles-iv-of-france]
  - key: start-of-the-hundred-years-war-1337
    name: Start of the Hundred Years' War
    type: War
    date: 1337-05-24
    end_year: 1453
    people: [{person: philip-vi-of-france, role: king of France}]
    prominence: 4
    note: "On 24 May 1337 Philip VI declared Edward III had forfeited Aquitaine for disobedience and for sheltering Robert III of Artois, and Edward renewed his claim to the French throne. Philip had become king in 1328 over Edward, whose claim ran through his mother Isabella (barred under 'Salic law'); Edward did homage at Amiens on 6 June 1329. The war ended after Castillon in 1453."
    sources: [wp-philip-vi-of-france, wp-charles-iv-of-france]
  - key: jacquerie-1358
    name: Jacquerie
    type: Rebellion
    year: 1358
    people: [{person: charles-v-of-france, role: regent}]
    prominence: 3
    note: "A peasant revolt during Charles's regency, backed by Etienne Marcel, who was murdered by a mob on 31 July 1358; Charles recovered Paris the next month. Only the year is given in the articles."
    sources: [wp-charles-v-of-france, wp-john-ii-of-france]
  - key: murder-of-john-the-fearless-1419
    name: Murder of John the Fearless at Montereau
    type: Assassination
    date: 1419-09-10
    people: [{person: charles-vii-of-france, role: Dauphin at the meeting (his own involvement uncertain)}, {person: charles-vi-of-france, role: king}]
    prominence: 3
    note: "On the bridge at Montereau Duke John of Burgundy was killed by Tanneguy du Chastel, a follower of the Dauphin Charles. His son Philip the Good joined the English, which made the Treaty of Troyes (1420) possible."
    sources: [wp-charles-vi-of-france, wp-charles-vii-of-france]
  - key: siege-of-orleans-1429
    name: Siege of Orleans (lifted 8 May 1429)
    type: Siege
    date: 1429-05-08
    place: orleans
    people: [{person: joan-of-arc, role: leader of the relief}, {person: charles-vii-of-france, role: Dauphin}]
    prominence: 4
    note: "Orleans had been besieged since October 1428. Joan reached Charles at Chinon on 23 February 1429 and led the relief; the English lifted the siege on 8 May and lost about half their army at Patay on 18 June."
    sources: [wp-charles-vii-of-france, wp-charles-vi-of-france]
  - key: coronation-of-charles-vii-1429
    name: Coronation of Charles VII
    type: Coronation
    date: 1429-07-17
    place: reims-cathedral
    people: [{person: charles-vii-of-france, role: crowned}]
    prominence: 4
    note: "Crowned at Reims after the English troops nearby were dispersed and the townspeople opened their gates. His rival Henry VI of England was crowned in Paris on 26 December 1431."
    sources: [wp-charles-vii-of-france, wp-charles-vi-of-france]
  - key: execution-of-joan-of-arc-1431
    name: Execution of Joan of Arc
    type: Execution
    date: 1431-05-30
    people: [{person: joan-of-arc, role: executed}, {person: charles-vii-of-france, role: took no action to save her}]
    prominence: 4
    note: "Captured at the siege of Compiegne on 24 May 1430 by Burgundian troops under John of Luxembourg and handed to the English; tried for heresy by pro-English clergy under Pierre Cauchon and burned at the stake."
    sources: [wp-charles-vii-of-france]
  - key: treaty-of-arras-1435
    name: Treaty of Arras (1435)
    type: Treaty
    year: 1435
    people: [{person: charles-vii-of-france, role: signatory}]
    prominence: 3
    note: "A congress opened at Arras on 5 August 1435. Philip the Good of Burgundy ended his alliance with England; Charles had to apologise through a representative for the murder at Montereau and Philip kept his lands without paying homage. Charles entered Paris on 13 April 1436. Signing date not given."
    sources: [wp-charles-vii-of-france]
  - key: battle-of-formigny-1450
    name: Battle of Formigny
    type: Battle
    date: 1450-04-15
    people: [{person: charles-vii-of-france, role: victor}]
    prominence: 3
    note: "French victory that opened the way to the swift conquest of Normandy, after Charles alleged on 17 July 1449 that the English had broken the ten-year truce of Tours (1444)."
    sources: [wp-charles-vii-of-france]
  - key: battle-of-nancy-1477
    name: Battle of Nancy
    type: Battle
    date: 1477-01-05
    people: [{person: louis-xi-of-france, role: beneficiary}]
    prominence: 3
    note: "Charles the Bold of Burgundy was killed after defeats by the Swiss at Grandson (2 March 1476) and Murten (22 June 1476). The Burgundian line died out and Louis XI seized Burgundy and Picardy; the Treaty of Arras (1482) settled the inheritance."
    sources: [wp-louis-xi-of-france]
  - key: italian-war-of-1494
    name: Charles VIII's invasion of Italy
    type: War
    year: 1494
    end_year: 1498
    people: [{person: charles-viii-of-france, role: invader}]
    prominence: 4
    note: "Charles invaded in September 1494 with 25,000 men (8,000 Swiss), reached Pavia on 21 October and Pisa on 8 November, entered Naples on 22 February 1495 and was crowned King of Naples on 20 May 1495. The League of Venice formed on 31 March 1495; it failed to stop him at Fornovo in July but all his gains were lost."
    sources: [wp-charles-viii-of-france]

