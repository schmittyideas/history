# The Papacy, 900-999 (the Saeculum obscurum and the Ottonian popes): the 23 lawful popes of the century not yet here,
# from Benedict IV to Gregory V, and the antipopes Christopher, Boniface VII and John XVI.
# Conventions and checks as inbox/2026-10-18-popes-999-1503.yaml: popes undisputed; antipopes with the title "Pope",
# `disputed: true`, keyed <name>-antipope, named "(antipope)"; each person's own English Wikipedia article (2026-10-18)
# for dates and note, the List of popes and the Antipope table for pontificates and birthplaces, Wikidata for sitelinks
# and coordinates. Dates are often a year or "c." and recorded as the articles give them.
# Stated honestly:
#  - John XII has two pontificates (955-963 and his return in 964): one person, two titles. Boniface VII claimed the
#    papacy twice (974, 984-985): two disputed titles.
#  - Leo VIII is on the official list from June 964; the Church counts his first period (963-964, set up by Otto I
#    against John XII and Benedict V) as an antipapacy, so that title is marked disputed.
#  - Discrepancies recorded, the record using the person's own article: the deaths of John X (928; Wikidata 929),
#    John XI (935; Wikidata 936) and Gregory V (18 February 999; Wikidata 23 February), and the end of Stephen VII's
#    pontificate (his death, 15 March 931; the List of popes 13 February).
#  - Birthplaces left out: Leo V (Priapi near Ardea), Lando (the Sabina) and John X (Tossignano) have no coordinates.
batch:
  title: "The Papacy, 900-999"
  requested: "Do we have all popes? Get them all, with the disputed ones (antipopes) marked disputed"
  date: 2026-10-18

