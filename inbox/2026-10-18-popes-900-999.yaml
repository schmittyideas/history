people:
  - {key: benedict-iv, name: "Benedict IV", type: Clergy, roles: [pope], born: 840, born_estimated: true, died: 0903-07-30, realm: Papacy, prominence: 2, sitelinks: 75, sitelinks_on: 2026-10-18,
     note: "A Roman of noble birth, ordained by Formosus, called 'the Great' by the chronicler Flodoard for his generosity; excommunicated the murderers of Archbishop Fulk of Reims (900).",
     sources: [wp-benedict-iv]}
  - {key: leo-v, name: "Leo V", type: Clergy, roles: [pope], died: 903, died_estimated: true, realm: Papacy, prominence: 1, sitelinks: 78, sitelinks_on: 2026-10-18,
     note: "Born at Priapi near Ardea; pope for a few months in 903, on the eve of the Saeculum obscurum. Deposed by Christopher and later killed. Died 903 or 904.",
     sources: [wp-leo-v]}
  - {key: sergius-iii, name: "Sergius III", type: Clergy, roles: [pope], born: 860, born_estimated: true, died: 0911-04-14, realm: Papacy, prominence: 2, sitelinks: 78, sitelinks_on: 2026-10-18,
     note: "Seized the papacy from the antipope Christopher with the backing of Theophylact of Tusculum (904); his reign opens the Saeculum obscurum, when Roman aristocrats ruled the papacy. The first pope shown wearing the tiara.",
     sources: [wp-sergius-iii]}
  - {key: anastasius-iii, name: "Anastasius III", type: Clergy, roles: [pope], born: 865, born_estimated: true, died: 913, realm: Papacy, prominence: 1, sitelinks: 75, sitelinks_on: 2026-10-18,
     note: "A Roman, perhaps an illegitimate son of Sergius III; almost nothing is recorded of his reign (911-913). Died June 913.",
     sources: [wp-anastasius-iii]}
  - {key: lando, name: "Lando", type: Clergy, roles: [pope], died: 914, realm: Papacy, prominence: 1, sitelinks: 76, sitelinks_on: 2026-10-18,
     note: "Born in the Sabina, son of a Lombard count; pope 913-914. The last pope to take a new, uncompounded name until Francis.",
     sources: [wp-lando]}
  - {key: john-x, name: "John X", type: Clergy, roles: [pope], died: 0928-05-28, realm: Papacy, prominence: 2, sitelinks: 77, sitelinks_on: 2026-10-18,
     note: "Candidate of the Tusculan counts; worked to unite Italy under Berengar of Friuli and helped defeat the Saracens at the Garigliano (915). Marozia had him deposed, imprisoned and murdered.",
     sources: [wp-john-x]}
  - {key: leo-vi, name: "Leo VI", type: Clergy, roles: [pope], born: 880, died: 0929-02-12, realm: Papacy, prominence: 1, sitelinks: 78, sitelinks_on: 2026-10-18,
     note: "Pope for seven months (928-929) during the Saeculum obscurum.",
     sources: [wp-leo-vi]}
  - {key: stephen-vii, name: "Stephen VII", type: Clergy, roles: [pope], died: 0931-03-15, realm: Papacy, prominence: 1, sitelinks: 73, sitelinks_on: 2026-10-18,
     note: "A candidate of Marozia, pope 929-931 in the Saeculum obscurum; sometimes numbered Stephen VIII.",
     sources: [wp-stephen-vii]}
  - {key: john-xi, name: "John XI", type: Clergy, roles: [pope], born: 910, died: 935, realm: Papacy, prominence: 2, sitelinks: 74, sitelinks_on: 2026-10-18,
     note: "Son of Marozia, probably by Sergius III; Rome was ruled by his mother and then his brother Alberic II of Spoleto. Died December 935.",
     sources: [wp-john-xi]}
  - {key: leo-vii, name: "Leo VII", type: Clergy, roles: [pope], died: 0939-07-13, realm: Papacy, prominence: 1, sitelinks: 77, sitelinks_on: 2026-10-18,
     note: "A Benedictine, pope 936-939 under Alberic II.",
     sources: [wp-leo-vii]}
  - {key: stephen-viii, name: "Stephen VIII", type: Clergy, roles: [pope], died: 942, realm: Papacy, prominence: 1, sitelinks: 69, sitelinks_on: 2026-10-18,
     note: "Pope 939-942, caught in the conflict between his patron Alberic II and King Hugh of Italy; sometimes numbered Stephen IX. Died October 942.",
     sources: [wp-stephen-viii]}
  - {key: marinus-ii, name: "Marinus II", type: Clergy, roles: [pope], died: 946, realm: Papacy, prominence: 1, sitelinks: 72, sitelinks_on: 2026-10-18,
     note: "Pope 942-946 under Alberic II; mistakenly called Martin III, which is why the next Martin took the number IV. Died May 946.",
     sources: [wp-marinus-ii]}
  - {key: agapetus-ii, name: "Agapetus II", type: Clergy, roles: [pope], born: 911, born_estimated: true, died: 0955, realm: Papacy, prominence: 1, sitelinks: 70, sitelinks_on: 2026-10-18,
     note: "Nominee of Alberic II, princeps of Rome; pope 946-955.",
     sources: [wp-agapetus-ii]}
  - {key: john-xii, name: "John XII", type: Clergy, roles: [pope], born: 937, born_estimated: true, died: 0964-05-14, realm: Papacy, prominence: 3, sitelinks: 82, sitelinks_on: 2026-10-18,
     note: "Octavian, son of Alberic II and kin of the Tusculan counts, pope at 17 to 25: perhaps the youngest ever. Crowned Otto I emperor (962), was deposed by him (963), returned in 964 and died that May.",
     sources: [wp-john-xii]}
  - {key: benedict-v, name: "Benedict V", type: Clergy, roles: [pope], died: 0965-07-04, realm: Papacy, prominence: 1, sitelinks: 81, sitelinks_on: 2026-10-18,
     note: "Elected by the Romans against Otto I's pope Leo VIII (964); Otto overthrew him after a month and exiled him to Hamburg, where he died.",
     sources: [wp-benedict-v]}
  - {key: leo-viii, name: "Leo VIII", type: Clergy, roles: [pope], born: 915, born_estimated: true, died: 0965, realm: Papacy, prominence: 2, sitelinks: 78, sitelinks_on: 2026-10-18,
     note: "A Roman layman made pope by Otto I in place of John XII (963); today counted an antipope for 963-964 and the lawful pope from June 964 to his death.",
     sources: [wp-leo-viii]}
  - {key: john-xiii, name: "John XIII", type: Clergy, roles: [pope], born: 930, born_estimated: true, died: 0972-09-06, realm: Papacy, prominence: 2, sitelinks: 73, sitelinks_on: 2026-10-18,
     note: "Pope 965-972 amid Otto I's quarrels with the Roman nobility; arranged a Byzantine marriage for Otto II. Remembered as 'the Good'.",
     sources: [wp-john-xiii]}
  - {key: benedict-vi, name: "Benedict VI", type: Clergy, roles: [pope], born: 950, died: 974, realm: Papacy, prominence: 1, sitelinks: 74, sitelinks_on: 2026-10-18,
     note: "Of Lombard descent; pope 973-974 between Otto I and Otto II, amid the Crescentii's struggle for power. Deposed and murdered (June 974).",
     sources: [wp-benedict-vi]}
  - {key: benedict-vii, name: "Benedict VII", type: Clergy, roles: [pope], died: 0983-07-10, realm: Papacy, prominence: 1, sitelinks: 71, sitelinks_on: 2026-10-18,
     note: "Pope from October 974 to his death in 983, after the antipope Boniface VII fled Rome.",
     sources: [wp-benedict-vii]}
  - {key: john-xiv, name: "John XIV", type: Clergy, roles: [pope], died: 0984-08-20, realm: Papacy, prominence: 1, sitelinks: 75, sitelinks_on: 2026-10-18,
     note: "Peter Canepanova, Bishop of Pavia, named by Otto II without consulting the Romans (983); deposed and confined in Castel Sant'Angelo by the antipope Boniface VII, he died there in August 984, by starvation or poison.",
     sources: [wp-john-xiv]}
  - {key: john-xv, name: "John XV", type: Clergy, roles: [pope], died: 996, realm: Papacy, prominence: 2, sitelinks: 73, sitelinks_on: 2026-10-18,
     note: "A Roman; the first pope to canonise a saint formally (993). The deposition of Archbishop Arnulf of Reims soured relations with the Capetian kings. Died March 996.",
     sources: [wp-john-xv]}
  - {key: gregory-v, name: "Gregory V", type: Clergy, roles: [pope], born: 972, born_estimated: true, died: 0999-02-23, realm: Papacy, prominence: 2, sitelinks: 79, sitelinks_on: 2026-10-18,
     note: "Bruno of Carinthia, of the Salian dynasty, made pope by his cousin Otto III: the first German pope (996-999).",
     sources: [wp-gregory-v]}
  - {key: christopher-antipope, name: "Christopher (antipope)", type: Clergy, roles: [antipope], died: 904, died_estimated: true, realm: Papacy, prominence: 1, sitelinks: 36, sitelinks_on: 2026-10-18,
     note: "Deposed Leo V and claimed the papacy from October 903 to January 904, when Sergius III ousted him; listed as a lawful pope until the 20th century.",
     sources: [wp-christopher-antipope]}
  - {key: boniface-vii-antipope, name: "Boniface VII (antipope)", type: Clergy, roles: [antipope], died: 0985-07-20, realm: Papacy, prominence: 2, sitelinks: 32, sitelinks_on: 2026-10-18,
     note: "Franco Ferrucci, supposed to have had Benedict VI killed (974); fled to Constantinople with a vast treasure, returned in 984, deposed John XIV, and died suspiciously in 985.",
     sources: [wp-boniface-vii-antipope]}
  - {key: john-xvi-antipope, name: "John XVI (antipope)", type: Clergy, roles: [antipope], born: 945, born_estimated: true, died: 1001, died_estimated: true, realm: Papacy, prominence: 1, sitelinks: 32, sitelinks_on: 2026-10-18,
     note: "John Philagathos, a Greek from Rossano, set up against Gregory V by Crescentius II with the support of Emperor Basil II (997-998).",
     sources: [wp-john-xvi-antipope]}

