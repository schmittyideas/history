discrepancies:
  - key: tojo-premiership-dates
    question: When did Tojo's premiership begin and end?
    about: [{person: hideki-tojo}]
    field: date
    claims:
      - {value: "18 October 1941 – 22 July 1944", sources: [wp-hideki-tojo], note: Infobox}
      - {value: "From 17 October 1941; forced to resign on 18 July 1944", sources: [wp-hideki-tojo], note: Body and lead}
    note: The title uses the infobox dates (taking and leaving office, rather than appointment and resignation).
  - key: halsey-third-fleet-start
    question: When did Halsey take command of the US Third Fleet?
    about: [{person: william-halsey-jr}]
    field: date
    claims:
      - {value: "1943", sources: [wp-william-halsey-jr], note: Lead}
      - {value: "May 1944 (newly formed)", sources: [wp-william-halsey-jr], note: Body}
      - {value: "June 1944", sources: [wp-william-halsey-jr], note: Succession box}
    note: The title starts in 1944.
  - key: mao-party-chairman-start
    question: When did Mao become Chairman of the Chinese Communist Party?
    about: [{person: mao-zedong}]
    field: date
    claims:
      - {value: "20 March 1943", sources: [wp-mao-zedong], note: Infobox and body}
      - {value: "1945 (Chairman of the Central Committee)", sources: [wp-mao-zedong], note: Succession box}
    note: The title starts on 20 March 1943; he had led the party in practice since the Zunyi conference of January 1935.
  - key: zhu-de-pla-start
    question: When did Zhu De become Commander-in-Chief of the People's Liberation Army?
    about: [{person: zhu-de}]
    field: date
    claims:
      - {value: "28 November 1946", sources: [wp-zhu-de], note: Infobox}
      - {value: "1949", sources: [wp-zhu-de], note: Body and succession box}
    note: The title uses the infobox date.
