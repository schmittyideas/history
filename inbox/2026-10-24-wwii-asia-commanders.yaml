batch:
  title: "WWII, batch 3a: the war in Asia and the Pacific — leaders and commanders"
  requested: "Ty: go ahead with batch 3, the Pacific and China (with Southeast Asia, atrocities in Asia, the Chinese Communists, and Australia and New Zealand); do all batches"
  date: 2026-10-24

# Notes for the reviewer
# - Facts come from each person's English Wikipedia article, read through the Wikipedia API on 2026-10-24 (infobox and body).
#   Sitelinks are Wikipedia language editions only, from Wikidata on 2026-10-24. New birth, death and burial places cite the
#   person's own article (which names the place) and the place's coordinates from its own article or Wikidata.
# - Types: Military for the soldiers and sailors. Government for Tojo (an army general, but Prime Minister; his army posts are
#   military titles), Konoe, Mao and Curtin. Mountbatten and Slim are Military, with their later viceroyalty and governor-
#   generalship as plain titles.
# - Mao's party chairmanship (from 1943) is filed under realm China, as Stalin's party post is under the Soviet Union, so the Year
#   view shows both Chiang and Mao for China in 1943-1949, the years of civil war. The succession box dates it from 1945 (logged).
# - New Zealand: none of its leaders is in this batch; Australia has Curtin and Blamey. New realms: Australia, Dominion of India.
# - Military titles: commands the article dates; where it gives only a month or a year, the title has the year. Left out for lack of
#   dates: Tibbets's 509th Composite Group, Zhu De's Eighth Route Army (no dates in his article), Slim's Burma Corps.
# - Portraits: the article lead image, linked only; all are public domain on Commons except Mountbatten's (CC BY-SA 3.0), left out.
# - Places: Tojo's and Konoe's births are filed at Tokyo; MacArthur's at Little Rock (the barracks is now the Tower Building of the
#   Little Rock Arsenal); Slim's at Bristol (body: St Andrews; infobox: Bishopston, both in Bristol); Blamey's at Wagga Wagga
#   (body: Lake Albert, near Wagga Wagga); Percival's death at London (King Edward VII's Hospital). Tojo's, Matsui's, Stilwell's
#   and Tibbets's ashes were scattered or taken, so they have no burial. Existing places reused: tokyo, beijing, london, bristol,
#   columbus-ohio, washington-dc, arlington-national-cemetery.
# - Their roles in events come in batch 3b (2026-10-24-wwii-asia-events.yaml).

