people:
  - {key: stephen-iv, name: "Stephen IV", type: Clergy, roles: [pope], died: 0817-01-24, realm: Papacy, prominence: 1, sitelinks: 75, sitelinks_on: 2026-10-18,
     note: "Of a noble Roman family; crowned Louis the Pious emperor at Reims in October 816 and died the following January. Sometimes numbered Stephen V.",
     sources: [wp-stephen-iv]}
  - {key: paschal-i, name: "Paschal I", type: Clergy, roles: [pope], died: 824, realm: Papacy, prominence: 2, sitelinks: 78, sitelinks_on: 2026-10-18,
     note: "An aristocratic Roman, abbot of St Stephen's; crowned Lothair I emperor in Rome (823) and rebuilt churches including three basilicas. Credited with finding the body of St Cecilia. A saint.",
     sources: [wp-paschal-i]}
  - {key: eugene-ii, name: "Eugene II", type: Clergy, roles: [pope], died: 0827-08-27, realm: Papacy, prominence: 1, sitelinks: 77, sitelinks_on: 2026-10-18,
     note: "Chosen by the nobles over the clergy's candidate (824), confirming the Carolingians' hold on papal elections; his council of 826 condemned simony and ordered cathedral schools.",
     sources: [wp-eugene-ii]}
  - {key: valentine, name: "Valentine", type: Clergy, roles: [pope], died: 0827-10-10, realm: Papacy, prominence: 1, sitelinks: 74, sitelinks_on: 2026-10-18,
     note: "A noble, unusually close to Eugene II; elected before he was ordained a priest, he reigned some forty days (827).",
     sources: [wp-valentine]}
  - {key: gregory-iv, name: "Gregory IV", type: Clergy, roles: [pope], died: 0844-01-25, realm: Papacy, prominence: 2, sitelinks: 82, sitelinks_on: 2026-10-18,
     note: "Pope 827-844 as the papacy tried to mediate between Louis the Pious and his sons, and the Carolingian Empire broke up (843); rebuilt the atrium of St Peter's.",
     sources: [wp-gregory-iv]}
  - {key: sergius-ii, name: "Sergius II", type: Clergy, roles: [pope], died: 0847-01-27, realm: Papacy, prominence: 1, sitelinks: 75, sitelinks_on: 2026-10-18,
     note: "Elected by the lay aristocracy over the people's candidate, the antipope John (844); his reign saw the Arab raid on Rome (846).",
     sources: [wp-sergius-ii]}
  - {key: leo-iv, name: "Leo IV", type: Clergy, roles: [pope], died: 0855-07-17, realm: Papacy, prominence: 2, sitelinks: 79, sitelinks_on: 2026-10-18,
     note: "A Benedictine of Lombard descent: repaired the churches damaged in the Arab raid, built the Leonine Wall round the Vatican hill, and led the league that won the Battle of Ostia (849). A saint.",
     sources: [wp-leo-iv]}
  - {key: benedict-iii, name: "Benedict III", type: Clergy, roles: [pope], died: 0858-04-17, realm: Papacy, prominence: 1, sitelinks: 77, sitelinks_on: 2026-10-18,
     note: "Elected in 855 and briefly displaced by the emperor's candidate, the antipope Anastasius; pope until 858.",
     sources: [wp-benedict-iii]}
  - {key: nicholas-i, name: "Nicholas I", type: Clergy, roles: [pope], born: 800, born_estimated: true, died: 0867-11-13, realm: Papacy, prominence: 3, sitelinks: 76, sitelinks_on: 2026-10-18,
     note: "'The Great', the last of three popes so called: a consolidator of papal authority who claimed it over Christian rulers and encouraged missions. A saint.",
     sources: [wp-nicholas-i]}
  - {key: adrian-ii, name: "Adrian II", type: Clergy, roles: [pope], born: 0792, died: 0872-12-14, realm: Papacy, prominence: 2, sitelinks: 80, sitelinks_on: 2026-10-18,
     note: "Continued Nicholas I's policy; placed under watch by Louis II's partisans, who killed his wife and daughters. Pope during the Fourth Council of Constantinople (869-870).",
     sources: [wp-adrian-ii]}
  - {key: john-viii, name: "John VIII", type: Clergy, roles: [pope], died: 0882-12-16, realm: Papacy, prominence: 2, sitelinks: 82, sitelinks_on: 2026-10-18,
     note: "One of the ablest 9th-century popes: fought Muslim advances in southern Italy, strengthened Rome's defences and supported Methodius's mission to the Slavs; the first pope to be assassinated (882).",
     sources: [wp-john-viii]}
  - {key: marinus-i, name: "Marinus I", type: Clergy, roles: [pope], died: 0884-05-15, realm: Papacy, prominence: 1, sitelinks: 77, sitelinks_on: 2026-10-18,
     note: "Already a bishop when elected, which was controversial, and once legate to Constantinople; mistakenly called Martin II.",
     sources: [wp-marinus-i]}
  - {key: adrian-iii, name: "Adrian III", type: Clergy, roles: [pope], died: 0885-07-08, realm: Papacy, prominence: 1, sitelinks: 79, sitelinks_on: 2026-10-18,
     note: "Pope for little more than a year (884-885), working for Italians in famine and war. A saint.",
     sources: [wp-adrian-iii]}
  - {key: stephen-v, name: "Stephen V", type: Clergy, roles: [pope], died: 0891-09-14, realm: Papacy, prominence: 1, sitelinks: 77, sitelinks_on: 2026-10-18,
     note: "Followed Nicholas I's line with Photius of Constantinople and the young Slavic church (885-891). Sometimes numbered Stephen VI.",
     sources: [wp-stephen-v]}
  - {key: formosus, name: "Formosus", type: Clergy, roles: [pope], born: 816, born_estimated: true, died: 0896-04-04, realm: Papacy, prominence: 2, sitelinks: 79, sitelinks_on: 2026-10-18,
     note: "Pope 891-896 amid struggles over Constantinople, West Francia and the Empire; because he backed Arnulf of Carinthia against Lambert of Spoleto, his corpse was exhumed and tried in the Cadaver Synod (897).",
     sources: [wp-formosus]}
  - {key: boniface-vi, name: "Boniface VI", type: Clergy, roles: [pope], died: 0896-04-26, realm: Papacy, prominence: 1, sitelinks: 77, sitelinks_on: 2026-10-18,
     note: "Elected in riots after Formosus's death though twice deposed from orders; died or was ousted after fifteen days (896).",
     sources: [wp-boniface-vi]}
  - {key: stephen-vi, name: "Stephen VI", type: Clergy, roles: [pope], died: 897, realm: Papacy, prominence: 2, sitelinks: 77, sitelinks_on: 2026-10-18,
     note: "Instigator of the Cadaver Synod against Formosus (January 897), which led to his own downfall and death. Sometimes numbered Stephen VII.",
     sources: [wp-stephen-vi]}
  - {key: romanus, name: "Romanus", type: Clergy, roles: [pope], died: 897, died_estimated: true, realm: Papacy, prominence: 1, sitelinks: 74, sitelinks_on: 2026-10-18,
     note: "Pope for a few months of 897 amid the factional strife after the Cadaver Synod; deposed and confined to a monastery.",
     sources: [wp-romanus]}
  - {key: theodore-ii, name: "Theodore II", type: Clergy, roles: [pope], born: 840, died: 897, realm: Papacy, prominence: 1, sitelinks: 73, sitelinks_on: 2026-10-18,
     note: "A Greek who in his twenty days (December 897) annulled the Cadaver Synod, restored Formosus's acts and had his body recovered from the Tiber and reburied with honour.",
     sources: [wp-theodore-ii]}
  - {key: john-ix, name: "John IX", type: Clergy, roles: [pope], born: 825, born_estimated: true, died: 900, realm: Papacy, prominence: 1, sitelinks: 76, sitelinks_on: 2026-10-18,
     note: "A Benedictine of Lombard descent from Tivoli; confirmed Theodore II's restoration of Formosus (898-900). Died January 900.",
     sources: [wp-john-ix]}
  - {key: john-viii-antipope, name: "John VIII (antipope)", type: Clergy, roles: [antipope], realm: Papacy, prominence: 1, sitelinks: 28, sitelinks_on: 2026-10-18,
     note: "A deacon acclaimed by the Roman populace and enthroned in the Lateran on Gregory IV's death (844); ejected by the aristocracy, who chose Sergius II.",
     sources: [wp-john-viii-antipope]}
  - {key: anastasius-bibliothecarius, name: "Anastasius Bibliothecarius", type: Clergy, roles: [antipope], born: 810, born_estimated: true, died: 878, died_estimated: true, realm: Papacy, prominence: 2, sitelinks: 40, sitelinks_on: 2026-10-18,
     note: "A learned Roman, later the chief archivist and librarian (bibliothecarius) of the Holy See; briefly claimed the papacy against Benedict III in 855.",
     sources: [wp-anastasius-bibliothecarius]}

