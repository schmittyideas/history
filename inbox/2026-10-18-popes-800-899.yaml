# The Papacy, 800-899 (the Carolingian popes to the Cadaver Synod): the 20 popes of the century not yet here, from
# Stephen IV to John IX, the antipopes John VIII (844) and Anastasius Bibliothecarius (855), and three events: the Arab
# raid against Rome (846), the Battle of Ostia (849) and the Cadaver Synod (897).
# Conventions and checks as the earlier Papacy batches (inbox/2026-10-18-popes-*.yaml); a Wikidata date is used only
# where the article confirms it, and birth years Wikidata gives but the articles don't are left out.
# Stated honestly:
#  - Discrepancy recorded: Benedict III's death (17 April 858; Wikidata 7 April).
#  - Dates the articles give only to the month or year are kept to the year (Paschal I died 824, Stephen VI and Romanus
#    897, John IX January 900).
batch:
  title: "The Papacy, 800-899"
  requested: "Do we have all popes? Get them all, with the disputed ones (antipopes) marked disputed"
  date: 2026-10-18

