events:
  - key: arab-raid-against-rome-846
    name: Arab raid against Rome
    type: Raid
    year: 846
    place: rome
    people:
      - {person: sergius-ii, role: pope at the time}
    prominence: 3
    note: "Arab raiders plundered the outskirts of Rome, sacking Old St Peter's and St Paul's Outside the Walls, but the Aurelian Walls kept them out of the city."
    sources: [wp-arab-raid-against-rome]
  - key: battle-of-ostia-849
    name: Battle of Ostia
    type: Battle
    year: 849
    place: ostia-antica
    people:
      - {person: leo-iv, role: organised the league}
    prominence: 2
    note: "A league of Papal, Neapolitan, Amalfitan and Gaetan ships defeated a Muslim fleet in the Tyrrhenian Sea off Ostia."
    sources: [wp-battle-of-ostia, wp-leo-iv]
  - key: cadaver-synod-897
    name: Cadaver Synod
    type: Trial
    year: 897
    place: lateran-palace-rome
    people:
      - {person: stephen-vi, role: conducted it}
      - {person: formosus, role: tried posthumously}
    prominence: 3
    note: "Stephen VI had the corpse of Formosus, dead some nine months, exhumed and tried in the Lateran basilica in January 897."
    sources: [wp-cadaver-synod]

