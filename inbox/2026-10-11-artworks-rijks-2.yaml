# Notes for the reviewer
# - Paintings by our painters, read through the official Rijksmuseum API (https://data.rijksmuseum.nl/); nothing was scraped. Image links only where the museum marks the work public domain / CC0 (MoMA and Tate publish metadata only: no images, just the accession number and a link back). Second wave: painters with 40 or more Wikipedia editions. Up to 3 per painter, matched on the painter's full name in the museum's artist field.
# - 82 new artworks (works already in the database were skipped: 2) (images are hotlinked from the museum's servers, CC0).
# - Dates are the museum's own begin/end years; `estimated` where its date text says ca./c./probably.

batch:
  title: Paintings from the Rijksmuseum open collection
  requested: Add images, accession numbers and links back for our painters' works in the Rijksmuseum
  date: '2026-10-11'
