# Notes for the reviewer
# - Public-domain paintings by our painters, read through the official Metropolitan Museum of Art API (https://metmuseum.github.io/); nothing was scraped. Only works the museum marks as public domain / CC0 with an image. Up to 3 per painter, matched on the painter's full name in the museum's artist field.
# - 136 new artworks and 1 existing ones updated with the museum, accession number, object page and image links (images are hotlinked from the museum's servers, CC0).
# - Dates are the museum's own begin/end years; `estimated` where its date text says ca./c./probably.

