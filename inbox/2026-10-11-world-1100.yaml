people:
  - key: emperor-horikawa
    name: Emperor Horikawa
    type: Royalty
    realm: Japan
    born: 1079-08-08
    died: 1107-08-09
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "73rd emperor of Japan, son of Emperor Shirakawa. Acceded at eight on his father's abdication, 3 January 1087, with the kampaku Fujiwara Morozane as regent; his reign was overshadowed by Shirakawa's cloistered rule. Devoted to scholarship, poetry and music. His son Munehito (later Emperor Toba) was raised by Shirakawa after the empress-consort's death in 1103. Died at 28."
    sources: [wp-emperor-horikawa]
  - key: coloman-of-hungary
    name: Coloman the Learned
    type: Royalty
    realm: Hungary
    house: Árpád
    born: 1070
    born_estimated: true
    died: 1116-02-03
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Könyves Kálmán, King of Hungary from 1095 and of Croatia from 1097. Bred for the Church (bishop of Eger or Várad), he returned from Poland when his uncle Ladislaus I died in July 1095 and was crowned in early 1096. Let the main First Crusade army through in 1096 but destroyed the unruly bands, invaded Croatia in 1097 (Petar Snačić died at Gvozd Mountain), was crowned king of Croatia in 1102 and took Dalmatia in 1105. Revised Stephen I's laws around 1100 and gave up appointing prelates in 1106. Had his brother Álmos and nephew Béla blinded between 1113 and 1115. Buried at Székesfehérvár."
    sources: [wp-coloman-king-of-hungary]
  - key: boleslaw-iii-wrymouth
    name: Bolesław III Wrymouth
    type: Royalty
    realm: Poland
    house: Piast
    born: 1086-08-20
    died: 1138-10-28
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Duke of Lesser Poland, Silesia and Sandomierz from 1102 and of all Poland from 1107, after driving out his half-brother Zbigniew (whom he later had blinded). Allied with Hungary and Kiev (married Sviatopolk II's daughter Zbyslava in 1103), beat Henry V's invasion of 1109 (the battle of Hundsfeld is doubted by historians) and conquered Pomerania in the 1110s-1120s. His will of 1138 divided Poland among his sons. Died probably at Sochaczew; the tradition of burial at Płock dates only from the 15th century. Birth date disputed (see discrepancy)."
    sources: [wp-boleslaw-iii-wrymouth]
  - key: borivoj-ii-of-bohemia
    name: Bořivoj II of Bohemia
    type: Royalty
    realm: Bohemia
    house: Přemyslid
    born: 1064
    born_estimated: true
    died: 1124-02-02
    prominence: 1
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Duke of Bohemia from 25 December 1100 to May 1107 and again from December 1117 to 16 August 1120, younger half-brother of Bretislaus II. Fought Ulrich of Brno, backed Zbigniew against Bolesław III in 1102, was driven out in 1107 by his brother Vladislaus and his cousin Svatopluk, and later ruled jointly with Vladislaus. Died in exile in Hungary."
    sources: [wp-borivoj-ii-duke-of-bohemia]
  - key: sviatopolk-ii-of-kiev
    name: Sviatopolk II of Kiev
    type: Royalty
    realm: Kievan Rus'
    house: Rurikid
    born: 1050-11-08
    died: 1113-04-16
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Michael in baptism, son of Iziaslav, prince of Novgorod 1078-88 and of Turov, Grand Prince of Kiev 1093-1113. An unpopular prince, in constant rivalry with Vladimir Monomakh. Beaten by the Cumans on the Stugna in 1093, saw Kiev's suburbs sacked in 1096, won with Vladimir at the Salnytsia in 1111. Father-in-law of Bolesław III Wrymouth. Nestor compiled the Primary Chronicle in his reign."
    sources: [wp-sviatopolk-ii-of-kiev]
  - key: eric-i-of-denmark
    name: Eric I of Denmark
    type: Royalty
    realm: Denmark
    house: Estridsen
    born: 1056
    born_estimated: true
    died: 1103-07-10
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Eric Evergood, born at Slangerup, son of Sweyn II. Elected king at several landsting assemblies in 1095 after his brother Olaf I Hunger, and ended the famines. Won the canonisation of his brother Canute IV and an archbishopric at Lund (first archbishop Asser). In 1101 brokered peace between Norway and Sweden. Set out on pilgrimage to the Holy Land and died at Paphos on Cyprus in July 1103, the first king to go after Jerusalem fell; the queen had him buried there."
    sources: [wp-eric-i-of-denmark]
  - key: magnus-barefoot
    name: Magnus Barefoot
    type: Royalty
    realm: Norway
    house: Fairhair
    born: 1073
    died: 1103-08-24
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Magnus III Olafsson, King of Norway from 1093, co-ruling with his cousin Haakon Magnusson until 1095. Campaigned round the Irish Sea in 1098-99 (Orkney, the Hebrides, Mann, Anglesey) and again from 1101 or 1102, allied with Muirchertach Ua Briain and was killed in an ambush by the Ulaid on 24 August 1103, the last Norwegian king to fall in battle abroad. Made peace with Sweden in 1101 by marrying Inge the Elder's daughter Margaret, with Dalsland as her dowry; buried near the Church of St Patrick in Down."
    sources: [wp-magnus-barefoot]
  - key: inge-the-elder
    name: Inge the Elder
    type: Royalty
    realm: Sweden
    house: Stenkil
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "King of Sweden, 'rex gautorum' in one chronicle, son of Stenkil. A devout Christian and the first Swedish king to found an abbey (Vreta, c.1100, with Queen Helena). Driven out for a time by Blot-Sweyn in the early 1080s (three years in the sagas), he came back, burned him in his house and reigned until his death. Beat Magnus Barefoot at Fuxarne; the peace of 1101 gave Magnus his daughter Margaret. Birth not in the article; death between c.1105 and c.1110 (not entered). Probably buried at Vreta."
    sources: [wp-inge-the-elder]
  - key: david-iv-of-georgia
    name: David IV of Georgia
    type: Royalty
    realm: Georgia
    house: Bagrationi
    born: 1073
    born_estimated: true
    died: 1125-01-24
    prominence: 4
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "David the Builder, born at Kutaisi, only son of George II. The 5th king of Georgia, from 1089: reformed the army, brought the lands of the Caucasus under his rule, won the Battle of Didgori (12 August 1121) over the Seljuks, took Tbilisi in February 1122 and made it his capital, and Dmanisi in March 1124. Founded the Gelati monastery and academy; canonised by the Georgian Orthodox Church. Died in Tbilisi on 24 January 1125, buried by tradition at Gelati. Date he became sole king is disputed (see discrepancy)."
    sources: [wp-david-iv-of-georgia]
  - key: al-mustali
    name: Al-Musta'li
    type: Royalty
    realm: Fatimid Caliphate
    house: Fatimid
    born: 1074
    died: 1101
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Ninth Fatimid caliph, 19th imam of Musta'li Ismailism, made caliph in December 1094 by his brother-in-law the vizier al-Afdal, who ruled in his name. His brother Nizar's revolt at Alexandria and its failure split the Isma'ilis into Nizari and Musta'li branches. Under him the Fatimids lost Jerusalem to the First Crusade (15 July 1099) and al-Afdal's army was beaten at Ascalon (12 August 1099). Died 11 or 12 December 1101 (poison rumoured); his five-year-old son al-Amir succeeded. Born 15 or 16 September 1074, or perhaps 1075 (see discrepancy)."
    sources: [wp-al-mustali]
  - key: al-mustazhir
    name: Al-Mustazhir
    type: Royalty
    realm: Abbasid Caliphate
    house: Abbasid
    born: 1078
    died: 1118-08-06
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Abbasid caliph in Baghdad, 1094-1118, succeeding his father al-Muqtadi (died 3 February 1094) at sixteen. Politically irrelevant under the Seljuk sultans; ignored the appeals of Aleppo against the Crusaders until 1111 and backed the efforts of Mawdud of Mosul. Father of the future caliphs al-Mustarshid and al-Muqtafi. Succeeded by al-Mustarshid."
    sources: [wp-al-mustazhir]
  - key: barkiyaruq
    name: Barkiyaruq
    type: Royalty
    realm: Great Seljuk Empire
    house: Seljuk
    born: 1079
    born_estimated: true
    died: 1105
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Berkyaruq, eldest son of Malik-Shah I, fifth Seljuk sultan 1094-1105, born at Isfahan in 1079 or 1080. Crowned at Ray at thirteen with the support of the Nizamiyya and defeated his rivals (his uncle Tutush was killed on 25 February 1095); then lost most of his authority to civil war with his half-brother Muhammad I Tapar (1098/9-1104), which he ended by dividing the empire. Died of tuberculosis near Borujerd in 1105, aged 25. The empire fragmented in his reign; he did nothing about the First Crusade."
    sources: [wp-barkiyaruq]
  - key: masud-iii-of-ghazni
    name: Mas'ud III of Ghazni
    type: Royalty
    realm: Ghaznavid Empire
    house: Ghaznavid
    born: 1061
    died: 1115
    prominence: 1
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Ghaznavid sultan 1099-1115, son of Ibrahim, born at Ghazni. Married the Seljuk princess Mahd-i Iraq Jauhar Khatun in 1082-83; kept friendly relations with the eastern Seljuks and struck coins in the name of the caliph al-Mustazhir. Built a palace (1112) and one of the two Minarets of Ghazni. After his death three sons ruled in turn: Shir-Zad, Malik Arslan and Bahram Shah (1117-1157)."
    sources: [wp-masud-iii-of-ghazni]
  - key: yusuf-ibn-tashfin
    name: Yusuf ibn Tashfin
    type: Royalty
    realm: Almoravid dynasty
    house: Almoravid
    prominence: 4
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Sanhaja Berber leader of the Almoravids, who took the title Amir al-Muslimin in 1061 as the Abbasid caliph's servant. Took Fez (1075), Tangier and Oujda (1079), Tlemcen (1080), Ceuta (1083) and completed Marrakesh as his capital. Called to Spain by al-Mu'tamid of Seville, he won the Battle of az-Zallaqah (Sagrajas) on 23 October 1086, then returned in 1090 and annexed the taifas; his lieutenant took Valencia in 1102 after El Cid's death. Married Zaynab an-Nafzawiyyah; his son Ali ibn Yusuf succeeded. Reign c.1061 to 1106; no birth or death date in the article."
    sources: [wp-yusuf-ibn-tashfin]
  - key: peter-i-of-aragon
    name: Peter I of Aragon
    type: Royalty
    realm: Aragon
    house: Jiménez
    born: 1068
    born_estimated: true
    died: 1104
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "King of Aragon and Pamplona (Navarre) from 1094, eldest son of Sancho Ramírez. Subking of Sobrarbe and Ribagorza from 1085, he won the Battle of Alcoraz (1095) and took Huesca on 27 November 1095, which became his capital after his second marriage in 1097; allied with El Cid and beat the Almoravids at Bairén (1096); took Barbastro in 1100 and besieged Zaragoza in 1101. A vassal of the Pope, with whom he kept close ties. Died in the Val d'Aran and buried at San Juan de la Peña; succeeded by his half-brother Alfonso the Battler. Born c.1068 (the article's 'aged 35' puts it in 1068 or 1069)."
    sources: [wp-peter-i-of-aragon]
  - key: henry-count-of-portugal
    name: Henry, Count of Portugal
    type: Nobility
    realm: Portugal
    house: Burgundy
    born: 1066
    born_estimated: true
    died: 1112-05-22
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Henry of Burgundy, born at Dijon, youngest son of Henry and a grandson of Robert I, Duke of Burgundy. Came to Iberia to help Alfonso VI and is documented there from 1096. Married Teresa of León, the king's illegitimate daughter, around 1095; their son Afonso Henriques became Count of Portugal in 1112 and King in 1139. Styled Count of Portugal; the article gives no date for the grant (no title row). Died on 22 May 1112 of wounds from the siege of Astorga; buried at Braga Cathedral."
    sources: [wp-henry-count-of-portugal]
  - key: roger-i-of-sicily
    name: Roger I of Sicily
    type: Nobility
    realm: Sicily
    house: Hauteville
    born: 1031
    born_estimated: true
    died: 1101-06-22
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Grand Count Roger, the Norman youngest son of Tancred de Hauteville, born in Normandy. With his brother Robert Guiscard he invaded Sicily in 1061, won at Cerami (1063) and Misilmeri (1068), was invested with part of the island in 1071 and took Palermo on 10 January 1072. Took Syracuse in 1086, Agrigento in 1087 and Butera in 1090, and Malta in 1091. Won the papal apostolic legateship of Sicily in 1098; his daughter Felicia married Coloman of Hungary. Died at Mileto on 22 June 1101; his son Simon, then Roger II, succeeded under Adelaide's regency. Count, not king: the kingdom dates from 1130."
    sources: [wp-roger-i-of-sicily]
  - key: baldwin-i-of-jerusalem
    name: Baldwin I of Jerusalem
    type: Royalty
    realm: Kingdom of Jerusalem
    house: Boulogne
    died: 1118-04-02
    prominence: 4
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Youngest son of Count Eustace II of Boulogne (born in the 1060s). A leader of the First Crusade, he seized Edessa on 10 March 1098 and founded the first crusader state, then took the crown of Jerusalem on his brother Godfrey's death (18 July 1100). Crowned at Bethlehem on Christmas Day 1100 by Patriarch Daimbert. Took Arsuf and Caesarea (1101), Acre (1104), Beirut (1110) and Sidon (1111) with Genoese and Venetian help, beat the Egyptians at the third battle of Ramla (1105) and helped take Tripoli (1109). Died in March-April 1118 on a campaign against Egypt; buried beside Godfrey in the Calvary chapel of the Holy Sepulchre."
    sources: [wp-baldwin-i-of-jerusalem]
  - key: vitale-michiel-i
    name: Vitale I Michiel
    type: Nobility
    realm: Venice
    died: 1102
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "33rd traditional (31st historic) Doge of Venice, of one of the 'twelve apostolic' families, married to Felicia Cornaro. Slow to back the First Crusade, he sent 207 ships in July 1099 under his son Vitale Giovanni and Bishop Enrico Contarini; in return Venice won a tax-free quarter in every conquered city. Died in the spring of 1102 and was buried at St Mark's Basilica. The stub gives no accession date (no title row)."
    sources: [wp-vitale-michiel-i]
  - key: jayavarman-vi
    name: Jayavarman VI
    type: Royalty
    realm: Khmer Empire
    house: Mahidharapura
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "King of the Khmer Empire from about 1080 to 1107; probably a vassal prince from the Phimai area, a usurper who founded the Mahidharapura dynasty and fought supporters of the line of Harshavarman III. Credited with building the Phimai temple. Succeeded by his elder brother Dharanindravarman I; posthumous name Paramakaivalyapada. No birth or death date in the article."
    sources: [wp-jayavarman-vi]
  - key: kyansittha
    name: Kyansittha
    type: Royalty
    realm: Pagan Kingdom
    house: Pagan
    born: 1030-07-21
    died: 1112
    died_estimated: true
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "King of Pagan from 1084 (proclaimed 21 April 1084; the coronation may have been in 1086), one of the greatest Burmese kings, son of Anawrahta. As Anawrahta's general he led the conquests, was twice exiled in the 1070s-1080s for his affair with Queen Manisanda, and took the throne after putting down the Mon rebellion that killed Saw Lu. A peaceful reign: completed the Shwezigon Pagoda and built the Ananda Temple; the Myazedi inscription of 1112 is the earliest settled Burmese script. Birth (1030 or 1041) and death (1112 or 1113) disagree between chronicles."
    sources: [wp-kyansittha]
  - key: emperor-chongzong-of-western-xia
    name: Emperor Chongzong of Western Xia
    type: Royalty
    realm: Western Xia
    house: Li
    born: 1084
    died: 1139
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Li Qianshun, fourth emperor of Western Xia, who came to the throne at three in 1086 when his father Li Bingchang died. Ruled under the regency of Empress Dowager Zhaojian until a Liao envoy poisoned her in 1099. Further sinified the state, broke the power of some Tangut clans and set up a Confucian administration. Suffered Liao and Northern Song incursions and defeats from 1114. Reign 1086-1139."
    sources: [wp-emperor-chongzong-of-western-xia]
  - key: duan-zhengchun
    name: Duan Zhengchun
    type: Royalty
    realm: Dali Kingdom
    house: Duan
    prominence: 1
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Emperor Zhongzong of Dali, 15th king of Dali and first ruler of the Later Dali Kingdom, younger brother of Duan Zhengming. Gao Shengtai forced Zhengming to become a monk in 1094 and crowned himself; when Gao died in 1096 his will returned the throne to the Duan family. Reigned 1096-1108, then abdicated to become a monk; succeeded by his son Duan Yu. No birth or death date in the article."
    sources: [wp-duan-zhengchun]

titles:
  - {person: emperor-horikawa, title: Emperor of Japan, realm: Japan, from: 1087-01-03, to: 1107-08-09, note: "Acceded on his father Shirakawa's abdication on 3 January 1087; died 9 August 1107", sources: [wp-emperor-horikawa]}
  - {person: coloman-of-hungary, title: King of Hungary, realm: Hungary, from: 1095, to: 1116-02-03, note: "King from 1095 (lead); returned to Hungary at the death of Ladislaus I in July 1095 and was crowned in early 1096 at Székesfehérvár (no day). Died 3 February 1116", sources: [wp-coloman-king-of-hungary]}
  - {person: coloman-of-hungary, title: King of Croatia, realm: Croatia, from: 1097, to: 1116-02-03, note: "King of Croatia from 1097 (lead) after the invasion of that year; crowned at Biograd na Moru in 1102. How he came by the crown is disputed (see discrepancy)", sources: [wp-coloman-king-of-hungary]}
  - {person: boleslaw-iii-wrymouth, title: Duke of Poland, realm: Poland, from: 1102, to: 1138-10-28, note: "Ruled the southern half (Lesser Poland, Silesia, Sandomierz) from his father's death in 1102 and all of Poland from 1107; died 28 October 1138", sources: [wp-boleslaw-iii-wrymouth]}
  - {person: borivoj-ii-of-bohemia, title: Duke of Bohemia, realm: Bohemia, from: 1100-12-25, to: 1107, note: "First reign, 25 December 1100 to May 1107 (month only)", sources: [wp-borivoj-ii-duke-of-bohemia]}
  - {person: borivoj-ii-of-bohemia, title: Duke of Bohemia, realm: Bohemia, from: 1117, to: 1120-08-16, note: "Second reign, from December 1117 (month only), jointly with his brother Vladislaus; self-exile in Hungary after 16 August 1120", sources: [wp-borivoj-ii-duke-of-bohemia]}
  - {person: sviatopolk-ii-of-kiev, title: Grand Prince of Kiev, realm: Kievan Rus', from: 1093, to: 1113-04-16, note: "Succeeded Vsevolod in 1093; died 16 April 1113", sources: [wp-sviatopolk-ii-of-kiev]}
  - {person: eric-i-of-denmark, title: King of Denmark, realm: Denmark, from: 1095, to: 1103-07-10, note: "Elected at several landsting assemblies in 1095 after Olaf I Hunger; died at Paphos on 10 July 1103", sources: [wp-eric-i-of-denmark]}
  - {person: magnus-barefoot, title: King of Norway, realm: Norway, from: 1093, to: 1103-08-24, note: "Proclaimed in south-eastern Norway after his father Olaf Kyrre's death in September 1093; contested by his cousin Haakon Magnusson until 1095; killed 24 August 1103", sources: [wp-magnus-barefoot]}
  - {person: inge-the-elder, title: King of Sweden, realm: Sweden, from: 1080, from_estimated: true, to: 1110, to_estimated: true, note: "Enthroned under unknown circumstances shortly before 1080; driven out by Blot-Sweyn for about three years in the early 1080s (sagas) and restored. Death between c.1105 and c.1110, 'around 1110' by the article's reasoning", sources: [wp-inge-the-elder]}
  - {person: david-iv-of-georgia, title: King of Georgia, realm: Georgia, from: 1089, to: 1125-01-24, note: "King from 1089 (the article's date for the transfer of power); his father George II kept the title until about 1112 (see discrepancy). Died 24 January 1125", sources: [wp-david-iv-of-georgia]}
  - {person: al-mustali, title: Fatimid Caliph, realm: Fatimid Caliphate, from: 1094, to: 1101, note: "Placed on the throne by al-Afdal after al-Mustansir's death on 29 December 1094; died 11 or 12 December 1101", sources: [wp-al-mustali]}
  - {person: al-mustazhir, title: Abbasid Caliph, realm: Abbasid Caliphate, from: 1094-02-03, to: 1118-08-06, note: "Succeeded his father al-Muqtadi, who died on 3 February 1094; died 6 August 1118", sources: [wp-al-mustazhir]}
  - {person: barkiyaruq, title: Sultan of the Great Seljuk Empire, realm: Great Seljuk Empire, from: 1094, to: 1105, note: "The article dates his reign 1094-1105; he was crowned at Ray at thirteen after Malik-Shah I's death in November 1092 and fought for the throne in between", sources: [wp-barkiyaruq]}
  - {person: masud-iii-of-ghazni, title: Sultan, realm: Ghaznavid Empire, from: 1099, to: 1115, note: "Reign of 16 years (1099-1115)", sources: [wp-masud-iii-of-ghazni]}
  - {person: yusuf-ibn-tashfin, title: Almoravid Emir, realm: Almoravid dynasty, from: 1061, from_estimated: true, to: 1106, note: "Reigned c.1061 to 1106 (lead); took the title Amir al-Muslimin in 1061. Styled amir, not caliph, as servant of the Abbasid caliph", sources: [wp-yusuf-ibn-tashfin]}
  - {person: peter-i-of-aragon, title: King of Aragon, realm: Aragon, from: 1094, to: 1104, note: "Succeeded his father Sancho Ramírez, who died besieging Huesca in 1094; died in the Val d'Aran in 1104 (no day)", sources: [wp-peter-i-of-aragon]}
  - {person: peter-i-of-aragon, title: King of Navarre, realm: Navarre, from: 1094, to: 1104, note: "The article calls the realm Pamplona; he held it with Aragon from 1094", sources: [wp-peter-i-of-aragon]}
  - {person: roger-i-of-sicily, title: Count of Sicily, realm: Sicily, from: 1071, to: 1101-06-22, note: "Grand Count of Sicily from 1071; the Kingdom of Sicily dates from 1130 (his son Roger II was its first king); the article says he held the whole island by 1090 or 1091 (see discrepancy). Died at Mileto on 22 June 1101", sources: [wp-roger-i-of-sicily]}
  - {person: baldwin-i-of-jerusalem, title: King of Jerusalem, realm: Kingdom of Jerusalem, from: 1100-12-25, to: 1118-04-02, note: "Crowned at the Church of the Nativity, Bethlehem, on Christmas Day 1100 by Daimbert; died 2 April 1118. Before that Count of Edessa, 1098-1100 (not entered)", sources: [wp-baldwin-i-of-jerusalem]}
  - {person: jayavarman-vi, title: King of the Khmer, realm: Khmer Empire, from: 1080, from_estimated: true, to: 1107, note: "'From about 1080 to 1107' (lead); the article suggests the legitimate line may have reigned at Angkor until 1113", sources: [wp-jayavarman-vi]}
  - {person: kyansittha, title: King of Pagan, realm: Pagan Kingdom, from: 1084-04-21, to: 1112, to_estimated: true, note: "Proclaimed king on 21 April 1084 (coronation perhaps 1086); died in 1112 or 1113 after a long illness", sources: [wp-kyansittha]}
  - {person: emperor-chongzong-of-western-xia, title: Emperor of Western Xia, realm: Western Xia, from: 1086, to: 1139, note: "Came to the throne at three; under the regency of the Empress Dowager Zhaojian until 1099", sources: [wp-emperor-chongzong-of-western-xia]}
  - {person: duan-zhengchun, title: King of Dali, realm: Dali Kingdom, from: 1096, to: 1108, note: "Reigned 1096-1108; abdicated to become a monk. First ruler of the Later Dali Kingdom", sources: [wp-duan-zhengchun]}

