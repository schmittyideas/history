batch:
  title: "The world in 1100: rulers of the main states"
  requested: "One ruler for each major state on the Year-view map at 1100 (snapshot-year batch of the build-out), with a few dated events of 1085-1115"
  date: 2026-10-11

# Notes for the reviewer
# - Source: local copies of the English Wikipedia articles (wp6 directory); nothing was fetched. Line 1-3 of all 23 files were checked and each is the right article. The Barkiyaruq file is headed "Berkyaruq" (same person, key barkiyaruq); David IV's file is headed "David IV" (David the Builder, key david-iv-of-georgia). The long ones (Bolesław III, Coloman, David IV, Baldwin I, Magnus Barefoot, Roger I, Kyansittha) were read selectively (lead, accession, reign overview, death, family for parent links), not every section. Vitale Michiel I: the stub only (files Vitale_I_Michiel and Vitale_Michiel are the same text).
# - Rulers who did not rule in 1100 itself: none missing, but Bořivoj II of Bohemia took the throne on 25 December 1100 (his article), so he was the duke only at the very end of the snapshot year; Sviatopolk II, Inge, Magnus and the others all reigned through 1100. Roger I of Sicily's countship and Peter I's kingdoms are handled in the title rows.
# - New realms: Almoravid dynasty ("Almoravid Emir"), Aragon ("King of Aragon"), Navarre ("King of Navarre"), Kingdom of Jerusalem ("King of Jerusalem"). The Peter I article calls his second realm "Pamplona" (an existing realm in the database); the plan asks for Navarre, so the row uses Navarre and the note says so.
# - Title rows NOT entered (the article states no start date): Vitale Michiel I as Doge of Venice (the stub gives only his death in spring 1102 and the 1099 and 1100 fleets; no accession year) and Henry, Count of Portugal (the article says only that he appears in documents from 1096 and that he and Raymond were granted their counties "several years" before 1103; no date for the countship). Both are entered as people with notes. Also not entered: Baldwin I as Count of Edessa (10 March 1098 to 1100, realm not in the plan).
# - Roger I of Sicily and Henry: the plan wording "King of Sicily" is used for Roger even though the article calls him Grand Count of Sicily from 1071 and says the kingdom began in 1130; the title note says "styled Count" and names the real style. Henry has no title row, so the wording does not arise.
# - Title dates: Coloman's reign starts "1095" (the lead: king from 1095, crowned in early 1096, no day) and his King of Croatia row starts 1097 (the lead: king of Croatia from 1097; crowned at Biograd in 1102; see discrepancy). Al-Musta'li's reign starts 1094 (al-Mustansir died 29 December 1094; al-Afdal proclaimed him that day, per the article) and ends 1101 (death on 11 or 12 December 1101). Inge the Elder: "enthroned shortly before 1080" and "may have died around 1110" (lead c. 1105-1110): both ends estimated, and the three years of Blot-Sweyn in the early 1080s are in the note. Jayavarman VI: "from about 1080 to 1107"; start estimated. Yusuf ibn Tashfin: "reigned c. 1061 - 1106"; start estimated, end 1106 (no day). Kyansittha: proclaimed 21 April 1084; ends 1112 (estimated; the article says 1112 or 1113). Bolesław III: duke of Lesser Poland, Silesia and Sandomierz from 1102 (father died 4 June 1102) and of all Poland from 1107 (lead); one row from 1102.
# - Left out for lack of a clear dated source: the death of Yusuf ibn Tashfin as an event (the article gives only the end of his reign in 1106, no death day or place), and any death year on his person record. Eric I's article gives 10 July 1103 in the lead only. Duan Zhengchun, Jayavarman VI and Mas'ud III have very short articles: no births, places or events beyond those entered. Consorts, children and courts are not entered; links are only the direct lines to people already in the database (Shirakawa, Malik-Shah I, Anawrahta).
# - Existing records only linked: event battle-of-sagrajas-1086 (Yusuf ibn Tashfin as victor; the date 23 October 1086 agrees with his article), places jerusalem and tbilisi. Not redefined. No existing event for the capture of Jerusalem, so a new one is defined.
# - Discrepancies recorded below (8): Bolesław III's birth; Kyansittha's birth and his death year; Al-Musta'li's birth; Coloman's return to Hungary in 1095 and how he got Croatia; when David IV became sole king; when Roger I completed the conquest of Sicily. Seen and not entered: Peter I born 1068 or 1069 (the article's own arithmetic, from "aged 35"); Barkiyaruq born 1079 or 1080 (stated as a range); Magnus Barefoot's second Irish campaign 1101 or 1102 (an uncertainty inside one article); the Pacta conventa's authenticity (inside the Coloman discrepancy); who ruled Angkor until 1113 (Jayavarman VI's article says only "may have").
# - Dates: a full date only where the article gives the day. Moments take a year only (checked: every moment has an integer year). Hijri/Julian forms are not used; where an article gives a month without a day (Eric's "July 1103" in the body, Bořivoj II's "May 1107", "December 1117") the lead's day is used when there is one, otherwise the year.
# - Coordinates are from general knowledge (2-3 decimals). Vreta Abbey, the Ghazni palace, Mileto and Phimai are approximate points.
# - Size: 23 people, 24 title rows, 4 realms, 10 places, 5 events (1 link-only), 8 discrepancies, 3 links, 9 moments.

