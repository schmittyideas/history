discrepancies:
  - key: boleslaw-iii-birth
    question: When was Bolesław III Wrymouth born?
    about: [{person: boleslaw-iii-wrymouth}]
    field: born
    claims:
      - {value: "20 August 1086 (Gallus's day of King Stephen; Balzer, Maleczyński, Jasiński; the view now widely accepted)", sources: [wp-boleslaw-iii-wrymouth]}
      - {value: "26 December 1085 (Bielowski, Szafrański; Cosmas of Prague's year)", sources: [wp-boleslaw-iii-wrymouth]}
      - {value: "2 September 1085 or 1086 (Plezia)", sources: [wp-boleslaw-iii-wrymouth]}
    note: "The record uses 20 August 1086, which the article says is most widely recognised. The dispute is tied to the death date of his mother Judith (24/25 December 1085 or 24 December 1086)."
  - key: kyansittha-birth
    question: When was Kyansittha born?
    about: [{person: kyansittha}]
    field: born
    claims:
      - {value: "21 July 1030 (Zata chronicle, the most accurate for the dates of the best-known Pagan kings)", sources: [wp-kyansittha]}
      - {value: "About 1041 (if the age at death in Hmannan is right; Yazawin Thit and Hmannan put him a year younger than Saw Lu)", sources: [wp-kyansittha]}
    note: "The record uses 21 July 1030 (Zata); the article says Maha Yazawin makes him about four years older than Saw Lu."
  - key: kyansittha-death
    question: In which year did Kyansittha die?
    about: [{person: kyansittha}]
    field: died
    claims:
      - {value: "1112", sources: [wp-kyansittha]}
      - {value: "1113", sources: [wp-kyansittha]}
    note: "The article says 'either 1112 or 1113', aged 82 or 83. The record uses 1112 (estimated)."
  - key: al-mustali-birth
    question: When was al-Musta'li born?
    about: [{person: al-mustali}]
    field: born
    claims:
      - {value: "15 or 16 September 1074 (20 Muharram 467 AH)", sources: [wp-al-mustali]}
      - {value: "2 or 4 September 1075 (18 or 20 Muharram 468 AH)", sources: [wp-al-mustali]}
    note: "The record holds the year 1074, the first and fuller date in the article. Later sources confused him with an older brother of the same name born in 1060."
  - key: coloman-return-1095
    question: On what day did Coloman return to Hungary after his uncle Ladislaus I died?
    about: [{person: coloman-of-hungary}]
    field: date
    claims:
      - {value: "About 19 July 1095 (the lead)", sources: [wp-coloman-king-of-hungary]}
      - {value: "About 29 July 1095 (the body of the article)", sources: [wp-coloman-king-of-hungary]}
    note: "Both dates are in the same article. Only the year is used in the title row."
  - key: coloman-croatian-crown
    question: How did Coloman become king of Croatia?
    about: [{person: coloman-of-hungary}, {event: coloman-conquest-of-croatia-1097}]
    field: date
    claims:
      - {value: "By conquest after 1097 (Thomas the Archdeacon, 13th century)", sources: [wp-coloman-king-of-hungary]}
      - {value: "Crowned in 1102 only after a treaty with twelve leading Croatian nobles (the late 14th-century Pacta conventa, whose authenticity is debated)", sources: [wp-coloman-king-of-hungary]}
    note: "The article says Pál Engel holds that even a forged Pacta conventa agrees with reality in several respects. The record shows the 1097 conquest and the 1102 coronation."
  - key: david-iv-sole-kingship
    question: When did David IV become sole king of Georgia?
    about: [{person: david-iv-of-georgia}]
    field: date
    claims:
      - {value: "1089, by a 'palace revolution' (Asatiani) or George II's abdication under pressure; a chronicler says David was crowned by his father", sources: [wp-david-iv-of-georgia]}
      - {value: "Co-rule with George II until at least 1112, George keeping the royal title until his death (Toumanoff; surviving documents show George alive to about 1112)", sources: [wp-david-iv-of-georgia]}
      - {value: "Only on his father's death (the 18th-century tradition of Vakhushti of Kartli and Brosset)", sources: [wp-david-iv-of-georgia]}
    note: "The record uses 1089, and the article says real power had passed to David by then, a 1085 document already calling him 'king and sebastos'."
  - key: roger-i-conquest-of-sicily-complete
    question: When did Roger I finish conquering Sicily?
    about: [{person: roger-i-of-sicily}]
    field: date
    claims:
      - {value: "By 1090 (the lead)", sources: [wp-roger-i-of-sicily]}
      - {value: "1091, when Noto surrendered and 'Roger controlled the whole island' (the body; Butera fell in 1090)", sources: [wp-roger-i-of-sicily]}
    note: "Both in the same article. No event is defined for the end of the conquest."
