events:
  # --- link-only update to an existing event ---
  - key: battle-of-sagrajas-1086
    people:
      - {person: yusuf-ibn-tashfin, role: victor}
    sources: [wp-yusuf-ibn-tashfin]
  # --- new events ---
  - key: coloman-conquest-of-croatia-1097
    name: Coloman invades Croatia
    type: Conquest
    year: 1097
    people:
      - {person: coloman-of-hungary, role: victor}
    prominence: 4
    note: "Coloman invaded Croatia in 1097 and beat its last native king Petar Snačić, who died fighting at Gvozd Mountain; the Hungarians reached the Adriatic and took Biograd na Moru. He was crowned king of Croatia there in 1102, and from then Hungarian kings were also kings of Croatia. No place defined. His 1098 agreement with Venice (Conventio Amicitiae) divided the coast between them."
    sources: [wp-coloman-king-of-hungary]
  - key: capture-of-jerusalem-1099
    name: Crusaders capture Jerusalem
    type: Siege
    date: 1099-07-15
    place: jerusalem
    people:
      - {person: al-mustali, role: Fatimid caliph; lost the city}
    prominence: 5
    note: "The main army of the First Crusade took Jerusalem after a siege on 15 July 1099; a week later Godfrey of Bouillon was elected ruler but would not be crowned king. The Fatimid army under al-Afdal was beaten at Ascalon on 12 August 1099. Al-Afdal had himself recovered the city from the Artuqids in 1098."
    sources: [wp-al-mustali, wp-baldwin-i-of-jerusalem]
  - key: coronation-of-baldwin-i-1100
    name: Baldwin I crowned King of Jerusalem
    type: Coronation
    date: 1100-12-25
    place: church-of-the-nativity
    people:
      - {person: baldwin-i-of-jerusalem, role: crowned}
    prominence: 4
    note: "Patriarch Daimbert anointed and crowned Baldwin in the Church of the Nativity at Bethlehem on Christmas Day; Baldwin had left Edessa on 2 October. He took the crown that Godfrey of Bouillon had refused; thereafter he was usually styled king, the only crowned monarch in the Latin East."
    sources: [wp-baldwin-i-of-jerusalem]
  - key: peace-of-kungahalla-1101
    name: Peace of Kungahälla
    type: Treaty
    year: 1101
    people:
      - {person: magnus-barefoot, role: married the Swedish king's daughter}
      - {person: inge-the-elder, role: party}
      - {person: eric-i-of-denmark, role: mediator}
    prominence: 2
    note: "Peace between Norway and Sweden, brokered by Eric I of Denmark after Magnus's two invasions of Dalsland and Västergötland failed. Inge gave his daughter Margaret to Magnus with Dalsland as her dowry. The meeting place, Kungahälla, is named in Inge's article only. No place defined."
    sources: [wp-inge-the-elder, wp-magnus-barefoot]

