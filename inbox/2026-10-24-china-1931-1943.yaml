batch:
  title: "China's rulers 1931–1943: Lin Sen, and Chiang Kai-shek as Premier"
  requested: "Ty: the 1941 world map isn't filling in properly (China had no ruler recorded for 1931-1943)"
  date: 2026-10-24

# Notes for the reviewer
# - Lin Sen chaired the Nationalist Government between Chiang's two terms in that post (15 December 1931 – 1 August 1943, his
#   infobox), so China had no ruler in the database in those years and the Year view and its map left China blank.
# - Chiang's four terms as Premier (head of the Executive Yuan) come from his infobox's additional positions; the office is the
#   one his article links as "Premier of the Republic of China".
# - Facts read through the Wikipedia API on 2026-10-24 (Lin Sen's and Chiang Kai-shek's articles). Sitelinks and place coordinates
#   from Wikidata. Lin Sen's portrait is public domain on Commons.

sources:
  - {key: wp-lin-sen, title: "Lin Sen (Wikipedia)", url: "https://en.wikipedia.org/wiki/Lin_Sen"}
  - {key: wd-places-2026-10-24, title: "Wikidata coordinates (P625), read 2026-10-24", url: "https://www.wikidata.org/"}

