# Realm years and countries, batch 6 (#202): the thin country lists left by
# batches 1-5. These realms' own Wikipedia articles have no "Today part of"
# list, so their countries come from what the articles' text states and from
# the "Today part of" lists of their provinces' and successor states' own
# articles, each cited. Only lands the realm ruled are listed; vassals and
# tributaries are left out unless a note says otherwise. Fetched 2026-10-12.
#
# Also: years for Japan, Ireland and Pamplona, which had none, and batch 4's
# six date conflicts (Pagan, Sukhothai, Songhai, Malacca, Benin, Austria),
# written there only as comments, now recorded as realm discrepancies.

batch:
  title: "Realm years and countries, batch 6"
  requested: "Ty: fill the thin realm country lists (#202)"
  date: 2026-10-12

