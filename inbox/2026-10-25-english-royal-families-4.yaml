batch:
  title: "English royal families 4: the Stuarts, 1603-1714"
  requested: "Ty (issue #292): parents, spouses and children who reached 12 for each English monarch, James I to Anne"
  date: 2026-10-25
  notes: "Family links for James I, Charles I, Charles II, James II, William III, Mary II and Anne, with the new parents, spouses and children each citing their own Wikipedia article. No title changes."

# Notes for the reviewer
# - Already in the database, so not re-sent: James I > Charles I; Charles I > Charles II and James II; James II > Mary II and Anne;
#   William III married Mary II (1677). Henrietta Maria (`henrietta-maria`) exists; she gets only `sex` here, no titles.
# - Left out as children who died before 12 (each monarch's article or the parent's article):
#   James I: Margaret (1598-1600), Robert, Duke of Kintyre (1602), Mary (1605-1607), Sophia (1606).
#   Charles I: Charles James (1629, died within a day), Anne (1637-1640), Catherine (1639, died at birth).
#   James II: Anne Hyde's six children who died in early childhood; Mary of Modena's children other than James Francis Edward and Louisa Maria.
#   Anne: all her children died young; the longest-lived, Prince William, Duke of Gloucester (24 July 1689 - 30 July 1700), died at 11.
#   Mary II: no children (miscarriages only). William III: no legitimate children.
# - Charles II: no legitimate children with Catherine of Braganza. His article says he acknowledged at least 12 illegitimate
#   children by various mistresses (its Issue list names 14 claimed); none are added.
# - Illegitimate children of James II (by Arabella Churchill, Catherine Sedley and others) are left out.
# - Mary, Queen of Scots, is added as James I's mother only; her own reign as Queen of Scotland (title) is not in this batch.
# - Dates: Henrietta of England's birth is 16 June 1644 (Old Style, as English dates of the time); her article gives 26 June N.S. too.
#   Mary of Modena's dates are New Style (5 October 1658 - 7 May 1718), as her article leads with them.
#   Louisa Maria Stuart's death: her lead says 18 April 1712; the body says 28 April (18 April Old Style). The lead's date is used.
#   Darnley's birth: 1546 per his article ("more recent research"); 5 December 1545 was the older belief (same article, so no discrepancy entry).
#   James II married Mary of Modena by proxy on 20 September 1673 (James II's article) / 30 September 1673 (hers): the same day Old and
#   New Style, so not a discrepancy; only the year is stored.
# - Burial moments without a year where the article gives no burial date: Mary, Princess Royal (died 24 December 1660) at Westminster
#   Abbey; Elizabeth Stuart (d. 1650) at Sts Thomas Minster, Newport; Catherine of Braganza (d. 31 December 1705) at the Braganza pantheon.
# - Left out, not confirmed or no article: Henry Frederick's burial (his article only says the cortege went to Westminster Abbey);
#   William II of Orange's birth and burial places (not in his article); Mary of Modena's burial (the convent at Chaillot, no article)
#   and Louisa Maria's (the English Benedictines' church in Paris, no article). Henrietta's birthplace, Bedford House, has no article:
#   the moment uses Exeter. Louisa Maria's article says she was born "at Saint-Germain-en-Laye", where the exiled court lived in the
#   château: the moment uses the existing Château de Saint-Germain-en-Laye. Anne of Denmark was born at Skanderborg Castle, which has no article of its own: the moment uses Skanderborg.
# - Spouses of non-monarchs (Darnley-Mary, William II-Mary, Elizabeth-Frederick V, Henrietta-Philippe) are out of this batch's scope.

