batch:
  title: "English royal families 2b: Edward I, Edward II, Edward III and Richard II (1272-1399)"
  requested: "Ty (issue #292): fill in each English monarch's parents, spouses (with marriage year) and legitimate children who reached 12, with sex on the monarchs"
  date: 2026-10-25
  notes: "Family links for Edward I, Edward II, Edward III and Richard II. New people are the spouses and children with their own Wikipedia articles, with birth and burial places where the article names them. No title changes."

# Built from the English Wikipedia articles on each monarch (scratchpad copies, October 2026) and each new
# person's own article, cited per person below. Coordinates from each place article (Wikipedia coordinates).
# Edward I's parents (Henry III and Eleanor of Provence) are linked in file 2a. Edward II's marriage to
# Isabella of France (1308) is already in the database.
#
# Left out (died before 12): Edward I's Katherine (1261/1263-1264), Joan (1265), John (1266-1271), Henry (1268-1274),
#   an unnamed daughter (1271), Alphonso, Earl of Chester (1273-1284, died at 10), Berengaria (1276-1277/1278), an
#   unnamed child (1278) and Eleanor (1306-1311); Edward III's William of Hatfield (1337), Blanche (1342) and William
#   of Windsor (1348). "Thomas of Windsor" (1347) is left out too: Edward III's article calls him probably a composite.
# Left out (illegitimate): Adam FitzRoy (c. 1307-1322), son of Edward II; John Botetourt, claimed (unproven) as Edward I's son.
# Richard II had no children.
# Moments left out because the article names no place: births of Margaret of France, Eleanor Countess of Bar, Mary of
#   Woodstock and Anne of Bohemia; burials of Joan of the Tower and of Joan (died 1348) (her article: "some accounts"
#   say Bordeaux Cathedral); Eleanor of Woodstock's burial in the Franciscan church at Deventer is told as legend.
# Edmund of Woodstock was born "at Woodstock in Oxfordshire": the moment uses Woodstock Palace, as for his
#   Woodstock-born kin. He was buried first in Winchester and moved to Westminster Abbey in 1331 (the moment's year).
# Lionel of Antwerp was buried first at Pavia and later moved to Clare Priory (year not given): no year on that moment.
# Margaret, Countess of Pembroke: her article says "born in Windsor"; Edward III's article says Windsor Castle.
# John of Gaunt, Old St Paul's Cathedral: defined the same way as in batches 1a and 3a (house Lancaster), so the
#   order of applying does not matter. Edmund of Langley is house York and Edmund Crouchback house Lancaster, as
#   their articles call each the founder of that house; the other children are Plantagenet.
# Amesbury Priory is also defined in file 2a (same entry), so either file can be applied first.
# Isabella of Valois was buried in the Abbey of Saint-Laumer at Blois (no article); the moment uses Blois.
# Uncertain dates are marked estimated: Philippa of Hainault (born 24 June 1310? or as late as 1315), Margaret of
#   France (c. 1279), Joan of Kent (c. 1328), Joan (died 1348) (born 19 December 1333 or 28 January 1334).
# Months without a day become the year alone: Joan of Acre (born April 1272), Mary of Woodstock (died before 8 July
#   1332), Thomas of Brotherton (died August/September 1338), Mary of Waltham (died September 1361), Margaret
#   Countess of Pembroke (died October/December 1361), Thomas of Woodstock (died 8 or 9 September 1397), Joan of Kent
#   (died August 1385).
# John of Gaunt's birth: his article gives 6 March 1340 (Wikidata says 24 June 1340); the record uses the article.
# Not added (outside this batch's scope): the Black Prince's marriage to Joan of Kent (1361).

