discrepancies:
  - key: mary-of-woodstock-birth-year
    question: Was Mary of Woodstock born in 1278 or 1279?
    about: [{person: mary-of-woodstock}]
    field: born
    claims:
      - {value: "11 March 1279", sources: [wp-mary-of-woodstock]}
      - {value: "1278", sources: [wp-edward-i], note: "List of Edward I's children: Mary (1278-1332)"}
    note: The record uses 11 March 1279, the date her own article gives.

  - key: margaret-of-brabant-death-year
    question: Did Margaret of England, Duchess of Brabant, die in 1333 or after it?
    about: [{person: margaret-of-england-duchess-of-brabant}]
    field: died
    claims:
      - {value: "after 1333", sources: [wp-margaret-of-england-duchess-of-brabant]}
      - {value: "1333", sources: [wp-edward-i], note: "List of Edward I's children: Margaret (1275-1333)"}
    note: The record uses 1333, marked approximate.

  - key: isabella-countess-of-bedford-death-year
    question: Did Isabella, Edward III's eldest daughter, die in 1379 or 1382?
    about: [{person: isabella-countess-of-bedford}]
    field: died
    claims:
      - {value: "1379 (buried at Westminster Abbey on 4 May 1379)", sources: [wp-isabella-countess-of-bedford]}
      - {value: "c. 1382 (buried between 17 June and 5 October 1382)", sources: [wp-isabella-countess-of-bedford, wp-edward-iii]}
    note: The record uses 1382, marked approximate, as Edward III's article does.
