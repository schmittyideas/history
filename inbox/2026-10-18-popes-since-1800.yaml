# The Papacy since 1800: the 16 popes after Pius VII (already here), from Leo XII (1823) to Leo XIV, with their
# births, deaths and burials, the places those happened, and the main events of their pontificates.
# Part of "all the popes" (Ty, 2026-10-18): every pope on the Catholic Church's official list (Wikipedia's "List of
# popes", revision 1380439001), antipopes with the same title marked disputed (none in this period), and the lawful
# popes undisputed.
# VERIFIED against English Wikipedia articles downloaded on 2026-10-18 with tools/wiki.py (revision IDs in the
# session scratchpad): each pope's own article for his dates, pontificate and the facts in his note; the List of popes
# for the pontificate dates and birthplaces; the event articles for event dates; place articles and Wikidata (P625)
# for places. Sitelinks read from Wikidata on 2026-10-18.
# Conventions (as the earlier Papacy batches, inbox/2026-10-08-popes-*.yaml): type Clergy, roles [pope], realm Papacy;
# title "Pope", realm Papacy, from election to death or resignation; prominence hand-set (4 for the popes of the
# Vatican Councils and of world standing: Pius IX, Leo XIII, Pius XII, John XXIII, Paul VI, John Paul II, Benedict XVI,
# Francis; 3 for the rest).
# Stated honestly:
#  - Leo XII's birth: his article says 2 August 1760; the List of popes (and Wikidata) say 22 August. Recorded as a
#    discrepancy; the record uses his article.
#  - Death places are recorded only where the article states one (Pius VIII at the Quirinal Palace, Pius XI in the
#    Apostolic Palace, Paul VI at Castel Gandolfo, Leo XII at the Vatican, Benedict XVI at the Mater Ecclesiae
#    Monastery and Francis at the Domus Sanctae Marthae, both in Vatican City). Burials likewise; only the final
#    resting place, with the year the body was laid there where the article gives a move (Pius IX moved to San Lorenzo
#    fuori le Mura in 1881; Leo XIII to St John Lateran in 1924). Pius VIII's and Pius XII's burials are not stated in
#    their articles and are left out.
#  - San Lorenzo fuori le Mura has no coordinates on Wikidata; the coordinates are approximate (the basilica stands
#    beside the Verano cemetery).
batch:
  title: "The Papacy since 1800"
  requested: "Do we have all popes? Get them all, with the disputed ones (antipopes) marked disputed"
  date: 2026-10-18

