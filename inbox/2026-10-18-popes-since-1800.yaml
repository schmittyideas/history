people:
  - {key: leo-xii, name: Leo XII, type: Clergy, roles: [pope], born: 1760-08-02, died: 1829-02-10, realm: Papacy, prominence: 3, sitelinks: 92, sitelinks_on: 2026-10-18,
     note: "Annibale della Genga. In ill health throughout his pontificate (1823-1829); a deeply conservative ruler of the Papal States who enforced controversial laws, including one forbidding Jews to own property.",
     sources: [wp-leo-xii]}
  - {key: pius-viii, name: Pius VIII, type: Clergy, roles: [pope], born: 1761-11-20, died: 1830-11-30, realm: Papacy, prominence: 3, sitelinks: 90, sitelinks_on: 2026-10-18,
     note: "Francesco Saverio Castiglioni. His brief pontificate (1829-1830), the shortest of the 19th century, saw Catholic Emancipation in the United Kingdom, which he welcomed, and the July Revolution in France, which he accepted reluctantly.",
     sources: [wp-pius-viii]}
  - {key: gregory-xvi, name: Gregory XVI, type: Clergy, roles: [pope], born: 1765-09-18, died: 1846-06-01, realm: Papacy, prominence: 3, sitelinks: 98, sitelinks_on: 2026-10-18,
     note: "Bartolomeo Cappellari, a Camaldolese monk. A staunch defender of traditional doctrine who defended the Papal States against the Italian patriotic movements; the last pope not a bishop when elected.",
     sources: [wp-gregory-xvi]}
  - {key: pius-ix, name: Pius IX, type: Clergy, roles: [pope], born: 1792-05-13, died: 1878-02-07, realm: Papacy, prominence: 4, sitelinks: 109, sitelinks_on: 2026-10-18,
     note: "Giovanni Maria Mastai-Ferretti. The longest verified pontificate (1846-1878). Convoked the First Vatican Council, which defined papal infallibility; lost Rome to the Kingdom of Italy in 1870 and called himself a 'prisoner in the Vatican'.",
     sources: [wp-pius-ix]}
  - {key: leo-xiii, name: Leo XIII, type: Clergy, roles: [pope], born: 1810-03-02, died: 1903-07-20, realm: Papacy, prominence: 4, sitelinks: 115, sitelinks_on: 2026-10-18,
     note: "Gioacchino Pecci. Reigned 1878-1903, one of the longest pontificates; wrote 86 encyclicals, including Rerum novarum (1891) on workers' rights to a fair wage and to form trade unions, and was called the 'Social Pope'.",
     sources: [wp-leo-xiii]}
  - {key: pius-x, name: Pius X, type: Clergy, roles: [pope], born: 1835-06-02, died: 1914-08-20, realm: Papacy, prominence: 3, sitelinks: 118, sitelinks_on: 2026-10-18,
     note: "Giuseppe Sarto, born to a poor family in the Austrian Empire. Opposed modernist theology, reformed the liturgy and began the 1917 Code of Canon Law; venerated as a saint.",
     sources: [wp-pius-x]}
  - {key: benedict-xv, name: Benedict XV, type: Clergy, roles: [pope], born: 1854-11-21, died: 1922-01-22, realm: Papacy, prominence: 3, sitelinks: 113, sitelinks_on: 2026-10-18,
     note: "Giacomo della Chiesa, elected as the First World War began. Declared the Holy See neutral, called the war 'the suicide of civilized Europe' and tried to mediate peace in 1916 and 1917; both sides rejected him.",
     sources: [wp-benedict-xv]}
  - {key: pius-xi, name: Pius XI, type: Clergy, roles: [pope], born: 1857-05-31, died: 1939-02-10, realm: Papacy, prominence: 3, sitelinks: 121, sitelinks_on: 2026-10-18,
     note: "Achille Ratti. First sovereign of Vatican City (1929); concluded a record number of concordats, among them the Reichskonkordat, and wrote Quadragesimo anno on social justice.",
     sources: [wp-pius-xi]}
  - {key: pius-xii, name: Pius XII, type: Clergy, roles: [pope], born: 1876-03-02, died: 1958-10-09, realm: Papacy, prominence: 4, sitelinks: 122, sitelinks_on: 2026-10-18,
     note: "Eugenio Pacelli, a Roman and long the Vatican's chief diplomat. His pontificate (1939-1958) spanned the Second World War, the Holocaust and the early Cold War; his wartime conduct remains debated.",
     sources: [wp-pius-xii]}
  - {key: john-xxiii, name: John XXIII, type: Clergy, roles: [pope], born: 1881-11-25, died: 1963-06-03, realm: Papacy, prominence: 4, sitelinks: 137, sitelinks_on: 2026-10-18,
     note: "Angelo Roncalli, a sharecropper's son from Sotto il Monte, nuncio in France and Patriarch of Venice. Elected at 76 as an expected caretaker, he called the Second Vatican Council.",
     sources: [wp-john-xxiii]}
  - {key: paul-vi, name: Paul VI, type: Clergy, roles: [pope], born: 1897-09-26, died: 1978-08-06, realm: Papacy, prominence: 4, sitelinks: 125, sitelinks_on: 2026-10-18,
     note: "Giovanni Battista Montini, Archbishop of Milan. Continued and closed the Second Vatican Council (1965) and carried out its reforms; fostered ecumenical relations with the Orthodox and Protestant churches.",
     sources: [wp-paul-vi]}
  - {key: john-paul-i, name: John Paul I, type: Clergy, roles: [pope], born: 1912-10-17, died: 1978-09-28, realm: Papacy, prominence: 3, sitelinks: 127, sitelinks_on: 2026-10-18,
     note: "Albino Luciani. Died 33 days after his election, one of the shortest reigns in papal history; the first pope with a double name and the most recent Italian-born pope.",
     sources: [wp-john-paul-i]}
  - {key: john-paul-ii, name: John Paul II, type: Clergy, roles: [pope], born: 1920-05-18, died: 2005-04-02, realm: Papacy, prominence: 4, sitelinks: 209, sitelinks_on: 2026-10-18,
     note: "Karol Wojtyła of Wadowice, Poland: the first non-Italian pope since Adrian VI and the third longest-serving (1978-2005); a philosopher and theologian, shot in St Peter's Square in 1981.",
     sources: [wp-john-paul-ii]}
  - {key: benedict-xvi, name: Benedict XVI, type: Clergy, roles: [pope], born: 1927-04-16, died: 2022-12-31, realm: Papacy, prominence: 4, sitelinks: 200, sitelinks_on: 2026-10-18,
     note: "Joseph Ratzinger, theologian and Archbishop of Munich and Freising. Resigned in 2013, the first pope to do so since Gregory XII in 1415, and lived on as pope emeritus.",
     sources: [wp-benedict-xvi]}
  - {key: francis, name: Francis, type: Clergy, roles: [pope], born: 1936-12-17, died: 2025-04-21, realm: Papacy, prominence: 4, sitelinks: 236, sitelinks_on: 2026-10-18,
     note: "Jorge Mario Bergoglio, Archbishop of Buenos Aires: the first Jesuit pope, the first from Latin America and the first born outside Europe since Gregory III. Buried at Santa Maria Maggiore, as he wished.",
     sources: [wp-francis]}
  - {key: leo-xiv, name: Leo XIV, type: Clergy, roles: [pope], born: 1955-09-14, realm: Papacy, prominence: 3, sitelinks: 175, sitelinks_on: 2026-10-18,
     note: "Robert Francis Prevost of Chicago, an Augustinian friar, missionary and Bishop of Chiclayo in Peru, and a Peruvian citizen; prefect of the Dicastery for Bishops under Francis. The first pope born in the United States.",
     sources: [wp-leo-xiv, wp-list-of-popes]}

