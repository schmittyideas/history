events:
  - key: first-vatican-council-1869
    name: First Vatican Council
    type: Council
    date: 1869-12-08
    end_year: 1870
    place: vatican-city
    people:
      - {person: pius-ix, role: convoked it}
    prominence: 4
    note: "The 20th ecumenical council, convoked on 29 June 1868 and opened on 8 December 1869; it defined papal infallibility and was adjourned on 20 September 1870 after the capture of Rome."
    sources: [wp-first-vatican-council]
  - key: capture-of-rome-1870
    name: Capture of Rome
    type: Conquest
    date: 1870-09-20
    place: rome
    people:
      - {person: pius-ix, role: defeated}
