# Notes for the reviewer
# - First pass over the 100 museums marked `unknown`, by five research agents reading each museum's own policy, API and open-data pages (WebSearch/WebFetch, read-only; no collection pages were crawled). Date checked 2026-10-11.
# - Be careful with the open-* entries: several agents could not fetch the museum's own page (403, 404, 429, certificate errors) and fell back on search summaries; each data_notes says which. Treat `website-only` as "an online collection exists; nothing found that allows automated use" and `unknown` as "could not be read yet", not as permission. Nothing here changes how the site works.
# - A second pass is needed for the museums still `unknown`.

batch:
  title: What the museums' own pages say about reading their collections
  requested: Determine whether the museums' collections can be read, and under what terms
  date: '2026-10-11'
museums:
- key: louvre
  data_access: website-only
  collection_url: https://collections.louvre.fr/en/
  data_licence: Text/data Etalab Open Licence; images of public-domain works free for museum, scientific, educational use only, other uses paid via Rmn-GP
  data_notes: 'Terms page https://collections.louvre.fr/en/page/cgu read: text and data under Etalab Open Licence with credit; images restricted; ADAGP works barred from text and data mining; terms do not
    mention an API or automated access. No API found. Checked 2026-10-11.'
  data_checked_on: '2026-10-11'
