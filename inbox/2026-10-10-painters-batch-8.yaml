discrepancies:
- key: lorenzo-di-credi-born
  question: In what year was Lorenzo di Credi born?
  about:
  - person: lorenzo-di-credi
  field: born
  claims:
  - value: '1456'
    sources:
    - wp-lorenzo-di-credi
  - value: '1459'
    sources:
    - wp-lorenzo-di-credi
  note: Article gives 1456 or 1459 (lead 1456/59). Record holds 1456, marked estimated.
- key: sebastiano-del-piombo-died
  question: On what day in June 1547 did Sebastiano del Piombo die?
  about:
  - person: sebastiano-del-piombo
  field: died
  claims:
  - value: '1547-06-21'
    sources:
    - wp-sebastiano-del-piombo
    note: Given in the article lead.
  - value: '1547-06-14'
    sources:
    - wp-sebastiano-del-piombo
    note: Vasari's record, as quoted in the article body.
  note: Record holds 21 June, the lead's date.
- key: adriaen-brouwer-born
  question: In what year was Adriaen Brouwer born?
  about:
  - person: adriaen-brouwer
  field: born
  claims:
  - value: '1605'
    sources:
    - wp-adriaen-brouwer
  - value: '1606'
    sources:
    - wp-adriaen-brouwer
  note: Article says 1605 or 1606; record holds 1605, marked estimated.
- key: adriaen-brouwer-birthplace
  question: Where was Adriaen Brouwer born?
  about:
  - person: adriaen-brouwer
  field: place
  claims:
  - value: Oudenaarde
    sources:
    - wp-adriaen-brouwer
    note: Now generally accepted.
  - value: Haarlem
    sources:
    - wp-adriaen-brouwer
    note: Houbraken's claim, which the article calls erroneous.
  status: resolved
  resolution: Record holds Oudenaarde, as the article says it is generally accepted and Houbraken's claim is a mistake.
- key: luca-giordano-died
  question: On what day did Luca Giordano die in January 1705?
  about:
  - person: luca-giordano
  field: died
  claims:
  - value: 3 January 1705
    sources:
    - wp-luca-giordano
    note: The date the article gives in its lead; the record uses it.
  - value: 12 January 1705
    sources:
    - wp-luca-giordano
    note: The article says sources differ between these two dates.
  note: The record holds 1705-01-03.
  status: open
- key: the-sin-stuck-date
  question: When did Stuck's The Sin bring him acclaim (and so when was it painted)?
  about:
  - artwork: the-sin-stuck
  - person: franz-von-stuck
  field: date
  claims:
  - value: '1892'
    sources:
    - wp-franz-von-stuck
    note: 'Article lead: ''receiving substantial critical acclaim with The Sin in 1892''.'
  - value: '1893'
    sources:
    - wp-franz-von-stuck
    note: 'Article body: ''The next year [after 1892] he won further acclaim with ... The Sin''.'
  note: The record uses 1893, the date given in the body of the same article.
