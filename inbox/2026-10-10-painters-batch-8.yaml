- key: lorenzo-di-credi
  name: Lorenzo di Credi
  type: Artist
  roles:
  - painter
  - sculptor
  born: 1456
  born_estimated: true
  died: '1537-01-12'
  prominence: 3
  note: Italian Renaissance painter of Florence, Verrocchio's chief assistant, known for religious subjects and portraits such as La dama dei gelsomini.
  sources:
  - wp-lorenzo-di-credi
  image_url: https://upload.wikimedia.org/wikipedia/commons/a/a7/Lorenzo_di_Credi_by_Perugino.jpg
  image_thumb: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a7/Lorenzo_di_Credi_by_Perugino.jpg/500px-Lorenzo_di_Credi_by_Perugino.jpg
  image_page: https://commons.wikimedia.org/wiki/File:Lorenzo_di_Credi_by_Perugino.jpg
  image_license: Public domain
  coverage: partly
  coverage_note: Dates, place, workshop context and one dated altarpiece captured; Verrocchio and pupils not linked (not in database); full portfolio not built out.
- key: sebastiano-del-piombo
  name: Sebastiano del Piombo
  type: Artist
  roles:
  - painter
  born: 1485
  born_estimated: true
  died: '1547-06-21'
  prominence: 4
  note: Venetian-trained painter of the High Renaissance who worked in Rome from 1511, friend and ally of Michelangelo and Keeper of the Papal Seal from 1531.
  sources:
  - wp-sebastiano-del-piombo
  image_url: https://upload.wikimedia.org/wikipedia/commons/6/6d/Self_portrait%2C_after_Sebastiano_del_Piombo.jpg
  image_thumb: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6d/Self_portrait%2C_after_Sebastiano_del_Piombo.jpg/500px-Self_portrait%2C_after_Sebastiano_del_Piombo.jpg
  image_page: https://commons.wikimedia.org/wiki/File:Self_portrait,_after_Sebastiano_del_Piombo.jpg
  image_license: Public domain
  coverage: partly
  coverage_note: Dates, Venice and Rome career, Farnesina and Borgherini chapel, Raising of Lazarus captured; patrons (Chigi, Clement VII) and Bellini not linked (not in database); other works not built
    out.
- key: jacopo-bassano
  name: Jacopo Bassano
  type: Artist
  roles:
  - painter
  born: 1510
  born_estimated: true
  died: '1592-02-14'
  prominence: 4
  note: Italian Renaissance painter of the Venetian school, born and died in Bassano del Grappa, known for rustic landscapes, biblical scenes treated as genre, and early nocturnes.
  sources:
  - wp-jacopo-bassano
  image_url: https://upload.wikimedia.org/wikipedia/commons/4/48/Jacopo_da_Ponte_012.jpg
  image_thumb: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/Jacopo_da_Ponte_012.jpg/500px-Jacopo_da_Ponte_012.jpg
  image_page: https://commons.wikimedia.org/wiki/File:Jacopo_da_Ponte_012.jpg
  image_license: Public domain
  coverage: partly
  coverage_note: Dates, places, family workshop and two dated works captured; sons (Francesco the Younger, Leandro and others) not added; full portfolio not built out.
- key: federico-barocci
  name: Federico Barocci
  type: Artist
  roles:
  - painter
  - printmaker
  born: 1535
  born_estimated: true
  died: '1612-09-30'
  prominence: 4
  note: Italian Renaissance painter and printmaker of Urbino, an early pastel and oil-sketch innovator whose emotive altarpieces foreshadow the Baroque.
  sources:
  - wp-federico-barocci
  image_url: https://upload.wikimedia.org/wikipedia/commons/9/93/Federico_Barocci_-_Autoportrait.jpg
  image_thumb: https://upload.wikimedia.org/wikipedia/commons/9/93/Federico_Barocci_-_Autoportrait.jpg
  image_page: https://commons.wikimedia.org/wiki/File:Federico_Barocci_-_Autoportrait.jpg
  image_license: Public domain
  coverage: partly
  coverage_note: Dates, places, training and Visitation captured; patrons (Francesco Maria II della Rovere, Pius IV) and teachers not linked (not in database); the article's list of works is empty so portfolio
    not built out.
