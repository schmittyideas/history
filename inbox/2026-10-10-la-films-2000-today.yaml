# Los Angeles films, 2000 to today: famous films released since 2000 that were shot at places in Los Angeles a visitor can find.
# Follows inbox/2026-10-10-los-angeles-film-locations.yaml: each film is an artwork (kind: film) linked to its director
# (creator) and to the places it was shot (role: filmed). No cast, plot or posters: this is the locale database.
# Part of a "top 100 Los Angeles film locations" set; parallel batches cover before 1970 and 1970-1999.
# VERIFIED against English Wikipedia articles downloaded on 2026-10-10 with tools/wiki.py (revision IDs in the session
# scratchpad); list sections the plain-text extract drops (Union Station, Griffith Observatory, Sixth Street Viaduct,
# Los Angeles River) were read from the raw wikitext. Every film-place claim below is stated in the film's article, the
# place's article, or both (the cited sources say which). Candidates came from Wikidata "filming location" (P915), which
# for most post-2000 films only says "Los Angeles", and from the landmarks' own film lists.
# Stated honestly:
#  - The Los Angeles River reuses the place (and source) added by the before-1970 batch.
#  - Coordinates of new places are from general knowledge (the articles give none), approximate to ~3 decimals.
#  - Directors are added with life dates and one line only (coverage: not-read, "added as director of ...").
#  - Already in the database, so not repeated: Iron Man, The Soloist, (500) Days of Summer, The Artist, La La Land.
#  - Left out because the place is outside Los Angeles city: Somewhere (2010; the Chateau Marmont is in West Hollywood),
#    Lords of Dogtown (set in Venice/Santa Monica but shot in Imperial Beach), A Star Is Born's Chateau Marmont scenes.
#  - Left out because the place is gone: the old Sixth Street Viaduct (demolished 2016; Gone in 60 Seconds, Drive,
#    Furious 7 and others), the Ambassador Hotel (Catch Me If You Can, S.W.A.T.), the Spruce Goose hangar (Avatar).
#  - Left out because Wikipedia doesn't confirm a specific LA place being filmed: Drive and Gone in 60 Seconds (2000)
#    (the Los Angeles River's list says only "filmed or set" and the films' articles name no river scene), Creed III
#    (Dodger Stadium is only the story's setting), Furious 7 (Walt Disney Concert Hall "featured"), Training Day,
#    Crash, Nightcrawler, Mulholland Drive, Inception, The Social Network, Mank (filmed "in Los Angeles" only),
#    Pearl Harbor and Yes Man (named only in bare lists), Pay It Forward (studio work in LA only).
#  - Under the Silver Lake: the Hollywood Forever Cemetery is only where the story's secret concert takes place, so the
#    cemetery is not linked; the film's own list of locations is.
#  - Robert Luketic's birth date: Wikipedia 14 August 1971, Wikidata 1 November 1973. Recorded as a discrepancy.
batch:
  title: "Los Angeles films, 2000-2023"
  requested: "About 25 more famous films released 2000-today shot at specific Los Angeles places, as artworks (kind: film) linked to their directors and to the places they were filmed"
  date: 2026-10-10

