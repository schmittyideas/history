  - {person: peter-of-castile, title: King of Castile, realm: Castile, from: 1350, to: 1369-03-23, note: "Driven out by his half-brother Henry in 1366 and restored in 1367 after the Battle of Nájera", sources: [wp-peter-of-castile]}
  - {person: peter-of-castile, title: King of León, realm: León, from: 1350, to: 1369-03-23, sources: [wp-peter-of-castile]}
