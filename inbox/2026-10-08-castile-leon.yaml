discrepancies:
  - key: bermudo-iii-accession-year
    question: When did Bermudo III become king of León?
    about: [{person: bermudo-iii-of-leon}]
    field: title start
    claims:
      - {value: "1028 (king of León from 1028, per the article lead)", sources: [wp-bermudo-iii-of-leon]}
      - {value: "1027 (the History section says he succeeded to the throne in 1027)", sources: [wp-bermudo-iii-of-leon]}
    note: "The record uses 1028. Alfonso V of León is recorded as dying on 7 August 1028."
  - key: alfonso-vi-birth-year
    question: In what year was Alfonso VI born?
    about: [{person: alfonso-vi-of-leon-and-castile}]
    field: born
    claims:
      - {value: "c. 1040/1041 (article lead; birth order of the children)", sources: [wp-alfonso-vi-of-leon-and-castile]}
      - {value: "Second half of 1047 or first half of 1048 (the Chronicle of Sahagún says he died at 62)", sources: [wp-alfonso-vi-of-leon-and-castile]}
      - {value: "About 1030 (Pelagius of Oviedo says he was 79 at death), which would be before his parents' marriage", sources: [wp-alfonso-vi-of-leon-and-castile]}
    note: "The record uses c. 1040, the lead's date."
  - key: alfonso-vi-death-year
    question: When did Alfonso VI die?
    about: [{person: alfonso-vi-of-leon-and-castile}]
    field: died
    claims:
      - {value: "1 July 1109, at Toledo", sources: [wp-alfonso-vi-of-leon-and-castile]}
      - {value: "30 June or 1 July 1108 (the Urraca article's wording, which sits oddly beside its own reign start of 1109)", sources: [wp-urraca-of-leon-and-castile]}
    note: "The record uses 1 July 1109, which the Alfonso VI article gives in its lead and its Death section; the 1108 reading looks like a slip in the Urraca article, since Sancho Alfónsez died at Uclés on 29 May 1108 'shortly before'."
  - key: alfonso-ix-death-day
    question: On what day did Alfonso IX die?
    about: [{person: alfonso-ix-of-leon}]
    field: died
    claims:
      - {value: "23 September 1230", sources: [wp-alfonso-ix-of-leon]}
      - {value: "24 September 1230", sources: [wp-alfonso-ix-of-leon]}
    note: "The article's lead says '23 or 24 September' and the Death section says 24 September; the record uses 24 September."
  - key: ferdinand-iii-birth-year
    question: In what year was Ferdinand III born?
    about: [{person: ferdinand-iii-of-castile}]
    field: born
    claims:
      - {value: "1199 (or even 1198)", sources: [wp-ferdinand-iii-of-castile]}
      - {value: "Summer 1201 (more recent researchers)", sources: [wp-ferdinand-iii-of-castile]}
    note: "The record uses 1201, marked estimated. The Alfonso IX article gives '1199/1201'."
  - key: sancho-iv-birth-day
    question: On what day in May 1258 was Sancho IV born?
    about: [{person: sancho-iv-of-castile}]
    field: born
    claims:
      - {value: "12 May 1258", sources: [wp-sancho-iv-of-castile]}
      - {value: "13 May 1258", sources: [wp-alfonso-x-of-castile]}
    note: "The record uses 12 May, from Sancho IV's own article."
  - key: alfonso-xi-birth-day
    question: On what day in August 1311 was Alfonso XI born?
    about: [{person: alfonso-xi-of-castile}]
    field: born
    claims:
      - {value: "11 August 1311", sources: [wp-alfonso-xi-of-castile]}
      - {value: "13 August 1311, at Salamanca", sources: [wp-alfonso-xi-of-castile]}
    note: "Both dates are in the same article (lead and Minority section). The record uses 13 August."
  - key: alfonso-xi-death-day
    question: On what day did Alfonso XI die?
    about: [{person: alfonso-xi-of-castile}, {place: gibraltar}]
    field: died
    claims:
      - {value: "The night of 25-26 March 1350", sources: [wp-alfonso-xi-of-castile]}
      - {value: "27 March 1350, which the article calls wrong", sources: [wp-alfonso-xi-of-castile]}
    note: "The record uses 26 March."
  - key: henry-ii-reign-start
    question: When did Henry II's reign as king of Castile begin?
    about: [{person: henry-ii-of-castile}, {person: peter-of-castile}]
    field: title start
    claims:
      - {value: "1366: proclaimed king in the Abbey of Las Huelgas, Burgos", sources: [wp-henry-ii-of-castile]}
      - {value: "1368: the Cortes of Burgos recognised him as king after his return in September 1368", sources: [wp-peter-of-castile]}
      - {value: "1369: 'became king in 1369' by defeating Peter at Montiel (14 March; Peter killed 23 March)", sources: [wp-henry-ii-of-castile]}
    note: "The record uses 1369, the date the Henry II article gives for his becoming king. Peter's reign is recorded to 23 March 1369 and covers his 1366-67 ouster."
