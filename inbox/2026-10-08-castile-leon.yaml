titles:
  # Bermudo III.
  - {person: bermudo-iii-of-leon, title: King of León, realm: León, from: 1028, to: 1037-09-04, note: "A child when he succeeded; driven into Galicia by Sancho III of Pamplona in 1034, returned after Sancho's death in 1035; killed at Tamarón", sources: [wp-bermudo-iii-of-leon]}
  # Ferdinand I.
  - {person: ferdinand-i-of-leon, title: Count of Castile, realm: Castile, from: 1029, to: 1037, note: "Named count by his father Sancho III of Pamplona; the article says he was not king of Castile, as many later authors have it", sources: [wp-ferdinand-i-of-leon]}
  - {person: ferdinand-i-of-leon, title: King of León, realm: León, from: 1037-09-04, to: 1065-12-24, note: "Took León by right of his wife Sancha after killing Bermudo III at Tamarón; crowned and anointed 22 June 1038; held the title 'emperor' (first used in his own charter in 1056)", sources: [wp-ferdinand-i-of-leon]}
  # Sancho II. Castile 1065-72; crowned king of León 12 January 1072 after Golpejera, killed 7 October 1072.
  - {person: sancho-ii-of-castile, title: King of Castile, realm: Castile, from: 1065-12-24, to: 1072-10-07, note: "Received Castile under his father's will", sources: [wp-sancho-ii-of-castile, wp-ferdinand-i-of-leon]}
  - {person: sancho-ii-of-castile, title: King of León, realm: León, from: 1072-01-12, to: 1072-10-07, note: "After defeating his brother Alfonso VI at Golpejera; held all three crowns his father had divided (Castile, León, Galicia)", sources: [wp-sancho-ii-of-castile, wp-alfonso-vi-of-leon-and-castile]}
  # Alfonso VI. León 1065-72, in exile 1072 (Toledo), then León and Castile from 1072 to 1109.
  - {person: alfonso-vi-of-leon-and-castile, title: King of León, realm: León, from: 1065-12-24, to: 1072-01-12, note: "Crowned at León in January 1066; defeated by Sancho II at Golpejera on 12 January 1072 and exiled to Toledo", sources: [wp-alfonso-vi-of-leon-and-castile]}
  - {person: alfonso-vi-of-leon-and-castile, title: King of León, realm: León, from: 1072, to: 1109-07-01, note: "Regained León, and gained Castile and Galicia, after Sancho II was murdered in 1072; styled himself emperor of all Spain from 1077", sources: [wp-alfonso-vi-of-leon-and-castile, wp-sancho-ii-of-castile]}
  - {person: alfonso-vi-of-leon-and-castile, title: King of Castile, realm: Castile, from: 1072, to: 1109-07-01, sources: [wp-alfonso-vi-of-leon-and-castile]}
  # Urraca. The articles give 'from 1109'; the Alfonso VI article dates her father's death 1 July 1109.
  - {person: urraca-of-leon-and-castile, title: Queen of León, realm: León, from: 1109, to: 1126-03-08, note: "Reigned in her own right; married Alfonso I of Aragon in 1109, separated by 1110 and the marriage was annulled; civil war with him for years", sources: [wp-urraca-of-leon-and-castile]}
  - {person: urraca-of-leon-and-castile, title: Queen of Castile, realm: Castile, from: 1109, to: 1126-03-08, note: "Alfonso I of Aragon held a large part of Castile after the 1112 truce", sources: [wp-urraca-of-leon-and-castile]}
  # Alfonso VII. Crowned in León 10 March 1126; the Peace of Támara (1127) gave him Castile.
  - {person: alfonso-vii-of-leon-and-castile, title: King of León, realm: León, from: 1126, to: 1157-08-21, note: "Crowned at León on 10 March 1126; crowned 'Emperor of Spain' there 26 May 1135. At his death the realm split between his sons", sources: [wp-alfonso-vii-of-leon-and-castile]}
  - {person: alfonso-vii-of-leon-and-castile, title: King of Castile, realm: Castile, from: 1126, to: 1157-08-21, note: "Recognised in Castile by Alfonso the Battler in the Peace of Támara (1127)", sources: [wp-alfonso-vii-of-leon-and-castile]}
  # Sancho III. León went to his brother Ferdinand II (not in this batch).
  - {person: sancho-iii-of-castile, title: King of Castile, realm: Castile, from: 1157-08-21, to: 1158-08-31, note: "King of Castile and Toledo; León went to his brother Ferdinand II", sources: [wp-sancho-iii-of-castile, wp-alfonso-vii-of-leon-and-castile]}
  # Alfonso VIII.
  - {person: alfonso-viii-of-castile, title: King of Castile, realm: Castile, from: 1158-08-31, to: 1214-10-05, note: "Proclaimed king at two; the Lara and Castro families and his uncle Ferdinand II of León contested the regency", sources: [wp-alfonso-viii-of-castile, wp-sancho-iii-of-castile]}
  # Alfonso IX.
  - {person: alfonso-ix-of-leon, title: King of León, realm: León, from: 1188, to: 1230-09-24, note: "In July 1188 recognised his cousin Alfonso VIII as overlord in return for acceptance in León", sources: [wp-alfonso-ix-of-leon, wp-alfonso-viii-of-castile]}
  # Ferdinand III. Castile from 1217 (his mother Berengaria crowned him co-ruler), León from 1230.
  - {person: ferdinand-iii-of-castile, title: King of Castile, realm: Castile, from: 1217, to: 1252-05-30, note: "His mother Berengaria succeeded her brother Henry I in 1217 and quickly crowned him co-ruler", sources: [wp-ferdinand-iii-of-castile]}
  - {person: ferdinand-iii-of-castile, title: King of León, realm: León, from: 1230, to: 1252-05-30, note: "Succeeded Alfonso IX; the Treaty of Benavente (11 December 1230) paid his half-sisters; first sovereign of both kingdoms since Alfonso VII", sources: [wp-ferdinand-iii-of-castile, wp-alfonso-ix-of-leon]}
  # Alfonso X.
  - {person: alfonso-x-of-castile, title: King of Castile, realm: Castile, from: 1252-06-01, to: 1284-04-04, sources: [wp-alfonso-x-of-castile]}
  - {person: alfonso-x-of-castile, title: King of León, realm: León, from: 1252-06-01, to: 1284-04-04, sources: [wp-alfonso-x-of-castile]}
  - {person: alfonso-x-of-castile, title: King of the Germans, realm: Holy Roman Empire, from: 1257-04-01, to: 1275, disputed: true, note: "Chosen by a dissident faction of electors; his rival Richard of Cornwall was crowned at Aachen in 1257; he gave up the claim by an oral renunciation in 1275", sources: [wp-alfonso-x-of-castile]}
  # Sancho IV.
  - {person: sancho-iv-of-castile, title: King of Castile, realm: Castile, from: 1284, to: 1295-04-25, note: "Declared king by a coalition of nobles in 1282; took control when his father died in 1284; crowned at Toledo", sources: [wp-sancho-iv-of-castile, wp-alfonso-x-of-castile]}
  - {person: sancho-iv-of-castile, title: King of León, realm: León, from: 1284, to: 1295-04-25, sources: [wp-sancho-iv-of-castile]}
  # Ferdinand IV.
  - {person: ferdinand-iv-of-castile, title: King of Castile, realm: Castile, from: 1295-04-25, to: 1312-09-07, note: "Nine years old at his accession; his mother María de Molina was regent; declared of age 6 December 1301", sources: [wp-ferdinand-iv-of-castile, wp-sancho-iv-of-castile]}
  - {person: ferdinand-iv-of-castile, title: King of León, realm: León, from: 1295-04-25, to: 1312-09-07, sources: [wp-ferdinand-iv-of-castile, wp-sancho-iv-of-castile]}
  # Alfonso XI.
  - {person: alfonso-xi-of-castile, title: King of Castile, realm: Castile, from: 1312-09-07, to: 1350-03-26, note: "One year old at his accession; regencies disputed until 1313; declared of age in August 1325", sources: [wp-alfonso-xi-of-castile, wp-ferdinand-iv-of-castile]}
  - {person: alfonso-xi-of-castile, title: King of León, realm: León, from: 1312-09-07, to: 1350-03-26, sources: [wp-alfonso-xi-of-castile, wp-ferdinand-iv-of-castile]}
