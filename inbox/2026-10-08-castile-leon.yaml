places:
  - key: leon
    name: León
    kind: city
    region: Castile and León
    country: Spain
    lat: 42.599
    lng: -5.571
    visitable: true
    note: "Capital of the Leonese kingdom. Ferdinand I was crowned and anointed here on 22 June 1038, Alfonso VI in January 1066, Alfonso VII on 10 March 1126 and as Emperor of Spain in the cathedral on 26 May 1135. Defined here."
    sources: [wp-ferdinand-i-of-leon, wp-alfonso-vi-of-leon-and-castile, wp-alfonso-vii-of-leon-and-castile]
  - key: basilica-of-san-isidoro
    name: Basilica of San Isidoro
    kind: basilica
    city: León
    region: Castile and León
    country: Spain
    lat: 42.5988
    lng: -5.5693
    visitable: true
    note: "Consecrated at the end of 1063, when Ferdinand I made known his will; he died before its altar on 24 December 1065. The Cortes of León met in its cloisters in 1188."
    sources: [wp-alfonso-vi-of-leon-and-castile, wp-ferdinand-i-of-leon, wp-alfonso-ix-of-leon]
  - key: tamaron-battlefield
    name: Tamarón battlefield
    kind: battlefield
    region: Burgos
    country: Spain
    lat: 42.39
    lng: -4.03
    note: "Where Ferdinand I killed Bermudo III on 4 September 1037. Site approximate."
    sources: [wp-ferdinand-i-of-leon, wp-bermudo-iii-of-leon]
  - key: zamora
    name: Zamora
    kind: city
    region: Zamora
    country: Spain
    lat: 41.503
    lng: -5.744
    visitable: true
    note: "Birthplace of Sancho II and of Alfonso IX; the city of Urraca, daughter of Ferdinand I, besieged by Sancho II in 1072."
    sources: [wp-sancho-ii-of-castile, wp-alfonso-ix-of-leon]
  - key: toledo
    name: Toledo
    kind: city
    region: Toledo
    country: Spain
    lat: 39.862
    lng: -4.027
    visitable: true
    note: "Taken by Alfonso VI on 25 May 1085; he died here on 1 July 1109. Birthplace of Alfonso X; Sancho IV died here on 25 April 1295 and Henry III on 25 December 1406; Sancho III was buried here in 1158. Defined here."
    sources: [wp-alfonso-vi-of-leon-and-castile, wp-alfonso-x-of-castile, wp-sancho-iv-of-castile, wp-henry-iii-of-castile]
  - key: toledo-cathedral
    name: Toledo Cathedral
    kind: cathedral
    city: Toledo
    region: Toledo
    country: Spain
    lat: 39.8573
    lng: -4.0239
    visitable: true
    note: "Burial place of Sancho IV and, in the Chapel of the New Monarchs, of Henry II, John I and Henry III."
    sources: [wp-ferdinand-iv-of-castile, wp-henry-ii-of-castile, wp-john-i-of-castile, wp-henry-iii-of-castile]
  - key: sagrajas-battlefield
    name: Sagrajas battlefield
    kind: battlefield
    region: Badajoz
    country: Spain
    lat: 38.88
    lng: -6.99
    historical_name: "Battle of Sagrajas (az-Zallaqa)"
    note: "Where the Almoravids defeated Alfonso VI on 23 October 1086, in Extremadura near Badajoz. Site approximate."
    sources: [wp-alfonso-vi-of-leon-and-castile]
  - key: san-benito-sahagun
    name: Royal Monastery of San Benito, Sahagún
    kind: monastery
    city: Sahagún
    region: León
    country: Spain
    lat: 42.371
    lng: -5.03
    note: "Burial place of Alfonso VI. His tomb was destroyed in the fire of 1810; his remains are now in the Benedictine nuns' monastery of Sahagún. The monastery was dissolved in 1835."
    sources: [wp-alfonso-vi-of-leon-and-castile]
  - key: san-salvador-de-ona
    name: Monastery of San Salvador de Oña
    kind: monastery
    city: Oña
    region: Burgos
    country: Spain
    lat: 42.735
    lng: -3.415
    note: "Burial place of Sancho II."
    sources: [wp-sancho-ii-of-castile]
  - key: las-navas-de-tolosa-battlefield
    name: Las Navas de Tolosa battlefield
    kind: battlefield
    region: Jaén
    country: Spain
    lat: 38.35
    lng: -3.55
    note: "Near Santa Elena. Where the Christian coalition under Alfonso VIII defeated the Almohad caliph on 16 July 1212. Site approximate."
    sources: [wp-alfonso-viii-of-castile]
  - key: cordoba
    name: Córdoba
    kind: city
    region: Córdoba
    country: Spain
    lat: 37.888
    lng: -4.779
    visitable: true
    note: "Old Umayyad capital, taken by Ferdinand III in 1236. Defined here."
    sources: [wp-ferdinand-iii-of-castile]
  - key: mosque-cathedral-of-cordoba
    name: Mosque-Cathedral of Córdoba
    kind: mosque-cathedral
    city: Córdoba
    region: Córdoba
    country: Spain
    lat: 37.879
    lng: -4.780
    visitable: true
    note: "Ferdinand IV was buried in a chapel here on 13 September 1312; in 1371 he and Alfonso XI were placed in its Royal Chapel, and in 1736 moved to the Collegiate Church of Saint Hippolytus, Córdoba."
    sources: [wp-ferdinand-iv-of-castile]
  - key: seville
    name: Seville
    kind: city
    region: Seville
    country: Spain
    lat: 37.389
    lng: -5.984
    visitable: true
    note: "Entered by Ferdinand III as conqueror on 22 December 1248; Alfonso X died here in 1284. Defined here."
    sources: [wp-ferdinand-iii-of-castile, wp-alfonso-x-of-castile]
  - key: seville-cathedral
    name: Seville Cathedral
    kind: cathedral
    city: Seville
    region: Seville
    country: Spain
    lat: 37.386
    lng: -5.993
    visitable: true
    note: "Ferdinand III was buried here on 1 June 1252 and his body is still on view; Ferdinand IV was baptised here."
    sources: [wp-ferdinand-iii-of-castile, wp-ferdinand-iv-of-castile]
  - key: gibraltar
    name: Gibraltar
    kind: fortress city
    country: Gibraltar
    lat: 36.14
    lng: -5.353
    visitable: true
    note: "Capitulated to Ferdinand IV's forces on 12 September 1309; Alfonso XI died of the plague during its siege in 1350. Defined here."
    sources: [wp-ferdinand-iv-of-castile, wp-alfonso-xi-of-castile]
  - key: montiel-castle
    name: Montiel castle
    kind: castle
    city: Montiel
    region: Ciudad Real
    country: Spain
    lat: 38.70
    lng: -2.87
    note: "Fortress of the Order of Santiago where Peter took refuge after losing to Henry on 14 March 1369; he was killed in du Guesclin's tent on the night of 23 March. Site approximate."
    sources: [wp-peter-of-castile, wp-henry-ii-of-castile]
  - key: najera
    name: Nájera
    kind: town
    region: La Rioja
    country: Spain
    lat: 42.416
    lng: -2.730
    note: "Where Peter, backed by the Black Prince, defeated Henry on 3 April 1367; Henry was also held prisoner here in 1360."
    sources: [wp-henry-ii-of-castile, wp-peter-of-castile]
  - key: aljubarrota-battlefield
    name: Aljubarrota battlefield
    kind: battlefield
    region: Leiria
    country: Portugal
    lat: 39.568
    lng: -8.824
    note: "Where John I of Castile was defeated by John of Aviz on 14 August 1385."
    sources: [wp-john-i-of-castile]
  - key: granada
    name: Granada
    kind: city
    region: Granada
    country: Spain
    lat: 37.177
    lng: -3.599
    visitable: true
    note: "Last Muslim city of Iberia; Isabella and Ferdinand entered it on 2 January 1492. Defined here."
    sources: [wp-isabella-i-of-castile]
  - key: capilla-real-granada
    name: Royal Chapel of Granada
    kind: chapel
    city: Granada
    region: Granada
    country: Spain
    lat: 37.1766
    lng: -3.5988
    visitable: true
    built_by: "Charles V, Holy Roman Emperor, her grandson"
    note: "Isabella I is entombed here with Ferdinand and their daughter Joanna; the museum next door holds her crown and sceptre."
    sources: [wp-isabella-i-of-castile]
  - key: medina-del-campo
    name: Medina del Campo
    kind: town
    region: Valladolid
    country: Spain
    lat: 41.311
    lng: -4.913
    note: "Isabella I died at the Royal Palace here on 26 November 1504; the Granada War is dated from the monarchs' arrival here on 1 February 1482."
    sources: [wp-isabella-i-of-castile]
  - key: madrigal-de-las-altas-torres
    name: Madrigal de las Altas Torres
    kind: town
    region: Ávila
    country: Spain
    lat: 41.088
    lng: -4.998
    note: "Birthplace of Isabella I, 22 April 1451."
    sources: [wp-isabella-i-of-castile]
  - key: las-huelgas-burgos
    name: Monasterio de Santa María la Real de Las Huelgas
    kind: abbey
    city: Burgos
    region: Burgos
    country: Spain
    lat: 42.336
    lng: -3.719
    visitable: true
    note: "Peter the Cruel was born in the defensive tower here in 1334, and Henry II was proclaimed king in the abbey in 1366."
    sources: [wp-peter-of-castile, wp-henry-ii-of-castile]
  - key: valladolid
    name: Valladolid
    kind: city
    region: Valladolid
    country: Spain
    lat: 41.652
    lng: -4.724
    visitable: true
    note: "Birthplace of Henry IV (1425) and place of death of John II (1454); Isabella married Ferdinand of Aragon here on 19 October 1469, in the Palacio de los Vivero. Defined here."
    sources: [wp-henry-iv-of-castile, wp-john-ii-of-castile, wp-isabella-i-of-castile]
  - key: alcazar-of-segovia
    name: Alcázar of Segovia
    kind: castle
    city: Segovia
    region: Segovia
    country: Spain
    lat: 40.9546
    lng: -4.1318
    visitable: true
    note: "Alfonso VIII and Eleanor were the first to make it their residence; John II built the 'New Tower' (Tower of John II); Isabella took refuge here in December 1474 and was proclaimed queen the next day."
    sources: [wp-alfonso-viii-of-castile, wp-john-ii-of-castile, wp-isabella-i-of-castile]
  - key: jaen
    name: Jaén
    kind: city
    region: Jaén
    country: Spain
    lat: 37.779
    lng: -3.785
    visitable: true
    note: "Ferdinand IV died here on 7 September 1312."
    sources: [wp-ferdinand-iv-of-castile]

events:
  - key: battle-of-tamaron-1037
    name: Battle of Tamarón
    type: Battle
    date: 1037-09-04
    place: tamaron-battlefield
    people: [{person: ferdinand-i-of-leon, role: victor}, {person: bermudo-iii-of-leon, role: killed}]
    prominence: 3
    note: "Fought over the lands between the Cea and the Pisuerga; Ferdinand's victory over his brother-in-law gave him León."
    sources: [wp-ferdinand-i-of-leon, wp-bermudo-iii-of-leon]
  - key: coronation-of-ferdinand-i-1038
    name: Coronation of Ferdinand I as king of León
    type: Coronation
    date: 1038-06-22
    place: leon
    people: [{person: ferdinand-i-of-leon, role: crowned}]
    prominence: 3
    note: "Crowned and anointed king in León."
    sources: [wp-ferdinand-i-of-leon, wp-bermudo-iii-of-leon]
  - key: siege-of-zamora-1072
    name: Siege of Zamora and death of Sancho II
    type: Siege
    year: 1072
    place: zamora
    people: [{person: sancho-ii-of-castile, role: killed}, {person: alfonso-vi-of-leon-and-castile, role: heir}]
    prominence: 3
    note: "Sancho II besieged his sister Urraca's city; the Zamoran noble Vellido Dolfos killed him (7 October 1072, per the Sancho II article). Alfonso VI, in exile, took his brother's kingdoms."
    sources: [wp-sancho-ii-of-castile, wp-alfonso-vi-of-leon-and-castile]
  - key: conquest-of-toledo-1085
    name: Conquest of Toledo
    type: Siege
    date: 1085-05-25
    place: toledo
    people: [{person: alfonso-vi-of-leon-and-castile, role: conqueror}]
    prominence: 4
    note: "Alfonso VI took the taifa capital after besieging it; he took the title 'King of Toledo'. The conquest provoked the Almoravid invasion."
    sources: [wp-alfonso-vi-of-leon-and-castile]
  - key: battle-of-sagrajas-1086
    name: Battle of Sagrajas
    type: Battle
    date: 1086-10-23
    place: sagrajas-battlefield
    people: [{person: alfonso-vi-of-leon-and-castile, role: defeated}]
    prominence: 3
    note: "The Almoravid army and the taifa troops beat Alfonso VI's forces; the start of three decades of Almoravid initiative."
    sources: [wp-alfonso-vi-of-leon-and-castile]
  - key: coronation-of-alfonso-vii-as-emperor-1135
    name: Alfonso VII crowned Emperor of Spain
    type: Coronation
    date: 1135-05-26
    place: leon
    people: [{person: alfonso-vii-of-leon-and-castile, role: crowned}]
    prominence: 3
    note: "In the cathedral of León, to assert his authority over the whole peninsula and leadership of the Reconquista."
    sources: [wp-alfonso-vii-of-leon-and-castile]
  - key: cortes-of-leon-1188
    name: Cortes of León
    type: Assembly
    year: 1188
    place: basilica-of-san-isidoro
    people: [{person: alfonso-ix-of-leon, role: summoned}]
    prominence: 4
    note: "Alfonso IX called nobles, clergy and city representatives, described as the fullest citizen representation in Western Europe at the time; held in the cloisters of San Isidoro."
    sources: [wp-alfonso-ix-of-leon]
  - key: battle-of-alarcos-1195
    name: Battle of Alarcos
    type: Battle
    year: 1195
    people: [{person: alfonso-viii-of-castile, role: defeated}]
    prominence: 3
    note: "Alfonso VIII was roundly defeated by the Almohad caliph Abu Yusuf Yaqub al-Mansur; Calatrava fell first and the frontier held near Toledo for 17 years. Day not given in the article."
    sources: [wp-alfonso-viii-of-castile]
  - key: battle-of-las-navas-de-tolosa-1212
    name: Battle of Las Navas de Tolosa
    type: Battle
    date: 1212-07-16
    place: las-navas-de-tolosa-battlefield
    people: [{person: alfonso-viii-of-castile, role: victor}]
    prominence: 5
    note: "A crusade called through Pope Innocent III: Castilians, Aragonese and Catalans under Peter II, Navarrese under Sancho VII and Franks. The caliph Muhammad al-Nasir was routed and Almohad power broken."
    sources: [wp-alfonso-viii-of-castile]
  - key: founding-of-university-of-salamanca-1218
    name: Founding of the University of Salamanca
    type: Foundation
    year: 1218
    people: [{person: alfonso-ix-of-leon, role: founder}]
    prominence: 3
    note: "Alfonso IX founded it in 1218; Ferdinand III later strengthened it."
    sources: [wp-alfonso-ix-of-leon, wp-ferdinand-iii-of-castile]
  - key: union-of-leon-and-castile-1230
    name: Treaty of Benavente and union of León and Castile
    type: Treaty
    date: 1230-12-11
    people: [{person: ferdinand-iii-of-castile, role: king}, {person: alfonso-ix-of-leon, role: predecessor}]
    prominence: 4
    note: "After Alfonso IX's will left León to his daughters Sancha and Dulce, a treaty negotiated by their mothers gave Ferdinand III León for compensation to his half-sisters; the crowns were united for good."
    sources: [wp-ferdinand-iii-of-castile, wp-alfonso-ix-of-leon]
  - key: capture-of-cordoba-1236
    name: Capture of Córdoba
    type: Siege
    year: 1236
    place: cordoba
    people: [{person: ferdinand-iii-of-castile, role: conqueror}]
    prominence: 4
    note: "Ferdinand arrived with a royal army to take the Medina; Pope Gregory IX hailed him 'athleta Christi'. Day not given in the article."
    sources: [wp-ferdinand-iii-of-castile]
  - key: capture-of-seville-1248
    name: Capture of Seville
    type: Siege
    date: 1248-12-22
    place: seville
    people: [{person: ferdinand-iii-of-castile, role: conqueror}]
    prominence: 4
    note: "Ferdinand entered the greatest city of al-Andalus as conqueror; only the Emirate of Granada remained."
    sources: [wp-ferdinand-iii-of-castile]
  - key: election-of-alfonso-x-as-king-of-germany-1257
    name: Alfonso X chosen king of Germany
    type: Election
    date: 1257-04-01
    people: [{person: alfonso-x-of-castile, role: elected}]
    prominence: 3
    note: "A dissident faction of electors chose him through his Hohenstaufen descent; he never went to Germany and renounced the claim in 1275."
    sources: [wp-alfonso-x-of-castile]
  - key: capture-of-gibraltar-1309
    name: Capture of Gibraltar
    type: Siege
    date: 1309-09-12
    place: gibraltar
    people: [{person: ferdinand-iv-of-castile, role: king}]
    prominence: 3
    note: "Taken during Ferdinand IV's campaign while he failed to take Algeciras."
    sources: [wp-ferdinand-iv-of-castile]
  - key: battle-of-rio-salado-1340
    name: Battle of Río Salado
    type: Battle
    year: 1340
    people: [{person: alfonso-xi-of-castile, role: victor}]
    prominence: 4
    note: "Alfonso XI beat the last great Marinid invasion of the peninsula. Day and place not given in the article."
    sources: [wp-alfonso-xi-of-castile]
  - key: battle-of-najera-1367
    name: Battle of Nájera
    type: Battle
    date: 1367-04-03
    place: najera
    people: [{person: peter-of-castile, role: victor}, {person: henry-ii-of-castile, role: defeated}]
    prominence: 3
    note: "An Anglo-Gascon army under the Black Prince and John of Gaunt restored Peter; the Black Prince fell ill and the two parted over the cost."
    sources: [wp-henry-ii-of-castile, wp-peter-of-castile]
  - key: battle-of-montiel-1369
    name: Battle of Montiel and death of Peter the Cruel
    type: Battle
    date: 1369-03-14
    place: montiel-castle
    people: [{person: henry-ii-of-castile, role: victor}, {person: peter-of-castile, role: defeated and killed}]
    prominence: 4
    note: "Henry, helped by Bertrand du Guesclin, beat Peter on 14 March; Peter was lured into du Guesclin's tent and killed by Henry on the night of 23 March 1369."
    sources: [wp-henry-ii-of-castile, wp-peter-of-castile]
  - key: battle-of-aljubarrota-1385
    name: Battle of Aljubarrota
    type: Battle
    date: 1385-08-14
    place: aljubarrota-battlefield
    people: [{person: john-i-of-castile, role: defeated}]
    prominence: 4
    note: "John I's attempt to rule Portugal through his wife Beatrice ended; John of Aviz became uncontested king and Portugal stayed independent."
    sources: [wp-john-i-of-castile]
  - key: treaty-of-toros-de-guisando-1468
    name: Treaty of Toros de Guisando
    type: Treaty
    date: 1468-09-19
    people: [{person: isabella-i-of-castile, role: named heir}, {person: henry-iv-of-castile, role: king}]
    prominence: 3
    note: "Henry IV named Isabella heir presumptive instead of his daughter Joanna; she could not be forced to marry against her will."
    sources: [wp-isabella-i-of-castile, wp-henry-iv-of-castile]
  - key: marriage-of-isabella-and-ferdinand-1469
    name: Marriage of Isabella and Ferdinand of Aragon
    type: Marriage
    date: 1469-10-19
    place: valladolid
    people: [{person: isabella-i-of-castile, role: bride}]
    prominence: 4
    note: "Betrothed 18 October 1469 without Henry IV's knowledge; married next day in the Palacio de los Vivero, with a papal dispensation that was in fact forged."
    sources: [wp-isabella-i-of-castile]
  - key: battle-of-toro-1476
    name: Battle of Toro
    type: Battle
    date: 1476-03-01
    people: [{person: isabella-i-of-castile, role: victorious claimant}]
    prominence: 3
    note: "Indecisive on the field, but a political victory for Isabella and Ferdinand: Joanna's party broke up and Afonso V's Portuguese army left Castile."
    sources: [wp-isabella-i-of-castile]
  - key: treaty-of-alcacovas-1479
    name: Treaty of Alcáçovas
    type: Treaty
    date: 1479-09-04
    people: [{person: isabella-i-of-castile, role: signatory}]
    prominence: 3
    note: "Portugal gave up the Castilian throne for most Atlantic territories (the Canary Islands stayed Castilian); ended the War of the Castilian Succession."
    sources: [wp-isabella-i-of-castile]
  - key: fall-of-granada-1492
    name: Fall of Granada
    type: Conquest
    date: 1492-01-02
    place: granada
    people: [{person: isabella-i-of-castile, role: conqueror}]
    prominence: 5
    note: "Muhammad XI surrendered at the end of 1491 after a siege begun in spring 1491; the monarchs entered on 2 January 1492. The end of the Reconquista."
    sources: [wp-isabella-i-of-castile]
  - key: alhambra-decree-1492
    name: Alhambra Decree
    type: Edict
    date: 1492-03-31
    people: [{person: isabella-i-of-castile, role: issuer}]
    prominence: 4
    note: "Expelled the Jews of Spain; they had until the end of July to leave. Isabella opposed harsh measures on economic grounds but Torquemada persuaded Ferdinand."
    sources: [wp-isabella-i-of-castile]
  - key: columbus-first-voyage-1492
    name: First voyage of Columbus
    type: Exploration
    date: 1492-08-03
    end_year: 1492
    people: [{person: isabella-i-of-castile, role: sponsor}]
    prominence: 5
    note: "Departed 3 August 1492 and reached the New World on 12 October; Isabella agreed to sponsor it three months after entering Granada."
    sources: [wp-isabella-i-of-castile]

