batch:
  title: "The kings and queens of León and Castile, 1028-1504"
  requested: "Bermudo III through Isabella I: lives, reigns, the 1072/1126/1157/1230 partitions and reunions, battles, treaties, places"
  date: 2026-10-08

# Notes for the reviewer
# - Source: local copies of the English Wikipedia articles for the 21 rulers. Nothing was fetched. Bermudo III is linked as the son of the existing alfonso-v-of-leon (a parent link only; Alfonso V is not changed).
# - Titles: "King of León" (realm León, existing) and "King of Castile" (realm Castile, NEW in this file, Western Europe / Spain). A monarch ruling both has two rows. Women ruling in their own right are "Queen of León" / "Queen of Castile" (Urraca, Isabella I). Reunions are separate rows: Sancho II (Castile 1065-72, León 12 Jan-7 Oct 1072), Alfonso VI (León 1065-72 and again 1072-1109, Castile 1072-1109), Alfonso VII (both from 1126, to 1157), Ferdinand III (Castile 1217, León 1230).
# - Ferdinand I: the article says he was Count of Castile 1029-1037 and NOT king of Castile, "as many later authors have it". So he has "Count of Castile" (realm Castile) for 1029-1037 and "King of León" 1037-1065. The article does not call him king of Castile, so no King of Castile row.
# - Isabella I: the title note records that she reigned jointly with Ferdinand II of Aragon (the Catholic Monarchs) and was queen consort of Aragon from 1479. Ferdinand of Aragon is not added (Aragon is out of scope).
# - Alfonso X: also given a disputed "King of the Germans" row (realm Holy Roman Empire, 1 April 1257 to his oral renunciation in 1275). If the Holy Roman Empire batch sends the same person/title the keys match and merge.
# - Galicia: NOT added. Several articles give Galicia dates (Sancho II 1071-72, Alfonso VI 1071-1109, Alfonso VII from 1111, Urraca, Ferdinand III from 1231) but I did not add the realm Galicia, to stay near the row limit. Say so if you want a Galicia pass.
# - Not in this batch (not requested), so gaps in the timeline: Ferdinand II of León (1157-1188), Henry I of Castile (1214-1217), Berengaria of Castile (briefly queen in 1217), García II of Galicia, Eleanor of England (Alfonso VIII's queen, daughter of Henry II and Eleanor of Aquitaine), Sancha of León (Ferdinand I's queen). They are mentioned in notes only.
# - Siete Partidas: the Alfonso X article gives no date for it (it was begun in his reign and promulgated by his great-grandson), so there is no event. It is in his person note. Same for the Alfonsine tables, Cantigas de Santa Maria and the Mesta (1273, in the article; left to the note).
# - Left out because the article gives no day or no year: Alfonso X's Jerez capture (1261, no day), Sancho IV's coronation at Toledo (1284, no day), Ferdinand IV's Treaty of Alcañices (1297, in the article as 13 September for the prelates only), Alfonso XI's self-coronation (1332; the article does not say where), Henry IV's Farce of Ávila (no year in his article; Isabella's gives June 1465 for the civil war), Alfonso VI's Uclés defeat (29 May 1108) and Alfonso VII's Almería capture (October 1147) (no place defined; left out for size).
# - Death and birth places left out (not in the article, or the place is not defined here): Alfonso IX (death place), Ferdinand III (birth Monastery of Valparaíso, death place), Alfonso VII (death at Las Fresnedas), Alfonso VIII (birth Soria, death Gutierre-Muñoz), Urraca (death at the castle of Saldaña, birth place disputed), Ferdinand IV (birth Alcázar de San Juan), Henry II (death Santo Domingo de la Calzada), John I (death at Alcalá de Henares), Henry IV (burial at Santa María de Guadalupe; death at Madrid), Henry III (birth Burgos), Alfonso XI (burial: the article does not say where he was first buried; his remains are with Ferdinand IV, see Ferdinand IV's burial).
# - Dates: where one article gives only a year I used the year. A few title dates are taken from the predecessor's death date in another article of this batch (cited in sources), e.g. Alfonso VIII from 31 August 1158 (death of Sancho III).
# - Coordinates are from general knowledge (2-3 decimals); battlefield and monastery points (Tamarón, Sagrajas, Las Navas de Tolosa, Aljubarrota, Montiel, Oña, Sahagún) are approximate. The "visitable" flags are also general knowledge, not from the articles.
# - Shared keys defined here (other batches may send the same key): toledo, seville, cordoba, granada, valladolid, leon, gibraltar, battle-of-aljubarrota-1385, battle-of-najera-1367, battle-of-montiel-1369 (the Hundred Years' War and England batches may also want these).
# - Size: 21 people, 40 title rows, 1 realm, 26 places, 26 events (about 114 rows), over the 100 target; if it must be split, cut at Alfonso X (1252) or at John II (1406).
# - Discrepancies recorded below: Bermudo III's accession year; Alfonso VI's birth year and death year; Alfonso IX's death day; Ferdinand III's birth year; Sancho IV's birth day; Alfonso XI's birth day and death day; Henry II's start of reign. Seen and not entered: Urraca's birthplace (León, per the lead, versus "unknown, likely Sahagún or León"); the Agnes of Aquitaine annulment (Alfonso VI article).

