  - {person: henry-ii-of-castile, title: King of León, realm: León, from: 1369, to: 1379-05-29, sources: [wp-henry-ii-of-castile]}
  # John I.
  - {person: john-i-of-castile, title: King of Castile, realm: Castile, from: 1379-05-29, to: 1390-10-09, sources: [wp-john-i-of-castile, wp-henry-ii-of-castile]}
  - {person: john-i-of-castile, title: King of León, realm: León, from: 1379-05-29, to: 1390-10-09, sources: [wp-john-i-of-castile, wp-henry-ii-of-castile]}
  # Henry III.
  - {person: henry-iii-of-castile, title: King of Castile, realm: Castile, from: 1390-10-09, to: 1406-12-25, note: "A minor when he succeeded; assumed power on 2 August 1393 aged 13", sources: [wp-henry-iii-of-castile, wp-john-i-of-castile]}
  - {person: henry-iii-of-castile, title: King of León, realm: León, from: 1390-10-09, to: 1406-12-25, sources: [wp-henry-iii-of-castile, wp-john-i-of-castile]}
  # John II.
  - {person: john-ii-of-castile, title: King of Castile, realm: Castile, from: 1406-12-25, to: 1454-07-20, note: "Regency of his mother Catherine of Lancaster and uncle Ferdinand I of Aragon (to 1416), then Catherine alone to 1418", sources: [wp-john-ii-of-castile, wp-henry-iii-of-castile]}
  - {person: john-ii-of-castile, title: King of León, realm: León, from: 1406-12-25, to: 1454-07-20, sources: [wp-john-ii-of-castile]}
  # Henry IV.
  - {person: henry-iv-of-castile, title: King of Castile, realm: Castile, from: 1454-07-21, to: 1474-12-11, note: "Proclaimed king the day after his father's death", sources: [wp-henry-iv-of-castile]}
