# The Papacy, 498-599 (Ostrogothic Italy and the start of the Byzantine Papacy): the 14 popes of the century not yet
# here, from Hormisdas to Gregory I the Great, and the antipopes Laurentius (498) and Dioscorus (530).
# Conventions and checks as the earlier Papacy batches (inbox/2026-10-18-popes-*.yaml). Birth and death dates come from
# each article's lead; where Wikidata gives a different full date it is recorded as a discrepancy (mostly a few days
# apart, often the burial rather than the death), the record using the article.
# Stated honestly: birthplaces that are regions or kingdoms (Samnium, the Ostrogothic Kingdom) or unidentified
# (Cicanum) are left in the notes.
batch:
  title: "The Papacy, 498-599"
  requested: "Do we have all popes? Get them all, with the disputed ones (antipopes) marked disputed"
  date: 2026-10-18

