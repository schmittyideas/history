people:
  - {key: hormisdas, name: "Hormisdas", type: Clergy, roles: [pope], born: 450, born_estimated: true, died: 0523-08-06, realm: Papacy, prominence: 2, sitelinks: 81, sitelinks_on: 2026-10-18,
     note: "Ended the Acacian schism with Constantinople: the reunion was ratified in Constantinople's cathedral on 28 March 519. Father of Pope Silverius. A saint.",
     sources: [wp-hormisdas]}
  - {key: john-i, name: "John I", type: Clergy, roles: [pope], died: 0526-05-18, realm: Papacy, prominence: 2, sitelinks: 80, sitelinks_on: 2026-10-18,
     note: "Of Siena; with the monk Dionysius Exiguus he standardised the Western reckoning of Easter (525). Sent by the Arian king Theoderic to Constantinople, he was arrested on his return and died in prison at Ravenna. A saint.",
     sources: [wp-john-i]}
  - {key: felix-iv, name: "Felix IV", type: Clergy, roles: [pope], born: 489, born_estimated: true, died: 0530-09-22, realm: Papacy, prominence: 1, sitelinks: 79, sitelinks_on: 2026-10-18,
     note: "The candidate of Theoderic the Great, who had imprisoned John I; built Santi Cosma e Damiano. Sometimes numbered Felix III. A saint.",
     sources: [wp-felix-iv]}
  - {key: boniface-ii, name: "Boniface II", type: Clergy, roles: [pope], died: 0532-10-17, realm: Papacy, prominence: 1, sitelinks: 79, sitelinks_on: 2026-10-18,
     note: "An Ostrogoth, the first Germanic pope (530-532), chosen by Felix IV over the majority's candidate Dioscorus.",
     sources: [wp-boniface-ii]}
  - {key: john-ii, name: "John II", type: Clergy, roles: [pope], born: 475, born_estimated: true, died: 0535-05-08, realm: Papacy, prominence: 1, sitelinks: 79, sitelinks_on: 2026-10-18,
     note: "Mercurius, a priest of San Clemente, the first pope to take a new name, since his own was a pagan god's (533).",
     sources: [wp-john-ii]}
  - {key: agapetus-i, name: "Agapetus I", type: Clergy, roles: [pope], born: 489, born_estimated: true, died: 0536-04-22, realm: Papacy, prominence: 2, sitelinks: 76, sitelinks_on: 2026-10-18,
     note: "Son of a Roman priest; went to Constantinople at King Theodahad's bidding in 536 and failed to talk Justinian I out of invading Ostrogothic Italy. A saint.",
     sources: [wp-agapetus-i]}
  - {key: silverius, name: "Silverius", type: Clergy, roles: [pope], died: 0537-12-02, realm: Papacy, prominence: 1, sitelinks: 77, sitelinks_on: 2026-10-18,
     note: "Son of Pope Hormisdas, raised from deacon to pope by Theodahad on the eve of the Gothic War; deposed by Belisarius, he was exiled to the island of Palmarola, where he starved to death. A saint.",
     sources: [wp-silverius]}
  - {key: vigilius, name: "Vigilius", type: Clergy, roles: [pope], died: 0555-06-07, realm: Papacy, prominence: 2, sitelinks: 76, sitelinks_on: 2026-10-18,
     note: "A Roman aristocrat and apocrisiarius in Constantinople, ally of Empress Theodora, made pope on Silverius's deposition: the first pope of the Byzantine Papacy. Clashed with Justinian over the Three Chapters.",
     sources: [wp-vigilius]}
  - {key: pelagius-i, name: "Pelagius I", type: Clergy, roles: [pope], died: 0561-03-03, realm: Papacy, prominence: 1, sitelinks: 78, sitelinks_on: 2026-10-18,
     note: "A former apocrisiarius, elected as Justinian I's candidate, unwelcome in the West; having opposed the condemnation of the Three Chapters, he later accepted it.",
     sources: [wp-pelagius-i]}
  - {key: john-iii, name: "John III", type: Clergy, roles: [pope], died: 0574-07-13, realm: Papacy, prominence: 1, sitelinks: 79, sitelinks_on: 2026-10-18,
     note: "Pope 561-574 under Byzantine rule; the second pope to change his name.",
     sources: [wp-john-iii]}
  - {key: benedict-i, name: "Benedict I", type: Clergy, roles: [pope], died: 0579-07-30, realm: Papacy, prominence: 1, sitelinks: 78, sitelinks_on: 2026-10-18,
     note: "Pope 575-579, as the Lombards spread through Italy and famine struck Rome.",
     sources: [wp-benedict-i]}
  - {key: pelagius-ii, name: "Pelagius II", type: Clergy, roles: [pope], died: 0590-02-07, realm: Papacy, prominence: 1, sitelinks: 80, sitelinks_on: 2026-10-18,
     note: "Of Ostrogothic descent; pope 579-590, he ordered the building of the basilica of San Lorenzo fuori le Mura.",
     sources: [wp-pelagius-ii]}
  - {key: gregory-i, name: "Gregory I", type: Clergy, roles: [pope], born: 540, born_estimated: true, died: 0604-03-12, realm: Papacy, prominence: 5, sitelinks: 112, sitelinks_on: 2026-10-18,
     note: "Gregory the Great: a senator's son and prefect of Rome at 30 who became a monk, then pope (590-604). Ran Rome's relief better than the emperors, sent the mission to convert the Anglo-Saxons, and shaped the medieval papacy.",
     sources: [wp-gregory-i]}
  - {key: laurentius-antipope, name: "Laurentius (antipope)", type: Clergy, roles: [antipope], born: 460, born_estimated: true, died: 507, died_estimated: true, realm: Papacy, prominence: 1, sitelinks: 36, sitelinks_on: 2026-10-18,
     note: "Elected in 498 by a faction with Byzantine sympathies, backed by Emperor Anastasius I, against Symmachus; the split ran through the Church, the Senate and the people of Rome until about 506.",
     sources: [wp-laurentius-antipope]}
  - {key: dioscorus-antipope, name: "Dioscorus (antipope)", type: Clergy, roles: [antipope], born: 450, born_estimated: true, died: 0530-10-14, realm: Papacy, prominence: 1, sitelinks: 33, sitelinks_on: 2026-10-18,
     note: "Chosen by most electors after Felix IV's death (530), against Felix's wish for Boniface II; he died within a month, leaving Boniface pope.",
     sources: [wp-dioscorus-antipope]}

