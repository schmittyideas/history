# History films, batch 2: films 13-25 of the best-known films in Ty's entertainment database tagged History (by TMDB
# vote count), following inbox/2026-10-17-history-films-1.yaml: each film is an artwork (kind: film) linked to its
# director (creator) and to the places and events it depicts (role: depicts), with `external` links to the
# entertainment database and TMDB. No cast, plot or posters.
# Ty's choices (2026-10-17): cities a film is set in count; missing places and events are added; a link Wikipedia
# doesn't confirm is kept and cites TMDB.
# VERIFIED against English Wikipedia articles downloaded on 2026-10-17 with tools/wiki.py (revision IDs in the session
# scratchpad). Coordinates of new places are from Wikidata (P625), rounded. Sitelinks read from Wikidata on 2026-10-17.
# Stated honestly:
#  - The Irishman -> Chicago comes only from the entertainment database's description ("sends him to Chicago") and
#    TMDB's keywords; the film's Wikipedia article doesn't say it. Kept, citing TMDB, as Ty chose.
#  - The Favourite -> War of the Spanish Succession: the article's plot says "In 1705, England is at war with France";
#    TMDB's keywords name the war. Hatfield House and Hampton Court Palace are where it was shot (role: filmed), from
#    the article; the plot names no palace, so nothing is linked as depicted.
#  - Apocalypto is left out: Wikipedia says it is "set in either Yucatán or Guatemala" in 1502, naming no place or event.
#  - The Boy in the Striped Pyjamas links only to Berlin: its camp is never named (critics compare it with Auschwitz).
#  - Sully: the Hudson River is not added as a place (Wikidata's point for it is the river's source, 300 km north);
#    the flight's ditching is the event, at New York City.
#  - Hoffa's disappearance has no Wikipedia article of its own; the event cites his biography, which places it at the
#    Machus Red Fox restaurant in Bloomfield Township, near Detroit.
#  - New York City is the record `new-york-city`; a second record, `new-york` (same name, 4 life moments), looks like
#    a duplicate and is left for Ty.
batch:
  title: "History films, batch 2"
  requested: "Match the History films in the entertainment database to our places and events (films 13-25 of the top 25)"
  date: 2026-10-17

