# Presidents' wives, batch 2 of 2: the wives of the presidents who took office 1885-2025 (Cleveland to Trump; every
# wife, not only First Ladies). Same conventions as batch 1 (inbox/2026-10-18-presidents-wives-1.yaml):
# Ty's choices (2026-10-18): every wife; type Notable (prominence from sitelinks), except where a wife is best known
# for something else (Hillary Clinton: Government, as senator and Secretary of State; Jane Wyman: Artist, as an
# actress); the First Ladyship as a title, "First Lady of the United States", realm United States.
# VERIFIED: wives and marriage dates from Wikidata (P26 with start/end qualifiers), each checked against the wife's
# English Wikipedia article downloaded on 2026-10-18 with tools/wiki.py (revision IDs in the session scratchpad).
# Sitelinks read from Wikidata on 2026-10-18. First Lady years: her husband's term dates (from
# inbox/2026-10-13-us-presidents-*.yaml), cut to the marriage and her life.
# Stated honestly:
#  - Frances Cleveland married Cleveland during his first term (2 June 1886) and holds the title for both his terms;
#    Melania Trump likewise for both of Trump's (the second is open-ended).
#  - Ellen Axson Wilson died in office (6 August 1914); Edith Wilson married Wilson on 18 December 1915.
#  - Eleanor Roosevelt: Wikipedia says she married Franklin D. Roosevelt in 1905 (17 March); Wikidata says 1903.
#    Recorded as a discrepancy; the link uses 1905.
#  - Wives who were never First Lady: Mary Dimmick Harrison (married after his presidency), Alice Hathaway Roosevelt
#    and Neilia Hunter Biden (died before), Jane Wyman, Ivana Trump and Marla Maples (divorced before).
batch:
  title: "Presidents' wives, batch 2"
  requested: "Have we added all the US presidents and their wives? Add the wives (all of them), as Notable people with the First Lady title"
  date: 2026-10-18

