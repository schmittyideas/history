# Film portrayals: the real people the History films (batches 1 and 2) portray, linked as `subject` so each shows on the
# person ("Portrayed in"), the film ("Portrays") and the places the film is set ("Films set here").
# Ty's choices (2026-10-18): link each film's main real subjects, adding them if missing, plus real people in the film
# who are already in the database; people known for one story get the new type Notable (own Show button and colour;
# prominence from sitelinks, like cultural figures).
# VERIFIED against English Wikipedia articles downloaded on 2026-10-17/18 with tools/wiki.py (revision IDs in the
# session scratchpad): each person's dates and one-line note from their own article; each portrayal from the film's
# article (plot or cast). Sitelinks read from Wikidata on 2026-10-18.
# Stated honestly:
#  - Films with no real main subject are left alone: Saving Private Ryan, 1917, The Boy in the Striped Pyjamas,
#    Gangs of New York and Black Hawk Down (fictional or composite leads), The Impossible (the family is renamed),
#    Spotlight (an ensemble of journalists).
#  - Braveheart: Edward II is "Longshanks' son" in the plot; the film's history is loose, but he is who it portrays.
#  - Winston Churchill (The King's Speech) and Robert F. Kennedy (Green Book) appear but aren't in the database yet.
#  - Solomon Northup: born "July 10, c. 1807/1808"; death unknown (after 1857). Born 1808, estimated; no death date.
#  - Jimmy Hoffa: disappeared 30 July 1975, declared dead in 1982. Died 1975, estimated, with a note.
#  - Sarah Churchill: Wikipedia gives 5 June 1660 (Old Style); Wikidata gives 15 June (New Style). Old Style kept,
#    as the article gives it.
#  - Abigail Masham: born c. 1670 (estimated).
batch:
  title: "Film portrayals"
  requested: "If we know a historical person is portrayed in a film, show it on the person, the film and the location"
  date: 2026-10-18

