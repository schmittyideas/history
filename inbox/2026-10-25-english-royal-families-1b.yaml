  - {key: wp-adeliza-of-normandy, title: "Adeliza of Normandy (Wikipedia)", url: "https://en.wikipedia.org/wiki/Adeliza_of_Normandy"}
  - {key: wp-cecilia-of-normandy, title: "Cecilia of Normandy (Wikipedia)", url: "https://en.wikipedia.org/wiki/Cecilia_of_Normandy"}
  - {key: wp-constance-of-normandy, title: "Constance of Normandy (Wikipedia)", url: "https://en.wikipedia.org/wiki/Constance_of_Normandy"}
