batch:
  title: "English royal families 1b: Edward the Confessor to Stephen (1042-1154)"
  requested: "Ty: fill in parents, spouses and children (who reached 12) for every English monarch, with sex on each monarch (issue #292)."
  date: 2026-10-25
  notes: "Family links for Edward the Confessor, Harold II, William I, William II, Henry I and Stephen. Part b of two (part a: Æthelred to Harthacnut, which also links Edward to his parents). Checked against each person's English Wikipedia article (revisions of 2026-10)."

# Notes for the reviewer
# - William II never married. Henry I already has both wives and both legitimate children, with both parents linked:
#   only his sex is added. William I already had his parents, Matilda and four children: Matilda's links to those four
#   are added, plus the four children not yet in.
# Left out: no Wikipedia article of their own
# - William I's daughter Matilda (c. 1061 - c. 1086?) and the disputed Agatha (her title redirects to William's article).
# - Harold II's sons Godwine, Edmund, Magnus, Ulf and Harold.
# Left out: not shown to reach 12
# - Stephen's son Baldwin (c. 1132 - before 1147) and daughter Matilda (c. 1133 - before 1147).
# Left out: not legitimate
# - Henry I's many illegitimate children; Stephen's son Gervase.
# Left out: facts not confirmed
# - Births: Constance of Normandy ("between 1057 and 1061"), Godwin, Adeliza: no year given.
# - Birth places: Marie of Boulogne "in or near London"; Constance "in Normandy".
# - Burials: William of Boulogne (Montmorel Abbey, no English article) and Marie of Boulogne (a "Montreuil Abbey" that can't be
#   identified for sure).
# - Marriage years: Edith the Fair to Harold (a handfast marriage of "about twenty years"); Godwin to Gytha (c. 1019-1023).
#   Ealdgyth of Mercia married Harold "in about January 1066" (Harold's article) or "in spring 1066" (Edith the Fair's).
# Choices
# - Harold II and Edith the Fair: a more danico (handfast) marriage per Harold's article, so a spouse link with a note, and
#   their daughters Gytha and Gunhild count as children of the marriage.

