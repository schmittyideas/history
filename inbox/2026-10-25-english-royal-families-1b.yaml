discrepancies:
  - key: gytha-of-wessex-death-year
    question: Did Gytha of Wessex die in 1098 or 1107?
    about: [{person: gytha-of-wessex}]
    field: died
    claims:
      - {value: "1098 (10 March)", sources: [wp-gytha-of-wessex], note: "Necrology of St Pantaleon, Cologne; the year is presumed"}
      - {value: "1107 (7 May)", sources: [wp-gytha-of-wessex], note: "If she was the mother of Yuri Dolgorukiy, whose mother died then (Testament of Vladimir Monomakh)"}
    note: "The record uses 1098, marked approximate."
  - key: edith-of-wessex-death-date
    question: Did Edith of Wessex die on 18 or 19 December 1075?
    about: [{person: edith-of-wessex}]
    field: died
    claims:
      - {value: 1075-12-18, sources: [wp-edith-of-wessex]}
      - {value: 1075-12-19, sources: [wp-gytha-thorkelsdottir]}
    note: "The record uses 18 December, from her own article."
  - key: cecilia-of-normandy-death-year
    question: Did Cecilia of Normandy die in 1126 or 1127?
    about: [{person: cecilia-of-normandy}]
    field: died
    claims:
      - {value: 1126-07-30, sources: [wp-cecilia-of-normandy]}
      - {value: 1127, sources: [wp-william-i]}
    note: "The record uses 30 July 1126, from her own article."
  - key: eustace-iv-of-boulogne-birth-year
    question: When was Eustace IV of Boulogne born?
    about: [{person: eustace-iv-of-boulogne}]
    field: born
    claims:
      - {value: "c. 1130 (c. 1129/1131)", sources: [wp-eustace-iv-of-boulogne, wp-king-stephen]}
      - {value: "around 1127", sources: [wp-matilda-of-boulogne]}
    note: "The record uses 1130, marked approximate."
  - key: william-i-of-boulogne-birth-year
    question: When was William I of Boulogne born?
    about: [{person: william-i-of-boulogne}]
    field: born
    claims:
      - {value: "December 1135 (c. 1135)", sources: [wp-matilda-of-boulogne, wp-king-stephen]}
      - {value: "c. 1137", sources: [wp-william-i-of-boulogne]}
    note: "The record uses 1135, marked approximate."
  - key: marie-of-boulogne-birth-year
    question: When was Marie of Boulogne born?
    about: [{person: marie-of-boulogne}]
    field: born
    claims:
      - {value: "late 1136", sources: [wp-marie-of-boulogne], note: "The last child of Stephen and Matilda"}
      - {value: "c. 1128", sources: [wp-king-stephen], note: "Listed in Stephen's article as his eldest child"}
    note: "The record uses 1136, from her own article."
