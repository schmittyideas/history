  - {key: king-stephen, sex: male}

  # Harold II's family
  - {key: godwin-earl-of-wessex, name: "Godwin, Earl of Wessex", type: Nobility, died: 1053-04-15, sex: male, house: Godwin, prominence: 3, coverage: not-read, note: "Made the first Earl of Wessex by Cnut (c. 1020); father of Harold II and of Queen Edith.", sources: [wp-godwin-earl-of-wessex]}
  - {key: gytha-thorkelsdottir, name: Gytha Thorkelsdóttir, type: Nobility, born: 997, born_estimated: true, died: 1069, died_estimated: true, sex: female, prominence: 1, coverage: not-read, note: "Danish noblewoman, wife of Earl Godwin and mother of Harold II and Edith of Wessex; sister of Ulf Jarl.", sources: [wp-gytha-thorkelsdottir]}
  - {key: ealdgyth-of-mercia, name: Ealdgyth of Mercia, type: Royalty, sex: female, prominence: 1, coverage: not-read, note: "Daughter of Ælfgar, Earl of Mercia (fl. c. 1057-1066); widow of Gruffudd ap Llywelyn of Wales, then wife and queen of Harold II in 1066.", sources: [wp-ealdgyth-of-mercia]}
  - {key: edith-the-fair, name: Edith the Fair, type: Nobility, born: 1025, born_estimated: true, died: 1086, died_estimated: true, sex: female, prominence: 2, coverage: not-read, note: "Edith Swanneck, one of the wealthiest magnates in England in 1066; Harold II's handfast (more danico) wife for about twenty years. Said to have identified his body after Hastings.", sources: [wp-edith-the-fair]}
  - {key: gytha-of-wessex, name: Gytha of Wessex, type: Royalty, born: 1053, born_estimated: true, died: 1098, died_estimated: true, sex: female, house: Godwin, prominence: 1, coverage: not-read, note: "Daughter of Harold II and Edith the Fair (born c. 1053/1061); married Vladimir II Monomakh, prince of Smolensk, and was the mother of Mstislav the Great.", sources: [wp-gytha-of-wessex]}
  - {key: gunhild-of-wessex, name: Gunhild of Wessex, type: Royalty, sex: female, house: Godwin, prominence: 1, coverage: not-read, note: "Younger daughter of Harold II and Edith the Fair (fl. 1066-1093); educated at Wilton Abbey, she left it in 1093 to live with Alan the Red.", sources: [wp-gunhild-of-wessex]}

  # Edward the Confessor's wife
  - {key: edith-of-wessex, name: Edith of Wessex, type: Royalty, born: 1025, born_estimated: true, died: 1075-12-18, sex: female, house: Godwin, prominence: 2, coverage: not-read, note: "Daughter of Earl Godwin; queen of England as wife of Edward the Confessor from 23 January 1045, and crowned. Buried with him in Westminster Abbey.", sources: [wp-edith-of-wessex]}

  # William I's children
  - {key: richard-son-of-william-the-conqueror, name: Richard of Normandy, type: Royalty, born: 1054, born_estimated: true, died: 1070, died_estimated: true, sex: male, house: Normandy, prominence: 1, coverage: not-read, note: "Second son of William the Conqueror and Matilda; killed in a hunting accident in the New Forest, probably in 1070 or shortly after.", sources: [wp-richard-son-of-william-the-conqueror]}
  - {key: adeliza-of-normandy, name: Adeliza of Normandy, type: Royalty, sex: female, house: Normandy, prominence: 1, coverage: not-read, note: "Probably the eldest daughter of William the Conqueror and Matilda; said to have been betrothed to Harold Godwinson; probably a nun of St Léger at Préaux. Died before 1113.", sources: [wp-adeliza-of-normandy]}
  - {key: cecilia-of-normandy, name: Cecilia of Normandy, type: Royalty, roles: [abbess], born: 1056, born_estimated: true, died: 1126-07-30, sex: female, house: Normandy, prominence: 1, coverage: not-read, note: "Daughter of William the Conqueror and Matilda, given to the Abbey of the Holy Trinity, Caen, in 1066; its abbess from 1112.", sources: [wp-cecilia-of-normandy]}
  - {key: constance-of-normandy, name: Constance of Normandy, type: Royalty, died: 1090-08-13, sex: female, house: Normandy, prominence: 1, coverage: not-read, note: "Daughter of William the Conqueror and Matilda (born between 1057 and 1061); married Alan IV Fergant, Duke of Brittany, in 1086.", sources: [wp-constance-of-normandy]}

  # Stephen's family
  - {key: matilda-of-boulogne, name: Matilda of Boulogne, type: Royalty, born: 1105, born_estimated: true, died: 1152-05-03, sex: female, house: Boulogne, prominence: 3, coverage: not-read, note: "Countess of Boulogne in her own right from 1125 and queen of England as Stephen's wife from 1135; led his cause while he was captive in 1141.", sources: [wp-matilda-of-boulogne]}
  - {key: eustace-iv-of-boulogne, name: Eustace IV of Boulogne, type: Royalty, born: 1130, born_estimated: true, died: 1153-08-17, sex: male, house: Blois, prominence: 2, coverage: not-read, note: "Eldest son of Stephen and Matilda; Count of Boulogne from 1146 and heir to England until he died in 1153.", sources: [wp-eustace-iv-of-boulogne]}
  - {key: william-i-of-boulogne, name: William I of Boulogne, type: Royalty, born: 1135, born_estimated: true, died: 1159-10-11, sex: male, house: Blois, prominence: 1, coverage: not-read, note: "Second son of Stephen and Matilda; Count of Boulogne and Earl of Surrey (by his wife Isabel de Warenne) from 1153. Died near Toulouse, childless.", sources: [wp-william-i-of-boulogne]}
  - {key: marie-of-boulogne, name: Marie of Boulogne, type: Royalty, born: 1136, born_estimated: true, died: 1182-07-25, sex: female, house: Blois, prominence: 1, coverage: not-read, note: "Daughter of Stephen and Matilda, born late 1136; nun and abbess of Romsey, then Countess of Boulogne from 1159, taken from her abbey by Matthew of Alsace.", sources: [wp-marie-of-boulogne]}

