discrepancies:
  - key: magna-carta-sealing-date
    question: On what date was Magna Carta sealed at Runnymede?
    about: [{event: magna-carta-1215}]
    field: date
    claims:
      - {value: "15 June 1215", sources: [wp-magna-carta, wp-john-of-england], note: "Lead of the Magna Carta article and the John article: sealed or met on 15 June"}
      - {value: "10 June 1215 (meeting began); text agreed 15 June; oaths renewed 19 June", sources: [wp-magna-carta], note: "The body of the Magna Carta article says John met the rebels on 10 June"}
    note: The record uses 15 June, the date usually given for the sealing.

  - key: eleanor-of-aquitaine-death-date
    question: Did Eleanor of Aquitaine die on 31 March or 1 April 1204?
    about: [{person: eleanor-of-aquitaine}]
    field: died
    claims:
      - {value: "1 April 1204", sources: [wp-eleanor-of-aquitaine], note: "Lead of the article"}
      - {value: "31 March 1204", sources: [wp-eleanor-of-aquitaine], note: "Body: died on either 31 March or 1 April"}
    note: The record holds the year only.

  - key: eleanor-of-aquitaine-birth-year
    question: Was Eleanor of Aquitaine born in 1122 or 1124?
    about: [{person: eleanor-of-aquitaine}]
    field: born
    claims:
      - {value: "1124", sources: [wp-eleanor-of-aquitaine], note: "Now generally accepted; a late 13th-century genealogy gives her age as 13 at her father's death in spring 1137"}
      - {value: "1122", sources: [wp-eleanor-of-aquitaine], note: "Once the accepted date"}
    note: The record uses c. 1124.

  - key: john-birth-year
    question: Was John born in 1166 or 1167?
    about: [{person: john-of-england}]
    field: born
    claims:
      - {value: "Christmastide 1166", sources: [wp-john-of-england]}
      - {value: "Christmastide 1167", sources: [wp-john-of-england], note: "The article gives 1166/7 and says the date is debated"}
    note: The record uses c. 1166.

  - key: edward-i-birth-date
    question: Was Edward I born on 17 or 18 June 1239?
    about: [{person: edward-i-of-england}]
    field: born
    claims:
      - {value: "17 June 1239", sources: [wp-edward-i]}
      - {value: "18 June 1239", sources: [wp-edward-i], note: "He was born in the night of 17-18 June"}
    note: The record holds the year only.

  - key: richard-i-aquitaine-recognition
    question: When was Richard recognised as Duke of Aquitaine?
    about: [{person: richard-i-of-england}]
    field: date
    claims:
      - {value: "June 1172, at Poitiers", sources: [wp-richard-i]}
      - {value: "1179", sources: [wp-henry-ii], note: "Henry II article: Richard recognised as duke in 1179 after the revolt"}
    note: The title row starts in 1172.

  - key: death-of-edward-ii
    question: Did Edward II die at Berkeley Castle on 21 September 1327?
    about: [{person: edward-ii-of-england}, {event: death-of-edward-ii-1327}]
    field: died
    claims:
      - {value: "Died at Berkeley Castle in the night of 21 September 1327, probably murdered", sources: [wp-edward-ii], note: "View of most historians; the only evidence is a letter later disputed by Thomas de Berkeley in 1330"}
      - {value: "Escaped and died much later", sources: [wp-edward-ii], note: "A minority view, based on the Fieschi Letter"}
    note: The record uses 21 September 1327.

  - key: richard-ii-deposition-date
    question: Was Richard II deposed on 30 September or 1 October 1399?
    about: [{event: deposition-of-richard-ii-1399}]
    field: date
    claims:
      - {value: "30 September 1399", sources: [wp-richard-ii, wp-henry-iv], note: "Abdication read in Westminster Hall; Henry IV's reign is dated from this day"}
      - {value: "1 October 1399", sources: [wp-richard-ii], note: "Formal deposition by the thirty-three articles"}
    note: The record uses 30 September, matching the start of Henry IV's reign.

  - key: henry-vi-death
    question: Where and how did Henry VI die in 1471?
    about: [{person: henry-vi-of-england}]
    field: place
    claims:
      - {value: "Died of melancholia", sources: [wp-henry-vi], note: "Historie of the arrivall of Edward IV (pro-Edward chronicle)"}
      - {value: "Murdered on Edward IV's order", sources: [wp-henry-vi], note: "Widely suspected"}
      - {value: "Killed by Richard, Duke of Gloucester", sources: [wp-henry-vi], note: "Thomas More's History of Richard III"}
      - {value: "Died in the Wakefield Tower", sources: [wp-henry-vi], note: "Tradition only, unsupported by evidence; the actual place of death is unknown"}
    note: The record places his death in the Tower of London (where he was imprisoned) on 21 May 1471, the date in the official records.
