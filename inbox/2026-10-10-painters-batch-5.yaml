discrepancies:
- key: pietro-perugino-born
  question: When was Perugino born?
  about:
  - person: pietro-perugino
  field: born
  claims:
  - value: '1446'
    sources:
    - wp-pietro-perugino
    note: Earliest of the range inferred from his age at death as given by Vasari and Giovanni Santi.
  - value: '1452'
    sources:
    - wp-pietro-perugino
    note: Latest of the same range.
  note: The record uses 1446, marked estimated. The exact date is unknown.
- key: albrecht-altdorfer-born-place
  question: Was Altdorfer born in Regensburg or in Altdorf?
  about:
  - person: albrecht-altdorfer
  field: place
  claims:
  - value: Regensburg
    sources:
    - wp-albrecht-altdorfer
  - value: Altdorf
    sources:
    - wp-albrecht-altdorfer
  note: The article says "Regensburg or Altdorf", so no born moment is recorded.
- key: matthias-grunewald-born
  question: When was Grünewald born?
  about:
  - person: matthias-grunewald
  field: born
  claims:
  - value: c. 1470
    sources:
    - wp-matthias-grunewald
    note: The article's lead.
  - value: '1475'
    sources:
    - wp-matthias-grunewald
    note: Estimated from Sandrart's account of him working on Dürer's altarpiece about 1505, a task done by apprentices.
  note: The record uses c. 1470 (the lead).
- key: matthias-grunewald-died
  question: When did Grünewald die?
  about:
  - person: matthias-grunewald
  field: died
  claims:
  - value: '1528-08-31'
    sources:
    - wp-matthias-grunewald
    note: The article's lead.
  - value: '1532'
    sources:
    - wp-matthias-grunewald
    note: Life section says he most probably died in 1532, although sources vary.
  note: The record uses 31 August 1528 (the lead). The article itself is inconsistent.
- key: isenheim-altarpiece-date
  question: When was the Isenheim Altarpiece finished?
  about:
  - artwork: isenheim-altarpiece
  field: date
  claims:
  - value: c. 1512 to 1516
    sources:
    - wp-matthias-grunewald
    note: The article's lead.
  - value: 1512 to 1514 or 1515 / completed 1515
    sources:
    - wp-matthias-grunewald
    note: Life and Works sections.
  note: The record uses 1512 to 1516, marked estimated.
- key: claude-lorrain-born
  question: When was Claude Lorrain born?
  about:
  - person: claude-lorrain
  field: born
  claims:
  - value: '1600'
    sources:
    - wp-claude-lorrain
    note: Given on his tombstone and in the article's lead as c. 1600.
  - value: c. 1604 or 1605
    sources:
    - wp-claude-lorrain
    note: Contemporary sources indicate a later date.
  note: The record uses 1604, marked estimated, following the contemporary sources.
- key: charles-le-brun-died
