- key: jusepe-de-ribera-born
  question: When was Ribera born?
  about:
  - person: jusepe-de-ribera
  field: born
  claims:
  - value: '1591'
    sources:
    - wp-jusepe-de-ribera
    note: Baptised 17 February 1591 in Játiva; the year was positively established only in 1923.
  - value: '1587'
    sources:
    - wp-jusepe-de-ribera
    note: Long believed, now shown to be false by 20th-century documents.
  status: resolved
  resolution: 1591, from the Játiva baptismal record. The record holds the baptism year as the birth year.
- key: jusepe-de-ribera-born-place
