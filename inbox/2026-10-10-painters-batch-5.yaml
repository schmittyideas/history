  about:
  - person: jusepe-de-ribera
  field: died
  claims:
  - value: '1652-11-03'
    sources:
    - wp-jusepe-de-ribera
    note: The article's lead.
  - value: September 1652
    sources:
    - wp-jusepe-de-ribera
    note: The Later life section.
