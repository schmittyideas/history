    note: Baptismal record.
  - value: Gallipoli
    sources:
    - wp-jusepe-de-ribera
    note: De Dominici.
  - value: Lecce
    sources:
    - wp-jusepe-de-ribera
    note: Celano.
  status: resolved
  resolution: Játiva, shown by 20th-century documents; the Italian claims are disproved.
