discrepancies:
  - key: kamakura-shogunate-founding-date
    question: When was the Kamakura shogunate founded, and when did Yoritomo become shogun?
    about: [{event: kamakura-shogunate-founded-1192}, {person: minamoto-no-yoritomo}, {person: emperor-go-shirakawa}]
    field: date
    claims:
      - {value: "1185: after Dan-no-ura Yoritomo 'established the first shogunate at Kamakura'; in December 1185 Go-Shirakawa granted the power to appoint stewards and constables", sources: [wp-minamoto-no-yoritomo, wp-genpei-war, wp-hojo-yoshitoki]}
      - {value: "1192: Yoritomo became Sei-i Taishogun in spring 1192 after Go-Shirakawa's death (some versions say Go-Shirakawa granted it shortly before dying)", sources: [wp-minamoto-no-yoritomo, wp-genpei-war, wp-hojo-tokimasa]}
      - {value: "Invested several months after the retired emperor's death in 1192", sources: [wp-emperor-go-shirakawa]}
    note: "The record uses 1192, the year of the shogun title, given in most articles. 1185 is when real military government began."
  - key: dan-no-ura-date
    question: On what date was the Battle of Dan-no-ura?
    about: [{event: battle-of-dan-no-ura-1185}]
    field: date
    claims:
      - {value: "25 April 1185", sources: [wp-battle-of-dan-no-ura]}
      - {value: "24 March 1185 (the Shimonoseki city page)", sources: [wp-battle-of-dan-no-ura]}
    note: "The record uses 25 April 1185, the article's first date; the month may differ because of the lunar-to-Gregorian conversion."
  - key: soga-revenge-1193-date
    question: On what date was the Revenge of the Soga Brothers at the Fuji hunt in 1193?
    about: [{person: minamoto-no-yoritomo}, {person: hojo-tokimasa}]
    field: date
    claims:
      - {value: "28 May 1193", sources: [wp-minamoto-no-yoritomo]}
      - {value: "28 June 1193", sources: [wp-hojo-tokimasa]}
    note: "Not entered as an event. Both articles agree on 28 and 1193; only the month differs."
  - key: yoriie-death-date
    question: When was Minamoto no Yoriie killed?
    about: [{person: minamoto-no-yoriie}]
    field: died
    claims:
      - {value: "14 August 1204", sources: [wp-minamoto-no-yoriie]}
      - {value: "July 1204", sources: [wp-minamoto-no-yoriie]}
      - {value: "1204, on Tokimasa's orders", sources: [wp-hojo-yoshitoki, wp-hojo-tokimasa]}
    note: "Both dates are in the same article (lead and text). The record uses 14 August 1204, the lead's date. Accounts also differ on the method of the killing."
  - key: sanetomo-death-date
    question: On what day was Minamoto no Sanetomo assassinated?
    about: [{person: minamoto-no-sanetomo}]
    field: died
    claims:
      - {value: "13 February 1219 (Jokyu 1, 27th day of the 1st month)", sources: [wp-minamoto-no-sanetomo]}
      - {value: "12 February 1219", sources: [wp-minamoto-no-yoritomo]}
    note: "The record uses 13 February 1219, from Sanetomo's own article, which gives the evening of the 27th day."
  - key: ashikaga-shogunate-founding-year
    question: In what year was the Ashikaga (Muromachi) shogunate founded?
    about: [{event: ashikaga-shogunate-founded-1338}, {person: ashikaga-takauji}]
    field: date
    claims:
      - {value: "1338: Takauji appointed shogun; his rule began 1338", sources: [wp-ashikaga-takauji]}
      - {value: "1336: Takauji became shogun and founded the Ashikaga Shogunate (and enacted the Kenmu Law Code)", sources: [wp-kenmu-restoration, wp-emperor-go-daigo]}
      - {value: "1335: Takauji claimed the title of Sei-i Taishogun and allotted land without court permission", sources: [wp-ashikaga-takauji]}
    note: "The record uses 1338, the formal appointment per the Takauji article."
  - key: yoshinori-appointment-year
    question: When did Ashikaga Yoshinori become shogun?
    about: [{person: ashikaga-yoshinori}]
    field: date
    claims:
      - {value: "1428: Sei-i Taishogun on the day Yoshimochi died (3 February 1428)", sources: [wp-ashikaga-yoshinori, wp-ashikaga-yoshimochi]}
      - {value: "1429: appointed shogun; reigned 1429-1441", sources: [wp-ashikaga-yoshinori]}
    note: "The record uses 1429, the lead's reign dates."
  - key: yoshimasa-appointment-year
    question: When did Ashikaga Yoshimasa become shogun?
    about: [{person: ashikaga-yoshimasa}]
    field: date
    claims:
      - {value: "1443: the young Yoshinari (later Yoshimasa) was elevated immediately after Yoshikatsu died on 16 August 1443; reigned 1443-1473", sources: [wp-ashikaga-yoshimasa]}
      - {value: "1449: 'Yoshimasa was appointed shogun'", sources: [wp-ashikaga-yoshimasa]}
    note: "Both are in the same article. The record uses 1443, the lead's reign start; 1449 is the formal appointment."
  - key: odawara-campaign-year
    question: In what year did Hideyoshi besiege Odawara?
    about: [{event: siege-of-odawara-1590}]
    field: date
    claims:
      - {value: "1590", sources: [wp-toyotomi-hideyoshi, wp-tokugawa-ieyasu, wp-oda-nobunaga]}
      - {value: "1588 (Tensho 18, 7th month)", sources: [wp-emperor-go-yozei]}
    note: "The record uses 1590. The Go-Yozei article's era year Tensho 18 is 1590 in the Gregorian count, so '1588' there is probably a slip."
  - key: kiyomori-daijo-daijin-tenure
    question: How long did Taira no Kiyomori hold the post of Daijo-daijin?
    about: [{person: taira-no-kiyomori}]
    field: date
    claims:
      - {value: "From 1167 until his death in 1181 (the lead: Daijo-daijin and de facto ruler from 1167 until his death)", sources: [wp-taira-no-kiyomori]}
      - {value: "Appointed in 1167 but 'soon relinquished the position', as was the norm", sources: [wp-taira-no-kiyomori]}
    note: "The title row ends on 20 March 1181 following the lead; the real end of the formal post is not dated in the article."
  - key: nobunaga-udaijin-tenure
    question: When did Oda Nobunaga hold the post of Udaijin (Minister of the Right)?
    about: [{person: oda-nobunaga}]
    field: date
    claims:
      - {value: "1576 to 1579", sources: [wp-oda-nobunaga]}
      - {value: "1577 to 1578", sources: [wp-emperor-ogimachi]}
    note: "The record uses the Nobunaga article (1576, resigned 1579)."
  - key: ieyasu-burial-place
    question: Where is Tokugawa Ieyasu buried?
    about: [{person: tokugawa-ieyasu}]
    field: place
    claims:
      - {value: "Kunozan Toshogu (Kunozan), where his remains were buried first", sources: [wp-tokugawa-ieyasu]}
      - {value: "Nikko Toshogu, where many believe the remains were reburied after the first anniversary", sources: [wp-tokugawa-ieyasu]}
    note: "Neither shrine has opened the graves. No burial moment is entered."
  - key: mongol-1274-timeline
    question: How does the November 1274 timeline of the first Mongol invasion fit together?
    about: [{event: mongol-invasions-of-japan-1274}]
    field: date
    claims:
      - {value: "Landing in Hakata Bay on 19 November 1274, Battle of Bun'ei on 20 November", sources: [wp-mongol-invasions-of-japan]}
      - {value: "A courtier's diary entry for 6 November 1274 records a reverse wind blowing back the fleet", sources: [wp-mongol-invasions-of-japan]}
    note: "Both are in the same article. The record uses the 19-20 November landing and battle; the article itself says it is not certain whether the storm struck at Hakata Bay or on the way back to Korea."
  - key: heiji-rebellion-year
    question: In what year was the Heiji Rebellion?
    about: [{event: heiji-rebellion-1160}]
    field: date
    claims:
      - {value: "1160", sources: [wp-taira-no-kiyomori, wp-emperor-go-shirakawa]}
      - {value: "December 1159: the Minamoto attacked Sanjo Palace while Kiyomori was away", sources: [wp-minamoto-no-yoritomo]}
    note: "The record uses 1160, the conventional date of the rebellion as two articles give it. Yoshitomo's death is dated 11 February 1160 in the Yoritomo article."
  - key: ogimachi-accession-date
    question: When did Emperor Ogimachi accede and when was he enthroned?
    about: [{person: emperor-ogimachi}]
    field: date
    claims:
      - {value: "Reign from 17 November 1557 (the lead), on the death of Go-Nara", sources: [wp-emperor-ogimachi]}
      - {value: "Proclaimed emperor and ceremonies of coronation in the 1st month of Eiroku 3 (1560), paid for by Mori Motonari and others", sources: [wp-emperor-ogimachi]}
    note: "The record starts the reign on 17 November 1557; the enthronement ceremonies were delayed to 1560 by the court's poverty."
