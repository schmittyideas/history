batch:
  title: "Japan, 1011-1616: emperors, regents and shoguns from Go-Sanjo to Tokugawa Ieyasu"
  requested: "Twenty-nine rulers and power-holders of Japan (emperors, Fujiwara regent, Taira no Kiyomori, Kamakura, Ashikaga and Tokugawa shoguns, the Hojo regents, Nobunaga and Hideyoshi), with reigns, key wars, places and discrepancies"
  date: 2026-10-11

# Notes for the reviewer (batch C of the East Asia build-out)
# - Source: local copies of the English Wikipedia articles (wp4 directory); nothing fetched. All 35 files checked: every one resolved to the article that was asked for (first lines read). Oda_Nobunaga, Toyotomi_Hideyoshi and Tokugawa_Ieyasu are long; I read the lead, early life, the rise/unification sections, the death sections and the shogunate sections, not every section (family, culture and popular-culture parts were skipped). Hojo_Yasutoki is a stub and only what it says is used.
# - Existing records only referenced, not redefined: emperor-ichijo (not used), fujiwara-no-michinaga (parent link to Yorimichi), realm Japan, place heian-kyo (Kyoto).
# - New realms: Kamakura shogunate, Ashikaga shogunate, Tokugawa shogunate (East Asia, Japan).
# - Title wordings: "Emperor of Japan" (realm Japan; every emperor, including Go-Daigo's whole span), "Regent (Sessho)" and "Regent (Kampaku)" (Yorimichi has both, Hideyoshi Kampaku), "Chancellor (Daijo-daijin)" (Kiyomori, Yoshimitsu, Hideyoshi), "Minister of the Right (Udaijin)" (Nobunaga), "Shogun" (the three shogunate realms), "Shikken (regent)" (Kamakura shogunate; the six Hojo).
# - Retired-emperor (insei / cloistered) period, kept to notes: Shirakawa (abdicated 3 Jan 1087, took the title Daijo-tenno and ruled indirectly from Shirakawa-in until 1129), Toba (cloistered ruler from 1129 to 1156) and Go-Shirakawa (de jure reign 1155-1158, cloistered from 1158 to 1192) held power as retired emperors; Go-Toba was cloistered 1198-1221 with more limited power. These stretches are not entered as titles.
# - Left out, because the article gives no date or place: Tokimasa's post as Protector of Kyoto 1185-1186 (given only in his lead, no place entered); Yoshimitsu's Ming title "King of Japan" 1404 (a foreign title, in his note only); Nobunaga's birthplace (the article says Nagoya Castle was the old view and Shobata Castle the newer one, so no place record); Hideyoshi's and Ieyasu's deaths (Fushimi Castle, no place record; Ieyasu's death place is not in the article read); Odawara Castle, Hosshoji, Honno-ji and Tsurugaoka Hachimangu (no place records, to keep the batch small). The Imjin War (Hideyoshi's Korean campaigns, 1592-1598) is defined by batch D; here it is only named in Hideyoshi's note. Kublai Khan (batch B) is named in the Mongol-invasion notes but not linked.
# - No placeholder dates: Hojo Tokiyori and Hojo Takatoki have NO shikken title row, because their articles do not state when they became shikken (an estimate would come from general knowledge or a derived age). Both stay as people with their events; the title rows are listed as a gap in the backlog.
# - Dates given by the articles as Gregorian equivalents of lunar dates are used as given. Lunar-year crossings are flagged in discrepancies rather than converted: Go-Sanjo's abdication (Enkyu 4, 8th day of the 12th month = 18 January 1073) and Shirakawa's accession. Shirakawa's abdication "26th day of the 11th month, Otoku 3" is given in the article as 3 January 1087.
# - Moments take a year only (checked): every moment below has an integer year or none. Full dates sit in title notes, events or discrepancies.
# - Coordinates come from general knowledge (2-3 decimals); visitable flags and visit_site names are general knowledge, not from the articles. Place founding years only where an article gives them (Osaka Castle 1583, Azuchi Castle 1576, Ginkaku-ji 1482, Edo Castle 1457); Kinkaku-ji and Byodo-in have no year in the articles.
# - Discrepancies recorded: Kamakura shogunate founding (1185 or 1192) and when Yoritomo became shogun; Dan-no-ura date; Soga revenge date; Yoriie's death date; Sanetomo's death date; Ashikaga shogunate founding (1336 or 1338); Yoshinori's appointment year; Yoshimasa's appointment year; Odawara year (1590 or 1588); Kiyomori's Daijo-daijin tenure; Nobunaga's Udaijin tenure; Ieyasu's burial (Kunozan or Nikko); Mongol 1274 timeline (6 November diary entry against 19-20 November landing); Heiji rising year; Go-Sanjo's abdication year (era count against Gregorian); Ogimachi's accession (1557 or ceremonies 1560). Seen and not entered as records: Shirakawa's cloistered years (the same article says 43, 41 and, by its dates, 42 years); Go-Daigo reign span is one row with the interruptions in the note; Yoshimitsu's retirement 1394 (ceded the shogunate) against 1395 (left all public offices); Go-Sanjo's reign year (6th year in one article, 5th in another) is not entered.
# - Size: 29 people, 33 title rows, 3 realms, 17 places, 21 events, 16 discrepancies (119 rows), 13 links, 29 moments.

