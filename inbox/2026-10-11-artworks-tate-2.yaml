# Notes for the reviewer
# - Paintings by our painters, read through the official Tate API (https://github.com/tategallery/collection); nothing was scraped. Image links only where the museum marks the work public domain / CC0 (MoMA and Tate publish metadata only: no images, just the accession number and a link back). Second wave: painters with 40 or more Wikipedia editions. Up to 3 per painter, matched on the painter's full name in the museum's artist field.
# - 237 new artworks (and works already in the database were updated with the accession number and link: 6).
# - Dates are the museum's own begin/end years; `estimated` where its date text says ca./c./probably.

