discrepancies:
  - key: ismail-i-accession
    question: When, and with what title, did Ismail I become shah?
    about: [{person: ismail-i}, {event: capture-of-tabriz-1501}]
    field: from
    claims:
      - {value: "July 1501", sources: [wp-ismail-i], note: "'In July 1501, following his occupation of Tabriz, Ismail took the title Padshah-i Iran (King of Iran)'; the lead says he ruled from 1501"}
      - {value: "22 December 1501", sources: [wp-ismail-i], note: "Qasem Beg Hayati Tabrizi (fl. 1554) says the enthronement at Tabriz took place immediately after the Battle of Sharur on 1 Jumada al-Thani 907 / 22 December 1501, the only narrative source with an exact date"}
      - {value: "1502", sources: [wp-ismail-i], note: "'After defeating an Aq Qoyunlu army in 1502, Ismail took the title of Shah of Iran'"}
    note: "The title row uses 1501, the year the lead and both other accounts share for the start of his rule; the day and the exact title are left open."
  - key: alauddin-husain-shah-accession
    question: When did Alauddin Husain Shah's reign begin?
    about: [{person: alauddin-husain-shah}]
    field: from
    claims:
