  - {person: mahmud-shah-of-malacca, title: Sultan of Malacca, realm: Malacca Sultanate, from: 1488, to: 1511, note: "The lead: Sultan of Malacca from 1488 to 1511, and again as pretender from 1513 to 1528; the Portuguese took Malacca in 1511", sources: [wp-mahmud-shah-of-malacca]}
  - {person: qansuh-al-ghawri, title: Mamluk Sultan, realm: Mamluk Sultanate, from: 1501, to: 1516-08-24, note: "The lead: reigned from 1501 to 1516 (no day for the start); killed at Marj Dabiq on 24 August 1516. Not sultan at exactly 1500", sources: [wp-qansuh-al-ghawri]}
  - {person: ismail-i, title: Shah of Iran, realm: Safavid Iran, from: 1501, to: 1524-05-23, note: "The lead: founder and first shah of Safavid Iran, ruling from 1501 until his death in 1524; the day of the enthronement is disputed within the article (see discrepancy)", sources: [wp-ismail-i]}
  - {person: husayn-bayqara, title: Sultan of Herat, realm: Timurid Empire, from: 1469-03-24, to: 1506-05-04, note: "Timurid ruler of Herat from 1469 to 4 May 1506 (the lead), with a brief interruption in 1470; took Herat on 24 March 1469. The article calls him ruler of Herat and Khurasan and styles him Sultan, hence this wording rather than 'Amir of the Timurid Empire'", sources: [wp-husayn-bayqara]}
  - {person: mengli-i-giray, title: Khan of Crimea, realm: Crimean Khanate, from: 1478, to: 1515, note: "Third reign, 'spring of 1478' to his death in 1515, as an Ottoman vassal; earlier reigns in 1466 and 1469-1475 not entered", sources: [wp-mengli-i-giray]}
  - {person: ivan-iii-of-russia, title: Grand Prince of Moscow, realm: Grand Duchy of Moscow, from: 1462, to: 1505-10-27, note: "The lead: Grand Prince of Moscow and all Russia from 1462 until his death on 27 October 1505 (no day for the start), co-ruler with his father before", sources: [wp-ivan-iii-of-russia]}
  - {person: alexander-jagiellon, title: Grand Duke of Lithuania, realm: Grand Duchy of Lithuania, from: 1492, to: 1506-08-19, note: "Elected by the Lithuanians in July 1492 (month only); in Poland John I Albert claimed to be Supreme Duke over him", sources: [wp-alexander-jagiellon]}
  - {person: alexander-jagiellon, title: King of Poland, realm: Poland, from: 1501-12-12, to: 1506-08-19, note: "King of Poland from 1501 (the lead); elected 3 October and crowned 12 December 1501, after his brother John I Albert died on 17 June 1501; the row starts on the coronation day", sources: [wp-alexander-jagiellon]}
  - {person: vladislaus-ii-of-hungary, title: King of Hungary, realm: Hungary, from: 1490-09-18, to: 1516-03-13, note: "King of Hungary and Croatia from 1490 (lead); elected 15 July, crowned at Szekesfehervar on 18 September 1490; died at Buda on 13 March 1516", sources: [wp-vladislaus-ii-of-hungary]}
  - {person: vladislaus-ii-of-hungary, title: King of Bohemia, realm: Bohemia, from: 1471-08-22, to: 1516-03-13, note: "King of Bohemia from 1471 (lead); elected at Kutna Hora on 27 May and crowned in Prague on 22 August 1471; the lands of the Bohemian Crown were divided with Matthias Corvinus from the Peace of Olomouc (21 July 1479) until Matthias's death in 1490", sources: [wp-vladislaus-ii-of-hungary]}
  - {person: hans-of-denmark, title: King of Denmark, realm: Denmark, from: 1482, to: 1513-02-20, note: "The lead: King of Denmark from 1482 to 1513; acclaimed in the spring of 1482 and crowned at Copenhagen on 18 May 1483; died 20 February 1513", sources: [wp-hans-of-denmark]}
  - {person: hans-of-denmark, title: King of Norway, realm: Norway, from: 1483, to: 1513-02-20, note: "The lead: King of Norway from 1483 to 1513; crowned at Trondheim on 20 July 1483", sources: [wp-hans-of-denmark]}
  - {person: hans-of-denmark, title: King of Sweden, realm: Sweden, from: 1497, to: 1501, note: "The lead: King of Sweden (Johan II) from 1497 to 1501; entered Stockholm and was crowned after the settlement with Sten Sture of 6 October 1497; the Swedish council renounced its allegiance in August 1501 and he sailed for Denmark", sources: [wp-hans-of-denmark]}
  - {person: manuel-i-of-portugal, title: King of Portugal, realm: Portugal, from: 1495, to: 1521-12-13, note: "The lead: King of Portugal from 1495 to 1521, succeeding his cousin John II (no day for the start); died 13 December 1521", sources: [wp-manuel-i-of-portugal]}
  - {person: ferdinand-ii-of-aragon, title: King of Aragon, realm: Aragon, from: 1479, to: 1516-01-23, note: "The lead: King of Aragon from 1479 until his death on 23 January 1516, succeeding his father John II (no day for the start); King of Castile jure uxoris 1475-1504 not entered", sources: [wp-ferdinand-ii-of-aragon]}
  - {person: frederick-of-naples, title: King of Naples, realm: Naples, from: 1496, to: 1501, note: "The lead: ruling from 1496 to 1501 after his nephew Ferdinand II died; crowned on 26 June 1497; deposed in 1501 (August: Naples fell to the French army)", sources: [wp-frederick-of-naples]}
  - {person: louis-xii-of-france, title: King of France, realm: France, from: 1498-04-07, to: 1515-01-01, note: "Succeeded Charles VIII on 7 April 1498 (the article); died on 1 January 1515", sources: [wp-louis-xii-of-france]}
  - {person: agostino-barbarigo, title: Doge of Venice, realm: Venice, from: 1486, to: 1501-09-20, note: "The lead: Doge of Venice from 1486 until his death in 1501; his brother Marco preceded him; died 20 September 1501", sources: [wp-agostino-barbarigo]}
  - {person: alauddin-husain-shah, title: Sultan of Bengal, realm: Bengal Sultanate, from: 1494, to: 1519, note: "The lead: r. 1494-1519 (the article also quotes 'between 1493 and 1519'; see discrepancy); succeeded by Nusrat Shah in 1519", sources: [wp-alauddin-husain-shah]}
  - {person: rana-raimal, title: Rana of Mewar, realm: Mewar, from: 1473, to: 1509, note: "The lead: r. 1473-1509; the next Rana of Mewar is Rana Sanga, from 24 May 1509", sources: [wp-rana-raimal]}
  - {person: naod, title: Emperor of Ethiopia, realm: Ethiopian Empire, from: 1494, to: 1507-07-31, note: "The lead: Emperor of Ethiopia from 1494 to 31 July 1507 (regnal name Anbasa Bazar)", sources: [wp-naod]}
  - {person: askia-muhammad-i, title: Askia of Songhai, realm: Songhai Empire, from: 1493, to: 1528, note: "Took power after the Battle of Anfao in April 1493 (month only) and reigned until forced to abdicate in August 1528 (month only); he was restored in April 1537 and lived to 1538 (not entered as a second row)", sources: [wp-askia-muhammad-i]}
  - {person: joao-i-of-kongo, title: Manikongo, realm: Kingdom of Kongo, from: 1470, to: 1509, note: "The lead: 5th ManiKongo of Kongo between 1470 and 1509; succeeded by his son Afonso I", sources: [wp-joao-i-of-kongo]}
  - {person: ozolua, title: Oba of Benin, realm: Kingdom of Benin, from: 1481, from_estimated: true, to: 1517, to_estimated: true, note: "Egharevba places his accession about 1481 (Kaplan 1481-1504; Blackmun about 1480-1517); the end is disputed: 1504 (Egharevba, Kaplan) against about 1517 (Blackmun; Bradbury: Portuguese reports point to a death in late 1516 or early 1517, and Hastings has him still ruling in 1514 and 1515). The row uses about 1517; see discrepancy", sources: [wp-ozolua]}
  - {person: ahuitzotl, title: Huey Tlatoani, realm: Aztec Empire, from: 1486, to: 1502, note: "The article: took power in 7 Rabbit (1486) after his brother Tizoc; died in 10 Rabbit (1502); succeeded by his nephew Moctezuma II. Huey Tlatoani of Tenochtitlan", sources: [wp-ahuitzotl]}

places:
  - key: novgorod
    name: Novgorod
    kind: city
    region: Novgorod Oblast
    country: Russia
    lat: 58.522
    lng: 31.269
    visitable: true
    note: "Rival republic annexed by Ivan III: Novgorod recognised his direct rule in a document sealed by Archbishop Feofil on 15 January 1478; its veche was abolished (Ivan III's article)."
    sources: [wp-ivan-iii-of-russia]
  - key: tabriz
    name: Tabriz
    kind: city
    region: East Azerbaijan
    country: Iran
    lat: 38.08
    lng: 46.292
    visitable: true
    note: "Capital of the Safavids; Ismail I took it in 1501 and was crowned shah there; Selim I entered it on 5 September 1514 after Chaldiran (Ismail I's article)."
    sources: [wp-ismail-i]
  - key: ardabil
    name: Ardabil
    kind: city
    region: Ardabil
    country: Iran
    lat: 38.249
    lng: 48.296
