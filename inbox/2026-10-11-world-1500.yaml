    about: [{person: ozolua}]
    field: to
    claims:
      - {value: "about 1504", sources: [wp-ozolua], note: "Egharevba places his last Uromi campaign about 1503 and Esigie's accession in 1504; Kaplan gives about 1481-1504"}
      - {value: "about 1517", sources: [wp-ozolua], note: "Blackmun dates the reign about 1480-1517 and Esigie about 1517-1550; Bradbury read Portuguese reports of 1516-1517 as the death of a Benin ruler in late 1516 or early 1517, though he called this speculative; Hastings has Ozolua still ruling in 1514 and 1515; Sargent dates Esigie about 1509-1536"}
