events:
  - key: annexation-of-novgorod-1478
    name: Annexation of Novgorod
    type: Conquest
    date: 1478-01-15
    place: novgorod
    people:
      - {person: ivan-iii-of-russia, role: victor}
    prominence: 4
    note: "After a first campaign in 1471 (the Shelon, 14 July; peace of 11 August 1471) and six years of factional strife, Ivan III marched against Novgorod in 1477; surrounded by his army, Novgorod recognised his direct rule over the city and its hinterland in a document signed and sealed by Archbishop Feofil on 15 January 1478. Ivan took more than four-fifths of its land, the veche and its offices were abolished, and the acquisition nearly doubled his realm; he then took the title sovereign of all Russia."
    sources: [wp-ivan-iii-of-russia]
  - key: great-stand-on-the-ugra-1480
    name: Great stand on the Ugra River
    type: Standoff
    year: 1480
    people:
      - {person: ivan-iii-of-russia, role: victor}
      - {person: mengli-i-giray, role: ally}
    prominence: 4
    note: "Ivan III refused tribute to Ahmed Khan of the Great Horde in 1476; in 1480 Ahmed invaded and the Muscovite and Tatar hosts faced each other across the Ugra River through the autumn until 11 November 1480, when Ahmed retreated into the steppe. Traditional Russian historiography marks it as the end of the 'Tatar yoke'. Menli I Giray's alliance with Ivan of 1480 was an important factor. The article gives no place beyond the river."
    sources: [wp-ivan-iii-of-russia, wp-mengli-i-giray]
  - key: battle-of-vedrosha-1500
    name: Battle of Vedrosha
    type: Battle
    date: 1500-07-14
    people:
      - {person: ivan-iii-of-russia, role: victor}
      - {person: alexander-jagiellon, role: defeated}
    prominence: 3
    note: "In the full-scale war that broke out in 1500 the Lithuanians were routed at Vedrosha on 14 July 1500 (Ivan III's article). Alexander could only garrison Smolensk and other strongholds, and his wife Helena mediated the truce of 25 March 1503, which gave up about a third of Lithuania (19 towns). The articles give no place."
    sources: [wp-ivan-iii-of-russia, wp-alexander-jagiellon]
  - key: capture-of-tabriz-1501
    name: Ismail I takes Tabriz
    type: Conquest
    year: 1501
    place: tabriz
    people:
      - {person: ismail-i, role: victor}
    prominence: 4
    note: "After beating the Shirvanshah (winter 1500) and the Aq Qoyunlu ruler Alvand at Sharur, Ismail occupied Tabriz, took the title Padshah-i Iran in July 1501 and made it the Safavid capital; Twelver Shi'ism was declared the official religion. The enthronement day is disputed (see discrepancy). Month of the occupation is not given."
    sources: [wp-ismail-i]
  - key: vasco-da-gama-route-to-india-1498
    name: Vasco da Gama reaches India
    type: Voyage
    year: 1498
    people:
      - {person: manuel-i-of-portugal, role: sponsor}
    prominence: 5
    note: "The discovery of a maritime route to India by Vasco da Gama in 1498, sponsored by Manuel I, which led to the Portuguese India Armadas and a Portuguese monopoly of the spice trade. Qansuh al-Ghawri's article adds that da Gama pushed across the Indian Ocean to Malabar and Kozhikode after the Cape in 1498. The Manuel article gives the year only, no place or day."
    sources: [wp-manuel-i-of-portugal, wp-qansuh-al-ghawri]
  - key: treaty-of-granada-1500
    name: Treaty of Granada (partition of Naples)
    type: Treaty
    date: 1500-11-11
    place: granada
    people:
      - {person: louis-xii-of-france, role: signatory}
      - {person: ferdinand-ii-of-aragon, role: signatory}
      - {person: frederick-of-naples, role: betrayed}
    prominence: 4
    note: "A secret treaty signed on 11 November 1500 by Louis XII and Ferdinand II (and Isabella) to conquer and divide the Kingdom of Naples: Louis would take Naples, Terra di Lavoro and the Abruzzo with the titles King of Jerusalem and King of Naples, Ferdinand Apulia and Calabria as duke (Frederick's article; Ferdinand's article gives Campania and the Abruzzi, including Naples, to the French). Pope Alexander VI named both kings his vassals; Frederick learned his fate from the announcement in the Vatican. The French and Aragonese forces occupied Naples in 1501; the agreement fell apart and Ferdinand won Naples by 1504."
    sources: [wp-louis-xii-of-france, wp-frederick-of-naples, wp-ferdinand-ii-of-aragon]
  - key: french-conquest-of-milan-1499
    name: French conquest of Milan
    type: Conquest
    year: 1499
    end_year: 1500
    people:
      - {person: louis-xii-of-france, role: victor}
    prominence: 3
    note: "On 10 August 1499 Marshal Trivulzio's army crossed into the Duchy of Milan; Ludovico Sforza fled on the night of 2 September and Louis XII entered Milan in triumph on 6 October 1499. Sforza returned in January-February 1500 (welcomed back on 5 February 1500), but was captured when La Tremoille retook the city, and spent the rest of his life in a French prison. Milan stayed French for twelve years; Louis remained Duke of Milan."
    sources: [wp-louis-xii-of-france]
  - key: templo-mayor-expansion-1487
    name: Expansion of the Templo Mayor
    type: Building
    year: 1487
    place: tenochtitlan
    people:
      - {person: ahuitzotl, role: patron}
    prominence: 3
    note: "Ahuitzotl supervised a major rebuilding of Tenochtitlan on a grander scale, including the expansion of the Great Pyramid or Templo Mayor in the year 8 Reed (1487). The article does not say it was a dedication."
    sources: [wp-ahuitzotl]
  - key: askia-muhammad-hajj-1496
    name: Askia Muhammad's pilgrimage to Mecca
    type: Pilgrimage
    year: 1496
    end_year: 1498
    place: mecca
    people:
      - {person: askia-muhammad-i, role: pilgrim}
    prominence: 3
    note: "Askia Muhammad made the hajj with 500 horsemen and 1,000 infantry, gave charitably, set up a hostel for West African pilgrims in Medina and returned to Gao nearly two years later with 50,000 ducats of debt and the titles al-Hajj and Khalifa. The dating is inconsistent in the article (see discrepancy): 1496 against 1497-1498."
    sources: [wp-askia-muhammad-i]
  - key: battle-of-chaldiran-1514
    people:
      - {person: ismail-i, role: defeated}
    sources: [wp-ismail-i]

