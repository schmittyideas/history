  - key: qansuh-al-ghawri-death
    question: How did Qansuh al-Ghawri die at Marj Dabiq on 24 August 1516?
    about: [{person: qansuh-al-ghawri}]
    field: died
    claims:
      - {value: "Killed on the field and his head carried to the Ottoman sultan", sources: [wp-qansuh-al-ghawri], note: "'Al-Ashraf Qansuh al-Ghuri himself fell upon the field and his head was carried to the Conqueror'; the Ottoman account has him beheaded by an Ottoman soldier whom Selim I would have put to death but pardoned"}
      - {value: "Found alive on the field, his head cut off and buried to keep it from the enemy", sources: [wp-qansuh-al-ghawri], note: "'According to some the Sultan was found alive on the field, and his head cut off and buried to prevent its falling into the enemy's hands'; the article adds that Khayr Beg spread a report of his death to precipitate the Egyptian flight"}
    note: "The record uses the date 24 August 1516 (the lead and the Marj Dabiq account); the manner of death is left open."
  - key: naod-death
