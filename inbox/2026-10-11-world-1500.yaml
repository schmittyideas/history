realms:
  - {name: Ava Kingdom,           region: Southeast Asia,              country: Myanmar, note: "Upper Burma; Minkhaung II was king 1480-1501 and saw Ava's hold decline (his article)"}
  - {name: Hanthawaddy Kingdom,   region: Southeast Asia,              country: Myanmar, note: "Mon kingdom of Lower Burma; Binnya Ran II was its 17th king, 1492-1526 (his article)"}
  - {name: Malacca Sultanate,     region: Southeast Asia,              country: Malaysia, note: "Mahmud Shah was sultan 1488-1511; Portugal took Malacca in 1511 (his article)"}
  - {name: Safavid Iran,          region: Middle East and North Africa, country: Iran, note: "Founded by Ismail I, shah from 1501; Twelver Shi'ism was made the state religion (his article)"}
  - {name: Crimean Khanate,       region: Eastern Europe,              country: Ukraine, note: "Menli I Giray was khan 1478-1515, a vassal of the Ottomans, and took Saray in 1502 (his article)"}
  - {name: Bengal Sultanate,      region: South Asia,                  country: Bangladesh, note: "Alauddin Husain Shah, founder of the Hussain Shahi dynasty, reigned 1494-1519 (his article)"}
  - {name: Songhai Empire,        region: Sub-Saharan Africa,          country: Mali, note: "Askia Muhammad I founded the Askia dynasty (reigned from 1493); Gao was the capital, Timbuktu a second capital (his article)"}
  - {name: Kingdom of Kongo,      region: Sub-Saharan Africa,          country: Angola, note: "Joao I (Nzinga a Nkuwu) was the fifth Manikongo, 1470-1509; Portuguese sailors arrived in 1483 (his article)"}
  - {name: Kingdom of Benin,      region: Sub-Saharan Africa,          country: Nigeria, note: "Ozolua was the fifteenth Oba; the first sustained contact with Portugal falls in his reign (his article)"}

people:
  - key: emperor-go-kashiwabara
    name: Emperor Go-Kashiwabara
    type: Royalty
    realm: Japan
    born: 1462-11-19
    died: 1526-05-18
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "104th emperor of Japan, first son of Emperor Go-Tsuchimikado; reigned from 16 November 1500 to 1526 (the lead gives 19 May 1526 as the end). His reign marked the nadir of imperial authority: after the Onin War the court was too poor to hold his formal coronation until 22 March 1521, with money from Honganji Jitsunyo and the Muromachi bakufu, and ceremonies were suspended in 1525 for lack of funds. Father of Emperor Go-Nara. Tomb at Fukakusa no kita no misasagi, Fushimi-ku, Kyoto."
    sources: [wp-emperor-go-kashiwabara]
  - key: ashikaga-yoshizumi
    name: Ashikaga Yoshizumi
    type: Royalty
    realm: Ashikaga shogunate
    house: Ashikaga
    born: 1481-01-15
    died: 1511-09-06
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "11th shogun of the Ashikaga shogunate, 1494-1508, son of Ashikaga Masatomo and adopted by the 8th shogun Ashikaga Yoshimasa. Installed as Sei-i Taishogun by Hosokawa Masamoto in 1494; stripped of the title in 1508 by the 10th shogun Ashikaga Yoshitane, who became shogun a second time. Called Yoshitoh, Yoshitaka and, from July 1502, Yoshizumi. Two of his sons became shoguns: Yoshiharu (12th, by Akiko) and Yoshihide (14th, nominal powers); Yoshitsuna was a son by a daughter of Shiba or Rokkaku."
    sources: [wp-ashikaga-yoshizumi]
  - key: le-hien-tong
    name: Le Hien Tong
    type: Royalty
    realm: Đại Việt
    house: Le
    born: 1461-08-10
    died: 1504-05-24
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "6th emperor of Vietnam's Le dynasty, reigning over Dai Viet from 1497 to 1504; son of Le Thanh Tong (1442-1497), whose legal code he promulgated. His death in 1504 marked the beginning of the sixteenth-century crisis of Dai Viet, which lasted 88 years until the Trinh lords drove the Mac dynasty from the capital Thang Long. The article is a short stub."
    sources: [wp-le-hien-tong]
  - key: ramathibodi-ii
    name: Ramathibodi II
    type: Royalty
    realm: Ayutthaya Kingdom
    house: Suphannaphum
    born: 1472
    born_estimated: true
    died: 1529
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Prince Chettathirat, youngest of Trailokanat's three sons, born 1472/73 (the article gives both years). King of Sukhothai from 1485, passed over when Borommaracha III took the throne in 1488, and King of Ayutthaya from 1491 to 1529 under the name Ramathibodi II, which reunified the two kingdoms. In 1500 he sent forces against the Sultanate of Malacca (failed, but won tribute from Malacca, Pattani, Pahang and Kelantan); repelled Lanna in 1513 and sacked Lampang in 1515; set up the Siamese corvee system in 1518; made a treaty with the Portuguese embassy of Duarte Fernandes in 1518 (the first Europeans to reach Siam). Died in July or on 10 October 1529 (see discrepancy), during Halley's Comet; succeeded by his son Borommaracha IV."
    sources: [wp-ramathibodi-ii]
  - key: minkhaung-ii
    name: Minkhaung II
    type: Royalty
    realm: Ava Kingdom
    born: 1446-10-09
    died: 1501-04-07
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "King of Ava from 1480 (regnal name Thirithuddhamma Yaza) to his death on 7 April 1501, eldest son of Thihathura. His 20-year reign began Ava's decline: Yamethin revolted at his accession and stayed independent; Prome and Tharrawaddy broke away in 1482; Mohnyin, Mogaung, Momeik and Kale left by the mid-1490s. He leaned on Mingyi Nyo of Toungoo, who killed his own uncle in 1485 and was formally granted Toungoo. Made his eldest son Thihathura II joint-king in 1485; the son died in March 1501, a month before him; succeeded by Narapati II (Shwenankyawshin)."
    sources: [wp-minkhaung-ii]
  - key: binnya-ran-ii
    name: Binnya Ran II
    type: Royalty
    realm: Hanthawaddy Kingdom
    born: 1469
    died: 1526
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "17th king of Hanthawaddy (Lower Burma) from 1492 to 1526, revered for gentleness though his first act was to put all royal kinsmen to death. Answered Mingyi Nyo of Toungoo's raid with a raid on Toungoo itself (the Ava article dates it 1495). In 1501 he led an army up the Irrawaddy to worship at the Shwezigon Pagoda at Pagan inside Ava's land, telling the king of Prome he could conquer both him and Ava but wished only to worship; he returned peacefully. At least four senior queens in 1495 and at least three sons."
    sources: [wp-binnya-ran-ii]
  - key: mahmud-shah-of-malacca
    name: Mahmud Shah of Malacca
    type: Royalty
    realm: Malacca Sultanate
    died: 1528
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Sultan of Malacca from 1488 to 1511, installed very young on his father Alauddin Riayat Shah's death, with the bendahara Tun Perak as regent (Perak died 1498). Known as ruthless; executed Bendahara Tun Mutahir and his family. After Diogo Lopes de Sequeira's visit (1509-1510) he plotted to kill him; Afonso de Albuquerque took Malacca in 1511. He fled to Pahang and then Bintan, led a Malay confederacy that attacked Portuguese Malacca in 1515-1519, killed his son Ahmad Shah in 1513 and was pretender 1513-1528; the Portuguese destroyed Bintan in 1526 and he died in Kampar, Riau in 1528. Father of Muzaffar Shah (Perak) and Alauddin Riayat Shah II (Johor)."
    sources: [wp-mahmud-shah-of-malacca]
  - key: qansuh-al-ghawri
    name: Al-Ashraf Qansuh al-Ghawri
    type: Royalty
    realm: Mamluk Sultanate
    house: Burji
    died: 1516-08-24
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Penultimate Mamluk sultan, one of the last and most powerful of the Burji dynasty, who reigned from 1501 to 1516. Born between 1441 and 1446 (the article gives no year), bought by Qaitbay and schooled at the al-Ghuri military school in Cairo; made sultan against his will after a revolt of emirs against Tuman bay I. Cast guns on a scale new to the Mamluks and fitted out a fleet of 50 ships against the Portuguese (defeated at Diu in 1509 after winning at Chaul in 1508). Received an envoy of the King of Georgia on 15 June 1512. Led the army against Selim I and fell at Marj Dabiq near Aleppo on 24 August 1516, betrayed by Janbirdi al-Ghazali and Khayr Beg; the Mamluk state fell to the Ottomans. Not yet sultan at 1500."
    sources: [wp-qansuh-al-ghawri]
  - key: ismail-i
    name: Ismail I
    type: Royalty
    realm: Safavid Iran
    house: Safavid
    born: 1487-07-17
    died: 1524-05-23
    prominence: 5
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Founder and first shah of Safavid Iran, ruling from 1501 to his death in 1524. Born at Ardabil, son of Shaykh Haydar; his father was killed in 1488, and he hid in Gilan from 1494. With about 7,000 Qizilbash at Erzincan in the summer of 1500 he marched on Shirvan, won at Sharur against the Aq Qoyunlu and took Tabriz in 1501, was crowned shah there in 1501 (see discrepancy) and made Twelver Shi'ism the official religion. By 1510 he held all of Iran, Mesopotamia (Baghdad in 1508), Khorasan and the Caucasus, and killed Muhammad Shaybani at Merv in 1510. Beaten by Selim I at Chaldiran in 1514, wounded and almost captured; thereafter he drank heavily and never campaigned again. Wrote Turkic poetry as Khata'i. Died 23 May 1524 aged 36, buried in Ardabil; succeeded by his eldest son Tahmasp I."
    sources: [wp-ismail-i]
  - key: husayn-bayqara
    name: Sultan Husayn Bayqara
    type: Royalty
    realm: Timurid Empire
    house: Timurid
    born: 1438
    died: 1506-05-04
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Timurid ruler of Herat from 1469 until his death on 4 May 1506, with a brief interruption in 1470; the last Timurid ruler of consequence in Khorasan. Born in Herat in June or July 1438 (the article gives both months). After years as a mercenary in Merv and Khwarazm he took Herat on 24 March 1469, beat Yadgar Muhammad at Chenaran on 15 September 1469 and held the Oxus as his border. Patron of the poets Jami (died 1492) and Ali-Shir Nava'i (died 1501) and of an 'explosion of architecture' in Herat (a madrasa and mausoleum in the Musalla complex, where he is buried; the palace Bagh-e Jahan-ara); ill with palsy for twenty years. A son, Badi' al-Zaman, besieged Herat in 1499. Babur's Transoxiana fell to the Uzbeks in 1501; Husayn died as he began to march against them. The article calls him ruler of Herat and Khurasan and styles him Sultan; the row says 'Sultan of Herat'."
    sources: [wp-husayn-bayqara]
  - key: mengli-i-giray
    name: Meñli I Giray
    type: Royalty
    realm: Crimean Khanate
    house: Giray
    born: 1445
    died: 1515
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Sixth son of Haci I Giray, thrice khan of the Crimean Khanate (1466, 1469-1475 and 1478-1515). After the Ottomans took Kaffa in May 1475 he was carried to Constantinople and restored in the spring of 1478 as an Ottoman vassal. Allied with Ivan III of Moscow in 1480 against Poland-Lithuania, the Great Horde and Astrakhan, a factor in the stand on the Ugra; ravaged Kiev in September 1482; devastated Podolia and Volyn from 1489 to 1500. In 1502 he beat the last khan of the Golden Horde, took Saray and proclaimed himself Khagan. Buried in the Durbe of Salaciq in Bakhchysarai, where he commissioned the Zincirli Medrese (1500), the Durbe (1501) and the Demir Qapi (1503). Father of Mehmed I Giray and Sahib I Giray."
    sources: [wp-mengli-i-giray]
  - key: ivan-iii-of-russia
    name: Ivan III of Russia
    type: Royalty
    realm: Grand Duchy of Moscow
    house: Rurikid
    born: 1440-01-22
    died: 1505-10-27
    prominence: 5
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Ivan the Great, Grand Prince of Moscow and all Russia from 1462 until his death on 27 October 1505, co-ruler with his blind father Vasily II beforehand. Gathered the Russian lands: beat Novgorod at the Shelon on 14 July 1471 and annexed it on 15 January 1478, took Tver (1485) and Vyatka (1489); his stand on the Ugra in 1480 ended the Tatar yoke. Married Sophia Palaiologina in 1472, took the double-headed eagle and the title tsar in correspondence with other monarchs; rebuilt the Moscow Kremlin; a new law code (Sudebnik). Beat Alexander of Lithuania at Vedrosha on 14 July 1500 and won 19 towns by the truce of 1503. Set aside his grandson Dmitry for Vasily III, crowned co-regent on 14 April 1502. Allied with Hans of Denmark and with Menli I Giray."
    sources: [wp-ivan-iii-of-russia]
  - key: alexander-jagiellon
    name: Alexander Jagiellon
    type: Royalty
    realm: Grand Duchy of Lithuania
    house: Jagiellon
    born: 1461-08-05
    died: 1506-08-19
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Fourth son of Casimir IV, elected Grand Duke of Lithuania in July 1492 and King of Poland from 1501 until his death in 1506 (elected 3 October, crowned 12 December 1501, after the sudden death of John I Albert on 17 June 1501). Made peace with Ivan III in 1494 and married Ivan's daughter Helena in Vilnius on 15 February 1495; the war resumed in 1500 and the Lithuanians were routed at Vedrosha, so the truce of 25 March 1503 cost about a third of Lithuania (19 towns). In Poland the Sejm took away his control of the mint and passed the Nihil novi act in 1505. Favoured the Lithuanian magnate Michael Glinski, whose victory at Kletsk on 5 August 1506 reached him on his deathbed in Vilnius. His sarcophagus was found in Vilnius Cathedral in 1931. Brother of Vladislaus II."
    sources: [wp-alexander-jagiellon]
  - key: vladislaus-ii-of-hungary
    name: Vladislaus II of Hungary
    type: Royalty
    realm: Hungary
    house: Jagiellon
    born: 1456-03-01
    died: 1516-03-13
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Eldest son of Casimir IV, King of Bohemia from 1471 (elected 27 May, crowned 22 August 1471 at Prague) and of Hungary and Croatia from 1490 (elected 15 July, crowned 18 September 1490 at Szekesfehervar), to his death in Buda on 13 March 1516. Divided the Bohemian lands with Matthias Corvinus at the Peace of Olomouc (21 July 1479), accepted Hussite/Catholic parity in 1485, and won Hungary against John Corvinus, Maximilian and his brother John Albert (Peace of Pressburg, 7 November 1491). Known as 'Dobzse Laszlo' ('Very Well') for approving every decision of the Royal Council; the Black Army was dissolved in 1493 and the Ottomans crushed the Croats at Krbava Field on 11 September 1493. Vladislav Hall at Prague Castle (1493-1502); the Vladislav land order signed in 1502. Married Barbara of Brandenburg (1476), Beatrice of Naples (1490) and Anne of Foix (crowned 29 September 1502); father of Louis II. Funeral at Szekesfehervar."
    sources: [wp-vladislaus-ii-of-hungary]
  - key: hans-of-denmark
    name: Hans of Denmark
    type: Royalty
    realm: Denmark
    house: Oldenburg
    born: 1455-02-02
    died: 1513-02-20
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Hans (John), eldest surviving son of Christian I, born probably at Aalborg. King of Denmark from 1482 (crowned at Copenhagen on 18 May 1483), of Norway from 1483 (crowned at Trondheim on 20 July 1483) and, as Johan II, of Sweden from 1497 to 1501, ruled under the Kalmar Union. Co-duke of Schleswig and Holstein with his brother Frederick (divided in 1490). Beat Sten Sture at Rotebro on 28 September 1497 and was crowned in Stockholm; lost the Swedes in August 1501 and was never allowed into Stockholm again after the settlement of 1507-1509; was crushed by the Dithmarschen peasants at Hemmingstedt in February 1500. Founded a permanent Danish navy; allied with Ivan III of Moscow. Married Christina of Saxony in 1478. Died at Aalborghus Castle after a fall from his horse; buried in the Franciscan friary church at Odense, later moved to St Canute's Cathedral; succeeded by Christian II."
    sources: [wp-hans-of-denmark]
  - key: manuel-i-of-portugal
    name: Manuel I of Portugal
    type: Royalty
    realm: Portugal
    house: Aviz
    born: 1469-05-31
    died: 1521-12-13
    prominence: 4
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Manuel the Fortunate, born at Alcochete, ninth child of Ferdinand, Duke of Viseu; Duke of Beja and Viseu before succeeding his cousin John II in 1495. His reign (1495-1521) saw Vasco da Gama reach India (1498), Cabral reach Brazil (1500), the capture of Goa (1510), Malacca (1511) and Ormuz (1515); he founded the Casa da India, built in the Manueline style (Jeronimos Monastery) and issued the Manueline Ordinances. Decreed in 1496 that Jews convert or leave, then converted them all. Married three times: Isabella of Aragon (1497-1498), Maria of Aragon (1500-1517) and Eleanor of Austria (1518-1521). Died of fever at Ribeira Palace, Lisbon, on 13 December 1521; first buried at Restelo Church, moved to the Jeronimos in 1551."
    sources: [wp-manuel-i-of-portugal]
  - key: ferdinand-ii-of-aragon
    name: Ferdinand II of Aragon
    type: Royalty
    realm: Aragon
    house: Trastamara
    born: 1452-03-10
    died: 1516-01-23
    prominence: 4
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Ferdinand the Catholic, born at Sos del Rey Catolico, King of Aragon from 1479 to his death in 1516 and King of Castile (as Ferdinand V) from 1475 to 1504 jointly with Isabella I, whom he married on 19 October 1469 at Valladolid. With her he took Granada in 1492, issued the Alhambra Decree (March 1492), sponsored Columbus and signed the Treaty of Tordesillas (1494). Drove the French out of Naples (by 1496), made the partition agreement with Louis XII in 1500 and won Naples himself by 1504 through Gonzalo Fernandez de Cordoba. Regent of Castile for Joanna from 1507, conquered most of Navarre in 1512. Married Germaine of Foix in 1506 (Blois). Died at Madrigalejo and was entombed in the Capilla Real, Granada."
    sources: [wp-ferdinand-ii-of-aragon]
  - key: frederick-of-naples
    name: Frederick of Naples
    type: Royalty
    realm: Naples
    house: Trastamara
    born: 1452-04-19
    died: 1504-11-09
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Frederick IV or Frederick of Aragon, born at Naples, second son of Ferdinand I and the last king of Naples of the Neapolitan Trastamara line, ruling from 1496 to 1501 after his nephew Ferdinand II; crowned on 26 June 1497. Raised at the courts of Burgundy and of Louis XI (married Anne of Savoy, 1478 or 1479 by the article's two statements, she died in 1480; then Isabella del Balzo). Betrayed by his cousin Ferdinand of Aragon in the secret Treaty of Granada of 11 November 1500 and deposed in 1501 by Louis XII of France and Ferdinand; he first learned of it from the announcement in the Vatican. Given the county of Maine and a pension, he followed Louis, returned to Tours in March 1503 and died there on 9 November 1504."
    sources: [wp-frederick-of-naples]
  - key: louis-xii-of-france
    name: Louis XII of France
    type: Royalty
    realm: France
    house: Valois-Orleans
    born: 1462-06-27
    died: 1515-01-01
    prominence: 4
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Louis of Orleans, born at the Chateau de Blois, Duke of Orleans from the age of three, who rebelled in the Mad War and was captured at Saint-Aubin-du-Cormier on 28 July 1488. Succeeded his cousin Charles VIII as King of France on 7 April 1498, had his marriage to Joan annulled and married Anne of Brittany; later Mary Tudor (9 October 1514). 'Father of the People' (1506) for lower taxes and legal reform (Ordinance of Blois, 1499). Invaded Milan in August 1499 (entry on 6 October), lost and retook it in early 1500, signed the Treaty of Granada with Ferdinand on 11 November 1500 and took Naples in 1501 (King of Naples as Louis III, 1501-1504); won Agnadello on 14 May 1509 but lost Milan to the Swiss in 1513. Died on the night of 1 January 1515; interred at Saint-Denis; succeeded by Francis I."
    sources: [wp-louis-xii-of-france]
  - key: agostino-barbarigo
    name: Agostino Barbarigo
    type: Nobility
    realm: Venice
    house: Barbarigo
    born: 1419-06-03
    died: 1501-09-20
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Doge of Venice from 1486 to his death on 20 September 1501, brother of Doge Marco Barbarigo, who held office less than a year. The Clock Tower in the Piazza San Marco was designed and completed in his reign. Built the Italian coalition of 1495 against Charles VIII (Fornovo); Venice annexed Cyprus and several Romagna strongholds. Relations with Bayezid II turned to open war in 1499 (defeat at Zonchio, loss of Lepanto, then Modone and Corone); against his own wish Venice signed the Treaty of Blois with Louis XII in February 1499 against Milan. Peace with the Ottomans came in 1503 (after his death). His dogaressa was Elisabetta Soranzo."
    sources: [wp-agostino-barbarigo]
  - key: narasimha-raya-ii
    name: Narasimha Raya II
    type: Royalty
    realm: Vijayanagara Empire
    house: Saluva
    born: 1468
    died: 1505
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Immadi Narasimha Raya, third and last emperor of the Saluva dynasty, born 1468, who came to the throne as a teenager after his father Saluva Narasimha died in 1491 and his elder brother Thimma Bhupala was assassinated within weeks. Real power lay with the regent Tuluva Narasa Nayaka until 1503, then with the regent's son Tuluva Vira Narasimha Raya, who made himself Dalavayi and Sarvadhikari. Assassinated in 1505 at the fortress of Penukonda, probably by Vira Narasimha's men; the Tuluva dynasty followed. NO TITLE ROW: the article never gives the year his reign began (see header)."
    sources: [wp-narasimha-raya-ii]
  - key: alauddin-husain-shah
    name: Alauddin Husain Shah
    type: Royalty
    realm: Bengal Sultanate
    house: Hussain Shahi
    died: 1519
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Founder of the Hussain Shahi dynasty and an independent Sultan of Bengal, r. 1494-1519, who seized the throne by assassinating the Abyssinian Sultan Shamsuddin Muzaffar Shah (r. 1491-1493), whom he had served as wazir; his origin is uncertain (Sayyid Arab, with a Bengali mother in one account). Disbanded the palace guard and removed Habshis from office; sheltered Husain Shah Sharqi of Jaunpur, which led to Sikandar Lodi's expedition of 1496 and a treaty at Barh dividing the land east and west. Took Kamata-Kamrup (invasion of 1499) with his general Shah Ismail Ghazi; Orissa was a vassal by 1515; pushed into Sylhet and Kachar and sent armies to Tripura. Built the Kherur Mosque at Chandpara in 1494. Reigns of Husain Shah and Nusrat Shah are the 'golden age' of the sultanate. Died in 1519; possibly buried at Gaur; succeeded by his son Nusrat Shah."
    sources: [wp-alauddin-husain-shah]
  - key: rana-raimal
    name: Rana Raimal
    type: Royalty
    realm: Mewar
    house: Sisodia
    died: 1509
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Rana Raimal Singh, Rajput ruler of Mewar r. 1473-1509, younger son of Rana Kumbha and father of Rana Sanga. Came to power by defeating his patricide brother Rana Udai Singh I (who had killed Kumbha and ruled five years) at Jawar, Darimpur and Pangarh. Beat Ghiyas Shah of Malwa's attack on Chittor and his general Zafar Khan at Mandalgarh and Kairabad; married Shringar Devi, daughter of Rao Jodha, ending the conflict with the Rathores; Godwar, Toda and Ajmer were retaken by his eldest son Prithviraj; repaired the Eklingji temple at Chittor. His last years were marked by conflict between his sons (Prithviraj and Jaimal were killed) and Sanga was recalled to Chittor before Raimal died."
    sources: [wp-rana-raimal]
  - key: naod
    name: Na'od
    type: Royalty
    realm: Ethiopian Empire
    house: Solomonic
    died: 1507
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Emperor of Ethiopia from 1494 to 31 July 1507 (regnal name Anbasa Bazar), second son of Baeda Maryam I and Kalyupe, born at Gabarge. Relied like his predecessor on the Queen Mother Eleni and faced internal dissension, but won many victories over Muslim forces. A poet in Amharic and Ge'ez and an author of religious books. Began the Mekane Selassie church in Amhara (completed by his son Lebna Dengel in 1530; burned by Ahmad ibn Ibrahim on 3 November 1531), where he was buried. Killed in battle (see discrepancy). Father of Lebna Dengel, who succeeded him."
    sources: [wp-naod]
  - key: askia-muhammad-i
    name: Askia Muhammad I
    type: Royalty
    realm: Songhai Empire
    house: Askia
    born: 1443
    died: 1538
    prominence: 4
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Askia the Great (Muhammad Ture), general under Sunni Ali, who rose in 1492 against Sunni Baru, beat him at Anfao outside Gao in April 1493 and took the title Askia. Made the hajj (see discrepancy) with 500 horse and 1,000 foot and returned with the titles al-Hajj and Khalifa. Expanded the empire from Taghaza to the borders of Yatenga and from Air to Futa Djallon (Kano and Hausa lands, Agadez in 1515, Diafunu in 1501), set up provinces, ministries and a professional slave army with Gao as capital and Timbuktu a second capital, and based law on the sharia. Went blind; forced to abdicate by his son Askia Musa in August 1528, exiled to an island in the Niger and restored in April 1537 with his son Ismail. Died in 1538 and was buried in Gao."
    sources: [wp-askia-muhammad-i]
  - key: joao-i-of-kongo
    name: Joao I of Kongo
    type: Royalty
    realm: Kingdom of Kongo
    house: Kongo
    born: 1440
    born_estimated: true
    died: 1509
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Nzinga a Nkuwu, fifth Manikongo of Kongo from 1470 to 1509. A Portuguese caravel under Diogo Cao reached the Congo estuary in 1483; Kongo emissaries taken to Lisbon were baptised and returned in 1491. He was baptised on 3 May 1491 and took the name Joao, built a church and used Portuguese soldiers against Bateke raiders in Nsundi, but gave up the faith in 1495 (the church required monogamy). Kongo had grown to 100,000 square kilometres under him. Married his first cousin Queen Nzinga a Nlaza; their son Nzinga Mbemba (Afonso I) succeeded him in 1509."
    sources: [wp-joao-i-of-kongo]
  - key: ozolua
    name: Ozolua
    type: Royalty
    realm: Kingdom of Benin
    house: Eweka
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Okpame (Okpamen), youngest son of Ewuare, fifteenth Oba of Benin, called Ozolua n'Ibaromi (the Conqueror). Said to have killed Prince Owere before being exiled to Ora; recalled after about three years of rule by the Uzama chiefs and crowned at Usama. Frequent campaigns in Ishan, Uromi, Uzea and Owo; the first sustained Portuguese contact (Joao Afonso d'Aveiro in 1485 or 1486, with a trading post at Ughoton) falls in his reign. Egharevba dates his accession to about 1481. His reign end is disputed (see discrepancy); died violently on his last campaign in the Uromi-Uzea region. Father of Esigie and Aruanran. No birth or death year in the article."
    sources: [wp-ozolua]
  - key: ahuitzotl
    name: Ahuitzotl
    type: Royalty
    realm: Aztec Empire
    house: Mexica
    died: 1502
    prominence: 4
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Eighth ruler of the Mexica, Huey Tlatoani of Tenochtitlan, son of Atotoztli II, who took power in 7 Rabbit (1486) after his brother Tizoc and died in 10 Rabbit (1502); succeeded by his nephew Moctezuma II. Perhaps the greatest military leader of pre-Columbian Mesoamerica: put down a Huastec revolt, more than doubled Aztec lands and conquered the Mixtec, Zapotec and others from the Pacific coast to western Guatemala. Oversaw a major rebuilding of Tenochtitlan including the expansion of the Templo Mayor in 8 Reed (1487). Father of Chimalpilli II and Cuauhtemoc."
    sources: [wp-ahuitzotl]
  - key: huayna-capac
    name: Huayna Capac
    type: Royalty
    realm: Inca Empire
    house: Hanan
    died: 1527
    prominence: 4
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Eleventh Sapa Inca of Tawantinsuyu, son and successor of Tupac Inca Yupanqui (r. 1471-1493), born before 1493 (the exact place and date are unknown; he may have been born in 1468 at Tumebamba). Tawantinsuyu reached its greatest extent under him: south along the Chilean coast, north through Ecuador and southern Colombia (the story of Quito and Paccha Duchicela comes from Juan de Velasco); rebuilt Quito as a second capital, developed Cochabamba and greatly extended the road network and qullqa storehouses. Knew of the Spanish off the coast by 1515. Died in 1527 at Quito, possibly of a European disease; his death and that of his heir Ninan Cuyochi began the civil war between Huascar and Atahualpa. NO TITLE ROW: the article gives no year for the start of his reign (see header)."
    sources: [wp-huayna-capac]

