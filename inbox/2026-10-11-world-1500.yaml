batch:
  title: "The world in 1500: rulers of the main states"
  requested: "One ruler for each major state on the Year-view map at 1500 (snapshot-year batch of the build-out), with a few dated events of 1478-1501"
  date: 2026-10-11

# Notes for the reviewer
# - Source: local copies of the English Wikipedia articles (wp6 directory); nothing was fetched. Line 1-3 of every file was checked. 28 of the 29 plan lines had the right article and none is a disambiguation page. GAP: Mahmud_Shah_Bahmani has no file in wp6 (the Bahmani Sultanate, an existing realm, therefore has no ruler in this batch). Headings that differ from the plan title: Qansuh_al-Ghawri is "Al-Ashraf Qansuh al-Ghuri" (key qansuh-al-ghawri), Husayn_Bayqarah is "Sultan Husayn Bayqara" (key husayn-bayqara), Mengli_I_Giray is "Menli I Giray" (key mengli-i-giray), John,_King_of_Denmark is "Hans, King of Denmark" (key hans-of-denmark), Frederick_IV_of_Naples is "Frederick of Naples" (key frederick-of-naples), Immadi_Narasimha_Raya is "Narasimha Raya II" (key narasimha-raya-ii), Nzinga_a_Nkuwu is "Joao I of Kongo" (key joao-i-of-kongo), Louis_XII_of_France is "Louis XII" (key louis-xii-of-france), Askia_Mohammad_I is "Askia Muhammad I" (key askia-muhammad-i), Lê_Hiến_Tông keeps its plan title (key le-hien-tong), Na'od (key naod), Ismail_I (key ismail-i). The Lê Hiến Tông, Binnya Ran II, Ashikaga Yoshizumi, Rana Raimal, Narasimha Raya II, Ahuitzotl, Joao I of Kongo, Ramathibodi II and Menli articles are short and were read in full; the long ones (Ismail I, Ivan III, Vladislaus II, Hans, Louis XII, Askia, Ozolua, Alauddin Husain Shah, Husayn Bayqara) were read through the reign, death and succession. Not worked through: Ozolua's long sections on the Portuguese trading post, art and traditions; Alauddin Husain Shah's Tripura/Arakan, culture and architecture sections; Louis XII's later reign after 1500 beyond the Italian wars; the family sections of Husayn Bayqara and Ismail I.
# - New realms (9): Ava Kingdom, Hanthawaddy Kingdom, Malacca Sultanate, Safavid Iran, Crimean Khanate, Bengal Sultanate, Songhai Empire, Kingdom of Kongo, Kingdom of Benin (all from the plan lines; spellings and regions as in the plan). The plan also lists Inca Empire (Huayna Capac) but no title row was entered for him (see below), so that realm is NOT defined here; whoever adds his reign defines it (Americas, Peru). Realms only referenced: Mamluk Sultanate, Grand Duchy of Moscow, Grand Duchy of Lithuania, Ethiopian Empire (the 1300 batch), Aragon (the 1100 batch), Aztec Empire and Ayutthaya Kingdom (the 1400 batch); existing realms Japan, Ashikaga shogunate, Dai Viet, Timurid Empire, Mewar, Vijayanagara Empire, Poland, Hungary, Bohemia, Denmark, Norway, Sweden, Portugal, Naples, France, Venice. So the 1100, 1300 and 1400 batches must be applied first. The sources wp-battle-of-chaldiran and the event battle-of-chaldiran-1514 are in the Ottoman batch (2026-10-11-ottoman-seljuk-rum.yaml); that batch must be applied first too.
# - Title wording differs from the plan where the article gives another rank, or where the plan wording is not in the article. Husayn Bayqara: the article calls him 'the Timurid ruler of Herat' (also 'ruler of Khurasan', and styles him Sultan), so the row reads 'Sultan of Herat' in realm Timurid Empire, not the existing 'Amir of the Timurid Empire'; the realm now has two wordings, each following its article. Binnya Ran II: 'King of Hanthawaddy' (the article: 'king of the Kingdom of Hanthawaddy'; the plan wording 'King of Pegu' is not in it). Ismail I: 'Shah of Iran' (plan), from the article's 'founder and first shah of Safavid Iran, ruling from 1501'; the article also says he took 'Padshah-i Iran (King of Iran)' in July 1501 and 'Shah of Iran' after a victory in 1502 (see discrepancy). Joao I: 'Manikongo' (plan; the article spells ManiKongo). Ahuitzotl: 'Huey Tlatoani' (the article: 'Huey Tlatoani of the city of Tenochtitlan'), unlike Huitzilihuitl's 'Tlatoani of Tenochtitlan' in the 1400 batch, because his article gives the 'Huey' form. Ramathibodi II: 'King of Ayutthaya' (the plan; the article also makes him King of Sukhothai 1485-1491, not entered: no Sukhothai realm). Alexander Jagiellon: 'Grand Duke of Lithuania' (the article's wording; same as Vytautas's row from the 1400 batch) and 'King of Poland'. Qansuh: 'Mamluk Sultan' (the article: penultimate Mamluk Sultan). Na'od: 'Emperor of Ethiopia' (same as Dawit I in the 1400 batch). Mahmud Shah: 'Sultan of Malacca'. Hans: 'King of Denmark / Norway / Sweden'. Meñli: 'Khan of Crimea' (the article: khan of the Crimean Khanate; it also says he proclaimed himself Khagan in 1502).
# - Title rows NOT entered because the article states no start of the reign: (1) Narasimha Raya II (Vijayanagara Emperor): his article gives only the death of his father Saluva Narasimha in 1491 ('the elder son was assassinated within a few weeks... this brought the second son to the throne') and the regency of Tuluva Narasa Nayaka for twelve years until 1503; it never gives his own accession year, so the person is entered with no title (a reviewer who accepts 1491 as 'his father's death and the next weeks' can add the row, end 1505, killed at Penukonda; the Vijayanagara Empire has no ruler at 1500 in this batch until then). (2) Huayna Capac (Sapa Inca, realm Inca Empire): the article gives his father Tupac Inca Yupanqui's reign as 1471-1493, his own birth only as 'before 1493', and his death in 1527; no accession year, so no title and no Inca Empire realm. (3) Mahmud Shah Bahmani: no article file (gap above).
# - Other titles NOT entered: Ferdinand II of Castile 1475-1504 (Isabella I is the Castilian ruler in the database; the plan asked only for Aragon; the article makes him king of Castile jure uxoris from Isabella's succession in 1474, as 'Ferdinand V', and regent from 1507); Ferdinand as king of Navarre (conquered 1512; no start date) and of Naples/Sicily/Valencia/Sardinia/Mallorca; Louis XII as King of Naples (as Louis III, 1501-1504, lead years only), as Duke of Milan (the article gives the conquest of 1499-1500 but no accession date for the duchy; the Milan realm has no ruler at 1500 here) and Duke of Orleans; Hans as Duke of Schleswig and Holstein (1482-1513, with his brother Frederick); Vladislaus's other titles (King of Croatia 1490-1516, Dalmatia and so on); Ramathibodi II as King of Sukhothai 1485; Menli I Giray's earlier reigns of 1466 (elected 1468 by the nobles, per the article) and 1469-1475 (the row is the third reign, 1478-1515, which covers 1500); Askia Muhammad's second reign of April 1537 to his death (he returned in 1537, conferred the regalia on his son Ismail); Mahmud Shah of Malacca as pretender 1513-1528; Alexander Jagiellon's Polish row starts at his coronation (12 December 1501, per the Alexander article), the election was on 3 October 1501.
# - Not ruler at exactly 1500: Qansuh al-Ghawri (Mamluk Sultan from 1501; the article's lead says 1501-1516 and gives no day, so the row starts 1501; the Mamluk throne at 1500 is not covered by any article in this batch), Ismail I (Shah from 1501; he was in the field in 1500 with 7,000 Qizilbash at Erzincan), Alexander Jagiellon in Poland (1501), Minkhaung II (died 7 April 1501, but ruled all of 1500), Go-Kashiwabara (he became emperor on 16 November 1500; the lead gives the day), Binnya Ran II and the others rule through 1500. Louis XII, Manuel I, Vladislaus II and Frederick of Naples (1496-1501) are rulers in 1500.
# - Dates given as year because the article gives no day or only a month: Hans's accession in Denmark (1482; the article says acclaimed in spring 1482, crowned at Copenhagen on 18 May 1483), in Norway (1483; the coronation at Trondheim was on 20 July 1483) and in Sweden (1497, crowned at Stockholm five days after the settlement of 6 October 1497, so about 11 October, an inference not entered); the end of his Swedish reign (1501: the Swedes renounced allegiance in August 1501, no day); Askia Muhammad's accession (the Battle of Anfao in April 1493, month only) and abdication (August 1528); Ismail's accession (July 1501 or 22 December 1501, see discrepancy); Frederick of Naples's accession (1496; the coronation was on 26 June 1497); Louis XII's accession IS dated (7 April 1498); Alauddin Husain Shah (1494); Rana Raimal (1473-1509); Ramathibodi II's birth ('1472/73', so 1472 marked estimated) and death (July or 10 October 1529, see discrepancy); Ahuitzotl (7 Rabbit = 1486; 10 Rabbit = 1502); Narasimha Raya II's death year only (1505).
# - Moment years are integers only (checked). Coordinates are general knowledge, 2-3 decimals; Aalborghus Castle, Madrigalejo, Penukonda and the Jeronimos are the article's names. Buried at Granada: Ferdinand's entombment year is not given, so that moment has no year. Husayn Bayqara died after beginning to march against the Uzbeks; the article gives no place of death. Alauddin Husain Shah is 'possibly buried in Gaur near the Qadam Rasul Mosque' (not entered as a moment). Askia was exiled to an island in the Niger; he died and was buried in Gao in 1538.
# - Discrepancies recorded below (8): when and how Ismail I became shah; when Alauddin Husain Shah's reign began (1493 or 1494); when Askia Muhammad made the pilgrimage (1496 or 1497-1498); when Ozolua's reign ended (c. 1504 or c. 1517); how Qansuh al-Ghawri met his end; how and where Na'od died; the date of Ramathibodi II's death (July or 10 October 1529); when Frederick of Naples married Anne of Savoy (11 September 1478 or summer 1479). Seen and not entered (a range inside one article, a calendar point, or not about a record here): Go-Kashiwabara's death (the lead gives 18 May 1526; the body gives the Daiei 6, 4th month, 7th day, which is the same day, but writes it '(1525)', a calendar-conversion slip, so the record uses 18 May 1526); Go-Kashiwabara's coronation delayed to 22 March 1521 for lack of money; Husayn Bayqara's birth 'June or July 1438' and his interruption of 1470 (the Aq Qoyunlu held Herat from 7 July 1470 for six weeks); the Ottoman raid and Zonchio dates for Agostino Barbarigo; Qansuh's birth ('between 1441 and 1446': no born year entered); Huayna Capac's birth ('may have been born in 1468 at Tumebamba', lead 'Tumipampa', 'exact place and date unknown'); Ozolua's Portuguese contact of 1485 or 1486 (a range) and the name of the place he died; Mahmud Shah of Malacca's succession (Ahmad Shah, killed by his father in 1513, no accession year); the Hungarian coronation, 18 September 1490, against the election, 15 July 1490 (the row uses the coronation, like the Polish rows).
# - Events: 9 new events (Annexation of Novgorod 1478, Great stand on the Ugra 1480, Battle of Vedrosha 1500, Capture of Tabriz 1501, Vasco da Gama's route to India 1498, Treaty of Granada 1500, French conquest of Milan 1499-1500, Expansion of the Templo Mayor 1487, Askia Muhammad's pilgrimage 1496-1498) and 1 link-only update to an existing event (battle-of-chaldiran-1514 gets Ismail I as defeated). Left out for size: Cabral's voyage to Brazil (1500, year only in Manuel's article), the Battle of Hemmingstedt (Hans's defeat by the Dithmarschen peasants, the advance on 17 February 1500 and the battle the next day or so: the article gives no clear battle date), the Battle of Rotebro (28 September 1497), the Battle of Krbava Field (11 September 1493) and Vladislaus's election, Ferdinand's fall of Granada (Castile's, existing fall-of-granada-1492), the Battle of Merv (1510), Marj Dabiq (24 August 1516), Chaldiran is link-only. The brief's Union of Mielnik 1501 is NOT in the Alexander Jagiellon article (nor in Ivan III's or Vladislaus's), so it is left out; the Treaty of Granada is dated 11 November 1500 in both the Louis XII and Frederick of Naples articles (the Ferdinand article says only 1500, no day). The Great Temple event is called an expansion because the Ahuitzotl article says 'expansion of the Great Pyramid or Templo Mayor in 8 Reed (1487)'; it says nothing of a dedication.
# - Existing records reused, not redefined: people isabella-i-of-castile, rana-sanga, rana-kumbha, selim-i; places moscow (not used), krakow, prague, szekesfehervar, budapest, vilnius-cathedral, lisbon, granada, naples, tours, copenhagen, stockholm, tenochtitlan, basilica-of-saint-denis; event battle-of-chaldiran-1514. Obsidian: no links. Images: none. Not checked against the database: hans-of-denmark, ferdinand-ii-of-aragon, manuel-i-of-portugal, louis-xii-of-france and the other keys were grepped in inbox/*.yaml and the 1400 draft only (no hit), not in the live database; the preview will flag a duplicate.

