      - {value: "1493", sources: [wp-alauddin-husain-shah], note: "Nitish Sengupta, quoted in the article: he 'ruled Gaur between 1493 and 1519'; the predecessor Shamsuddin Muzaffar Shah is given r. 1491-1493"}
