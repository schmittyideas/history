people:
  # ---- Western Europe
  - {key: aethelred-the-unready, name: Æthelred the Unready, type: Royalty, born: 968, born_estimated: true, died: 1016-04-23, house: Wessex, realm: England, prominence: 3,
     note: "King of the English whose long reign was dominated by Viking raids.", sources: [wp-aethelred-the-unready]}
  - {key: kenneth-iii-of-scotland, name: Kenneth III, type: Royalty, born: 966, born_estimated: true, died: 1005-03-25, died_estimated: true, house: Alpin, realm: Scotland, prominence: 2,
     note: "King of Alba, killed in battle by Malcolm II at Monzievaird.", sources: [wp-kenneth-iii]}
  - {key: mael-sechnaill-mac-domnaill, name: Máel Sechnaill mac Domnaill, type: Royalty, born: 949, died: 1022-09-02, house: Clann Cholmáin, realm: Ireland, prominence: 2,
     note: "High King of Ireland who gave way to Brian Boru in 1002 and took the title back after Brian's death.", sources: [wp-mael-sechnaill]}
  - {key: robert-ii-of-france, name: Robert II, type: Royalty, born: 972, born_estimated: true, died: 1031-07-20, house: Capetian, realm: France, prominence: 3, obsidian_link: Robert II,
     note: "Second Capetian king of the Franks, called Robert the Pious.", sources: [wp-robert-ii-of-france]}
  - {key: richard-ii-of-normandy, name: Richard II of Normandy, type: Nobility, born: 980, born_estimated: true, died: 1026-08-28, house: Normandy, realm: Normandy, prominence: 2,
     note: "Duke of Normandy called the Good; grandfather of William the Conqueror.", sources: [wp-richard-ii-of-normandy]}
  - {key: otto-iii-holy-roman-emperor, name: Otto III, type: Royalty, born: 980, born_estimated: true, died: 1002-01-23, house: Ottonian, realm: Holy Roman Empire, prominence: 3,
     note: "King of the Germans from the age of three and Holy Roman Emperor, who dreamed of renewing the Roman Empire.", sources: [wp-otto-iii]}
  - {key: sylvester-ii, name: Sylvester II, type: Clergy, roles: [pope], born: 946, born_estimated: true, died: 1003-05-12, realm: Papacy, prominence: 3,
     note: "Gerbert of Aurillac, a scholar of mathematics and astronomy and the first French pope.", sources: [wp-sylvester-ii]}
  - {key: pietro-ii-orseolo, name: Pietro II Orseolo, type: Nobility, born: 961, died: 1009, house: Orseolo, realm: Venice, prominence: 2,
     note: "Doge of Venice who brought the Dalmatian coast under Venetian control.", sources: [wp-pietro-ii-orseolo]}
  - {key: alfonso-v-of-leon, name: Alfonso V of León, type: Royalty, born: 994, born_estimated: true, died: 1028-08-07, house: Astur-Leonese, realm: León, prominence: 2,
     note: "Came to the throne as a child; killed by an arrow while besieging Viseu.", sources: [wp-alfonso-v-of-leon]}
  - {key: garcia-sanchez-ii-of-pamplona, name: García Sánchez II, type: Royalty, born: 964, born_estimated: true, died: 1004, died_estimated: true, house: Jiménez, realm: Pamplona, prominence: 2,
     note: "King of Pamplona and father of Sancho III the Great. Not recorded after 1000; dead by 1004.", sources: [wp-garcia-sanchez-ii]}
  - {key: hisham-ii, name: Hisham II, type: Royalty, born: 966, died: 1013, died_estimated: true, house: Umayyad, realm: Caliphate of Córdoba, prominence: 2,
     note: "Umayyad caliph of Córdoba who reigned in name while Almanzor held real power.", sources: [wp-hisham-ii]}
  - {key: almanzor, name: Almanzor, type: Nobility, born: 938, born_estimated: true, died: 1002-08-08, house: Amirid, realm: Caliphate of Córdoba, prominence: 3,
     note: "Hajib (chamberlain) and real ruler of al-Andalus, famous for his campaigns against the Christian kingdoms.", sources: [wp-almanzor]}
  - {key: ramon-borrell-of-barcelona, name: Ramon Borrell, type: Nobility, born: 972, died: 1017, house: Barcelona, realm: Barcelona, prominence: 1,
     note: "Count of Barcelona, Girona and Osona.", sources: [wp-ramon-borrell]}
  # ---- Northern Europe
  - {key: sweyn-forkbeard, name: Sweyn Forkbeard, type: Royalty, died: 1014-02-03, house: Knýtlinga, realm: Denmark, prominence: 3,
     note: "King of Denmark who won at Svolder in 1000 and conquered England in 1013. Birth year unknown.", sources: [wp-sweyn-forkbeard]}
  - {key: olaf-tryggvason, name: Olaf Tryggvason, type: Royalty, born: 965, born_estimated: true, died: 1000-09-09, house: Fairhair, realm: Norway, prominence: 3,
     note: "King of Norway who pushed Christianity on Norway and Iceland; killed at the Battle of Svolder.", sources: [wp-olaf-tryggvason]}
  - {key: eric-haakonsson, name: Eric Haakonsson, type: Nobility, born: 965, born_estimated: true, died: 1025, died_estimated: true, house: Lade jarls, realm: Norway, prominence: 2,
     note: "Jarl of Lade who captured Olaf's Long Serpent at Svolder, then ruled Norway under Danish overlordship.", sources: [wp-eric-haakonsson]}
  - {key: sweyn-haakonsson, name: Sweyn Haakonsson, type: Nobility, died: 1016, died_estimated: true, house: Lade jarls, realm: Norway, prominence: 1,
     note: "Jarl of Lade who co-ruled Norway with his brother Eric after Svolder.", sources: [wp-sweyn-haakonsson]}
  - {key: olof-skotkonung, name: Olof Skötkonung, type: Royalty, born: 980, born_estimated: true, died: 1022, died_estimated: true, house: Munsö, realm: Sweden, prominence: 2,
     note: "First Christian King of Sweden; allied with Denmark at Svolder.", sources: [wp-olof-skotkonung]}
  # ---- Eastern Europe
  - {key: boleslaw-i-of-poland, name: Bolesław I the Brave, type: Royalty, born: 967, born_estimated: true, died: 1025-06-17, house: Piast, realm: Poland, prominence: 3,
     note: "Duke of Poland who hosted Otto III at Gniezno in 1000 and became Poland's first crowned king.", sources: [wp-boleslaw-i]}
  - {key: stephen-i-of-hungary, name: Stephen I of Hungary, type: Royalty, roles: [saint], born: 975, born_estimated: true, died: 1038-08-15, house: Árpád, realm: Hungary, prominence: 3,
     note: "Last Grand Prince and first King of Hungary, who made it a Christian kingdom.", sources: [wp-stephen-i-of-hungary]}
  - {key: boleslaus-iii-of-bohemia, name: Boleslaus III of Bohemia, type: Nobility, born: 965, born_estimated: true, died: 1037, house: Přemyslid, realm: Bohemia, prominence: 1,
     note: "Unstable Duke of Bohemia, later blinded and imprisoned by Bolesław I of Poland.", sources: [wp-boleslaus-iii]}
  - {key: vladimir-the-great, name: Vladimir the Great, type: Royalty, roles: [saint], born: 958, born_estimated: true, died: 1015-07-15, house: Rurik, realm: "Kievan Rus'", prominence: 3,
     note: "Grand Prince of Kiev who converted Kievan Rus' to Christianity in 988.", sources: [wp-vladimir-the-great]}
  - {key: basil-ii, name: Basil II, type: Royalty, born: 958, died: 1025-12-15, house: Macedonian, realm: Byzantine Empire, prominence: 4,
     note: "Byzantine emperor for almost fifty years, called the Bulgar-slayer for his long war with Bulgaria.", sources: [wp-basil-ii]}
  - {key: constantine-viii, name: Constantine VIII, type: Royalty, born: 960, died: 1028-11-11, house: Macedonian, realm: Byzantine Empire, prominence: 1,
     note: "Basil II's younger brother: co-emperor in name for decades, then sole emperor for three years.", sources: [wp-constantine-viii]}
  - {key: samuel-of-bulgaria, name: Samuel of Bulgaria, type: Royalty, born: 958, born_estimated: true, died: 1014-10-06, house: Cometopuli, realm: Bulgaria, prominence: 2,
     note: "Tsar of Bulgaria and Basil II's great opponent; died soon after the disaster at Kleidion.", sources: [wp-samuel-of-bulgaria]}
  - {key: svetoslav-suronja, name: Svetoslav Suronja, type: Royalty, died: 1000, died_estimated: true, house: Trpimirović, realm: Croatia, prominence: 1,
     note: "King of Croatia, overthrown by his younger brothers around 1000.", sources: [wp-svetoslav-suronja]}
  - {key: kresimir-iii-of-croatia, name: Krešimir III of Croatia, type: Royalty, died: 1030, house: Trpimirović, realm: Croatia, prominence: 1,
     note: "Took the Croatian throne from his brother Svetoslav with Bulgarian help.", sources: [wp-kresimir-iii]}
  - {key: gojslav-of-croatia, name: Gojslav of Croatia, type: Royalty, died: 1020, house: Trpimirović, realm: Croatia, prominence: 1,
     note: "Co-king of Croatia with his brother Krešimir III.", sources: [wp-gojslav]}
  # ---- Caucasus
  - {key: bagrat-iii-of-georgia, name: Bagrat III of Georgia, type: Royalty, born: 963, born_estimated: true, died: 1014-05-07, house: Bagrationi, realm: Georgia, prominence: 2,
     note: "King of Abkhazia who inherited Iberia and became the first king of a united Georgia in 1008.", sources: [wp-bagrat-iii]}
  - {key: gurgen-of-iberia, name: Gurgen of Iberia, type: Royalty, died: 1008, house: Bagrationi, realm: Iberia, prominence: 1,
     note: "Father of Bagrat III; King of Kings of the Iberians.", sources: [wp-gurgen-of-iberia]}
  - {key: david-iii-of-tao, name: David III of Tao, type: Nobility, born: 935, born_estimated: true, died: 1000, died_estimated: true, house: Bagrationi, realm: Tao, prominence: 1,
     note: "Georgian prince of Tao and adoptive father of Bagrat III; poisoned, after which Basil II took Tao. Died 31 March 1000, or in 1001.", sources: [wp-david-iii-of-tao]}
  - {key: gagik-i-of-armenia, name: Gagik I of Armenia, type: Royalty, died: 1020, house: Bagratuni, realm: Armenia, prominence: 1,
     note: "Bagratid King of Armenia at the height of its power.", sources: [wp-gagik-i]}
  # ---- Middle East, North Africa and Central Asia
  - {key: al-qadir, name: al-Qadir, type: Royalty, born: 947-09-28, died: 1031-11-29, house: Abbasid, realm: Abbasid Caliphate, prominence: 2,
     note: "Abbasid caliph in Baghdad who restored the caliphate's religious authority.", sources: [wp-al-qadir]}
  - {key: baha-al-dawla, name: Baha al-Dawla, type: Nobility, born: 971, died: 1012-12-22, house: Buyid, realm: Buyid Emirate, prominence: 1,
     note: "Buyid amir of Iraq and the strongest Buyid ruler, controlling the caliph in Baghdad.", sources: [wp-baha-al-dawla]}
  - {key: al-hakim-bi-amr-allah, name: al-Hakim bi-Amr Allah, type: Royalty, born: 985-08-13, died: 1021-02-13, house: Fatimid, realm: Fatimid Caliphate, prominence: 3,
     note: "Sixth Fatimid caliph, ruling from Cairo; a central figure for the Druze. He vanished in 1021.", sources: [wp-al-hakim]}
  - {key: badis-ibn-al-mansur, name: Badis ibn al-Mansur, type: Nobility, born: 984-08-14, died: 1016-05-10, house: Zirid, realm: Zirid Ifriqiya, prominence: 1,
     note: "Zirid emir of Ifriqiya, ruling for the Fatimids.", sources: [wp-badis-ibn-mansur]}
  - {key: mahmud-of-ghazni, name: Mahmud of Ghazni, type: Royalty, born: 971-10-02, died: 1030-04-30, house: Ghaznavid, realm: Ghaznavid Empire, prominence: 3,
     note: "Sultan who built an empire from eastern Iran to the Punjab and raided deep into India.", sources: [wp-mahmud-of-ghazni]}
  # ---- South Asia
