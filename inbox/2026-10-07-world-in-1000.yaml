batch:
  title: The world in AD 1000
  requested: "Find all the royalty in 1000 in the world and build this out"
  date: 2026-10-07

# Every ruler below held power during 1000. Dates are from each ruler's English Wikipedia article
# (checked 2026-10-07). Where articles disagree, the record uses the article's main date and the note
# says what else is claimed. Realms Wikipedia names no confident ruler for in 1000 are left out:
# Srivijaya, the Ghana Empire, Ethiopia/Zagwe, the Kara-Khanids, and the Toltec and Maya states.

