events:
  - key: congress-of-gniezno
    name: Congress of Gniezno
    type: Congress
    date: 1000-03-11
    place: gniezno
    prominence: 3
    note: Otto III visited Bolesław I, 7–15 March. Gniezno became an archbishopric, with new dioceses at Kraków, Wrocław and Kołobrzeg.
    people:
      - {person: boleslaw-i-of-poland, role: host}
      - {person: otto-iii-holy-roman-emperor, role: guest}
    sources: [wp-congress-of-gniezno]

  - key: battle-of-cervera
    name: Battle of Cervera
    type: Battle
    date: 1000-07-29
    place: espinosa-de-cervera
    prominence: 2
    note: Córdoba defeated a Castilian and Pamplonese army; one of Almanzor's last great victories.
    people:
      - {person: almanzor, role: victor}
    sources: [wp-battle-of-cervera]

  - key: venetian-dalmatian-expedition-1000
    name: Pietro II Orseolo's Dalmatian expedition
    type: Campaign
    date: 1000-05-09
    place: venice
    prominence: 2
    note: The fleet sailed on Ascension Day; Venice took control of the Dalmatian coast, and the Doge became Duke of the Dalmatians. Remembered in the Festa della Sensa.
    people:
      - {person: pietro-ii-orseolo, role: commander}
    sources: [wp-pietro-ii-orseolo]

  - key: otto-iii-opens-charlemagnes-tomb
    name: Otto III opens Charlemagne's tomb
    type: Ceremony
    year: 1000
    place: aachen-cathedral
    prominence: 2
    note: Otto took relics from the tomb and carried them to Rome.
    people:
      - {person: otto-iii-holy-roman-emperor, role: opened the tomb}
    sources: [wp-otto-iii]

  - key: assassination-of-barjawan
    name: Assassination of the regent Barjawan
    type: Assassination
    date: 1000-03-26
    place: cairo
    prominence: 1
    note: Al-Hakim had his regent killed and took personal control of the Fatimid government.
    people:
      - {person: al-hakim-bi-amr-allah, role: ordered it}
    sources: [wp-al-hakim]

  - key: battle-of-svolder
    name: Battle of Svolder
    type: Battle
    date: 1000-09-09
    estimated: true
    place: oresund
    prominence: 3
    note: A Danish, Swedish and Norwegian alliance destroyed Olaf Tryggvason's fleet; Olaf leapt into the sea from the Long Serpent. Date and place are both disputed.
    people:
      - {person: olaf-tryggvason, role: defeated and killed}
      - {person: sweyn-forkbeard, role: allied commander}
      - {person: olof-skotkonung, role: allied commander}
      - {person: eric-haakonsson, role: allied commander}
    sources: [wp-battle-of-svolder]

  - key: christianisation-of-iceland
    name: Iceland adopts Christianity at the Althing
    type: Conversion
    year: 1000
    place: thingvellir
    prominence: 2
    note: The Althing accepted Christianity as the law of the land, after arbitration by the lawspeaker Thorgeir. Some sources say 999.
    people:
      - {person: olaf-tryggvason, role: pressed for it with trade bans and hostages}
    sources: [wp-christianization-of-iceland]

  - key: coronation-of-stephen-i-of-hungary
    name: Coronation of Stephen I of Hungary
    type: Coronation
    date: 1000-12-25
    place: esztergom
    prominence: 3
    note: Hungary's first king, crowned with a crown sent by Pope Sylvester II. The date (or 1 January 1001) and the place are both uncertain.
    people:
      - {person: stephen-i-of-hungary, role: crowned}
      - {person: sylvester-ii, role: sent the crown}
    sources: [wp-stephen-i-of-hungary]

  - key: shoshi-named-empress
    name: Fujiwara no Shōshi named empress
    type: Court
    year: 1000
    place: heian-kyo
    prominence: 1
    note: Michinaga's daughter became chūgū while Teishi was re-titled kōgō, giving Japan two empresses at once for the first time. Murasaki Shikibu later served in Shōshi's court.
    people:
      - {person: fujiwara-no-michinaga, role: arranged it (her father)}
      - {person: emperor-ichijo, role: husband}
    sources: [wp-fujiwara-no-shoshi]

  - key: chola-land-survey
    name: Rajaraja I begins the Chola land survey
    type: Administration
    year: 1000
    prominence: 1
    note: A survey of land for taxation, and a reorganisation of the empire into valanadus.
    people:
      - {person: rajaraja-i, role: ordered it}
    sources: [wp-rajaraja-i]

  - key: dali-imperial-examinations
    name: Dali Kingdom begins imperial examinations
    type: Administration
    year: 1000
    estimated: true
    place: dali
    prominence: 1
    people:
      - {person: duan-suying, role: started them}
    sources: [wp-duan-suying]

discrepancies:
  - key: battle-of-svolder-date-and-place
    question: When and where was the Battle of Svolder fought?
    about: [{event: battle-of-svolder}, {person: olaf-tryggvason}]
    field: date
    claims:
      - {value: "9 September 1000", sources: [wp-battle-of-svolder], note: "The usual date"}
      - {value: "9 September 999", sources: [wp-battle-of-svolder, wp-olaf-tryggvason]}
      - {value: "In the Øresund (Adam of Bremen)", sources: [wp-battle-of-svolder]}
      - {value: "Near an island called Svolder, possibly off Rügen (Icelandic sources)", sources: [wp-battle-of-svolder]}
    note: The record uses 9 September 1000 and the Øresund, marked estimated.

  - key: stephen-i-coronation-date
    question: Was Stephen I of Hungary crowned on 25 December 1000 or 1 January 1001, and at Esztergom or Székesfehérvár?
    about: [{event: coronation-of-stephen-i-of-hungary}, {person: stephen-i-of-hungary}]
    field: date
