# The Papacy, 700-799 (the end of the Byzantine Papacy and the Frankish alliance): the 12 popes of the century not yet
# here, from John VI to Leo III, the antipopes Constantine II and Philip, and three events: the Donation of Pepin
# (756), the Second Council of Nicaea (787) and the coronation of Charlemagne (800).
# Conventions and checks as the earlier Papacy batches (inbox/2026-10-18-popes-*.yaml): each person's own English
# Wikipedia article (2026-10-18) for dates and note; the List of popes and the Antipope table for pontificates and
# birthplaces; Wikidata for sitelinks and coordinates, a Wikidata date used only where the article confirms it.
# Stated honestly:
#  - Many birth years are the articles' bare years (e.g. "655 – 11 January 705"); used as given.
#  - Discrepancy recorded: John VII's death (18 October 707; Wikidata 22 October).
#  - Sisinnius and Gregory III were born in "Syria": a region, not a place record; left in their notes.
#  - Charlemagne is not yet in the database; his coronation lists Leo III only, and Charlemagne can be added later.
batch:
  title: "The Papacy, 700-799"
  requested: "Do we have all popes? Get them all, with the disputed ones (antipopes) marked disputed"
  date: 2026-10-18

