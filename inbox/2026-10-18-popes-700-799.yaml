people:
  - {key: john-vi, name: "John VI", type: Clergy, roles: [pope], born: 655, died: 0705-01-11, realm: Papacy, prominence: 1, sitelinks: 76, sitelinks_on: 2026-10-18,
     note: "A Greek from Ephesus, the only pope from Asia Minor, in the Byzantine Papacy (701-705).",
     sources: [wp-john-vi]}
  - {key: john-vii, name: "John VII", type: Clergy, roles: [pope], born: 650, born_estimated: true, died: 0707-10-18, realm: Papacy, prominence: 1, sitelinks: 77, sitelinks_on: 2026-10-18,
     note: "An ethnic Greek of the Byzantine Papacy (705-707), on better terms with the Lombards than with Emperor Justinian II.",
     sources: [wp-john-vii]}
  - {key: sisinnius, name: "Sisinnius", type: Clergy, roles: [pope], died: 0708-02-04, realm: Papacy, prominence: 1, sitelinks: 74, sitelinks_on: 2026-10-18,
     note: "A Syrian, already crippled by gout when elected; in his twenty days (708) he consecrated a bishop for Corsica and ordered Rome's walls strengthened.",
     sources: [wp-sisinnius]}
  - {key: constantine, name: "Constantine", type: Clergy, roles: [pope], born: 664, died: 0715-04-09, realm: Papacy, prominence: 2, sitelinks: 72, sitelinks_on: 2026-10-18,
     note: "A Syrian from Tyre, one of the last Byzantine popes. Visited Constantinople in 710-711 and compromised with Justinian II over the Quinisext canons; no pope went there again until 1967.",
     sources: [wp-constantine]}
  - {key: gregory-ii, name: "Gregory II", type: Clergy, roles: [pope], born: 0669, died: 0731-02-11, realm: Papacy, prominence: 2, sitelinks: 86, sitelinks_on: 2026-10-18,
     note: "A Roman who defied Emperor Leo III the Isaurian over iconoclasm, setting off the revolts that led to the popes' temporal power; held the Synod of Rome (721). A saint.",
     sources: [wp-gregory-ii]}
  - {key: gregory-iii, name: "Gregory III", type: Clergy, roles: [pope], died: 0741-11-28, realm: Papacy, prominence: 2, sitelinks: 84, sitelinks_on: 2026-10-18,
     note: "The last Syrian pope and the last born outside Europe until Francis; faced Byzantine iconoclasm and the Lombards, appealed in vain to Charles Martel, and was the last to seek the exarch's consent to his election.",
     sources: [wp-gregory-iii]}
  - {key: zachary, name: "Zachary", type: Clergy, roles: [pope], born: 679, died: 0752-03-15, realm: Papacy, prominence: 2, sitelinks: 76, sitelinks_on: 2026-10-18,
     note: "A Greek, the last pope of the Byzantine Papacy (741-752): built the first Santa Maria sopra Minerva, forbade the slave trade in Rome, made peace with the Lombards and sanctioned Pepin the Short's seizure of the Frankish throne.",
     sources: [wp-zachary]}
  - {key: stephen-ii, name: "Stephen II", type: Clergy, roles: [pope], born: 714, died: 0757-04-26, realm: Papacy, prominence: 3, sitelinks: 76, sitelinks_on: 2026-10-18,
     note: "The pope of the turn from Byzantine to Frankish papacy: threatened by the Lombards, he went to Francia to seek Pepin the Short, whose Donation of land (756) founded the Papal States. Sometimes numbered Stephen III.",
     sources: [wp-stephen-ii]}
  - {key: paul-i, name: "Paul I", type: Clergy, roles: [pope], born: 700, died: 0767-06-28, realm: Papacy, prominence: 2, sitelinks: 81, sitelinks_on: 2026-10-18,
     note: "Brother of Stephen II, whom he served as a deacon in negotiations with the Lombard kings; pope 757-767. A saint.",
     sources: [wp-paul-i]}
  - {key: stephen-iii, name: "Stephen III", type: Clergy, roles: [pope], born: 720, died: 0772-01-24, realm: Papacy, prominence: 2, sitelinks: 77, sitelinks_on: 2026-10-18,
     note: "A Benedictine from Sicily, elected amid the factional struggle after Paul I; his Lateran Council of 769 sought to keep the nobility out of papal elections. Sometimes numbered Stephen IV.",
     sources: [wp-stephen-iii]}
  - {key: adrian-i, name: "Adrian I", type: Clergy, roles: [pope], born: 700, died: 0795-12-25, realm: Papacy, prominence: 3, sitelinks: 83, sitelinks_on: 2026-10-18,
     note: "Of the Roman military aristocracy; pope 772-795, the ally of Charlemagne against the Lombards, and pope at the Second Council of Nicaea (787).",
     sources: [wp-adrian-i]}
  - {key: leo-iii, name: "Leo III", type: Clergy, roles: [pope], died: 0816-06-12, realm: Papacy, prominence: 4, sitelinks: 86, sitelinks_on: 2026-10-18,
     note: "Protected by Charlemagne from the partisans of Adrian I, he crowned Charlemagne emperor in St Peter's on Christmas Day 800. A saint.",
     sources: [wp-leo-iii]}
  - {key: constantine-ii-antipope, name: "Constantine II (antipope)", type: Clergy, roles: [antipope], died: 769, died_estimated: true, realm: Papacy, prominence: 1, sitelinks: 29, sitelinks_on: 2026-10-18,
     note: "A layman made pope by Tuscan nobles led by his brother after Paul I's death (767); overthrown with Lombard help, blinded, and condemned by the Lateran Council of 769.",
     sources: [wp-constantine-ii-antipope]}
  - {key: philip-antipope, name: "Philip (antipope)", type: Clergy, roles: [antipope], realm: Papacy, prominence: 1, sitelinks: 33, sitelinks_on: 2026-10-18,
     note: "A priest of the monastery of St Vitus on the Esquiline, installed by the envoy of the Lombard king Desiderius for one day, 31 July 768.",
     sources: [wp-philip-antipope]}

