  image_thumb: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Portret_van_Mariotto_Albertinelli%2C_RP-P-2016-686.jpg/500px-Portret_van_Mariotto_Albertinelli%2C_RP-P-2016-686.jpg
  image_page: https://commons.wikimedia.org/wiki/File:Portret_van_Mariotto_Albertinelli,_RP-P-2016-686.jpg
  image_license: CC0
  coverage: partly
  coverage_note: Dates, training, partnerships, students and the Visitation captured; full portfolio not built out. Place of death not in the article.
  sources:
  - wp-mariotto-albertinelli
