- key: mariotto-albertinelli
  name: Mariotto Albertinelli
  type: Artist
  roles:
  - painter
  born: '1474-10-13'
  died: '1515-11-05'
  prominence: 2
  note: Florentine High Renaissance painter, partner of Fra Bartolomeo, best known for the 1503 Visitation altarpiece now in the Uffizi.
