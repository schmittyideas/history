discrepancies:
  - key: molotov-ribbentrop-signing-date
    question: Was the Molotov–Ribbentrop Pact signed on 23 or 24 August 1939?
    about: [{event: molotov-ribbentrop-pact}]
    field: date
    claims:
      - {value: "1939-08-23", sources: [wp-molotov-ribbentrop-pact], note: Infobox date signed}
      - {value: "Signed on 24 August, backdated to 23 August", sources: [wp-molotov-ribbentrop-pact], note: Body}
    note: The record uses 23 August, the pact's own date.
  - key: battle-of-britain-dates
    question: When did the Battle of Britain begin and end?
    about: [{event: battle-of-britain}]
    field: date
    claims:
      - {value: "10 July – 31 October 1940", sources: [wp-battle-of-britain], note: British dating; the article's main dates}
      - {value: "July 1940 – mid-May 1941", sources: [wp-battle-of-britain], note: "German historians' usual dating (article footnote)"}
    note: The record uses the British dates.
  - key: pearl-harbor-date-japan
    question: Did the attack on Pearl Harbor happen on 7 or 8 December 1941?
    about: [{event: attack-on-pearl-harbor}]
    field: date
    claims:
      - {value: "7 December 1941, 7:48 a.m. Hawaiian time", sources: [wp-attack-on-pearl-harbor]}
      - {value: "8 December 1941, 3:18 a.m. Japan Standard Time (as kept by the Japanese fleet)", sources: [wp-attack-on-pearl-harbor]}
    note: The same moment in two time zones; the record uses the local date, 7 December.
  - key: stalingrad-start-date
    question: Did the Battle of Stalingrad begin on 17 July or 23 August 1942?
    about: [{event: battle-of-stalingrad}]
    field: date
    claims:
      - {value: "1942-07-17", sources: [wp-battle-of-stalingrad], note: "Infobox; 'more common in the war's historiography'"}
      - {value: "1942-08-23", sources: [wp-battle-of-stalingrad], note: "Some historians start it in August, most commonly 23 August"}
    note: The record uses 17 July, the infobox date.
  - key: german-surrender-date
    question: Did Germany surrender on 7, 8 or 9 May 1945?
    about: [{event: german-surrender-1945}]
    field: date
    claims:
      - {value: "7 May 1945, 02:41, at Reims (preliminary act)", sources: [wp-german-instrument-of-surrender]}
      - {value: "8 May 1945 at Berlin-Karlshorst (definitive act; signed near 01:00 on 9 May CET and backdated)", sources: [wp-german-instrument-of-surrender]}
      - {value: "9 May 1945 (Moscow time; VE Day in Russia and other countries)", sources: [wp-victory-in-europe-day]}
    note: The record uses 8 May, when the surrender took effect and VE Day in the West.
