batch:
  title: "WWII, batch 1b: the war's outline events"
  requested: "Ty: search and find WWII events and famous people to add (batch 1 of the WWII build-out: outline events)"
  date: 2026-10-24

# Notes for the reviewer
# - Facts come from each event's English Wikipedia article, read through the Wikipedia API on 2026-10-24 (infobox and body). Site
#   coordinates come from each site's own article ({{coord}}); the Reims surrender museum has no English article, so its coordinates
#   come from French Wikipedia (Musée de la Reddition, 12 rue Franklin Roosevelt).
# - Prominence (agreed with Ty): 5 for the turning points only (invasion of Poland, Pearl Harbor, the atomic bombings, the German
#   surrender, Japan's surrender; D-Day is already 5). 4 for major battles, treaties and conferences that shaped the war or the peace.
#   3 for the rest.
# - People: only leaders already in the database are linked here. Commanders (Zhukov, Nimitz, Yamamoto, Paulus, MacArthur,
#   Tibbets...) and their roles in these events come in batches 2 and 3, which will re-send these event keys to add them.
# - Events with only a start and end year: the intake format has no end date, so the note gives the exact end.
# - Battle of Britain and Operation Barbarossa have no place: the articles give only "British airspace" and "the western Soviet Union".
# - The Battle of France is placed at the Glade of the Armistice at Compiègne, where it ended (the campaign covered the Low Countries
#   and France). The invasion of Poland is placed at Westerplatte, where the first shots were fired.
# - Hitler's appointment: the article says only "in Hindenburg's office" in Berlin, so the city is used. The Molotov-Ribbentrop Pact
#   is placed at the Moscow Kremlin; the article names no building inside it.
# - The UN Charter was signed in the Herbst Theatre (Veterans Building), not the Opera House next door, where the conference met
#   (Charter of the United Nations and Herbst Theatre articles agree).
# - Japan's surrender anchorage (USS Missouri in Tokyo Bay): the coordinates are tagged "citation needed" on Wikipedia, so the place
#   is marked approximate in its note.
# - Existing events updated: Chamberlain is linked to Britain's declaration of war (his article), Eisenhower to the Normandy
#   landings as supreme commander (his article).

