events:
  - key: hitler-appointed-chancellor
    name: Hitler appointed Chancellor of Germany
    type: Appointment
    date: 1933-01-30
    place: berlin
    prominence: 4
    people: [{person: adolf-hitler, role: appointed}]
    note: President Hindenburg appointed Hitler Chancellor at the head of a Nazi–nationalist coalition cabinet, sworn in in Hindenburg's office.
    sources: [wp-adolf-hitlers-rise-to-power]
  - key: anschluss
    name: Anschluss (Germany annexes Austria)
    type: Annexation
    date: 1938-03-12
    place: vienna
    places: [{place: heldenplatz, role: speech, note: "Hitler announced the Anschluss here on 15 March 1938"}]
    prominence: 3
    people: [{person: adolf-hitler, role: announced}]
    note: German troops entered Austria on 12 March 1938; the union was enacted by law on 13 March and put to a referendum on 10 April.
    sources: [wp-anschluss, wp-heldenplatz]
  - key: munich-agreement
    name: Munich Agreement
    type: Treaty
    date: 1938-09-30
    place: fuhrerbau
    prominence: 4
    people: [{person: adolf-hitler, role: signed}, {person: neville-chamberlain, role: signed}, {person: benito-mussolini, role: signed}]
    note: Germany, Britain, France and Italy agreed to Germany's annexation of the Sudetenland; agreed on 29 September, signed at about 1:30 a.m. on the 30th.
    sources: [wp-munich-agreement, wp-fuhrerbau]
  - key: molotov-ribbentrop-pact
    name: Molotov–Ribbentrop Pact
    type: Treaty
    date: 1939-08-23
    place: moscow-kremlin
    prominence: 4
    people: [{person: joseph-stalin, role: present}]
    note: German–Soviet non-aggression pact, with a secret protocol dividing Eastern Europe; signed by Ribbentrop and Molotov. Germany broke it in June 1941.
    sources: [wp-molotov-ribbentrop-pact]
  - key: invasion-of-poland
    name: Invasion of Poland
    type: Invasion
    date: 1939-09-01
    end_year: 1939
    place: westerplatte
    prominence: 5
    note: Germany invaded on 1 September and the Soviet Union on 17 September; Poland was divided by 6 October. Generally taken as the start of the war.
    sources: [wp-invasion-of-poland, wp-battle-of-westerplatte, wp-world-war-ii]
  - key: battle-of-france
    name: Battle of France
    type: Campaign
    date: 1940-05-10
    end_year: 1940
    place: glade-of-the-armistice
    prominence: 4
    note: German offensive through the Low Countries and France; the armistice was signed at Compiègne on 22 June and took effect on 25 June 1940.
    sources: [wp-battle-of-france, wp-armistice-of-22-june-1940]
  - key: battle-of-britain
    name: Battle of Britain
    type: Battle
    date: 1940-07-10
    end_year: 1940
    prominence: 4
    note: Air campaign in which the RAF defeated the Luftwaffe's attempt to win air superiority over Britain (10 July – 31 October 1940, by the British dating).
    sources: [wp-battle-of-britain]
  - key: operation-barbarossa
    name: Operation Barbarossa
    type: Invasion
    date: 1941-06-22
    end_year: 1941
    prominence: 4
    people: [{person: adolf-hitler, role: commander}, {person: joseph-stalin, role: commander}]
    note: The Axis invasion of the Soviet Union, which stalled before Moscow in December 1941 (the article ends it on 5 December).
    sources: [wp-operation-barbarossa]
  - key: attack-on-pearl-harbor
    name: Attack on Pearl Harbor
    type: Attack
    date: 1941-12-07
    place: pearl-harbor
    places: [{place: uss-arizona-memorial, role: memorial, note: "Over the wreck of USS Arizona, sunk in the attack"}]
    prominence: 5
    note: Japanese carrier aircraft struck the US Pacific Fleet at 7:48 a.m. Hawaiian time, bringing the United States into the war.
    sources: [wp-attack-on-pearl-harbor, wp-uss-arizona-memorial]
  - key: battle-of-midway
    name: Battle of Midway
    type: Battle
    date: 1942-06-04
    end_year: 1942
    place: midway-atoll
    prominence: 4
    note: US carriers sank four Japanese carriers near Midway (4–7 June 1942), turning the naval war in the Pacific.
    sources: [wp-battle-of-midway, wp-midway-atoll]
  - key: battle-of-stalingrad
    name: Battle of Stalingrad
    type: Battle
    date: 1942-07-17
    end_year: 1943
    place: volgograd
    places: [{place: mamayev-kurgan, role: memorial, note: "Hill fought over in the battle; now its memorial"}]
    prominence: 4
    people: [{person: adolf-hitler, role: commander}, {person: joseph-stalin, role: commander}]
    note: Soviet victory that destroyed the German Sixth Army (to 2 February 1943); often seen as the turning point of the war in Europe.
    sources: [wp-battle-of-stalingrad, wp-mamayev-kurgan]
  - key: tehran-conference
    name: Tehran Conference
    type: Conference
    date: 1943-11-28
    end_year: 1943
    place: soviet-embassy-tehran
    prominence: 3
    people: [{person: joseph-stalin, role: attended}, {person: franklin-d-roosevelt, role: attended}, {person: winston-churchill, role: attended}]
    note: First meeting of the Big Three (to 1 December); they agreed to open a second front in Western Europe.
    sources: [wp-tehran-conference, wp-embassy-of-russia-tehran]
  - key: yalta-conference
    name: Yalta Conference
    type: Conference
    date: 1945-02-04
    end_year: 1945
    place: livadia-palace
    prominence: 4
    people: [{person: joseph-stalin, role: attended}, {person: franklin-d-roosevelt, role: attended}, {person: winston-churchill, role: attended}]
    note: The Big Three planned post-war Europe and Soviet entry into the war against Japan (4–11 February 1945).
    sources: [wp-yalta-conference, wp-livadia-palace]
  - key: death-of-benito-mussolini
    name: Death of Benito Mussolini
    type: Death
    date: 1945-04-28
    place: giulino-di-mezzegra
    prominence: 3
    people: [{person: benito-mussolini, role: died}]
    note: Partisans captured Mussolini near Dongo and shot him and Clara Petacci at Giulino di Mezzegra; the bodies were shown in Milan.
    sources: [wp-death-of-benito-mussolini]
  - key: death-of-adolf-hitler
    name: Death of Adolf Hitler
    type: Death
    date: 1945-04-30
    place: fuhrerbunker
    prominence: 4
    people: [{person: adolf-hitler, role: died}, {person: eva-braun, role: died}]
    note: Hitler shot himself in the Führerbunker as Soviet forces took Berlin; Eva Braun died with him, and both bodies were burned.
    sources: [wp-death-of-adolf-hitler]
  - key: german-surrender-1945
    name: German surrender (VE Day)
    type: Surrender
    date: 1945-05-08
    place: museum-berlin-karlshorst
    places: [{place: musee-de-la-reddition, role: signing, note: "Preliminary act signed by Jodl at 02:41 on 7 May 1945 at SHAEF headquarters"}]
    prominence: 5
    note: Germany surrendered unconditionally at Reims on 7 May; the definitive act was signed at Berlin-Karlshorst and took effect at 23:01 on 8 May, VE Day.
    sources: [wp-german-instrument-of-surrender, wp-victory-in-europe-day, wp-museum-berlin-karlshorst]
  - key: signing-of-the-united-nations-charter
    name: Signing of the United Nations Charter
    type: Treaty
    date: 1945-06-26
    place: herbst-theatre
    places: [{place: war-memorial-opera-house, role: venue, note: "The San Francisco Conference met here from April 1945"}]
    prominence: 4
    note: Fifty nations signed the Charter in San Francisco; it came into force on 24 October 1945.
    sources: [wp-charter-of-the-united-nations, wp-herbst-theatre, wp-war-memorial-opera-house]
  - key: potsdam-conference
    name: Potsdam Conference
    type: Conference
    date: 1945-07-17
    end_year: 1945
    place: cecilienhof
    prominence: 3
    people: [{person: joseph-stalin, role: attended}, {person: harry-s-truman, role: attended}, {person: winston-churchill, role: attended}, {person: clement-attlee, role: attended}]
    note: The Allied leaders set terms for occupied Germany and issued the Potsdam Declaration to Japan (to 2 August); Attlee replaced Churchill midway.
    sources: [wp-potsdam-conference, wp-cecilienhof]
  - key: atomic-bombings-of-hiroshima-and-nagasaki
    name: Atomic bombings of Hiroshima and Nagasaki
    type: Bombing
    date: 1945-08-06
    place: hiroshima
    places:
      - {place: nagasaki, role: target, note: "Second bomb (Fat Man), 9 August 1945; Kokura was the primary target"}
      - {place: hiroshima-peace-memorial, role: memorial, note: "The building left standing nearest the Hiroshima hypocentre"}
    prominence: 5
    note: The United States dropped atomic bombs on Hiroshima (6 August) and Nagasaki (9 August 1945), the only nuclear weapons used in war.
    sources: [wp-atomic-bombings-of-hiroshima-and-nagasaki, wp-hiroshima-peace-memorial]
  - key: hirohito-surrender-broadcast
    name: Hirohito's surrender broadcast
    type: Broadcast
    date: 1945-08-15
    place: tokyo
    prominence: 4
    people: [{person: hirohito, role: announced}]
    note: At noon Japan time, a recording of Hirohito announced that Japan accepted the Potsdam Declaration; often marked as VJ Day.
    sources: [wp-hirohito-surrender-broadcast]
  - key: surrender-of-japan
    name: Surrender of Japan
    type: Surrender
    date: 1945-09-02
    place: uss-missouri-tokyo-bay
    prominence: 5
    note: Japan's Instrument of Surrender was signed aboard USS Missouri in Tokyo Bay, ending the Second World War.
    sources: [wp-surrender-of-japan, wp-japanese-instrument-of-surrender, wp-world-war-ii]
  - key: nuremberg-trials
    name: Nuremberg trials
    type: Trial
    date: 1945-11-20
    end_year: 1946
    place: palace-of-justice-nuremberg
    prominence: 4
    note: The International Military Tribunal tried 22 leading Nazis; on 1 October 1946 twelve were sentenced to death and three acquitted.
    sources: [wp-nuremberg-trials, wp-palace-of-justice-nuremberg]
