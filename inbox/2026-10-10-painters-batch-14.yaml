discrepancies:
- key: giotto-birthplace
  question: Where was Giotto born?
  about:
  - person: giotto
  field: place
  claims:
  - value: Florence
    sources:
    - wp-giotto
    note: Recent research presents documentary evidence that he was born in Florence, son of a blacksmith.
  - value: Colle di Romagnano or Colle Vespignano (Vespignano)
    sources:
    - wp-giotto
    note: Tradition says a farmhouse at Colle di Romagnano; a plaque at Colle Vespignano has claimed it since 1850.
  note: Record uses Florence moment (documentary evidence). The article also says his birth date is disputed.
- key: giotto-apprenticeship-cimabue
  question: Was Giotto a pupil of Cimabue?
  about:
  - person: giotto
  - person: cimabue
  field: teacher
  claims:
  - value: Giotto was apprenticed to Cimabue
    sources:
    - wp-giotto
    - wp-cimabue
    note: Vasari's account, including the story of the painted fly.
  - value: Giotto was not Cimabue's pupil
    sources:
    - wp-giotto
    - wp-cimabue
    note: Many scholars treat Vasari's account as legend, citing earlier sources.
  note: No teacher link recorded.
- key: giotto-assisi-attribution
  question: Did Giotto paint the St Francis fresco cycle in the Upper Church at Assisi?
  about:
  - person: giotto
  field: attribution
  claims:
  - value: Yes, attributed to Giotto
    sources:
    - wp-giotto
    note: Traditional attribution, convenient in the absence of evidence to the contrary.
  - value: No, by other hands
    sources:
    - wp-giotto
    note: Technical examinations in 2002 gave strong evidence against; four hands from Rome identified.
  note: Not captured as a Giotto work in this batch.
- key: giotto-burial
  question: Where was Giotto buried?
  about:
  - person: giotto
  field: place
  claims:
  - value: Florence Cathedral
    sources:
    - wp-giotto
    note: 'Vasari: on the left of the entrance, marked by a white marble plaque.'
  - value: Church of Santa Reparata
    sources:
    - wp-giotto
    note: Other sources; the article says the two reports are explained because Santa Reparata lies directly beneath the cathedral.
  note: Record uses santa-reparata-florence. Bones found there in the 1970s are of disputed identity.
- key: simone-martini-teacher
  question: Who was Simone Martini's teacher?
  about:
  - person: simone-martini
  field: teacher
  claims:
  - value: Duccio di Buoninsegna
    sources:
    - wp-simone-martini
    note: It is thought he was Duccio's pupil.
  - value: Giotto
    sources:
    - wp-simone-martini
    note: 'Vasari: pupil of Giotto, with whom he went to Rome.'
  note: No teacher link recorded.
- key: duccio-teacher
  question: With whom did Duccio train?
  about:
  - person: duccio
  field: teacher
  claims:
  - value: Cimabue
    sources:
    - wp-duccio
    note: Many believe he studied under Cimabue.
  - value: A Byzantine master in Constantinople
    sources:
    - wp-duccio
    note: Others think he travelled there.
  note: Article says where and with whom he studied is still a matter of great debate. No teacher link recorded.
- key: lippi-death-cause
  question: How did Filippo Lippi die?
  about:
  - person: fra-filippo-lippi
  field: died
  claims:
  - value: Poisoned by relatives of Lucrezia Buti
    sources:
    - wp-fra-filippo-lippi
    note: Said to have happened before a papal dispensation to marry arrived.
  - value: Poisoned by relatives of a woman who replaced Lucrezia
    sources:
    - wp-fra-filippo-lippi
    note: Another version.
  note: Article says the mode of death is disputed. Record holds death at Spoleto in 1469 only.
- key: jan-van-eyck-born
  question: When was Jan van Eyck born?
  about:
  - person: jan-van-eyck
  field: born
  claims:
  - value: c. 1380
    sources:
    - wp-jan-van-eyck
    note: Argued by some scholars.
  - value: c. 1390
    sources:
    - wp-jan-van-eyck
    note: Lead gives c. before 1390.
  - value: 1395 at the latest
    sources:
    - wp-jan-van-eyck
    note: Inferred from his 1422-24 rank of master painter with assistants.
  note: Neither the date nor the place of birth is documented. Record uses c. 1390 and Maaseik (identified in the late 16th century).
- key: arnolfini-portrait-date
  question: When was the Arnolfini Portrait made?
  about:
  - artwork: arnolfini-portrait
  field: date
  claims:
  - value: '1434'
    sources:
    - wp-jan-van-eyck
    note: The signature reads Johannes de eyck fuit hic 1434.
  - value: '1432'
    sources:
    - wp-jan-van-eyck
    note: The article's portraits section refers to it as the Arnolfini Portrait of 1432.
  note: Record uses 1434, the inscribed date.
- key: giovanni-bellini-died
  question: On what date did Giovanni Bellini die in 1516?
  about:
  - person: giovanni-bellini
  field: died
  claims:
  - value: 29 December 1516
    sources:
    - wp-giovanni-bellini
    note: Lead paragraph
  - value: 29 November 1516
    sources:
    - wp-giovanni-bellini
    note: Body text, citing Marin Sanudo's diary
  note: The record holds the year 1516 only.
- key: antonello-da-messina-born
  question: When was Antonello da Messina born?
  about:
  - person: antonello-da-messina
  field: born
  claims:
  - value: c. 1425-1430
    sources:
    - wp-antonello-da-messina
    note: Lead paragraph
  - value: around 1429-1431
    sources:
    - wp-antonello-da-messina
    note: Early life section
  note: The record uses c. 1430, within both ranges.
- key: lorenzo-ghiberti-died
  question: Did Ghiberti die on 1 December 1455, or was that the day he was buried?
  about:
  - person: lorenzo-ghiberti
  field: died
  claims:
  - value: Died 1 December 1455
    sources:
    - wp-lorenzo-ghiberti
    note: Lead paragraph
  - value: Buried at Santa Croce on 1 December 1455 after dying of a fever
    sources:
    - wp-lorenzo-ghiberti
    note: Later life section
  note: The record holds the year 1455 only.
- key: gates-of-paradise-date
  question: Over what years were the Gates of Paradise made?
  about:
  - artwork: gates-of-paradise
  field: date
  claims:
  - value: 1425-1452 (commissioned 1425, 27 years' work)
    sources:
    - wp-lorenzo-ghiberti
  - value: 1424-1451
    sources:
    - wp-donatello
  note: The record uses 1425-1452 from Ghiberti's own article.
- key: brunelleschi-rome-visit
  question: Did Brunelleschi visit Rome in 1402-1404 to study its ruins?
  about:
  - person: filippo-brunelleschi
  field: place
  claims:
  - value: Visited Rome 1402-1404, almost certainly with Donatello
    sources:
    - wp-filippo-brunelleschi
  - value: Some historians dispute it; first definitely documented stay in Rome is 1432
    sources:
    - wp-filippo-brunelleschi
  note: The record includes only the documented 1432 stay as a moment.
- key: san-sebastiano-mantua-date
  question: When was San Sebastiano in Mantua begun?
  about:
  - place: san-sebastiano-mantua
  field: date
  claims:
  - value: '1460'
    sources:
    - wp-leon-battista-alberti
    note: Lead paragraph
  - value: begun 1458
    sources:
    - wp-leon-battista-alberti
    note: Other buildings list
  note: The record uses 1458.
- key: donatello-marble-david-date
  question: When was Donatello's marble David made?
  about:
  - artwork: donatello-marble-david
  field: date
  claims:
  - value: c. 1408-09
    sources:
    - wp-donatello
    note: 'Bronze David section: his stone David of about 1408-09'
  - value: perhaps 1412, or slightly later; reworked from 1416
    sources:
    - wp-donatello
    note: Early statues section
  note: The record uses c. 1409.
- key: thorvaldsen-born
  question: When was Bertel Thorvaldsen born?
  about:
  - person: bertel-thorvaldsen
  field: born
  claims:
  - value: 19 November 1770
    sources:
    - wp-bertel-thorvaldsen
    note: Date given in the article; his birth certificate and baptismal records have never been found, only a confirmation record of 1787.
  - value: '1768'
    sources:
    - wp-bertel-thorvaldsen
    note: Given as 'according to some accounts'.
  note: The record uses 1770, the date the article gives.
- key: calder-born
  question: On what day in 1898 was Alexander Calder born?
  about:
  - person: alexander-calder
  field: born
  claims:
  - value: '1898-07-22'
    sources:
    - wp-alexander-calder
    note: Birth certificate at Philadelphia City Hall, from a hand-written ledger; the date used in the article's lead.
  - value: '1898-08-22'
    sources:
    - wp-alexander-calder
    note: His mother's account; his family asserted the city officials had made a mistake.
  note: The record uses 22 July, the birth certificate and article lead.
- key: palladio-death-place
  question: Where did Andrea Palladio die?
  about:
  - person: andrea-palladio
  field: place
  claims:
  - value: Vicenza
    sources:
    - wp-andrea-palladio
  - value: Maser
    sources:
    - wp-andrea-palladio
  note: The article says "either Vicenza or Maser", so no died moment is recorded. He was buried in Santa Corona, Vicenza.
- key: tempietto-patron
  question: Who commissioned Bramante's Tempietto at San Pietro in Montorio?
  about:
  - artwork: tempietto-san-pietro-in-montorio
  field: attribution
  claims:
  - value: Ferdinand of Aragon and Isabella of Castile
    sources:
    - wp-donato-bramante
  - value: Pope Julius II
    sources:
    - wp-donato-bramante
    note: The article says 'possibly Julius II'; its lead says Julius II appointed him to build the sanctuary.
  note: No patron is recorded on the artwork while this is open.
- key: antoni-gaudi-born-place
  question: Was Antoni Gaudi born in Reus or in Riudoms?
  about:
  - person: antoni-gaudi
  field: place
  claims:
  - value: Reus
    sources:
    - wp-antoni-gaudi
    note: Most of his identification documents give Reus; baptised in Reus the day after birth.
  - value: Riudoms
    sources:
    - wp-antoni-gaudi
    note: From 1915 Gaudi himself said Riudoms, his paternal family's village.
  note: The record uses Reus, the better documented.
- key: aalto-paimio-sanatorium-completed
  question: When was the Paimio Sanatorium completed?
  about:
  - place: paimio-sanatorium
  field: date
  claims:
  - value: '1932'
    sources:
    - wp-alvar-aalto
    note: Prose says the sanatorium was completed in 1932.
  - value: 1928-1933
    sources:
    - wp-alvar-aalto
    note: The works list gives 1928-1933.
  note: Same article gives both; no founded year is recorded for now.
