# Notes for the reviewer
# - 55 more artists: pre-1500 masters, sculptors, architects and graphic artists, ranked by Wikipedia sitelinks (Wikidata), from English Wikipedia articles; lead images are links only (public domain or free licences).
# - Every person is `coverage: partly`; artworks have no images yet. Articles were cut at 32,000 characters: death places and late sections are missing where that bit, and left out rather than guessed.
# - Teachers and patrons not yet in the database have no links; they are named in each person's coverage note. Places already in the database are not re-sent.
# - Coordinates of new places are present-day and approximate (general knowledge, not the articles).

