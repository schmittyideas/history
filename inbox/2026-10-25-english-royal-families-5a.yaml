  # George I's parents, wife and daughter
  - key: ernest-augustus-elector-of-hanover
    name: Ernest Augustus, Elector of Hanover
    type: Nobility
    sex: male
    house: Hanover
    born: 1629-11-20
    died: 1698-01-23
    coverage: not-read
    note: "Duke of Brunswick-Lüneburg, Prince-Bishop of Osnabrück from 1662, Prince of Calenberg from 1679 and the first Elector of Hanover (1692). Father of George I."
    sources: [wp-ernest-augustus-elector-of-hanover]
  - key: sophia-of-hanover
    name: Sophia of Hanover
    type: Royalty
    sex: female
    born: 1630-10-14
    died: 1714-06-08
    coverage: not-read
    note: "Granddaughter of James VI and I, Electress of Hanover as wife of Ernest Augustus. Heiress presumptive under the Act of Settlement 1701; she died less than two months before Queen Anne, so her son George I succeeded."
    sources: [wp-sophia-of-hanover]
  - key: sophia-dorothea-of-celle
    name: Sophia Dorothea of Celle
    type: Royalty
    sex: female
    born: 1666-09-15
    died: 1726-11-13
    coverage: not-read
    note: "Wife of the future George I (married 1682, divorced 1694). After her alleged affair with Count Philip Christoph von Königsmarck she was held at Ahlden Castle for the last thirty years of her life."
    sources: [wp-sophia-dorothea-of-celle]
  - key: sophia-dorothea-of-hanover
    name: Sophia Dorothea of Hanover
    type: Royalty
    sex: female
    house: Hanover
    born: 1687-03-26
    died: 1757-06-28
    coverage: not-read
    note: "Daughter of George I; Queen in Prussia as wife of Frederick William I (married 1706) and mother of Frederick the Great."
    sources: [wp-sophia-dorothea-of-hanover]

