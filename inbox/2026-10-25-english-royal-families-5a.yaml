batch:
  title: "Royal families, part 5a: Hanover, George I to George III (1714-1820)"
  requested: "Ty: fill in parents, spouses and children (who reached 12) for each English monarch (issue #292, agreed 2026-10-25)"
  date: 2026-10-25
  notes: "Sex for George I, George II and George III; their parents, marriages and legitimate children who reached age 12, each with their own Wikipedia article, birth and burial places. George III's sons George IV and William IV get their own marriages in part 5b. Also Victoria's father (a son of George III), linked here so part 5b need not define him; her mother is in part 5b."

# Notes for the reviewer
# - Dates are each article's own (New Style where the article gives both; Hanover used the Gregorian calendar from 1700).
#   Prince William, Duke of Cumberland: the article gives 15 April 1721 marked "[N.S.]"; England then used Old Style, and
#   Wikidata also has 26 April. Kept the article's date, with a note.
# - Burial moments carry a year only where the article dates the burial; otherwise the year is left out.
#   Sophia of Hanover was buried in the Leineschloss chapel (moved to the Berggarten mausoleum in 1957); her moment is the
#   first burial. Sophia Dorothea of Celle was buried in the Stadtkirche in Celle, which has no article: the moment uses Celle.
#   Princess Mary of Great Britain, Anne (Princess of Orange), Sophia Dorothea of Hanover and Princess Mary, Duchess of
#   Gloucester: their articles name no burial place, so no buried moment.
#   Ernest Augustus, Elector of Hanover: his article names no burial place (Sophia's article says he lies in the Leineschloss
#   chapel too); no moment. Prince Edward, Duke of Kent: his article names no birthplace; no born moment.
# Left out
# - George I's three daughters by Melusine von der Schulenburg (illegitimate).
# - George II: Prince George William (1717-1718), died in infancy; an illegitimate son, Johann Ludwig von Wallmoden.
# - George III: Prince Octavius (1779-1783) and Prince Alfred (1780-1782), died before 12.
# - No title changes in this batch.

