    name: Caroline of Ansbach
    type: Royalty
    sex: female
    born: 1683-03-01
    died: 1737-11-20
    coverage: not-read
    note: "Queen of Great Britain as wife of George II (married 1705); regent during his absences in Hanover."
    sources: [wp-caroline-of-ansbach]
  - key: frederick-prince-of-wales
