    coverage: not-read
    note: "Eldest daughter of George II; wife of William IV, Prince of Orange (married 1734), and regent of the Dutch Republic for her son William V from 1751 until her death."
    sources: [wp-anne-princess-royal-and-princess-of-orange]
  - key: princess-amelia-of-great-britain
