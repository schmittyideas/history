events:
  - key: discovery-of-nuclear-fission
    name: Discovery of nuclear fission
    type: Discovery
    date: 1938-12-17
    place: dahlem-berlin
    prominence: 4
    people: [{person: otto-hahn, role: discovered}, {person: lise-meitner, role: explained}]
    note: Hahn and Strassmann found barium in uranium bombarded with neutrons; Meitner and Frisch explained it as the nucleus splitting.
    sources: [wp-otto-hahn, wp-nuclear-fission, wp-lise-meitner]
  - key: einstein-szilard-letter
    name: Einstein–Szilard letter
    type: Letter
    date: 1939-08-02
    place: white-house
    prominence: 4
    people: [{person: leo-szilard, role: drafted}, {person: albert-einstein, role: signed}, {person: edward-teller, role: drove Szilard to Einstein}]
    note: A letter drafted by Szilard and signed by Einstein warned Roosevelt of possible German atomic bombs; it reached him on 11 October 1939.
    sources: [wp-einstein-szilard-letter]
  - key: manhattan-project
    name: Manhattan Project
    type: Project
    date: 1942-08-13
    end_year: 1946
    place: oak-ridge-tennessee
    places:
      - {place: los-alamos-national-laboratory, role: laboratory, note: "Project Y, where the bombs were designed"}
      - {place: hanford-site, role: plutonium production}
      - {place: chicago-pile-1-site, role: reactor}
    prominence: 4
    people:
      - {person: leslie-groves, role: director}
      - {person: j-robert-oppenheimer, role: Los Alamos director}
      - {person: enrico-fermi, role: scientist}
      - {person: ernest-lawrence, role: scientist}
      - {person: leo-szilard, role: scientist}
      - {person: richard-feynman, role: scientist}
      - {person: edward-teller, role: scientist}
      - {person: niels-bohr, role: consultant}
    note: The US-led programme, with Britain and Canada, that built the first nuclear weapons, with nearly 130,000 staff, to the end of 1946.
    sources: [wp-manhattan-project]
  - key: chicago-pile-1
    name: Chicago Pile-1 goes critical
    type: Experiment
    date: 1942-12-02
    place: chicago-pile-1-site
    prominence: 4
    people: [{person: enrico-fermi, role: led}, {person: leo-szilard, role: present}]
    note: Fermi's team achieved the first human-made self-sustaining nuclear chain reaction, in a squash court under Stagg Field's stands.
    sources: [wp-chicago-pile-1, wp-enrico-fermi]
  - key: polish-enigma-break
    name: Rejewski breaks the Enigma
    type: Breakthrough
    year: 1932
    place: saxon-palace-warsaw
    prominence: 3
    people: [{person: marian-rejewski, role: broke the cipher}]
    note: In December 1932 Rejewski used permutation theory to work out the German military Enigma's wiring without ever seeing the machine.
    sources: [wp-marian-rejewski, wp-cipher-bureau-poland]
  - key: pyry-enigma-meeting
    name: Pyry meeting on Enigma
    type: Conference
    date: 1939-07-25
    place: pyry
    prominence: 3
    people: [{person: marian-rejewski, role: presented}]
    note: Five weeks before the war, the Polish Cipher Bureau showed French and British intelligence its Enigma methods and replica machines.
    sources: [wp-marian-rejewski, wp-cipher-bureau-poland]
  - key: first-bombe
    name: First British bombe installed
    type: Invention
    date: 1940-03-18
    place: bletchley-park
    prominence: 3
    people: [{person: alan-turing, role: designer}, {person: gordon-welchman, role: improved}]
    note: "The bombe Victory, Turing's electromechanical Enigma-breaking machine built by BTM, went into Hut 1 at Bletchley Park; Welchman's diagonal board followed."
    sources: [wp-bombe, wp-alan-turing]
  - key: first-penicillin-patient
    name: First patient treated with penicillin
    type: Experiment
    date: 1941-02-12
    place: radcliffe-infirmary
    prominence: 3
    people: [{person: howard-florey, role: treated}, {person: ernst-chain, role: treated}]
    note: Constable Albert Alexander became the first person given injected penicillin; he improved, then died when the supply ran out.
    sources: [wp-albert-alexander, wp-howard-florey]
  - key: chain-home-radar
    name: Chain Home radar goes into service
    type: Invention
    year: 1938
    place: bawdsey-manor
    prominence: 3
    people: [{person: robert-watson-watt, role: developed}]
    note: The first five stations of Chain Home, the first early-warning radar network, were declared operational during the 1938 Munich crisis.
    sources: [wp-chain-home, wp-robert-watson-watt]
  - key: peenemunde-raid
    name: Peenemünde raid (Operation Hydra)
    type: Attack
    date: 1943-08-17
    place: peenemunde-army-research-center
    prominence: 2
    note: An RAF Bomber Command night raid on the German rocket centre; 40 bombers were lost, and hundreds of forced labourers were killed.
    sources: [wp-operation-hydra-1943, wp-peenemunde-army-research-center]
  - key: first-v-2-attack
    name: First V-2 rocket attacks
    type: Attack
    date: 1944-09-08
    place: chiswick
    prominence: 3
    people: [{person: wernher-von-braun, role: designer}]
    note: The first combat V-2s were fired at Paris and London; the first to hit London fell in Chiswick on the evening of 8 September 1944.
    sources: [wp-v-2-rocket, wp-chiswick]
