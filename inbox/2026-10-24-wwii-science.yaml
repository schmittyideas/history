batch:
  title: "WWII, batch 5: science and codebreaking"
  requested: "Ty: WWII build-out, batch 5 (science and codebreaking); do all batches"
  date: 2026-10-24

# Notes for the reviewer
# - Facts come from English Wikipedia, read through the Wikipedia API on 2026-10-24: each person's article, and each event's article
#   (Nuclear fission, Einstein–Szilard letter, Manhattan Project, Chicago Pile-1, Cipher Bureau (Poland), Bombe, V-2 rocket,
#   Albert Alexander, Chain Home, Operation Hydra). Sitelinks from Wikidata on 2026-10-24; coordinates from each place's article.
# - All 15 new people are type Scholar, so their prominence follows the sitelinks scale (150+ = 5 ... under 40 = 1); roles say
#   physicist, chemist, engineer, cryptanalyst and so on. Von Braun's note says he was a Nazi Party and SS member who used forced
#   labour, as his article does.
# - Existing people: Leslie Groves gets his Manhattan Project command as a military title (from his promotion on 23 September
#   1942 to the handover to the Atomic Energy Commission on 1 January 1947; other dates are logged). Oppenheimer, Turing, Einstein
#   and Teller are linked to the events their articles put them in. Tommy Flowers is linked to the existing Colossus event.
# - Portraits: public domain lead images only. Left out: Heisenberg, Hahn, Rejewski (CC BY-SA), Feynman and Welchman (local
#   non-free files).
# - Places: the wartime Kaiser Wilhelm Institutes have no coordinates of their own (their articles now describe the Max Planck
#   institutes elsewhere), so fission is placed at Dahlem, the Berlin district where they stood. Operation Hydra's own coordinates
#   are mistyped on Wikipedia (west longitude), so the Peenemünde Army Research Center's are used. Flowers was born in Poplar and
#   died in Mill Hill: both are filed at London. Welchman was born in Fishponds: filed at Bristol. Burials are left out where the
#   article names none (Szilard, Lawrence, Flowers, Welchman, Chain) or the cremation left no grave (Florey; Watson-Watt's
#   churchyard has no coordinates).
# - The Polish break of Enigma (December 1932) and Chain Home (operational 1938) have no exact day in their articles: years only.

