discrepancies:
  - key: fission-discovery-date
    question: When did Hahn and Strassmann discover nuclear fission?
    about: [{event: discovery-of-nuclear-fission}]
    field: date
    claims:
      - {value: "16–17 December 1938 (the decisive experiment)", sources: [wp-otto-hahn]}
      - {value: "19 December 1938", sources: [wp-nuclear-fission], note: "Also the date of Hahn's letter to Meitner"}
    note: The record uses 17 December, the experiment.
  - key: manhattan-project-start
    question: When was the Manhattan Project's Manhattan District created?
    about: [{event: manhattan-project}, {person: leslie-groves}]
    field: date
    claims:
      - {value: "13 August 1942", sources: [wp-manhattan-project]}
      - {value: "16 August 1942 (formally established)", sources: [wp-leslie-groves]}
      - {value: "June 1942", sources: [wp-j-robert-oppenheimer], note: "Also Groves's DSM citation, 'from June 1942 to August 1945'"}
    note: The event uses 13 August; Groves's title starts when he took command, 23 September 1942.
  - key: pyry-meeting-dates
    question: Was the Pyry meeting on 25 July or 25–26 July 1939?
    about: [{event: pyry-enigma-meeting}]
    field: date
    claims:
      - {value: "25 July 1939", sources: [wp-marian-rejewski]}
      - {value: "25 and 26 July 1939", sources: [wp-cipher-bureau-poland]}
    note: The record uses 25 July, the day it began.
