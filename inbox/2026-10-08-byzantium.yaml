  - key: coup-of-alexios-v-january-1204
    question: On what night was the coup of Alexios Doukas Mourtzouphlos, and when did Isaac II and Alexios IV die?
    about: [{person: alexios-v-doukas}, {person: alexios-iv-angelos}, {person: isaac-ii-angelos}]
    field: date
    claims:
      - {value: "Alexios IV and Isaac II imprisoned on the night of 27 January 1204; Alexios IV strangled 'probably on 8 February'", sources: [wp-alexios-iv-angelos]}
      - {value: "Acclaimed 'as early as' 27 January; arrest 'on the night of 28-29 January'; crowned on or around 5 February; Alexios IV 'probably killed' about 8 February", sources: [wp-alexios-v-doukas]}
      - {value: "Army proclaimed Alexios V on 28 January 1204; Isaac II had 'already died'", sources: [wp-theodore-i-laskaris]}
      - {value: "Isaac II died 28 January 1204", sources: [wp-isaac-ii-angelos]}
    note: "The records use 28 January 1204 for the end of Isaac II's and Alexios IV's rows and the start of Alexios V's; year-only death for Alexios IV."
  - key: john-iii-vatatzes-death-1254
