    field: died
    claims:
      - {value: "3 November 1254, at Nymphaion; buried in Sosandra monastery in the region of Magnesia", sources: [wp-john-iii-doukas-vatatzes]}
      - {value: "4 November 1254, at Nicaea; buried in Sosandra monastery on Mount Sipylus; Theodore II succeeded him that day", sources: [wp-theodore-ii-laskaris]}
    note: "John III's row ends 3 November (his own article); Theodore II's starts 4 November; the moment places the death at Nymphaion. The feast of John Vatatzes is kept on 4 November."
  - key: michael-viii-proclamation-1259
