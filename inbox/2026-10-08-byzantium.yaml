      - {value: "8 (or 9) April 1195", sources: [wp-isaac-ii-angelos]}
    note: "Both title rows use the year 1195."
  - key: alexios-iii-flight-date-1203
    question: On which night did Alexios III flee Constantinople, and when was Isaac II freed?
    about: [{person: alexios-iii-angelos}, {event: fourth-crusade-restores-isaac-ii-1203}]
    field: date
    claims:
      - {value: "Fled on the night of 17-18 July 1203 after his sally failed on 17 July", sources: [wp-alexios-iii-angelos, wp-theodore-i-laskaris]}
      - {value: "The crusaders assaulted on 18 July, Alexios III fled at once, and the citizens freed Isaac II 'the next morning'", sources: [wp-alexios-iv-angelos]}
