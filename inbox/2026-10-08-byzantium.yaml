discrepancies:
  - key: constantine-viii-death-day-1028
    question: On what day did Constantine VIII die in November 1028, and when did Zoe marry Romanos III?
    about: [{person: constantine-viii}, {person: zoe-porphyrogenita}, {person: theodora-porphyrogenita}]
    field: died
    claims:
      - {value: "Reign as sole emperor 15 December 1025 to 11 November 1028; Zoe and Romanos married on 10 November in the palace chapel and 'the next day Constantine died'", sources: [wp-zoe-porphyrogenita]}
      - {value: "Sole emperor until 12 November 1028; Zoe 'married Romanos three days before her father died'", sources: [wp-theodora-porphyrogenita]}
    note: "Constantine VIII is an existing record; this entry is only added as a discrepancy. The batch's rows do not use his death day."
  - key: battle-of-petroe-or-hades-1057
    question: What was the 1057 battle between Isaac Komnenos and Michael VI called, where and when?
    about: [{event: battle-of-petroe-1057}]
    field: date
    claims:
      - {value: "Battle of Hades, near Nicaea (no day)", sources: [wp-isaac-i-komnenos]}
      - {value: "Battle of Petroe, 20 August 1057, near Nicaea", sources: [wp-michael-vi-bringas]}
      - {value: "Battle of Petroe, 20 August 1057, 'at Constantinople'", sources: [wp-nikephoros-iii-botaneiates]}
    note: "The record uses Petroe, 20 August 1057, at Nicaea (two articles agree on date and the Michael VI and Isaac I articles on place)."
  - key: michael-vii-abdication-and-nikephoros-iii-accession-1078
    question: When did Michael VII leave the throne and when did Nikephoros III become emperor in 1078?
    about: [{person: michael-vii-doukas}, {person: nikephoros-iii-botaneiates}]
    field: date
    claims:
      - {value: "Michael VII resigned on 24 or 31 March 1078 and went to the Stoudios monastery", sources: [wp-michael-vii-doukas]}
      - {value: "Michael VII abdicated on 31 March; Nikephoros entered Constantinople on 3 April 1078; the Senate proclaimed him emperor on 7 January 1078 (the lead: reign from 7 January 1078); he declared himself on 2 July/October 1077", sources: [wp-nikephoros-iii-botaneiates]}
    note: "Michael VII's row ends 31 March 1078 and Nikephoros III's row starts on 7 January 1078 (the article's lead), so they overlap by three months."
  - key: manuel-i-death-day-1180
