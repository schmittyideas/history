batch:
  title: "The emperors and empresses of Byzantium, 1034-1453"
  requested: "Michael IV through Constantine XI, including Zoe and Theodora Porphyrogenita and the emperors of Nicaea: lives, reigns, battles, councils, places"
  date: 2026-10-08

# Notes for the reviewer
# - Source: local copies of the English Wikipedia articles for the 31 people (nothing was fetched). Line 1-3 of every file was checked: each is the right article (no disambiguation pages). Constantine XI's file is about 90k characters, but only the first ~60k are the article; the rest is notes and references and was skipped. Facts not in the articles are left out.
# - Romanos III Argyros (1028-1034) was NOT downloaded and is NOT entered. Zoe's marriages to him, to Michael IV and to Constantine IX are only in Zoe's record and in the Michael IV note. The existing "Byzantine co-emperor"/"Byzantine Emperor" rows of Constantine VIII end in 1028, so the timeline has a gap 1028-1034 (Romanos III).
# - Titles: "Byzantine Emperor" (realm Byzantine Empire, existing) for every emperor, and "Byzantine Empress" for Zoe and Theodora when they ruled in their own right. Zoe's row covers only the joint reign with Theodora, 21 April to 11 June 1042; her years as Augusta beside Romanos III, Michael IV and Constantine IX are in the note, not a title row. Theodora's row runs 21 April 1042 to 31 August 1056 (the article's own reign dates; sole ruler from 11 January 1055).
# - Nicaea: Theodore I, John III and Theodore II keep realm Byzantine Empire and title "Byzantine Emperor", with the note 'in exile at Nicaea, 1204-1261'. Michael VIII's row starts on 1 January 1259 (formally proclaimed emperor at Nymphaion) and runs to his death; before 1261 it is also Nicaea. The Latin emperors, the Empire of Trebizond, Epirus and the Bulgarian rulers are out of scope.
# - Not entered (no article downloaded, or a title with no realm): regents Eudokia Makrembolitissa (1067-68, she also co-ruled one month with Michael VII in 1071) and Maria of Antioch (1180-82); the boy-emperor John IV Laskaris (1258-1261; the timeline has a gap 16 August 1258 to 1 January 1259 before Michael VIII, and John is named only in notes); the usurper emperors Andronikos IV, John VII, Alexios Branas, Nestor, Nicholas Kanabos, Constantine Laskaris and the like; Michael IX, John VII and other co-emperors. Co-emperor rows ('Byzantine co-emperor') for John II (1092), Alexios II (1171), Andronikos II (crowned 8 November 1272), Manuel II (25 September 1373) and Andronikos III (crowned February 1325) are NOT entered, to keep the batch to about 100 rows; their dates are in the person notes. Add them in a later batch if wanted.
# - Start dates: where an article gives the predecessor's last day, the row starts then and the note gives the coronation (as the Scotland batch does). Exceptions: Nikephoros III starts on 7 January 1078, the date in his article's lead (Senate acclamation), even though Michael VII's row runs to 31 March 1078; the two rows overlap, which is the historical dispute (see the discrepancy). Isaac I starts 30 August 1057 (Michael VI's abdication; the army had proclaimed him on 8 June). Month-only dates (Alexios III March 1195; Alexios IV August 1203; Alexios II end September 1183; Andronikos I September 1183; Theodore I and John III 1221) are given as the year.
# - Overlaps on purpose: John V (1341-1391) overlaps John VI (1347-1354) and the interruptions of 1376 (Andronikos IV) and 1390 (John VII) are only in the note; John VI's own proclamation at Didymoteichon in 1341 is in his note (no day in the article).
# - Events the articles give no usable date or place for, so not entered or entered without a place: Battle of Myriokephalon (1176 is the year the Manuel I article implies; no coordinates are given and the site is disputed, so the event has no place); Levounion, Beroia, Pelagonia, Ankara, Lyon and Florence have no defined place here; the Battle of Pelekanon (10 or 15 June 1329, Andronikos III) is not entered; the Treaty of Deabolis (1108), the Battle of Civetot (October 1096), the Fourth Crusade's arrival (June 1203) and Alexios V's coup (January 1204) are only in notes.
# - 'Theodosian Walls': that name appears in none of the articles, which say only 'walls of Constantinople', 'land walls', 'Gate of St. Romanus' and 'Kerkoporta'. The place key and name theodosian-walls are from general knowledge (as the brief asked); founded/built_by are therefore left out. The point is the St. Romanus Gate area, approximate.
# - Coordinates are from general knowledge (2-3 decimals) and approximate for Blachernae, the walls, Nymphaion, Sosandra and the Stoudios monastery; Manzikert (Malazgirt) is the modern town, approximate. The 'visitable' flags are also general knowledge. Sosandra monastery was destroyed after the 14th-century Turkish conquest (Theodore II article), so it is not visitable.
# - Shared keys defined here that other batches might also send: constantinople, hagia-sophia, blachernae-palace, theodosian-walls, nicaea, manzikert-battlefield, great-schism-1054, battle-of-manzikert-1071, first-crusade-at-constantinople-1096, sack-of-constantinople-1204, second-council-of-lyon-1274, council-of-florence-1439, fall-of-constantinople-1453, recapture-of-constantinople-1261. Existing keys reused (no redefinition): constantine-viii (two parent links and one discrepancy), basil-ii (not used), london.
# - The Great Schism event has only the emperor as a person; Leo IX, Keroularios and the legates have no keys in this batch.
# - Discrepancies recorded below: Constantine VIII's death day (11 or 12 November 1028) and the date of Zoe's marriage; the name of the 1057 battle (Hades or Petroe); Michael VII's abdication and Nikephoros III's accession in 1078; Manuel I's death day; Alexios I's death day; Isaac II's overthrow (March or April 1195); Alexios III's flight (17/18 or 18/19 July 1203); the coup of Alexios V (27, 28 or 28/29 January 1204) and the deaths of Isaac II and Alexios IV; John III's death (date and place); Michael VIII's proclamation; Constantine IX's birth; Constantine XI's accession (6 or 23 January 1449) and death (29 or 30 May 1453). Seen and not entered: Battle of Pelekanon (10 or 15 June 1329); Isaac II's birth is 'possibly September 1156'; John V's and Andronikos II's families are in the notes only; Theodore II's birth is 'November 1221/1222' (recorded as 1221, estimated); the fate and burial of Michael V are not in the article.
# - Size: 31 people, 32 title rows, 12 places, 25 events (100 rows), 15 links, 34 moments, 14 discrepancies.

