discrepancies:
- key: leonardo-da-vinci-born
  question: Where was Leonardo da Vinci born?
  about:
  - person: leonardo-da-vinci
  field: place
  claims:
  - value: In or near Vinci, traditionally at the hamlet of Anchiano (local oral tradition recorded by Emanuele Repetti)
    sources:
    - wp-leonardo-da-vinci
  - value: A house in Florence that Ser Piero almost certainly had
    sources:
    - wp-leonardo-da-vinci
    note: The article calls this still possible.
  note: The record uses Vinci, the best-supported place per the article.
- key: raphael-born
  question: On what day was Raphael born in 1483?
  about:
  - person: raphael
  field: born
  claims:
  - value: 28 March 1483
    sources:
    - wp-raphael
  - value: 6 April 1483
    sources:
    - wp-raphael
  note: The record holds the year 1483 only.
- key: titian-born
  question: When was Titian born?
  about:
  - person: titian
  field: born
  claims:
  - value: 1474 (Titian's own claim in a letter to Philip II)
    sources:
    - wp-titian
    note: The article calls this most unlikely.
  - value: Between 1473 and after 1482 (contemporaries in his old age)
    sources:
    - wp-titian
  - value: Between 1488 and 1490 (most modern scholars)
    sources:
    - wp-titian
  note: The record uses 1488, marked estimated, as the earliest year of the likeliest range.
- key: giorgione-died
  question: Where did Giorgione die and where was he buried?
  about:
  - person: giorgione
  field: place
  claims:
  - value: Island of Poveglia in the Venetian lagoon (the usual view)
    sources:
    - wp-giorgione
  - value: Island of Lazzaretto Nuovo (archival document published in 2011)
    sources:
    - wp-giorgione
  note: Both were plague quarantine islands. No death moment is recorded until settled.
- key: giorgione-titian-teacher
  question: Was Titian Giorgione's pupil, or were both pupils of Giovanni Bellini?
  about:
  - person: giorgione
  - person: titian
  field: teacher
  claims:
  - value: Titian was Giorgione's disciple (Vasari)
    sources:
    - wp-giorgione
  - value: Both were pupils of Giovanni Bellini and lived together in his home (Ridolfi)
    sources:
    - wp-giorgione
  - value: Giorgione was one of Titian's four masters (Dolce), with no documentation found
    sources:
    - wp-titian
  note: The teacher link giorgione to titian follows Vasari and Dolce; treat it as contested.
- key: domenico-ghirlandaio-born
  question: Is Ghirlandaio's birth day known?
  about:
  - person: domenico-ghirlandaio
  field: born
  claims:
  - value: 2 June 1448 (given in the article's opening line)
    sources:
    - wp-domenico-ghirlandaio
  - value: Day and month of birth undocumented; recorded as dying in early January of his forty-fifth year
    sources:
    - wp-domenico-ghirlandaio
  note: The record holds the year 1448 only.
- key: artemisia-gentileschi-born
  question: In what year was Artemisia Gentileschi born?
  about:
  - person: artemisia-gentileschi
  field: born
  claims:
  - value: 8 July 1593
    sources:
    - wp-artemisia-gentileschi
  - value: 1590 (the birth certificate from the Archivio di Stato)
    sources:
    - wp-artemisia-gentileschi
  note: The record uses 1593-07-08, the date the article gives as her birth.
- key: caravaggio-born-place
  question: Was Caravaggio born in Milan or in the town of Caravaggio?
  about:
  - person: caravaggio
  field: place
  claims:
  - value: Milan
    sources:
    - wp-caravaggio
  - value: Caravaggio (previously assumed)
    sources:
    - wp-caravaggio
  note: The record uses Milan, as the article states.
- key: el-greco-born-place
  question: Was El Greco born in the village of Fodele or in Candia (Heraklion), Crete?
  about:
  - person: el-greco
  field: place
  claims:
  - value: Fodele
    sources:
    - wp-el-greco
  - value: Candia (Heraklion)
    sources:
    - wp-el-greco
  note: No birth moment recorded, because the article does not choose.
- key: murillo-born-place
  question: Was Murillo born in Seville or in Pilas?
  about:
  - person: bartolome-esteban-murillo
  field: place
  claims:
  - value: Seville
    sources:
    - wp-bartolome-esteban-murillo
  - value: Pilas
    sources:
    - wp-bartolome-esteban-murillo
  note: No birth moment recorded. Murillo was baptised in Seville in 1618, late December 1617 is the probable birth.
- key: pieter-bruegel-the-elder-born-place
  question: Where was Pieter Bruegel the Elder born?
  about:
  - person: pieter-bruegel-the-elder
  field: place
  claims:
  - value: Breda
    sources:
    - wp-pieter-bruegel-the-elder
    note: Recorded by Lodovico Guicciardini (1567); modern scholars place his childhood in Breda itself.
  - value: A village near Breda called 'Brueghel' (matches no known place)
    sources:
    - wp-pieter-bruegel-the-elder
    note: Karel van Mander (1604).
  note: The record uses Breda, the better-supported reading per the article.
