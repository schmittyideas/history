# Notes for the reviewer
# - 41 painters from 1500 on, ranked by Wikipedia sitelinks (Wikidata), from English Wikipedia articles; each carries a lead image (links only, public domain / CC0 / CC BY-SA).
# - Every person is `coverage: partly`: dates, teachers, patrons, places and one or two key works, no full portfolio. Artworks have no images yet (issue #62).
# - The article texts were cut at 22,000 characters, so late sections (death places, late patrons) are missing for the longest articles; those facts are left out, not guessed.
# - Patron links are mostly missing: popes, Philip IV, Charles V, Louis XIV, Napoleon, the Medici and others are not in the database yet. Their patronage is in the artwork notes only.
# - Coordinates of new places are present-day and approximate (from general knowledge, not the articles).
# - Artemisia: her death is recorded as c. 1654 (her last known commission); the article says the time is disputed but not between sources, so no discrepancy is recorded.

