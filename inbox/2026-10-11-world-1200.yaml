realms:
  - {name: Zagwe dynasty,                region: Sub-Saharan Africa,         country: Ethiopia, note: "Ethiopian dynasty of the Lasta region; Lalibela was one of its kings (his article)"}
  - {name: Grand Duchy of Vladimir,      region: Eastern Europe,             country: Russia, note: "Vladimir-Suzdal; Vsevolod the Big Nest's article calls him Grand Prince of Vladimir"}
  - {name: Galicia-Volhynia,             region: Eastern Europe,             country: Ukraine, note: "Created by Roman the Great when he took Galicia in 1199 (his article)"}
  - {name: Kingdom of Cyprus,            region: Middle East and North Africa, country: Cyprus, note: "Aimery of Lusignan was its first king, from 1196 (his article)"}
  - {name: Armenian Kingdom of Cilicia, region: Middle East and North Africa, country: Turkey, note: "Armenian state in Cilicia; Leo I was its first crowned king"}
  - {name: Ayyubid Sultanate,            region: Middle East and North Africa, country: Egypt, note: "Founded by Saladin; Al-Adil I ruled Egypt and Syria (his article)"}
  - {name: Almohad Caliphate,            region: Middle East and North Africa, country: Morocco, note: "Ruled North Africa and Muslim Spain; Muhammad al-Nasir was its fourth caliph"}
  - {name: Khwarazmian Empire,           region: Central Asia,               country: Uzbekistan, note: "Capital first Gurganj, moved to Samarkand in 1218 (Al-Nasir's article)"}

people:
  - key: emperor-tsuchimikado
    name: Emperor Tsuchimikado
    type: Royalty
    realm: Japan
    born: 1196-01-03
    died: 1231-11-06
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "83rd emperor of Japan, firstborn son of Emperor Go-Toba, who abdicated on 18 February 1198 and went on to rule as cloistered emperor. Reign 1198-1210; the shogunate passed from Minamoto no Yoritomo (died 1199) to Yoriie (assassinated 1203) and Sanetomo. In 1210 Go-Toba had him abdicate for his younger brother Juntoku. He went into exile in Tosa and then Awa and died there at 35."
    sources: [wp-emperor-tsuchimikado]
  - key: emeric-of-hungary
    name: Emeric of Hungary
    type: Royalty
    realm: Hungary
    born: 1174
    died: 1204-11-30
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "King of Hungary and Croatia 1196-1204, eldest son of Bela III, crowned as a child on 16 May 1182. Spent his first four years on the throne fighting his brother Andrew, who forced him to make him duke of Croatia and Dalmatia; seized Andrew in 1203. Worked with the Pope against the Bosnian Church, made Serbia his vassal and first used the title King of Serbia (1202) and the Arpad stripes on a seal. Could not stop the Fourth Crusade and Venice seizing Zadar in 1202. Had his four-year-old son Ladislaus crowned on 26 August 1204; buried at Eger. His widow Constance of Aragon later married Frederick II."
    sources: [wp-emeric-of-hungary]
  - key: leszek-the-white
    name: Leszek I the White
    type: Royalty
    realm: Poland
    house: Piast
    born: 1184
    born_estimated: true
    died: 1227-11-24
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Prince of Sandomierz and High Duke of Poland (Kraków) in 1194-1198, 1199, 1206-1210 and 1211-1227, eldest surviving son of Casimir II. A child at his father's death on 5 May 1194, he fought his uncle Mieszko III the Old (battle of Mozgawa, 13 September 1195) and later Władysław III Spindleshanks. Placed his lands under papal vassalage in 1207; excommunicated in 1210 (Mieszko Tanglefoot took Kraków and held it until his death in May 1211). Long wars over Galicia-Volhynia (beat and killed Roman the Great at Zawichost in 1205). Took the title dux Poloniae from 1218. Assassinated at Gąsawa on 24 November 1227, buried at Wawel. Born 'c. 1184/1185'."
    sources: [wp-leszek-the-white]
  - key: ottokar-i-of-bohemia
    name: Ottokar I of Bohemia
    type: Royalty
    realm: Bohemia
    house: Přemyslid
    born: 1155
    born_estimated: true
    died: 1230
    prominence: 4
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Přemysl Otakar I, duke of Bohemia periodically from 1192 and the first hereditary king of Bohemia. Declared king in 1198 with the backing of Philip of Swabia and crowned at Mainz; later recognised by Otto IV and Innocent III, and in 1212 Frederick II granted the Golden Bull of Sicily that made the title hereditary for his heirs. Divorced Adelheid of Meissen in 1199 to marry Constance of Hungary. Father of Wenceslaus I and Saint Agnes of Bohemia. Reign saw German immigration and the growth of towns."
    sources: [wp-ottokar-i-of-bohemia]
  - key: vsevolod-the-big-nest
    name: Vsevolod the Big Nest
    type: Royalty
    realm: Grand Duchy of Vladimir
    house: Rurikid
    born: 1154
    died: 1212-04-12
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Vsevolod III Yuryevich, Grand Prince of Vladimir 1176-1212, tenth or eleventh son of Yuri Dolgoruky; spent his youth at the Byzantine court. Briefly set on the Kiev throne in 1173; succeeded his brother Mikhalko in Vladimir in 1176, broke the boyars, raided Volga Bulgaria and put his own princes on the throne of Novgorod. Punished Ryazan (1180, 1187, burned in 1207). Named 'Big Nest' for his fourteen children by Maria Shvarnovna. Divided his lands among his sons before he died; buried in the Assumption Cathedral, Vladimir; the war of succession followed in 1212-1216."
    sources: [wp-vsevolod-the-big-nest]
  - key: roman-the-great
    name: Roman the Great
    type: Royalty
    realm: Galicia-Volhynia
    house: Rurikid
    born: 1152
    born_estimated: true
    died: 1205
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Roman Mstislavich, prince of Novgorod 1168-1170, Volhynia 1170-1205 and Galicia (1189; 1198/99-1205); founder of the Romanovichi branch of the Rurikids. Took Galicia in 1199 and united it with Volhynia; two successful campaigns against the Cumans (1201-1202, 1203-1204); captured Kiev and installed his brother-in-law. According to Dlugosz he sheltered the deposed Constantine Laskaris after 1204. Broke with Leszek the White and Konrad of Masovia and was killed at Zawichost in 1205; his young sons Daniel and Vasylko were driven out of Galicia. Birth given as c. 4 April 1152. Death date disputed (see discrepancy)."
    sources: [wp-roman-the-great]
  - key: cnut-vi-of-denmark
    name: Canute VI of Denmark
    type: Royalty
    realm: Denmark
    born: 1163
    born_estimated: true
    died: 1202-11-12
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Knud Valdemarsøn, eldest son of Valdemar I, crowned co-king at seven on 25 June 1170 (the first coronation in Danish history) and sole king from 1182. Put down a peasant revolt in Skåne at Dösjebro; refused Frederick Barbarossa's demand for homage, and Bishop Absalon beat the Pomeranian fleet; by 1185 Bogislaw I of Pomerania was his vassal and the kings of Denmark were 'King of the Wends' until 1972. Led a crusade against the Estonians in 1197. Died suddenly at 39, without children; succeeded by his brother Valdemar II."
    sources: [wp-cnut-vi-of-denmark]
  - key: sverre-of-norway
    name: Sverre of Norway
    type: Royalty
    realm: Norway
    born: 1151
    born_estimated: true
    died: 1202-03-09
    prominence: 4
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Sverre Sigurdsson, raised in the Faroes and ordained a priest; claimed to be the son of King Sigurd Munn. Became leader of the Birkebeiner rebels in 1177, was proclaimed king in Trøndelag in June 1177, won at Kalvskinnet (19 June 1179) and Nordnes (31 May 1181), and became sole king after the battle of Fimreite on 15 June 1184, where Magnus Erlingsson drowned. Fought the Kuvlungs, the Isle Beards (battle of Florvåg, 3 April 1194) and the church-backed Baglers; excommunicated in 1194 and Norway under interdict from October 1198; won at Strindafjord on 18 June 1199. Died in Bergen on 9 March 1202 and was buried in Christ Church, Bergen (destroyed in 1591). Paternity and birth year are doubted (see discrepancy)."
    sources: [wp-sverre-of-norway]
  - key: sverker-ii-of-sweden
    name: Sverker II of Sweden
    type: Royalty
    realm: Sweden
    house: Sverker
    died: 1210-07-17
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Sverker the Younger or Sverker Karlsson, born before 1167, son of King Karl Sverkersson (murdered on Visingsö in 1167). Grew up in Denmark with his mother's Hvide clan; chosen king in 1195 or 1196 after Knut Eriksson, helped by Jarl Birger Brosa, whose daughter Ingegerd he married. Gave the oldest known ecclesiastical privilege in Sweden (1200). Beat Knut's sons at Älgarås in 1205 but lost the battle of Lena in 1208 to Erik Knutsson and fled to Denmark; killed at Gestilren in July 1210. Said to rest at Alvastra."
    sources: [wp-sverker-ii-of-sweden]
  - key: peter-ii-of-aragon
    name: Peter II of Aragon
    type: Royalty
    realm: Aragon
    born: 1178
    died: 1213-09-12
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Peter the Catholic, King of Aragon and Count of Barcelona 1196-1213, born at Huesca, son of Alfonso II. Acknowledged papal supremacy and was crowned in Rome by Innocent III in 1205, the first king of Aragon crowned by a pope. Married Marie of Montpellier on 15 June 1204; their son was James the Conqueror. Fought at Las Navas de Tolosa in 1212, then crossed the Pyrenees to defend his vassal Raymond VI of Toulouse and was killed at the battle of Muret on 12 September 1213."
    sources: [wp-peter-ii-of-aragon]
  - key: sancho-vii-of-navarre
    name: Sancho VII of Navarre
    type: Royalty
    realm: Navarre
    house: Jiménez
    born: 1157
    born_estimated: true
    died: 1234-04-07
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Sancho the Strong, King of Navarre 1194-1234, last of the Jiménez dynasty and the first to use the chains of Navarre as his blazon. Brother of Berengaria, who married Richard I of England. Crowned at Pamplona on 15 August 1194. Arrived late at Alarcos (1195); lost Álava, Guipúzcoa and Biscay to Castile while campaigning in Africa (1198-1200). At Las Navas de Tolosa (1212) he is said to have broken through the guard around the caliph's tent. Withdrew to Tudela with an ulcerated leg, where his sister Blanche governed until 1229, and died there; succeeded by his nephew Theobald IV of Champagne. Buried first at San Nicolás, later moved to Roncesvalles."
    sources: [wp-sancho-vii-of-navarre]
  - key: sancho-i-of-portugal
    name: Sancho I of Portugal
    type: Royalty
    realm: Portugal
    born: 1154-11-11
    died: 1211-03-26
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Sancho the Populator, second king of Portugal, born Martinho at Coimbra on the feast of Saint Martin. Knighted in 1170; led the Triana Raid. Crowned at Coimbra on 9 December 1185, at 31. Took Silves in 1189 with passing crusaders and styled himself King of Portugal and Silves until the Almohads retook it in 1191 and everything south of the Tagus except Évora. Founded towns (Guarda, 1199) and wrote poetry. Married Dulce of Aragon; eight of eleven children grew up, including his successor Afonso II. Died at Coimbra aged 56."
    sources: [wp-sancho-i-of-portugal]
  - key: enrico-dandolo
    name: Enrico Dandolo
    type: Nobility
    realm: Venice
    house: Dandolo
    born: 1107
    born_estimated: true
    died: 1205
    prominence: 4
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Doge of Venice from 1 June 1192 to May or June 1205, elected old and blind after the abdication of Orio Mastropiero. Reformed Venetian coinage in 1194 (the silver grosso). Made the 1202 contract with the Fourth Crusade, took the cross himself, steered the fleet to Zadar (fell 24 November 1202) and on to Constantinople (sacked 12 April 1204); declined the Latin imperial crown, took the title despot and 'lord of three-eighths of the Roman Empire'. Died in Constantinople and was buried in Hagia Sophia (a cenotaph marks the spot). Born c. 1107 on the account of Marino Sanudo; blindness and age are open (see discrepancies)."
    sources: [wp-enrico-dandolo]
  - key: aimery-of-cyprus
    name: Aimery of Cyprus
    type: Royalty
    realm: Kingdom of Cyprus
    house: Lusignan
    died: 1205-04-01
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Aimery of Lusignan, born before 1155, younger brother of Guy of Lusignan; first king of Cyprus (from 1196) and king of Jerusalem (1198-1205) as husband of Queen Isabella I. Constable of Jerusalem by 1182; captured at Hattin (4 July 1187) and held until early 1188; supported Guy at the siege of Acre (1189). Elected lord of Cyprus after Guy's death in 1194; acknowledged Emperor Henry VI, and Conrad of Querfurt crowned him at Nicosia in September 1197. Crowned king of Jerusalem in January 1198 beside Isabella; made a truce with al-Adil (1 July 1198) and a six-year one in September 1204. Died at Acre on 1 April 1205 after eating white mullet, buried in Nicosia; Cyprus passed to his son Hugh I, Jerusalem to Maria of Montferrat."
    sources: [wp-aimery-of-cyprus]
  - key: tamar-of-georgia
    name: Tamar of Georgia
    type: Royalty
    realm: Georgia
    house: Bagrationi
    born: 1160
    born_estimated: true
    died: 1213-01-18
    prominence: 4
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Tamar the Great, who reigned in her own right (styled mepe, 'king') 1184-1213 over the apex of the Georgian Golden Age. Crowned co-ruler by her father George III in 1178 and again at Gelati in 1184. Married Yury Bogolyubsky (1185-1187, divorced) and then the Alan prince David Soslan (1191). With generals Zakare and Ivane Mkhargrdzeli she pushed Georgia's frontier into Armenia and Azerbaijan: beat the Eldiguzids at Shamkor, Suleiman II of Rum at Basian, took Kars (1206). Helped set up the Empire of Trebizond in 1204. Poets including Shota Rustaveli, author of The Knight in the Panther's Skin, took her as their inspiration. Died near Tbilisi; burial place unknown. Birth and death years disputed (see discrepancies)."
    sources: [wp-tamar-of-georgia]
  - key: leo-i-of-armenia
    name: Leo I of Armenia
    type: Royalty
    realm: Armenian Kingdom of Cilicia
    born: 1150
    died: 1219-05-02
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Leo the Magnificent, tenth lord of Armenian Cilicia from 1187 and its first crowned king, consecrated in Hagia Sophia at Tarsus on 6 January 1198 or 1199. Held off Aleppo and Damascus in 1187, helped the Third Crusade with supplies, guides and pack animals, enlarged his state to Isauria and made a treaty with the sultan of Iconium. Fought the Antiochene war of succession against Bohemond of Tripoli. Married Sibylle of Cyprus in 1210-1211; named a regent for his daughter Isabella before he died; buried at Agner."
    sources: [wp-leo-i-of-armenia]
  - key: al-adil-i
    name: Al-Adil I
    type: Royalty
    realm: Ayyubid Sultanate
    house: Ayyubid
    born: 1145
    died: 1218-08-31
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Saphadin to the Crusaders, younger brother of Saladin, born in June 1145 (possibly in Damascus). Governed Egypt for Saladin, Aleppo (1183-1186) and Egypt again during the Third Crusade. After Saladin's death in 1193 he beat Saladin's sons for the succession: proclaimed himself sultan on 17 February 1200 and by 1202 held all Ayyubid lands. Reformed currency and taxes, kept the peace with the Crusader states and refortified Damascus. Took Ahlat in 1207; in 1209 he led an army to support his nephew al-Awhad against the Georgians besieging Khlat, and a thirty-year truce with Georgia followed. Died on campaign in August 1218 as the Fifth Crusade landed at Damietta; succeeded by his son al-Kamil."
    sources: [wp-al-adil-i, wp-tamar-of-georgia]
  - key: al-nasir-abbasid-caliph
    name: Al-Nasir
    type: Royalty
    realm: Abbasid Caliphate
    house: Abbasid
    born: 1158-08-06
    died: 1225-10-05
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Al-Nasir li-Din Allah, Abbasid caliph in Baghdad from 28 March 1180 to 5 October 1225, son of al-Mustadi; called the last effective Abbasid caliph. Gained full control of Mesopotamia and broke Seljuk power by inciting Khwarazmshah Tekish against Toghrul III (defeated and killed in 1194). Reorganised the futuwwa brotherhoods (1182 initiation, 1207 reform). Befriended Sufis such as al-Suhrawardi. Refused Muhammad II of Khwarazm's claim and survived his march on Baghdad (1217-1218) when snow forced it back. Built the Bab al-Wastani gate and the Abbasid palace in Baghdad. Spent his last three years paralysed and nearly blind; succeeded by his son al-Zahir."
    sources: [wp-al-nasir-abbasid-caliph]
  - key: muhammad-al-nasir
    name: Muhammad al-Nasir
    type: Royalty
    realm: Almohad Caliphate
    house: Almohad
    born: 1182
    born_estimated: true
    died: 1213
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Fourth Almohad caliph (Miramamolin to the Christians), proclaimed on 25 January 1199, the day his father Abu Yusuf Yaqub al-Mansur died. Beat the Banu Ghaniya in Ifriqiya and made Abd al-Wahid governor there, which began the Hafsid dynasty. Routed by the Christian coalition at Las Navas de Tolosa (1212); died the next year, succeeded by his young son Yusuf al-Mustansir. Matthew Paris' story that King John offered to convert to Islam and hold England of him is doubted by historians."
    sources: [wp-muhammad-al-nasir]
  - key: muhammad-ii-of-khwarazm
    name: Muhammad II of Khwarazm
    type: Royalty
    realm: Khwarazmian Empire
    died: 1220
    prominence: 4
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Ala ad-Din Muhammad, Khwarazmshah from 3 August 1200 (his coronation; his father Tekish died on 3 July) to December 1220. Took Khorasan from the Ghurids with Qara Khitai help (Andkhud, 29 September 1204), absorbed Ghurid lands after Muizz al-Din's murder in 1206, and in 1210 took Samarkand from the Qara Khitai and beat them near Talas (Zhilugu's article). By 1217 he held land from the Jaxartes to the Gulf and styled himself shah; his march on Baghdad against al-Nasir failed in the snow. Moved the capital to Samarkand in 1218. The Mongols under Genghis Khan destroyed his realm from 1219; he fled and died in December 1220 on the island of Ashur-Ada in the Caspian. Highly criticised as incompetent. Birth year not in the article."
    sources: [wp-muhammad-ii-of-khwarazm, wp-yelu-zhilugu, wp-al-nasir-abbasid-caliph]
  - key: yelu-zhilugu
    name: Yelü Zhilugu
    type: Royalty
    realm: Western Liao
    house: Yelü
    died: 1213
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Third emperor of Western Liao (Qara Khitai), Gurkhan 1177-1211, second son of Yelü Yilie; killed his elder brother to secure the throne. Allied with Khwarazm against the Ghurids (1198) and later fought Muhammad II; took in the Naiman prince Kuchlug in 1208 and married his daughter to him. In 1210 Muhammad took Samarkand and defeated him near Talas; in 1211 Kuchlug ambushed and captured him near Kashgar. Kept as 'Emperor Emeritus' (Taishang Huang) until his death in 1213, the end of Yelü rule. Birth year not in the article."
    sources: [wp-yelu-zhilugu]
  - key: emperor-huanzong-of-western-xia
    name: Emperor Huanzong of Western Xia
    type: Royalty
    realm: Western Xia
    house: Li
    born: 1177
    died: 1206
    prominence: 2
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Li Chunyou, sixth emperor of Western Xia, 1193-1206, son of Renzong. Court corruption deepened the dynasty's decline; renamed the capital Zhongxing (now Yinchuan) in 1205, the year of the first Mongol raids. His cousin Li Anquan (Emperor Xiangzong) overthrew him in a coup in 1206 and he died that year."
    sources: [wp-emperor-huanzong-of-western-xia]
  - key: lalibela-zagwe-king
    name: Lalibela
    type: Royalty
    realm: Zagwe dynasty
    house: Zagwe
    born: 1162
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Gebre Meskel Lalibela, king of the Zagwe dynasty 1181-1221, son of Jan Seyum, governor of Bugna in Lasta, and the housemaid Kirwerna; born at Roha in 1162 (his hagiography Gadla Lalibela) and named for the bees said to have surrounded him. Exiled by his brother Kedus Harbe, he spent years in Jerusalem, then took the throne, perhaps by force, with Amhara allies (the proverb 'Amhara settled, Agaw exiled'). Credited as patron of the rock-hewn churches of Lalibela, a 'new Jerusalem' after Saladin took the old one in 1187. Chief queen Masqal Kibra; a tradition has him abdicate for 18 months to his nephew Na'akueto La'ab. Venerated as a saint on 19 June. Death date and place not in the article."
    sources: [wp-gebre-meskel-lalibela]
  - key: narapatisithu
    name: Narapatisithu
    type: Royalty
    realm: Pagan Kingdom
    born: 1138
    died: 1211-08-18
    prominence: 3
    coverage: partly
    coverage_note: "reign, life dates, main events and places from the English Wikipedia article; consorts and court mostly not entered; no artworks"
    note: "Sithu II, king of Pagan 1174-1211, called the last important king of Pagan. Took the throne in 1174 (between 27 March and 10 August, most likely April or May) after having his brother Naratheinkha, who had taken his wife, assassinated. Founded the Royal Palace Guards, compiled the first Burmese customary law and built the Kyaukse weir and Mu canals. Pagan Burmese became the written language; his primate Shin Uttarajiva aligned the monks with the Mahavihara of Sri Lanka. Built the Gawdawpalin and Sulamani temples. Died on 18 August 1211. Birth year disputed (see discrepancy)."
    sources: [wp-narapatisithu]

titles:
  - {person: lalibela-zagwe-king, title: Zagwe King, realm: Zagwe dynasty, from: 1181, to: 1221, note: "Reigned 1181-1221 (lead); a tradition has him abdicate for about 18 months for his nephew Na'akueto La'ab and then resume the throne", sources: [wp-gebre-meskel-lalibela]}
  - {person: emperor-tsuchimikado, title: Emperor of Japan, realm: Japan, from: 1198, to: 1210, note: "Go-Toba abdicated on 18 February 1198; Tsuchimikado is said to have acceded in the 3rd month. Go-Toba persuaded him to abdicate in 1210 for his brother Juntoku (no day)", sources: [wp-emperor-tsuchimikado]}
  - {person: emeric-of-hungary, title: King of Hungary, realm: Hungary, from: 1196-04-23, to: 1204-11-30, note: "Succeeded Bela III, who died on 23 April 1196; crowned as a child on 16 May 1182. Died 30 November 1204 per the Illuminated Chronicle", sources: [wp-emeric-of-hungary]}
  - {person: emeric-of-hungary, title: King of Croatia, realm: Croatia, from: 1196-04-23, to: 1204-11-30, note: "King of Hungary and Croatia 1196-1204 (lead); his brother Andrew held Croatia and Dalmatia as an appanage from 1198 and again from 1200", sources: [wp-emeric-of-hungary]}
  - {person: leszek-the-white, title: Duke of Poland, realm: Poland, from: 1194, to: 1198, note: "High Duke from 1194 (lead); his father Casimir II died on 5 May 1194 and his mother Helen was regent; Mieszko III regained Kraków in 1198. Held it again for a short time in 1199 (lead, not a separate row)", sources: [wp-leszek-the-white]}
  - {person: leszek-the-white, title: Duke of Poland, realm: Poland, from: 1206, to: 1210, note: "Second spell, 1206-1210 (lead); the article cannot say how long Władysław III held Kraków after Mieszko III died on 13 March 1202 (see discrepancy). Excommunicated in 1210, when Mieszko Tanglefoot took Kraków", sources: [wp-leszek-the-white]}
  - {person: leszek-the-white, title: Duke of Poland, realm: Poland, from: 1211, to: 1227-11-24, note: "Third spell, 1211-1227 (lead); took the title dux Poloniae from 1218; assassinated at Gąsawa on 24 November 1227", sources: [wp-leszek-the-white]}
  - {person: ottokar-i-of-bohemia, title: King of Bohemia, realm: Bohemia, from: 1198, to: 1230, note: "Declared king in 1198 and crowned at Mainz with Philip of Swabia's backing; accepted as king by Otto IV (1203) and in 1212 made hereditary king by Frederick II's Golden Bull of Sicily. Died 1230 (no day)", sources: [wp-ottokar-i-of-bohemia]}
  - {person: vsevolod-the-big-nest, title: Grand Prince of Vladimir, realm: Grand Duchy of Vladimir, from: 1176, to: 1212-04-12, note: "Succeeded his brother Mikhalko in 1176; died 12 April 1212", sources: [wp-vsevolod-the-big-nest]}
  - {person: roman-the-great, title: Prince of Galicia-Volhynia, realm: Galicia-Volhynia, from: 1199, to: 1205, note: "Took the Galician throne in 1199 and united it with Volhynia, which he had held since 1170 (the lead says Galicia 1198/99-1205). Killed in 1205, exact date disputed (see discrepancy)", sources: [wp-roman-the-great]}
  - {person: cnut-vi-of-denmark, title: King of Denmark, realm: Denmark, from: 1182, to: 1202-11-12, note: "Sole king from his father Valdemar I's death in 1182 (co-king since 1170); died suddenly on 12 November 1202", sources: [wp-cnut-vi-of-denmark]}
  - {person: sverre-of-norway, title: King of Norway, realm: Norway, from: 1184, to: 1202-03-09, note: "Proclaimed king by the Birkebeiner in Trøndelag in June 1177; sole king after Fimreite (15 June 1184); died 9 March 1202", sources: [wp-sverre-of-norway]}
  - {person: sverker-ii-of-sweden, title: King of Sweden, realm: Sweden, from: 1195, from_estimated: true, to: 1208, note: "King from '1195 or 1196' (lead) to his defeat at Lena in 1208 by Erik Knutsson; he returned with Danish help and was killed at Gestilren in July 1210", sources: [wp-sverker-ii-of-sweden]}
  - {person: peter-ii-of-aragon, title: King of Aragon, realm: Aragon, from: 1196, to: 1213-09-12, note: "King of Aragon and Count of Barcelona from 1196 (lead); crowned by Innocent III in Rome in 1205; killed at Muret on 12 September 1213", sources: [wp-peter-ii-of-aragon]}
  - {person: peter-ii-of-aragon, title: Count of Barcelona, realm: Barcelona, from: 1196, to: 1213-09-12, note: "Held with the crown of Aragon (lead)", sources: [wp-peter-ii-of-aragon]}
  - {person: sancho-vii-of-navarre, title: King of Navarre, realm: Navarre, from: 1194, to: 1234-04-07, note: "Succeeded Sancho VI in 1194 and was crowned at Pamplona on 15 August; retired to Tudela and died there on 7 April 1234", sources: [wp-sancho-vii-of-navarre]}
  - {person: sancho-i-of-portugal, title: King of Portugal, realm: Portugal, from: 1185-12-09, to: 1211-03-26, note: "Succeeded Afonso I in 1185 and was crowned at Coimbra on 9 December 1185 (the date used here); styled King of Silves 1189-1191; died 26 March 1211", sources: [wp-sancho-i-of-portugal]}
  - {person: enrico-dandolo, title: Doge of Venice, realm: Venice, from: 1192-06-01, to: 1205, note: "Elected on 1 June 1192 after Orio Mastropiero abdicated; died in May or June 1205 in Constantinople", sources: [wp-enrico-dandolo]}
  - {person: aimery-of-cyprus, title: King of Cyprus, realm: Kingdom of Cyprus, from: 1196, to: 1205-04-01, note: "First king of Cyprus 'from 1196' (lead; Celestine III styled him king in December 1196) after being elected lord in 1194; Conrad of Querfurt crowned him at Nicosia in September 1197 (see discrepancy). Died at Acre on 1 April 1205", sources: [wp-aimery-of-cyprus]}
  - {person: aimery-of-cyprus, title: King of Jerusalem, realm: Kingdom of Jerusalem, from: 1198, to: 1205-04-01, note: "King as the husband of Queen Isabella I from 1198 (lead); crowned with her by Patriarch Aymar in January 1198 (no day). Isabella died soon after him and the kingdom passed to Maria of Montferrat", sources: [wp-aimery-of-cyprus]}
  - {person: tamar-of-georgia, title: King of Georgia, realm: Georgia, from: 1184, to: 1213-01-18, note: "Co-ruler with her father George III from 1178; sole monarch from his death in 1184, when she was crowned a second time at Gelati. The wording 'King' follows the existing Georgia rows (her title was mepe). Death traditionally 18 January 1213 (see discrepancy)", sources: [wp-tamar-of-georgia]}
  - {person: leo-i-of-armenia, title: King of Armenia, realm: Armenian Kingdom of Cilicia, from: 1198, from_estimated: true, to: 1219-05-02, note: "Lord of Armenian Cilicia from 1187; consecrated king in the Hagia Sophia at Tarsus on 6 January 1198 or 1199 (see discrepancy); died 2 May 1219", sources: [wp-leo-i-of-armenia]}
  - {person: al-adil-i, title: Ayyubid Sultan, realm: Ayyubid Sultanate, from: 1200-02-17, to: 1218-08-31, note: "Proclaimed himself sultan on 17 February 1200 after beating his nephew al-Afdal; died on campaign, 31 August 1218 (lead; the body says August 1218)", sources: [wp-al-adil-i]}
  - {person: al-nasir-abbasid-caliph, title: Abbasid Caliph, realm: Abbasid Caliphate, from: 1180-03-28, to: 1225-10-05, note: "Came to power on 28 March 1180 (successor of al-Mustadi); died 5 October 1225 (lead)", sources: [wp-al-nasir-abbasid-caliph]}
  - {person: muhammad-al-nasir, title: Almohad Caliph, realm: Almohad Caliphate, from: 1199-01-25, to: 1213, note: "Proclaimed on the day his father Abu Yusuf Yaqub al-Mansur died, 25 January 1199; died 1213 (no day), the year after Las Navas de Tolosa", sources: [wp-muhammad-al-nasir]}
  - {person: muhammad-ii-of-khwarazm, title: Khwarazmshah, realm: Khwarazmian Empire, from: 1200-08-03, to: 1220, note: "Succeeded Tekish (died 3 July 1200); coronation on 3 August 1200. Died in December 1220 (month only) on the island of Ashur-Ada", sources: [wp-muhammad-ii-of-khwarazm]}
  - {person: yelu-zhilugu, title: Gurkhan, realm: Western Liao, from: 1177, to: 1211, note: "Third emperor of Western Liao, 1177-1211 (lead); captured by Kuchlug in 1211 and kept as Taishang Huang until he died in 1213", sources: [wp-yelu-zhilugu]}
  - {person: emperor-huanzong-of-western-xia, title: Emperor of Western Xia, realm: Western Xia, from: 1193, to: 1206, note: "Reigned 1193-1206 (lead); overthrown by his cousin Li Anquan in 1206 and died that year", sources: [wp-emperor-huanzong-of-western-xia]}
  - {person: narapatisithu, title: King of Pagan, realm: Pagan Kingdom, from: 1174, to: 1211-08-18, note: "Took the throne between 27 March and 10 August 1174 (most probably April or May) after his brother's assassination; died 18 August 1211", sources: [wp-narapatisithu]}
  - {person: frederick-ii-holy-roman-emperor, title: King of Sicily, realm: Sicily, from: 1198, to: 1250-12-13, note: "'King of Sicily from 1198' (lead): crowned at three as co-ruler with his mother Constance, who was queen of Sicily in her own right. Other titles (King of Germany 1212, Emperor 1220) are in the Holy Roman Empire batch. Died 13 December 1250", sources: [wp-frederick-ii-holy-roman-emperor]}

