discrepancies:
  - key: roman-the-great-death-1205
    question: When did Roman the Great die in 1205?
    about: [{person: roman-the-great}, {event: battle-of-zawichost-1205}]
    field: died
    claims:
      - {value: "19 June 1205 (c. 4 April 1152 - 19 June 1205)", sources: [wp-roman-the-great]}
      - {value: "14 October 1205, at the battle of Zawichost where he was killed", sources: [wp-leszek-the-white]}
    note: "Roman's own article gives the battle of Zawichost as the place of his death but no date for it. The records hold only the year 1205."
  - key: tamar-birth
    question: When was Tamar of Georgia born?
    about: [{person: tamar-of-georgia}]
    field: born
    claims:
      - {value: "c. 1160", sources: [wp-tamar-of-georgia]}
      - {value: "c. 1166", sources: [wp-tamar-of-georgia]}
    note: "The lead gives both; the record uses c. 1160."
  - key: tamar-death
    question: When did Tamar of Georgia die?
    about: [{person: tamar-of-georgia}]
    field: died
    claims:
      - {value: "18 January 1213 (the traditional scholarly opinion)", sources: [wp-tamar-of-georgia]}
      - {value: "1207 or 1210 (several indications that she died earlier)", sources: [wp-tamar-of-georgia]}
    note: "The record and the title row use 18 January 1213."
  - key: narapatisithu-birth
    question: When was Narapatisithu born?
    about: [{person: narapatisithu}]
    field: born
    claims:
      - {value: "1138 (the lead's dates 1138-1211; also 'age 73, in his 74th year' at death on 18 August 1211)", sources: [wp-narapatisithu]}
      - {value: "8 October 1150 (the early-life section; the chronicles do not agree, and the article's table of their dates is not in the copy)", sources: [wp-narapatisithu]}
    note: "The record uses 1138, which agrees with his age at death; a birth in 1150 would make him 60 or 61."
  - key: sverre-birth
    question: When was Sverre of Norway born?
    about: [{person: sverre-of-norway}]
    field: born
    claims:
      - {value: "1151 (the Sverris saga's account; lead gives c. 1145/1151)", sources: [wp-sverre-of-norway]}
      - {value: "no later than c. 1145 (he seems to have been in his early thirties in 1176 by the age of his sons and nephews, and would have to be 30 to be a priest)", sources: [wp-sverre-of-norway]}
    note: "The record uses 1151 (estimated), the saga's year. The article adds that the canon-law age argument has lost credence, since the age limit was routinely ignored in Scandinavia. The same doubt affects his claimed paternity (Sigurd Munn, born 1133)."
  - key: enrico-dandolo-birth
    question: When was Enrico Dandolo born?
    about: [{person: enrico-dandolo}]
    field: born
    claims:
      - {value: "c. 1107 (Marino Sanuto, writing three centuries later: he was eighty-five when he became doge in 1192)", sources: [wp-enrico-dandolo]}
      - {value: "Some hypothesise he was only in his mid seventies in 1192, so born roughly 1115-1120 (derived from the article's wording)", sources: [wp-enrico-dandolo]}
    note: "The record uses c. 1107, the commonly given year. No contemporary source gives his age, only 'very old'."
  - key: enrico-dandolo-blindness
    question: How did Enrico Dandolo lose his sight?
    about: [{person: enrico-dandolo}]
    field: note
    claims:
      - {value: "Blinded by the Byzantines during the 1171-1172 expedition: Manuel Comnenus 'ordered his eyes to be blinded with glass' (Chronicle of Novgorod)", sources: [wp-enrico-dandolo]}
      - {value: "Cortical blindness from a severe blow to the back of the head, between 1174 and 1176 (Thomas F. Madden; his signature was legible in 1174 and sprawling in 1176; Villehardouin says his eyes looked normal)", sources: [wp-enrico-dandolo]}
    note: "Not recorded as a field on the person; the note says only that he was blind."
  - key: aimery-cyprus-kingship
    question: When did Aimery become king of Cyprus?
    about: [{person: aimery-of-cyprus}]
    field: date
    claims:
      - {value: "1196 (the lead: 'first king of Cyprus from 1196'; Celestine III styled him king in December 1196, after Henry VI's envoys brought a sceptre in April or May 1196)", sources: [wp-aimery-of-cyprus]}
      - {value: "September 1197, when Conrad of Querfurt, Henry VI's chancellor, crowned him at Nicosia and received his homage", sources: [wp-aimery-of-cyprus]}
    note: "The title row uses 1196 (lead); the coronation moment uses 1197."
  - key: leo-i-coronation-year
    question: In which year was Leo I crowned king?
    about: [{person: leo-i-of-armenia}, {event: coronation-of-leo-i-of-armenia-1198}]
    field: date
    claims:
      - {value: "6 January 1198", sources: [wp-leo-i-of-armenia]}
      - {value: "6 January 1199 (the lead says 'in 1198/9' and 'on 6 January 1199 or 1198')", sources: [wp-leo-i-of-armenia]}
    note: "The article never settles it. The title row and event use 1198 and are marked estimated."
  - key: gestilren-site
    question: Where was the battle of Gestilren (1210) fought?
    about: [{event: battle-of-gestilren-1210}, {person: sverker-ii-of-sweden}]
    field: place
    claims:
      - {value: "In the parish of Varv in Västergötland (the usual view)", sources: [wp-sverker-ii-of-sweden]}
      - {value: "Gästre in Uppland (suggested; Sandblom, 'Gestilren 1210. Striden stod i Uppland! I Gästre!')", sources: [wp-sverker-ii-of-sweden]}
    note: "No place is recorded for the battle."
  - key: leszek-return-to-krakow
    question: When did Leszek the White regain Kraków after Mieszko III's death?
    about: [{person: leszek-the-white}]
    field: date
    claims:
      - {value: "Władysław III Spindleshanks' rule in Kraków ended a few months after Mieszko III died (13 March 1202), in autumn 1202", sources: [wp-leszek-the-white]}
      - {value: "It lasted until 1206 or even 1210 (the version the article says seems more likely)", sources: [wp-leszek-the-white]}
    note: "The lead dates Leszek's third spell as 1206-1210, which the title rows follow."
  - key: sancho-vii-second-wife
    question: Who was Sancho VII of Navarre's second wife?
    about: [{person: sancho-vii-of-navarre}]
    field: note
    claims:
      - {value: "Clemence, daughter of Emperor Frederick I", sources: [wp-sancho-vii-of-navarre]}
      - {value: "A daughter of Yusuf II, an emir from Morocco", sources: [wp-sancho-vii-of-navarre]}
    note: "No marriage link is recorded. The article says he had no known children by either wife, though Charles of Viana says a son by the second wife died at 15."
  - key: lalibela-churches-builder
    question: Who built the rock-hewn churches of Lalibela?
    about: [{person: lalibela-zagwe-king}, {place: lalibela-rock-hewn-churches}]
    field: note
    claims:
      - {value: "King Lalibela carved the churches out of stone with only the help of angels (the later Gadla Lalibela)", sources: [wp-gebre-meskel-lalibela]}
      - {value: "Queen Masqal Kibra had one of them, Bet Abba Libanos, built as a memorial after his death (Getachew Mekonnen)", sources: [wp-gebre-meskel-lalibela]}
    note: "The record credits the king as patron, as the article's lead does."
