batch:
  title: "The world in 1200: rulers of the main states"
  requested: "One ruler for each major state on the Year-view map at 1200 (snapshot-year batch of the build-out), with a few dated events of 1185-1215"
  date: 2026-10-11

# Notes for the reviewer
# - Source: local copies of the English Wikipedia articles (wp6 directory, plus wp2 for Frederick II); nothing was fetched. Line 1-3 of every file was checked. Headings that differ from the plan title: Aimery_of_Jerusalem is "Aimery of Cyprus" (key aimery-of-cyprus, given both realms), Sverker_II_of_Sweden is "Sverker the Younger" (key sverker-ii-of-sweden), Cnut_VI_of_Denmark is "Canute VI of Denmark" (key cnut-vi-of-denmark), Al-Nasir_li-Din_Allah is "Al-Nasir" (key al-nasir-abbasid-caliph), Leszek_the_White is "Leszek I the White" (key leszek-the-white). Long articles (Tamar, Muhammad II of Khwarazm, Al-Nasir, Aimery, Sverre) were read selectively: lead, rise, reign, death; the long Khwarazm and Al-Nasir wars and the Mongol invasion were not worked through.
# - Lalibela (Zagwe dynasty) is entered from wp6/Gebre_Mesqel_Lalibela.txt (heading "Gebre Meskel Lalibela"); the earlier file wp6/Lalibela.txt was the town article and is not used. The article gives no death date or place, so there is no death or burial moment; the born moment is at Roha, the town later renamed Lalibela, which is the place record below.
# - New realms (8): Zagwe dynasty, Grand Duchy of Vladimir, Galicia-Volhynia, Kingdom of Cyprus, Armenian Kingdom of Cilicia, Ayyubid Sultanate, Almohad Caliphate, Khwarazmian Empire. Aragon, Navarre and Kingdom of Jerusalem are defined in the sibling batch inbox/2026-10-11-world-1100.yaml and only referenced here, so that batch must be applied first (the preview will otherwise warn that these realms have no region). The source wp-frederick-ii-holy-roman-emperor is repeated below with the same key and URL as in 2026-10-08-holy-roman-empire.yaml (a plain upsert).
# - Title wordings: Tamar of Georgia is "King of Georgia", the plan's and the existing realm wording (the article says her title mepe means 'king' in Georgian and that she was styled king of kings); the person note says she was a woman ruling in her own right. Aimery gets two rows, "King of Cyprus" (Kingdom of Cyprus) and "King of Jerusalem". Peter II gets "King of Aragon" and "Count of Barcelona" (the existing wording for Barcelona); Emeric gets "King of Hungary" and "King of Croatia" (the existing wording for Croatia). Leo I: realm "Armenian Kingdom of Cilicia", wording "King of Armenia" as in the plan.
# - Title rows NOT entered: Ottokar I as Duke of Bohemia (the article gives 1192 as a start but only "periodically" and "soon overthrown", no end); Leo I as lord of Armenian Cilicia 1187-1198 (other wording, not in the plan); Frederick II is not a new person (only the Sicily row below). Leszek the White is a person but the Year view will show no Polish duke of his at exactly 1200: his lead dates his rule 1194-1198, 1199, 1206-1210 and 1211-1227; the 1199 spell is in the first row's note only, and the gap 1200-1205 is real (Mieszko III the Old held Kraków until 13 March 1202, then Władysław III Spindleshanks; the article does not give a clear start year for Leszek's return, see discrepancy).
# - Roman the Great: the title row starts 1199 (the body: he took the Galician throne in 1199 after Volodymyr Yaroslavych died, 'creating the Principality of Galicia-Volhynia'; the lead says 1198/99) and ends 1205 (year only, because the two dates the articles give for his death disagree, see discrepancy). He held Volhynia from 1170 and Galicia briefly in 1189.
# - Sverker II: the title starts '1195 or 1196' in his lead; the row uses 1195 with from_estimated. Ends 1208 (his defeat at Lena, year only).
# - Title ends given as a year because the article gives no day: Tsuchimikado 1210, Dandolo 1205 (May or June), Muhammad al-Nasir 1213, Ottokar I 1230, Muhammad II (December 1220 is a month only), Zhilugu 1211 (captured; he died in captivity in 1213 as 'Taishang Huang', not entered as a title). Al-Adil's end 31 August 1218 is the lead's day (the body says only August 1218). Emeric's death day, 30 November 1204, is the Illuminated Chronicle's as the article quotes it.
# - Tsuchimikado's start is 1198 (year only): the article gives 18 February 1198 for Go-Toba's abdication and 'the 3rd month' for his accession, no day. Huanzong's start 1193 and end 1206 are years only.
# - Overlaps / Year-view notes: Western Liao's last row from the 1100 era is Yelu Dashi's; Zhilugu's starts 1177 (year). Western Xia: Huanzong's reign 1193-1206 ends with the coup of his cousin Li Anquan (Xiangzong).
# - Discrepancies recorded below (13): Roman the Great's death (19 June vs 14 October 1205); Tamar's birth and her death; Narapatisithu's birth; Sverre's birth; Enrico Dandolo's birth and his blindness; when Aimery became king of Cyprus; when Leo I was crowned; where the battle of Gestilren was fought; when Leszek came back to Kraków; the identity of Sancho VII's second wife. Seen and not entered (a range or a typo inside one article, or not about a record here): Leszek's birth 'c. 1184/1185' (entered as 1184 estimated); Emeric's invasion of Serbia 'in 1201 or 1202'; the date of the battle of Basian ('1202, 1203 or 1204', Tamar's article; no event entered); Sancho I and the authorship of the cantiga 'A Ribeirinha'; Al-Nasir's mother's death date (Dec 1202-Jan 1203 or Jan-Feb 1203).
# - Events: 8 new events (Hattin 1187, Silves 1189, Zadar 1202, Zawichost 1205, Gestilren 1210, Leo I's coronation 1198, Golden Bull of Sicily 1212, Muret 1213) and 5 link-only updates to existing events (third-crusade-1189, fourth-crusade-1202, sack-of-constantinople-1204, battle-of-alarcos-1195, battle-of-las-navas-de-tolosa-1212). The existing alarcos note says only Alfonso VIII; Sancho VII is added as 'arrived late'. The Almohad caliph at Alarcos was Muhammad al-Nasir's father, so Muhammad is linked only to Las Navas. Genghis Khan's rise is not in this batch.
# - Existing place reused, not redefined: coimbra (Sancho I's moments), plus rome, mainz, constantinople, hagia-sophia, bergen and gelati-monastery. Coordinates are general knowledge (2-3 decimals); Ashur-Ada, the Gawdawpalin and the Assumption Cathedral points are approximate. Moments take a year only (checked).
# - Obsidian: no links. Images: none.

