    historical_name: Roha
    kind: church
    region: Amhara
    country: Ethiopia
    lat: 12.031
    lng: 39.047
    visitable: true
    built_by: "credited to King Lalibela, who the Gadla Lalibela says carved the 11 monolithic churches with the help of angels; Bet Abba Libanos credited to his queen Masqal Kibra by Getachew Mekonnen"
    note: "Town of Roha, renamed Lalibela in the king's honour, and his capital of 11 monolithic churches. Lalibela was born at Roha in 1162. No details of construction survive; the Portuguese embassy of 1520-6 was told it took 24 years. Coordinates general knowledge."
