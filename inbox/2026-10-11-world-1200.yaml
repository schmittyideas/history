      - {person: emeric-of-hungary, role: king whose vassal city Zadar the crusaders took}
    sources: [wp-enrico-dandolo, wp-emeric-of-hungary]
  - key: sack-of-constantinople-1204
    people:
      - {person: enrico-dandolo, role: doge; refused the imperial crown, took the title despot}
    sources: [wp-enrico-dandolo]
  - key: battle-of-alarcos-1195
    people:
      - {person: sancho-vii-of-navarre, role: arrived late, souring relations with Castile}
    sources: [wp-sancho-vii-of-navarre]
  - key: battle-of-las-navas-de-tolosa-1212
    people:
      - {person: muhammad-al-nasir, role: Almohad caliph; defeated}
      - {person: peter-ii-of-aragon, role: victor}
      - {person: sancho-vii-of-navarre, role: victor; said to have broken the guard around the caliph's tent}
    sources: [wp-muhammad-al-nasir, wp-peter-ii-of-aragon, wp-sancho-vii-of-navarre]
  # --- new events ---
  - key: battle-of-hattin-1187
    name: Battle of Hattin
    type: Battle
    date: 1187-07-04
    people:
      - {person: aimery-of-cyprus, role: constable of Jerusalem; organised the army; captured}
    prominence: 5
    note: "Saladin's decisive victory over the army of the Kingdom of Jerusalem on 4 July 1187. Aimery, then constable, drew up the army in units and was captured with most commanders; the victory let Saladin take almost all of the Latin East, and only Tyre stayed Christian. Aimery and Guy were among ten men Saladin promised to free when Ascalon surrendered on 4 September, but he held them until early 1188. No place defined; Saladin is not yet a record."
    sources: [wp-aimery-of-cyprus]
  - key: capture-of-silves-1189
    name: Sancho I takes Silves
    type: Siege
    year: 1189
    place: silves
    people:
      - {person: sancho-i-of-portugal, role: victor}
    prominence: 3
    note: "With soldiers on their way to the Third Crusade, Sancho sacked Alvor and took Silves in 1189 (an eyewitness account survives in De itinere navali), then styled himself King of Portugal and Silves. The Almohad caliph Yaqub al-Mansur invaded in 1190 (failing at Tomar) and again in 1191, when Silves and all land south of the Tagus except Évora was lost."
    sources: [wp-sancho-i-of-portugal]
  - key: siege-of-zadar-1202
    name: Crusaders take Zadar for Venice
    type: Siege
    date: 1202-11-24
    place: zadar
    people:
      - {person: enrico-dandolo, role: doge; gave the Zarans an ultimatum}
      - {person: emeric-of-hungary, role: king and suzerain of the city}
    prominence: 3
    note: "The Fourth Crusade, unable to pay Venice 85,000 marks, agreed to retake Zadar for the doge. Pope Innocent III forbade the attack, but the city fell on 24 November 1202 and was given to Venice; the Pope excommunicated the Venetians and the crusaders at Emeric's request, but Zadar stayed Venetian. Dandolo hid the excommunication from the Venetians so they would not leave the Crusade."
    sources: [wp-enrico-dandolo, wp-emeric-of-hungary]
  - key: battle-of-zawichost-1205
    name: Battle of Zawichost
    type: Battle
    date: 1205-10-14
    place: zawichost
    people:
      - {person: leszek-the-white, role: victor}
      - {person: roman-the-great, role: defeated; killed}
    prominence: 3
    note: "Roman the Great broke his alliance with Leszek and Konrad of Masovia and invaded Poland (perhaps through the intrigues of Władysław III Spindleshanks); his force was attacked by Polish knights and he was killed. The date 14 October 1205 is from Leszek's article; Roman's own article gives a different death date (see discrepancy). His death began the War of the Galician Succession; the Galician throne passed to Vladimir III Igorevich."
    sources: [wp-leszek-the-white, wp-roman-the-great]
  - key: battle-of-gestilren-1210
    name: Battle of Gestilren
    type: Battle
    date: 1210-07-17
    people:
      - {person: sverker-ii-of-sweden, role: defeated; killed}
    prominence: 2
    note: "Sverker, back from exile in Denmark with Danish support, was defeated and killed in July 1210, according to the sources by the Folkung party under his brother-in-law Folke Jarl, who also fell. The day 17 July is his death date in the lead. The battlefield is disputed (see discrepancy), so no place is defined."
    sources: [wp-sverker-ii-of-sweden]
  - key: coronation-of-leo-i-of-armenia-1198
    name: Leo I crowned king of Armenian Cilicia
    type: Coronation
    year: 1198
    estimated: true
    place: tarsus
    people:
      - {person: leo-i-of-armenia, role: crowned}
    prominence: 3
    note: "Leo was crowned in the Hagia Sophia at Tarsus, the traditional place for the monarchs of Cilician Armenia, on 6 January 1198 (or 1199 - see discrepancy); he was the first king to be crowned."
    sources: [wp-leo-i-of-armenia]
  - key: golden-bull-of-sicily-1212
    name: Golden Bull of Sicily
    type: Charter
    year: 1212
    people:
      - {person: frederick-ii-holy-roman-emperor, role: granted it}
      - {person: ottokar-i-of-bohemia, role: received it}
    prominence: 4
    note: "Frederick II recognised Ottokar and his heirs as hereditary kings of Bohemia: the king was no longer appointed by the emperor, had to attend diets only near the Bohemian border, and was to be the leading elector and send 300 knights as a bodyguard for the emperor's journey to Rome. Day and place are not in the article."
    sources: [wp-ottokar-i-of-bohemia]
  - key: battle-of-muret-1213
    name: Battle of Muret
    type: Battle
    date: 1213-09-12
    place: muret
    people:
      - {person: peter-ii-of-aragon, role: defeated; killed}
    prominence: 3
    note: "Peter crossed the Pyrenees to defend Raymond VI of Toulouse against Simon de Montfort in the Albigensian Crusade; the Aragonese forces, disorganised, broke when the king fell after a last stand. His only son by Marie of Montpellier, the future James the Conqueror, succeeded him."
    sources: [wp-peter-ii-of-aragon]

