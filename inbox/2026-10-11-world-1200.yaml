    region: Navarre
    country: Spain
    lat: 42.062
    lng: -1.605
    visitable: true
    note: "Usual residence of Sancho VI and Sancha, probable birthplace of Sancho VII; he retired to his castle here and died there on 7 April 1234. The Gothic bridge over the Ebro at Tudela is attributed to him (his article)."
    sources: [wp-sancho-vii-of-navarre]
  - key: pamplona
    name: Pamplona
    kind: city
    region: Navarre
    country: Spain
    lat: 42.812
    lng: -1.646
    visitable: true
    note: "Sancho VII was crowned here on 15 August 1194; he continued the new cathedral begun by his father."
    sources: [wp-sancho-vii-of-navarre]

events:
  # --- link-only updates to existing events ---
  - key: third-crusade-1189
    people:
      - {person: aimery-of-cyprus, role: Lusignan commander; captured at Hattin, then supported Guy at the siege of Acre}
      - {person: leo-i-of-armenia, role: Armenian prince who supplied provisions, guides and pack animals}
