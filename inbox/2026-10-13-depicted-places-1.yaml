batch:
  title: "Places shown in landscapes and city views, part 1"
  requested: "Ty: link the places in painting titles, starting with landscapes and city views"
  date: 2026-10-13

# Drafted by tools/depicts.py from Wikidata (P195 + P217 match, P136 landscape/city-view genre, P180 depicts with P625),
# then checked by hand: each new place against its English Wikipedia article (or, where there is none, its Wikidata item).
#
# Dropped: Rocky Mountains (x2: Mt. Rosalie, Lander's Peak), Andes, Pyrenees, because they are mountain ranges;
# Arno, Rhine, Seine, Connecticut River, Tagus, because they are rivers; Yosemite Valley, because a valley is an area,
# not one spot (the painting is of Mount Starr King); Last Supper and crucifixion of Jesus, because they are not places;
# Pardigon (Afternoon in Pardigon), because the Wikidata item is the Roman villa's archaeological site, not the coast
# the painting shows.
# Fixed: the draft linked Ponte Vecchio to palazzo-vecchio and Nieuwe Kerk Delft to delft (name-match slips); both are
# now places of their own (ponte-vecchio, nieuwe-kerk-delft).
# Coordinates moved to the Wikipedia article's where Wikidata's were more than ~300 m off: Niagara Falls,
# White Cliffs of Dover, The Oxbow, Le Port-Marly.

