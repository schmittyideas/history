people:
  - key: henry-ii-holy-roman-emperor
    name: Henry II (Holy Roman Emperor)
    type: Royalty
    house: Ottonian
    realm: Holy Roman Empire
    born: 0973-05-06
    died: 1024-07-13
    prominence: 3
    note: "Last Ottonian emperor and later a saint; King from 1002, emperor from 1014. Fought three wars with Bolesław I of Poland (peace of Bautzen 1018) and founded the Diocese of Bamberg in 1007. Died childless at Göttingen."
    sources: [wp-henry-ii-holy-roman-emperor]
  - key: conrad-ii-holy-roman-emperor
    name: Conrad II (Holy Roman Emperor)
    type: Royalty
    house: Salian
    realm: Holy Roman Empire
    born: 990
    born_estimated: true
    died: 1039-06-04
    prominence: 3
    note: "First Salian emperor. Joined Burgundy to the empire in 1033-1034, began Speyer Cathedral in 1030 and died at Utrecht."
    sources: [wp-conrad-ii-holy-roman-emperor]
  - key: henry-iii-holy-roman-emperor
    name: Henry III (Holy Roman Emperor)
    type: Royalty
    house: Salian
    realm: Holy Roman Empire
    born: 1016-10-28
    died: 1056-10-05
    prominence: 3
    note: "Crowned emperor on Christmas Day 1046 after deposing three rival popes at Sutri; appointed four German popes. Died aged 39 at the Bodfeld hunting lodge; heart at Goslar, body at Speyer."
    sources: [wp-henry-iii-holy-roman-emperor]
  - key: henry-iv-holy-roman-emperor
    name: Henry IV (Holy Roman Emperor)
    type: Royalty
    house: Salian
    realm: Holy Roman Empire
    born: 1050-11-11
    died: 1106-08-07
    prominence: 4
    note: "Central figure of the Investiture Controversy: excommunicated by Gregory VII in 1076, absolved at Canossa in 1077, crowned emperor in 1084. Forced to abdicate by his son Henry V on 31 December 1105; died at Liège and was buried at Speyer in 1111."
    sources: [wp-henry-iv-holy-roman-emperor]
  - key: henry-v-holy-roman-emperor
    name: Henry V (Holy Roman Emperor)
    type: Royalty
    house: Salian
    realm: Holy Roman Empire
    born: 1086
    born_estimated: true
    died: 1125-05-23
    prominence: 3
    note: "Last Salian. Rebelled against his father in 1104, imprisoned Pope Paschal II to force his imperial coronation in 1111 and ended the Investiture Controversy with the Concordat of Worms in 1122. Married Matilda of England in 1114; died childless at Utrecht."
    sources: [wp-henry-v-holy-roman-emperor]
  - key: lothair-iii-holy-roman-emperor
    name: Lothair III (Holy Roman Emperor)
    type: Royalty
    house: Supplinburg
    realm: Holy Roman Empire
    born: 1075
    born_estimated: true
    died: 1137-12-03
    prominence: 2
    note: "Duke of Saxony from 1106; elected king in 1125, crowned emperor at the Lateran in 1133. Spent his reign fighting the Hohenstaufen and died returning from a campaign against Roger II of Sicily; buried at Königslutter."
    sources: [wp-lothair-iii-holy-roman-emperor]
  - key: conrad-iii-of-germany
    name: Conrad III of Germany
    type: Royalty
    house: Hohenstaufen
    realm: Holy Roman Empire
    born: 1093
    born_estimated: true
    died: 1152-02-15
    prominence: 3
    note: "First Hohenstaufen king (1138-1152), earlier antiking to Lothair III (1127-1135). His quarrel with Henry the Proud began the Guelph-Ghibelline wars. Led the German army on the failed Second Crusade; never crowned emperor. Named his nephew Frederick Barbarossa as successor."
    sources: [wp-conrad-iii-of-germany, wp-lothair-iii-holy-roman-emperor]
  - key: frederick-i-barbarossa-holy-roman-emperor
    name: Frederick I Barbarossa
    type: Royalty
    house: Hohenstaufen
    realm: Holy Roman Empire
    born: 1122
    died: 1190-06-10
    prominence: 5
    note: "Hohenstaufen emperor (1155-1190). Six Italian campaigns; beaten by the Lombard League at Legnano in 1176; broke Henry the Lion in 1180-1181. Took the cross for the Third Crusade and drowned in the Saleph River in Cilicia. Born in mid-December 1122, birthplace uncertain (Hagenau likely)."
    sources: [wp-frederick-i-barbarossa-holy-roman-emperor]
  - key: henry-vi-holy-roman-emperor
    name: Henry VI (Holy Roman Emperor)
    type: Royalty
    house: Hohenstaufen
    realm: Holy Roman Empire
    born: 1165
    died: 1197-09-28
    prominence: 3
    note: "Son of Barbarossa; emperor 1191-1197. Held Richard I to ransom in 1193-1194, conquered Sicily in 1194 and tried to make the empire hereditary. Born at Nijmegen in autumn 1165; died of malaria at Messina and was buried at Palermo."
    sources: [wp-henry-vi-holy-roman-emperor]
  - key: philip-of-swabia
    name: Philip of Swabia
    type: Royalty
    house: Hohenstaufen
    realm: Holy Roman Empire
    born: 1177
    died: 1208-06-21
    prominence: 2
    note: "Youngest son of Barbarossa; elected king in March 1198 against the Welf Otto of Brunswick, starting the German throne dispute. Murdered at Bamberg by Otto VIII of Wittelsbach; never crowned emperor."
    sources: [wp-philip-of-swabia]
  - key: otto-iv-holy-roman-emperor
    name: Otto IV (Holy Roman Emperor)
    type: Royalty
    house: Welf
    realm: Holy Roman Empire
    born: 1175
    died: 1218-05-19
    prominence: 2
    note: "Only Welf king of Germany; raised in England, nephew of Richard I. Elected 1198, sole king after 1208, crowned emperor in 1209, excommunicated 1210 and beaten at Bouvines in 1214 on England's side."
    sources: [wp-otto-iv-holy-roman-emperor]
  - key: frederick-ii-holy-roman-emperor
    name: Frederick II (Holy Roman Emperor)
    type: Royalty
    house: Hohenstaufen
    realm: Holy Roman Empire
    born: 1194-12-26
    died: 1250-12-13
    prominence: 5
    note: "Stupor mundi. Born at Jesi, King of Sicily from 1198, King of Germany from 1212, emperor from 1220. Recovered Jerusalem by treaty in 1229, issued the Constitutions of Melfi in 1231 and was excommunicated and declared deposed by Innocent IV in 1245. Died at Castel Fiorentino and was buried at Palermo."
    sources: [wp-frederick-ii-holy-roman-emperor]
  - key: rudolf-i-of-germany
    name: Rudolf I of Germany
    type: Royalty
    house: Habsburg
    realm: Holy Roman Empire
    born: 1218-05-01
    died: 1291-07-15
    prominence: 3
    note: "Rudolf of Habsburg, first Habsburg king (1273-1291), ending the Great Interregnum. Beat Ottokar II at the Marchfeld in 1278 and gave Austria and Styria to his sons in 1282. Never crowned emperor; buried at Speyer."
    sources: [wp-rudolf-i-of-germany]
  - key: adolf-of-nassau
    name: Adolf of Nassau
    type: Royalty
    house: Nassau
    realm: Holy Roman Empire
    born: 1255
    born_estimated: true
    died: 1298-07-02
    prominence: 2
    note: "Count of Nassau, elected king of the Germans in 1292 after Rudolf I's death; deposed by the electors in 1298 and killed at Göllheim fighting Albert of Habsburg. Never crowned emperor."
    sources: [wp-adolf-of-nassau, wp-albert-i-of-germany, wp-rudolf-i-of-germany]
  - key: albert-i-of-germany
    name: Albert I of Germany
    type: Royalty
    house: Habsburg
    realm: Holy Roman Empire
    born: 1255
    died: 1308-05-01
    prominence: 2
    note: "Albert of Habsburg, Duke of Austria and Styria from 1282; king 1298-1308 after Adolf fell at Göllheim. Never crowned emperor. Murdered at Windisch on the Reuss by his nephew John the Parricide."
    sources: [wp-albert-i-of-germany]
  - key: henry-vii-holy-roman-emperor
    name: Henry VII (Holy Roman Emperor)
    type: Royalty
    house: Luxembourg
    realm: Holy Roman Empire
    born: 1275
    born_estimated: true
    died: 1313-08-24
    prominence: 3
    note: "First Luxembourg emperor; Count of Luxembourg elected king in 1308. Crowned emperor at the Lateran on 29 June 1312, the first since Frederick II (1250). Besieged Florence in 1312 and died of malaria at Buonconvento; tomb at Pisa."
    sources: [wp-henry-vii-holy-roman-emperor]
  - key: louis-iv-holy-roman-emperor
    name: Louis IV (Holy Roman Emperor)
    type: Royalty
    house: Wittelsbach
    realm: Holy Roman Empire
    born: 1282-04-01
    died: 1347-10-11
    prominence: 3
    note: "Louis the Bavarian, born at Munich. Won the throne against Frederick the Fair at Mühldorf in 1322, was excommunicated by John XXII, crowned emperor at Rome in 1328 and declared the pope deposed. Died of a stroke on a bear hunt; buried in the Frauenkirche, Munich."
    sources: [wp-louis-iv-holy-roman-emperor]
  - key: charles-iv-holy-roman-emperor
    name: Charles IV (Holy Roman Emperor)
    type: Royalty
    house: Luxembourg
    realm: Holy Roman Empire
    born: 1316-05-14
    died: 1378-11-29
    prominence: 4
    note: "Born at Prague as Wenceslaus. King of Bohemia from 1346, king of the Romans from 1346, emperor from 1355. Issued the Golden Bull of 1356, founded Charles University in 1348 and made Prague a capital. Escaped from Crécy, where his father John of Bohemia died."
    sources: [wp-charles-iv-holy-roman-emperor]
  - key: wenceslaus-iv-of-bohemia
    name: Wenceslaus IV of Bohemia
    type: Royalty
    house: Luxembourg
    realm: Holy Roman Empire
    born: 1361-02-26
    died: 1419-08-16
    prominence: 2
    note: "Born at Nuremberg, son of Charles IV. King of Bohemia 1378-1419, king of the Romans 1376-1400. Deposed by four electors on 20 August 1400 and never crowned emperor; his reign ended with the Hussite crisis."
    sources: [wp-wenceslaus-iv-of-bohemia]
  - key: rupert-of-germany
    name: Rupert of Germany
    type: Royalty
    house: Wittelsbach
    realm: Holy Roman Empire
    born: 1352-05-05
    died: 1410-05-18
    prominence: 2
    note: "Rupert III, Elector Palatine, born at Amberg. Elected king after Wenceslaus's deposition in 1400, crowned at Cologne in 1401; failed in Italy at Brescia. Never crowned emperor."
    sources: [wp-rupert-of-germany, wp-wenceslaus-iv-of-bohemia]
  - key: sigismund-holy-roman-emperor
    name: Sigismund (Holy Roman Emperor)
    type: Royalty
    house: Luxembourg
    realm: Holy Roman Empire
    born: 1368-02-15
    died: 1437-12-09
    prominence: 4
    note: "Son of Charles IV; King of Hungary from 1387, king of the Romans from 1410/1411, King of Bohemia from 1419, emperor from 1433. Beaten at Nicopolis in 1396; drove the Council of Constance (1414-1418), which ended the Western Schism. Died at Znojmo, buried at Nagyvárad."
    sources: [wp-sigismund-holy-roman-emperor]
  - key: albert-ii-of-germany
    name: Albert II of Germany
    type: Royalty
    house: Habsburg
    realm: Holy Roman Empire
    born: 1397-08-10
    died: 1439-10-27
    prominence: 2
    note: "Born at Vienna; Albert V of Austria, son-in-law and heir of Sigismund. King of Hungary (crowned 1 January 1438) and king of the Romans from 17 March 1438; never crowned emperor. Died at Neszmély fighting the Turks and was buried at Székesfehérvár."
    sources: [wp-albert-ii-of-germany]
  - key: frederick-iii-holy-roman-emperor
    name: Frederick III (Holy Roman Emperor)
    type: Royalty
    house: Habsburg
    realm: Holy Roman Empire
    born: 1415-09-21
    died: 1493-08-19
    prominence: 3
    note: "First Habsburg emperor, born at Innsbruck; his 41-year reign as emperor (1452-1493) is the longest in the empire's history. Last emperor crowned in Rome (1452). Lost Vienna to Matthias Corvinus but won the Burgundian inheritance for his son Maximilian. Died at Linz, buried in St Stephen's Cathedral, Vienna."
    sources: [wp-frederick-iii-holy-roman-emperor]
  - key: maximilian-i-holy-roman-emperor
    name: Maximilian I (Holy Roman Emperor)
    type: Royalty
    house: Habsburg
    realm: Holy Roman Empire
    born: 1459-03-22
    died: 1519-01-12
    prominence: 4
    note: "The last knight. Born at Wiener Neustadt; married Mary of Burgundy in 1477, king of the Romans from 1486, Elected Roman Emperor in 1508 (never crowned by a pope). Reformed the empire at the Diet of Worms in 1495 and fought the Italian Wars; his grandson Charles V succeeded him. Died at Wels."
    sources: [wp-maximilian-i-holy-roman-emperor]

