discrepancies:
  - key: henry-iii-birth-year
    question: In which year was Henry III born?
    about: [{person: henry-iii-holy-roman-emperor}]
    field: born
    claims:
      - {value: "28 October 1016", sources: [wp-henry-iii-holy-roman-emperor]}
      - {value: "28 October 1017", sources: [wp-conrad-ii-holy-roman-emperor]}
    note: "The Henry III article opens with 1016 but also says 'or 1017'; the Conrad II article says he was born in 1017, during Conrad's exile. The record uses 1016, from his own article's lead."
  - key: henry-v-birth-year
    question: In which year was Henry V born?
    about: [{person: henry-v-holy-roman-emperor}]
    field: born
    claims:
      - {value: "11 August 1081", sources: [wp-henry-v-holy-roman-emperor]}
      - {value: "11 August 1086", sources: [wp-henry-v-holy-roman-emperor, wp-henry-iv-holy-roman-emperor]}
    note: "The Henry V article says 'probably 11 August 1081 or 1086'; the Henry IV article gives 1086. Only his accolade at Easter 1101 is certain. The record uses 1086, marked estimated."
  - key: conrad-iii-birth-year
    question: In which year was Conrad III born?
    about: [{person: conrad-iii-of-germany}]
    field: born
    claims:
      - {value: "1093", sources: [wp-conrad-iii-of-germany]}
      - {value: "1094", sources: [wp-conrad-iii-of-germany]}
    note: "The article gives '1093 or 1094'. The record uses 1093, marked estimated."
  - key: lothair-iii-death-date
    question: On what day did Lothair III die?
    about: [{person: lothair-iii-holy-roman-emperor}]
    field: died
    claims:
      - {value: "3 December 1137", sources: [wp-lothair-iii-holy-roman-emperor]}
      - {value: "4 December 1137", sources: [wp-lothair-iii-holy-roman-emperor]}
    note: "The lead says 4 December; the Death section says 3 December at Breitenwang. The record uses 3 December, from the detailed section."
  - key: otto-iv-reign-end
    question: When did Otto IV cease to be emperor?
    about: [{person: otto-iv-holy-roman-emperor}]
    field: reign end
    claims:
      - {value: "Deposed in 1215, after Bouvines", sources: [wp-otto-iv-holy-roman-emperor, wp-frederick-ii-holy-roman-emperor]}
      - {value: "Emperor until his death on 19 May 1218", sources: [wp-otto-iv-holy-roman-emperor]}
    note: "The Otto IV lead says emperor 1209 until his death in 1218; the text says he was deposed in 1215 and withdrew to Brunswick. Frederick II's article says Frederick took Aachen and Cologne by 1215. Both titles end in 1215 in the records."
  - key: sigismund-birthplace
    question: Where was Sigismund born?
    about: [{person: sigismund-holy-roman-emperor}]
    field: place
    claims:
      - {value: "Nuremberg", sources: [wp-sigismund-holy-roman-emperor]}
      - {value: "Prague", sources: [wp-sigismund-holy-roman-emperor]}
    note: "The article says 'Born in Nuremberg or Prague'. No birth moment is entered."
  - key: henry-vii-birth-year
    question: In which year was Henry VII born?
    about: [{person: henry-vii-holy-roman-emperor}]
    field: born
    claims:
      - {value: "1275", sources: [wp-henry-vii-holy-roman-emperor]}
      - {value: "1278 or 1279", sources: [wp-henry-vii-holy-roman-emperor]}
    note: "The article says 'probably between 1275 or 1278/79', born at Valenciennes. The record uses 1275, marked estimated."
