batch:
  title: "The kings of the Germans and Holy Roman emperors, 1002-1519"
  requested: "Henry II through Maximilian I: lives, reigns, coronations, key events and places"
  date: 2026-10-08

# Notes for the reviewer
# - Source: local copies of the English Wikipedia articles for 23 rulers (Henry II to Maximilian I). Nothing was fetched. Otto III (otto-iii-holy-roman-emperor) already exists and is not touched.
# - Adolf of Nassau: the first download was a disambiguation page; the real article ("Adolf, King of the Romans", revision 1369845799) was fetched afterwards and his record, election (5 May 1292), coronation (24 June 1292) and death (2 July 1298) come from it.
# - Title wording: every ruler has "King of the Germans" (realm Holy Roman Empire), whatever the article calls it (King of Germany, King of the Romans, Rex Romanorum). Crowned emperors also get "Holy Roman Emperor". Conrad III, Rudolf I, Adolf, Albert I, Wenceslaus IV, Rupert and Albert II were never crowned emperor and have only the first title. Maximilian I took the title "Elected Roman Emperor" at Trento in 1508 with Pope Julius II's assent and was never crowned by a pope; his emperor title runs from 1508.
# - Start-of-reign convention: the date of the election, or of the first coronation where there was no election (Henry II). For rulers who were crowned co-king in their father's lifetime (Henry III 1028, Henry IV 1054, Henry V 1099, Henry VI 1169) the title starts at the father's death, and the co-kingship is in the title note, so the lanes do not overlap. Henry II, Conrad II, Frederick I and Maximilian (from 1486, jointly with his father) follow the dates given in their titles.
# - Overlaps by design (not marked disputed, because each ruler was accepted as king by most of the empire at some point): Philip of Swabia and Otto IV (double election of 1198, to Philip's murder in 1208), Louis IV and Charles IV (1346-1347), Wenceslaus IV and Rupert (Wenceslaus never recognised his deposition of 20 August 1400), Sigismund and Jobst of Moravia (1410-1411).
# - Antikings are out of scope and not entered: Rudolf of Rheinfelden, Hermann of Salm, Conrad III's years as antiking of Lothair III (1127-1135, in his title note only), Frederick the Fair (Louis IV's co-king 1325-1330, in the Louis note), Günther von Schwarzburg, Jobst of Moravia, Henry Raspe, William of Holland. The Great Interregnum (1250-1273) has no ruler in this batch.
# - Titles left out for size (all other realms need their own agreed wording): King of Italy (Henry II 1004, Conrad II 1026, Frederick I 1155, Henry VII 1311, Louis IV 1327, Charles IV 1355, Sigismund 1431), King of Burgundy (Conrad II 1033, Frederick I 1178, Charles IV 1365), King of Sicily (Henry VI, crowned 25 December 1194; Frederick II, crowned 17 May 1198), King of Jerusalem (Frederick II 1229), King of Hungary (Sigismund from 31 March 1387; Albert II, crowned 1 January 1438), King of Bohemia (Charles IV, crowned 2 September 1347; Wenceslaus IV from 1378; Sigismund from 1419), all dukedoms. The realms Hungary and Bohemia exist, so these can be added in the Bohemia / Hungary batches. Sicily and Jerusalem would need new realms.
# - Consorts and children are mostly left out to keep the batch to size. Only parent-child links among the rulers are entered, plus Henry V's marriage to Empress Matilda (existing key empress-matilda, married at Mainz on 7 January 1114).
# - Dates not given as a day in the articles, so year only: Henry III's co-coronation at Aachen (Easter 1028), Louis IV's imperial coronation (January 1328), Hus's execution (July 1415), the Golden Bull (1356), the Habsburg investiture with Austria (December 1282), Frederick II's coronation at Aachen (mid-July 1215), the Council of Lyon (1245), Frederick I's birth (mid-December 1122), Henry VI's birth (November 1165 / autumn 1165), Philip of Swabia's birth (February/March 1177), Albert I's birth (July 1255).
# - Places not entered because the article gives no clear founding fact or place: Henry II's birthplace; Conrad III's, Lothair's (Unterlüß is given for Lothair but not entered), Rupert's death castle (Landskrone near Oppenheim) and burial church (Church of the Holy Spirit, Heidelberg); Louis IV's burial (Frauenkirche, Munich); Henry VII's tomb (Pisa Cathedral); Frederick III's tomb (St Stephen's, Vienna); Maximilian's burial (Wiener Neustadt castle chapel); Sigismund's burial (Nagyvárad / Oradea); Albert II's burial (Székesfehérvár); Henry VI's and Frederick II's tombs (Palermo Cathedral). These are named in the notes of the persons.
# - Discrepancies recorded below: Henry III birth year; Henry V birth year; Conrad III birth year; Lothair III death day; Otto IV reign end; Sigismund birthplace; Henry VII birth year. Also seen, not entered because they touch no record field: Henry II's Italian coronation (14 May 1004 in the text, 15 May in the lead); his canonisation (1146 in the lead, July 1147 in the Veneration section); Frederick I's coronation as King of Italy (Pavia 24 April or Monza 15 April 1155); Rudolph III of Burgundy's death (6 September 1032 or 2 February 1032, Conrad II article).
# - Shared keys defined here (other batches may send the same key): rome, st-peters-basilica-rome, speyer-cathedral, worms, konstanz, palermo, third-crusade-1189. Existing keys referenced and not redefined: aachen-cathedral, jerusalem, venice, empress-matilda, otto-iii-holy-roman-emperor (not used), richard-i-handed-to-the-emperor-1193, battle-of-crecy-1346. France-batch keys referenced and not redefined: second-crusade-1147, battle-of-bouvines-1214, italian-war-of-1494. They appear in the "events" block with only key, people and sources.
# - Coordinates are from general knowledge (about 3 decimals); "visitable" flags are general knowledge, not from the articles. The Saleph/Göksu river and Habsburg Castle (Habichtsburg) coordinates are approximate.
# - Size: 24 people, 40 titles, 20 new events plus 5 link-only updates to existing events, 11 places, 24 moments (16 Aachen crownings, 8 burials), 11 links, 7 discrepancies (about 142 rows with the updates). Over the 100-row target because every ruler has two titles and a coronation moment. If it must be cut, drop the 16 Aachen moments first (the title notes already hold the crowning dates), then the 11 links.
# - Doubts: Frederick II's King of the Germans start (elected in absentia at Nuremberg in September 1211, crowned at Mainz 9 December 1212, crowned again at Aachen in mid-July 1215 after Bouvines; the record uses the Mainz coronation); Otto IV's end (see discrepancy); Sigismund's start (first election 20 September 1410 contested by Jobst, second 21 July 1411; the record uses 1411); Conrad II's and Henry III's dates are election/accession dates, the coronation days are in the notes.

