  about:
  - person: orlando-gibbons
  field: place
  claims:
  - value: Oxford
    sources:
    - wp-orlando-gibbons
    note: Baptism record at St Martin's, Oxford, and parents then resident in Oxford; modern historians.
  - value: Cambridge
    sources:
    - wp-orlando-gibbons
    note: Early biographies and his Canterbury memorial; believed until the early 20th century.
  note: The record uses Oxford (best supported).
- key: william-byrd-born
  question: When was William Byrd born?
  about:
  - person: william-byrd
  field: born
  claims:
  - value: 1539 or 1540
    sources:
    - wp-william-byrd
    note: A document of 2 October 1598 in his hand says he was 58 years or thereabouts.
  - value: A later year
    sources:
    - wp-william-byrd
    note: His will of November 1622 says he was in the 80th year of his age; Kerry McCarthy suggests the will was not kept up to date.
  note: The record uses c. 1540.
- key: john-blow-born-place
  question: Was John Blow born in Collingham or Newark?
  about:
  - person: john-blow
  field: place
  claims:
  - value: Collingham, Nottinghamshire
    sources:
    - wp-john-blow
    note: 'Article: probably born there; Newark parish registers record his baptism.'
  - value: Newark
    sources:
    - wp-john-blow
    note: On taking his doctorate in 1677 Blow gave his birthplace as the faithful borough of Newark.
  note: The record uses Collingham, as the article does.
