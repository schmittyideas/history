- key: coleshill-house-architect
  question: Who designed Coleshill House, Berkshire - Inigo Jones or Roger Pratt?
  about:
  - person: inigo-jones
  - person: roger-pratt
  field: attribution
  claims:
  - value: Inigo Jones (primarily credited with the design)
    sources:
    - wp-roger-pratt
    - wp-inigo-jones
  - value: Roger Pratt (executed the building)
    sources:
    - wp-roger-pratt
  note: Record credits Jones with the design and Pratt with the execution, as the Pratt article states.
- key: horseheath-hall-architect
  question: Who designed Horseheath Hall, Cambridgeshire - Roger Pratt or John Webb?
  about:
  - person: roger-pratt
  - person: john-webb
  field: attribution
  claims:
  - value: Roger Pratt
    sources:
    - wp-roger-pratt
  - value: John Webb (as attributed in Colen Campbell's Vitruvius Britannicus)
    sources:
    - wp-roger-pratt
  note: The record holds Pratt, as the Pratt article lists the house among his own works.
- key: wren-city-churches-attribution
  question: Who had the principal creative responsibility for Wren's City of London churches?
  about:
  - person: christopher-wren
  - person: nicholas-hawksmoor
  field: attribution
  claims:
  - value: Christopher Wren (rebuilt 52 churches after the Great Fire)
    sources:
    - wp-christopher-wren
  - value: Others in Wren's office
    especially Nicholas Hawksmoor (now more commonly attributed): null
    sources:
    - wp-christopher-wren
  note: The record credits Wren as architect of the programme; individual designs are often now attributed to his office.
- key: john-milton-died
  question: On what date did John Milton die?
  about:
  - person: john-milton
  field: died
  claims:
  - value: 8 November 1674
