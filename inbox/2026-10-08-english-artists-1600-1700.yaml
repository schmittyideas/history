# Notes for the reviewer
# - 48 people (12 painters/sculptors, 8 architects, 13 writers, 7 composers, 8 scholars), each from the English Wikipedia article.
# - Images: links only (full image, 400px thumbnail, Commons page, licence) from the Wikipedia lead image; used only when Commons says
#   public domain / CC0. Left out: John Webb, Roger Pratt (photo/engraving of a house), Nicholas Stone (licence not found), Thomas Tomkins (no image).
#   William Talman's image is a family group portrait.
# - Dates before 1752 are as the articles give them (Old Style); Newton's birth is Old Style, his death New Style, as the article headlines them.
# - Coordinates of places are present-day, from general knowledge (the articles give none) and approximate.
# - Left out (article unclear or contradictory): Blenheim completion (Vanbrugh article contradicts itself); Locke's Essay and Two Treatises
#   (dated only "1689/90"); Chapel Royal composer post for Blow (1699 or 1700); many places of death or birth the articles do not state.
# - Not defined for lack of room: Hawksmoor's London churches, Chatsworth, Kings Weston, Seaton Delaval.
# - Patron links for Jones to James I/Charles I and Bacon/Hobbes are implied by posts/pensions in the articles, not stated outright.
# - Events with prominence 2 or lower were dropped to keep the batch readable; 14 discrepancies recorded where the articles disagree.

