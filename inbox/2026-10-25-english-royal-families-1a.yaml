batch:
  title: "English royal families 1a: Æthelred the Unready to Harthacnut (978-1042)"
  requested: "Ty: fill in parents, spouses and children (who reached 12) for every English monarch, with sex on each monarch (issue #292). Batch 1 also adds the missing kings Edmund Ironside, Cnut, Harold Harefoot and Harthacnut."
  date: 2026-10-25
  notes: "Family links for Æthelred, Sweyn, Edmund Ironside, Cnut, Harold Harefoot and Harthacnut (Edward the Confessor's parents too); adds the four missing kings with their reigns. Part a of two (part b: Edward the Confessor to Stephen). Checked against each person's English Wikipedia article (revisions of 2026-10)."

# Notes for the reviewer
# Left out: no Wikipedia article of their own
# - Æthelred's children Ecgberht (d. c. 1005) and Edgar (d. c. 1008), and his daughters Ælfgifu (wife of Uhtred) and
#   Eadgyth (wife of Eadric Streona); possible daughters Wulfhild and the abbess of Wherwell. All only in his article.
# - Harold Harefoot's possible wife Ælfgifu and son Ælfwine ("may have had"): no articles.
# Left out: not legitimate
# - Sweyn's daughter Gytha (by "an earlier liaison"). Sweyn's mother is unknown, so only his father is linked.
# Left out: facts not confirmed
# - Births: Harold Harefoot (his article gives no year; Wikidata says 1016), Æthelstan Ætheling ("early or mid 980s"),
#   Estrid ("c. 990s"), Harald Bluetooth: no year.
# - Birth places: Edmund Ironside "possibly" at Æthelingadene. No other new person's article names a birthplace.
# - Harthacnut's burial in the Old Minster comes from Emma's article (his own names no place).
# - Marriage years: Ælfgifu of York to Æthelred ("probably mid-980s"), Ælfgifu of Northampton to Cnut (c. 1013, "around
#   this time" in Sweyn's article), Edgar to Ælfthryth ("964 or 965").
# - Harthacnut's title as King of Denmark (1035-1042) is not added; the assignment covered his English reign only.
# Choices
# - Sweyn's wife: his article says a sister of Bolesław I of Poland, name unknown; Wikipedia's article on her is
#   "Świętosława", a name historians gave her. Her motherhood of Harald, Cnut and Estrid is marked uncertain (Cnut's article
#   calls his mother's identity uncertain; Harald II's names Gunhild of Wenden). See discrepancy `cnut-mother`.
# - Cnut's King of England row starts in 1016 (his article: "King of England from 1016"); Edmund Ironside held Wessex
#   until 30 November 1016. Harold Harefoot's starts in 1037; he was regent from November 1035.
# - Old Minster, Winchester: Wikipedia gives no coordinates; it lay beside the present cathedral's nave, so its point is
#   just north of Winchester Cathedral's (approximate). Harald Bluetooth's "Trinity Church in Roskilde" is put at
#   Roskilde Cathedral, its site.

