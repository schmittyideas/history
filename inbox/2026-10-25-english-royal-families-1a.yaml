people:
  # Sex on the monarchs (existing records)
  - {key: aethelred-the-unready, sex: male}
  - {key: sweyn-forkbeard, sex: male}

  # The four missing kings
  - key: edmund-ironside
    name: Edmund Ironside
    type: Royalty
    born: 991
    born_estimated: true
    died: 1016-11-30
    sex: male
    house: Wessex
    prominence: 3
    coverage: partly
    coverage_note: "Dates, reign, burial and family captured; his battles with Cnut (Penselwood, Sherston, Brentford, Assandun) and the Treaty of Alney not added as events."
    note: "King of the English from 23 April to 30 November 1016, fighting Cnut's invasion; after defeat at Assandun he kept Wessex and Cnut the rest. Born between 990 and 993 (McDermott suggests 991)."
    sources: [wp-edmund-ironside]
  - key: cnut
    name: Cnut
    type: Royalty
    born: 995
    born_estimated: true
    died: 1035-11-12
    sex: male
    house: Knýtlinga
    prominence: 4
    coverage: partly
    coverage_note: "Dates, reigns, burial and family captured; his conquest of England, journey to Rome and Scandinavian wars not added as events."
    note: "Cnut the Great (Canute): King of England from 1016, of Denmark from 1018 and of Norway from 1028, the 'North Sea Empire'. Died at Shaftesbury; buried in the Old Minster, Winchester."
    sources: [wp-cnut]
  - key: harold-harefoot
    name: Harold Harefoot
    type: Royalty
    died: 1040-03-17
    sex: male
    house: Knýtlinga
    prominence: 2
    coverage: partly
    coverage_note: "Death, reign, burial and parents captured; birth year not given by the article."
    note: "Harold I: regent of England from Cnut's death in 1035 for his absent half-brother Harthacnut, then king from 1037. Died at Oxford; buried at Westminster, then exhumed and thrown into a fen by Harthacnut."
    sources: [wp-harold-harefoot]
  - key: harthacnut
    name: Harthacnut
    type: Royalty
    born: 1018
    born_estimated: true
    died: 1042-06-08
    sex: male
    house: Knýtlinga
    prominence: 2
    coverage: partly
    coverage_note: "Dates, English reign and parents captured; Danish reign (from 1035) not added as a title."
    note: "King of Denmark from 1035 and of England from 1040 until he died 'as he stood at his drink' at a wedding in Lambeth. The last Dane to rule England; unmarried and childless."
    sources: [wp-harthacnut]

  # Æthelred's family
  - {key: edgar-king-of-england, name: "Edgar, King of England", type: Royalty, born: 944, born_estimated: true, died: 0975-07-08, sex: male, house: Wessex, prominence: 3, coverage: not-read, note: "Edgar the Peaceful, King of the English 959-975; father of Edward the Martyr and Æthelred.", sources: [wp-edgar-king-of-england]}
  - {key: aelfthryth-wife-of-edgar, name: Ælfthryth, type: Royalty, died: 1000, died_estimated: true, sex: female, house: Wessex, prominence: 2, coverage: not-read, note: "Queen of the English, wife of Edgar from 964 or 965; a leader of the regency for her son Æthelred (978-984). Died 17 November 999, 1000 or 1001.", sources: [wp-aelfthryth-wife-of-edgar]}
  - {key: aelfgifu-of-york, name: Ælfgifu of York, type: Royalty, died: 1001, died_estimated: true, sex: female, house: Wessex, prominence: 1, coverage: not-read, note: "First wife of Æthelred the Unready and mother of Edmund Ironside; probably a daughter of Thored, earl of southern Northumbria.", sources: [wp-aelfgifu-of-york]}
  - {key: emma-of-normandy, name: Emma of Normandy, type: Royalty, born: 984, born_estimated: true, died: 1052-03-06, sex: female, house: Normandy, prominence: 3, coverage: not-read, note: "Daughter of Richard I of Normandy; queen of England as wife of Æthelred (1002) and then of Cnut (1017); mother of Edward the Confessor and Harthacnut.", sources: [wp-emma-of-normandy]}
  - {key: aethelstan-aetheling, name: Æthelstan Ætheling, type: Royalty, died: 1014-06-25, sex: male, house: Wessex, prominence: 1, coverage: not-read, note: "Eldest son of Æthelred and heir apparent until his death; born in the early or mid 980s. Left the sword of Offa to Edmund Ironside.", sources: [wp-aethelstan-aetheling]}
  - {key: eadred-aetheling, name: Eadred Ætheling, type: Royalty, died: 1012, died_estimated: true, sex: male, house: Wessex, prominence: 1, coverage: not-read, note: "Fourth son of Æthelred by Ælfgifu; witnessed charters between 993 and 1012 or 1013.", sources: [wp-eadred-aetheling]}
  - {key: eadwig-aetheling, name: Eadwig Ætheling, type: Royalty, died: 1017, sex: male, house: Wessex, prominence: 1, coverage: not-read, note: "Fifth son of Æthelred by Ælfgifu; banished and then murdered at Cnut's instigation in 1017.", sources: [wp-eadwig-aetheling]}
  - {key: alfred-aetheling, name: Alfred Ætheling, type: Royalty, born: 1012, born_estimated: true, died: 1036, sex: male, house: Wessex, prominence: 2, coverage: not-read, note: "Younger son of Æthelred and Emma; captured by Earl Godwin on his return in 1036, blinded, and died soon afterwards.", sources: [wp-alfred-aetheling]}
  - {key: godgifu-daughter-of-aethelred-the-unready, name: Godgifu, type: Royalty, born: 1004, born_estimated: true, sex: female, house: Wessex, prominence: 1, coverage: not-read, note: "Daughter of Æthelred and Emma; married Drogo of Mantes (probably 1024), then Eustace II of Boulogne (1035). Died c. 1047 or c. 1056: historians disagree.", sources: [wp-godgifu-daughter-of-aethelred-the-unready]}

  # Sweyn's family
  - {key: harald-bluetooth, name: Harald Bluetooth, type: Royalty, died: 985, died_estimated: true, sex: male, house: Knýtlinga, prominence: 3, coverage: not-read, note: "Harald Gormsson, king of Denmark and Norway; died c. 985/86, buried in the Trinity Church at Roskilde.", sources: [wp-harald-bluetooth]}
  - {key: swietoslawa, name: Świętosława, type: Royalty, sex: female, house: Piast, prominence: 1, coverage: not-read, note: "Daughter of Mieszko I of Poland and sister of Bolesław I, wife of Sweyn Forkbeard (Thietmar). Her name is not recorded; 'Świętosława' is a name historians gave her.", sources: [wp-swietoslawa]}
  - {key: harald-ii-of-denmark, name: Harald II of Denmark, type: Royalty, born: 997, born_estimated: true, died: 1018, died_estimated: true, sex: male, house: Knýtlinga, prominence: 2, coverage: not-read, note: "Son of Sweyn Forkbeard, King of Denmark 1014-c. 1018; succeeded by his brother Cnut. Born c. 996-998.", sources: [wp-harald-ii-of-denmark]}
  - {key: estrid-svendsdatter, name: Estrid Svendsdatter, type: Royalty, sex: female, house: Knýtlinga, prominence: 2, coverage: not-read, note: "Daughter of Sweyn Forkbeard and sister of Cnut; wife of Ulf Jarl and mother of Sweyn II of Denmark. Born in the 990s; died between 1057 and 1073.", sources: [wp-estrid-svendsdatter]}

  # Edmund Ironside's family
  - {key: ealdgyth-wife-of-edmund-ironside, name: "Ealdgyth (wife of Edmund Ironside)", type: Royalty, born: 992, born_estimated: true, sex: female, prominence: 1, coverage: not-read, note: "Widow of Sigeferth, thegn of the Seven Burghs; Edmund Ironside took her from Malmesbury and married her in 1015. John of Worcester calls her Ealdgyth; the name may be a confusion.", sources: [wp-ealdgyth-wife-of-edmund-ironside]}
  - {key: edward-the-exile, name: Edward the Exile, type: Royalty, born: 1016, born_estimated: true, died: 1057-04-19, sex: male, house: Wessex, prominence: 2, coverage: not-read, note: "Son of Edmund Ironside, sent abroad as an infant by Cnut; lived in Hungary, was recalled as heir in 1057 and died days after landing. Father of Edgar Ætheling and St Margaret of Scotland.", sources: [wp-edward-the-exile]}
  - {key: edmund-aetheling, name: Edmund Ætheling, type: Royalty, born: 1016, born_estimated: true, sex: male, house: Wessex, prominence: 1, coverage: not-read, note: "Son of Edmund Ironside, born 1016 or 1017 and sent abroad by Cnut; may have married a daughter of the king of Hungary; died there on 10 January of a year before 1057.", sources: [wp-edmund-aetheling]}

  # Cnut's family
  - {key: aelfgifu-of-northampton, name: Ælfgifu of Northampton, type: Royalty, born: 990, born_estimated: true, sex: female, prominence: 2, coverage: not-read, note: "First wife of Cnut and mother of Harold Harefoot and Svein; regent of Norway 1030-1035. Died after 1036.", sources: [wp-aelfgifu-of-northampton]}
  - {key: svein-knutsson, name: Svein Knutsson, type: Royalty, born: 1016, born_estimated: true, died: 1035, sex: male, house: Knýtlinga, prominence: 2, coverage: not-read, note: "Son of Cnut and Ælfgifu of Northampton; ruled Norway with his mother as regent from 1030 until driven out in 1034.", sources: [wp-svein-knutsson]}
  - {key: gunhilda-of-denmark, name: Gunhilda of Denmark, type: Royalty, born: 1020, born_estimated: true, died: 1038-07-18, sex: female, house: Knýtlinga, prominence: 1, coverage: not-read, note: "Daughter of Cnut and Emma; married Henry III, later Holy Roman Emperor, at Nijmegen in 1036; died of an epidemic in Italy.", sources: [wp-gunhilda-of-denmark]}

