artworks:
  - key: fatal-wounding-of-sir-philip-sidney
    name: The Fatal Wounding of Sir Philip Sidney
    kind: painting
    medium: "Oil on canvas"
    made: 1806
    museum: woodmere-art-museum
    image_url: https://commons.wikimedia.org/wiki/Special:FilePath/Benjamin%20West%20-%20The%20Fatal%20Wounding%20of%20Sir%20Philip%20Sidney.jpg?width=1280
    image_thumb: https://commons.wikimedia.org/wiki/Special:FilePath/Benjamin%20West%20-%20The%20Fatal%20Wounding%20of%20Sir%20Philip%20Sidney.jpg?width=400
    image_page: https://commons.wikimedia.org/wiki/File:Benjamin_West_-_The_Fatal_Wounding_of_Sir_Philip_Sidney.jpg
    image_license: Public domain
    image_credit: Wikimedia Commons
    prominence: 2
    note: "A reimagined Zutphen: Sidney, wounded, asks that his water go to a dying man whose need is greater. West painted himself on the far right. Commissioned by Alexander Davison; closer to Romanticism than the Neoclassicism West was known for. Sidney's funeral at St Paul's Cathedral followed his death."
    people:
      - {person: benjamin-west, role: creator}
      - {person: philip-sidney, role: subject}
      - {person: alexander-davison, role: patron}
    places:
      - {place: zutphen-battlefield, role: depicts}
    events:
      - {event: battle-of-zutphen-1586, role: depicts}
    external:
      - {system: wikidata, id: Q125861173, url: "https://www.wikidata.org/wiki/Q125861173"}
    sources: [wp-fatal-wounding-of-sir-philip-sidney]
  - key: the-black-brunswicker
    name: The Black Brunswicker
    kind: painting
    medium: "Oil on canvas"
    made: 1860
    museum: lady-lever-art-gallery
    accession: "LL 3643"
    image_url: https://commons.wikimedia.org/wiki/Special:FilePath/John%20Everett%20Millais%20The%20Black%20Brunswicker.jpg?width=1280
    image_thumb: https://commons.wikimedia.org/wiki/Special:FilePath/John%20Everett%20Millais%20The%20Black%20Brunswicker.jpg?width=400
    image_page: https://commons.wikimedia.org/wiki/File:John_Everett_Millais_The_Black_Brunswicker.jpg
    image_license: Public domain
    image_credit: Wikimedia Commons
    prominence: 3
    note: "A Brunswick officer about to leave for battle; his sweetheart tries to push the door shut as he opens it. A print of David's Napoleon Crossing the Alps hangs on the wall. Kate Perugini posed for the woman; the officer was an anonymous soldier who died of consumption soon after, and the two never met. Shown at the Royal Academy in 1860; Ernest Gambart paid 1,000 guineas, the highest price Millais had had from him. Lever bought it in 1898."
    people:
      - {person: john-everett-millais, role: creator}
      - {person: kate-perugini, role: model}
    events:
      - {event: duchess-of-richmonds-ball-1815, role: depicts}
    external:
      - {system: wikidata, id: Q326887, url: "https://www.wikidata.org/wiki/Q326887"}
    sources: [wp-the-black-brunswicker, wikidata-three-paintings]
  - key: entombment-of-christ-caravaggio
    name: The Entombment of Christ
    kind: painting
    medium: "Oil on canvas"
    made: 1602
    made_end: 1604
    museum: vatican-museums
    accession: "MV.40386"
    image_url: https://commons.wikimedia.org/wiki/Special:FilePath/The%20Entombment%20of%20Christ-Caravaggio%20%28c.1602-3%29.jpg?width=1280
    image_thumb: https://commons.wikimedia.org/wiki/Special:FilePath/The%20Entombment%20of%20Christ-Caravaggio%20%28c.1602-3%29.jpg?width=400
    image_page: https://commons.wikimedia.org/wiki/File:The_Entombment_of_Christ-Caravaggio_(c.1602-3).jpg
    image_license: Public domain
    image_credit: Wikimedia Commons
    prominence: 4
    note: "Made for the chapel of the Pietà founded by Pietro Vittrice in Santa Maria in Vallicella (the Chiesa Nuova), Rome. Shows Nicodemus (with Michelangelo's face), John the Evangelist, the Virgin Mary, Mary of Cleophas and Mary Magdalene; one biographer says Fillide Melandroni modelled the two women. Taken to Paris in 1797, returned in 1816 to the Vatican, where it hangs in the Pinacoteca. Caravaggio's own given name was Michelangelo (Michelangelo Merisi)."
    people:
