# Three paintings Ty asked for on 2026-10-28: Benjamin West's The Fatal Wounding of Sir Philip Sidney (1806),
# Millais's The Black Brunswicker (1860) and Caravaggio's The Entombment of Christ (1602-1604), each with the
# people, places and events it links to, plus Rubens's copy of the Caravaggio.
# Facts read on 2026-10-28 from each painting's English Wikipedia article, the articles for Alexander Davison, Kate
# Perugini and the Battle of Zutphen, and Wikidata (inventory numbers, coordinates, Wikipedia language editions).
# All three images are marked public domain on Commons (checked per file).
# Stated honestly:
#  - Sidney's death at Arnhem is from the painting's article; his funeral at St Paul's is in the note only, because
#    no date was read. The Battle of Zutphen is dated 22 September 1586 from its own article.
#  - The Black Brunswicker is linked to the Duchess of Richmond's ball (15 June 1815) because its article ties the
#    scene to that ball; the article does not name the Duke of Brunswick, so he is not added.
#  - Vatican Museums data access is already recorded as no-access, so nothing was read from its site; the inventory
#    number MV.40386 comes from Wikidata, and no museum_url is given.
#  - Caravaggio's models (Fillide Melandroni for the women) and the chapel's founder Pietro Vittrice are named in
#    the note only; neither has a record here yet.
