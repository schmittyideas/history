    note: "Five-storey oceanfront hotel on Ocean Avenue between Colorado and Front (now Pico Boulevard), with glass observatories facing the beach; called the finest seaside hotel in the state. Patronage declined and it was demolished in 1909."
    sources: [wp-hotel-arcadia, wp-arcadia-bandini-de-stearns-baker]

people:
  - {key: arcadia-bandini-de-stearns-baker, name: Arcadia Bandini de Stearns Baker, type: Patron, born: 1827, died: 1912, prominence: 2,
     note: "Californio landowner, the \"godmother of Santa Monica\": laid out the original city plan and gave land for Palisades Park, a veterans' home, schools and churches. The Hotel Arcadia was named for her.",
     coverage: partly, coverage_note: "Life dates, Santa Monica role and the hotel; her marriages to Abel Stearns (1841) and Robert S. Baker (1875) not yet linked.",
     sources: [wp-arcadia-bandini-de-stearns-baker]}
  - {key: tina-mesmer, name: Tina Mesmer, type: Other, born: 1864-02-29, died: 1948-08-11, prominence: 1,
     note: "Mary Agnes Christina \"Tina\" Mesmer Griffith, wife of Griffith J. Griffith, who shot her at the Hotel Arcadia in 1903; she survived, losing an eye.",
     coverage: partly, coverage_note: "Marriage and the 1903 shooting; family and later life not captured.",
     sources: [wp-tina-mesmer]}

events:
  - key: griffith-shooting-hotel-arcadia-1903
    name: Griffith J. Griffith shoots his wife at the Hotel Arcadia
    type: Crime
    date: 1903-09-04
    place: hotel-arcadia
    prominence: 2
    note: "He shot Tina Mesmer in the face in their room as she packed to return to Los Angeles after a month's stay. She survived but lost an eye; he served under two years in San Quentin."
    people:
