# Hotel Arcadia, Santa Monica (1887–1909), asked for by Ty.
# Source: https://en.wikipedia.org/wiki/Hotel_Arcadia and the linked articles, read 2026-10-11.
# - Opening year: the hotel's article lead says 1886, its category and the Arcadia Bandini article say 1887.
#   The record holds 1887; a discrepancy records both.
# - Jesup W. Scott (builder) has no article: named in built_by only, not added as a person.
# - Tina Mesmer fits none of the types (she was neither royalty nor a maker); typed Other.
# - Arcadia Bandini's husbands Abel Stearns and Robert S. Baker aren't in the database yet: left for a later batch.
# - The 1903 shooting date is from Tina Mesmer's article (Friday, September 4, 1903); the LA Times report is dated the 5th.
