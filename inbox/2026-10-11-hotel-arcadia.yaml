  - {key: commons-hotel-arcadia-c1890, title: "Hotel Arcadia, Santa Monica - Seaside (Wikimedia Commons)", url: "https://commons.wikimedia.org/wiki/File:Hotel_Arcadia,_Santa_Monica_-_Seaside_(2).jpg"}

