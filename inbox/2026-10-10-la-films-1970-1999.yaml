discrepancies:
  - key: fabulous-baker-boys-makin-whoopee-location
    question: "Where was \"Makin' Whoopee\" in The Fabulous Baker Boys shot: the Biltmore's Crystal Ballroom or the Hollywood Roosevelt's Cinegrill?"
    about: [{artwork: the-fabulous-baker-boys-1989}]
    field: place
    claims:
      - {value: "The Biltmore Los Angeles, Crystal Ballroom", sources: [wp-the-fabulous-baker-boys-1989], note: "Film article, Production"}
      - {value: "Hollywood Roosevelt Hotel, Cinegrill nightclub", sources: [wp-hollywood-roosevelt-hotel], note: "Hotel article, film section"}
    note: "Both hotels are linked as filmed: the film article also places other interiors and musical sequences at the Biltmore."
