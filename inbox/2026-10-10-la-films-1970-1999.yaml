# Los Angeles films, 1970-1999: more famous films shot at specific Los Angeles places (part of a "top 100 LA film
# locations" set; the 1921-2016 batch and the before-1970 batch came first). Same conventions as
# 2026-10-10-los-angeles-film-locations.yaml: each film is an artwork (kind: film) linked to its director (creator) and
# to the places it was shot (role: filmed). The note says what was shot where; no cast, plot or posters.
# VERIFIED against English Wikipedia articles downloaded on 2026-10-10 with tools/wiki.py (revision IDs in the session
# scratchpad). Candidates came from Wikidata "filming location" (P915) and the landmarks' film lists; every film-place
# claim below is stated in the film's article, the place's article, or both (the cited sources say which).
# Reused from earlier batches: ennis-house, los-angeles-river, mike-nichols, ridley-scott, and the existing places
# (Union Station, Griffith Observatory, Bradbury Building, Santa Monica Pier, Watts, Watts Towers, Venice, Coliseum,
# Central Library, Hollywood Roosevelt).
# Stated honestly:
#  - Coordinates of new places are from the Wikipedia infoboxes, rounded.
#  - Directors are added with life dates and one line only (coverage: not-read, "added as director of ...").
#  - Dick Richards: Wikipedia gives the birth year only (1936); Wikidata says 9 July 1936. The record uses the year.
#  - The Fabulous Baker Boys: the film's article puts "Makin' Whoopee" in the Biltmore's Crystal Ballroom, the
#    Hollywood Roosevelt's article in its Cinegrill nightclub. Both hotels are linked; recorded as a discrepancy.
#  - Several links rest on a place article's list of films only (the film's own article names no locations there):
#    Farewell, My Lovely and 1941 (Santa Monica Pier), Bugsy (Union Station, Biltmore), To Live and Die in L.A.
#    (Union Station, Los Angeles River), Terminator 2 (Los Angeles River; the film's article names the Bull Creek
#    spillway for the truck chase), Black Rain and The Rocketeer (Ennis House), Menace II Society (Watts Towers),
#    American History X (Venice High School, Lincoln Heights Jail), L.A. Confidential (Lincoln Heights Jail).
# Left out:
#  - Already in the database: Chinatown, The Sting, The Bad News Bears, Blade Runner, Ghostbusters, Back to the Future,
#    Die Hard, Forrest Gump. New places for them (Blade Runner's Ennis House, Chinatown's LA River) are not added here.
#  - Outside Los Angeles city / Santa Monica / Venice: Pulp Fiction (Hawthorne Grill), Beverly Hills Cop (Pasadena),
#    Heat's Kate Mantilini diner (Beverly Hills), L.A. Confidential's Formosa Cafe (West Hollywood), Randy's Donuts
#    (Inglewood), Point Break's Fox Hills Mall, Speed (its LAX finale was shot at Mojave Airport).
#  - Not confirmed or contradicted: The Terminator and other films only listed as "appeared in" at Griffith Observatory
#    (kept out, as in the earlier batch); Silver Streak (Union Station's list, but its article says Toronto Union
#    Station); Falling Down (the Santa Monica Pier list names it, but its article sets the end on Venice Pier and
#    names Lynwood as a filming location); White Men Can't Jump and Speed (Venice's list only, nothing in the film
#    articles); Grease at John Marshall High School (that school's list, but the film's article puts Rydell at Venice
#    High); The Long Goodbye (Marlowe's apartment is not named); Swingers' Dresden Lounge and the Derby (no articles;
#    the film is linked to Los Feliz instead); the Elm Street house at 1428 North Genesee Avenue (private home, no
#    article; named in the film's note only).
#  - Kept out to stay near 25 films: Colors, Ricochet, Heathers, Ruthless People, Lethal Weapon 4, Earthquake,
#    Repo Man (all confirmed in a place article; candidates for a later batch).
batch:
  title: "Los Angeles films, 1970-1999"
  requested: "About 25 more famous films released 1970-1999 shot at specific Los Angeles places, for a top-100 LA film locations set"
  date: 2026-10-10

