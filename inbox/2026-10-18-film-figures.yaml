# Film figures: 22 real people with a substantial part in the History films' stories, added and linked to the films
# that portray them (role subject), following inbox/2026-10-18-film-portrayals.yaml. Ty chose (2026-10-18) Churchill and
# Robert F. Kennedy, plus the key figures in the films' stories.
# VERIFIED against English Wikipedia articles downloaded on 2026-10-18 with tools/wiki.py (revision IDs in the session
# scratchpad): each person's dates and note from their own article; each portrayal from the film's article (plot,
# cast or lead). Sitelinks read from Wikidata on 2026-10-18. Types follow CLAUDE.md: statesmen and officials
# Government, queens Royalty, a duchess Nobility, scientists Scholar; people known for one story Notable.
# Prominence: Scholars and Notable people from sitelinks; Government, Royalty and Nobility hand-set.
# Stated honestly:
#  - Isabella of France: born c. 1295 (estimated).
#  - Itzhak Stern: Wikipedia says he died 30 January 1969; Wikidata says 27 June 1969. Recorded as a discrepancy; the
#    record uses Wikipedia's date.
#  - John Glenn was also a US senator for 24 years; typed Notable like the other astronauts, as the films know him.
#  - Also added: the four marriages that join these people to people already here (Isabella and Edward II, Elizabeth
#    and George VI, Wallis Simpson and Edward VIII, Kitty and J. Robert Oppenheimer), and Glenn and Kranz at the
#    flights the films show. Titles (Prime Minister, Queen consort...) are left for a later batch.
