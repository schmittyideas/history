# Museums on the map, batch 1: every museum in this half of the list gets a place,
# so an artwork's Work card and the Place card can show where it hangs.
#
# Eight museums reuse a place that already is the museum or its building (Louvre Palace,
# Hotel Biron, Centre Pompidou, Palais des Beaux-Arts de Lyon, the Met, Getty Center, LACMA,
# Kroller-Muller Museum). The rest get a new place keyed like the museum.
#
# Facts and coordinates are from each museum's English Wikipedia article (the source the
# museum already cites). Every article's coordinates are within 200 m of the museum record,
# so no museum lat/lng changes. A place's `founded` is the year the building opened as this
# museum, or, for a much older building, the year the building was finished (the note says
# which). Where the museum record's founding year differs from the article's infobox, a
# discrepancy records both (museums can't be named in `about`, so it names the place).
# built_by / architect are filled only where the article's infobox names them.

batch:
  title: Museums on the map, batch 1
  requested: "Ty: link museums to places"
  date: 2026-10-12

