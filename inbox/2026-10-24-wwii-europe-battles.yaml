discrepancies:
  - key: battle-of-moscow-start
    question: Did the Battle of Moscow begin on 30 September or 2 October 1941?
    about: [{event: battle-of-moscow}]
    field: date
    claims:
      - {value: "1941-10-02", sources: [wp-battle-of-moscow], note: Infobox}
      - {value: "1941-09-30", sources: [wp-battle-of-moscow], note: "Body: the advance 'resumed on 30 September 1941'; section 'Initial German advance (30 September – 10 October)'"}
    note: The record uses 2 October, the infobox date.
  - key: battle-of-the-bulge-end
    question: Did the Battle of the Bulge end on 25 or 28 January 1945?
    about: [{event: battle-of-the-bulge}]
    field: date
    claims:
      - {value: "1945-01-28", sources: [wp-battle-of-the-bulge], note: "Infobox (citing Jones 2019)"}
      - {value: "1945-01-25", sources: [wp-battle-of-the-bulge], note: "Lead and body: 'The German offensive drew to a close on 25 January'"}
    note: Only the end year (1945) is stored, so the record is right either way.
  - key: reichstag-flag-date
    question: Was the flag photo over the Reichstag taken on 1 or 2 May 1945?
    about: [{event: battle-of-berlin}, {place: reichstag-building}]
    field: date
    claims:
      - {value: "The day after the building was taken (a re-enactment)", sources: [wp-battle-of-berlin]}
      - {value: "2 May 1945", sources: [wp-raising-a-flag-over-the-reichstag]}
    note: The record gives no date for the photo.
