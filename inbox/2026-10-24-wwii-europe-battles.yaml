events:
  - key: dunkirk-evacuation
    name: Dunkirk evacuation (Operation Dynamo)
    type: Evacuation
    date: 1940-05-26
    end_year: 1940
    place: dunkirk
    places: [{place: dover-castle, role: planning, note: "Admiral Ramsay ran the operation from the tunnels below the castle"}]
    prominence: 4
    people: [{person: winston-churchill, role: ordered}, {person: hermann-goring, role: commander}, {person: adolf-hitler, role: halt order}]
    note: More than 338,000 Allied soldiers were taken off Dunkirk's beaches and harbour by navy and civilian ships, 26 May – 4 June 1940.
    sources: [wp-dunkirk-evacuation]
  - key: the-blitz
    name: The Blitz
    type: Bombing
    date: 1940-09-07
    end_year: 1941
    place: london
    prominence: 4
    people: [{person: winston-churchill, role: commander}, {person: hugh-dowding, role: commander}, {person: adolf-hitler, role: commander}, {person: hermann-goring, role: commander}]
    note: German bombing of British cities to 16 May 1941; London was bombed on 56 of 57 days and nights from 7 September 1940.
    sources: [wp-the-blitz]
  - key: siege-of-leningrad
    name: Siege of Leningrad
    type: Siege
    date: 1941-09-08
    end_year: 1944
    place: saint-petersburg
    prominence: 4
    people: [{person: georgy-zhukov, role: commander}, {person: adolf-hitler, role: ordered}]
    note: German and Finnish forces besieged Leningrad for 872 days, to 27 January 1944, without taking it; hundreds of thousands starved.
    sources: [wp-siege-of-leningrad]
  - key: battle-of-moscow
    name: Battle of Moscow
    type: Battle
    date: 1941-10-02
    end_year: 1942
    place: moscow
    prominence: 4
    people:
      - {person: adolf-hitler, role: commander}
      - {person: wilhelm-keitel, role: commander}
      - {person: alfred-jodl, role: commander}
      - {person: heinz-guderian, role: commander}
      - {person: hermann-goring, role: commander}
      - {person: joseph-stalin, role: commander}
      - {person: georgy-zhukov, role: commander}
      - {person: konstantin-rokossovsky, role: commander}
      - {person: ivan-konev, role: commander}
    note: The German drive on Moscow (Operation Typhoon) was halted, and a Soviet counteroffensive from 5 December pushed it back, to 7 January 1942.
    sources: [wp-battle-of-moscow]
  - key: second-battle-of-el-alamein
    name: Second Battle of El Alamein
    type: Battle
    date: 1942-10-23
    end_year: 1942
    place: el-alamein
    places: [{place: alamein-memorial, role: memorial}]
    prominence: 4
    people: [{person: bernard-montgomery, role: victor}, {person: erwin-rommel, role: defeated}]
    note: Montgomery's Eighth Army broke the Axis line near El Alamein (23 October – 4 November 1942), and Rommel retreated.
    sources: [wp-second-battle-of-el-alamein, wp-alamein-memorial]
  - key: operation-torch
    name: Operation Torch
    type: Invasion
    date: 1942-11-08
    end_year: 1942
    place: casablanca
    places:
      - {place: oran, role: landing, note: Centre Task Force}
      - {place: algiers, role: landing, note: Eastern Task Force}
    prominence: 3
    people: [{person: dwight-d-eisenhower, role: supreme commander}, {person: george-s-patton, role: commander}, {person: winston-churchill, role: proposed}]
    note: Anglo-American landings in Vichy French North Africa at Casablanca (Patton's Western Task Force), Oran and Algiers, to 16 November 1942.
    sources: [wp-operation-torch]
  - key: allied-invasion-of-sicily
    name: Allied invasion of Sicily (Operation Husky)
    type: Invasion
    date: 1943-07-09
    end_year: 1943
    place: gela
    places:
      - {place: licata, role: landing, note: Western end of the US landings}
      - {place: cassibile, role: landing, note: Eastern end of the landings}
      - {place: syracuse-sicily, role: target, note: British airborne landing at Ponte Grande}
      - {place: messina, role: finish, note: "US troops entered on the night of 16 August; the campaign ended on 17 August"}
    prominence: 3
    people:
      - {person: dwight-d-eisenhower, role: supreme commander}
      - {person: george-s-patton, role: commander}
      - {person: bernard-montgomery, role: commander}
      - {person: omar-bradley, role: commander}
    note: Airborne and seaborne invasion, then a six-week campaign; it led to Mussolini's fall, and Axis forces escaped over the Strait of Messina.
    sources: [wp-allied-invasion-of-sicily]
  - key: battle-of-kursk
    name: Battle of Kursk
    type: Battle
    date: 1943-07-05
    end_year: 1943
    place: kursk
    places: [{place: prokhorovka, role: tank battle, note: 12 July 1943}]
    prominence: 4
    people:
      - {person: adolf-hitler, role: commander}
      - {person: erich-von-manstein, role: commander}
      - {person: joseph-stalin, role: commander}
      - {person: georgy-zhukov, role: commander}
      - {person: konstantin-rokossovsky, role: commander}
      - {person: ivan-konev, role: commander}
    note: Germany's Operation Citadel against the Kursk salient failed, and Soviet counteroffensives followed, to 23 August 1943.
    sources: [wp-battle-of-kursk, wp-battle-of-prokhorovka]
  - key: armistice-of-cassibile
    name: Armistice of Cassibile
    type: Armistice
    date: 1943-09-03
    place: cassibile
    prominence: 3
    people: [{person: dwight-d-eisenhower, role: announced}]
    note: Italy's secret armistice with the Allies, signed at Fairfield Camp and announced on 8 September; a longer one followed at Malta on 29 September.
    sources: [wp-armistice-of-cassibile]
  - key: battle-of-monte-cassino
    name: Battle of Monte Cassino
    type: Battle
    date: 1944-01-17
    end_year: 1944
    place: monte-cassino
    prominence: 3
    note: Four Allied assaults on the Gustav Line around the abbey, which Allied bombers destroyed on 15 February; Polish troops took it on 18 May 1944.
    sources: [wp-battle-of-monte-cassino]
  - key: operation-bagration
    name: Operation Bagration
    type: Offensive
    date: 1944-06-22
    end_year: 1944
    place: minsk
    prominence: 4
    people:
      - {person: georgy-zhukov, role: commander}
      - {person: konstantin-rokossovsky, role: commander}
      - {person: ivan-konev, role: commander}
    note: Soviet offensive in Byelorussia that destroyed much of German Army Group Centre (to 19 August 1944); Minsk was freed on 4 July.
    sources: [wp-operation-bagration]
  - key: warsaw-uprising
    name: Warsaw Uprising
    type: Uprising
    date: 1944-08-01
    end_year: 1944
    place: warsaw
    places: [{place: warsaw-uprising-museum, role: memorial}]
    prominence: 3
    people: [{person: joseph-stalin, role: withheld support}]
    note: The Polish Home Army rose against the German occupation for 63 days, to 2 October 1944, while Soviet forces waited; most of Warsaw was destroyed.
    sources: [wp-warsaw-uprising]
  - key: liberation-of-paris
    name: Liberation of Paris
    type: Liberation
    date: 1944-08-19
    end_year: 1944
    place: paris
    places:
      - {place: paris-police-prefecture, role: start, note: "The uprising began here on 19 August; Choltitz signed the official surrender here on 25 August"}
      - {place: le-meurice, role: surrender, note: "Choltitz surrendered at his headquarters at 15:30 on 25 August"}
      - {place: gare-montparnasse, role: signing, note: "Leclerc's command post, where the surrender of the German troops was signed"}
      - {place: hotel-de-ville-paris, role: speech, note: "De Gaulle's speech, 25 August"}
      - {place: arc-de-triomphe, role: parade, note: "The victory parade set off here on 26 August"}
    prominence: 4
    people: [{person: charles-de-gaulle, role: commander}, {person: dwight-d-eisenhower, role: allowed the advance}]
    note: A Resistance uprising, then Leclerc's 2nd Armoured Division and the US 4th Infantry freed Paris; the garrison surrendered on 25 August 1944.
    sources: [wp-liberation-of-paris]
  - key: operation-market-garden
    name: Operation Market Garden
    type: Operation
    date: 1944-09-17
    end_year: 1944
    place: arnhem
    places:
      - {place: john-frost-bridge, role: objective, note: The Arnhem road bridge, never held}
      - {place: nijmegen, role: bridge}
      - {place: eindhoven, role: objective}
    prominence: 3
    people: [{person: bernard-montgomery, role: planned}, {person: dwight-d-eisenhower, role: supreme commander}]
    note: An airborne and armoured push for the Dutch river bridges (to 25 September 1944); it took Eindhoven and Nijmegen but failed at Arnhem.
    sources: [wp-operation-market-garden, wp-john-frost-bridge]
  - key: battle-of-the-bulge
    name: Battle of the Bulge
    type: Battle
    date: 1944-12-16
    end_year: 1945
    place: bastogne
    prominence: 4
    people:
      - {person: adolf-hitler, role: ordered}
      - {person: dwight-d-eisenhower, role: supreme commander}
      - {person: bernard-montgomery, role: commander}
      - {person: omar-bradley, role: commander}
      - {person: george-s-patton, role: relieved Bastogne}
    note: Germany's Ardennes offensive towards Antwerp; besieged Bastogne held until Patton's Third Army relieved it on 26 December.
    sources: [wp-battle-of-the-bulge, wp-bastogne]
  - key: bombing-of-dresden
    name: Bombing of Dresden
    type: Bombing
    date: 1945-02-13
    end_year: 1945
    place: dresden
    places: [{place: frauenkirche-dresden, role: destroyed}]
    prominence: 3
    people: [{person: arthur-harris, role: commander}, {person: winston-churchill, role: pressed for}]
    note: Four RAF and USAAF raids (13–15 February 1945) dropped over 3,900 tons of bombs on Dresden and killed up to 25,000 people.
    sources: [wp-bombing-of-dresden, wp-frauenkirche-dresden]
  - key: battle-of-berlin
    name: Battle of Berlin
    type: Battle
    date: 1945-04-16
    end_year: 1945
    place: berlin
    places: [{place: reichstag-building, role: assault, note: "Soviet troops entered on 30 April; the famous flag photo was taken in the days after"}]
    prominence: 4
    people:
      - {person: joseph-stalin, role: commander}
      - {person: georgy-zhukov, role: commander}
      - {person: konstantin-rokossovsky, role: commander}
      - {person: ivan-konev, role: commander}
      - {person: adolf-hitler, role: commander}
    note: The last Soviet offensive of the war in Europe; Berlin's garrison surrendered on 2 May 1945, two days after Hitler's suicide.
    sources: [wp-battle-of-berlin, wp-reichstag-building]
