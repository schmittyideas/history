batch:
  title: "WWII, batch 2b: the European war's battles and campaigns"
  requested: "Ty: go ahead with batch 2, the European war and its commanders"
  date: 2026-10-24

# Notes for the reviewer
# - Facts come from each event's English Wikipedia article, read through the Wikipedia API on 2026-10-24 (infobox and body). Site
#   coordinates come from each site's own article; Licata and the Alamein Memorial have none there, so theirs come from Wikidata.
# - Needs batch 2a (2026-10-24-wwii-europe-commanders.yaml) applied first: the commanders linked here are added there.
# - People: infobox commanders, plus people the body names in a clear role (Churchill ordered Dunkirk's evacuation; Harris proposed
#   the Dresden raids; Jodl, Keitel and Zhukov signed the surrenders). Passing mentions are left out.
# - Existing events updated with the commanders now in the database: invasion of Poland, Battle of France, Battle of Britain,
#   Operation Barbarossa, Stalingrad, Normandy (plus its five beaches as places), the German surrender, the Nuremberg trials.
#   Patton's role at Normandy was only the decoy army in England, so he is not linked to it.
# - Prominence: 4 for the big battles and turning points (Dunkirk, the Blitz, Leningrad, Moscow, El Alamein, Kursk, Bagration,
#   Liberation of Paris, the Bulge, Berlin); 3 for the rest.
# - Market Garden: the article deliberately gives no one-word result (a debated outcome); the note says what failed and what was won.
# - The longer armistice with Italy, signed at Malta on 29 September 1943 aboard HMS Nelson, is mentioned in the Cassibile note only.
# - Bagration is placed at Minsk (liberated 4 July 1944); the infobox location is a whole region.
# - Torch is placed at Casablanca, with Oran and Algiers as the other landings.

