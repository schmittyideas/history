# Notes for the reviewer
# - 42 painters (Impressionism, Post-Impressionism, Realism, academic painting), ranked by Wikipedia sitelinks, from English Wikipedia articles; lead images are links only (public domain, one CC BY-SA 4.0).
# - Every person is `coverage: partly`; artworks have no images yet. Articles were cut at 32,000 characters: death places and late sections are missing where that bit, and left out rather than guessed.
# - Teachers and patrons not yet in the database (Gleyre, Couture, Napoleon III and others) have no links; they are named in each person's coverage note.
# - Coordinates of new places are present-day and approximate (general knowledge, not the articles).

