- key: georges-seurat-cause-of-death
  question: What caused Georges Seurat's death in 1891?
  about:
  - person: georges-seurat
  field: died
  claims:
  - value: A form of meningitis
    sources:
    - wp-georges-seurat
    note: The article says the cause is uncertain.
  - value: Pneumonia
    sources:
    - wp-georges-seurat
  - value: Infectious angina
    sources:
    - wp-georges-seurat
  - value: Diphtheria
    sources:
    - wp-georges-seurat
  note: Date and place of death (29 March 1891, Paris) are not in question; only the cause. His son died two weeks later of the same disease.
- key: honore-daumier-died
  question: On which day in February 1879 did Honoré Daumier die?
  about:
  - person: honore-daumier
  field: died
  claims:
  - value: 10 February 1879
    sources:
    - wp-honore-daumier
    note: Given in the article lead; some sources state this date.
  - value: 11 February 1879
    sources:
    - wp-honore-daumier
    note: Other sources state this date.
  note: The record holds the year 1879 only, because the article says sources conflict on the day.
- key: maurice-denis-died
  question: On which day in November 1943 did Maurice Denis die?
  about:
  - person: maurice-denis
  field: died
  claims:
  - value: 13 November 1943
    sources:
    - wp-maurice-denis
    note: Date in the article lead.
  - value: 2 November 1943
    sources:
    - wp-maurice-denis
    note: Listed in some sources.
  - value: 3 November 1943
    sources:
    - wp-maurice-denis
    note: Listed in some sources.
  note: The record holds the year 1943 only, because the article says the day is variously listed as the 2nd, 3rd or 13th.
- key: maurice-utrillo-father
  question: Who was Maurice Utrillo's father?
  about:
  - person: maurice-utrillo
  - person: suzanne-valadon
  field: father
  claims:
  - value: Miquel Utrillo, a Spanish artist, who signed a document acknowledging paternity in 1891
    sources:
