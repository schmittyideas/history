batch:
  title: "The Papacy, part 1: the popes from Benedict VIII to Celestine III, 1012-1198"
  requested: "Reigns, lives, deaths and key events of the 26 popes from Benedict VIII (1012) to Celestine III (1198): the Tusculan popes, the Sutri reform, the Great Schism, the Investiture Controversy, the First Crusade and the struggle with Barbarossa"
  date: 2026-10-08

# Notes for the reviewer
# - Facts come only from the 26 downloaded Wikipedia articles (Pope_Benedict_VIII ... Pope_Celestine_III). Investiture_Controversy.txt is NOT in the download folder, so no event is taken from it; the Investiture events here (Gregory VII's excommunication of Henry IV, Canossa, Henry V and Paschal II, Worms) come from the pope articles.
# - Antipopes are out of scope and not entered: Sylvester III, Benedict X, Honorius II (Cadalus), Clement III (Guibert of Ravenna), Gregory VIII (Maurice Bourdin), Anacletus II, Victor IV, Paschal III, Callixtus III, Innocent III (1179), and the "Gregory VI" of 1012 named in the Benedict VIII article. They appear in notes only. Because these share regnal names, a later batch that enters an antipope should use a key such as `clement-iii-antipope`. The keys here (clement-iii, gregory-viii, celestine-ii, honorius-ii...) are the lawful popes.
# - Honorius II's article calls the rival of December 1124 (Theobald Boccapecci) "Celestine II". He is not the Celestine II of this batch (Guido di Castello, 1143-44).
# - Popes of the period who were not requested and have no downloaded article, so they are NOT entered and the gaps between pontificates are real in the data: the popes between Sylvester II (d. 1003) and Benedict VIII (1012), and John XIX (Benedict VIII's brother, 1024-1032, named in the Benedict VIII and IX articles), Damasus II (1048, named in the Benedict IX and Leo IX articles), Lucius II (1144-1145; killed in an attack on the Capitol, per the Eugene III article), and Anastasius IV (1153-1154, named in the Adrian IV article). Do not fill them from here.
# - Pontificate dates use each article's lead. Where the lead gives the election date and the body a different consecration date, the election date is used (Gregory VII 22 April 1073, consecrated 29 June; Paschal II 13 August 1099, consecrated 19 August; Victor III elected 24 May 1086, consecrated 21 March 1087; Stephen IX elected 2 August 1057, lead gives 3 August, the day of his coronation). Where only a month is given the year alone is used and the month is in the note (Benedict IX's three pontificates, Lucius III 1181).
# - Benedict IX is three title rows (1032-1044, 1045, 1047-1048). The rows are keyed by person--title--start year and are separate on purpose. The 1045 row overlaps Gregory VI's start (1 May 1045): the article says Benedict resigned in May 1045.
# - `disputed: true` is not used. Innocent II (against Anacletus II, 1130-1138) and Alexander III (against Victor IV and his successors, 1159-1177) are the lawful popes in the articles; the contests are recorded as the events schism-of-1130 and schism-of-1159. Honorius II's election in December 1124 was also contested briefly; he resigned and was re-elected unanimously, consecrated 21 December 1124.
# - Left out because the articles give no date: the Dictatus Papae (the Gregory VII article only lists "Dictatus papae (1075-87)" under See also, with no content), the Synod of Worms of 24 January 1076 as a separate event (in the excommunication note), Treaty of Melfi 1059, Treaty of Mignano (25 July 1139), Council of Troyes 1129, Clement III's treaty with the Romans (31 May 1188), the canonisation of Thomas Becket (1173), Third Lateran details beyond the two-thirds rule. Also left out: births with no article place, burial places not stated (Urban II, Innocent II's tomb site, Nicholas II, Clement III, Celestine III, Benedict VIII, Leo IX, Eugene III's exact church), and Gregory VI's death place (the article says only "probably at Cologne").
# - Shared keys defined here (other batches may send the same key): great-schism-1054 (Byzantine batch defines it with place hagia-sophia; this one omits the place so the other value stands), council-of-clermont-1095. Referenced and not redefined: rome, st-peters-basilica-rome, bamberg-cathedral, canossa-castle, worms, venice, walk-to-canossa-1077, imperial-coronation-of-henry-v-1111, concordat-of-worms-1122, imperial-coronation-of-frederick-barbarossa-1155, peace-of-venice-1177, second-crusade-1147, third-crusade-1189, and the people henry-iii-holy-roman-emperor, henry-iv-holy-roman-emperor, henry-v-holy-roman-emperor, frederick-i-barbarossa-holy-roman-emperor (HRE batch), henry-ii-of-england (Plantagenets batch), william-i-of-england (already in the database). This batch must be applied after the HRE, France and Plantagenets batches.
# - Cluny Abbey, Monte Cassino and the Lateran are given only the roles the articles state. Coordinates are from general knowledge to 2-3 decimals.
# - Doubts: Alexander II is "born in Milan" in the lead but the body gives Cesano Boscone near Corsico, 7 km from Milan; the lead is used for the note. Born-date ranges (Nicholas II c.990/995, Alexander II 1010/1015, Paschal II 1050x1055, Gelasius II 1060/1064, Alexander III 1100/1105, Gregory VIII 1100/1105) use the first year with `born_estimated: true`; Lucius III's article says 1100 "perhaps 1097".

