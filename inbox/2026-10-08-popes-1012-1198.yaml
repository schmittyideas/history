discrepancies:
  - key: benedict-ix-third-pontificate-end
    question: When did Benedict IX's third pontificate end?
    about: [{person: benedict-ix}]
    field: title end
    claims:
      - {value: "July 1048 (the lead's '1047-1048'; the third-pontificate section says German troops drove him away in July 1048)", sources: [wp-benedict-ix]}
      - {value: "'remaining on the throne until July 1046', in the first sentence of the third-pontificate section, which sits before the Council of Sutri in December 1046 and so looks like a slip for 1048", sources: [wp-benedict-ix]}
    note: "The record uses 1047-1048."
  - key: battle-of-civitate-date
    question: On what day was the Battle of Civitate fought?
    about: [{event: battle-of-civitate-1053}]
    field: date
    claims:
      - {value: "15 June 1053", sources: [wp-leo-ix]}
      - {value: "18 June 1053", sources: [wp-stephen-ix]}
    note: "The record uses 15 June, from the Leo IX article, whose subject was the commander."
  - key: gelasius-ii-death-date
    question: On what day did Gelasius II die at Cluny?
    about: [{person: gelasius-ii}]
    field: died
    claims:
      - {value: "29 January 1119", sources: [wp-gelasius-ii, wp-callixtus-ii]}
      - {value: "28 January 1119", sources: [wp-honorius-ii]}
    note: "The record uses 29 January (two articles, including his own)."
  - key: concordat-of-worms-year-honorius-article
    question: In what year was the Concordat of Worms (the Pactum Calixtinum) concluded?
    about: [{event: concordat-of-worms-1122}]
    field: date
    claims:
      - {value: "23 September 1122", sources: [wp-callixtus-ii]}
      - {value: "23 September 1123", sources: [wp-honorius-ii]}
    note: "The Honorius II article also puts the concordat in 1122 elsewhere in the same sentence, so 1123 looks like a slip. The record (event concordat-of-worms-1122, from the HRE batch) uses 23 September 1122."
  - key: celestine-ii-election-date
    question: On what day was Celestine II elected?
    about: [{person: celestine-ii}]
    field: title start
    claims:
      - {value: "26 September 1143 (lead)", sources: [wp-celestine-ii]}
      - {value: "25 September 1143, 'two days after the death of Innocent II' (Innocent died 24 September)", sources: [wp-celestine-ii]}
    note: "The record uses 26 September from the lead, which fits two days after the 24 September death."
  - key: clement-iii-celestine-iii-dates
    question: When did Clement III die and Celestine III become pope in 1191?
    about: [{person: clement-iii}, {person: celestine-iii}]
    field: died
    claims:
      - {value: "Clement III died 20 March 1191 (lead); Celestine elected 29 or 30 March", sources: [wp-clement-iii, wp-celestine-iii]}
      - {value: "Clement III died 10 April 1191 (Death section), with Celestine elected 'the day of Clement's death'; Celestine's lead says 30 March or 10 April", sources: [wp-clement-iii, wp-celestine-iii]}
      - {value: "Clement III died 'in the latter part of March 1191' (Actions section)", sources: [wp-clement-iii]}
    note: "The record uses 20 March 1191 for Clement's death and 30 March for Celestine's start, since the leads and the March reading agree. Celestine III was ordained priest on 13 April 1191 either way."
  - key: laudabiliter-year
    question: In which year did Adrian IV supposedly grant Ireland to Henry II (Laudabiliter), and did the bull exist?
    about: [{event: laudabiliter-1155}, {person: adrian-iv}]
    field: date
    claims:
      - {value: "1155 (Laudabiliter section)", sources: [wp-adrian-iv]}
      - {value: "1158 (the lead: 'in 1158 Adrian is supposed to have granted Henry the papal bull')", sources: [wp-adrian-iv]}
      - {value: "Scholars are uncertain whether the bull ever existed; Duggan found no reliable evidence of its content", sources: [wp-adrian-iv]}
    note: "The record uses 1155, from the full section; the event is marked 'reputed'."
  - key: barbarossa-1155-coronation-place
    question: Where was Frederick Barbarossa crowned emperor on 18 June 1155?
    about: [{event: imperial-coronation-of-frederick-barbarossa-1155}]
    field: place
    claims:
      - {value: "In Rome at St Peter's (Barbarossa's own 1189 letter: 'in the city of Rome ... from the altar of St Peter'); the HRE batch records St Peter's Basilica", sources: [wp-adrian-iv]}
      - {value: "'He was eventually crowned in Nepi on 18 June' (Imperial coronation, 1155 section); the same section says the coronation was held in secret on a Saturday because of fear of Roman hostility", sources: [wp-adrian-iv]}
    note: "The record leaves the HRE batch's place (St Peter's) and adds the Nepi reading as an open question. The article gives no day apart from 18 June."
