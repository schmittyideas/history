places:
  - key: los-angeles
    name: Los Angeles
    historical_name: El Pueblo de Nuestra Señora la Reina de los Ángeles
    kind: city
    region: California
    country: United States
    lat: 34.0522
    lng: -118.2437
    founded: 1781
    visitable: true
    note: "Founded on 4 September 1781 by 44 settlers (Los Pobladores) under Spanish governor Felipe de Neve, near the Tongva village of Yaanga. The second most populous city in the United States. Coordinates are downtown (approximate)."
    sources: [wp-los-angeles]
  - key: el-pueblo-de-los-angeles
    name: El Pueblo de Los Ángeles (Los Angeles Plaza)
    historical_name: Los Angeles Plaza
    kind: historic district
    city: Los Angeles
    region: California
    country: United States
    lat: 34.0572
    lng: -118.2378
    founded: 1781
    visitable: true
    visit_site: "El Pueblo de Los Ángeles Historical Monument: the old plaza, Olvera Street and La Placita Church (1822)"
    note: "The oldest part of the city and its centre under Spanish, Mexican and early American rule; a plaque on the plaza marks the founding of 4 September 1781. State historic monument from 1953; on the National Register of Historic Places since 1972. Union Station was built across the street, on the site of the original Chinatown. Coordinates approximate."
    sources: [wp-el-pueblo-de-los-angeles, wp-los-angeles-union-station]
  - key: los-angeles-city-hall
    name: Los Angeles City Hall
    kind: city hall
    city: Los Angeles
    region: California
    country: United States
    lat: 34.0536
    lng: -118.2428
    founded: 1928
    built_by: "City of Los Angeles, under Mayor George E. Cryer"
    architect: "John Parkinson, John C. Austin and Albert C. Martin Sr."
    visitable: true
    visit_site: "Free observation deck on the 27th floor, open Monday to Friday during business hours"
    note: "Dedicated 26 April 1928. The tallest building in Los Angeles until 1966 (a height limit exempted only public buildings); its tower is modelled on the Mausoleum at Halicarnassus, and its concrete was made with sand from every California county and water from the 21 missions. Base-isolated in a 1998-2001 seismic retrofit. Houses the mayor's office and the City Council. Coordinates approximate."
    sources: [wp-los-angeles-city-hall, wp-george-e-cryer]
  - key: los-angeles-union-station
    name: Los Angeles Union Station
    historical_name: Los Angeles Union Passenger Terminal
    kind: railway station
    city: Los Angeles
    region: California
    country: United States
    lat: 34.0560
    lng: -118.2366
    founded: 1939
    built_by: "City of Los Angeles with the Santa Fe, Southern Pacific and Union Pacific railroads (approved by voters in 1926)"
    architect: "John and Donald Parkinson, with Jan van der Linden and other supporting architects"
    visitable: true
    note: "Opened in May 1939; called the 'Last of the Great Railway Stations' in the United States, mixing Art Deco, Mission Revival and Streamline Moderne. Built on the site of the original Chinatown, which was demolished for it. Still the busiest railway station in the western United States. Coordinates approximate."
    sources: [wp-los-angeles-union-station]
  - key: los-angeles-memorial-coliseum
    name: Los Angeles Memorial Coliseum
    kind: stadium
    city: Los Angeles
    region: California
    country: United States
    lat: 34.0141
    lng: -118.2879
    founded: 1923
    built_by: "Commissioned in 1921 as a memorial to Los Angeles veterans of the First World War"
    architect: "John and Donald Parkinson"
    visitable: true
    note: "Ground broken 21 December 1921, completed 1 May 1923. Main stadium of the 1932 and 1984 Summer Olympics and due to host athletics in 2028, the first stadium to host three Games. National Historic Landmark since 27 July 1984. Home of USC Trojans football. Coordinates approximate."
    sources: [wp-los-angeles-memorial-coliseum]
  - key: dodger-stadium
    name: Dodger Stadium
    kind: stadium
    city: Los Angeles
    region: California
    country: United States
    lat: 34.0739
    lng: -118.2400
    founded: 1962
    built_by: "Walter O'Malley's Los Angeles Dodgers, privately financed, on land in Chavez Ravine traded by the city"
    visitable: true
    note: "Ground broken 17 September 1959; opened 1962. Built in Chavez Ravine after the city, under Mayor Norris Poulson, dropped a planned public-housing project there and traded the land to the Dodgers (approved by referendum on 3 June 1958); the Mexican-American residents were removed. The oldest major-league ballpark west of the Mississippi and the largest baseball stadium in the world by seats. Coordinates approximate."
    sources: [wp-dodger-stadium, wp-chavez-ravine, wp-norris-poulson]
  - key: los-angeles-aqueduct-cascades
    name: Los Angeles Aqueduct Cascades
    kind: aqueduct
    city: Los Angeles
    region: California
    country: United States
    lat: 34.3110
    lng: -118.4930
    founded: 1913
    built_by: "City of Los Angeles; chief engineer William Mulholland"
    visitable: true
    visit_site: "The Cascades, seen from Foothill Boulevard near Balboa Boulevard, Sylmar (California Historical Landmark)"
    note: "The terminal of the 233-mile Los Angeles Aqueduct from the Owens Valley, where the water tumbles down a stepped channel into the San Fernando Valley. Completed 5 November 1913; California Historical Landmark since 28 July 1958. About four miles north-west of San Fernando. Coordinates approximate."
    sources: [wp-los-angeles-aqueduct]
  - key: st-francis-dam
    name: St. Francis Dam
    historical_name: San Francisquito Dam
    kind: dam
    region: California
    country: United States
    lat: 34.5470
    lng: -118.5120
    founded: 1924
    ended: 1928
    built_by: "Los Angeles Bureau of Water Works and Supply, under William Mulholland"
    visitable: true
    visit_site: "Ruins visible from San Francisquito Canyon Road; Saint Francis Dam Disaster National Monument (2019)"
    note: "A concrete gravity-arch dam in San Francisquito Canyon, about 40 miles north-west of downtown Los Angeles, built 1924-1926 as a storage reservoir for the aqueduct. It failed on 12 March 1928. Only broken chunks of concrete remain. Coordinates approximate."
    sources: [wp-st-francis-dam]
