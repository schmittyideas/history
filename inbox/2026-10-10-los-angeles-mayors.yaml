discrepancies:
  - key: watts-riots-end-date
    question: On what day did the Watts riots of 1965 end?
    about: [{event: watts-riots}]
    field: end_year
    claims:
      - {value: "16 August 1965 (11-16 August)", sources: [wp-watts-riots]}
      - {value: "17 August 1965 (11-17 August)", sources: [wp-sam-yorty]}
    note: "The record stores only the end year (1965), which both agree on. Both say six days."
  - key: snyder-third-term-end
    question: When did Meredith Snyder's third term as mayor end?
    about: [{person: meredith-p-snyder}]
    field: title end
    claims:
      - {value: "1 July 1921", sources: [wp-list-of-mayors-of-los-angeles]}
      - {value: "June 1921", sources: [wp-meredith-p-snyder]}
    note: "The title row uses 1 July 1921, the list's date, which matches Cryer taking office the same day."
  - key: st-francis-dam-death-toll
    question: How many people died in the St. Francis Dam disaster?
    about: [{event: st-francis-dam-failure}, {place: st-francis-dam}]
    field: note
    claims:
      - {value: "At least 431", sources: [wp-st-francis-dam, wp-los-angeles-aqueduct], note: "The article's current figure; remains were still being found until the mid-1950s"}
      - {value: "385", sources: [wp-st-francis-dam], note: "The official toll in August 1928, as the article reports"}
      - {value: "Over 450", sources: [wp-st-francis-dam], note: "The California Historical Landmark No. 919 plaque, quoted in the article"}
    note: "The event note uses 'at least 431'. Many victims were swept out to sea and never found, so the true number is unknown."
