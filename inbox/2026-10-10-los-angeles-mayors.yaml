# Los Angeles: mayors and civic landmarks, 1900 to today.
# VERIFIED against English Wikipedia articles downloaded on 2026-10-10 with tools/wiki.py (revision IDs in the
# research notes): the "List of mayors of Los Angeles" table (wikitext, rev 1376836168) for every term date, and
# each mayor's own article for life dates and what happened in office. Notes:
#  - New convention (Ty): mayors are type Government, title "Mayor of Los Angeles", realm "Los Angeles".
#  - Every mayor in office from 1900 on is here, from Frederick Eaton (in office until 12 Dec 1900) to Karen Bass.
#    Meredith Snyder's first term (1896-1898) is included so his three terms are complete. The two acting mayors
#    who filled a vacancy (Niles Pease, 1909; Martin Betkouski, 1916) are included as the list gives them.
#  - Current mayor: Karen Bass, in office since 12 December 2022. 2026 election: Bass came first in the June 2026
#    primary (34.27%) and faces Nithya Raman in the general election on 3 November 2026, which has not happened yet.
#    The "2026 Los Angeles mayoral election" article says both "June 2" and "June 8" for the primary; Bass's article
#    says June 2. No primary event is recorded.
#  - Full dates only where the article gives the day. Union Station's opening (May 1939) and Dodger Stadium's
#    opening (1962) are years only: neither article gives the day.
#  - Coordinates are approximate (from general knowledge, except the Northridge epicentre, which the article gives).
#  - Images left out: the Commons licences were not checked in this batch.
#  - Left out: other offices (Stephens as Governor of California, Garcetti as Ambassador to India) to avoid new realms;
#    Mulholland's burial at Forest Lawn, Glendale and Cryer's at Forest Lawn (no Forest Lawn place yet; a parallel
#    Hollywood batch may add it); the 1959 Chavez Ravine evictions (no clear date in the sources); the Owens Valley
#    dynamiting of 1924 (outside the city). Hollywood, film and tourist-attraction content is in a separate batch.
batch:
  title: "Los Angeles mayors and civic landmarks, 1900 to today"
  requested: "Every Mayor of Los Angeles from 1900 to today, key civic events a visitor would care about, and the civic landmarks tied to them"
  date: 2026-10-10

