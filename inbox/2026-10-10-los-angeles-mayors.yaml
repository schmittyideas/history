events:
  - {key: harper-resignation-1909, name: Mayor Harper resigns ahead of a recall vote, type: Resignation, date: 1909-03-11, place: los-angeles,
     people: [{person: arthur-c-harper, role: resigned}, {person: william-d-stephens, role: appointed successor}], prominence: 2,
     note: "The Los Angeles Herald exposed protection money from brothels and saloons; 25,000 signatures forced a recall, and Harper resigned instead.", sources: [wp-arthur-c-harper, wp-list-of-mayors-of-los-angeles]}
  - {key: los-angeles-times-bombing, name: Los Angeles Times bombing, type: Bombing, date: 1910-10-01, place: los-angeles, prominence: 3,
     note: "Iron-workers' union members dynamited the Los Angeles Times Building, starting a fire that killed 21 people. J.B. McNamara admitted it. Still the deadliest crime to go to trial in California.", sources: [wp-los-angeles-times-bombing]}
  - {key: los-angeles-aqueduct-opening, name: Opening of the Los Angeles Aqueduct, type: Opening, date: 1913-11-05, place: los-angeles-aqueduct-cascades,
     people: [{person: william-mulholland, role: chief engineer}, {person: henry-h-rose, role: presided as mayor}, {person: frederick-eaton, role: conceived it}], prominence: 5,
     note: "Owens Valley water first poured down the Cascades into the San Fernando Valley. The 233-mile aqueduct, built 1908-1913 by up to 3,900 workers and 164 tunnels, let Los Angeles grow into California's largest city, at the cost of the Owens Valley's farms.", sources: [wp-los-angeles-aqueduct, wp-william-mulholland, wp-henry-h-rose]}
  - {key: st-francis-dam-failure, name: St. Francis Dam disaster, type: Disaster, date: 1928-03-12, place: st-francis-dam,
     people: [{person: william-mulholland, role: chief engineer}, {person: george-e-cryer, role: accepted the city's responsibility}], prominence: 4,
     note: "The dam collapsed just before midnight, about 12 hours after Mulholland had inspected it, and the flood ran down the Santa Clara River to the sea. At least 431 people died (see discrepancy on the toll), one of the worst American civil-engineering disasters of the 20th century.", sources: [wp-st-francis-dam, wp-william-mulholland, wp-george-e-cryer]}
  - {key: los-angeles-city-hall-dedication, name: Dedication of Los Angeles City Hall, type: Dedication, date: 1928-04-26, place: los-angeles-city-hall,
     people: [{person: george-e-cryer, role: mayor}, {person: john-parkinson-architect, role: architect}], prominence: 3,
     note: "Mayor Cryer led a parade of floats from the countries of the world. The tower was the city's tallest building until 1966.", sources: [wp-los-angeles-city-hall, wp-george-e-cryer]}
  - {key: 1932-summer-olympics, name: 1932 Summer Olympics, type: Olympic Games, date: 1932-07-30, end_year: 1932, place: los-angeles-memorial-coliseum, prominence: 4,
     note: "30 July to 14 August 1932, held in the Depression with 37 nations. The Coliseum was the Olympic Stadium, and the Baldwin Hills village was the first modern Olympic Village. Mayor Cryer had helped win the bid.", sources: [wp-1932-summer-olympics, wp-george-e-cryer]}
  - {key: recall-of-frank-shaw, name: Recall of Mayor Frank Shaw, type: Recall, year: 1938, place: los-angeles-city-hall,
     people: [{person: frank-l-shaw, role: recalled}, {person: fletcher-bowron, role: elected}], prominence: 2,
     note: "Police misconduct and misuse of public funds led to Shaw's recall, the first of a big-city mayor in the United States; Bowron took office on 26 September 1938.", sources: [wp-frank-l-shaw, wp-list-of-mayors-of-los-angeles]}
  - {key: union-station-opening, name: Union Station opens, type: Opening, year: 1939, place: los-angeles-union-station,
     people: [{person: john-parkinson-architect, role: architect}], prominence: 3,
     note: "Opened in May 1939 (the article gives no day), uniting the Santa Fe, Southern Pacific and Union Pacific terminals. Designed by John and Donald Parkinson; John had died in 1935.", sources: [wp-los-angeles-union-station, wp-john-and-donald-parkinson]}
  - {key: zoot-suit-riots, name: Zoot Suit Riots, type: Riot, date: 1943-06-03, end_year: 1943, place: los-angeles, prominence: 3,
     note: "3-8 June 1943: servicemen and white Angelenos attacked and stripped young Mexican Americans (and Black and Filipino Americans) in zoot suits, starting on Main Street downtown and spreading to East Los Angeles.", sources: [wp-zoot-suit-riots]}
  - {key: dodger-stadium-opening, name: Dodger Stadium opens, type: Opening, year: 1962, place: dodger-stadium,
     people: [{person: norris-poulson, role: brought the Dodgers to Los Angeles}], prominence: 3,
     note: "The Dodgers, who moved from Brooklyn in 1958 and played at the Coliseum until 1961, opened their privately financed stadium in Chavez Ravine in 1962 (the article gives no day). Ground had been broken on 17 September 1959.", sources: [wp-dodger-stadium, wp-chavez-ravine, wp-norris-poulson]}
  - {key: watts-riots, name: Watts riots, type: Riot, date: 1965-08-11, end_year: 1965, place: watts,
     people: [{person: sam-yorty, role: mayor}], prominence: 4,
     note: "Began with the arrest of Marquette Frye on 11 August; six days of rioting against police abuse and discrimination left 34 dead and over $40 million of damage. Nearly 14,000 National Guard troops were sent in. End date disputed (see discrepancy).", sources: [wp-watts-riots, wp-sam-yorty]}
  - {key: 1984-summer-olympics, name: 1984 Summer Olympics, type: Olympic Games, date: 1984-07-28, end_year: 1984, place: los-angeles-memorial-coliseum,
     people: [{person: tom-bradley, role: mayor}], prominence: 4,
     note: "28 July to 12 August 1984, opened by President Reagan and boycotted by 14 Eastern Bloc countries. Privately funded, it made a profit of $232.5 million, the most financially successful modern Games.", sources: [wp-1984-summer-olympics, wp-tom-bradley]}
  - {key: 1992-los-angeles-riots, name: 1992 Los Angeles riots, type: Riot, date: 1992-04-29, end_year: 1992, place: los-angeles,
     people: [{person: tom-bradley, role: declared a state of emergency}], prominence: 5,
     note: "29 April to 3 May 1992, after a jury acquitted four LAPD officers of beating Rodney King. 55 people died, more than 12,000 were arrested and damage passed $1 billion, the most destructive local unrest in US history; Koreatown was disproportionately damaged.", sources: [wp-1992-los-angeles-riots]}
  - {key: 1994-northridge-earthquake, name: Northridge earthquake, type: Earthquake, date: 1994-01-17, place: northridge, prominence: 4,
     note: "Magnitude 6.7, at 4:30 a.m. beneath the San Fernando Valley. Sixty people died and freeways collapsed; damage was $13-50 billion, among the costliest US natural disasters.", sources: [wp-1994-northridge-earthquake]}
  - {key: january-2025-los-angeles-wildfires, name: January 2025 Los Angeles wildfires, type: Wildfire, date: 2025-01-07, end_year: 2025, place: pacific-palisades,
     people: [{person: karen-bass, role: mayor}], prominence: 4,
     note: "7-31 January 2025: fourteen wildfires driven by Santa Ana winds, chiefly the Palisades Fire and the Eaton Fire in Altadena, killed at least 31 people and destroyed more than 18,000 homes and buildings. Mayor Bass was in Ghana when they began.", sources: [wp-january-2025-southern-california-wildfires, wp-karen-bass]}

