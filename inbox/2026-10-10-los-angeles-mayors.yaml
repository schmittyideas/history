people:
  # Mayors, in order of first term.
  - {key: frederick-eaton, name: Frederick Eaton, type: Government, realm: Los Angeles, born: 1856, died: 1934-03-11, prominence: 3,
     coverage: partly, coverage_note: "Mayoralty, aqueduct and St. Francis Dam story; Pershing Square redesign and early railway work not captured",
     note: "Mayor 1898-1900. Self-taught engineer who hired Mulholland in 1878; the political mastermind of the Los Angeles Aqueduct, who quietly bought Owens Valley land and water rights. His demand for a million dollars for his Round Valley land pushed Mulholland to build the St. Francis Dam instead.", sources: [wp-frederick-eaton]}
  - {key: meredith-p-snyder, name: Meredith P. Snyder, type: Government, realm: Los Angeles, born: 1859-10-22, died: 1937-04-07, prominence: 2,
     coverage: partly, coverage_note: "Life dates and three terms; business career and the 1907 police charge not captured",
     note: "'Pinky' Snyder, mayor three times (1896-98, 1900-04, 1919-21). Made the water system municipal and appointed the first Water Commission, which planned to bring water from the Owens Valley.", sources: [wp-meredith-p-snyder]}
  - {key: owen-mcaleer, name: Owen McAleer, type: Government, realm: Los Angeles, born: 1858-02-03, died: 1944-03-07, prominence: 1,
     coverage: complete,
     note: "Mayor 1904-1906. Iron-works man who built the first steam boiler in Los Angeles; on the committee that took the first land options in the Owens Valley. Opened the city's first municipal playground.", sources: [wp-owen-mcaleer]}
  - {key: arthur-c-harper, name: Arthur C. Harper, type: Government, realm: Los Angeles, born: 1866, died: 1948-12-25, prominence: 2,
     coverage: complete,
     note: "Mayor 1906-1909. His corrupt administration provoked what the article calls the first recall movement in American history; he resigned on 11 March 1909 before the vote. Began work on the Civic Center.", sources: [wp-arthur-c-harper, wp-list-of-mayors-of-los-angeles]}
  - {key: niles-pease, name: Niles Pease, type: Government, realm: Los Angeles, born: 1838, died: 1921-09-21, prominence: 1,
     coverage: complete,
     note: "Furniture businessman and City Council president who was acting mayor for four days after Harper resigned (11-15 March 1909).", sources: [wp-niles-pease, wp-list-of-mayors-of-los-angeles]}
  - {key: william-d-stephens, name: William D. Stephens, type: Government, realm: Los Angeles, born: 1859-12-26, died: 1944-04-25, prominence: 2,
     coverage: partly, coverage_note: "Mayoralty and life dates; his terms in Congress and as Governor of California (1917-1923) are only in the note",
     note: "Appointed mayor for eleven days in March 1909 after Harper resigned. Later a Progressive congressman and the 24th Governor of California (1917-1923). Had worked with Mulholland on the aqueduct's advisory committee.", sources: [wp-william-d-stephens]}
  - {key: george-alexander-mayor, name: George Alexander, type: Government, realm: Los Angeles, born: 1839-09-21, died: 1923-08-02, prominence: 2,
     coverage: complete,
     note: "Glasgow-born grain merchant and county supervisor; mayor 1909-1913, the first under the 1909 charter that made the office nonpartisan.", sources: [wp-george-alexander-mayor, wp-mayor-of-los-angeles]}
  - {key: henry-h-rose, name: Henry H. Rose, type: Government, realm: Los Angeles, born: 1856-11-27, died: 1923-07-21, prominence: 2,
     coverage: complete,
     note: "Mayor 1913-1915; presided over the opening of the Owens Valley aqueduct. A crack pistol shot.", sources: [wp-henry-h-rose]}
  - {key: charles-e-sebastian, name: Charles E. Sebastian, type: Government, realm: Los Angeles, born: 1873-03-30, died: 1929-04-17, prominence: 1,
     coverage: complete,
     note: "Police chief (1911-1915), then mayor 1915-1916, when most of the San Fernando Valley and the West Side were annexed. Resigned in scandal on 2 September 1916.", sources: [wp-charles-e-sebastian, wp-list-of-mayors-of-los-angeles]}
  - {key: martin-f-betkouski, name: Martin F. Betkouski, type: Government, realm: Los Angeles, born: 1860, died: 1942, prominence: 1,
     coverage: complete,
     note: "City Council member 1909-1917 who was acting mayor for three days after Sebastian resigned (2-5 September 1916). A 1917 grand jury accused him of profiting from land deals on the future Union Station site; the charge was dropped. Died shortly before 8 May 1942.", sources: [wp-martin-f-betkouski, wp-list-of-mayors-of-los-angeles]}
  - {key: frederic-t-woodman, name: Frederic T. Woodman, type: Government, realm: Los Angeles, born: 1872-06-28, died: 1949-03-25, prominence: 1,
     coverage: complete,
     note: "Harbor commissioner appointed mayor after Sebastian resigned (1916-1919); indicted for bribery in 1919, acquitted, but lost the election to Snyder.", sources: [wp-frederic-t-woodman]}
  - {key: george-e-cryer, name: George E. Cryer, type: Government, realm: Los Angeles, born: 1875-05-13, died: 1961-05-24, prominence: 3,
     coverage: partly, coverage_note: "Mayoralty, public works and the St. Francis Dam response; the corruption allegations and Shuler libel case not captured",
     note: "Mayor 1921-1929, when the city passed a million people. City Hall, the Central Library and the Coliseum were built; he accepted the city's responsibility for the St. Francis Dam disaster and helped win the 1932 Olympics.", sources: [wp-george-e-cryer]}
  - {key: john-c-porter, name: John C. Porter, type: Government, realm: Los Angeles, born: 1871-04-04, died: 1959-05-27, prominence: 1,
     coverage: complete,
     note: "Mayor 1929-1933, a former Ku Klux Klan member; survived a recall election in 1932, the Olympic year.", sources: [wp-john-c-porter]}
  - {key: frank-l-shaw, name: Frank L. Shaw, type: Government, realm: Los Angeles, born: 1877-02-01, died: 1958-01-24, prominence: 2,
     coverage: partly, coverage_note: "Mayoralty and recall; the citizenship and estate lawsuits not captured",
     note: "Mayor 1933-1938; Union Station was built in his term. His administration was among the most corrupt in the city's history, and in 1938 he became the first mayor of a major American city to be recalled.", sources: [wp-frank-l-shaw]}
  - {key: fletcher-bowron, name: Fletcher Bowron, type: Government, realm: Los Angeles, born: 1887-08-13, died: 1968-09-11, prominence: 3,
     coverage: partly, coverage_note: "Mayoralty, wartime role and death; judicial career only in outline",
     note: "Reform judge elected in the 1938 recall; mayor until 1953. Cleaned up the police, began LAX and the first freeways, and pressed for the removal and internment of Japanese Americans in 1942. Lost to Poulson over public housing.", sources: [wp-fletcher-bowron]}
  - {key: norris-poulson, name: Norris Poulson, type: Government, realm: Los Angeles, born: 1895-07-23, died: 1982-09-25, prominence: 3,
     coverage: partly, coverage_note: "Mayoralty and the Dodgers; Assembly and congressional career only in outline",
     note: "Mayor 1953-1961. Killed the Chavez Ravine public-housing plan and led the drive that brought the Brooklyn Dodgers to Los Angeles. Told Khrushchev in 1959, 'You shall not bury us'.", sources: [wp-norris-poulson]}
  - {key: sam-yorty, name: Sam Yorty, type: Government, realm: Los Angeles, born: 1909-10-01, died: 1998-06-05, prominence: 3,
     coverage: partly, coverage_note: "Mayoralty and the Watts riots; Assembly, Congress and Senate races only in outline",
     note: "Populist mayor 1961-1973; criticised over the Watts riots of 1965. A Democrat for almost all his career, he became a Republican in 1973.", sources: [wp-sam-yorty]}
  - {key: tom-bradley, name: Tom Bradley, type: Government, realm: Los Angeles, born: 1917-12-29, died: 1998-09-29, prominence: 4,
     coverage: partly, coverage_note: "Mayoralty, 1984 Olympics and 1992 riots; governor races and policing battles only in outline",
     note: "Son of Texas sharecroppers, LAPD officer, then mayor 1973-1993: the city's first black mayor and its longest-serving. Ran the first profitable Summer Olympics (1984) and started Metro Rail (1990); declared a state of emergency in the 1992 riots.", sources: [wp-tom-bradley]}
  - {key: richard-riordan, name: Richard Riordan, type: Government, realm: Los Angeles, born: 1930-05-01, died: 2023-04-19, prominence: 2,
     coverage: partly, coverage_note: "Mayoralty and life dates; business career only in outline",
     note: "Businessman and the most recent Republican mayor (1993-2001), term-limited by the initiative he championed. Mayor during the Northridge earthquake (1994).", sources: [wp-richard-riordan, wp-list-of-mayors-of-los-angeles]}
  - {key: james-hahn, name: James Hahn, type: Government, realm: Los Angeles, born: 1950-07-03, prominence: 2,
     coverage: partly, coverage_note: "Mayoralty; later judicial career only in outline",
     note: "Mayor 2001-2005, the only person elected to all three citywide offices. Defeated the San Fernando Valley and Hollywood secession votes and appointed police chief Bill Bratton.", sources: [wp-james-hahn]}
  - {key: antonio-villaraigosa, name: Antonio Villaraigosa, type: Government, realm: Los Angeles, born: 1953-01-23, prominence: 2,
     coverage: partly, coverage_note: "Mayoralty; Assembly speakership and governor races only in outline",
     note: "Former Speaker of the California State Assembly; mayor 2005-2013, the city's first Latino mayor since the 19th century. Expanded the LAPD to its largest size.", sources: [wp-antonio-villaraigosa, wp-list-of-mayors-of-los-angeles]}
  - {key: eric-garcetti, name: Eric Garcetti, type: Government, realm: Los Angeles, born: 1971-02-04, prominence: 2,
     coverage: partly, coverage_note: "Mayoralty and Olympic bid; ambassadorship (India, 2023-2025) only in the note",
     note: "Mayor 2013-2022, the city's first elected Jewish mayor; led the bid that brought Los Angeles the 2028 Summer Olympics. United States Ambassador to India 2023-2025.", sources: [wp-eric-garcetti]}
  - {key: karen-bass, name: Karen Bass, type: Government, realm: Los Angeles, born: 1953-10-03, prominence: 3,
     coverage: partly, coverage_note: "Mayoralty, January 2025 fires and 2026 election status; Assembly and Congress careers only in outline",
     note: "Mayor since 12 December 2022, the first woman to hold the office. Earlier Speaker of the California State Assembly (the first African-American woman to lead a US state legislative chamber) and a congresswoman. Faced criticism over the January 2025 fires. In the June 2026 primary she came first (34.27%); she faces Nithya Raman on 3 November 2026.", sources: [wp-karen-bass, wp-2026-los-angeles-mayoral-election]}
  # Others central to the story
  - {key: william-mulholland, name: William Mulholland, type: Government, roles: [engineer], born: 1855-09-11, died: 1935-07-22, prominence: 4,
     coverage: partly, coverage_note: "Aqueduct and St. Francis Dam; early life and later consulting work only in outline",
     note: "Belfast-born, self-taught engineer who rose from ditch-tender to chief of the city's water bureau and built the 233-mile Los Angeles Aqueduct (1907-1913). His career ended when his St. Francis Dam failed in 1928; he took full responsibility. Mulholland Drive is named after him.", sources: [wp-william-mulholland]}
  - {key: john-parkinson-architect, name: John Parkinson, type: Artist, roles: [architect], born: 1861-12-12, died: 1935-12-09, prominence: 3,
     coverage: partly, coverage_note: "The Los Angeles civic buildings; Seattle and commercial works not built out",
     note: "Lancashire-born architect who settled in Los Angeles in 1894; with his son Donald (from 1920) designed City Hall, the Memorial Coliseum and Union Station. Designed the city's first skyscraper, the Braly Block (1904).", sources: [wp-john-and-donald-parkinson]}

