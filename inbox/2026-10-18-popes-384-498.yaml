people:
  - {key: amadeus-viii-of-savoy, sitelinks: 49, sitelinks_on: 2026-10-18}
  - {key: siricius, name: "Siricius", type: Clergy, roles: [pope], born: 334, born_estimated: true, died: 0399-11-26, realm: Papacy, prominence: 2, sitelinks: 77, sitelinks_on: 2026-10-18,
     note: "His Directa decretal to Himerius of Tarragona is the oldest fully preserved papal decretal; perhaps the first bishop of Rome to call himself 'pope'.",
     sources: [wp-siricius]}
  - {key: anastasius-i, name: "Anastasius I", type: Clergy, roles: [pope], realm: Papacy, prominence: 1, sitelinks: 76, sitelinks_on: 2026-10-18,
     note: "A Roman, son of Maximus; condemned the writings of Origen after their translation into Latin (400).",
     sources: [wp-anastasius-i]}
  - {key: innocent-i, name: "Innocent I", type: Clergy, roles: [pope], died: 0417-03-12, realm: Papacy, prominence: 2, sitelinks: 79, sitelinks_on: 2026-10-18,
     note: "Acted as arbiter of church disputes East and West from the start of his pontificate; in his time the Visigoths under Alaric sacked Rome (410).",
     sources: [wp-innocent-i]}
  - {key: zosimus, name: "Zosimus", type: Clergy, roles: [pope], realm: Papacy, prominence: 1, sitelinks: 78, sitelinks_on: 2026-10-18,
     note: "Of Greek descent; took a fractious part in the dispute between the sees of Arles and Vienne, deciding for Arles.",
     sources: [wp-zosimus]}
  - {key: boniface-i, name: "Boniface I", type: Clergy, roles: [pope], realm: Papacy, prominence: 1, sitelinks: 77, sitelinks_on: 2026-10-18,
     note: "His election was contested by Eulalius until Emperor Honorius settled it in his favour (419); upheld church discipline.",
     sources: [wp-boniface-i]}
  - {key: celestine-i, name: "Celestine I", type: Clergy, roles: [pope], born: 359, born_estimated: true, died: 0432-07-27, realm: Papacy, prominence: 2, sitelinks: 79, sitelinks_on: 2026-10-18,
     note: "Spent his pontificate against heresies; delegated to Cyril of Alexandria the condemnation of Nestorius, confirmed at the Council of Ephesus (431).",
     sources: [wp-celestine-i]}
  - {key: sixtus-iii, name: "Sixtus III", type: Clergy, roles: [pope], realm: Papacy, prominence: 1, sitelinks: 78, sitelinks_on: 2026-10-18,
     note: "A Roman whose pontificate (432-440) saw a burst of building in Rome.",
     sources: [wp-sixtus-iii]}
  - {key: leo-i, name: "Leo I", type: Clergy, roles: [pope], born: 391, born_estimated: true, died: 0461-11-10, realm: Papacy, prominence: 5, sitelinks: 95, sitelinks_on: 2026-10-18,
     note: "Leo the Great, a Roman aristocrat who grounded papal authority on the succession from Peter; best known for meeting Attila the Hun in 452 and persuading him to turn back from Italy.",
     sources: [wp-leo-i]}
  - {key: hilarius, name: "Hilarius", type: Clergy, roles: [pope], died: 0468-02-29, realm: Papacy, prominence: 1, sitelinks: 72, sitelinks_on: 2026-10-18,
     note: "A Sardinian; as Leo I's legate at the Second Council of Ephesus (449) he opposed Flavian's condemnation and escaped Dioscorus of Alexandria.",
     sources: [wp-hilarius]}
  - {key: simplicius, name: "Simplicius", type: Clergy, roles: [pope], died: 0483-03-10, realm: Papacy, prominence: 2, sitelinks: 77, sitelinks_on: 2026-10-18,
     note: "From Tibur (Tivoli); pope 468-483, when Odoacer deposed the last Western emperor, Romulus Augustulus (476). Fought the Eutychian heresy.",
     sources: [wp-simplicius]}
  - {key: felix-iii, name: "Felix III", type: Clergy, roles: [pope], died: 0492-03-01, realm: Papacy, prominence: 1, sitelinks: 76, sitelinks_on: 2026-10-18,
     note: "His rejection of the Henotikon began the Acacian schism with Constantinople; great-great-grandfather of Gregory the Great. Sometimes numbered Felix II.",
     sources: [wp-felix-iii]}
  - {key: gelasius-i, name: "Gelasius I", type: Clergy, roles: [pope], realm: Papacy, prominence: 2, sitelinks: 84, sitelinks_on: 2026-10-18,
     note: "Of Berber descent, the last pope born in Africa; a prolific writer on the cusp of late antiquity whose letter Duo sunt (494) to Emperor Anastasius set out the relation of Church and state.",
     sources: [wp-gelasius-i]}
  - {key: anastasius-ii, name: "Anastasius II", type: Clergy, roles: [pope], died: 0498-11-19, realm: Papacy, prominence: 1, sitelinks: 78, sitelinks_on: 2026-10-18,
     note: "A Roman, son of a priest; his efforts to end the Acacian schism led instead to the Laurentian schism after his death. Buried in St Peter's.",
     sources: [wp-anastasius-ii]}
  - {key: eulalius-antipope, name: "Eulalius (antipope)", type: Clergy, roles: [antipope], died: 423, realm: Papacy, prominence: 1, sitelinks: 30, sitelinks_on: 2026-10-18,
     note: "Elected in a double election with Boniface I (418); lost when Emperor Honorius decided for Boniface, and became bishop of Nepete (Napete).",
     sources: [wp-eulalius-antipope]}

