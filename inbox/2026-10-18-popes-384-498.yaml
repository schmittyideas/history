# The Papacy, 384-498 (the late Roman Empire): the 13 popes from Siricius to Anastasius II, the antipope Eulalius
# (418-419), and the age's events: the Sack of Rome (410), the Councils of Ephesus (431) and Chalcedon (451), Leo I's
# meeting with Attila (452) and the deposition of Romulus Augustulus (476). With this batch every pope on the official
# list, and every antipope in Wikipedia's Antipope table, is in the database.
# Conventions and checks as the earlier Papacy batches (inbox/2026-10-18-popes-*.yaml).
# Also a fix: Amadeus VIII of Savoy (Felix V, added in inbox/2026-10-18-popes-antipopes-1328-1449.yaml) was given 0
# sitelinks because his article title is a redirect; Wikidata gives 49 (read 2026-10-18).
# Stated honestly: Leo I's and Gelasius I's birthplaces ("Etruria", "Africa") and Hilarius's (Sardinia) are regions and
# are left in the notes. The Council of Chalcedon has no place record (Chalcedon is today Kadıköy, Istanbul).
batch:
  title: "The Papacy, 384-498"
  requested: "Do we have all popes? Get them all, with the disputed ones (antipopes) marked disputed"
  date: 2026-10-18

