people:
- key: catharina-van-hemessen
  name: Catharina van Hemessen
  type: Artist
  roles:
  - painter
  born: 1528
  died: 1565
  died_estimated: true
  prominence: 3
  note: Flemish Renaissance painter, the earliest female Flemish painter with verifiable surviving work, known for small portraits of women and a 1548 self-portrait at an easel.
  image_url: https://upload.wikimedia.org/wikipedia/commons/b/b5/Hemessen-Selbstbildnis.jpg
  image_thumb: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b5/Hemessen-Selbstbildnis.jpg/500px-Hemessen-Selbstbildnis.jpg
  image_page: https://commons.wikimedia.org/wiki/File:Hemessen-Selbstbildnis.jpg
  image_license: Public domain
  coverage: partly
  coverage_note: Dates, places and the 1548 self-portrait captured; her other surviving portraits and religious works not listed. Patron Maria of Austria and father Jan Sanders van Hemessen are not yet
    in the database.
  sources:
  - wp-catharina-van-hemessen
- key: cornelis-van-haarlem
  name: Cornelis van Haarlem
  type: Artist
  roles:
  - painter
  - draughtsman
  born: 1562
  died: '1638-11-11'
  prominence: 3
  note: Dutch Golden Age painter and draughtsman, a leading Northern Mannerist of the Haarlem Mannerists and a forerunner of Frans Hals as a portraitist.
  image_url: https://upload.wikimedia.org/wikipedia/commons/5/50/Cornelis_van_Haarlem_Self-portrait_06112012_2.jpg
  image_thumb: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/Cornelis_van_Haarlem_Self-portrait_06112012_2.jpg/500px-Cornelis_van_Haarlem_Self-portrait_06112012_2.jpg
  image_page: https://commons.wikimedia.org/wiki/File:Cornelis_van_Haarlem_Self-portrait_06112012_2.jpg
  image_license: CC0
  coverage: partly
  coverage_note: Dates, training, the Haarlem Academy circle and pupils captured; individual works not built out (article gives no dated work with a clear year).
  sources:
  - wp-cornelis-van-haarlem
- key: bartholomeus-van-der-helst
  name: Bartholomeus van der Helst
  type: Artist
  roles:
  - painter
  born: 1613
  born_estimated: true
  died: 1670
  prominence: 4
  note: Dutch Golden Age portrait painter, the most popular portraitist of Amsterdam in the mid 17th century, known for group portraits of civic guards.
  image_url: https://upload.wikimedia.org/wikipedia/commons/5/58/Bartholomeus_van_der_Helst_self_portrait_1667_cropped.jpg
  image_thumb: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/58/Bartholomeus_van_der_Helst_self_portrait_1667_cropped.jpg/500px-Bartholomeus_van_der_Helst_self_portrait_1667_cropped.jpg
  image_page: https://commons.wikimedia.org/wiki/File:Bartholomeus_van_der_Helst_self_portrait_1667_cropped.jpg
  image_license: Public domain
  coverage: partly
  coverage_note: Dates, places and two key works captured; other portraits, genre scenes and collaborations not listed.
  sources:
  - wp-bartholomeus-van-der-helst
- key: willem-van-de-velde-the-younger
  name: Willem van de Velde the Younger
  type: Artist
  roles:
  - painter
  born: 1633
  died: '1707-04-06'
  prominence: 4
  note: Dutch marine painter who moved to England with his father and worked for Charles II.
  image_url: https://upload.wikimedia.org/wikipedia/commons/b/be/Willem_van_de_Velde_II_%281633-1707%29_-_%28by_Lodewijk_van_der_Helst%2C_1672%29.jpg
  image_thumb: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/be/Willem_van_de_Velde_II_%281633-1707%29_-_%28by_Lodewijk_van_der_Helst%2C_1672%29.jpg/500px-Willem_van_de_Velde_II_%281633-1707%29_-_%28by_Lodewijk_van_der_Helst%2C_1672%29.jpg
